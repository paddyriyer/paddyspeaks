<svg baseProfile="full" height="1000px" version="1.1" viewBox="0 0 1900 1000" width="1900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow-blue" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="6"><path d="M 1,1 L 12,6 L 1,11 Z" fill="#146AA4" /></marker><marker id="arrow-teal" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="6"><path d="M 1,1 L 12,6 L 1,11 Z" fill="#087C76" /></marker><marker id="arrow-red" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="6"><path d="M 1,1 L 12,6 L 1,11 Z" fill="#AC3A4A" /></marker><marker id="arrow-amber" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="6"><path d="M 1,1 L 12,6 L 1,11 Z" fill="#9A6320" /></marker><marker id="arrow-slate" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="6"><path d="M 1,1 L 12,6 L 1,11 Z" fill="#5B7084" /></marker></defs><rect fill="#FFFFFF" height="1000" width="1900" x="0" y="0" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2" x="70" y="51">IDENTITY &amp; CRYPTOGRAPHY / 02</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" x="70" y="102">An Apple Account is not a decryption key</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="22" x="70" y="145">Three different relationships: item ownership, protected key access, and explicit sharing.</text><line stroke="#CFDAE3" stroke-width="2" x1="70" x2="1830" y1="163" y2="163" /><rect fill="#F8FAFC" fill-opacity="0.35" height="205" rx="17" ry="17" stroke="#CFDAE3" stroke-width="2" width="1770" x="65" y="194" /><text fill="#738394" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" x="87" y="231">A  ACCOUNT + ITEM REGISTRATION</text><rect fill="#EBF7F4" fill-opacity="0.35" height="204" rx="17" ry="17" stroke="#CFDAE3" stroke-width="2" width="1770" x="65" y="412" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" x="87" y="449">B  END-TO-END PROTECTED KEY ACCESS</text><rect fill="#FFF6E9" fill-opacity="0.35" height="240" rx="17" ry="17" stroke="#CFDAE3" stroke-width="2" width="1770" x="65" y="629" /><text fill="#9A6320" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" x="87" y="666">C  OPTIONAL SHARING PERMISSIONS</text><rect fill="#F0F7FD" height="130" rx="12" ry="12" stroke="#146AA4" stroke-width="2.5" width="350" x="106" y="246" /><rect fill="#146AA4" height="130" rx="3" ry="3" width="7" x="106" y="246" /><text fill="#146AA4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="131" y="277">IDENTITY</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="131" y="312">Apple Account</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="131" y="341">Account sign-in + verification</text><rect fill="#F0F7FD" height="130" rx="12" ry="12" stroke="#146AA4" stroke-width="2.5" width="350" x="660" y="246" /><rect fill="#146AA4" height="130" rx="3" ry="3" width="7" x="660" y="246" /><text fill="#146AA4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="685" y="277">REGISTRATION</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="685" y="312">Ownership record</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="685" y="341">Tag associated with account</text><rect fill="#EBF7F4" height="130" rx="12" ry="12" stroke="#087C76" stroke-width="2.5" width="420" x="1215" y="246" /><rect fill="#087C76" height="130" rx="3" ry="3" width="7" x="1215" y="246" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="1240" y="277">PHYSICAL ITEM</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="1240" y="312">Registered AirTag</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="1240" y="341">Not bound forever to one phone</text><path d="M 456,311 L 650,311" fill="none" marker-end="url(#arrow-teal)" stroke="#087C76" stroke-dasharray="9,8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><path d="M 1010,311 L 1205,311" fill="none" marker-end="url(#arrow-teal)" stroke="#087C76" stroke-dasharray="9,8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><rect fill="#FFFFFF" height="28" rx="8" ry="8" stroke="#DFE6EB" stroke-width="1" width="187.24" x="464.38" y="264" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="558" y="284">account binds item</text><rect fill="#FFFFFF" height="28" rx="8" ry="8" stroke="#DFE6EB" stroke-width="1" width="150.52" x="1036.74" y="264" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="1112" y="284">ownership link</text><rect fill="#EBF7F4" height="130" rx="12" ry="12" stroke="#087C76" stroke-width="2.5" width="350" x="106" y="468" /><rect fill="#087C76" height="130" rx="3" ry="3" width="7" x="106" y="468" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="131" y="499">KEY SOURCE</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="131" y="534">Device-created keys</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="131" y="563">Private key / secret material</text><rect fill="#EBF7F4" height="130" rx="12" ry="12" stroke="#087C76" stroke-width="2.5" width="350" x="660" y="468" /><rect fill="#087C76" height="130" rx="3" ry="3" width="7" x="660" y="468" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="685" y="499">PROTECTED SERVICE</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="685" y="534">E2EE key sync</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="685" y="563">Encrypted synchronization</text><rect fill="#EBF7F4" height="130" rx="12" ry="12" stroke="#087C76" stroke-width="2.5" width="420" x="1215" y="468" /><rect fill="#087C76" height="130" rx="3" ry="3" width="7" x="1215" y="468" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="1240" y="499">AUTHORIZED DEVICES</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="1240" y="534">Owner iPhone / Mac / iPad</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="1240" y="563">Eligible devices obtain key access</text><path d="M 456,533 L 650,533" fill="none" marker-end="url(#arrow-teal)" stroke="#087C76" stroke-dasharray="9,8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><path d="M 1010,533 L 1205,533" fill="none" marker-end="url(#arrow-teal)" stroke="#087C76" stroke-dasharray="9,8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><rect fill="#FFFFFF" height="28" rx="8" ry="8" stroke="#DFE6EB" stroke-width="1" width="150.52" x="481.74" y="488" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="557" y="508">encrypted sync</text><rect fill="#FFFFFF" height="28" rx="8" ry="8" stroke="#DFE6EB" stroke-width="1" width="187.24" x="1021.38" y="488" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="1115" y="508">protected delivery</text><rect fill="#FFF6E9" height="138" rx="12" ry="12" stroke="#9A6320" stroke-width="2.5" width="350" x="106" y="686" /><rect fill="#9A6320" height="138" rx="3" ry="3" width="7" x="106" y="686" /><text fill="#9A6320" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="131" y="717">USER ACTION</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="131" y="752">Owner chooses to share</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="131" y="781">Share an item deliberately</text><rect fill="#FFF6E9" height="138" rx="12" ry="12" stroke="#9A6320" stroke-width="2.5" width="350" x="660" y="686" /><rect fill="#9A6320" height="138" rx="3" ry="3" width="7" x="660" y="686" /><text fill="#9A6320" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="685" y="717">PERMISSIONS</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="685" y="752">Item sharing control</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="685" y="781">Can grant / revoke access</text><rect fill="#FFF6E9" height="138" rx="12" ry="12" stroke="#9A6320" stroke-width="2.5" width="420" x="1215" y="686" /><rect fill="#9A6320" height="138" rx="3" ry="3" width="7" x="1215" y="686" /><text fill="#9A6320" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="1240" y="717">RECIPIENT</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="1240" y="752">Invited Apple Account</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="1240" y="781">May access shared item location</text><path d="M 456,757 L 650,757" fill="none" marker-end="url(#arrow-teal)" stroke="#087C76" stroke-dasharray="9,8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><path d="M 1010,757 L 1205,757" fill="none" marker-end="url(#arrow-teal)" stroke="#087C76" stroke-dasharray="9,8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><rect fill="#FFFFFF" height="28" rx="8" ry="8" stroke="#DFE6EB" stroke-width="1" width="150.52" x="481.74" y="714" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="557" y="734">explicit grant</text><rect fill="#FFFFFF" height="28" rx="8" ry="8" stroke="#DFE6EB" stroke-width="1" width="187.24" x="1016.38" y="714" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="1110" y="734">authorized sharing</text><line stroke="#CFDAE3" stroke-width="2" x1="70" x2="1830" y1="919" y2="919" /><path d="M 90,946 L 141,946" fill="none" marker-end="url(#arrow-blue)" stroke="#146AA4" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><text fill="#738394" font-family="Arial, Helvetica, sans-serif" font-size="18" x="162" y="954">Signal / data flow</text><path d="M 445,946 L 496,946" fill="none" marker-end="url(#arrow-teal)" stroke="#087C76" stroke-dasharray="9,8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><text fill="#738394" font-family="Arial, Helvetica, sans-serif" font-size="18" x="517" y="954">Authorization / control</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="end" x="1830" y="955">Conceptual relationship diagram · exact key-sharing internals may vary</text></svg>