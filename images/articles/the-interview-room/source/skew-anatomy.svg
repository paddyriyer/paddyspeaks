ration Mono,monospace" font-size="12" font-weight="400" fill="#48505C" style="">27.5%</text><line x1="66" y1="460" x2="522" y2="460" stroke="#E7E2D6" stroke-width="1" stroke-linecap="butt"/><text x="66" y="482" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#A6322A" style="">70% of the join key is three values that mean “we didn’t know”.</text><rect x="568" y="174" width="426" height="330" rx="6" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><text x="588" y="204" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="500" fill="#B0821F" letter-spacing="1.4" style="">WHAT I ASK BEFORE I TOUCH A CONFIG</text><circle cx="596" cy="241" r="3" fill="#B0821F"/><text x="612" y="246" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#14181F" style="">Which column is the join / group key?</text><circle cx="596" cy="274" r="3" fill="#B0821F"/><text x="612" y="279" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#14181F" style="">What is the top-20 key frequency?</text><circle cx="596" cy="307" r="3" fill="#B0821F"/><text x="612" y="312" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#14181F" style="">Are nulls and sentinels being joined?</text><circle cx="596" cy="340" r="3" fill="#B0821F"/><text x="612" y="345" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#14181F" style="">Is the key low-cardinality by design?</text><circle cx="596" cy="373" r="3" fill="#B0821F"/><text x="612" y="378" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#14181F" style="">Is one side exploding the row count?</text><circle cx="596" cy="406" r="3" fill="#B0821F"/><text x="612" y="411" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#14181F" style="">Is the partition column also the skewed key?</text><circle cx="596" cy="439" r="3" fill="#B0821F"/><text x="612" y="444" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#14181F" style="">Did the distribution change, or did the code?</text><line x1="588" y1="460" x2="974" y2="460" stroke="#E7E2D6" stroke-width="1" stroke-linecap="butt"/><text x="588" y="482" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#2E6B4E" style="">None of these are settings. All of them are evidence.</text><text x="46" y="544" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="500" fill="#8B929E" letter-spacing="1.6" style="">REMEDIES — none of which is a first move</text><rect x="46.0" y="562" width="148.0" height="84" rx="5" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><rect x="46.0" y="562" width="148.0" height="3" rx="0" fill="#2C5570"/><text x="58.0" y="588" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#14181F" style="">Filter the junk</text><text x="58.0" y="605" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#14181F" style="">keys</text><text x="58.0" y="624" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="11.5" font-weight="400" fill="#8B929E" style="">cheapest, if the rows</text><text x="58.0" y="639" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="11.5" font-weight="400" fill="#8B929E" style="">are meaningless</text><rect x="206.0" y="562" width="148.0" height="84" rx="5" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><rect x="206.0" y="562" width="148.0" height="3" rx="0" fill="#2C5570"/><text x="218.0" y="588" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#14181F" style="">Pre-aggregate</text><text x="218.0" y="624" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="11.5" font-weight="400" fill="#8B929E" style="">shrink before you</text><text x="218.0" y="639" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="11.5" font-weight="400" fill="#8B929E" style="">shuffle</text><rect x="366.0" y="562" width="148.0" height="84" rx="5" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><rect x="366.0" y="562" width="148.0" height="3" rx="0" fill="#2C5570"/><text x="378.0" y="588" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#14181F" style="">Broadcast the</text><text x="378.0" y="605" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#14181F" style="">small side</text><text x="378.0" y="624" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="11.5" font-weight="400" fill="#8B929E" style="">if it really is small</text><rect x="526.0" y="562" width="148.0" height="84" rx="5" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><rect x="526.0" y="562" width="148.0" height="3" rx="0" fill="#B0821F"/><text x="538.0" y="588" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#14181F" style="">AQE skew join</text><text x="538.0" y="624" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="11.5" font-weight="400" fill="#8B929E" style="">splits the big</text><text x="538.0" y="639" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="11.5" font-weight="400" fill="#8B929E" style="">partition for you</text><rect x="686.0" y="562" width="148.0" height="84" rx="5" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><rect x="