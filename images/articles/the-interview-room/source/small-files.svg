<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="716" viewBox="0 0 1040 716"><rect x="0" y="0" width="1040" height="716" rx="0" fill="#F4F1EA"/><rect x="0.75" y="0.75" width="1038.5" height="714.5" rx="0" fill="none" stroke="#D6D0C2" stroke-width="1.5"/><text x="46" y="32" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="500" fill="#B0821F" letter-spacing="2.6" style="">ACT X — THE CUSTOMER SAYS THE TABLE GOT SLOW</text><text x="46" y="68" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#14181F" style="">Five billion rows is not the problem</text><text x="46" y="96" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="16.5" font-weight="400" fill="#48505C" style="">2.2 million files is the problem. And the writer that makes more of them every hour.</text><line x1="46" y1="116" x2="994" y2="116" stroke="#D6D0C2" stroke-width="1.2" stroke-linecap="butt"/><rect x="46" y="176" width="420" height="316" rx="6" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><text x="66" y="208" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="500" fill="#2C5570" letter-spacing="1.8" style="">TABLE PROFILE</text><text x="66" y="252" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">Rows</text><text x="446" y="252" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="14.5" font-weight="500" fill="#14181F" text-anchor="end" style="">5,010,442,118</text><line x1="66" y1="264" x2="446" y2="264" stroke="#E7E2D6" stroke-width="1" stroke-linecap="butt"/><text x="66" y="288" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">Files</text><text x="446" y="288" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="14.5" font-weight="500" fill="#A6322A" text-anchor="end" style="">2,214,907</text><line x1="66" y1="300" x2="446" y2="300" stroke="#E7E2D6" stroke-width="1" stroke-linecap="butt"/><text x="66" y="324" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">Average file size</text><text x="446" y="324" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="14.5" font-weight="500" fill="#A6322A" text-anchor="end" style="">95 KB</text><line x1="66" y1="336" x2="446" y2="336" stroke="#E7E2D6" stroke-width="1" stroke-linecap="butt"/><text x="66" y="360" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">Target file size</text><text x="446" y="360" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="14.5" font-weight="500" fill="#2E6B4E" text-anchor="end" style="">128–512 MB</text><line x1="66" y1="372" x2="446" y2="372" stroke="#E7E2D6" stroke-width="1" stroke-linecap="butt"/><text x="66" y="396" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">Partitions on disk</text><text x="446" y="396" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="14.5" font-weight="500" fill="#B0821F" text-anchor="end" style="">18,240 (event_hour)</text><line x1="66" y1="408" x2="446" y2="408" stroke="#E7E2D6" stroke-width="1" stroke-linecap="butt"/><text x="66" y="432" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">Files per partition</text><text x="446" y="432" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="14.5" font-weight="500" fill="#B0821F" text-anchor="end" style="">~121</text><line x1="66" y1="444" x2="446" y2="444" stroke="#E7E2D6" stroke-width="1" stroke-linecap="butt"/><text x="66" y="478" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#8B929E" style="">The query engine is not slow. It is filing paperwork.</text><rect x="494" y="176" width="500" height="316" rx="6" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><text x="514" y="208" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="500" fill="#B0821F" letter-spacing="1.6" style="">WHAT 2.2 M FILES ACTUALLY COST</text><text x="514" y="252" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">Metadata / transaction log</text><rect x="514" y="260" width="144.0" height="12" rx="2" fill="#B0821F"/><text x="662.0" y="270" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="400" fill="#8B929E" style="">30%</text><text x="514" y="296" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">Object-store LIST calls</text><rect x="514" y="304" width="115.19999999999999" height="12" rx="2" fill="#B0821F"/><text x="633.2" y="314" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="400" fill="#8B929E" style="">24%</text><text x="514" y="340" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">File open + footer read</text><rect x="514" y="348" width="105.6" height="12" rx="2" fill="#B0821F"/><text x="623.6" y="358" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="400" fill="#8B929E" style="">22%</text><text x="514" y="384" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">Task scheduling overhead</text><rect x="514" y="392" width="76.8" height="12" rx="2" fill="#5B87A6"/><text x="594.8" y="402" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="400" fill="#8B929E" style="">16%</text><text x="514" y="428" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">Actual row scanning</text><rect x="514" y="436" width="38.4" height="12" rx="2" fill="#2E6B4E"/><text x="556.4" y="446" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="400" fill="#8B929E" style="">8%</text><text x="514" y="478" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#2E6B4E" style="">8% of the work was the work.</text><rect x="46" y="524" width="464.0" height="118" rx="6" fill="#F1EDE3" stroke="#D6D0C2" stroke-width="1.1"/><text x="70" y="556" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="500" fill="#B0821F" letter-spacing="1.6" style="">THE FIX EVERYONE ASKS FOR</text><text x="70" y="586" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#14181F" style="">Compact the table</text><text x="70" y="614" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#48505C" style="">Real relief. Also a Tuesday ritual if nothing else changes.</text><rect x="530.0" y="524" width="464.0" height="118" rx="6" fill="#E7EFE8" stroke="#2E6B4E" stroke-width="1.2"/><text x="554.0" y="556" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="500" fill="#2E6B4E" letter-spacing="1.6" style="">THE FIX THAT ENDS IT</text><text x="554.0" y="586" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#14181F" style="">Fix the writer</text><text x="554.0" y="614" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#48505C" style="">Trigger interval, partition grain, and how many tasks write.</text><text x="520.0" y="692" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="17" font-weight="600" fill="#14181F" text-anchor="middle" style="">Fixing the layout is good. Fixing the write behaviour that created it is better.</text></svg>