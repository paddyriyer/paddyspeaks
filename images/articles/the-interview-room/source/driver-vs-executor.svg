<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="656" viewBox="0 0 1040 656"><rect x="0" y="0" width="1040" height="656" rx="0" fill="#F4F1EA"/><rect x="0.75" y="0.75" width="1038.5" height="654.5" rx="0" fill="none" stroke="#D6D0C2" stroke-width="1.5"/><text x="46" y="32" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="500" fill="#B0821F" letter-spacing="2.6" style="">ACT VIII — TWO DIFFERENT FAILURES WITH THE SAME WORD IN THEM</text><text x="46" y="68" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#14181F" style="">Driver OOM is a design smell. Executor OOM is a data smell.</text><line x1="46" y1="90" x2="994" y2="90" stroke="#D6D0C2" stroke-width="1.2" stroke-linecap="butt"/><rect x="46" y="156" width="461.0" height="300" rx="6" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><rect x="46" y="156" width="461.0" height="3" rx="0" fill="#A6322A"/><text x="66" y="188" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12" font-weight="500" fill="#A6322A" letter-spacing="1.8" style="">DRIVER OOM</text><text x="66" y="214" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="17.5" font-weight="600" fill="#14181F" style="">Distributed data arriving at one machine</text><text x="66" y="244" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="400" fill="#8B929E" style="">—</text><text x="88" y="244" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">collect() / toPandas()</text><text x="66" y="268" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="400" fill="#8B929E" style="">—</text><text x="88" y="268" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">a result set nobody bounded</text><text x="66" y="292" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="400" fill="#8B929E" style="">—</text><text x="88" y="292" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">an enormous query plan</text><text x="66" y="316" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="400" fill="#8B929E" style="">—</text><text x="88" y="316" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">metadata explosion — millions of files</text><text x="66" y="340" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="400" fill="#8B929E" style="">—</text><text x="88" y="340" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">hundreds of thousands of tasks</text><text x="66" y="364" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="400" fill="#8B929E" style="">—</text><text x="88" y="364" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">driver-side accumulators and objects</text><line x1="66" y1="400" x2="487.0" y2="400" stroke="#E7E2D6" stroke-width="1" stroke-linecap="butt"/><text x="66" y="422" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#A6322A" style="font-style:italic">“Another 16 GB may postpone the failure. It</text><text x="66" y="441" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#A6322A" style="font-style:italic">does not explain why the data came home.”</text><rect x="533.0" y="156" width="461.0" height="300" rx="6" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><rect x="533.0" y="156" width="461.0" height="3" rx="0" fill="#B0821F"/><text x="553.0" y="188" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12" font-weight="500" fill="#B0821F" letter-spacing="1.8" style="">EXECUTOR OOM</text><text x="553.0" y="214" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="17.5" font-weight="600" fill="#14181F" style="">One partition that no longer fits</text><text x="553.0" y="244" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="400" fill="#8B929E" style="">—</text><text x="575.0" y="244" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">skew — a single giant partition</text><text x="553.0" y="268" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="400" fill="#8B929E" style="">—</text><text x="575.0" y="268" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">join state / hash table size</text><text x="553.0" y="292" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="400" fill="#8B929E" style="">—</text><text x="575.0" y="292" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">aggregation buffers</text><text x="553.0" y="316" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="400" fill="#8B929E" style="">—</text><text x="575.0" y="316" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">cached data competing with execution</text><text x="553.0" y="340" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="400" fill="#8B929E" style="">—</text><text x="575.0" y="340" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">Python worker memory outside the heap</text><text x="553.0" y="364" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="400" fill="#8B929E" style="">—</text><text x="575.0" y="364" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">container limit vs. heap limit</text><line x1="553.0" y1="400" x2="974.0" y2="400" stroke="#E7E2D6" stroke-width="1" stroke-linecap="butt"/><text x="553.0" y="422" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#B0821F" style="font-style:italic">“Heap normal, container killed? Then it was</text><text x="553.0" y="441" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#B0821F" style="font-style:italic">never a heap problem.”</text><rect x="46" y="486" width="948" height="120" rx="6" fill="#F6EEDC" stroke="#B0821F" stroke-width="1.2"/><text x="70" y="520" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="500" fill="#B0821F" letter-spacing="1.8" style="">THE QUESTION THAT SPLITS THEM</text><text x="70" y="554" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#14181F" style="">Does the failure follow the executor — or does it follow the partition?</text><text x="70" y="584" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="15" font-weight="400" fill="#48505C" style="">If every executor that picks up task 847 dies, the executor is innocent. Go and look at task 847.</text><text x="520.0" y="630" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="17" font-weight="400" fill="#48505C" text-anchor="middle" style="font-style:italic">Same word. Opposite investigations.</text></svg>