 L 815.0 384.5 L 822.0 380 Z" fill="#B0821F"/><rect x="826.0" y="360" width="58" height="40" rx="4" fill="#F6EEDC" stroke="#B0821F" stroke-width="1"/><text x="855.0" y="385" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="400" fill="#B0821F" text-anchor="middle" style="">sort</text><path d="M 888.0 296 L 910.0 296 L 910.0 380 L 888.0 380" fill="none" stroke="#8B929E" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="910.0" y="318" width="56" height="40" rx="4" fill="#EAE5D9" stroke="#8B929E" stroke-width="1"/><text x="938.0" y="343" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12" font-weight="500" fill="#14181F" text-anchor="middle" style="">JOIN</text><text x="554.0" y="456" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">8 TB across the wire because 40 MB “looked” bigger.</text><text x="46" y="514" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="500" fill="#8B929E" letter-spacing="1.5" style="">SPARK CHOSE SORT MERGE ANYWAY. THE SHORT LIST OF WHY:</text><circle cx="58" cy="544" r="3" fill="#2C5570"/><text x="74" y="549" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#14181F" style="">No statistics on the table</text><circle cx="558" cy="544" r="3" fill="#2C5570"/><text x="574" y="549" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#14181F" style="">Stale statistics after a big write</text><circle cx="58" cy="572" r="3" fill="#2C5570"/><text x="74" y="577" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#14181F" style="">Serialized size ≠ on-disk size</text><circle cx="558" cy="572" r="3" fill="#2C5570"/><text x="574" y="577" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#14181F" style="">Below-threshold filter applied after the join decision</text><circle cx="58" cy="600" r="3" fill="#2C5570"/><text x="74" y="605" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#14181F" style="">autoBroadcastJoinThreshold lowered by a platform default</text><circle cx="558" cy="600" r="3" fill="#2C5570"/><text x="574" y="605" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#14181F" style="">A hint that quietly disabled it</text><text x="520.0" y="654" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="17.5" font-weight="600" fill="#14181F" text-anchor="middle" style="">Verify the physical plan. Never tune what you assume Spark did.</text></svg>