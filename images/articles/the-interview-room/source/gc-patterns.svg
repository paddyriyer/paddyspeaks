<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="730" viewBox="0 0 1060 730"><rect x="0" y="0" width="1060" height="730" rx="0" fill="#F4F1EA"/><rect x="0.75" y="0.75" width="1058.5" height="728.5" rx="0" fill="none" stroke="#D6D0C2" stroke-width="1.5"/><text x="46" y="32" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="500" fill="#B0821F" letter-spacing="2.6" style="">ACT VI — 410 SECONDS OF A 900-SECOND TASK</text><text x="46" y="68" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#14181F" style="">Three heaps that all “have a GC problem”</text><text x="46" y="96" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="16.5" font-weight="400" fill="#48505C" style="">The sawtooth tells you how memory is suffering. Only Spark tells you why.</text><line x1="46" y1="116" x2="1014" y2="116" stroke="#D6D0C2" stroke-width="1.2" stroke-linecap="butt"/><rect x="46.0" y="176" width="309.3333333333333" height="356" rx="6" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><rect x="46.0" y="176" width="309.3333333333333" height="3" rx="0" fill="#2E6B4E"/><text x="64.0" y="206" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="500" fill="#2E6B4E" letter-spacing="1.6" style="">PATTERN A</text><text x="64.0" y="230" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#14181F" style="">High allocation churn</text><rect x="64.0" y="252" width="273.3333333333333" height="124" rx="4" fill="#F1EDE3" stroke="#E7E2D6" stroke-width="1"/><text x="70.0" y="266" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="9.5" font-weight="400" fill="#8B929E" style="">16 GB</text><line x1="64.0" y1="260" x2="337.3333333333333" y2="260" stroke="#D6D0C2" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 4"/><polyline points="70.0,354.0 104.3,278.0 107.3,354.0 107.3,354.0 141.7,278.0 144.7,354.0 144.7,354.0 179.0,278.0 182.0,354.0 182.0,354.0 216.3,278.0 219.3,354.0 219.3,354.0 253.7,278.0 256.7,354.0 256.7,354.0 291.0,278.0 294.0,354.0 294.0,354.0 328.3,278.0 331.3,354.0" fill="none" stroke="#2E6B4E" stroke-width="1.9" stroke-linejoin="round"/><text x="70.0" y="370" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="9.5" font-weight="400" fill="#8B929E" style="">time →</text><text x="64.0" y="402" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12.5" font-weight="400" fill="#48505C" style="">Before GC  12 GB → After GC  3 GB</text><line x1="64.0" y1="414" x2="337.3333333333333" y2="414" stroke="#E7E2D6" stroke-width="1" stroke-linecap="butt"/><text x="64.0" y="436" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#14181F" style="">Heap returns to a low</text><text x="64.0" y="455" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#14181F" style="">baseline.</text><text x="64.0" y="478" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13" font-weight="400" fill="#2E6B4E" style="">Cost is CPU, not capacity. Look</text><text x="64.0" y="496" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13" font-weight="400" fill="#2E6B4E" style="">at object creation on the hot</text><text x="64.0" y="514" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13" font-weight="400" fill="#2E6B4E" style="">path.</text><rect x="375.3333333333333" y="176" width="309.3333333333333" height="356" rx="6" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><rect x="375.3333333333333" y="176" width="309.3333333333333" height="3" rx="0" fill="#A6322A"/><text x="393.3333333333333" y="206" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="500" fill="#A6322A" letter-spacing="1.6" style="">PATTERN B</text><text x="393.3333333333333" y="230" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#14181F" style="">Retained live set</text><rect x="393.3333333333333" y="252" width="273.3333333333333" height="124" rx="4" fill="#F1EDE3" stroke="#E7E2D6" stroke-width="1"/><text x="399.3333333333333" y="266" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="9.5" font-weight="400" fill="#8B929E" style="">16 GB</text><line x1="393.3333333333333" y1="260" x2="666.6666666666666" y2="260" stroke="#D6D0C2" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 4"/><polyline points="399.3,346.0 433.7,292.0 436.7,346.0 436.7,335.0 471.0,288.0 474.0,335.0 474.0,324.0 508.3,284.0 511.3,324.0 511.3,313.0 545.7,280.0 548.7,313.0 548.7,302.0 583.0,276.0 586.0,302.0 586.0,291.0 620.3,274.0 623.3,291.0 623.3,280.0 657.7,274.0 660.7,280.0" fill="none" stroke="#A6322A" stroke-width="1.9" stroke-linejoin="round"/><text x="399.3333333333333" y="370" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="9.5" font-weight="400" fill="#8B929E" style="">time →</text><text x="393.3333333333333" y="402" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12.5" font-weight="400" fill="#48505C" style="">Before GC  15 GB → After GC  14 GB</text><line x1="393.3333333333333" y1="414" x2="666.6666666666666" y2="414" stroke="#E7E2D6" stroke-width="1" stroke-linecap="butt"/><text x="393.3333333333333" y="436" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#14181F" style="">Heap never comes back down.</text><text x="393.3333333333333" y="478" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13" font-weight="400" fill="#A6322A" style="">Something is being held. Heap</text><text x="393.3333333333333" y="496" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13" font-weight="400" fill="#A6322A" style="">dump, not more heap.</text><rect x="704.6666666666666" y="176" width="309.3333333333333" height="356" rx="6" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><rect x="704.6666666666666" y="176" width="309.3333333333333" height="3" rx="0" fill="#B0821F"/><text x="722.6666666666666" y="206" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="500" fill="#B0821F" letter-spacing="1.6" style="">PATTERN C</text><text x="722.6666666666666" y="230" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#14181F" style="">Skew-induced pressure</text><rect x="722.6666666666666" y="252" width="273.3333333333333" height="124" rx="4" fill="#F1EDE3" stroke="#E7E2D6" stroke-width="1"/><text x="728.6666666666666" y="266" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="9.5" font-weight="400" fill="#8B929E" style="">16 GB</text><line x1="722.6666666666666" y1="260" x2="996.0" y2="260" stroke="#D6D0C2" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 4"/><polyline points="728.7,342.0 763.0,332.0 766.0,342.0 766.0,350.0 800.3,282.0 803.3,350.0 803.3,342.0 837.7,332.0 840.7,342.0 840.7,350.0 875.0,282.0 878.0,350.0 878.0,342.0 912.3,332.0 915.3,342.0 915.3,350.0 949.7,282.0 952.7,350.0 952.7,342.0 987.0,332.0 990.0,342.0" fill="none" stroke="#B0821F" stroke-width="1.9" stroke-linejoin="round"/><text x="728.6666666666666" y="370" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="9.5" font-weight="400" fill="#8B929E" style="">time →</text><text x="722.6666666666666" y="402" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12.5" font-weight="400" fill="#48505C" style="">One executor. One partition.</text><line x1="722.6666666666666" y1="414" x2="996.0" y2="414" stroke="#E7E2D6" stroke-width="1" stroke-linecap="butt"/><text x="722.6666666666666" y="436" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#14181F" style="">Only the hot task sawtooths.</text><text x="722.6666666666666" y="478" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13" font-weight="400" fill="#B0821F" style="">The memory symptom has a data</text><text x="722.6666666666666" y="496" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13" font-weight="400" fill="#B0821F" style="">cause. Fix the partition.</text><rect x="46" y="562" width="968" height="62" rx="6" fill="#10151C"/><text x="66" y="588" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="15" font-weight="400" fill="#9ED8B6" style="">-Xlog:gc*:file=/tmp/gc.log:time,uptime,level,tags</text><text x="66" y="610" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12.5" font-weight="400" fill="#7E8896" style=""># ask for the timeline before you argue about the heap size</text><text x="530.0" y="704" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="18" font-weight="600" fill="#14181F" text-anchor="middle" style="">GC tells us how memory is suffering. Spark tells us why.</text></svg>