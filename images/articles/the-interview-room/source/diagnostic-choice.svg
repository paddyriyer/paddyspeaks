<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700"><rect x="0" y="0" width="1040" height="700" rx="0" fill="#F4F1EA"/><rect x="0.75" y="0.75" width="1038.5" height="698.5" rx="0" fill="none" stroke="#D6D0C2" stroke-width="1.5"/><text x="46" y="32" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="500" fill="#B0821F" letter-spacing="2.6" style="">ACT VII — PICK THE RIGHT INSTRUMENT</text><text x="46" y="68" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#14181F" style="">Four tools. Four different questions.</text><text x="46" y="96" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="16.5" font-weight="400" fill="#48505C" style="">Collecting all of them is not thoroughness. It is indecision with a ticket number.</text><line x1="46" y1="116" x2="994" y2="116" stroke="#D6D0C2" stroke-width="1.2" stroke-linecap="butt"/><rect x="46.0" y="178" width="462.0" height="196" rx="6" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><rect x="46.0" y="178" width="3" height="196" rx="0" fill="#2E6B4E"/><text x="66.0" y="208" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12" font-weight="500" fill="#2E6B4E" letter-spacing="1.8" style="">GC LOG</text><text x="66.0" y="234" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="17.5" font-weight="600" fill="#14181F" style="">How is memory behaving over time?</text><circle cx="72.0" cy="258" r="2.5" fill="#8B929E"/><text x="84.0" y="263" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">allocation rate</text><circle cx="72.0" cy="279" r="2.5" fill="#8B929E"/><text x="84.0" y="284" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">pause duration</text><circle cx="72.0" cy="300" r="2.5" fill="#8B929E"/><text x="84.0" y="305" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">post-GC live set</text><circle cx="72.0" cy="321" r="2.5" fill="#8B929E"/><text x="84.0" y="326" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">trend across a whole stage</text><rect x="62.0" y="334" width="430.0" height="26" rx="4" fill="#12171F"/><text x="74.0" y="352" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="400" fill="#9ED8B6" style="">-Xlog:gc*</text><rect x="532.0" y="178" width="462.0" height="196" rx="6" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><rect x="532.0" y="178" width="3" height="196" rx="0" fill="#A6322A"/><text x="552.0" y="208" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12" font-weight="500" fill="#A6322A" letter-spacing="1.8" style="">HEAP DUMP</text><text x="552.0" y="234" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="17.5" font-weight="600" fill="#14181F" style="">What is the JVM holding?</text><circle cx="558.0" cy="258" r="2.5" fill="#8B929E"/><text x="570.0" y="263" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">object counts</text><circle cx="558.0" cy="279" r="2.5" fill="#8B929E"/><text x="570.0" y="284" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">retained heap</text><circle cx="558.0" cy="300" r="2.5" fill="#8B929E"/><text x="570.0" y="305" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">reference chains</text><circle cx="558.0" cy="321" r="2.5" fill="#8B929E"/><text x="570.0" y="326" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">GC roots, leak suspects</text><rect x="548.0" y="334" width="430.0" height="26" rx="4" fill="#12171F"/><text x="560.0" y="352" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="400" fill="#9ED8B6" style="">jcmd &lt;PID&gt; GC.heap_dump /tmp/heap.hprof</text><rect x="46.0" y="398" width="462.0" height="196" rx="6" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><rect x="46.0" y="398" width="3" height="196" rx="0" fill="#2C5570"/><text x="66.0" y="428" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12" font-weight="500" fill="#2C5570" letter-spacing="1.8" style="">THREAD DUMP</text><text x="66.0" y="454" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="17.5" font-weight="600" fill="#14181F" style="">What is the JVM doing right now?</text><circle cx="72.0" cy="478" r="2.5" fill="#8B929E"/><text x="84.0" y="483" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">blocked threads</text><circle cx="72.0" cy="499" r="2.5" fill="#8B929E"/><text x="84.0" y="504" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">deadlocks</text><circle cx="72.0" cy="520" r="2.5" fill="#8B929E"/><text x="84.0" y="525" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">I/O waits</text><circle cx="72.0" cy="541" r="2.5" fill="#8B929E"/><text x="84.0" y="546" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">the same stack, ten times running</text><rect x="62.0" y="554" width="430.0" height="26" rx="4" fill="#12171F"/><text x="74.0" y="572" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="400" fill="#9ED8B6" style="">jcmd &lt;PID&gt; Thread.print</text><rect x="532.0" y="398" width="462.0" height="196" rx="6" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><rect x="532.0" y="398" width="3" height="196" rx="0" fill="#B0821F"/><text x="552.0" y="428" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12" font-weight="500" fill="#B0821F" letter-spacing="1.8" style="">FLIGHT RECORDER</text><text x="552.0" y="454" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="17.5" font-weight="600" fill="#14181F" style="">How do all of those line up?</text><circle cx="558.0" cy="478" r="2.5" fill="#8B929E"/><text x="570.0" y="483" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">allocation profile</text><circle cx="558.0" cy="499" r="2.5" fill="#8B929E"/><text x="570.0" y="504" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">lock contention</text><circle cx="558.0" cy="520" r="2.5" fill="#8B929E"/><text x="570.0" y="525" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">I/O and CPU together</text><circle cx="558.0" cy="541" r="2.5" fill="#8B929E"/><text x="570.0" y="546" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#48505C" style="">one correlated timeline</text><rect x="548.0" y="554" width="430.0" height="26" rx="4" fill="#12171F"/><text x="560.0" y="572" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="400" fill="#9ED8B6" style="">jcmd &lt;PID&gt; JFR.start duration=120s</text><line x1="46" y1="630" x2="994" y2="630" stroke="#E7E2D6" stroke-width="1" stroke-linecap="butt"/><text x="520.0" y="662" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="16" font-weight="400" fill="#48505C" text-anchor="middle" style="font-style:italic">“What would this artefact tell me that I don’t already know?” — if there is no answer, don’t collect it.</text></svg>