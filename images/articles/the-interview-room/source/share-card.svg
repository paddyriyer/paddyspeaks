,Georgia,serif" font-size="24" font-weight="400" fill="#D9B45A" style="">“That wasn’t my question.”</text><text x="72" y="500" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="15" font-weight="500" fill="#78838F" letter-spacing="1.4" style="">JORDAN</text><text x="196" y="500" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="24" font-weight="400" fill="#C9D2DC" style="">“Right. No — I haven’t proven GC is the root cause.”</text><text x="72" y="584" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="17" font-weight="400" fill="#78838F" style="">Spark · JVM · distributed systems · escalations · evidence</text></svg>