<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700"><rect x="0" y="0" width="1040" height="700" rx="0" fill="#F4F1EA"/><rect x="0.75" y="0.75" width="1038.5" height="698.5" rx="0" fill="none" stroke="#D6D0C2" stroke-width="1.5"/><text x="46" y="32" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="500" fill="#B0821F" letter-spacing="2.6" style="">ACT XIV — THE ONLY DEFINITION THAT SURVIVES CONTACT WITH A TITLE LADDER</text><text x="46" y="68" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#14181F" style="">Staff is not seniority. It is radius.</text><line x1="46" y1="90" x2="994" y2="90" stroke="#D6D0C2" stroke-width="1.2" stroke-linecap="butt"/><circle cx="330" cy="396" r="190" fill="#EFE9DA" stroke="#2E6B4E" stroke-width="1.4"/><circle cx="330" cy="396" r="136" fill="#E7E1D2" stroke="#B0821F" stroke-width="1.4"/><circle cx="330" cy="396" r="80" fill="#DDD6C6" stroke="#2C5570" stroke-width="1.4"/><text x="330" y="402" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="15" font-weight="500" fill="#2C5570" text-anchor="middle" style="">ENGINEER</text><text x="330" y="298" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="15" font-weight="500" fill="#B0821F" text-anchor="middle" style="">SENIOR</text><text x="330" y="244" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="15" font-weight="500" fill="#2E6B4E" text-anchor="middle" style="">STAFF</text><text x="330" y="426" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="12.5" font-weight="400" fill="#8B929E" text-anchor="middle" style="">fixes the incident</text><text x="330" y="317" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="12.5" font-weight="400" fill="#8B929E" text-anchor="middle" style="">fixes the class</text><text x="330" y="263" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="12.5" font-weight="400" fill="#8B929E" text-anchor="middle" style="">removes the class</text><text x="600" y="190" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="500" fill="#8B929E" letter-spacing="1.6" style="">THE SAME ESCALATION, THREE ENDINGS</text><rect x="600" y="220" width="394" height="110" rx="6" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><rect x="600" y="220" width="3" height="110" rx="0" fill="#2C5570"/><text x="620" y="252" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="17.5" font-weight="600" fill="#14181F" style="">Engineer</text><text x="620" y="278" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#48505C" style="">Restarts the job, clears the backlog, closes</text><text x="620" y="297" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#48505C" style="">the ticket. The customer is unblocked tonight.</text><rect x="600" y="348" width="394" height="110" rx="6" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><rect x="600" y="348" width="3" height="110" rx="0" fill="#B0821F"/><text x="620" y="380" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="17.5" font-weight="600" fill="#14181F" style="">Senior engineer</text><text x="620" y="406" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#48505C" style="">Finds the null-key skew, fixes the pipeline,</text><text x="620" y="425" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#48505C" style="">and writes the pattern down so the next five</text><text x="620" y="444" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#48505C" style="">tickets close in an hour.</text><rect x="600" y="476" width="394" height="110" rx="6" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><rect x="600" y="476" width="3" height="110" rx="0" fill="#2E6B4E"/><text x="620" y="508" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="17.5" font-weight="600" fill="#14181F" style="">Staff engineer</text><text x="620" y="534" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#48505C" style="">Ships a skew detector into the platform’s</text><text x="620" y="553" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#48505C" style="">diagnostics, files the product gap that made</text><text x="620" y="572" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#48505C" style="">it invisible, and the ticket class thins out.</text><text x="46" y="674" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="17" font-weight="400" fill="#48505C" style="font-style:italic">Nobody gets promoted for the restart. Everybody depends on the detector.</text></svg>