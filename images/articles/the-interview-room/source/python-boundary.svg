t-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" style="">22%</text><text x="283.0" y="400" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="12.5" font-weight="400" fill="#48505C" text-anchor="middle" style="">serialize out</text><rect x="387.28" y="338" width="180.12" height="44" rx="0" fill="#5FA37D"/><text x="477.34" y="366" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" style="">19%</text><text x="477.34" y="400" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="12.5" font-weight="400" fill="#48505C" text-anchor="middle" style="">your Python code</text><rect x="567.4" y="338" width="255.96" height="44" rx="0" fill="#D9B45A"/><text x="695.38" y="366" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" style="">27%</text><text x="695.38" y="400" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="12.5" font-weight="400" fill="#48505C" text-anchor="middle" style="">serialize back</text><rect x="823.36" y="338" width="170.64" height="44" rx="0" fill="#5B87A6"/><text x="908.6800000000001" y="366" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" style="">18%</text><text x="908.6800000000001" y="400" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="12.5" font-weight="400" fill="#48505C" text-anchor="middle" style="">JVM merge</text><rect x="46" y="338" width="948" height="44" rx="0" fill="none" stroke="#D6D0C2" stroke-width="1"/><text x="46" y="430" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="16.5" font-weight="400" fill="#A6322A" style="">49% of the batch was moving data across a boundary. 19% was the function.</text><rect x="46" y="456" width="948" height="118" rx="6" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><text x="70" y="486" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="500" fill="#B0821F" letter-spacing="1.8" style="">BEFORE REWRITING ANYTHING</text><circle cx="80" cy="510" r="2.5" fill="#B0821F"/><text x="94" y="515" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#48505C" style="">Is the UDF on the dominant path, or on 2% of the runtime?</text><circle cx="80" cy="530" r="2.5" fill="#B0821F"/><text x="94" y="535" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#48505C" style="">Can a built-in expression do it? Then the JVM never leaves home.</text><circle cx="80" cy="550" r="2.5" fill="#B0821F"/><text x="94" y="555" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#48505C" style="">Is it row-at-a-time, or can it be a vectorised / Arrow batch?</text><circle cx="80" cy="570" r="2.5" fill="#B0821F"/><text x="94" y="575" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14" font-weight="400" fill="#48505C" style="">Is Python worker memory counted against the container, not the heap?</text><text x="520.0" y="650" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="17" font-weight="400" fill="#48505C" text-anchor="middle" style="font-style:italic">“First establish whether the UDF is actually on the dominant path.”</text></svg>