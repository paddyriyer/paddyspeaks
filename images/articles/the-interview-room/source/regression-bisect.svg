<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="740" viewBox="0 0 1040 740"><rect x="0" y="0" width="1040" height="740" rx="0" fill="#F4F1EA"/><rect x="0.75" y="0.75" width="1038.5" height="738.5" rx="0" fill="none" stroke="#D6D0C2" stroke-width="1.5"/><text x="46" y="32" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="500" fill="#B0821F" letter-spacing="2.6" style="">ACT XII — “IT WORKED BEFORE THE UPGRADE”</text><text x="46" y="68" font-family="Liberation Sans,DejaVu Sans,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#14181F" style="">Nine things changed. Prove it was the one they mean.</text><text x="46" y="96" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="16.5" font-weight="400" fill="#48505C" style="">A controlled experiment is the cheapest thing you can build and the hardest thing to argue with.</text><line x1="46" y1="116" x2="994" y2="116" stroke="#D6D0C2" stroke-width="1.2" stroke-linecap="butt"/><rect x="46" y="176" width="948" height="194" rx="6" fill="#FCFAF5" stroke="#D6D0C2" stroke-width="1.1"/><text x="70" y="208" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="500" fill="#B0821F" letter-spacing="1.6" style="">HOLD EVERYTHING. MOVE ONE THING.</text><rect x="70" y="228" width="166" height="40" rx="4" fill="#F1EDE3" stroke="#E7E2D6" stroke-width="1"/><text x="153" y="253" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="400" fill="#48505C" text-anchor="middle" style="">same workload</text><rect x="252" y="228" width="166" height="40" rx="4" fill="#F1EDE3" stroke="#E7E2D6" stroke-width="1"/><text x="335" y="253" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="400" fill="#48505C" text-anchor="middle" style="">same data snapshot</text><rect x="434" y="228" width="166" height="40" rx="4" fill="#F1EDE3" stroke="#E7E2D6" stroke-width="1"/><text x="517" y="253" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="400" fill="#48505C" text-anchor="middle" style="">same configuration</text><rect x="616" y="228" width="166" height="40" rx="4" fill="#F1EDE3" stroke="#E7E2D6" stroke-width="1"/><text x="699" y="253" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="400" fill="#48505C" text-anchor="middle" style="">same cluster shape</text><rect x="798" y="228" width="166" height="40" rx="4" fill="#F1EDE3" stroke="#E7E2D6" stroke-width="1"/><text x="881" y="253" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="400" fill="#48505C" text-anchor="middle" style="">same storage path</text><text x="70" y="298" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="13.5" font-weight="400" fill="#8B929E" style="">the one variable:</text><rect x="206" y="280" width="260" height="44" rx="5" fill="#E7EFE8" stroke="#2E6B4E" stroke-width="1.2"/><text x="336" y="308" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="15" font-weight="500" fill="#2E6B4E" text-anchor="middle" style="">runtime 12.4  → PASS</text><rect x="486" y="280" width="260" height="44" rx="5" fill="#F7E7E4" stroke="#A6322A" stroke-width="1.2"/><text x="616" y="308" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="15" font-weight="500" fill="#A6322A" text-anchor="middle" style="">runtime 13.0  → FAIL</text><text x="70" y="348" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="14.5" font-weight="400" fill="#48505C" style="">Until this table exists, “the upgrade broke it” is a feeling with a timestamp.</text><text x="46" y="400" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11.5" font-weight="500" fill="#8B929E" letter-spacing="1.5" style="">THEN NARROW — each step throws away half the suspects</text><rect x="46" y="426" width="26" height="26" rx="13" fill="#2C5570" opacity="0.14"/><text x="59" y="444" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="500" fill="#2C5570" text-anchor="middle" style="">1</text><text x="86" y="444" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="15.5" font-weight="400" fill="#14181F" style="">Diff the physical plans</text><line x1="59" y1="453" x2="59" y2="459" stroke="#D6D0C2" stroke-width="1.4" stroke-linecap="butt"/><rect x="46" y="460" width="26" height="26" rx="13" fill="#2C5570" opacity="0.14"/><text x="59" y="478" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="500" fill="#2C5570" text-anchor="middle" style="">2</text><text x="86" y="478" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="15.5" font-weight="400" fill="#14181F" style="">Diff the effective configuration, not the file</text><line x1="59" y1="487" x2="59" y2="493" stroke="#D6D0C2" stroke-width="1.4" stroke-linecap="butt"/><rect x="46" y="494" width="26" height="26" rx="13" fill="#2C5570" opacity="0.14"/><text x="59" y="512" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="500" fill="#2C5570" text-anchor="middle" style="">3</text><text x="86" y="512" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="15.5" font-weight="400" fill="#14181F" style="">Diff the logs at the first divergence</text><line x1="59" y1="521" x2="59" y2="527" stroke="#D6D0C2" stroke-width="1.4" stroke-linecap="butt"/><rect x="46" y="528" width="26" height="26" rx="13" fill="#2C5570" opacity="0.14"/><text x="59" y="546" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="500" fill="#2C5570" text-anchor="middle" style="">4</text><text x="86" y="546" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="15.5" font-weight="400" fill="#14181F" style="">Identify the component that changed behaviour</text><line x1="59" y1="555" x2="59" y2="561" stroke="#D6D0C2" stroke-width="1.4" stroke-linecap="butt"/><rect x="46" y="562" width="26" height="26" rx="13" fill="#2C5570" opacity="0.14"/><text x="59" y="580" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="500" fill="#2C5570" text-anchor="middle" style="">5</text><text x="86" y="580" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="15.5" font-weight="400" fill="#14181F" style="">Read the code path, not the release notes</text><line x1="59" y1="589" x2="59" y2="595" stroke="#D6D0C2" stroke-width="1.4" stroke-linecap="butt"/><rect x="46" y="596" width="26" height="26" rx="13" fill="#2E6B4E" opacity="0.14"/><text x="59" y="614" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="500" fill="#2E6B4E" text-anchor="middle" style="">6</text><text x="86" y="614" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="15.5" font-weight="400" fill="#14181F" style="">Narrow to a commit or a rule</text><line x1="59" y1="623" x2="59" y2="629" stroke="#D6D0C2" stroke-width="1.4" stroke-linecap="butt"/><rect x="46" y="630" width="26" height="26" rx="13" fill="#2E6B4E" opacity="0.14"/><text x="59" y="648" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" font-weight="500" fill="#2E6B4E" text-anchor="middle" style="">7</text><text x="86" y="648" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="15.5" font-weight="400" fill="#14181F" style="">Hand Engineering a reproduction that runs in five minutes</text><rect x="600" y="426" width="394" height="200" rx="6" fill="#10151C"/><text x="624" y="454" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="11" font-weight="500" fill="#D9B45A" style="">PLAN DIFF — the only line that mattered</text><text x="624" y="480" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12" font-weight="400" fill="#CF6A5E" style="">- BroadcastHashJoin  BuildRight</text><text x="624" y="498" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12" font-weight="400" fill="#9ED8B6" style="">+ SortMergeJoin</text><text x="624" y="516" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12" font-weight="400" fill="#8B929E" style=""></text><text x="624" y="534" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12" font-weight="400" fill="#CF6A5E" style="">- stats: sizeInBytes=39.4 MB</text><text x="624" y="552" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12" font-weight="400" fill="#9ED8B6" style="">+ stats: sizeInBytes=8.0 EB</text><text x="624" y="570" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12" font-weight="400" fill="#8B929E" style=""></text><text x="624" y="588" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12" font-weight="400" fill="#7E8896" style=""># the default changed. the table</text><text x="624" y="606" font-family="DejaVu Sans Mono,Liberation Mono,monospace" font-size="12" font-weight="400" fill="#7E8896" style=""># never had statistics at all.</text><text x="520.0" y="714" font-family="Charter,Bitstream Charter,Liberation Serif,Georgia,serif" font-size="18" font-weight="600" fill="#14181F" text-anchor="middle" style="">Don’t send Engineering a complaint. Send Engineering evidence.</text></svg>