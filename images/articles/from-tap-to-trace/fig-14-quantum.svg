<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1000px" version="1.1" viewBox="0 0 1900 1000" width="1900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow-blue" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="6"><path d="M 1,1 L 12,6 L 1,11 Z" fill="#146AA4" /></marker><marker id="arrow-teal" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="6"><path d="M 1,1 L 12,6 L 1,11 Z" fill="#087C76" /></marker><marker id="arrow-red" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="6"><path d="M 1,1 L 12,6 L 1,11 Z" fill="#AC3A4A" /></marker><marker id="arrow-amber" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="6"><path d="M 1,1 L 12,6 L 1,11 Z" fill="#9A6320" /></marker><marker id="arrow-slate" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="6"><path d="M 1,1 L 12,6 L 1,11 Z" fill="#5B7084" /></marker></defs><rect fill="#FFFFFF" height="1000" width="1900" x="0" y="0" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2" x="70" y="51">CRYPTOGRAPHIC ROADMAP / 05</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" x="70" y="102">Quantum risk is not one universal attack on encryption</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="22" x="70" y="145">Public-key schemes and symmetric primitives have different vulnerabilities and migration choices.</text><line stroke="#CFDAE3" stroke-width="2" x1="70" x2="1830" y1="163" y2="163" /><rect fill="#FFF1F2" fill-opacity="0.35" height="300" rx="17" ry="17" stroke="#CFDAE3" stroke-width="2" width="1770" x="65" y="203" /><text fill="#AC3A4A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" x="87" y="240">A  ASYMMETRIC CRYPTOGRAPHY / KEY ESTABLISHMENT / SIGNATURES</text><rect fill="#EBF7F4" fill-opacity="0.35" height="292" rx="17" ry="17" stroke="#CFDAE3" stroke-width="2" width="1770" x="65" y="531" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" x="87" y="568">B  SYMMETRIC CRYPTOGRAPHY / HASHES</text><rect fill="#F0F7FD" height="157" rx="12" ry="12" stroke="#146AA4" stroke-width="2.5" width="340" x="102" y="274" /><rect fill="#146AA4" height="157" rx="3" ry="3" width="7" x="102" y="274" /><text fill="#146AA4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="127" y="305">LEGACY</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="127" y="340">ECC / RSA</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="127" y="369">Widely used asymmetric</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="127" y="393">cryptographic foundations</text><rect fill="#FFF1F2" height="157" rx="12" ry="12" stroke="#AC3A4A" stroke-width="2.5" width="340" x="532" y="274" /><rect fill="#AC3A4A" height="157" rx="3" ry="3" width="7" x="532" y="274" /><text fill="#AC3A4A" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="557" y="305">QUANTUM THREAT</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="557" y="340">Shor’s algorithm</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="557" y="369">Threatens ECC / RSA if large</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="557" y="393">fault-tolerant QC exists</text><rect fill="#EBF7F4" height="157" rx="12" ry="12" stroke="#087C76" stroke-width="2.5" width="340" x="962" y="274" /><rect fill="#087C76" height="157" rx="3" ry="3" width="7" x="962" y="274" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="987" y="305">PQC ALTERNATIVE</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="987" y="340">ML-KEM / ML-DSA</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="987" y="369">KEM and signatures;</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="987" y="393">different cryptographic jobs</text><rect fill="#EBF7F4" height="157" rx="12" ry="12" stroke="#087C76" stroke-width="2.5" width="340" x="1392" y="274" /><rect fill="#087C76" height="157" rx="3" ry="3" width="7" x="1392" y="274" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="1417" y="305">MIGRATION</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="1417" y="340">Protocol redesign</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="1417" y="369">Assess payload, compute,</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="1417" y="393">firmware, interoperability</text><rect fill="#F0F7FD" height="157" rx="12" ry="12" stroke="#146AA4" stroke-width="2.5" width="340" x="102" y="605" /><rect fill="#146AA4" height="157" rx="3" ry="3" width="7" x="102" y="605" /><text fill="#146AA4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="127" y="636">EXISTING</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="127" y="671">AES + modern hashes</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="127" y="700">Symmetric encryption,</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="127" y="724">hashing, KDFs</text><rect fill="#FFF6E9" height="157" rx="12" ry="12" stroke="#9A6320" stroke-width="2.5" width="340" x="532" y="605" /><rect fill="#9A6320" height="157" rx="3" ry="3" width="7" x="532" y="605" /><text fill="#9A6320" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="557" y="636">QUANTUM EFFECT</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="557" y="671">Grover’s algorithm</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="557" y="700">Theoretical generic-search</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="557" y="724">speedup; major caveats</text><rect fill="#EBF7F4" height="157" rx="12" ry="12" stroke="#087C76" stroke-width="2.5" width="340" x="962" y="605" /><rect fill="#087C76" height="157" rx="3" ry="3" width="7" x="962" y="605" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="987" y="636">RISK TREATMENT</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="987" y="671">Review key strengths</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="987" y="700">Assess security margins,</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="987" y="724">cryptographic use cases</text><rect fill="#EBF7F4" height="157" rx="12" ry="12" stroke="#087C76" stroke-width="2.5" width="340" x="1392" y="605" /><rect fill="#087C76" height="157" rx="3" ry="3" width="7" x="1392" y="605" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="1417" y="636">LIFECYCLE</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="1417" y="671">Crypto agility</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="1417" y="700">Inventory, validate, pilot,</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="1417" y="724">upgrade where feasible</text><path d="M 442,355 L 523,355" fill="none" marker-end="url(#arrow-red)" stroke="#AC3A4A" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><path d="M 872,355 L 953,355" fill="none" marker-end="url(#arrow-teal)" stroke="#087C76" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><path d="M 1302,355 L 1383,355" fill="none" marker-end="url(#arrow-teal)" stroke="#087C76" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><path d="M 442,682 L 523,682" fill="none" marker-end="url(#arrow-teal)" stroke="#087C76" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><path d="M 872,682 L 953,682" fill="none" marker-end="url(#arrow-teal)" stroke="#087C76" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><path d="M 1302,682 L 1383,682" fill="none" marker-end="url(#arrow-teal)" stroke="#087C76" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><rect fill="#FFF6E9" height="76" rx="9" ry="9" stroke="#D5DEE6" stroke-width="1.4" width="1320" x="300" y="828" /><text fill="#9A6320" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" x="318" y="859">DESIGN PRINCIPLE</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="17.5" x="318" y="888">Do not assume that current AirTags use ML-KEM; this is a proposed migration framework.</text><line stroke="#CFDAE3" stroke-width="2" x1="70" x2="1830" y1="919" y2="919" /><path d="M 90,946 L 141,946" fill="none" marker-end="url(#arrow-blue)" stroke="#146AA4" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><text fill="#738394" font-family="Arial, Helvetica, sans-serif" font-size="18" x="162" y="954">Conceptual migration path</text><path d="M 445,946 L 496,946" fill="none" marker-end="url(#arrow-teal)" stroke="#087C76" stroke-dasharray="9,8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><text fill="#738394" font-family="Arial, Helvetica, sans-serif" font-size="18" x="517" y="954">Control / dependency</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="end" x="1830" y="955">Source: NIST FIPS 203 / 204 / 205 · illustrative migration architecture</text></svg>