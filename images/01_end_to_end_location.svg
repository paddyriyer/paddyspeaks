<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1000px" version="1.1" viewBox="0 0 1900 1000" width="1900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow-blue" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="6"><path d="M 1,1 L 12,6 L 1,11 Z" fill="#146AA4" /></marker><marker id="arrow-teal" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="6"><path d="M 1,1 L 12,6 L 1,11 Z" fill="#087C76" /></marker><marker id="arrow-red" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="6"><path d="M 1,1 L 12,6 L 1,11 Z" fill="#AC3A4A" /></marker><marker id="arrow-amber" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="6"><path d="M 1,1 L 12,6 L 1,11 Z" fill="#9A6320" /></marker><marker id="arrow-slate" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="6"><path d="M 1,1 L 12,6 L 1,11 Z" fill="#5B7084" /></marker></defs><rect fill="#FFFFFF" height="1000" width="1900" x="0" y="0" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2" x="70" y="51">NETWORK ARCHITECTURE / 01</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" x="70" y="102">How an AirTag is found without GPS or cellular</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="22" x="70" y="145">Five connected components. Location encryption occurs on the finder phone, not in Apple’s cloud.</text><line stroke="#CFDAE3" stroke-width="2" x1="70" x2="1830" y1="163" y2="163" /><rect fill="#F8FAFC" fill-opacity="0.35" height="520" rx="17" ry="17" stroke="#CFDAE3" stroke-width="2" width="660" x="60" y="195" /><text fill="#738394" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" x="82" y="232">PHYSICAL WORLD / FINDER PHONE</text><rect fill="#F8FAFC" fill-opacity="0.35" height="520" rx="17" ry="17" stroke="#CFDAE3" stroke-width="2" width="320" x="745" y="195" /><text fill="#738394" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" x="767" y="232">PROTECTED REPORT</text><rect fill="#F8FAFC" fill-opacity="0.35" height="520" rx="17" ry="17" stroke="#CFDAE3" stroke-width="2" width="320" x="1090" y="195" /><text fill="#738394" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" x="1112" y="232">VENDOR SERVICE</text><rect fill="#EBF7F4" fill-opacity="0.35" height="520" rx="17" ry="17" stroke="#CFDAE3" stroke-width="2" width="405" x="1435" y="195" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" x="1457" y="232">AUTHORIZED OWNER</text><rect fill="#EBF7F4" height="165" rx="12" ry="12" stroke="#087C76" stroke-width="2.5" width="270" x="100" y="310" /><rect fill="#087C76" height="165" rx="3" ry="3" width="7" x="100" y="310" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="125" y="341">1 · DEVICE</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="125" y="376">AirTag</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="125" y="405">Broadcasts changing</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="125" y="429">BLE identifiers / keys</text><rect fill="#F0F7FD" height="165" rx="12" ry="12" stroke="#146AA4" stroke-width="2.5" width="270" x="440" y="310" /><rect fill="#146AA4" height="165" rx="3" ry="3" width="7" x="440" y="310" /><text fill="#146AA4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="465" y="341">2 · FINDER</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="465" y="376">Nearby phone</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="465" y="405">Detects advertisement,</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="465" y="429">knows its own location</text><rect fill="#F0F7FD" height="165" rx="12" ry="12" stroke="#146AA4" stroke-width="2.5" width="250" x="780" y="310" /><rect fill="#146AA4" height="165" rx="3" ry="3" width="7" x="780" y="310" /><text fill="#146AA4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="805" y="341">3 · ENCRYPTION</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="805" y="376">Finder encrypts</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="805" y="405">Protects location using</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="805" y="429">advertised public key</text><rect fill="#F0F7FD" height="165" rx="12" ry="12" stroke="#146AA4" stroke-width="2.5" width="250" x="1120" y="310" /><rect fill="#146AA4" height="165" rx="3" ry="3" width="7" x="1120" y="310" /><text fill="#146AA4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="1145" y="341">4 · RELAY</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="1145" y="376">Find My service</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="1145" y="405">Stores / routes encrypted</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="1145" y="429">location reports</text><rect fill="#EBF7F4" height="165" rx="12" ry="12" stroke="#087C76" stroke-width="2.5" width="325" x="1475" y="310" /><rect fill="#087C76" height="165" rx="3" ry="3" width="7" x="1475" y="310" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="1500" y="341">5 · AUTHORIZED</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="1500" y="376">Owner device</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="1500" y="405">Retrieves and decrypts</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="1500" y="429">location in Find My</text><path d="M 370,395 L 431,395" fill="none" marker-end="url(#arrow-teal)" stroke="#087C76" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><rect fill="#FFFFFF" height="28" rx="8" ry="8" stroke="#DFE6EB" stroke-width="1" width="120.28" x="344.86" y="269" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle" x="405.0" y="289">BLE broadcast</text><path d="M 710,395 L 771,395" fill="none" marker-end="url(#arrow-blue)" stroke="#146AA4" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><rect fill="#FFFFFF" height="28" rx="8" ry="8" stroke="#DFE6EB" stroke-width="1" width="180.76000000000002" x="654.62" y="269" /><text fill="#146AA4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle" x="745.0" y="289">public key + location</text><path d="M 1030,395 L 1111,395" fill="none" marker-end="url(#arrow-blue)" stroke="#146AA4" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><rect fill="#FFFFFF" height="28" rx="8" ry="8" stroke="#DFE6EB" stroke-width="1" width="142.96" x="1003.52" y="269" /><text fill="#146AA4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle" x="1075.0" y="289">encrypted upload</text><path d="M 1370,395 L 1466,395" fill="none" marker-end="url(#arrow-blue)" stroke="#146AA4" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><rect fill="#FFFFFF" height="28" rx="8" ry="8" stroke="#DFE6EB" stroke-width="1" width="165.64000000000001" x="1339.68" y="269" /><text fill="#146AA4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle" x="1422.5" y="289">encrypted retrieval</text><rect fill="#F8FAFC" height="116" rx="12" ry="12" stroke="#738394" stroke-width="2.5" width="270" x="440" y="553" /><rect fill="#738394" height="116" rx="3" ry="3" width="7" x="440" y="553" /><text fill="#738394" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="465" y="584">LOCATION INPUT</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="465" y="619">Finder location</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="465" y="648">GNSS / Wi-Fi / cellular</text><path d="M 575,553 L 575,484" fill="none" marker-end="url(#arrow-blue)" stroke="#146AA4" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><rect fill="#FFFFFF" height="28" rx="8" ry="8" stroke="#DFE6EB" stroke-width="1" width="159.70000000000002" x="568.15" y="498" /><text fill="#146AA4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="middle" x="648" y="518">location estimate</text><rect fill="#EBF7F4" height="116" rx="12" ry="12" stroke="#087C76" stroke-width="2.5" width="325" x="1475" y="553" /><rect fill="#087C76" height="116" rx="3" ry="3" width="7" x="1475" y="553" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.0" x="1500" y="584">KEY CUSTODY</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" x="1500" y="619">Protected private key</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="18" x="1500" y="648">Available to authorized device</text><path d="M 1640,553 L 1640,484" fill="none" marker-end="url(#arrow-teal)" stroke="#087C76" stroke-dasharray="9,8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><rect fill="#FFFFFF" height="28" rx="8" ry="8" stroke="#DFE6EB" stroke-width="1" width="103.0" x="1678.5" y="501" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="middle" x="1730" y="521">key access</text><rect fill="#F0F7FD" height="113" rx="9" ry="9" stroke="#D5DEE6" stroke-width="1.4" width="775" x="100" y="751" /><text fill="#146AA4" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" x="118" y="782">IMPORTANT: What the cloud cannot decrypt</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="17.5" x="118" y="811">Apple documents protected offline-finding reports as end-to-end encrypted.</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="17.5" x="118" y="834">The finder phone is not shown to the owner.</text><rect fill="#EBF7F4" height="113" rx="9" ry="9" stroke="#D5DEE6" stroke-width="1.4" width="865" x="935" y="751" /><text fill="#087C76" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" x="953" y="782">IMPORTANT: What the owner can learn</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="17.5" x="953" y="811">An authorized owner can decrypt the location of the tracker.</text><text fill="#152C42" font-family="Arial, Helvetica, sans-serif" font-size="17.5" x="953" y="834">If the tag travels with a person, that may reveal the person’s movements.</text><line stroke="#CFDAE3" stroke-width="2" x1="70" x2="1830" y1="919" y2="919" /><path d="M 90,946 L 141,946" fill="none" marker-end="url(#arrow-blue)" stroke="#146AA4" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><text fill="#738394" font-family="Arial, Helvetica, sans-serif" font-size="18" x="162" y="954">Signal / data flow</text><path d="M 445,946 L 496,946" fill="none" marker-end="url(#arrow-teal)" stroke="#087C76" stroke-dasharray="9,8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" /><text fill="#738394" font-family="Arial, Helvetica, sans-serif" font-size="18" x="517" y="954">Authorization / control</text><text fill="#5B7084" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="end" x="1830" y="955">Sources: Apple Platform Security / Find My · conceptual summary</text></svg>