<svg baseProfile="full" height="1080" version="1.1" viewBox="0 0 1920 1080" width="1920" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F6F2E9" height="1080" width="1920" x="0" y="0" /><rect fill="#B84E37" height="44" width="10" x="68" y="58" /><text fill="#627078" font-family="Inter" font-size="20" font-weight="700" letter-spacing="2.6" x="95" y="84">PADDYSPEAKS   /   SYSTEMS AT THE WHITEBOARD   /   Nº 42</text><text fill="#177D76" font-family="Inter" font-size="19" font-weight="700" letter-spacing="2" text-anchor="end" x="1850" y="86">ROUND 05   ·   VALIDATION</text><line opacity="0.4" stroke="#CCC7BB" stroke-width="2" x1="72" x2="1848" y1="115" y2="115" /><text fill="#152C34" font-family="Inter" font-size="72" font-weight="700" x="76" y="196">Confidence is not comprehension.</text><text fill="#627078" font-family="Inter" font-size="29" font-weight="400" x="79" y="247">Task T3   ·   Synthetic responses   ·   20 participants per variant   ·   NOT a real user study</text><line stroke="#CFCBC1" stroke-width="2" x1="72" x2="1848" y1="1003" y2="1003" /><text fill="#627078" font-family="Inter" font-size="18" font-weight="400" letter-spacing="1.4" x="76" y="1042">THE REVENUE PROBLEM   ·   OCTOBER 2026   ·   SYNTHETIC EXAMPLE</text><text fill="#177D76" font-family="Inter" font-size="20" font-weight="700" letter-spacing="1.5" text-anchor="end" x="1844" y="1042">TRUST BEFORE PIXELS</text><rect fill="#FFFFFF" height="645" opacity="1" rx="13" ry="13" stroke="#C9CFC9" stroke-width="2" width="1760" x="80" y="294" /><text fill="#152C34" font-family="Inter" font-size="31" font-weight="800" letter-spacing="0.6" x="130" y="368">ANSWERED CORRECTLY</text><text fill="#627078" font-family="Inter" font-size="22" font-weight="500" x="130" y="418">Up from 10% to 95%</text><text fill="#152C34" font-family="Inter" font-size="23" font-weight="700" letter-spacing="1" x="130" y="486">BEFORE</text><