oke="none" stroke-width="2" width="34.75" x="1000" y="681" /><text fill="#152C34" font-family="Inter" font-size="49" font-weight="800" x="1710" y="733">5%</text><text fill="#B84E37" font-family="Inter" font-size="21" font-style="italic" font-weight="600" x="1000" y="904">Measure understanding, not aesthetic approval.</text><text fill="#B84E37" font-family="Inter" font-size="26" font-weight="700" text-anchor="middle" x="960" y="986">The most dangerous cell: a confident answer to the wrong question.</text></svg>