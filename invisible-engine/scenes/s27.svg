    <text x="432.0" y="766" text-anchor="middle" style="font-size:13.5px;font-weight:600;fill:#475569">-60</text>
    <path d="M568,734 l0,12" stroke="#334155" stroke-width="2"/>
    <text x="568.0" y="766" text-anchor="middle" style="font-size:13.5px;font-weight:600;fill:#475569">-40</text>
    <path d="M704,734 l0,12" stroke="#334155" stroke-width="2"/>
    <text x="704.0" y="766" text-anchor="middle" style="font-size:13.5px;font-weight:600;fill:#475569">-20</text>
    <path d="M840,734 l0,12" stroke="#334155" stroke-width="2"/>
    <text x="840.0" y="766" text-anchor="middle" style="font-size:13.5px;font-weight:600;fill:#475569">0</text>
    <text x="880.0" y="766" text-anchor="start" style="font-size:13.5px;font-weight:700;fill:#475569">dBm</text>
    <rect x="160" y="530" width="680" height="30" rx="4" fill="#1d4ed8"/>
    <text x="830.0" y="551" text-anchor="end" style="font-size:15px;font-weight:700;fill:#ffffff">transmit 0 dBm</text>
    <rect x="160" y="574" width="272" height="30" rx="4" fill="#3b82f6"/>
    <text x="442.0" y="595" text-anchor="start" style="font-size:15px;font-weight:700;fill:#14213d">after 10 m free space (−60 dB)</text>
    <rect x="160" y="618" width="170" height="30" rx="4" fill="#93c5fd"/>
    <text x="340.0" y="639" text-anchor="start" style="font-size:15px;font-weight:700;fill:#14213d">after a body in the way (−15 dB)</text>
    <path d="M194,520 L194,726" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="202.0" y="692" text-anchor="start" style="font-size:15px;font-weight:700;fill:#b91c1c">receiver sensitivity ≈ −95 dBm → margin ≈ 20 dB</text>
  </g>
  <g data-f="4">
    <rect x="920" y="360" width="620" height="330" rx="16" class="boxw"/>
    <text x="944" y="392" text-anchor="start" style="font-size:14.5px;font-weight:700;fill:#334155">Direct path: absorbed by a body (mostly water).</text>
    <text x="944" y="414" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#475569">A bounce off the floor may still arrive (multipath).</text>
    <path d="M940,672 L1520,672" stroke="#a8a29e" stroke-width="6"/>
    <text x="1520" y="662" text-anchor="end" style="font-size:13.5px;font-weight:700;fill:#57534e">floor</text>
