<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 27: Why a tiny antenna is enough — and when it is not</title>
  <desc>Five frames. A 2.44 GHz wave with a wavelength of about 12.3 centimetres and a quarter wavelength of about 3.1 centimetres, next to a three-centimetre tracker; the compromises of an antenna that small, lower efficiency, narrower bandwidth and detuning by nearby objects; a link budget from 0 dBm transmitted, minus about 60 dB of free-space loss at 10 metres and an illustrative body loss, to a received level above the receiver’s sensitivity, leaving a margin; a person’s body absorbing the signal while a wall reflects another path; and range as a probability rather than a fixed number.</desc>
