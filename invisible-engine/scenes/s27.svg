    <path d="M100,370 L592,370" stroke="#334155" stroke-width="2"/><path d="M100,362 L100,378 M592,362 L592,378 M223,364 L223,376" stroke="#334155" stroke-width="2"/>
    <text x="346" y="400" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#14213d">λ = c / f ≈ 12.3 cm</text>
    <text x="161" y="356" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#1e3a8a">λ/4 ≈ 3.1 cm</text>
    <circle cx="693" cy="305" r="50" fill="#0f172a" opacity="0.13"/><circle cx="690" cy="300" r="50" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="690" cy="300" r="31" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="690" y="380" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#334155">tag ≈ 3 cm</text>
  </g>
  <g data-f="2">
    <rect x="820" y="160" width="720" height="170" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="846" cy="190" r="18" fill="#b45309"/><text x="846" y="196" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="874" y="196" text-anchor="start" style="font-size:19px;font-weight:800;fill:#b45309">Small antennas compromise</text><text x="836" y="225" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="836" dy="0">Smaller than ideal → less efficient and narrower in frequency.</tspan><tspan x="836" dy="21">A hand, a bag or metal nearby detunes it. Designers trade</tspan><tspan x="836" dy="21">size, battery and range; there is no free lunch.</tspan></text>
  </g>
  <g data-f="3">
    <rect x="60" y="450" width="820" height="360" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="102" cy="494" r="26" fill="#334155"/><text x="102" y="503" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="142" y="504" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">Link budget (illustrative values)</text>
    <path d="M160,740 L874,740" stroke="#334155" stroke-width="2"/>
    <path d="M160,734 l0,12" stroke="#334155" stroke-width="2"/>
    <text x="160.0" y="766" text-anchor="middle" style="font-size:13.5px;font-weight:600;fill:#475569">-100</text>
