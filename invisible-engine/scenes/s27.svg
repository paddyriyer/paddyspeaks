    <path d="M1222,600 L1360,600" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4 8"/>
    <path d="M1004,618 L1190,668 L1362,628" class="a-signal" marker-end="url(#m-signal)"/>
  </g>
  <g data-f="5">
    <rect x="920" y="710" width="620" height="100" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="946" cy="740" r="18" fill="#0d9488"/><text x="946" y="746" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="974" y="746" text-anchor="start" style="font-size:19px;font-weight:800;fill:#0d9488">Range is a probability</text><text x="936" y="775" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">Same tag, same phone: metres one moment, nothing the next.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="106" y="866" class="s">Radio signal or wave</text>
    <text x="1540" y="866" class="note" text-anchor="end">dB values illustrative except free-space loss (calculated).</text>
  </g>
</svg>
