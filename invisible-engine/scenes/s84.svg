  <text x="60" y="50" class="k">SCENE 84</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The first 180 days: decide, fix, build in</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Each step has an owner. Each metric measures a capability, never a person.</text>
