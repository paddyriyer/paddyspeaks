  <g data-f="5">
    <rect x="60" y="655" width="715" height="160" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="84" y="699" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">HF · 13.56 MHz · near field</text>
    <text x="84" y="732" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Magnetic (inductive) coupling and load modulation.</text>
    <text x="84" y="758" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">λ ≈ 22 m, so a reader works deep inside λ/2π ≈ 3.5 m.</text>
    <text x="84" y="784" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Reads at centimetres to about a metre (vicinity tags).</text>
    <rect x="655.0" y="705.0" width="90" height="70" rx="18" class="coil"/>
    <rect x="664.0" y="714.0" width="72" height="52" rx="15" class="coil"/>
    <rect x="673.0" y="723.0" width="54" height="34" rx="12" class="coil"/>
    <rect x="815" y="655" width="725" height="160" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="839" y="699" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">UHF · 860–960 MHz · far field</text>
    <text x="839" y="732" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Radiative coupling; the tag replies by backscatter.</text>
    <text x="839" y="758" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">λ ≈ 33 cm: a tag a metre away is three wavelengths out.</text>
    <text x="839" y="784" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Reads at several metres (typical; varies widely).</text>
