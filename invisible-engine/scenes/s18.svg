  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 18</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Passive RFID: the warehouse dock door</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">The tag says only “I am number …”. The system works out where from which reader heard it, and when.</text>
