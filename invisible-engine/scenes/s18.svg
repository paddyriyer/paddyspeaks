    <rect x="1140" y="410" width="400" height="140" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="1166" cy="440" r="18" fill="#16a34a"/><text x="1166" y="446" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="1194" y="446" text-anchor="start" style="font-size:20px;font-weight:800;fill:#16a34a">An ID, not a location</text><text x="1156" y="476" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155"><tspan x="1156" dy="0">The tag sends only its number.</tspan><tspan x="1156" dy="21">“Where” is inferred: which reader</tspan><tspan x="1156" dy="21">heard it, and when.</tspan></text>
