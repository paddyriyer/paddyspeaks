<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 49: Same tag, two stories: a lost bag, or a person being followed</title>
  <desc>Five frames. 1, a lost bag: the owner sees their own bag on a map; this is the purpose of the network. 2, the same tag hidden in another person’s bag: the person carrying it is located and told nothing; the owner’s map now shows a person. 3, encryption cannot tell the stories apart: it protects the owner’s view in both. 4, protective alerts: a phone can warn the person a separated tag travels with, iPhone and Android alike through a shared specification, and a separated tag plays a sound when moved; alerts take time and need a compatible phone. 5, a safety note: disabling a tracker can alert the person who placed it; think about safety first and get support.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 49</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Same tag, two stories: a lost bag, or a person being followed</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">The mechanism that finds keys can also locate a person. Encryption cannot tell which.</text>
  <g data-f="1">
    <rect x="60" y="160" width="700" height="370" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <circle cx="100" cy="200" r="22" fill="#16a34a"/><text x="100" y="208" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#ffffff">1</text><text x="134" y="209" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">A lost bag</text>
    <path d="M156,290 L156,258 L204,258 L204,290" fill="none" stroke="#334155" stroke-width="4.8"/><rect x="125" y="297" width="120" height="152" rx="14" fill="#0f172a" opacity="0.13"/><rect x="120" y="290" width="120" height="152" rx="14" fill="#0e7490"/><path d="M156,301 L156,431" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4.0"/><path d="M180,301 L180,431" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4.0"/><path d="M204,301 L204,431" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4.0"/><circle cx="144" cy="452" r="9" fill="#334155"/><circle cx="216" cy="452" r="9" fill="#334155"/>
    <circle cx="253" cy="335" r="26" fill="#0f172a" opacity="0.13"/><circle cx="250" cy="330" r="26" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="250" cy="330" r="16" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="525" y="247" width="120" height="230" rx="20" fill="#0f172a" opacity="0.14"/><rect x="520" y="240" width="120" height="230" rx="20" fill="#111827"/><rect x="527" y="247" width="106" height="216" rx="16" fill="#ecfdf5"/><rect x="563" y="252" width="34" height="8" rx="4" fill="#111827"/>
    <path d="M580,380 C553,340 553,308 580,305 C607,308 607,340 580,380 Z" fill="#16a34a"/><circle cx="580" cy="329" r="9" fill="#ffffff"/>
    <text x="580" y="420" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">my bag</text>
    <text x="100" y="500" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">The owner finds their own bag. This is the network’s purpose.</text>
  </g>
  <g data-f="2">
    <rect x="840" y="160" width="700" height="370" rx="18" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <circle cx="880" cy="200" r="22" fill="#dc2626"/><text x="880" y="208" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#ffffff">2</text><text x="914" y="209" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">A tag hidden in someone’s bag</text>
    <circle cx="960" cy="273" r="23" fill="#64748b"/><path d="M928,383 L928,326 Q928,303 950,303 L970,303 Q992,303 992,326 L992,383 Z" fill="#64748b"/><rect x="935" y="375" width="19" height="84" rx="8" fill="#64748b"/><rect x="966" y="375" width="19" height="84" rx="8" fill="#64748b"/>
    <path d="M1037,330 L1037,306 L1073,306 L1073,330" fill="none" stroke="#334155" stroke-width="3.6"/><rect x="1015" y="337" width="90" height="114" rx="11" fill="#0f172a" opacity="0.13"/><rect x="1010" y="330" width="90" height="114" rx="11" fill="#475569"/><path d="M1037,338 L1037,436" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3.0"/><path d="M1055,338 L1055,436" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3.0"/><path d="M1073,338 L1073,436" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3.0"/><circle cx="1028" cy="451" r="7" fill="#334155"/><circle cx="1082" cy="451" r="7" fill="#334155"/>
    <rect x="1030" y="352" width="60" height="56" rx="10" class="hz"/>
    <circle cx="1063" cy="385" r="18" fill="#0f172a" opacity="0.13"/><circle cx="1060" cy="380" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="1060" cy="380" r="11" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1335" y="247" width="120" height="230" rx="20" fill="#0f172a" opacity="0.14"/><rect x="1330" y="240" width="120" height="230" rx="20" fill="#111827"/><rect x="1337" y="247" width="106" height="216" rx="16" fill="#fef2f2"/><rect x="1373" y="252" width="34" height="8" rx="4" fill="#111827"/>
    <path d="M1390,380 C1363,340 1363,308 1390,305 C1417,308 1417,340 1390,380 Z" fill="#dc2626"/><circle cx="1390" cy="329" r="9" fill="#ffffff"/>
    <text x="1390" y="420" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#991b1b">a person</text>
    <text x="880" y="500" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">The person carrying it is located and was never asked.</text>
  </g>
  <g data-f="3">
    <path d="M408,560 L408,549 a13,13 0 0 1 25,0 L434,560" fill="none" stroke="#7c3aed" stroke-width="4.9"/><rect x="400" y="560" width="42" height="34" rx="6" fill="#7c3aed"/><circle cx="421" cy="574" r="4" fill="#ffffff"/><rect x="419" y="575" width="4" height="10" fill="#ffffff"/><path d="M1188,560 L1188,549 a13,13 0 0 1 25,0 L1214,560" fill="none" stroke="#7c3aed" stroke-width="4.9"/><rect x="1180" y="560" width="42" height="34" rx="6" fill="#7c3aed"/><circle cx="1201" cy="574" r="4" fill="#ffffff"/><rect x="1199" y="575" width="4" height="10" fill="#ffffff"/>
    <rect x="460" y="548" width="680" height="96" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="486" cy="578" r="18" fill="#7c3aed"/><text x="486" y="584" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="514" y="584" text-anchor="start" style="font-size:18px;font-weight:800;fill:#7c3aed">Encryption cannot tell the stories apart</text><text x="476" y="612" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155"><tspan x="476" dy="0">It keeps the relay and strangers out — and protects an abusive</tspan><tspan x="476" dy="20">owner’s view exactly as well as a rightful owner’s.</tspan></text>
  </g>
  <g data-f="4">
    <rect x="60" y="664" width="700" height="150" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="86" cy="694" r="18" fill="#2563eb"/><text x="86" y="700" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="114" y="700" text-anchor="start" style="font-size:18px;font-weight:800;fill:#2563eb">Protective alerts — and their limits</text><text x="76" y="728" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155"><tspan x="76" dy="0">A phone can warn the person a separated tag travels with</tspan><tspan x="76" dy="20">(iPhone and Android, via one shared specification); a separated</tspan><tspan x="76" dy="20">tag sounds when moved. Alerts take time, need separation from</tspan><tspan x="76" dy="20">the owner and a compatible phone (Scene 52).</tspan></text>
  </g>
  <g data-f="5">
    <rect x="840" y="664" width="700" height="150" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="866" cy="694" r="18" fill="#b45309"/><text x="866" y="700" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="894" y="700" text-anchor="start" style="font-size:18px;font-weight:800;fill:#b45309">If you find a tracker: safety first</text><text x="856" y="728" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155"><tspan x="856" dy="0">Disabling it can alert the person who placed it, and stops</tspan><tspan x="856" dy="20">their location updates. Think about your safety first, and</tspan><tspan x="856" dy="20">consider contacting police or a support service before acting</tspan><tspan x="856" dy="20">(Module 7).</tspan></text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="60" y="852" width="34" height="18" rx="3" class="hz" style="stroke-width:3"/>
    <text x="106" y="866" class="s">Attacker zone / hazard</text>
    <text x="1540" y="866" class="note" text-anchor="end">Defensive framing only. No placement or evasion detail.</text>
  </g>
</svg>
