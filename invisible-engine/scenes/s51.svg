  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 51</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Two good goals that pull against each other</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Rotation hides a tag from strangers. Protection must still notice a tag that stays with you.</text>
  <g data-f="1">
    <rect x="60" y="160" width="560" height="300" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="102" cy="204" r="26" fill="#7c3aed"/><text x="102" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="142" y="214" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Owner privacy</text><text x="142" y="244" text-anchor="start" style="font-size:17px;font-weight:600;fill:#7c3aed">Strangers should not follow my tag</text>
    <rect x="84" y="284" width="150" height="40" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/><text x="159" y="310" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;font-weight:700;fill:#15803d">K1 · 2C9E</text><rect x="254" y="284" width="150" height="40" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/><text x="329" y="310" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;font-weight:700;fill:#15803d">K2 · A417</text><rect x="424" y="284" width="150" height="40" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/><text x="499" y="310" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;font-weight:700;fill:#15803d">K3 · 51D0</text>
    <text x="84" y="362" text-anchor="start" style="font-size:14px;font-weight:600;fill:#475569">café</text><text x="254" y="362" text-anchor="start" style="font-size:14px;font-weight:600;fill:#475569">station</text><text x="424" y="362" text-anchor="start" style="font-size:14px;font-weight:600;fill:#475569">office</text>
    <path d="M84,412 Q108,394 132,412 Q108,430 84,412 Z" fill="#ffffff" stroke="#334155" stroke-width="1.8"/><circle cx="108" cy="412" r="7" fill="#334155"/><text x="146" y="418" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">a passer-by sees unrelated values</text>
    <text x="84" y="446" text-anchor="start" style="font-size:15px;font-weight:700;fill:#6b21a8">only the owner’s key links them</text>
  </g>
  <g data-f="2">
    <rect x="980" y="160" width="560" height="300" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="1022" cy="204" r="26" fill="#0d9488"/><text x="1022" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="1062" y="214" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">The person carrying it</text><text x="1062" y="244" text-anchor="start" style="font-size:17px;font-weight:600;fill:#0d9488">A tag that stays with me should be noticed</text>
    <circle cx="1040" cy="279" r="17" fill="#64748b"/><path d="M1016,360 L1016,318 Q1016,301 1033,301 L1047,301 Q1064,301 1064,318 L1064,360 Z" fill="#64748b"/><rect x="1022" y="354" width="14" height="62" rx="6" fill="#64748b"/><rect x="1044" y="354" width="14" height="62" rx="6" fill="#64748b"/>
    <circle cx="1083" cy="365" r="14" fill="#0f172a" opacity="0.13"/><circle cx="1080" cy="360" r="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="1080" cy="360" r="9" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M1120,400 C1220,330 1320,440 1500,350" fill="none" stroke="#0d9488" stroke-width="3" stroke-dasharray="7 7"/>
    <circle cx="1180" cy="372" r="9" fill="#0d9488"/><text x="1180" y="354" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#0f766e">home</text>
    <circle cx="1330" cy="400" r="9" fill="#0d9488"/><text x="1330" y="430" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#0f766e">bus</text>
    <circle cx="1480" cy="356" r="9" fill="#0d9488"/><text x="1480" y="338" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#0f766e">office</text>
    <text x="1120" y="446" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">the same tag, again and again</text>
  </g>
  <g data-f="3">
    <path d="M800,330 L760,400 L840,400 Z" fill="#334155"/><path d="M660,330 L940,330" stroke="#334155" stroke-width="6" stroke-linecap="round"/><path d="M680,330 L660,372 M680,330 L700,372 M920,330 L900,372 M920,330 L940,372" stroke="#64748b" stroke-width="2"/><path d="M648,372 L712,372 M888,372 L952,372" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <text x="680" y="400" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#6b21a8">unlinkable</text><text x="920" y="400" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#0f766e">detectable</text>
    <text x="800" y="230" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#14213d">in tension</text><text x="800" y="262" text-anchor="middle" style="font-size:16px;font-weight:400;fill:#475569">tuned, not traded away</text>
  </g>
  <g data-f="4">
    <rect x="60" y="486" width="1480" height="208" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="102" cy="530" r="24" fill="#334155"/><text x="102" y="539" text-anchor="middle" style="font-size:25px;font-weight:800;fill:#ffffff">4</text><text x="140" y="539" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Design dials (illustrative)</text>
    <text x="110" y="590" text-anchor="start" style="font-size:16px;font-weight:700;fill:#14213d">Identifier rotation period</text><rect x="110" y="612" width="300" height="8" rx="4" fill="#cbd5e1"/><rect x="110" y="612" width="90" height="8" rx="4" fill="#64748b"/><circle cx="200" cy="616" r="12" fill="#ffffff" stroke="#334155" stroke-width="3"/><text x="110" y="650" text-anchor="start" style="font-size:13.5px;font-weight:400;fill:#475569">short: hard to follow</text><text x="410" y="650" text-anchor="end" style="font-size:13.5px;font-weight:400;fill:#475569">long: easy to link</text>
    <text x="472" y="590" text-anchor="start" style="font-size:16px;font-weight:700;fill:#14213d">When separated from owner</text><rect x="472" y="612" width="300" height="8" rx="4" fill="#cbd5e1"/><rect x="472" y="612" width="210" height="8" rx="4" fill="#64748b"/><circle cx="682" cy="616" r="12" fill="#ffffff" stroke="#334155" stroke-width="3"/><text x="472" y="650" text-anchor="start" style="font-size:13.5px;font-weight:400;fill:#475569">near owner: private</text><text x="772" y="650" text-anchor="end" style="font-size:13.5px;font-weight:400;fill:#475569">separated: findable</text>
    <text x="834" y="590" text-anchor="start" style="font-size:16px;font-weight:700;fill:#14213d">Sound when moved</text><rect x="834" y="612" width="300" height="8" rx="4" fill="#cbd5e1"/><rect x="834" y="612" width="225" height="8" rx="4" fill="#64748b"/><circle cx="1059" cy="616" r="12" fill="#ffffff" stroke="#334155" stroke-width="3"/><text x="834" y="650" text-anchor="start" style="font-size:13.5px;font-weight:400;fill:#475569">silent</text><text x="1134" y="650" text-anchor="end" style="font-size:13.5px;font-weight:400;fill:#475569">plays a sound</text>
    <text x="1196" y="590" text-anchor="start" style="font-size:16px;font-weight:700;fill:#14213d">Time together before an alert</text><rect x="1196" y="612" width="300" height="8" rx="4" fill="#cbd5e1"/><rect x="1196" y="612" width="135" height="8" rx="4" fill="#64748b"/><circle cx="1331" cy="616" r="12" fill="#ffffff" stroke="#334155" stroke-width="3"/><text x="1196" y="650" text-anchor="start" style="font-size:13.5px;font-weight:400;fill:#475569">short: early warning</text><text x="1496" y="650" text-anchor="end" style="font-size:13.5px;font-weight:400;fill:#475569">long: fewer false alarms</text>
  </g>
  <g data-f="5">
    <rect x="60" y="712" width="1480" height="104" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="102" cy="756" r="26" fill="#b45309"/><text x="102" y="765" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text><text x="142" y="766" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">A tension, not an impossibility</text>
    <text x="140" y="796" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">Every dial moves protection between the two goals. Designs give up some unlinkability mainly while a tag is away from its owner.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
  </g>
</svg>
