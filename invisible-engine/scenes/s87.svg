<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 87: What is observable, by whom</title>
  <desc>Four frames fill one table: eight observers against six things that could be observed. 1, a tap and a radio listener: a card reader sees the card number of a plastic card; an NFC phone touching a tag sees only what the owner chose to show; a radio listener sees only the rotating identifier. 2, a passer-by’s phone sees the identifier, its own location and the report it seals; the relay sees a lookup hash, the sealed report and metadata, never the location. 3, the owner decrypts the location; someone who planted a tag sees exactly what an owner sees — the location of the person carrying it. 4, an organisation’s admin: unknown, it depends on what is enrolled and shared; an outside attacker without the account sees only what a radio listener sees, unless they take over the account. Unknown is marked as a finding, not left blank.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 87</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">What is observable, by whom</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Same tag, eight observers. Unknown is a finding, not a blank.</text>
  <g>
    <rect x="60" y="160" width="1480" height="52" rx="10" fill="#f1f5f9"/>
    <text x="76" y="193" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">Observer</text>
    <text x="440.0" y="193" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">Card number</text>
    <text x="640.0" y="193" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">Rotating ID</text>
    <text x="840.0" y="193" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">Approx. location</text>
    <text x="1040.0" y="193" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">Who owns it</text>
    <text x="1240.0" y="193" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">Sealed report</text>
    <text x="1440.0" y="193" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">Service metadata</text>
  </g>
  <g data-f="1">
    <rect x="60" y="218" width="1480" height="54" rx="8" fill="#fbfaf7" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="252" text-anchor="start" style="font-size:15.5px;font-weight:700;fill:#14213d">A tap (reader or NFC phone)</text>
    <text x="440.0" y="252" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● card reader</text>
    <text x="640.0" y="252" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="840.0" y="252" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="1040.0" y="252" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#92400e">≈ owner’s choice</text>
    <text x="1240.0" y="252" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="1440.0" y="252" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <rect x="60" y="278" width="1480" height="54" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="312" text-anchor="start" style="font-size:15.5px;font-weight:700;fill:#14213d">Radio listener</text>
    <text x="440.0" y="312" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#94a3b8">—</text>
    <text x="640.0" y="312" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● hears it</text>
    <text x="840.0" y="312" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="1040.0" y="312" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="1240.0" y="312" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="1440.0" y="312" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
  </g>
  <g data-f="2">
    <rect x="60" y="338" width="1480" height="54" rx="8" fill="#fbfaf7" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="372" text-anchor="start" style="font-size:15.5px;font-weight:700;fill:#14213d">Passer-by’s phone</text>
    <text x="440.0" y="372" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#94a3b8">—</text>
    <text x="640.0" y="372" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● hears it</text>
    <text x="840.0" y="372" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● its own</text>
    <text x="1040.0" y="372" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="1240.0" y="372" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● seals it</text>
    <text x="1440.0" y="372" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● its uploads</text>
    <rect x="60" y="398" width="1480" height="54" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="432" text-anchor="start" style="font-size:15.5px;font-weight:700;fill:#14213d">Relay service</text>
    <text x="440.0" y="432" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#94a3b8">—</text>
    <text x="640.0" y="432" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#92400e">≈ hash only</text>
    <text x="840.0" y="432" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="1040.0" y="432" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#92400e">≈ who asks</text>
    <text x="1240.0" y="432" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● stores it</text>
    <text x="1440.0" y="432" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● yes</text>
  </g>
  <g data-f="3">
    <rect x="60" y="458" width="1480" height="54" rx="8" fill="#fbfaf7" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="492" text-anchor="start" style="font-size:15.5px;font-weight:700;fill:#14213d">The owner</text>
    <text x="440.0" y="492" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#94a3b8">—</text>
    <text x="640.0" y="492" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● derives it</text>
    <text x="840.0" y="492" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● decrypts</text>
    <text x="1040.0" y="492" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● themself</text>
    <text x="1240.0" y="492" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● fetches</text>
    <text x="1440.0" y="492" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● own account</text>
    <rect x="60" y="518" width="1480" height="54" rx="8" class="hz"/>
    <text x="76" y="552" text-anchor="start" style="font-size:15.5px;font-weight:700;fill:#14213d">Someone who planted a tag</text>
    <text x="440.0" y="552" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#94a3b8">—</text>
    <text x="640.0" y="552" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● derives it</text>
    <text x="840.0" y="552" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● the carrier’s</text>
    <text x="1040.0" y="552" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● themself</text>
    <text x="1240.0" y="552" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● fetches</text>
    <text x="1440.0" y="552" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● own account</text>
  </g>
  <g data-f="4">
    <rect x="60" y="578" width="1480" height="54" rx="8" fill="#fbfaf7" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="612" text-anchor="start" style="font-size:15.5px;font-weight:700;fill:#14213d">An organisation’s admin</text>
    <text x="440.0" y="612" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#94a3b8">—</text>
    <text x="640.0" y="612" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#374151">? unknown</text>
    <text x="840.0" y="612" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#374151">? unknown</text>
    <text x="1040.0" y="612" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#374151">? unknown</text>
    <text x="1240.0" y="612" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="1440.0" y="612" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#374151">? unknown</text>
    <rect x="60" y="638" width="1480" height="54" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="672" text-anchor="start" style="font-size:15.5px;font-weight:700;fill:#14213d">Outside attacker</text>
    <text x="440.0" y="672" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#94a3b8">—</text>
    <text x="640.0" y="672" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● if nearby</text>
    <text x="840.0" y="672" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no*</text>
    <text x="1040.0" y="672" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no*</text>
    <text x="1240.0" y="672" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no*</text>
    <text x="1440.0" y="672" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="60" y="718" text-anchor="start" style="font-size:15px;font-weight:600;fill:#991b1b">* unless they take over the owner’s account (Scene 48) — then they see what the owner sees.</text>
    <text x="60" y="746" text-anchor="start" style="font-size:15px;font-weight:400;fill:#475569">● yes   ○ no   ≈ metadata or partial   ? unknown: depends on what an organisation enrols and shares   — not involved</text>
    <text x="60" y="774" text-anchor="start" style="font-size:15px;font-weight:400;fill:#475569">Tracker rows follow Apple’s documented Find My design and agree with Scene 46 and demo D. A plastic card sends its number;</text>
    <text x="60" y="796" text-anchor="start" style="font-size:15px;font-weight:400;fill:#475569">a phone wallet sends a device token instead (Scene 16).</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="60" y="852" width="34" height="18" rx="3" class="hz" style="stroke-width:3"/>
    <text x="106" y="866" class="s">Attacker zone / hazard</text>
  </g>
</svg>
