<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 59: Complex amplitudes: arrows with a length and an angle</title>
  <desc>Four frames, labelled quantum amplitude mathematics. 1, the complex plane with real and imaginary axes and a unit circle; an arrow at angle phi is e to the i phi, equal to cos phi plus i sin phi. 2, the arrow at 0, 90, 180 and 270 degrees is 1, i, minus 1 and minus i. 3, measuring in the 0 or 1 basis gives probabilities equal to the squared length of each amplitude, so the angle alone is not something you read. 4, global phase: turning both parts of a state by the same angle changes nothing any experiment can detect; relative phase: turning one part against the other changes what interference does next (Scene 63).</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 59</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Complex amplitudes: arrows with a length and an angle</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Amplitudes behave like arrows: they can point any way, and they add like arrows.</text>
  <g data-f="1">
    <rect x="1150" y="116" width="303" height="30" rx="15" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1301.3" y="136" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:14px;font-weight:700;fill:#7c3aed">QUANTUM AMPLITUDE MATHEMATICS</text>
    <rect x="60" y="160" width="640" height="650" rx="18" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
    <circle cx="380" cy="470" r="210" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/><path d="M140,470 L620,470 M380,710 L380,230" stroke="#94a3b8" stroke-width="1.5"/><text x="640" y="475" text-anchor="start" style="font-size:15px;font-weight:700;fill:#475569">Re</text><text x="396" y="214" text-anchor="start" style="font-size:15px;font-weight:700;fill:#475569">Im</text>
    <path d="M440,470 A60,60 0 0 0 418.6,424.0" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <text x="452" y="448" text-anchor="start" style="font-size:20px;font-weight:800;fill:#b45309">φ</text>
    <path d="M380,470 L515.0,309.1" stroke="#7c3aed" stroke-width="4"/><path d="M515.0,309.1 L511.3,324.4 L500.6,315.4 Z" fill="#7c3aed"/>
    <text x="84" y="200" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:800;fill:#7c3aed">e^(iφ) = cos φ + i·sin φ</text>
    <text x="84" y="228" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">length 1, angle φ</text>
  </g>
  <g data-f="2">
    <path d="M380,470 L590.0,470.0" stroke="#64748b" stroke-width="4" opacity="0.35"/><path d="M590.0,470.0 L576.0,477.0 L576.0,463.0 Z" fill="#64748b" opacity="0.35"/><text x="616.0" y="476.0" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#64748b">1</text>
    <path d="M380,470 L380.0,260.0" stroke="#64748b" stroke-width="4" opacity="0.35"/><path d="M380.0,260.0 L387.0,274.0 L373.0,274.0 Z" fill="#64748b" opacity="0.35"/><text x="380.0" y="240.0" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#64748b">i</text>
    <path d="M380,470 L170.0,470.0" stroke="#64748b" stroke-width="4" opacity="0.35"/><path d="M170.0,470.0 L184.0,463.0 L184.0,477.0 Z" fill="#64748b" opacity="0.35"/><text x="144.0" y="475.99999999999994" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#64748b">−1</text>
    <path d="M380,470 L380.0,680.0" stroke="#64748b" stroke-width="4" opacity="0.35"/><path d="M380.0,680.0 L373.0,666.0 L387.0,666.0 Z" fill="#64748b" opacity="0.35"/><text x="379.99999999999994" y="712.0" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#64748b">−i</text>
    <text x="84" y="786" text-anchor="start" style="font-size:15px;font-weight:400;fill:#475569">Turning the arrow by 180° gives −1: same length, opposite direction.</text>
  </g>
  <g data-f="3">
    <rect x="740" y="160" width="800" height="160" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="766" cy="190" r="18" fill="#7c3aed"/><text x="766" y="196" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="794" y="196" text-anchor="start" style="font-size:20px;font-weight:800;fill:#7c3aed">Phase is not something you read off</text><text x="756" y="226" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155"><tspan x="756" dy="0">Measuring a qubit as 0 or 1 gives probabilities equal to the squared</tspan><tspan x="756" dy="21">length of each amplitude: |amplitude|². The length sets them;</tspan><tspan x="756" dy="21">the angle alone does not show up in that measurement.</tspan></text>
  </g>
  <g data-f="4">
    <rect x="740" y="380" width="800" height="430" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="782" cy="424" r="26" fill="#334155"/><text x="782" y="433" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text><text x="822" y="434" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Global phase and relative phase</text>
    <text x="770" y="476" text-anchor="start" style="font-size:15.5px;font-weight:800;fill:#14213d">Global: both parts turn together</text>
    <text x="770" y="565" text-anchor="start" style="font-size:14px;font-weight:600;fill:#475569">before</text>
    <circle cx="890" cy="560" r="46" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M890,560 L924.5,560.0" stroke="#7c3aed" stroke-width="4"/><path d="M924.5,560.0 L910.5,567.0 L910.5,553.0 Z" fill="#7c3aed"/>
    <text x="890" y="504" text-anchor="middle" style="font-size:13.5px;font-weight:600;fill:#475569">|0⟩ part</text>
    <circle cx="1020" cy="560" r="46" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M1020,560 L1054.5,560.0" stroke="#7c3aed" stroke-width="4"/><path d="M1054.5,560.0 L1040.5,567.0 L1040.5,553.0 Z" fill="#7c3aed"/>
    <text x="1020" y="504" text-anchor="middle" style="font-size:13.5px;font-weight:600;fill:#475569">|1⟩ part</text>
    <text x="770" y="695" text-anchor="start" style="font-size:14px;font-weight:600;fill:#475569">after</text>
    <circle cx="890" cy="690" r="46" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M890,690 L907.2,660.1" stroke="#7c3aed" stroke-width="4"/><path d="M907.2,660.1 L906.3,675.7 L894.2,668.7 Z" fill="#7c3aed"/>
    <circle cx="1020" cy="690" r="46" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M1020,690 L1037.2,660.1" stroke="#7c3aed" stroke-width="4"/><path d="M1037.2,660.1 L1036.3,675.7 L1024.2,668.7 Z" fill="#7c3aed"/>
    <text x="770" y="790" text-anchor="start" style="font-size:15px;font-weight:700;fill:#334155">No experiment can tell these apart.</text>
    <text x="1160" y="476" text-anchor="start" style="font-size:15.5px;font-weight:800;fill:#14213d">Relative: one part turns against the other</text>
    <text x="1160" y="565" text-anchor="start" style="font-size:14px;font-weight:600;fill:#475569">before</text>
    <circle cx="1280" cy="560" r="46" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M1280,560 L1314.5,560.0" stroke="#7c3aed" stroke-width="4"/><path d="M1314.5,560.0 L1300.5,567.0 L1300.5,553.0 Z" fill="#7c3aed"/>
    <text x="1280" y="504" text-anchor="middle" style="font-size:13.5px;font-weight:600;fill:#475569">|0⟩ part</text>
    <circle cx="1410" cy="560" r="46" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M1410,560 L1444.5,560.0" stroke="#7c3aed" stroke-width="4"/><path d="M1444.5,560.0 L1430.5,567.0 L1430.5,553.0 Z" fill="#7c3aed"/>
    <text x="1410" y="504" text-anchor="middle" style="font-size:13.5px;font-weight:600;fill:#475569">|1⟩ part</text>
    <text x="1160" y="695" text-anchor="start" style="font-size:14px;font-weight:600;fill:#475569">after</text>
    <circle cx="1280" cy="690" r="46" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M1280,690 L1314.5,690.0" stroke="#7c3aed" stroke-width="4"/><path d="M1314.5,690.0 L1300.5,697.0 L1300.5,683.0 Z" fill="#7c3aed"/>
    <circle cx="1410" cy="690" r="46" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M1410,690 L1375.5,690.0" stroke="#7c3aed" stroke-width="4"/><path d="M1375.5,690.0 L1389.5,683.0 L1389.5,697.0 Z" fill="#7c3aed"/>
    <text x="1160" y="790" text-anchor="start" style="font-size:15px;font-weight:700;fill:#7c3aed">This changes what interference does next.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Purple: quantum amplitudes (mathematics, not something you can see).</text>
  </g>
</svg>
