<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 08: The wireless map: what each technology is for</title>
  <desc>Three frames revealing rows of a comparison table: radio-frequency identification families; near-field communication, Bluetooth Low Energy and Ultra Wideband; then Wi-Fi and cellular positioning and satellite navigation. Columns give power source, band, real job, typical range and a privacy note.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 08</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The wireless map: what each technology is for</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Only the last two rows answer “where on Earth?” — for the device doing the receiving.</text>
  <g>
    <rect x="60" y="160" width="1480" height="48" rx="10" fill="#0f172a"/>
    <text x="140" y="192" text-anchor="start" style="font-size:18px;font-weight:800;fill:#ffffff">Technology</text>
    <text x="400" y="192" text-anchor="start" style="font-size:18px;font-weight:800;fill:#ffffff">Power</text>
    <text x="590" y="192" text-anchor="start" style="font-size:18px;font-weight:800;fill:#ffffff">Band</text>
    <text x="800" y="192" text-anchor="start" style="font-size:18px;font-weight:800;fill:#ffffff">Real job</text>
    <text x="1110" y="192" text-anchor="start" style="font-size:18px;font-weight:800;fill:#ffffff">Range (typical)</text>
    <text x="1310" y="192" text-anchor="start" style="font-size:18px;font-weight:800;fill:#ffffff">Privacy note</text>
  </g>
  <g data-f="1">
    <rect x="60" y="214" width="1480" height="66" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <circle cx="100" cy="247" r="18" fill="#b45309"/>
    <text x="140" y="254" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">LF / HF RFID</text>
    <text x="400" y="254" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">reader field</text>
    <text x="590" y="254" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">125 kHz · 13.56 MHz</text>
    <text x="800" y="254" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">identify at a reader</text>
    <text x="1110" y="254" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">cm</text>
    <text x="1310" y="254" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">fixed IDs can be read</text>
    <rect x="60" y="285" width="1480" height="66" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <circle cx="100" cy="318" r="18" fill="#b45309"/>
    <text x="140" y="325" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">UHF RFID</text>
    <text x="400" y="325" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">reader field</text>
    <text x="590" y="325" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">~860–960 MHz</text>
    <text x="800" y="325" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">inventory at portals</text>
    <text x="1110" y="325" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">up to metres</text>
    <text x="1310" y="325" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">may outlive the sale</text>
    <rect x="60" y="356" width="1480" height="66" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <circle cx="100" cy="389" r="18" fill="#b45309"/>
    <text x="140" y="396" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Active RFID</text>
    <text x="400" y="396" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">battery</text>
    <text x="590" y="396" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">433 MHz / 2.4 GHz</text>
    <text x="800" y="396" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">site asset tracking</text>
    <text x="1110" y="396" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">tens of m</text>
    <text x="1310" y="396" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">on-site beacon</text>
  </g>
  <g data-f="2">
    <rect x="60" y="427" width="1480" height="66" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <circle cx="100" cy="460" r="18" fill="#ea580c"/>
    <text x="140" y="467" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">NFC</text>
    <text x="400" y="467" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">reader field (tags)</text>
    <text x="590" y="467" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">13.56 MHz</text>
    <text x="800" y="467" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">tap: pay, access, read</text>
    <text x="1110" y="467" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">a few cm</text>
    <text x="1310" y="467" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">readable by tap</text>
    <rect x="60" y="498" width="1480" height="66" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="100" cy="531" r="18" fill="#2563eb"/>
    <text x="140" y="538" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Bluetooth LE</text>
    <text x="400" y="538" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">battery</text>
    <text x="590" y="538" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">2.4 GHz</text>
    <text x="800" y="538" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">presence, data, beacons</text>
    <text x="1110" y="538" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">~1 to tens of m</text>
    <text x="1310" y="538" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">IDs must rotate</text>
    <rect x="60" y="569" width="1480" height="66" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <circle cx="100" cy="602" r="18" fill="#7c3aed"/>
    <text x="140" y="609" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">UWB</text>
    <text x="400" y="609" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">battery</text>
    <text x="590" y="609" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">~6.5 / 8 GHz</text>
    <text x="800" y="609" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">distance + direction</text>
    <text x="1110" y="609" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">up to tens of m</text>
    <text x="1310" y="609" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">precise, but local</text>
  </g>
  <g data-f="3">
    <rect x="60" y="640" width="1480" height="66" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
    <circle cx="100" cy="673" r="18" fill="#0d9488"/>
    <text x="140" y="680" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Wi-Fi / cell position</text>
    <text x="400" y="680" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">phone battery</text>
    <text x="590" y="680" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">Wi-Fi · cellular</text>
    <text x="800" y="680" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">phone finds itself</text>
    <text x="1110" y="680" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">building to city</text>
    <text x="1310" y="680" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">databases from phones</text>
    <rect x="60" y="711" width="1480" height="66" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="100" cy="744" r="18" fill="#16a34a"/>
    <text x="140" y="751" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">GNSS (GPS etc.)</text>
    <text x="400" y="751" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">receiver battery</text>
    <text x="590" y="751" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">~1.2–1.6 GHz</text>
    <text x="800" y="751" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">receiver finds itself</text>
    <text x="1110" y="751" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">global, outdoors</text>
    <text x="1310" y="751" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">only if reported</text>
    <text x="60" y="815" text-anchor="start" style="font-style:italic;font-size:16px;font-weight:400;fill:#475569">Ranges are typical working distances, not limits: antennas, power, bodies, walls and rules move them.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
  </g>
</svg>
