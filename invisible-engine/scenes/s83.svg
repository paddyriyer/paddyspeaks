  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 83</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">A tracker safety policy that protects people without watching them</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">The aim is a safe person, not a watched one.</text>
  <g data-f="1">
    <rect x="60" y="158" width="490" height="310" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="96" cy="198" r="22" fill="#2563eb"/><text x="96" y="206" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#ffffff">1</text><text x="130" y="206" text-anchor="start" style="font-size:21px;font-weight:800;fill:#2563eb">Notices</text>
    <text x="84" y="266" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">Visitors and staff are told: company</text><text x="84" y="298" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">tags locate assets, never people.</text><text x="84" y="330" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">How to report a tag that is not theirs.</text>
    <text x="84" y="394" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#475569">Who does it</text>
    <rect x="84" y="408" width="108" height="26" rx="13" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="138.0" y="426" text-anchor="middle" style="font-size:13.5px;font-weight:700;fill:#2563eb">facilities</text><rect x="200.0" y="408" width="92" height="26" rx="13" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="245.8" y="426" text-anchor="middle" style="font-size:13.5px;font-weight:700;fill:#2563eb">security</text><rect x="299.6" y="408" width="67" height="26" rx="13" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="333.1" y="426" text-anchor="middle" style="font-size:13.5px;font-weight:700;fill:#2563eb">comms</text>
  </g>
  <g data-f="2">
    <rect x="570" y="158" width="490" height="310" rx="14" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <circle cx="606" cy="198" r="22" fill="#0d9488"/><text x="606" y="206" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#ffffff">2</text><text x="640" y="206" text-anchor="start" style="font-size:21px;font-weight:800;fill:#0d9488">Executive travel</text>
    <text x="594" y="266" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">Briefings before trips. Bag and</text><text x="594" y="298" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">vehicle checks offered, with consent.</text><text x="594" y="330" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">Alerts left on the phones they carry.</text>
    <text x="594" y="394" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#475569">Who does it</text>
    <rect x="594" y="408" width="149" height="26" rx="13" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="668.5" y="426" text-anchor="middle" style="font-size:13.5px;font-weight:700;fill:#0d9488">travel security</text>
  </g>
  <g data-f="3">
    <rect x="60" y="488" width="490" height="310" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <circle cx="96" cy="528" r="22" fill="#b45309"/><text x="96" y="536" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#ffffff">3</text><text x="130" y="536" text-anchor="start" style="font-size:21px;font-weight:800;fill:#b45309">Discreet escalation</text>
    <text x="84" y="596" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">A private route to security and HR.</text><text x="84" y="628" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">No public naming. Safety first:</text><text x="84" y="660" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">disabling can alert whoever placed it.</text>
    <text x="84" y="724" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#475569">Who does it</text>
    <rect x="84" y="738" width="92" height="26" rx="13" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="129.8" y="756" text-anchor="middle" style="font-size:13.5px;font-weight:700;fill:#b45309">security</text><rect x="183.6" y="738" width="44" height="26" rx="13" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="205.6" y="756" text-anchor="middle" style="font-size:13.5px;font-weight:700;fill:#b45309">HR</text>
  </g>
  <g data-f="4">
    <rect x="570" y="488" width="490" height="310" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <circle cx="606" cy="528" r="22" fill="#16a34a"/><text x="606" y="536" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#ffffff">4</text><text x="640" y="536" text-anchor="start" style="font-size:21px;font-weight:800;fill:#16a34a">Support and due process</text>
    <text x="594" y="596" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">Advocate referral, time, practical help.</text><text x="594" y="628" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">Fair investigation with legal review.</text><text x="594" y="660" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">Nobody confronts on the person’s behalf.</text>
    <text x="594" y="724" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#475569">Who does it</text>
    <rect x="594" y="738" width="44" height="26" rx="13" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="616.0" y="756" text-anchor="middle" style="font-size:13.5px;font-weight:700;fill:#16a34a">HR</text><rect x="646" y="738" width="67" height="26" rx="13" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="679.5" y="756" text-anchor="middle" style="font-size:13.5px;font-weight:700;fill:#16a34a">legal</text>
  </g>
  <g data-f="5">
    <rect x="1100" y="158" width="440" height="640" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="1124" y="200" text-anchor="start" style="font-size:21px;font-weight:800;fill:#991b1b">What it must not do</text>
    <path d="M1440,186 Q1476,159 1512,186 Q1476,213 1440,186 Z" fill="#ffffff" stroke="#991b1b" stroke-width="2.7"/><circle cx="1476" cy="186" r="11" fill="#991b1b"/>
    <path d="M1434,170 L1516,204" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
    <circle cx="1138" cy="264" r="13" fill="#dc2626"/><path d="M1133,259 L1143,269 M1143,259 L1133,269" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><text x="1164" y="270" text-anchor="start" style="font-size:16.5px;font-weight:600;fill:#1f2937">Track where staff go,</text><text x="1164" y="296" text-anchor="start" style="font-size:16.5px;font-weight:600;fill:#1f2937">all the time</text>
    <circle cx="1138" cy="356" r="13" fill="#dc2626"/><path d="M1133,351 L1143,361 M1143,351 L1133,361" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><text x="1164" y="362" text-anchor="start" style="font-size:16.5px;font-weight:600;fill:#1f2937">Scan people constantly</text><text x="1164" y="388" text-anchor="start" style="font-size:16.5px;font-weight:600;fill:#1f2937">for radio signals</text>
    <circle cx="1138" cy="448" r="13" fill="#dc2626"/><path d="M1133,443 L1143,453 M1143,443 L1133,453" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><text x="1164" y="454" text-anchor="start" style="font-size:16.5px;font-weight:600;fill:#1f2937">Read personal phones</text><text x="1164" y="480" text-anchor="start" style="font-size:16.5px;font-weight:600;fill:#1f2937">or personal accounts</text>
    <circle cx="1138" cy="540" r="13" fill="#dc2626"/><path d="M1133,535 L1143,545 M1143,535 L1133,545" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><text x="1164" y="546" text-anchor="start" style="font-size:16.5px;font-weight:600;fill:#1f2937">Call any of this</text><text x="1164" y="572" text-anchor="start" style="font-size:16.5px;font-weight:600;fill:#1f2937">“privacy protection”</text>
    <rect x="1120" y="636" width="400" height="144" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
    <text x="1138" y="670" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">If any scanning: restricted</text><text x="1138" y="696" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">areas only, data minimised, after</text><text x="1138" y="722" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">legal and works-council review.</text>
    <rect x="1138" y="744" width="67" height="26" rx="13" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="1171.5" y="762" text-anchor="middle" style="font-size:13.5px;font-weight:700;fill:#dc2626">legal</text><rect x="1213.0" y="744" width="92" height="26" rx="13" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="1258.8" y="762" text-anchor="middle" style="font-size:13.5px;font-weight:700;fill:#dc2626">security</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Policy outline, not legal advice. Follow local law and labour rules.</text>
  </g>
