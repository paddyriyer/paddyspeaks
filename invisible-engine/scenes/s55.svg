<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 55: Proportionate protection: who can do what</title>
  <desc>Five frames build a table of mitigations against five who-columns: a person, a household, an employer, the vendor and standards bodies. A filled dot means implements, a ring means supports. 1, consent before sharing a location, and regular reviews of who sees your location or items, are mainly for the person and household. 2, hardening accounts with two-factor authentication, trusted-device reviews and recovery contacts: person and employer. 3, anti-abuse controls built into the product — alerts, a sound when moved, serial and NFC information, one account per tag: the vendor, supported by standards. 4, minimising metadata and standards with responsible disclosure: vendors and standards bodies. 5, a note that proportionate means the smallest control that addresses the risk, chosen with the person it protects.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 55</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Proportionate protection: who can do what</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Each control has an owner. Proportionate means fitting the control to the risk — never watching the person you protect.</text>
  <g>
    <rect x="60" y="156" width="1480" height="52" rx="10" fill="#f1f5f9"/>
    <text x="84" y="189" text-anchor="start" style="font-size:17px;font-weight:800;fill:#14213d">Mitigation</text>
    <text x="784" y="189" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#14213d">Person</text>
    <text x="952" y="189" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#14213d">Household</text>
    <text x="1120" y="189" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#14213d">Employer</text>
    <text x="1288" y="189" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#14213d">Vendor</text>
    <text x="1456" y="189" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#14213d">Standards</text>
  </g>
  <g data-f="1">
    <rect x="60" y="214" width="1480" height="78" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="84" y="247" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Consent before sharing a location</text><text x="84" y="273" text-anchor="start" style="font-size:15px;font-weight:400;fill:#475569">Ask and agree openly; write down how to stop</text>
    <circle cx="784" cy="253" r="12" fill="#16a34a"/>
    <circle cx="952" cy="253" r="12" fill="#16a34a"/>
    <circle cx="1120" cy="253" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <circle cx="1288" cy="253" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <path d="M1447,253 L1465,253" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="60" y="298" width="1480" height="78" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="84" y="331" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Review who sees your location or items</text><text x="84" y="357" text-anchor="start" style="font-size:15px;font-weight:400;fill:#475569">For example Safety Check on iPhone</text>
    <circle cx="784" cy="337" r="12" fill="#16a34a"/>
    <circle cx="952" cy="337" r="12" fill="#16a34a"/>
    <path d="M1111,337 L1129,337" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="1288" cy="337" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <path d="M1447,337 L1465,337" stroke="#cbd5e1" stroke-width="3"/>
  </g>
  <g data-f="2">
    <rect x="60" y="382" width="1480" height="78" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="84" y="415" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Harden accounts</text><text x="84" y="441" text-anchor="start" style="font-size:15px;font-weight:400;fill:#475569">Two-factor, trusted devices, recovery contacts</text>
    <circle cx="784" cy="421" r="12" fill="#16a34a"/>
    <circle cx="952" cy="421" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <circle cx="1120" cy="421" r="12" fill="#16a34a"/>
    <circle cx="1288" cy="421" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <path d="M1447,421 L1465,421" stroke="#cbd5e1" stroke-width="3"/>
  </g>
  <g data-f="3">
    <rect x="60" y="466" width="1480" height="78" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="84" y="499" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Anti-abuse controls in the product</text><text x="84" y="525" text-anchor="start" style="font-size:15px;font-weight:400;fill:#475569">Alerts, sound when moved, serial and NFC info, one account per tag</text>
    <path d="M775,505 L793,505" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M943,505 L961,505" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M1111,505 L1129,505" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="1288" cy="505" r="12" fill="#16a34a"/>
    <circle cx="1456" cy="505" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  </g>
  <g data-f="4">
    <rect x="60" y="550" width="1480" height="78" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="84" y="583" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Minimise metadata</text><text x="84" y="609" text-anchor="start" style="font-size:15px;font-weight:400;fill:#475569">Keep less, for less time; aggregate where possible</text>
    <path d="M775,589 L793,589" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M943,589 L961,589" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="1120" cy="589" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <circle cx="1288" cy="589" r="12" fill="#16a34a"/>
    <circle cx="1456" cy="589" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <rect x="60" y="634" width="1480" height="78" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="84" y="667" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Standards and responsible disclosure</text><text x="84" y="693" text-anchor="start" style="font-size:15px;font-weight:400;fill:#475569">Cross-platform alert specifications; report flaws privately first</text>
    <circle cx="784" cy="673" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <path d="M943,673 L961,673" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M1111,673 L1129,673" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="1288" cy="673" r="12" fill="#16a34a"/>
    <circle cx="1456" cy="673" r="12" fill="#16a34a"/>
  </g>
  <g data-f="5">
    <rect x="60" y="726" width="1480" height="90" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="102" cy="770" r="26" fill="#16a34a"/><text x="102" y="779" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text><text x="142" y="780" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">Proportionate</text>
    <circle cx="330" cy="774" r="12" fill="#16a34a"/><text x="350" y="780" text-anchor="start" style="font-size:15px;font-weight:600;fill:#334155">implements</text><circle cx="470" cy="774" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="490" y="780" text-anchor="start" style="font-size:15px;font-weight:600;fill:#334155">supports</text>
    <text x="610" y="780" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">The smallest control that addresses the risk, chosen with the person it protects.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Who-columns are illustrative; organisations differ.</text>
  </g>
</svg>
