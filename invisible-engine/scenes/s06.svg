<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 06: An energy budget: sleep, a short burst, sleep again</title>
  <desc>Four frames. A plot of current against time with a low sleep current and short radio bursts; the duty cycle as active time over period; the average-current formula; and an illustrative coin-cell lifetime estimate with its assumptions. All numbers are illustrative, not any product.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 06</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">An energy budget: sleep, a short burst, sleep again</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">A tiny average comes from being asleep almost all the time. All values illustrative.</text>
  <g data-f="1">
    <rect x="60" y="160" width="1060" height="460" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="102" cy="204" r="26" fill="#334155"/><text x="102" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="142" y="214" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Current over time</text>
    <line x1="130" y1="560" x2="1080" y2="560" stroke="#334155" stroke-width="3"/><line x1="130" y1="560" x2="130" y2="240" stroke="#334155" stroke-width="3"/>
    <text x="120" y="256" text-anchor="end" style="font-size:15px;font-weight:600;fill:#475569">current</text>
    <text x="1080" y="592" text-anchor="end" style="font-size:15px;font-weight:600;fill:#475569">time →</text>
    <path d="M130,540 L330,540 L330,280 L346,280 L346,540 L660,540 L660,280 L676,280 L676,540 L990,540 L990,280 L1006,280 L1006,540 L1080,540" fill="none" stroke="#c2410c" stroke-width="4"/>
    <text x="230" y="528" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#9a3412">sleep (µA)</text>
    <text x="338" y="268" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#9a3412">radio burst (mA)</text>
  </g>
  <g data-f="2">
    <path d="M330,578 L330,590 L660,590 L660,578" fill="none" stroke="#14213d" stroke-width="2"/>
    <rect x="1160" y="160" width="380" height="140" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="1186" cy="190" r="18" fill="#2563eb"/><text x="1186" y="196" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="1214" y="196" text-anchor="start" style="font-size:20px;font-weight:800;fill:#2563eb">Duty cycle</text><text x="1176" y="226" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155"><tspan x="1176" dy="0">D = t_on / T</tspan><tspan x="1176" dy="22">active time ÷ period</tspan></text>
    <text x="495" y="610" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#14213d">period T</text>
  </g>
  <g data-f="3">
    <rect x="1160" y="320" width="380" height="160" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="1186" cy="350" r="18" fill="#7c3aed"/><text x="1186" y="356" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="1214" y="356" text-anchor="start" style="font-size:20px;font-weight:800;fill:#7c3aed">Average current</text><text x="1176" y="386" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155"><tspan x="1176" dy="0">I_avg ≈ D·I_active</tspan><tspan x="1176" dy="22">        + (1 − D)·I_sleep</tspan><tspan x="1176" dy="22">ignores wake overhead, sensors</tspan></text>
  </g>
  <g data-f="4">
    <circle cx="1260" cy="600" r="70" fill="#e5e7eb" stroke="#6b7280" stroke-width="4"/><circle cx="1260" cy="600" r="56" fill="none" stroke="#9ca3af" stroke-width="2"/><text x="1260" y="606" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#374151">CR2032</text>
    <rect x="60" y="640" width="1060" height="170" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="86" cy="670" r="18" fill="#b45309"/><text x="86" y="676" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="114" y="676" text-anchor="start" style="font-size:20px;font-weight:800;fill:#b45309">Illustrative only — not a product</text><text x="76" y="706" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155"><tspan x="76" dy="0">8 mA for 2 ms every 1 s, and 2 µA asleep:  D = 0.002  →  I_avg ≈ 16 µA + 2 µA ≈ 18 µA</tspan><tspan x="76" dy="22">220 mAh ÷ 0.018 mA ≈ 12,000 h ≈ 1.4 years — before temperature, self-discharge,</tspan><tspan x="76" dy="22">pulse-capacity limits and everything else the device does.</tspan></text>
    <text x="1350" y="590" text-anchor="start" style="font-size:18px;font-weight:800;fill:#334155">220 mAh</text>
    <text x="1350" y="616" text-anchor="start" style="font-size:16px;font-weight:400;fill:#475569">nominal</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Illustrative values, not a measured product.</text>
  </g>
</svg>
