<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 85: The whole engine on one map</title>
  <desc>Five frames build one map in three zones by distance: touch (centimetres), radio (metres) and the internet (anywhere), over two bands for cryptography and governance. 1, in the touch zone a payment terminal powers a card through its field and the two exchange commands and replies. 2, in the radio zone a small tag broadcasts a rotating key, a passer-by’s phone overhears it and sends a sealed report over the internet to a relay, which stores it without being able to read it; the owner’s phone fetches and opens it. 3, the owner standing nearby measures distance and direction to the tag with ultra-wideband, and a finder who touches the tag with an NFC phone sees a web page, not a location; NFC never reaches the relay. 4, the account service links the tag to one owner and decides who may fetch reports or share; these are permissions, not data. 5, two bands under the map: cryptography and its move to post-quantum algorithms, and privacy and governance.</desc>
