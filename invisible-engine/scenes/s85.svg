  <text x="60" y="50" class="k">SCENE 85</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The whole engine on one map</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Each technology in its own layer. Nothing touches the cloud by NFC; nothing finds a tag by satellite.</text>
