  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 78</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Three clocks: shelf life, migration time, and the unknown</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">No Q-day dates here. Ask how long data must stay secret, and how long change will take.</text>
  <g data-f="1">
    <circle cx="210" cy="300" r="90" fill="#ffffff" stroke="#2563eb" stroke-width="5"/><path d="M210.0,220.0 L210.0,213.0" stroke="#2563eb" stroke-width="2"/><path d="M250.0,230.7 L253.5,224.7" stroke="#2563eb" stroke-width="2"/><path d="M279.3,260.0 L285.3,256.5" stroke="#2563eb" stroke-width="2"/><path d="M290.0,300.0 L297.0,300.0" stroke="#2563eb" stroke-width="2"/><path d="M279.3,340.0 L285.3,343.5" stroke="#2563eb" stroke-width="2"/><path d="M250.0,369.3 L253.5,375.3" stroke="#2563eb" stroke-width="2"/><path d="M210.0,380.0 L210.0,387.0" stroke="#2563eb" stroke-width="2"/><path d="M170.0,369.3 L166.5,375.3" stroke="#2563eb" stroke-width="2"/><path d="M140.7,340.0 L134.7,343.5" stroke="#2563eb" stroke-width="2"/><path d="M130.0,300.0 L123.0,300.0" stroke="#2563eb" stroke-width="2"/><path d="M140.7,260.0 L134.7,256.5" stroke="#2563eb" stroke-width="2"/><path d="M170.0,230.7 L166.5,224.7" stroke="#2563eb" stroke-width="2"/><path d="M210,300 L258.3,327.9" stroke="#14213d" stroke-width="5" stroke-linecap="round"/><path d="M210,300 L210,229.8" stroke="#14213d" stroke-width="3" stroke-linecap="round"/><circle cx="210" cy="300" r="6" fill="#14213d"/><text x="210" y="420" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#2563eb">x: shelf life</text>
    <text x="110" y="450" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">How long must this</text><text x="110" y="474" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">data stay secret?</text>
  </g>
  <g data-f="2">
