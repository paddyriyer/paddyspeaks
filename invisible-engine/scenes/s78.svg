    <text x="86" y="590" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">What</text>
    <text x="486" y="590" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">Must stay protected for</text>
    <text x="886" y="590" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">x + y</text>
    <text x="1086" y="590" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">Priority</text>
    <rect x="70" y="608" width="1200" height="46" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="86" y="638" text-anchor="start" style="font-size:16px;font-weight:500;fill:#14213d">Card transaction cryptogram</text>
    <text x="486" y="638" text-anchor="start" style="font-size:16px;font-weight:500;fill:#14213d">minutes</text>
    <text x="886" y="638" text-anchor="start" style="font-size:16px;font-weight:500;fill:#14213d">short</text>
    <text x="1086" y="638" text-anchor="start" style="font-size:16px;font-weight:800;fill:#166534">low</text>
    <rect x="70" y="656" width="1200" height="46" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="86" y="686" text-anchor="start" style="font-size:16px;font-weight:500;fill:#14213d">Tracker location history</text>
    <text x="486" y="686" text-anchor="start" style="font-size:16px;font-weight:500;fill:#14213d">weeks; patterns of life longer</text>
    <text x="886" y="686" text-anchor="start" style="font-size:16px;font-weight:500;fill:#14213d">medium</text>
    <text x="1086" y="686" text-anchor="start" style="font-size:16px;font-weight:800;fill:#b45309">medium</text>
    <rect x="70" y="704" width="1200" height="46" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="86" y="734" text-anchor="start" style="font-size:16px;font-weight:500;fill:#14213d">Account backups</text>
    <text x="486" y="734" text-anchor="start" style="font-size:16px;font-weight:500;fill:#14213d">years</text>
    <text x="886" y="734" text-anchor="start" style="font-size:16px;font-weight:500;fill:#14213d">long</text>
    <text x="1086" y="734" text-anchor="start" style="font-size:16px;font-weight:800;fill:#b91c1c">high</text>
    <rect x="70" y="752" width="1200" height="46" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="86" y="782" text-anchor="start" style="font-size:16px;font-weight:500;fill:#14213d">Signed firmware (authenticity)</text>
    <text x="486" y="782" text-anchor="start" style="font-size:16px;font-weight:500;fill:#14213d">device lifetime</text>
    <text x="886" y="782" text-anchor="start" style="font-size:16px;font-weight:500;fill:#14213d">long</text>
    <text x="1086" y="782" text-anchor="start" style="font-size:16px;font-weight:800;fill:#b91c1c">high</text>
    <circle cx="1310" cy="584" r="18" fill="#0d9488"/><text x="1310" y="590" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="1336" y="592" text-anchor="start" style="font-size:18px;font-weight:800;fill:#0f766e">Prioritise by</text>
    <text x="1310" y="630" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">sensitivity and exposure,</text><text x="1310" y="654" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">not by a guessed date.</text><text x="1310" y="678" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">Signed firmware is about</text><text x="1310" y="702" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">authenticity: a forged</text><text x="1310" y="726" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">signature would matter</text><text x="1310" y="750" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">only after z arrives.</text>
