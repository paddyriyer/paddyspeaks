    <text x="460" y="450" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">How long will changing</text><text x="460" y="474" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">every system take?</text>
  </g>
  <g data-f="3">
    <circle cx="910" cy="300" r="90" fill="#ffffff" stroke="#6b7280" stroke-width="5" stroke-dasharray="10 7"/><path d="M910.0,220.0 L910.0,213.0" stroke="#6b7280" stroke-width="2"/><path d="M950.0,230.7 L953.5,224.7" stroke="#6b7280" stroke-width="2"/><path d="M979.3,260.0 L985.3,256.5" stroke="#6b7280" stroke-width="2"/><path d="M990.0,300.0 L997.0,300.0" stroke="#6b7280" stroke-width="2"/><path d="M979.3,340.0 L985.3,343.5" stroke="#6b7280" stroke-width="2"/><path d="M950.0,369.3 L953.5,375.3" stroke="#6b7280" stroke-width="2"/><path d="M910.0,380.0 L910.0,387.0" stroke="#6b7280" stroke-width="2"/><path d="M870.0,369.3 L866.5,375.3" stroke="#6b7280" stroke-width="2"/><path d="M840.7,340.0 L834.7,343.5" stroke="#6b7280" stroke-width="2"/><path d="M830.0,300.0 L823.0,300.0" stroke="#6b7280" stroke-width="2"/><path d="M840.7,260.0 L834.7,256.5" stroke="#6b7280" stroke-width="2"/><path d="M870.0,230.7 L866.5,224.7" stroke="#6b7280" stroke-width="2"/><text x="910" y="310" text-anchor="middle" style="font-size:67.5px;font-weight:800;fill:#6b7280">?</text><text x="910" y="420" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#6b7280">z: unknown</text>
    <text x="800" y="450" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">Until a quantum computer that</text><text x="800" y="474" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">matters for cryptography exists.</text><text x="800" y="498" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">Estimates disagree: no date.</text>
  </g>
  <g data-f="4">
    <rect x="1100" y="190" width="440" height="320" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="1130" cy="222" r="18" fill="#7c3aed"/><text x="1130" y="228" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="1160" y="230" text-anchor="start" style="font-size:20px;font-weight:800;fill:#6d28d9">The rule</text>
    <text x="1320" y="300" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:40px;font-weight:800;fill:#14213d">x + y  &gt;  z</text>
    <text x="1130" y="350" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">→ data encrypted today is at risk.</text><text x="1130" y="378" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">z is unknown, so ask instead:</text><text x="1130" y="406" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">is x + y long? Then start now.</text><text x="1130" y="434" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">(Mosca, 2015)</text>
  </g>
