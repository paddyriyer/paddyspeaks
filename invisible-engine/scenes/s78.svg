<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 78: Three clocks: shelf life, migration time, and the unknown</title>
  <desc>Five frames. 1, clock x: how long the data must stay secret (its shelf life). 2, clock y: how long migrating the systems that protect it will take. 3, clock z: how long until a cryptographically relevant quantum computer exists — drawn as an unknown band with no date, because published estimates disagree and none is a fact. 4, the rule (Mosca, 2015): if x + y is larger than z, data encrypted today is at risk; since z is unknown, the useful question is whether x + y is long. 5, prioritise by sensitivity and exposure: a card’s transaction cryptogram matters for minutes; a tracker’s location history for weeks, and patterns of life for longer; account backups and signed firmware (whose concern is authenticity) for years.</desc>
