<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 45: Three layers of protection, three different jobs</title>
  <desc>Five frames along the path from tag to owner. 1, the path: tag, passer-by’s phone, Apple’s relay, owner’s phone. 2, the radio link: the broadcast is not encrypted, because the identifier is public by design; Bluetooth link encryption applies only to connections. 3, TLS protects each internet hop in transit and ends at Apple’s servers. 4, end-to-end encryption wraps the location from the finder’s phone to the owner’s phone, through the relay and while stored there. 5, where data is readable: on the finder’s phone (its own location), as ciphertext with metadata at rest on the relay, and on the owner’s phone after decryption.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 45</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Three layers of protection, three different jobs</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">The radio, the internet hop and the report itself are protected differently.</text>
  <g data-f="1">
    <circle cx="173" cy="295" r="44" fill="#0f172a" opacity="0.13"/><circle cx="170" cy="290" r="44" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="170" cy="290" r="27" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/><text x="170" y="360" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">item tracker</text>
    <rect x="475" y="207" width="100" height="190" rx="17" fill="#0f172a" opacity="0.14"/><rect x="470" y="200" width="100" height="190" rx="17" fill="#111827"/><rect x="476" y="206" width="88" height="178" rx="13" fill="#f8fafc"/><rect x="506" y="210" width="28" height="7" rx="4" fill="#111827"/><text x="520" y="412" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">passer-by’s phone</text>
    <rect x="900" y="210" width="120" height="42" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="918" cy="231" r="5" fill="#22c55e"/><rect x="940" y="226" width="64" height="10" rx="3" fill="#94a3b8"/><rect x="900" y="260" width="120" height="42" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="918" cy="281" r="5" fill="#22c55e"/><rect x="940" y="276" width="64" height="10" rx="3" fill="#94a3b8"/><rect x="900" y="310" width="120" height="42" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="918" cy="331" r="5" fill="#22c55e"/><rect x="940" y="326" width="64" height="10" rx="3" fill="#94a3b8"/>
    <rect x="820" y="180" width="280" height="240" rx="16" fill="none" stroke="#14213d" stroke-width="5"/><rect x="834" y="407" width="111" height="26" rx="5" fill="#14213d"/><text x="842" y="426" text-anchor="start" style="font-size:14.5px;font-weight:700;fill:#ffffff">Apple relay</text>
    <rect x="1345" y="207" width="100" height="190" rx="17" fill="#0f172a" opacity="0.14"/><rect x="1340" y="200" width="100" height="190" rx="17" fill="#111827"/><rect x="1346" y="206" width="88" height="178" rx="13" fill="#f8fafc"/><rect x="1376" y="210" width="28" height="7" rx="4" fill="#111827"/><text x="1390" y="412" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">owner’s phone</text>
    <text x="60" y="470" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:14px;font-weight:800;fill:#64748b">LAYER</text>
  </g>
  <g data-f="2">
    <rect x="60" y="486" width="1480" height="56" rx="10" fill="#eff6ff"/>
    <text x="80" y="520" text-anchor="start" style="font-size:16px;font-weight:800;fill:#1e40af">Radio broadcast</text>
    <path d="M220,290 L460,290" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="225" y="244" width="241" height="26" rx="6" class="lab"/>
    <text x="345" y="262" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#1d4ed8"><tspan x="345" dy="0">Bluetooth: in the clear</tspan></text>
    <path d="M300,514 L520,514" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>
    <text x="550" y="520" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">not encrypted: the rotating key is public by design</text>
  </g>
  <g data-f="3">
    <rect x="60" y="552" width="1480" height="56" rx="10" fill="#f8fafc"/>
    <text x="80" y="586" text-anchor="start" style="font-size:16px;font-weight:800;fill:#334155">TLS (in transit)</text>
    <path d="M520,580 L940,580 M980,580 L1390,580" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <text x="960" y="600" text-anchor="middle" style="font-size:13.5px;font-weight:600;fill:#475569">ends at the server</text>
  </g>
  <g data-f="4">
    <rect x="60" y="618" width="1480" height="56" rx="10" fill="#f5f3ff"/>
    <text x="80" y="652" text-anchor="start" style="font-size:16px;font-weight:800;fill:#6b21a8">End to end</text>
    <path d="M520,646 L1390,646" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/>
    <path d="M580,300 L810,300" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="633" y="254" width="145" height="26" rx="6" class="lab"/>
    <text x="705" y="272" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#7e22ce"><tspan x="705" dy="0">sealed report</tspan></text>
    <path d="M1110,300 L1330,300" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="1143" y="254" width="145" height="26" rx="6" class="lab"/>
    <text x="1215" y="272" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#7e22ce"><tspan x="1215" dy="0">sealed report</tspan></text>
    <path d="M1037,340 L1037,331 a10,10 0 0 1 20,0 L1056,340" fill="none" stroke="#7c3aed" stroke-width="3.9"/><rect x="1030" y="340" width="33" height="26" rx="4" fill="#7c3aed"/><circle cx="1046" cy="351" r="3" fill="#ffffff"/><rect x="1045" y="352" width="3" height="8" fill="#ffffff"/>
  </g>
  <g data-f="5">
    <rect x="60" y="694" width="470" height="120" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="76" y="726" text-anchor="start" style="font-size:18px;font-weight:800;fill:#16a34a">On a device</text><text x="76" y="752" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="76" dy="0">Plaintext only on the finder’s phone (its</tspan><tspan x="76" dy="19">own location) and on the owner’s phone</tspan><tspan x="76" dy="19">after decrypting.</tspan></text>
    <rect x="565" y="694" width="470" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="581" y="726" text-anchor="start" style="font-size:18px;font-weight:800;fill:#334155">In transit</text><text x="581" y="752" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="581" dy="0">TLS around the internet hops; the report</tspan><tspan x="581" dy="19">inside stays end-to-end encrypted.</tspan></text>
    <rect x="1070" y="694" width="470" height="120" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><text x="1086" y="726" text-anchor="start" style="font-size:18px;font-weight:800;fill:#7c3aed">At rest on the relay</text><text x="1086" y="752" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="1086" dy="0">Ciphertext, a lookup hash, upload time and</tspan><tspan x="1086" dy="19">connection metadata. Not the location.</tspan></text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="106" y="866" class="s">Radio signal or wave</text>
    <path d="M308.0,861 L342.0,861" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="354.0" y="866" class="s">Encrypted / cryptographic</text>
    <text x="1540" y="866" class="note" text-anchor="end">Apple’s documented Find My design. Schematic.</text>
  </g>
</svg>
