    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 68</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Gates and circuits: reversible steps, then one irreversible look</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Every ideal gate can be run backwards. Measuring cannot.</text>
  <g data-f="1">
    <text x="155.0" y="188" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#14213d">X (bit flip)</text><path d="M90,200 L80,200 L80,280 L90,280" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M220,200 L230,200 L230,280 L220,280" fill="none" stroke="#334155" stroke-width="2.5"/><text x="125.0" y="230" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">0</text><text x="185.0" y="230" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">1</text><text x="125.0" y="266" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">1</text><text x="185.0" y="266" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">0</text>
    <text x="365.0" y="188" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#14213d">Z (phase flip)</text><path d="M300,200 L290,200 L290,280 L300,280" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M430,200 L440,200 L440,280 L430,280" fill="none" stroke="#334155" stroke-width="2.5"/><text x="335.0" y="230" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">1</text><text x="395.0" y="230" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">0</text><text x="335.0" y="266" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">0</text><text x="395.0" y="266" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">−1</text>
    <text x="585.0" y="188" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#14213d">H (Hadamard)</text><path d="M510,200 L500,200 L500,280 L510,280" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M660,200 L670,200 L670,280 L660,280" fill="none" stroke="#334155" stroke-width="2.5"/><text x="551.0" y="230" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">1/√2</text><text x="619.0" y="230" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">1/√2</text><text x="551.0" y="266" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">1/√2</text><text x="619.0" y="266" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">−1/√2</text>
    <text x="860" y="188" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#14213d">CNOT</text><path d="M860,225 L860,310" stroke="#334155" stroke-width="3"/><circle cx="860" cy="225" r="9" fill="#334155"/><circle cx="860" cy="290" r="20" fill="#ffffff" stroke="#334155" stroke-width="3"/><path d="M840,290 L880,290 M860,270 L860,310" stroke="#334155" stroke-width="3"/>
    <text x="910" y="240" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">flips the target</text><text x="910" y="264" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">when the control is 1</text>
    <text x="1260" y="188" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#14213d">Controlled phase</text>
    <path d="M1260,225 L1260,290" stroke="#334155" stroke-width="3"/><circle cx="1260" cy="225" r="9" fill="#334155"/><circle cx="1260" cy="290" r="9" fill="#334155"/>
    <text x="1290" y="240" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">adds phase e^{iφ}</text><text x="1290" y="264" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">when both are 1</text>
    <rect x="80" y="330" width="680" height="90" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="106" cy="360" r="18" fill="#2563eb"/><text x="106" y="366" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="134" y="366" text-anchor="start" style="font-size:19px;font-weight:800;fill:#2563eb">A gate is a rule for amplitudes</text><text x="96" y="395" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">Each one is a small matrix acting on the state.</text>
  </g>
  <g data-f="2">
    <path d="M910,360 L900,360 L900,440 L910,440" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M1060,360 L1070,360 L1070,440 L1060,440" fill="none" stroke="#334155" stroke-width="2.5"/><text x="951.0" y="390" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">1/√2</text><text x="1019.0" y="390" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">1/√2</text><text x="951.0" y="426" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">1/√2</text><text x="1019.0" y="426" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">−1/√2</text><text x="1085" y="410" text-anchor="middle" style="font-size:26px;font-weight:800;fill:#334155">×</text>
    <path d="M1110,360 L1100,360 L1100,440 L1110,440" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M1260,360 L1270,360 L1270,440 L1260,440" fill="none" stroke="#334155" stroke-width="2.5"/><text x="1151.0" y="390" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">1/√2</text><text x="1219.0" y="390" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">1/√2</text><text x="1151.0" y="426" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">1/√2</text><text x="1219.0" y="426" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">−1/√2</text><text x="1290" y="410" text-anchor="middle" style="font-size:26px;font-weight:800;fill:#334155">=</text>
    <path d="M1320,360 L1310,360 L1310,440 L1320,440" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M1450,360 L1460,360 L1460,440 L1450,440" fill="none" stroke="#334155" stroke-width="2.5"/><text x="1355.0" y="390" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">1</text><text x="1415.0" y="390" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">0</text><text x="1355.0" y="426" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">0</text><text x="1415.0" y="426" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#14213d">1</text>
    <text x="1220" y="480" text-anchor="middle" style="font-size:15.5px;font-weight:700;fill:#166534">H then H undoes itself: the identity (computed)</text>
  </g>
  <g data-f="3">
    <path d="M150,600 L900,600" stroke="#334155" stroke-width="2.5"/><text x="138" y="607" text-anchor="end" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:18px;font-weight:700;fill:#14213d">|0⟩</text><path d="M150,700 L900,700" stroke="#334155" stroke-width="2.5"/><text x="138" y="707" text-anchor="end" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:18px;font-weight:700;fill:#14213d">|0⟩</text>
    <rect x="232" y="574" width="56" height="52" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/><text x="260" y="608" text-anchor="middle" style="font-size:22px;font-weight:800;fill:#1d4ed8">H</text><path d="M420,600 L420,720" stroke="#334155" stroke-width="3"/><circle cx="420" cy="600" r="9" fill="#334155"/><circle cx="420" cy="700" r="20" fill="#ffffff" stroke="#334155" stroke-width="3"/><path d="M400,700 L440,700 M420,680 L420,720" stroke="#334155" stroke-width="3"/><rect x="552" y="574" width="56" height="52" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="580" y="608" text-anchor="middle" style="font-size:22px;font-weight:800;fill:#7c3aed">Z</text>
    <text x="500" y="780" text-anchor="middle" style="font-size:15.5px;font-weight:600;fill:#334155">Read left to right: H, then CNOT, then Z</text>
  </g>
  <g data-f="4">
    <rect x="730" y="574" width="60" height="52" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="3"/><path d="M742,612 A20,20 0 0 1 778,612" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M760,612 L772,588" stroke="#334155" stroke-width="2.5"/><rect x="730" y="674" width="60" height="52" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="3"/><path d="M742,712 A20,20 0 0 1 778,712" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M760,712 L772,688" stroke="#334155" stroke-width="2.5"/>
    <rect x="790" y="560" width="120" height="180" fill="#ffffff"/>
    <path d="M790,597 L980,597 M790,603 L980,603" stroke="#64748b" stroke-width="2"/><path d="M790,697 L980,697 M790,703 L980,703" stroke="#64748b" stroke-width="2"/>
    <text x="1000" y="607" text-anchor="start" style="font-size:16px;font-weight:700;fill:#475569">bit</text><text x="1000" y="707" text-anchor="start" style="font-size:16px;font-weight:700;fill:#475569">bit</text>
    <rect x="1080" y="560" width="460" height="160" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="1106" cy="590" r="18" fill="#b45309"/><text x="1106" y="596" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="1134" y="596" text-anchor="start" style="font-size:19px;font-weight:800;fill:#b45309">Measurement is separate</text><text x="1096" y="625" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1096" dy="0">It gives one classical bit per qubit</tspan><tspan x="1096" dy="21">(double lines) and destroys the</tspan><tspan x="1096" dy="21">superposition. It cannot be undone.</tspan></text>
  </g>
  <g data-f="5">
    <rect x="1080" y="160" width="460" height="140" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="1106" cy="190" r="18" fill="#16a34a"/><text x="1106" y="196" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="1134" y="196" text-anchor="start" style="font-size:19px;font-weight:800;fill:#16a34a">Try it yourself</text><text x="1096" y="225" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1096" dy="0">Demo H in Module 8 runs these gates</tspan><tspan x="1096" dy="21">on a small simulator and shows every</tspan><tspan x="1096" dy="21">amplitude after every step.</tspan></text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Ideal gates. Real gates are imperfect (Scene 70).</text>
  </g>
</svg>
