<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 47: Four networks, similar goals, different designs</title>
  <desc>Four frames building a comparison of Apple Find My, Google Find Hub, Samsung SmartThings Find and Tile, with no ranking. 1, the four networks and who relays sightings. 2, encryption and account linking as each company documents them. 3, precise finding, sharing and alerts for the person a tag travels with. 4, how much each publishes about its protocol, and a note that cells marked verify could not be confirmed from the company’s own pages for this lesson.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 47</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Four networks, similar goals, different designs</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">As each company documents it. No scores, no winners. “Verify” = not confirmed from the company’s own page.</text>
  <g data-f="1">
    <rect x="60" y="160" width="1478" height="60" rx="10" fill="#f1f5f9"/>
    <text x="306" y="198" text-anchor="start" style="font-size:17px;font-weight:800;fill:#14213d">Apple Find My</text>
    <text x="618" y="198" text-anchor="start" style="font-size:17px;font-weight:800;fill:#14213d">Google Find Hub</text>
    <text x="930" y="198" text-anchor="start" style="font-size:17px;font-weight:800;fill:#14213d">Samsung SmartThings Find</text>
    <text x="1242" y="198" text-anchor="start" style="font-size:17px;font-weight:800;fill:#14213d">Tile (Life360)</text>
    <rect x="60" y="226" width="1478" height="76" rx="8" fill="#fbfaf7" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="258" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">Who relays</text>
    <text x="306" y="256" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="306" dy="0">Nearby Apple devices,</tspan><tspan x="306" dy="19">in the background</tspan></text>
    <text x="618" y="256" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="618" dy="0">Android devices; by default</tspan><tspan x="618" dy="19">only in busy areas, aggregated</tspan></text>
    <text x="930" y="256" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="930" dy="0">Galaxy devices</tspan><tspan x="930" dy="19">(“nodes”)</tspan></text>
    <text x="1242" y="256" text-anchor="start" style="font-style:italic;font-size:14.5px;font-weight:400;fill:#9a3412"><tspan x="1242" dy="0">Phones running the Tile</tspan><tspan x="1242" dy="19">or Life360 app (verify)</tspan></text>
  </g>
  <g data-f="2">
    <rect x="60" y="308" width="1478" height="76" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="340" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">Encryption</text>
    <text x="306" y="338" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="306" dy="0">End to end; Apple says</tspan><tspan x="306" dy="19">it cannot read locations</tspan></text>
    <text x="618" y="338" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="618" dy="0">End to end; key unlocked by</tspan><tspan x="618" dy="19">the phone’s screen lock</tspan></text>
    <text x="930" y="338" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="930" dy="0">Encrypted, Knox-protected;</tspan><tspan x="930" dy="19">private ID changes / 15 min</tspan></text>
    <text x="1242" y="338" text-anchor="start" style="font-style:italic;font-size:14.5px;font-weight:400;fill:#9a3412"><tspan x="1242" dy="0">Not compared here:</tspan><tspan x="1242" dy="19">check Tile’s own pages</tspan></text>
    <rect x="60" y="390" width="1478" height="76" rx="8" fill="#fbfaf7" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="422" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">Account link</text>
    <text x="306" y="420" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="306" dy="0">One Apple Account</tspan><tspan x="306" dy="19">per AirTag</tspan></text>
    <text x="618" y="420" text-anchor="start" style="font-style:italic;font-size:14.5px;font-weight:400;fill:#9a3412"><tspan x="618" dy="0">Google Account; trackers</tspan><tspan x="618" dy="19">from partner makers (verify)</tspan></text>
    <text x="930" y="420" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="930" dy="0">One account or device</tspan><tspan x="930" dy="19">at a time</tspan></text>
    <text x="1242" y="420" text-anchor="start" style="font-style:italic;font-size:14.5px;font-weight:400;fill:#9a3412">Tile account (verify)</text>
  </g>
  <g data-f="3">
    <rect x="60" y="472" width="1478" height="76" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="504" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">Precise finding</text>
    <text x="306" y="502" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="306" dy="0">UWB on supported</tspan><tspan x="306" dy="19">iPhones</tspan></text>
    <text x="618" y="502" text-anchor="start" style="font-style:italic;font-size:14.5px;font-weight:400;fill:#9a3412"><tspan x="618" dy="0">Depends on the tracker</tspan><tspan x="618" dy="19">model (verify)</tspan></text>
    <text x="930" y="502" text-anchor="start" style="font-style:italic;font-size:14.5px;font-weight:400;fill:#9a3412"><tspan x="930" dy="0">UWB on supported</tspan><tspan x="930" dy="19">Galaxy phones (verify)</tspan></text>
    <text x="1242" y="502" text-anchor="start" style="font-style:italic;font-size:14.5px;font-weight:400;fill:#9a3412"><tspan x="1242" dy="0">Depends on the model</tspan><tspan x="1242" dy="19">(verify)</tspan></text>
    <rect x="60" y="554" width="1478" height="76" rx="8" fill="#fbfaf7" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="586" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d"><tspan x="76" dy="0">Alerts for the</tspan><tspan x="76" dy="21">carrier</tspan></text>
    <text x="306" y="584" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="306" dy="0">iPhone alert; tag sounds;</tspan><tspan x="306" dy="19">Android via shared spec</tspan></text>
    <text x="618" y="584" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="618" dy="0">Android 6.0+ alerts and</tspan><tspan x="618" dy="19">a manual Scan now</tspan></text>
    <text x="930" y="584" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="930" dy="0">Unknown-tag alert is a</tspan><tspan x="930" dy="19">setting; manual search</tspan></text>
    <text x="1242" y="584" text-anchor="start" style="font-style:italic;font-size:14.5px;font-weight:400;fill:#9a3412"><tspan x="1242" dy="0">Scan and Secure: a</tspan><tspan x="1242" dy="19">manual scan (verify)</tspan></text>
  </g>
  <g data-f="4">
    <rect x="60" y="636" width="1478" height="76" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="668" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d"><tspan x="76" dy="0">What is</tspan><tspan x="76" dy="21">published</tspan></text>
    <text x="306" y="666" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="306" dy="0">Design in Apple Platform</tspan><tspan x="306" dy="19">Security; studied by research</tspan></text>
    <text x="618" y="666" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="618" dy="0">Design on Google’s</tspan><tspan x="618" dy="19">security blog</tspan></text>
    <text x="930" y="666" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="930" dy="0">Newsroom-level</tspan><tspan x="930" dy="19">descriptions</tspan></text>
    <text x="1242" y="666" text-anchor="start" style="font-style:italic;font-size:14.5px;font-weight:400;fill:#9a3412"><tspan x="1242" dy="0">Less public technical</tspan><tspan x="1242" dy="19">detail (verify)</tspan></text>
    <text x="60" y="742" text-anchor="start" style="font-size:15.5px;font-weight:600;fill:#14213d">All four aim to find lost things without revealing the finder; the published detail differs a great deal.</text>
    <text x="60" y="770" text-anchor="start" style="font-size:15px;font-weight:400;fill:#475569">Apple and Google share one specification for unwanted-tracking alerts (Scene 52). Nothing here implies the</text>
    <text x="60" y="792" text-anchor="start" style="font-size:15px;font-weight:400;fill:#475569">networks share data or use the same algorithms.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Company documentation as cited on the page. No ranking.</text>
  </g>
</svg>
