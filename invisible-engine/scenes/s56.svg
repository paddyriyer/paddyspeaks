<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 56: A bit is a switch that is either on or off</title>
  <desc>Four frames. 1, a transistor used as a switch: a high voltage is read as 1 and a low voltage as 0, drawn as a lit and an unlit lamp. 2, a three-bit register and the eight strings it could hold, 000 to 111. 3, the register actually holds one of them, 101, and reading it does not change it. 4, bits can be read as often as you like and copied exactly; n bits have 2 to the n possible strings but hold one at a time, unlike the qubits that start in Scene 60.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 56</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">A bit is a switch that is either on or off</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Definite, readable, copyable. Everything in a classical computer is built from this.</text>
  <g data-f="1">
    <rect x="60" y="160" width="460" height="460" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="102" cy="204" r="26" fill="#334155"/><text x="102" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="142" y="214" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">A switch makes a bit</text><text x="142" y="244" text-anchor="start" style="font-size:17px;font-weight:600;fill:#334155">a transistor, on or off</text>
    <path d="M212,330 L232,330" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M194,374 L208,388" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M150,392 L150,412" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M106,374 L92,388" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M88,330 L68,330" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M106,286 L92,272" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M150,268 L150,248" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M194,286 L208,272" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="330" r="46" fill="#fde047" stroke="#334155" stroke-width="3"/><path d="M136,336 q7,-18 14,0 q7,18 14,0" fill="none" stroke="#b45309" stroke-width="3"/><rect x="130" y="372" width="40" height="26" rx="4" fill="#9ca3af" stroke="#334155" stroke-width="2"/>
    <text x="230" y="318" text-anchor="start" style="font-size:19px;font-weight:700;fill:#14213d">high voltage</text><text x="230" y="352" text-anchor="start" style="font-size:19px;font-weight:400;fill:#475569">read as 1</text>
    <text x="470" y="350" text-anchor="end" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:54px;font-weight:800;fill:#b45309">1</text>
    <circle cx="150" cy="490" r="46" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><path d="M136,496 q7,-18 14,0 q7,18 14,0" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="130" y="532" width="40" height="26" rx="4" fill="#9ca3af" stroke="#334155" stroke-width="2"/>
    <text x="230" y="478" text-anchor="start" style="font-size:19px;font-weight:700;fill:#14213d">low voltage</text><text x="230" y="512" text-anchor="start" style="font-size:19px;font-weight:400;fill:#475569">read as 0</text>
    <text x="470" y="510" text-anchor="end" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:54px;font-weight:800;fill:#64748b">0</text>
    <text x="84" y="600" text-anchor="start" style="font-style:italic;font-size:14.5px;font-weight:400;fill:#475569">Voltages are ranges, not exact values (illustrative).</text>
  </g>
  <g data-f="2">
    <rect x="560" y="160" width="480" height="460" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="602" cy="204" r="26" fill="#2563eb"/><text x="602" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="642" y="214" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Three bits, eight strings</text>
    <rect x="640" y="240" width="90" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <text x="685" y="352" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#475569">bit 2</text>
    <rect x="750" y="240" width="90" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <text x="795" y="352" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#475569">bit 1</text>
    <rect x="860" y="240" width="90" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <text x="905" y="352" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#475569">bit 0</text>
    <text x="680" y="410" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:#14213d">000</text>
    <text x="680" y="456" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:#14213d">001</text>
    <text x="680" y="502" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:#14213d">010</text>
    <text x="680" y="548" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:#14213d">011</text>
    <text x="890" y="410" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:#14213d">100</text>
    <text x="890" y="456" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:#14213d">101</text>
    <text x="890" y="502" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:#14213d">110</text>
    <text x="890" y="548" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:#14213d">111</text>
  </g>
  <g data-f="3">
    <text x="685" y="300" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:44px;font-weight:800;fill:#1d4ed8">1</text>
    <text x="795" y="300" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:44px;font-weight:800;fill:#1d4ed8">0</text>
    <text x="905" y="300" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:44px;font-weight:800;fill:#1d4ed8">1</text>
    <rect x="868" y="433" width="84" height="40" rx="8" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <rect x="1080" y="160" width="460" height="200" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="1106" cy="190" r="18" fill="#16a34a"/><text x="1106" y="196" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="1134" y="196" text-anchor="start" style="font-size:20px;font-weight:800;fill:#16a34a">One value at a time</text><text x="1096" y="226" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155"><tspan x="1096" dy="0">The register holds exactly one of the</tspan><tspan x="1096" dy="21">eight strings: here 101. Reading it</tspan><tspan x="1096" dy="21">does not change it.</tspan></text>
  </g>
  <g data-f="4">
    <rect x="1080" y="390" width="460" height="230" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="1106" cy="420" r="18" fill="#7c3aed"/><text x="1106" y="426" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="1134" y="426" text-anchor="start" style="font-size:20px;font-weight:800;fill:#7c3aed">Read and copy freely</text><text x="1096" y="456" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155"><tspan x="1096" dy="0">You can read a bit as often as you like</tspan><tspan x="1096" dy="21">and copy it exactly. A qubit cannot be</tspan><tspan x="1096" dy="21">copied, and measuring it can change it</tspan><tspan x="1096" dy="21">(Scenes 60–61).</tspan></text>
    <rect x="60" y="650" width="1480" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="90" y="700" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">n bits → 2ⁿ possible strings, but only one at a time</text>
    <text x="90" y="744" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:19px;font-weight:600;fill:#1d4ed8">3 bits → 8</text><text x="330" y="744" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:19px;font-weight:600;fill:#1d4ed8">10 bits → 1,024</text><text x="640" y="744" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:19px;font-weight:600;fill:#1d4ed8">64 bits → 18,446,744,073,709,551,616</text>
    <text x="90" y="780" text-anchor="start" style="font-size:16px;font-weight:400;fill:#475569">More bits mean more possible values to choose from, never several values held at once.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Schematic. Lamps stand for transistor states.</text>
  </g>
</svg>
