  <g data-f="5">
    <rect x="60" y="655" width="1480" height="158" rx="14" class="hz"/>
    <circle cx="100" cy="700" r="20" fill="#dc2626"/><text x="100" y="707" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">5</text>
    <text x="132" y="708" text-anchor="start" style="font-size:22px;font-weight:800;fill:#991b1b">The number is a claim, not proof</text>
    <text x="132" y="742" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">If a badge sends only a fixed number, a copy sends the same number, and the server cannot tell them apart.</text>
    <text x="132" y="768" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Stronger badges prove they hold a secret key (Scene 21). Either way, a badge shows possession of a card,</text>
    <text x="132" y="794" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">not who is holding it: sites that need more add a PIN, a face check or a guard.</text>
  </g>
