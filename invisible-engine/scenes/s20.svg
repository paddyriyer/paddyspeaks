  <text x="60" y="50" class="k">SCENE 20</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">An office badge: the door asks a server</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">The badge carries a number. The decision lives in a server, in a table someone maintains.</text>
