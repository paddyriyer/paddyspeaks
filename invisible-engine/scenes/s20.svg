<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 20: An office badge: the door asks a server</title>
  <desc>Five frames. A person taps a staff badge on a reader beside a door. The reader sends the badge’s number over a wire to a door controller. The controller asks the access-control server, which looks the number up in a permissions table of people, doors and hours, and answers allow. The controller releases the door strike and writes an audit-log entry. A warning panel explains that the number is a claim, not proof: a badge that sends only a fixed number can be copied, and the server cannot tell the copy from the original; holding a badge is also not proof of who is holding it.</desc>
