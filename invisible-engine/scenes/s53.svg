    <text x="160" y="672" text-anchor="start" style="font-size:20px;font-weight:800;fill:#991b1b">Consider your safety first.</text>
    <text x="160" y="700" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">Disabling a tracker can alert the person who placed it. Decide when, and whether, with someone who can help.</text>
