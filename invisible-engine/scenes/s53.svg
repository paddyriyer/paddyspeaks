    <path d="M295,438 L295,450" stroke="#94a3b8" stroke-width="3"/><path d="M288,448 L295,458 L302,448 Z" fill="#94a3b8"/>
    <rect x="60" y="458" width="470" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="76" y="484.0" text-anchor="start" style="font-size:15px;font-weight:400;fill:#14213d">Innocent explanation? A companion’s</text><text x="76" y="506.0" text-anchor="start" style="font-size:15px;font-weight:400;fill:#14213d">tag in a shared bag or car.</text>
    <path d="M295,522 L295,534" stroke="#94a3b8" stroke-width="3"/><path d="M288,532 L295,542 L302,532 Z" fill="#94a3b8"/>
    <rect x="60" y="542" width="470" height="64" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="76" y="568.0" text-anchor="start" style="font-size:15px;font-weight:600;fill:#14213d">Not explained? Record the alert,</text><text x="76" y="590.0" text-anchor="start" style="font-size:15px;font-weight:400;fill:#14213d">use its tools, get help before disabling.</text>
  </g>
