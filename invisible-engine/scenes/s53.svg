  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 53</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Three people, three safe paths</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Safety first, then help. None of these paths asks anyone to confront, search or bypass.</text>
