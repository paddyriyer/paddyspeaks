    <rect x="60" y="290" width="470" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="76" y="316.0" text-anchor="start" style="font-size:15px;font-weight:400;fill:#14213d">Alert: an unknown tracker</text><text x="76" y="338.0" text-anchor="start" style="font-size:15px;font-weight:400;fill:#14213d">is moving with you</text>
