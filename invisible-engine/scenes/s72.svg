    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 72</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Quantum and security: which locks, and when</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Some locks would fail, some only weaken, and the replacements already exist.</text>
  <g data-f="1">
    <rect x="70" y="165" width="720" height="175" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="96" cy="195" r="18" fill="#7c3aed"/><text x="96" y="201" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="124" y="201" text-anchor="start" style="font-size:20px;font-weight:800;fill:#7c3aed">Public keys: RSA and elliptic curves</text><text x="86" y="231" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="86" dy="0">Key exchange and signatures rest on factoring or</tspan><tspan x="86" dy="21">discrete logs. Shor would solve them — IF a large,</tspan><tspan x="86" dy="21">fault-tolerant quantum computer exists. None is</tspan><tspan x="86" dy="21">publicly known to exist today.</tspan></text>
    <path d="M710,216 L710,206 a14,14 0 0 1 28,0 L738,216" fill="none" stroke="#7c3aed" stroke-width="5.0"/><rect x="700" y="214" width="48" height="38" rx="6" fill="#7c3aed"/><circle cx="724" cy="230" r="5" fill="#ffffff"/><rect x="722" y="232" width="4" height="10" fill="#ffffff"/>
  </g>
  <g data-f="2">
    <circle cx="846" cy="180" r="18" fill="#2563eb"/><text x="846" y="186" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="874" y="187" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d">Symmetric keys and hashes</text>
    <rect x="830" y="210" width="710" height="36" fill="#eef2ff" stroke="#e2e8f0" stroke-width="1"/><text x="910.0" y="233.04" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#14213d">Primitive</text><text x="1080.0" y="233.04" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#14213d">Classical generic attack</text><text x="1245.0" y="233.04" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#14213d">Idealised Grover</text><text x="1430.0" y="233.04" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#14213d">Usual response</text><rect x="830" y="246" width="710" height="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="910.0" y="269.04" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#14213d">AES-128 key</text><text x="1080.0" y="269.04" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#14213d">2^128</text><text x="1245.0" y="269.04" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#14213d">2^64</text><text x="1430.0" y="269.04" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#14213d">use 256-bit for long-lived data</text><rect x="830" y="282" width="710" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="910.0" y="305.04" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#14213d">AES-256 key</text><text x="1080.0" y="305.04" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#14213d">2^256</text><text x="1245.0" y="305.04" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#14213d">2^128</text><text x="1430.0" y="305.04" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#14213d">wide margin</text><rect x="830" y="318" width="710" height="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="910.0" y="341.04" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#14213d">SHA-256 preimage</text><text x="1080.0" y="341.04" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#14213d">2^256</text><text x="1245.0" y="341.04" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#14213d">2^128</text><text x="1430.0" y="341.04" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#14213d">margin remains</text>
    <text x="830" y="378" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">Grover gives a square-root speedup in an idealised count, and</text><text x="830" y="402" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">splitting it across k machines saves only √k. Hashes: collision</text><text x="830" y="426" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">search gains little in practice.</text>
  </g>
  <g data-f="3">
    <rect x="70" y="380" width="720" height="210" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="100" cy="412" r="18" fill="#0d9488"/><text x="100" y="418" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="130" y="420" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d">Published estimates for RSA-2048 (research)</text>
    <rect x="170" y="450" width="420" height="30" rx="6" fill="#5eead4"/><text x="110" y="472" text-anchor="start" style="font-size:16px;font-weight:800;fill:#0f766e">2019</text>
    <text x="180" y="502" text-anchor="start" style="font-size:14px;font-weight:400;fill:#334155">Gidney &amp; Ekerå: ~20 million noisy qubits, ~8 hours</text>
    <rect x="170" y="510" width="345" height="30" rx="6" fill="#5eead4"/><text x="110" y="532" text-anchor="start" style="font-size:16px;font-weight:800;fill:#0f766e">2025</text>
    <text x="180" y="562" text-anchor="start" style="font-size:14px;font-weight:400;fill:#334155">Gidney: under 1 million noisy qubits, under a week</text>
    <text x="110" y="578" text-anchor="start" style="font-style:italic;font-size:13.5px;font-weight:400;fill:#475569">Bar length: log scale. Estimates change with new methods and hardware.</text>
  </g>
  <g data-f="4">
    <rect x="830" y="470" width="710" height="150" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="856" cy="500" r="18" fill="#b45309"/><text x="856" y="506" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="884" y="506" text-anchor="start" style="font-size:19px;font-weight:800;fill:#b45309">Harvest now, decrypt later</text><text x="846" y="535" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="846" dy="0">Matters only when all three hold: the data must stay</tspan><tspan x="846" dy="21">secret for years; it is protected by quantum-vulnerable</tspan><tspan x="846" dy="21">key exchange; and someone captures and keeps it.</tspan></text>
  </g>
  <g data-f="5">
    <rect x="70" y="640" width="1470" height="150" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="96" cy="670" r="18" fill="#16a34a"/><text x="96" y="676" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="124" y="676" text-anchor="start" style="font-size:20px;font-weight:800;fill:#16a34a">Replacements exist, on ordinary chips</text><text x="86" y="706" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="86" dy="0">NIST, August 2024: ML-KEM (FIPS 203) for key establishment; ML-DSA (FIPS 204) and SLH-DSA (FIPS 205) for signatures.</tspan><tspan x="86" dy="21">Post-quantum cryptography is classical cryptography designed to resist known quantum attacks.</tspan><tspan x="86" dy="21">What migrating cards, trackers and accounts involves is Module 10.</tspan></text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Nothing here is broken today. Grover figures idealised; estimates dated.</text>
  </g>
</svg>
