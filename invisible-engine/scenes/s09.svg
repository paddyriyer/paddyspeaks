<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 09: Tap at checkout</title>
  <desc>Four frames. A contactless card with no battery approaches a payment terminal; the terminal’s 13.56 MHz field reaches the card and powers its chip; terminal and card exchange commands and replies; the screen shows Approved, a decision that usually comes from the card issuer over the payment network.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 09</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Tap at checkout</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">No battery in the card: the terminal supplies the power, the issuer supplies the decision.</text>
  <g data-f="1">
    <rect x="94" y="336" width="340" height="214" rx="17" fill="#0f172a" opacity="0.12"/><rect x="90" y="330" width="340" height="214" rx="17" fill="#1e3a8a"/><path d="M90,463 Q260,426 430,480 L430,527 Q430,544 413,544 L107,544 Q90,544 90,527 Z" fill="#1d4ed8" opacity="0.55"/><path d="M362.0,396.7 q9.2,10.5 0,20.9" fill="none" stroke="#ffffff" stroke-width="3.090909090909091" stroke-linecap="round"/><path d="M373.8,387.5 q15.7,19.6 0,39.2" fill="none" stroke="#ffffff" stroke-width="3.090909090909091" stroke-linecap="round"/><path d="M385.5,378.3 q22.2,28.8 0,57.5" fill="none" stroke="#ffffff" stroke-width="3.090909090909091" stroke-linecap="round"/><rect x="124.0" y="400.686" width="51.0" height="51.407999999999994" rx="8" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M149.5,400.686 L149.5,452.094 M124.0,417.822 L143.38,417.822 M155.62,417.822 L175.0,417.822 M124.0,434.95799999999997 L143.38,434.95799999999997 M155.62,434.95799999999997 L175.0,434.95799999999997" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="143.38" y="411.99575999999996" width="12.24" height="28.78848" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/><text x="409.6" y="372.84000000000003" text-anchor="end" style="font-size:23.8px;font-weight:800;fill:#e0e7ff">BANK</text><text x="124.0" y="509.928" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22.1px;font-weight:600;fill:#ffffff">•••• 1234</text>
    <rect x="80" y="570" width="380" height="130" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="106" cy="600" r="18" fill="#2563eb"/><text x="106" y="606" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="134" y="606" text-anchor="start" style="font-size:20px;font-weight:800;fill:#2563eb">The card arrives</text><text x="96" y="636" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155"><tspan x="96" dy="0">No battery inside. The chip is</tspan><tspan x="96" dy="21">inert until a reader is near.</tspan></text>
    <path d="M470,430 L600,430" stroke="#64748b" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round"/><path d="M600,416 L626,430 L600,444 Z" fill="#64748b"/>
    <rect x="1186" y="208" width="260" height="420" rx="30" fill="#0f172a" opacity="0.15"/><rect x="1180" y="200" width="260" height="420" rx="30" fill="#1f2937"/><rect x="1186" y="206" width="248" height="408" rx="26" fill="#374151"/><rect x="1204" y="226" width="212" height="150" rx="12" fill="#e0f2fe" stroke="#0f172a" stroke-width="3.0"/><path d="M1296.0,270.8 q8.0,9.2 0,18.4" fill="none" stroke="#0c4a6e" stroke-width="3.2" stroke-linecap="round"/><path d="M1306.3,262.8 q13.8,17.2 0,34.5" fill="none" stroke="#0c4a6e" stroke-width="3.2" stroke-linecap="round"/><path d="M1316.7,254.7 q19.5,25.3 0,50.6" fill="none" stroke="#0c4a6e" stroke-width="3.2" stroke-linecap="round"/><text x="1310.0" y="350.0" text-anchor="middle" style="font-size:22.0px;font-weight:800;fill:#0c4a6e">Tap to pay</text><rect x="1220" y="405" width="52" height="32" rx="7" fill="#9ca3af" stroke="#111827" stroke-width="1.5"/><rect x="1284" y="405" width="52" height="32" rx="7" fill="#9ca3af" stroke="#111827" stroke-width="1.5"/><rect x="1348" y="405" width="52" height="32" rx="7" fill="#9ca3af" stroke="#111827" stroke-width="1.5"/><rect x="1220" y="451" width="52" height="32" rx="7" fill="#9ca3af" stroke="#111827" stroke-width="1.5"/><rect x="1284" y="451" width="52" height="32" rx="7" fill="#9ca3af" stroke="#111827" stroke-width="1.5"/><rect x="1348" y="451" width="52" height="32" rx="7" fill="#9ca3af" stroke="#111827" stroke-width="1.5"/><rect x="1220" y="497" width="52" height="32" rx="7" fill="#9ca3af" stroke="#111827" stroke-width="1.5"/><rect x="1284" y="497" width="52" height="32" rx="7" fill="#9ca3af" stroke="#111827" stroke-width="1.5"/><rect x="1348" y="497" width="52" height="32" rx="7" fill="#9ca3af" stroke="#111827" stroke-width="1.5"/><rect x="1220" y="543" width="52" height="32" rx="7" fill="#ef4444" stroke="#111827" stroke-width="1.5"/><rect x="1284" y="543" width="52" height="32" rx="7" fill="#facc15" stroke="#111827" stroke-width="1.5"/><rect x="1348" y="543" width="52" height="32" rx="7" fill="#22c55e" stroke="#111827" stroke-width="1.5"/>
  </g>
  <g data-f="2">
    <rect x="694" y="306" width="340" height="214" rx="17" fill="#0f172a" opacity="0.12"/><rect x="690" y="300" width="340" height="214" rx="17" fill="#1e3a8a"/><path d="M690,433 Q860,396 1030,450 L1030,497 Q1030,514 1013,514 L707,514 Q690,514 690,497 Z" fill="#1d4ed8" opacity="0.55"/><path d="M962.0,366.7 q9.2,10.5 0,20.9" fill="none" stroke="#ffffff" stroke-width="3.090909090909091" stroke-linecap="round"/><path d="M973.8,357.5 q15.7,19.6 0,39.2" fill="none" stroke="#ffffff" stroke-width="3.090909090909091" stroke-linecap="round"/><path d="M985.5,348.3 q22.2,28.8 0,57.5" fill="none" stroke="#ffffff" stroke-width="3.090909090909091" stroke-linecap="round"/><rect x="724.0" y="370.686" width="51.0" height="51.407999999999994" rx="8" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M749.5,370.686 L749.5,422.094 M724.0,387.822 L743.38,387.822 M755.62,387.822 L775.0,387.822 M724.0,404.95799999999997 L743.38,404.95799999999997 M755.62,404.95799999999997 L775.0,404.95799999999997" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="743.38" y="381.99575999999996" width="12.24" height="28.78848" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/><text x="1009.6" y="342.84000000000003" text-anchor="end" style="font-size:23.8px;font-weight:800;fill:#e0e7ff">BANK</text><text x="724.0" y="479.928" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22.1px;font-weight:600;fill:#ffffff">•••• 1234</text>
    <path d="M1160,412 A60,60 0 0 1 1160,308" class="field"/>
    <path d="M1142,442 A95,95 0 0 1 1142,278" class="field"/>
    <path d="M1125,473 A130,130 0 0 1 1125,247" class="field"/>
    <path d="M1170,440 L1044,440" class="a-energy" marker-end="url(#m-energy)"/>
    <rect x="640" y="560" width="430" height="130" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="666" cy="590" r="18" fill="#ea580c"/><text x="666" y="596" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="694" y="596" text-anchor="start" style="font-size:20px;font-weight:800;fill:#ea580c">The field powers the chip</text><text x="656" y="626" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155"><tspan x="656" dy="0">The terminal’s 13.56 MHz magnetic</tspan><tspan x="656" dy="21">field induces power in the card’s coil.</tspan></text>
    <path d="M900,560 L1100,446" stroke="#fdba74" stroke-width="2"/><circle cx="1100" cy="446" r="5" fill="#fdba74"/>
  </g>
  <g data-f="3">
    <path d="M1044,360 L1170,360" class="a-signal" marker-end="url(#m-signal)" marker-start="url(#ms-signal)"/>
    <rect x="640" y="150" width="430" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="666" cy="180" r="18" fill="#2563eb"/><text x="666" y="186" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="694" y="186" text-anchor="start" style="font-size:20px;font-weight:800;fill:#2563eb">Commands ⇄ replies</text><text x="656" y="216" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155"><tspan x="656" dy="0">Only while the card sits in</tspan><tspan x="656" dy="21">the field — a few centimetres.</tspan></text>
    <path d="M900,270 L1100,354" stroke="#93c5fd" stroke-width="2"/><circle cx="1100" cy="354" r="5" fill="#93c5fd"/>
  </g>
  <g data-f="4">
    <rect x="1204" y="226" width="212" height="150" rx="12" fill="#dcfce7" stroke="#0f172a" stroke-width="3"/><circle cx="1310" cy="276" r="26" fill="#16a34a"/><path d="M1297,277 L1307,287 L1325,266" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1310" y="346" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#166534">Approved</text>
    <rect x="1120" y="650" width="420" height="150" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="1146" cy="680" r="18" fill="#16a34a"/><text x="1146" y="686" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="1174" y="686" text-anchor="start" style="font-size:20px;font-weight:800;fill:#16a34a">Who said yes?</text><text x="1136" y="716" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155"><tspan x="1136" dy="0">Usually the card’s issuer, reached over</tspan><tspan x="1136" dy="21">the payment network (Scene 15) — not</tspan><tspan x="1136" dy="21">the card or the terminal alone.</tspan></text>
    <text x="80" y="790" class="note" text-anchor="start">Field rings are an illustrative visualisation, not literal visible waves.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="106" y="866" class="s">Energy / power</text>
    <path d="M256.4,861 L290.4,861" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="302.4" y="866" class="s">Radio signal or wave</text>
    <text x="1540" y="866" class="note" text-anchor="end">Schematic. Fictional card.</text>
  </g>
</svg>
