  <text x="60" y="50" class="k">SCENE 86</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Three journeys, three different kinds of “wave”</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Same word, three mechanisms: what is physical, and what is mathematics.</text>
