    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 46</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Who can see what: one table, eight observers</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Apple Find My, as documented. Other ecosystems are compared in Scene 47.</text>
  <g>
    <rect x="60" y="160" width="1480" height="56" rx="10" fill="#f1f5f9"/>
    <text x="76" y="195" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">Observer</text>
    <text x="440.0" y="195" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">Radio identifier</text>
    <text x="640.0" y="195" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">Approx. location</text>
    <text x="840.0" y="195" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">Owner identity</text>
    <text x="1040.0" y="195" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">Finder identity</text>
    <text x="1240.0" y="195" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">Sealed report</text>
    <text x="1440.0" y="195" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">Service metadata</text>
  </g>
  <g data-f="1">
    <rect x="60" y="222" width="1480" height="56" rx="8" fill="#fbfaf7" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="257" text-anchor="start" style="font-size:16px;font-weight:700;fill:#14213d">The tag</text>
    <text x="440.0" y="257" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● its own</text>
    <text x="640.0" y="257" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="840.0" y="257" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="1040.0" y="257" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="1240.0" y="257" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="1440.0" y="257" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <rect x="60" y="284" width="1480" height="56" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="319" text-anchor="start" style="font-size:16px;font-weight:700;fill:#14213d">Passer-by’s phone</text>
    <text x="440.0" y="319" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● hears it</text>
    <text x="640.0" y="319" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● its own</text>
    <text x="840.0" y="319" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="1040.0" y="319" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● itself</text>
    <text x="1240.0" y="319" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● makes it</text>
    <text x="1440.0" y="319" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● its uploads</text>
    <rect x="60" y="346" width="1480" height="56" rx="8" fill="#fbfaf7" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="381" text-anchor="start" style="font-size:16px;font-weight:700;fill:#14213d">Nearby radio listener</text>
    <text x="440.0" y="381" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● hears it</text>
    <text x="640.0" y="381" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="840.0" y="381" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="1040.0" y="381" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="1240.0" y="381" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="1440.0" y="381" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
  </g>
  <g data-f="2">
    <rect x="60" y="408" width="1480" height="56" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="443" text-anchor="start" style="font-size:16px;font-weight:700;fill:#14213d">Relay operator (Apple)</text>
    <text x="440.0" y="443" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#92400e">≈ hash only</text>
    <text x="640.0" y="443" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="840.0" y="443" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#92400e">≈ who asks</text>
    <text x="1040.0" y="443" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#92400e">≈ connection</text>
    <text x="1240.0" y="443" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● stores it</text>
    <text x="1440.0" y="443" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● yes</text>
    <rect x="60" y="470" width="1480" height="56" rx="8" fill="#fbfaf7" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="505" text-anchor="start" style="font-size:16px;font-weight:700;fill:#14213d">Internet provider</text>
    <text x="440.0" y="505" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="640.0" y="505" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="840.0" y="505" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#92400e">≈ connection</text>
    <text x="1040.0" y="505" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#92400e">≈ connection</text>
    <text x="1240.0" y="505" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ TLS</text>
    <text x="1440.0" y="505" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#92400e">≈ traffic</text>
  </g>
  <g data-f="3">
    <rect x="60" y="532" width="1480" height="56" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="567" text-anchor="start" style="font-size:16px;font-weight:700;fill:#14213d">The owner</text>
    <text x="440.0" y="567" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● derives it</text>
    <text x="640.0" y="567" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● decrypts</text>
    <text x="840.0" y="567" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● themself</text>
    <text x="1040.0" y="567" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="1240.0" y="567" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● fetches</text>
    <text x="1440.0" y="567" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● own account</text>
    <rect x="60" y="594" width="1480" height="56" rx="8" fill="#fbfaf7" stroke="#e5e7eb" stroke-width="1"/>
    <text x="76" y="629" text-anchor="start" style="font-size:16px;font-weight:700;fill:#14213d">Person it is shared with</text>
    <text x="440.0" y="629" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#374151">? undisclosed</text>
    <text x="640.0" y="629" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● can view</text>
    <text x="840.0" y="629" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● knows owner</text>
    <text x="1040.0" y="629" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="1240.0" y="629" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#374151">? undisclosed</text>
    <text x="1440.0" y="629" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
  </g>
  <g data-f="4">
    <rect x="60" y="656" width="1480" height="56" rx="8" class="hz"/>
    <text x="76" y="691" text-anchor="start" style="font-size:16px;font-weight:700;fill:#14213d">Outside attacker</text>
    <text x="440.0" y="691" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#166534">● if nearby</text>
    <text x="640.0" y="691" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no*</text>
    <text x="840.0" y="691" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no*</text>
    <text x="1040.0" y="691" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="1240.0" y="691" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no*</text>
    <text x="1440.0" y="691" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="60" y="742" text-anchor="start" style="font-size:15px;font-weight:600;fill:#991b1b">* unless the attacker takes over the owner’s account (Scene 48) — then they see what the owner sees.</text>
    <text x="60" y="770" text-anchor="start" style="font-size:15px;font-weight:400;fill:#475569">● yes   ○ no   ≈ metadata only   ? not publicly documented.   Agrees with Module 5, demo D.</text>
    <text x="60" y="798" text-anchor="start" style="font-size:15px;font-weight:400;fill:#475569">Apple says it cannot read locations and reports do not identify the finder; connection metadata still exists.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="60" y="852" width="34" height="18" rx="3" class="hz" style="stroke-width:3"/>
    <text x="106" y="866" class="s">Attacker zone / hazard</text>
    <text x="1540" y="866" class="note" text-anchor="end">Apple Find My, documented design. Simplified.</text>
  </g>
</svg>
