<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 12: How the chip wakes up without a battery</title>
  <desc>Five frames along a power path: the reader’s changing field; the card coil, where an alternating voltage is induced; a rectifier that makes pulsing direct current; a capacitor and regulator that hold a steady supply; and the chip running. A final panel lists what changes how much power arrives.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 12</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">How the chip wakes up without a battery</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Changing field → induced AC → rectified → regulated → the chip runs.</text>
  <g data-f="1">
    <rect x="60" y="170" width="270" height="330" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="102" cy="214" r="26" fill="#2563eb"/><text x="102" y="223" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text>
    <text x="142" y="222" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Changing field</text>
    <text x="84" y="470" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">from the reader</text>
    <ellipse cx="195" cy="350" rx="90" ry="56" class="field"/><ellipse cx="195" cy="350" rx="60" ry="36" class="field"/><ellipse cx="195" cy="350" rx="30" ry="18" class="field"/>
    <text x="195" y="430" text-anchor="middle" style="font-style:italic;font-size:14px;font-weight:400;fill:#475569">illustrative field drawing</text>
  </g>
  <g data-f="2">
    <rect x="360" y="170" width="270" height="330" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="402" cy="214" r="26" fill="#ea580c"/><text x="402" y="223" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text>
    <text x="442" y="222" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Card coil</text>
    <text x="384" y="470" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16.5px;font-weight:600;fill:#334155">v = −N · dΦ/dt</text>
    <path d="M334,335 L356,335" class="a-energy" marker-end="url(#m-energy)"/>
    <rect x="410.0" y="280.0" width="170" height="100" rx="18" class="coil"/>
    <rect x="420.0" y="290.0" width="150" height="80" rx="15" class="coil"/>
    <rect x="430.0" y="300.0" width="130" height="60" rx="12" class="coil"/>
    <path d="M420,410 q15,-34 30,0 t30,0 t30,0 t30,0 t30,0" fill="none" stroke="#ea580c" stroke-width="3"/>
  </g>
  <g data-f="3">
    <rect x="660" y="170" width="270" height="330" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="702" cy="214" r="26" fill="#ea580c"/><text x="702" y="223" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text>
    <text x="742" y="222" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Rectifier</text>
    <text x="684" y="470" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">AC → pulsing DC</text>
    <path d="M634,335 L656,335" class="a-energy" marker-end="url(#m-energy)"/>
    <path d="M755,290 L805,320 L755,350 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="3"/><path d="M805,290 L805,350" stroke="#9a3412" stroke-width="4"/>
    <path d="M720,410 q15,-40 30,0 q15,-40 30,0 q15,-40 30,0 q15,-40 30,0 q15,-40 30,0" fill="none" stroke="#ea580c" stroke-width="3"/><line x1="720" y1="410" x2="870" y2="410" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <g data-f="4">
    <rect x="960" y="170" width="270" height="330" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="1002" cy="214" r="26" fill="#ea580c"/><text x="1002" y="223" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text>
    <text x="1042" y="222" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d"><tspan x="1042" dy="0">Capacitor +</tspan><tspan x="1042" dy="27">regulator</tspan></text>
    <text x="984" y="470" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">steady supply rail</text>
    <path d="M934,335 L956,335" class="a-energy" marker-end="url(#m-energy)"/>
    <path d="M1045,280 L1045,350 M1025,315 L1065,315 M1025,325 L1065,325" stroke="#9a3412" stroke-width="4" fill="none"/><rect x="1095" y="285" width="70" height="60" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="3"/>
    <text x="1130" y="322" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#9a3412">REG</text>
    <path d="M1020,395 L1170,395" stroke="#ea580c" stroke-width="4"/><line x1="1020" y1="420" x2="1170" y2="420" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <g data-f="5">
    <rect x="1260" y="170" width="270" height="330" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="1302" cy="214" r="26" fill="#7c3aed"/><text x="1302" y="223" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text>
    <text x="1342" y="222" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Chip runs</text>
    <text x="1284" y="470" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">clock, logic, crypto</text>
    <path d="M1234,335 L1256,335" class="a-energy" marker-end="url(#m-energy)"/>
    <rect x="1335" y="270" width="120" height="120" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
    <path d="M1323,284 L1335,284 M1455,284 L1467,284" stroke="#6d28d9" stroke-width="3"/>
    <path d="M1323,306 L1335,306 M1455,306 L1467,306" stroke="#6d28d9" stroke-width="3"/>
    <path d="M1323,328 L1335,328 M1455,328 L1467,328" stroke="#6d28d9" stroke-width="3"/>
    <path d="M1323,350 L1335,350 M1455,350 L1467,350" stroke="#6d28d9" stroke-width="3"/>
    <path d="M1323,372 L1335,372 M1455,372 L1467,372" stroke="#6d28d9" stroke-width="3"/>
    <path d="M1381,318 L1381,308 a14,14 0 0 1 28,0 L1409,318" fill="none" stroke="#6d28d9" stroke-width="5.0"/><rect x="1371" y="316" width="48" height="38" rx="6" fill="#6d28d9"/><circle cx="1395" cy="332" r="5" fill="#ffffff"/><rect x="1393" y="334" width="4" height="10" fill="#ffffff"/>
    <text x="60" y="556" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">How much power arrives is not fixed</text>
    <rect x="60" y="580" width="352" height="140" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><text x="76" y="616" text-anchor="start" style="font-size:19px;font-weight:800;fill:#b45309">Distance</text><text x="76" y="645" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155"><tspan x="76" dy="0">coupling falls very steeply as</tspan><tspan x="76" dy="20">the card moves away</tspan></text>
    <rect x="432" y="580" width="352" height="140" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><text x="448" y="616" text-anchor="start" style="font-size:19px;font-weight:800;fill:#b45309">Alignment &amp; size</text><text x="448" y="645" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155"><tspan x="448" dy="0">the field must thread the loop;</tspan><tspan x="448" dy="20">tilt or a smaller coil gets less</tspan></text>
    <rect x="804" y="580" width="352" height="140" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><text x="820" y="616" text-anchor="start" style="font-size:19px;font-weight:800;fill:#b45309">Tuning</text><text x="820" y="645" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155"><tspan x="820" dy="0">metal, other cards or very close</tspan><tspan x="820" dy="20">placement can detune both sides</tspan></text>
    <rect x="1176" y="580" width="352" height="140" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><text x="1192" y="616" text-anchor="start" style="font-size:19px;font-weight:800;fill:#b45309">Load</text><text x="1192" y="645" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155"><tspan x="1192" dy="0">computing draws more current;</tspan><tspan x="1192" dy="20">designs must allow for it</tspan></text>
    <text x="60" y="770" class="note" text-anchor="start">No calibrated watts anywhere in this lesson: real values depend on the reader, the card and placement.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="106" y="866" class="s">Energy / power</text>
  </g>
</svg>
