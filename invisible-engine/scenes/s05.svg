<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 05: Three antennas, three jobs</title>
  <desc>Three frames. A card-sized loop antenna with a few turns that couples magnetically at 13.56 MHz; a small Bluetooth antenna, a printed trace roughly a quarter wavelength long at 2.4 GHz, that radiates; and an Ultra Wideband module with several antennas, built for wide bandwidth and angle measurement.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 05</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Three antennas, three jobs</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">A loop that couples, a trace that radiates, an array that times and points.</text>
  <g data-f="1">
    <rect x="60" y="160" width="470" height="650" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="102" cy="204" r="26" fill="#ea580c"/><text x="102" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="142" y="214" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Loop / coil</text><text x="142" y="244" text-anchor="start" style="font-size:17px;font-weight:600;fill:#ea580c">NFC · HF RFID</text>
    <rect x="99" y="276" width="400" height="252" rx="20" fill="#0f172a" opacity="0.12"/><rect x="95" y="270" width="400" height="252" rx="20" fill="#1e3a8a"/><path d="M95,426 Q295,383 495,446 L495,502 Q495,522 475,522 L115,522 Q95,522 95,502 Z" fill="#1d4ed8" opacity="0.55"/><rect x="115" y="290" width="248" height="212" rx="14" fill="#fdf6e3" stroke="#d6c7a1" stroke-width="1.5"/><rect x="125.0" y="300.0" width="228.0" height="192.0" rx="12" fill="none" stroke="#b45309" stroke-width="2.2"/><rect x="132.2" y="307.2" width="213.6" height="177.6" rx="10" fill="none" stroke="#b45309" stroke-width="2.2"/><rect x="139.4" y="314.4" width="199.2" height="163.2" rx="8" fill="none" stroke="#b45309" stroke-width="2.2"/><rect x="146.6" y="321.6" width="184.8" height="148.8" rx="6" fill="none" stroke="#b45309" stroke-width="2.2"/><rect x="203.0" y="353.16" width="60.0" height="60.48" rx="10" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M233.0,353.16 L233.0,413.64000000000004 M203.0,373.32000000000005 L225.8,373.32000000000005 M240.2,373.32000000000005 L263.0,373.32000000000005 M203.0,393.48 L225.8,393.48 M240.2,393.48 L263.0,393.48" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="225.8" y="366.46560000000005" width="14.399999999999999" height="33.8688" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/>
    <text x="295" y="560" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#9a3412">85.60 × 53.98 mm card (ID-1)</text>
    <text x="90" y="610" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d"><tspan x="90" dy="0">Job: couple to a reader coil</tspan><tspan x="90" dy="25">through the magnetic near field.</tspan></text>
    <text x="90" y="690" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155"><tspan x="90" dy="0">• a few turns near the edge</tspan><tspan x="90" dy="21">• tuned near 13.56 MHz</tspan><tspan x="90" dy="21">• more area, more flux</tspan><tspan x="90" dy="21">• not built to radiate far</tspan></text>
  </g>
  <g data-f="2">
    <rect x="565" y="160" width="470" height="650" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="607" cy="204" r="26" fill="#2563eb"/><text x="607" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="647" y="214" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Small radiator</text><text x="647" y="244" text-anchor="start" style="font-size:17px;font-weight:600;fill:#2563eb">Bluetooth LE · 2.4 GHz</text>
    <rect x="625" y="280" width="350" height="230" rx="14" fill="#166534" stroke="#14532d" stroke-width="3"/><path d="M690,470 L690,320 L760,320 L760,380 L830,380 L830,320 L930,320" fill="none" stroke="#fcd34d" stroke-width="7" stroke-linejoin="round"/><rect x="660" y="450" width="70" height="44" rx="4" fill="#111827"/><circle cx="890" cy="455" r="18" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
    <text x="800" y="545" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#1e3a8a">printed trace ≈ λ/4 ≈ 3 cm, often meandered</text>
    <text x="595" y="610" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d"><tspan x="595" dy="0">Job: launch a wave that</tspan><tspan x="595" dy="25">phones metres away can hear.</tspan></text>
    <text x="595" y="690" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155"><tspan x="595" dy="0">• size is a fraction of λ</tspan><tspan x="595" dy="21">• efficiency vs size vs bandwidth</tspan><tspan x="595" dy="21">• detuned by hands and bodies</tspan><tspan x="595" dy="21">• pattern is not a neat sphere</tspan></text>
  </g>
  <g data-f="3">
    <rect x="1070" y="160" width="470" height="650" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="1112" cy="204" r="26" fill="#7c3aed"/><text x="1112" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="1152" y="214" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Wideband array</text><text x="1152" y="244" text-anchor="start" style="font-size:17px;font-weight:600;fill:#7c3aed">UWB · ~6.5 / 8 GHz</text>
    <rect x="1130" y="280" width="350" height="230" rx="14" fill="#1e1b4b" stroke="#312e81" stroke-width="3"/>
    <rect x="1174" y="309" width="52" height="52" rx="6" fill="#fcd34d" stroke="#a16207" stroke-width="3"/>
    <rect x="1384" y="309" width="52" height="52" rx="6" fill="#fcd34d" stroke="#a16207" stroke-width="3"/>
    <rect x="1279" y="429" width="52" height="52" rx="6" fill="#fcd34d" stroke="#a16207" stroke-width="3"/>
    <path d="M1226,335 L1384,335 M1200,361 L1290,445 M1410,361 L1320,445" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="1305" y="545" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#5b21b6">several antennas → angle of arrival</text>
    <text x="1100" y="610" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d"><tspan x="1100" dy="0">Job: send and time very short</tspan><tspan x="1100" dy="25">pulses over ≥ 500 MHz.</tspan></text>
    <text x="1100" y="690" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155"><tspan x="1100" dy="0">• wide bandwidth = sharp timing</tspan><tspan x="1100" dy="21">• phase differences give direction</tspan><tspan x="1100" dy="21">• needs a compatible partner</tspan></text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Schematic; real antenna geometry varies by product.</text>
  </g>
</svg>
