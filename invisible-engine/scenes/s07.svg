<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 07: Four different questions: who, near, where, which way</title>
  <desc>Four frames. Identity: a tag sends an identifier a phone can hear. Proximity: received signal strength jumps about, a noisy clue. Location: a phone computes its own coordinates from satellite signals; a tag without a receiver cannot. Distance and direction: two compatible devices exchange timed Ultra Wideband messages.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 07</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Four different questions: who, near, where, which way</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">A broadcasting tag is not a satellite navigation receiver.</text>
  <g data-f="1">
    <rect x="60" y="160" width="720" height="310" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="102" cy="204" r="26" fill="#2563eb"/><text x="102" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="142" y="214" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Identity: “what is this?”</text>
    <circle cx="173" cy="345" r="44" fill="#0f172a" opacity="0.13"/><circle cx="170" cy="340" r="44" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="170" cy="340" r="27" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M203,327 q9,13 0,25" fill="none" stroke="#2563eb" stroke-width="3.6" stroke-linecap="round" opacity="1.00"/><path d="M215,317 q14,23 0,47" fill="none" stroke="#2563eb" stroke-width="3.6" stroke-linecap="round" opacity="0.80"/><path d="M228,306 q20,34 0,68" fill="none" stroke="#2563eb" stroke-width="3.6" stroke-linecap="round" opacity="0.60"/>
    <path d="M270,340 L520,340" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="323" y="302" width="145" height="26" rx="6" class="lab"/>
    <text x="395" y="320" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#1d4ed8"><tspan x="395" dy="0">an identifier</tspan></text>
    <rect x="565" y="257" width="90" height="180" rx="15" fill="#0f172a" opacity="0.14"/><rect x="560" y="250" width="90" height="180" rx="15" fill="#111827"/><rect x="565" y="255" width="79" height="169" rx="12" fill="#eff6ff"/><rect x="592" y="259" width="25" height="6" rx="3" fill="#111827"/>
    <text x="100" y="450" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">Which object, or which rotating code — not where.</text>
  </g>
  <g data-f="2">
    <rect x="820" y="160" width="720" height="310" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="862" cy="204" r="26" fill="#0d9488"/><text x="862" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="902" y="214" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Proximity: “is it near?”</text>
    <rect x="880" y="380" width="30" height="40" rx="4" fill="#5eead4"/>
    <rect x="924" y="330" width="30" height="90" rx="4" fill="#5eead4"/>
    <rect x="968" y="360" width="30" height="60" rx="4" fill="#5eead4"/>
    <rect x="1012" y="300" width="30" height="120" rx="4" fill="#5eead4"/>
    <rect x="1056" y="350" width="30" height="70" rx="4" fill="#5eead4"/>
    <rect x="1100" y="310" width="30" height="110" rx="4" fill="#5eead4"/>
    <rect x="1144" y="370" width="30" height="50" rx="4" fill="#5eead4"/>
    <rect x="1188" y="325" width="30" height="95" rx="4" fill="#5eead4"/>
    <rect x="1232" y="340" width="30" height="80" rx="4" fill="#5eead4"/>
    <rect x="1276" y="290" width="30" height="130" rx="4" fill="#5eead4"/>
    <rect x="1365" y="257" width="90" height="180" rx="15" fill="#0f172a" opacity="0.14"/><rect x="1360" y="250" width="90" height="180" rx="15" fill="#111827"/><rect x="1365" y="255" width="79" height="169" rx="12" fill="#f0fdfa"/><rect x="1392" y="259" width="25" height="6" rx="3" fill="#111827"/>
    <text x="860" y="450" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">Signal strength (RSSI) jumps with bodies and walls.</text>
  </g>
  <g data-f="3">
    <rect x="60" y="490" width="720" height="320" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="102" cy="534" r="26" fill="#16a34a"/><text x="102" y="543" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="142" y="544" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Location: “where on Earth?”</text>
    <rect x="137" y="591" width="25" height="18" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="98" y="593" width="36" height="14" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><rect x="166" y="593" width="36" height="14" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
    <rect x="317" y="566" width="25" height="18" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="278" y="568" width="36" height="14" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><rect x="346" y="568" width="36" height="14" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
    <rect x="497" y="586" width="25" height="18" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="458" y="588" width="36" height="14" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><rect x="526" y="588" width="36" height="14" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
    <path d="M160,625 L580,690" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M330,600 L590,685" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M500,620 L600,680" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="605" y="647" width="80" height="160" rx="14" fill="#0f172a" opacity="0.14"/><rect x="600" y="640" width="80" height="160" rx="14" fill="#111827"/><rect x="605" y="645" width="70" height="150" rx="11" fill="#f0fdf4"/><rect x="629" y="648" width="22" height="6" rx="3" fill="#111827"/>
    <text x="100" y="760" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155"><tspan x="100" dy="0">The phone computes its own coordinates.</tspan><tspan x="100" dy="21">A tag without a receiver cannot.</tspan></text>
  </g>
  <g data-f="4">
    <rect x="820" y="490" width="720" height="320" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="862" cy="534" r="26" fill="#7c3aed"/><text x="862" y="543" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text><text x="902" y="544" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Distance &amp; direction: “how far, which way?”</text>
    <rect x="885" y="597" width="90" height="180" rx="15" fill="#0f172a" opacity="0.14"/><rect x="880" y="590" width="90" height="180" rx="15" fill="#111827"/><rect x="885" y="595" width="79" height="169" rx="12" fill="#f5f3ff"/><rect x="912" y="599" width="25" height="6" rx="3" fill="#111827"/>
    <circle cx="1423" cy="685" r="40" fill="#0f172a" opacity="0.13"/><circle cx="1420" cy="680" r="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="1420" cy="680" r="25" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M990,680 L1370,680" class="a-signal" marker-end="url(#m-signal)" marker-start="url(#ms-signal)"/>
    <rect x="1031" y="642" width="298" height="26" rx="6" class="lab"/>
    <text x="1180" y="660" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#1d4ed8"><tspan x="1180" dy="0">timed UWB exchange: d = c · t</tspan></text>
    <text x="1000" y="760" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155"><tspan x="1000" dy="0">Two compatible devices, short range —</tspan><tspan x="1000" dy="21">not a map position.</tspan></text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="106" y="866" class="s">Radio signal or wave</text>
  </g>
</svg>
