<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 48: Where the account is the weak point</title>
  <desc>Five frames around one account with its trusted devices. Seven risks appear as red dashed cards, each with what it needs and what it exposes: 1, the account, its trusted devices and shares. 2, a shared or reused password, and an old trusted device nobody manages. 3, coercive access by someone close, and a share nobody remembers. 4, account takeover, and abuse of account recovery. 5, shared household permissions, and the defences: review devices and sharing (for example Apple’s Safety Check), a unique password with two-factor authentication, and a recovery method you control.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 48</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Where the account is the weak point</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Strong encryption protects the reports. It cannot tell who is holding the account.</text>
  <g data-f="1">
    <path d="M710,396 a64,64 0 0 1 6,-109 a83,83 0 0 1 160,-21 a58,58 0 0 1 13,130 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/><text x="800.0" y="357.28" text-anchor="middle" style="font-size:24.0px;font-weight:700;fill:#14213d">one account</text>
    <rect x="625" y="427" width="70" height="130" rx="12" fill="#0f172a" opacity="0.14"/><rect x="620" y="420" width="70" height="130" rx="12" fill="#111827"/><rect x="624" y="424" width="62" height="122" rx="9" fill="#f8fafc"/><rect x="645" y="427" width="20" height="5" rx="2" fill="#111827"/>
    <rect x="765" y="427" width="70" height="130" rx="12" fill="#0f172a" opacity="0.14"/><rect x="760" y="420" width="70" height="130" rx="12" fill="#111827"/><rect x="764" y="424" width="62" height="122" rx="9" fill="#f8fafc"/><rect x="785" y="427" width="20" height="5" rx="2" fill="#111827"/>
    <rect x="905" y="427" width="70" height="130" rx="12" fill="#0f172a" opacity="0.14"/><rect x="900" y="420" width="70" height="130" rx="12" fill="#111827"/><rect x="904" y="424" width="62" height="122" rx="9" fill="#f8fafc"/><rect x="925" y="427" width="20" height="5" rx="2" fill="#111827"/>
    <text x="800" y="580" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">trusted devices and shares</text>
  </g>
  <g data-f="2">
    <rect x="60" y="160" width="360" height="190" rx="12" class="hz"/>
    <text x="76" y="192" text-anchor="start" style="font-size:18px;font-weight:800;fill:#991b1b">Shared or reused password</text><text x="76" y="218" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="76" dy="0">Needs: the password, and a way</tspan><tspan x="76" dy="19">past 2FA. Exposes: what the</tspan><tspan x="76" dy="19">owner sees.</tspan></text>
    <rect x="1180" y="160" width="360" height="190" rx="12" class="hz"/>
    <text x="1196" y="192" text-anchor="start" style="font-size:18px;font-weight:800;fill:#991b1b">Forgotten trusted device</text><text x="1196" y="218" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="1196" dy="0">Needs: an old phone still signed</tspan><tspan x="1196" dy="19">in. Exposes: the owner’s view,</tspan><tspan x="1196" dy="19">for whoever holds it.</tspan></text>
  </g>
  <g data-f="3">
    <rect x="60" y="370" width="360" height="190" rx="12" class="hz"/>
    <text x="76" y="402" text-anchor="start" style="font-size:18px;font-weight:800;fill:#991b1b">Coercive access</text><text x="76" y="428" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="76" dy="0">Needs: someone with power over</tspan><tspan x="76" dy="19">the owner. Exposes: whatever</tspan><tspan x="76" dy="19">they are made to show.</tspan></text>
    <rect x="1180" y="370" width="360" height="190" rx="12" class="hz"/>
    <text x="1196" y="402" text-anchor="start" style="font-size:18px;font-weight:800;fill:#991b1b">A share nobody remembers</text><text x="1196" y="428" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="1196" dy="0">Needs: an old share not</tspan><tspan x="1196" dy="19">reviewed. Exposes: the item’s</tspan><tspan x="1196" dy="19">location, to that person.</tspan></text>
  </g>
  <g data-f="4">
    <rect x="60" y="580" width="360" height="190" rx="12" class="hz"/>
    <text x="76" y="612" text-anchor="start" style="font-size:18px;font-weight:800;fill:#991b1b">Account takeover</text><text x="76" y="638" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="76" dy="0">Needs: credentials plus a 2FA</tspan><tspan x="76" dy="19">bypass. Exposes: all items,</tspan><tspan x="76" dy="19">as the owner.</tspan></text>
    <rect x="1180" y="580" width="360" height="190" rx="12" class="hz"/>
    <text x="1196" y="612" text-anchor="start" style="font-size:18px;font-weight:800;fill:#991b1b">Recovery abuse</text><text x="1196" y="638" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="1196" dy="0">Needs: control of a recovery</tspan><tspan x="1196" dy="19">path. Exposes: the account</tspan><tspan x="1196" dy="19">after reset.</tspan></text>
  </g>
  <g data-f="5">
    <rect x="460" y="610" width="680" height="90" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><text x="476" y="642" text-anchor="start" style="font-size:18px;font-weight:800;fill:#b45309">Shared household permissions</text><text x="476" y="668" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="476" dy="0">Family or shared accounts can mean several people</tspan><tspan x="476" dy="19">see one item — by design, until reviewed.</tspan></text>
    <rect x="460" y="712" width="680" height="104" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="484" y="756" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d">Defences</text>
    <text x="484" y="784" text-anchor="start" style="font-size:15px;font-weight:400;fill:#14532d">Review devices and sharing (e.g. Apple Safety Check) · unique</text>
    <text x="484" y="805" text-anchor="start" style="font-size:15px;font-weight:400;fill:#14532d">password + 2FA · a recovery method you control</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="60" y="852" width="34" height="18" rx="3" class="hz" style="stroke-width:3"/>
    <text x="106" y="866" class="s">Attacker zone / hazard</text>
    <text x="1540" y="866" class="note" text-anchor="end">Defensive summary; no attack steps.</text>
  </g>
</svg>
