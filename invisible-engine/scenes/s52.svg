<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 52: Alerts across iPhone and Android</title>
  <desc>Five frames. 1, trackers from different makers follow one industry specification for detecting unwanted trackers, and phones on both platforms — an iPhone on iOS 17.5 or later and an Android phone on Android 6.0 or later — can show an alert that an unknown tracker is moving with you; Apple and Google announced this in May 2024. 2, deployed: built into both platforms and working with trackers whose makers adopt the specification. 3, the standards track: an IETF working group is turning the work into standards; drafts change, so check their current status. 4, edge conditions in a red dashed box: a tag often near its owner, short trips, Bluetooth or location off or old software, trackers that do not follow the specification, and manual scans that see what is near now rather than what followed you. 5, no timing guarantee: an alert is a prompt to check, and no alert is not proof of safety.</desc>
  <style>
