    <path d="M262,220 L420,315" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="133" cy="317" r="30" fill="#0f172a" opacity="0.13"/><circle cx="130" cy="312" r="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="130" cy="312" r="19" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/><text x="178" y="318" text-anchor="start" style="font-size:15px;font-weight:600;fill:#475569">tracker B</text>
    <path d="M262,312 L420,315" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="133" cy="409" r="30" fill="#0f172a" opacity="0.13"/><circle cx="130" cy="404" r="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="130" cy="404" r="19" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/><text x="178" y="410" text-anchor="start" style="font-size:15px;font-weight:600;fill:#475569">tracker C</text>
    <path d="M262,404 L420,315" stroke="#94a3b8" stroke-width="2.5"/>
    <path d="M420,220 L546,220 L580,254 L580,420 L420,420 Z" fill="#ffffff" stroke="#334155" stroke-width="3"/><path d="M546,220 L546,254 L580,254" fill="none" stroke="#334155" stroke-width="3"/><rect x="438" y="290" width="124" height="7" rx="3" fill="#cbd5e1"/><rect x="438" y="310" width="124" height="7" rx="3" fill="#cbd5e1"/><rect x="438" y="330" width="124" height="7" rx="3" fill="#cbd5e1"/><rect x="438" y="350" width="124" height="7" rx="3" fill="#cbd5e1"/><rect x="438" y="370" width="94" height="7" rx="3" fill="#cbd5e1"/><text x="500.0" y="272" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#14213d">DULT spec</text>
    <path d="M500,220 L500,162 L975,162 L975,180 M775,162 L775,180" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
    <rect x="710" y="187" width="140" height="270" rx="24" fill="#0f172a" opacity="0.14"/><rect x="705" y="180" width="140" height="270" rx="24" fill="#111827"/><rect x="713" y="188" width="123" height="253" rx="19" fill="#f8fafc"/><rect x="755" y="194" width="39" height="10" rx="5" fill="#111827"/><rect x="718" y="230" width="114" height="84" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/><circle cx="734" cy="248" r="7" fill="#f59e0b"/><text x="748" y="253" text-anchor="start" style="font-size:12.5px;font-weight:700;fill:#14213d">Tracker</text><text x="748" y="271" text-anchor="start" style="font-size:12.5px;font-weight:400;fill:#14213d">moving with</text><text x="748" y="289" text-anchor="start" style="font-size:12.5px;font-weight:400;fill:#14213d">you</text>
    <text x="775" y="478" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#334155">iPhone · iOS 17.5+</text>
    <rect x="910" y="187" width="140" height="270" rx="24" fill="#0f172a" opacity="0.14"/><rect x="905" y="180" width="140" height="270" rx="24" fill="#111827"/><rect x="913" y="188" width="123" height="253" rx="19" fill="#f8fafc"/><rect x="955" y="194" width="39" height="10" rx="5" fill="#111827"/><rect x="918" y="230" width="114" height="84" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/><circle cx="934" cy="248" r="7" fill="#f59e0b"/><text x="948" y="253" text-anchor="start" style="font-size:12.5px;font-weight:700;fill:#14213d">Tracker</text><text x="948" y="271" text-anchor="start" style="font-size:12.5px;font-weight:400;fill:#14213d">moving with</text><text x="948" y="289" text-anchor="start" style="font-size:12.5px;font-weight:400;fill:#14213d">you</text>
    <text x="975" y="478" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#334155">Android 6.0+</text>
    <rect x="1100" y="180" width="440" height="170" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="1126" cy="210" r="18" fill="#2563eb"/><text x="1126" y="216" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="1154" y="216" text-anchor="start" style="font-size:19px;font-weight:800;fill:#2563eb">One specification, two platforms</text><text x="1116" y="245" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1116" dy="0">Apple and Google wrote one industry</tspan><tspan x="1116" dy="21">specification. Both platforms alert about</tspan><tspan x="1116" dy="21">compatible trackers (May 2024).</tspan></text>
    <text x="130" y="470" text-anchor="start" style="font-size:14px;font-weight:400;fill:#475569">Trackers from makers that adopt it</text>
  </g>
  <g data-f="2">
    <rect x="60" y="506" width="470" height="194" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="102" cy="550" r="26" fill="#16a34a"/><text x="102" y="559" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="142" y="560" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Deployed</text>
    <text x="84" y="600" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">Built into iOS 17.5+ and Android 6.0+</text><text x="84" y="626" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">since May 2024. Works with trackers</text><text x="84" y="652" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">whose makers adopt the specification.</text>
  </g>
  <g data-f="3">
    <rect x="555" y="506" width="470" height="194" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="597" cy="550" r="26" fill="#b45309"/><text x="597" y="559" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="637" y="560" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Standards track</text>
    <text x="579" y="600" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">The IETF DULT working group is turning</text><text x="579" y="626" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">the work into standards. Drafts change:</text><text x="579" y="652" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">check current status. A draft is not a promise.</text>
  </g>
  <g data-f="4">
    <rect x="1050" y="380" width="490" height="320" rx="14" class="hz"/>
    <circle cx="1084" cy="414" r="18" fill="#dc2626"/><text x="1084" y="420" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="1112" y="421" text-anchor="start" style="font-size:19px;font-weight:800;fill:#b91c1c">When an alert may not come</text>
    <text x="1074" y="458" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">• The tag is often near its owner</text><text x="1074" y="494" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">• A short trip: not enough time together</text><text x="1074" y="530" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">• Bluetooth or location off; old software</text><text x="1074" y="566" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">• A tracker that does not follow the spec</text><text x="1074" y="602" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">• A manual scan sees what is near now,</text><text x="1074" y="638" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">   not what followed you</text>
  </g>
  <g data-f="5">
    <rect x="60" y="716" width="1480" height="100" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="102" cy="760" r="26" fill="#334155"/><text x="102" y="769" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text><text x="142" y="770" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">No timing guarantee</text>
    <text x="140" y="798" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">Neither platform promises how soon an alert appears. An alert is a prompt to check; no alert is not proof of safety.</text>
  </g>
