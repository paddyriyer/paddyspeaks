  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 52</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Alerts across iPhone and Android</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Since May 2024 both platforms alert about compatible trackers. The standard is still being written.</text>
