<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 37: How the owner gets the answer</title>
  <desc>Five frames. The owner opens Find My on a device signed in to their Apple Account; that device regenerates the public keys its tag would have used and their lookup hashes; it asks the relay for reports filed under those hashes and downloads the encrypted reports; it decrypts them locally with the matching private keys and shows an estimated location with a time; and a contrast: sightings arrive as separate, delayed points, not a continuous live track.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 37</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">How the owner gets the answer</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">The owner’s own device does the decrypting. What it shows is a last-seen point, not a live feed.</text>
  <g data-f="1">
    <rect x="60" y="170" width="470" height="430" rx="18" class="bound"/>
    <text x="82" y="206" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">Owner’s device</text>
    <rect x="115" y="237" width="170" height="340" rx="29" fill="#0f172a" opacity="0.14"/><rect x="110" y="230" width="170" height="340" rx="29" fill="#111827"/><rect x="120" y="240" width="150" height="320" rx="23" fill="#f8fafc"/><rect x="171" y="247" width="48" height="12" rx="6" fill="#111827"/>
    <text x="195" y="290" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#14213d">Find My</text>
    <path d="M697,313 a52,52 0 0 1 5,-89 a68,68 0 0 1 130,-17 a47,47 0 0 1 10,106 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/><text x="770.0" y="281.54" text-anchor="middle" style="font-size:19.5px;font-weight:700;fill:#14213d">Apple Account</text>
    <path d="M290,260 L650,260" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="359" y="212" width="222" height="26" rx="6" class="lab"/>
    <text x="470" y="230" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#4b5563"><tspan x="470" dy="0">signed in, two-factor</tspan></text>
    <rect x="560" y="500" width="370" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="586" cy="530" r="18" fill="#334155"/><text x="586" y="536" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="614" y="536" text-anchor="start" style="font-size:19px;font-weight:800;fill:#334155">Open Find My</text><text x="576" y="565" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="576" dy="0">On a device signed in to the owner’s</tspan><tspan x="576" dy="21">Apple Account.</tspan></text>
  </g>
  <g data-f="2">
    <rect x="300" y="300" width="210" height="150" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="405" y="330" text-anchor="middle" style="font-size:15.5px;font-weight:800;fill:#166534">regenerate keys</text>
    <text x="405" y="358" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:14.5px;font-weight:400;fill:#334155">P₁₇, P₁₈ … P₂₄</text>
    <text x="405" y="386" text-anchor="middle" style="font-size:15.5px;font-weight:800;fill:#166534">hash each one</text>
    <text x="405" y="414" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:14.5px;font-weight:400;fill:#334155">SHA-256(Pᵢ)</text>
  </g>
  <g data-f="3">
    <rect x="1040" y="170" width="500" height="290" rx="18" class="bound"/>
    <text x="1062" y="206" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">Find My relay (Apple)</text>
    <rect x="1080" y="236" width="108" height="38" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="1096" cy="255" r="4" fill="#22c55e"/><rect x="1116" y="250" width="58" height="9" rx="3" fill="#94a3b8"/><rect x="1080" y="281" width="108" height="38" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="1096" cy="300" r="4" fill="#22c55e"/><rect x="1116" y="295" width="58" height="9" rx="3" fill="#94a3b8"/><rect x="1080" y="326" width="108" height="38" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="1096" cy="345" r="4" fill="#22c55e"/><rect x="1116" y="340" width="58" height="9" rx="3" fill="#94a3b8"/>
    <text x="1230" y="280" text-anchor="start" style="font-size:16px;font-weight:600;fill:#334155">reports filed</text><text x="1230" y="304" text-anchor="start" style="font-size:16px;font-weight:600;fill:#334155">under hashes</text>
    <path d="M520,400 L1030,400" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="636" y="352" width="289" height="26" rx="6" class="lab"/>
    <text x="780" y="370" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#15803d"><tspan x="780" dy="0">request: these lookup hashes</tspan></text>
    <path d="M1030,440 L520,440" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="645" y="458" width="270" height="26" rx="6" class="lab"/>
    <text x="780" y="476" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#7e22ce"><tspan x="780" dy="0">matching encrypted reports</tspan></text>
  </g>
  <g data-f="4">
    <rect x="128" y="330" width="134" height="150" rx="10" fill="#ecfdf5" stroke="#94a3b8" stroke-width="2"/><path d="M128,382 L262,412 M168,330 L188,480 M222,330 L211,480" stroke="#ffffff" stroke-width="9"/><path d="M128,382 L262,412 M168,330 L188,480 M222,330 L211,480" stroke="#cbd5e1" stroke-width="1.5"/><rect x="135" y="423" width="24" height="38" rx="4" fill="#bbf7d0"/>
    <path d="M195,420 C176,392 176,370 195,368 C214,370 214,392 195,420 Z" fill="#2563eb"/><circle cx="195" cy="385" r="6" fill="#ffffff"/>
    <text x="195" y="510" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#14213d">near Platform 3</text>
    <text x="195" y="532" text-anchor="middle" style="font-size:13.5px;font-weight:400;fill:#475569">seen 14 min ago</text>
    <rect x="960" y="500" width="580" height="110" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="986" cy="530" r="18" fill="#7c3aed"/><text x="986" y="536" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="1014" y="536" text-anchor="start" style="font-size:19px;font-weight:800;fill:#7c3aed">Decrypted on the device</text><text x="976" y="565" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="976" dy="0">Only the owner’s devices hold the private</tspan><tspan x="976" dy="21">keys dᵢ. The result: a place and a time.</tspan></text>
  </g>
  <g data-f="5">
    <rect x="60" y="712" width="1480" height="108" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="102" cy="756" r="26" fill="#b45309"/><text x="102" y="765" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text><text x="142" y="766" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d">A sighting, not live tracking</text>
    <path d="M560,766 L1500,766" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="600" cy="766" r="9" fill="#2563eb"/>
    <circle cx="690" cy="766" r="9" fill="#2563eb"/>
    <circle cx="940" cy="766" r="9" fill="#2563eb"/>
    <circle cx="1010" cy="766" r="9" fill="#2563eb"/>
    <circle cx="1380" cy="766" r="9" fill="#2563eb"/>
    <text x="100" y="798" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">Points arrive when phones pass by, with delays and gaps.</text>
    <text x="1180" y="800" text-anchor="start" style="font-style:italic;font-size:14px;font-weight:400;fill:#475569">times illustrative</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="106" y="866" class="s">Plaintext / local information</text>
    <path d="M385.4,861 L419.4,861" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="431.4" y="866" class="s">Encrypted / cryptographic</text>
    <path d="M676.4,861 L710.4,861" class="a-admin" marker-end="url(#m-admin)"/>
    <text x="722.4" y="866" class="s">Registration / authorisation (not data)</text>
    <rect x="1087.8" y="852" width="34" height="18" rx="3" class="bound" style="stroke-width:4"/>
    <text x="1133.8" y="866" class="s">Trust or hardware boundary</text>
  </g>
</svg>
