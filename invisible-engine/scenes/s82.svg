    <text x="832" y="548" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">Review trusted devices</text><text x="832" y="578" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">every quarter; rotate keys</text><text x="832" y="608" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">and credentials when people</text><text x="832" y="638" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">or devices change.</text>
    <text x="832" y="712" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#475569">Who does it</text>
