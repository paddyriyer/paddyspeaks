    <text x="457" y="548" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">Security keys or multi-factor</text><text x="457" y="578" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">where available; limits on</text><text x="457" y="608" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">who may enrol a new</text><text x="457" y="638" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">device to the account.</text>
    <text x="457" y="712" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#475569">Who does it</text>
