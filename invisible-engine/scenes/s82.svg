  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 82</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Accounts first: company tags on company accounts</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Zero trust for a finder network starts with which account owns which tag.</text>
