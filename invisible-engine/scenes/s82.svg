<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 82: Accounts first: company tags on company accounts</title>
  <desc>Five frames. 1, two separate worlds: the company’s managed account holds company tags, managed phones and laptops; the person’s own account holds their own phone and their own tags; the two are never mixed. 2, minimum necessary sharing: a company tag is shared only with the people whose role needs it, and personal locations are never shared with the company. 3, strong sign-in: security keys or multi-factor authentication where available, and limits on who may enrol new devices. 4, trusted-device review and rotation: review the trusted devices regularly and rotate keys and credentials when people or devices change. 5, deprovisioning: when someone leaves, remove their shares, move company tags off any account they control, and revoke their devices; each step names who does it.</desc>
