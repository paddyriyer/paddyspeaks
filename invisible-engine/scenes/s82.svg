    <rect x="606" y="252" width="116" height="82" rx="8" fill="#1f2937"/><rect x="614" y="260" width="100" height="64" rx="4" fill="#e0f2fe"/><path d="M596,348 L606,334 L722,334 L732,348 Z" fill="#475569"/><text x="664" y="372" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#334155">laptop</text>
