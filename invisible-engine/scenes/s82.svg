    <text x="82" y="548" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">Share a company tag only</text><text x="82" y="578" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">with the roles that need it.</text><text x="82" y="608" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">Personal locations are never</text><text x="82" y="638" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">shared with the company.</text>
    <text x="82" y="712" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#475569">Who does it</text>
