    <text x="1207" y="548" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">Remove their shares; move</text><text x="1207" y="578" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">company tags off accounts</text><text x="1207" y="608" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">they control; revoke their</text><text x="1207" y="638" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">devices.</text>
    <text x="1207" y="712" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#475569">Who does it</text>
