<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 77: Crypto agility: a lifecycle, not a switch</title>
  <desc>Five frames. A seven-step cycle: 1 and 2, inventory what cryptography runs where, by version, then prioritise by data shelf life and exposure; 3 and 4, engage vendors for roadmaps and firmware paths, and measure sizes, speed, battery and interoperability in a lab; 5 and 6, stage the rollout (hybrid first, small groups first) and keep the ability to roll back and retire old keys; 7, verify continuously and re-inventory as standards move, which returns to step 1. Last frame: why some devices cannot simply “switch on” new cryptography — no firmware update path, fixed silicon, and a coin-cell battery; their path is replacement at end of life.</desc>
  <style>
