    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 77</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Crypto agility: a lifecycle, not a switch</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">You cannot “switch on quantum encryption” for every tag. You plan, measure and replace.</text>
  <g data-f="1">
    <rect x="70" y="165" width="330" height="125" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="94" cy="191" r="16" fill="#334155"/><text x="94" y="197" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#ffffff">1</text><text x="118" y="197" text-anchor="start" style="font-size:16.5px;font-weight:800;fill:#14213d">Inventory</text><text x="84" y="225" text-anchor="start" style="font-size:14px;font-weight:400;fill:#334155">what runs where,</text><text x="84" y="245" text-anchor="start" style="font-size:14px;font-weight:400;fill:#334155">by version (Scene 73)</text>
    <path d="M404,227 L418,227" stroke="#334155" stroke-width="3"/><path d="M418,219 L426,227 L418,235 Z" fill="#334155"/>
    <rect x="430" y="165" width="330" height="125" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="454" cy="191" r="16" fill="#2563eb"/><text x="454" y="197" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#ffffff">2</text><text x="478" y="197" text-anchor="start" style="font-size:16.5px;font-weight:800;fill:#14213d">Prioritise</text><text x="444" y="225" text-anchor="start" style="font-size:14px;font-weight:400;fill:#334155">by data shelf life</text><text x="444" y="245" text-anchor="start" style="font-size:14px;font-weight:400;fill:#334155">and exposure (Scene 78)</text>
    <path d="M764,227 L778,227" stroke="#334155" stroke-width="3"/><path d="M778,219 L786,227 L778,235 Z" fill="#334155"/>
  </g>
  <g data-f="2">
    <rect x="790" y="165" width="330" height="125" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="814" cy="191" r="16" fill="#7c3aed"/><text x="814" y="197" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#ffffff">3</text><text x="838" y="197" text-anchor="start" style="font-size:16.5px;font-weight:800;fill:#14213d">Engage vendors</text><text x="804" y="225" text-anchor="start" style="font-size:14px;font-weight:400;fill:#334155">roadmaps, firmware</text><text x="804" y="245" text-anchor="start" style="font-size:14px;font-weight:400;fill:#334155">paths, test builds</text>
    <path d="M1124,227 L1138,227" stroke="#334155" stroke-width="3"/><path d="M1138,219 L1146,227 L1138,235 Z" fill="#334155"/>
    <rect x="1150" y="165" width="330" height="125" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="1174" cy="191" r="16" fill="#0d9488"/><text x="1174" y="197" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#ffffff">4</text><text x="1198" y="197" text-anchor="start" style="font-size:16.5px;font-weight:800;fill:#14213d">Measure in a lab</text><text x="1164" y="225" text-anchor="start" style="font-size:14px;font-weight:400;fill:#334155">sizes, speed, battery,</text><text x="1164" y="245" text-anchor="start" style="font-size:14px;font-weight:400;fill:#334155">interoperability</text>
    <path d="M1315,294 L1315,343" stroke="#334155" stroke-width="3"/><path d="M1307,343 L1315,351 L1323,343 Z" fill="#334155"/>
  </g>
  <g data-f="3">
    <rect x="1150" y="355" width="330" height="125" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="1174" cy="381" r="16" fill="#16a34a"/><text x="1174" y="387" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#ffffff">5</text><text x="1198" y="387" text-anchor="start" style="font-size:16.5px;font-weight:800;fill:#14213d">Stage the rollout</text><text x="1164" y="415" text-anchor="start" style="font-size:14px;font-weight:400;fill:#334155">hybrid first;</text><text x="1164" y="435" text-anchor="start" style="font-size:14px;font-weight:400;fill:#334155">small groups first</text>
    <path d="M1146,417 L1132,417" stroke="#334155" stroke-width="3"/><path d="M1132,409 L1124,417 L1132,425 Z" fill="#334155"/>
    <rect x="790" y="355" width="330" height="125" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="814" cy="381" r="16" fill="#ea580c"/><text x="814" y="387" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#ffffff">6</text><text x="838" y="387" text-anchor="start" style="font-size:16.5px;font-weight:800;fill:#14213d">Recover and revoke</text><text x="804" y="415" text-anchor="start" style="font-size:14px;font-weight:400;fill:#334155">roll back safely;</text><text x="804" y="435" text-anchor="start" style="font-size:14px;font-weight:400;fill:#334155">retire old keys</text>
    <path d="M786,417 L772,417" stroke="#334155" stroke-width="3"/><path d="M772,409 L764,417 L772,425 Z" fill="#334155"/>
  </g>
  <g data-f="4">
    <rect x="430" y="355" width="330" height="125" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="454" cy="381" r="16" fill="#b45309"/><text x="454" y="387" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#ffffff">7</text><text x="478" y="387" text-anchor="start" style="font-size:16.5px;font-weight:800;fill:#14213d">Verify, again</text><text x="444" y="415" text-anchor="start" style="font-size:14px;font-weight:400;fill:#334155">monitor; re-inventory</text><text x="444" y="435" text-anchor="start" style="font-size:14px;font-weight:400;fill:#334155">as standards move</text>
    <path d="M430,417 L245,417 L245,302" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 6"/><path d="M237,310 L245,298 L253,310 Z" fill="#334155"/>
    <text x="80" y="455" text-anchor="start" style="font-size:15px;font-weight:600;fill:#475569">back to step 1</text>
  </g>
  <g data-f="5">
    <rect x="70" y="520" width="1470" height="285" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <circle cx="100" cy="556" r="18" fill="#dc2626"/><text x="100" y="562" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">!</text><text x="130" y="564" text-anchor="start" style="font-size:20px;font-weight:800;fill:#b91c1c">Why some devices cannot simply “switch on” new cryptography</text>
    <circle cx="173" cy="685" r="56" fill="#0f172a" opacity="0.13"/><circle cx="170" cy="680" r="56" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="170" cy="680" r="35" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="300" y="630" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d">No update path</text><text x="300" y="662" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">some devices never receive</text><text x="300" y="688" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">new firmware</text>
    <text x="710" y="630" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d">Fixed silicon</text><text x="710" y="662" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">boot ROM and crypto engine</text><text x="710" y="688" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">are set at the factory</text>
    <text x="1120" y="630" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d">A coin cell</text><text x="1120" y="662" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">bigger messages cost</text><text x="1120" y="688" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">battery life</text>
    <text x="300" y="760" text-anchor="start" style="font-size:17px;font-weight:700;fill:#166534">For these, the path is replacement at end of life, planned now.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Process view. Steps run in parallel across product lines in practice.</text>
  </g>
</svg>
