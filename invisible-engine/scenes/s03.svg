<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 03: A changing current makes a changing magnetic field</title>
  <desc>Four frames. An alternating current source drives a coil; an illustrative magnetic field around the coil grows, shrinks and reverses with the current; the near field, within about one wavelength over two pi, where coupling dominates and falls very steeply, contrasted with the far field, where a wave travels on; and the sizes: at 13.56 MHz that boundary is about 3.5 metres, at 2.4 GHz about 2 centimetres.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 03</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">A changing current makes a changing magnetic field</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Near field: energy shared with nearby coils. Far field: a wave that travels on.</text>
  <g data-f="1">
    <rect x="60" y="160" width="700" height="400" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="102" cy="204" r="26" fill="#ea580c"/><text x="102" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="142" y="214" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Coil driven by AC</text>
    <circle cx="160" cy="370" r="38" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><path d="M138,370 C148,345 160,345 165,370 C170,395 182,395 190,370" fill="none" stroke="#c2410c" stroke-width="3"/><path d="M198,370 L300,370" class="wire"/>
    <text x="160" y="440" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#9a3412">AC source</text>
    <rect x="310.0" y="280.0" width="300" height="180" rx="18" class="coil"/>
    <rect x="321.0" y="291.0" width="278" height="158" rx="15" class="coil"/>
    <rect x="332.0" y="302.0" width="256" height="136" rx="12" class="coil"/>
    <rect x="343.0" y="313.0" width="234" height="114" rx="9" class="coil"/>
    <text x="110" y="520" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Current reverses 13.56 million times a second (NFC).</text>
  </g>
  <g data-f="2">
    <ellipse cx="460" cy="370" rx="180" ry="99" class="field"/>
    <ellipse cx="460" cy="370" rx="210" ry="116" class="field"/>
    <text x="300" y="548" text-anchor="start" style="font-style:italic;font-size:15px;font-weight:400;fill:#475569">Illustrative field visualisation — not literal visible waves.</text>
  </g>
  <g data-f="3">
    <rect x="800" y="160" width="740" height="190" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="842" cy="204" r="26" fill="#2563eb"/><text x="842" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="882" y="214" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Near field (inside ≈ λ/2π)</text>
    <rect x="836" y="252" width="57" height="92" rx="7" fill="#0f172a" opacity="0.15"/><rect x="830" y="244" width="57" height="92" rx="7" fill="#1f2937"/><rect x="831" y="245" width="55" height="90" rx="6" fill="#374151"/><rect x="835" y="250" width="47" height="33" rx="3" fill="#e0f2fe" stroke="#0f172a" stroke-width="0.7"/><path d="M855.5,259.6 q1.8,2.0 0,4.0" fill="none" stroke="#0c4a6e" stroke-width="0.7040000000000001" stroke-linecap="round"/><path d="M857.8,257.8 q3.0,3.8 0,7.6" fill="none" stroke="#0c4a6e" stroke-width="0.7040000000000001" stroke-linecap="round"/><path d="M860.1,256.0 q4.3,5.6 0,11.1" fill="none" stroke="#0c4a6e" stroke-width="0.7040000000000001" stroke-linecap="round"/><text x="858.6" y="277.0" text-anchor="middle" style="font-size:4.84px;font-weight:800;fill:#0c4a6e">Tap to pay</text><rect x="839" y="289" width="11" height="7" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="0.3"/><rect x="853" y="289" width="11" height="7" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="0.3"/><rect x="867" y="289" width="11" height="7" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="0.3"/><rect x="839" y="299" width="11" height="7" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="0.3"/><rect x="853" y="299" width="11" height="7" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="0.3"/><rect x="867" y="299" width="11" height="7" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="0.3"/><rect x="839" y="309" width="11" height="7" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="0.3"/><rect x="853" y="309" width="11" height="7" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="0.3"/><rect x="867" y="309" width="11" height="7" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="0.3"/><rect x="839" y="319" width="11" height="7" rx="2" fill="#ef4444" stroke="#111827" stroke-width="0.3"/><rect x="853" y="319" width="11" height="7" rx="2" fill="#facc15" stroke="#111827" stroke-width="0.3"/><rect x="867" y="319" width="11" height="7" rx="2" fill="#22c55e" stroke="#111827" stroke-width="0.3"/>
    <rect x="919" y="274" width="90" height="57" rx="4" fill="#0f172a" opacity="0.12"/><rect x="915" y="268" width="90" height="57" rx="4" fill="#1e3a8a"/><path d="M915,303 Q960,294 1005,308 L1005,320 Q1005,325 1000,325 L920,325 Q915,325 915,320 Z" fill="#1d4ed8" opacity="0.55"/><path d="M987.0,285.6 q2.4,2.8 0,5.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M990.1,283.2 q4.2,5.2 0,10.4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M993.2,280.8 q5.9,7.6 0,15.2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><rect x="924.0" y="286.711" width="13.5" height="13.608" rx="2" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M930.75,286.711 L930.75,300.319 M924.0,291.247 L929.13,291.247 M932.37,291.247 L937.5,291.247 M924.0,295.783 L929.13,295.783 M932.37,295.783 L937.5,295.783" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="929.13" y="289.70476" width="3.2399999999999998" height="7.620480000000001" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/>
    <text x="1040" y="262" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Energy is mostly stored and exchanged with</text>
    <text x="1040" y="288" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">nearby coils, and falls very steeply with</text>
    <text x="1040" y="314" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">distance. A card on a terminal lives here.</text>
    <rect x="800" y="370" width="740" height="190" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="842" cy="414" r="26" fill="#16a34a"/><text x="842" y="423" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="882" y="424" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Far field (many λ away)</text>
    <circle cx="863" cy="485" r="26" fill="#0f172a" opacity="0.13"/><circle cx="860" cy="480" r="26" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="860" cy="480" r="16" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M893,467 q9,13 0,25" fill="none" stroke="#16a34a" stroke-width="3.6" stroke-linecap="round" opacity="1.00"/><path d="M905,457 q14,23 0,47" fill="none" stroke="#16a34a" stroke-width="3.6" stroke-linecap="round" opacity="0.80"/><path d="M918,446 q20,34 0,68" fill="none" stroke="#16a34a" stroke-width="3.6" stroke-linecap="round" opacity="0.60"/>
    <rect x="970" y="437" width="48" height="96" rx="8" fill="#0f172a" opacity="0.14"/><rect x="965" y="430" width="48" height="96" rx="8" fill="#111827"/><rect x="968" y="433" width="42" height="90" rx="6" fill="#ecfdf5"/><rect x="982" y="435" width="13" height="3" rx="2" fill="#111827"/>
    <text x="1040" y="472" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">A wave detaches and travels on, weakening</text>
    <text x="1040" y="498" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">more gently. Bluetooth, Wi-Fi and satellite</text>
    <text x="1040" y="524" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">receivers use this radiation.</text>
  </g>
  <g data-f="4">
    <rect x="60" y="590" width="1480" height="220" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="102" cy="634" r="26" fill="#334155"/><text x="102" y="643" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text><text x="142" y="644" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Same rule, very different sizes</text>
    <text x="110" y="690" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;font-weight:600;fill:#14213d">13.56 MHz (NFC):   λ = c / f ≈ 22.1 m   →   λ/2π ≈ 3.5 m.   A card 2–4 cm away is deep in the near field.</text>
    <text x="110" y="724" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;font-weight:600;fill:#14213d">2.4 GHz (Bluetooth LE):   λ ≈ 12.5 cm   →   λ/2π ≈ 2 cm.   A phone 10 m away is in the far field.</text>
    <text x="110" y="770" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Range depends on power, antennas, coupling, noise and the receiver — not on frequency alone.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
  </g>
</svg>
