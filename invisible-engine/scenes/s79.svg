  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 79</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Where the company’s authority stops</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Most of a company’s leverage is over its own assets, accounts and processes — not over the networks.</text>
