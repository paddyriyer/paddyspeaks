<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 73: Inventory first: which cryptography does each part use?</title>
  <desc>Four frames. A table of eight places cryptography works across cards, trackers and accounts, each with its job, the algorithm as publicly documented, and an evidence status. 1, the payment card chip: transaction cryptograms use symmetric keys (TDES or AES, chosen by the issuer), verified from the EMV specifications; offline card authentication uses RSA certificates and EMV also specifies elliptic curves, unverified for any given card. 2, an access badge (AES-128 on current secure credentials, unverified for a particular fleet), Bluetooth LE Secure Connections pairing (ECDH on P-256, verified from the Core Specification) and tracker firmware signing (not published: unknown). 3, Find My location reports (ECDH on P-224 then AES-GCM, verified from Apple’s documentation), the cloud connection (TLS 1.3 with elliptic-curve key exchange, hybrid with ML-KEM rolling out, unverified per service) and sharing and backups (unverified). 4, the rows that rely on public-key cryptography are marked: those are the ones Shor’s algorithm would affect at scale.</desc>
