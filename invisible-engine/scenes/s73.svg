  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 73</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Inventory first: which cryptography does each part use?</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">You cannot plan a migration for algorithms you have not listed — or cannot see.</text>
