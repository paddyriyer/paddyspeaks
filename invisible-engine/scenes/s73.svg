    <text x="75" y="760" text-anchor="start" style="font-size:15px;font-weight:500;fill:#334155">VERIFIED = in the vendor’s or standard’s own documentation.  UNVERIFIED = documented for some products or versions,</text>
    <text x="75" y="784" text-anchor="start" style="font-size:15px;font-weight:500;fill:#334155">not confirmed for yours.  UNKNOWN = not published.  “Shor-exposed” means: only on a large fault-tolerant quantum</text>
    <text x="75" y="808" text-anchor="start" style="font-size:15px;font-weight:500;fill:#334155">computer, which is not publicly known to exist.</text>
