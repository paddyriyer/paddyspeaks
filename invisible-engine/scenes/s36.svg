<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 36: The sighting is sealed before it leaves the finder’s phone</title>
  <desc>Five frames. The tag advertises its current rotating public key; the finder phone encrypts its own location and the time to that public key, producing a report it cannot itself read back; the report travels over the internet to Apple’s Find My relay; the relay stores it under a lookup value, a SHA-256 hash of the public key; and a panel of what remains visible: Apple says it cannot read the location and does not know the finder, but the lookup hash, the encrypted report, the upload time and network connection data still exist.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 36</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The sighting is sealed before it leaves the finder’s phone</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Encrypted to the tag’s public key, filed under a hash. Content hidden — not every trace.</text>
  <g data-f="1">
    <circle cx="133" cy="365" r="40" fill="#0f172a" opacity="0.13"/><circle cx="130" cy="360" r="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="130" cy="360" r="25" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="130" y="430" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">item tracker</text>
    <path d="M180,360 L360,360" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="198" y="308" width="145" height="26" rx="6" class="lab"/>
    <text x="270" y="326" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#1d4ed8"><tspan x="270" dy="0">public key Pᵢ</tspan></text>
    <rect x="375" y="227" width="150" height="300" rx="26" fill="#0f172a" opacity="0.14"/><rect x="370" y="220" width="150" height="300" rx="26" fill="#111827"/><rect x="379" y="229" width="132" height="282" rx="20" fill="#f8fafc"/><rect x="424" y="235" width="42" height="11" rx="5" fill="#111827"/>
    <rect x="60" y="560" width="440" height="110" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="86" cy="590" r="18" fill="#2563eb"/><text x="86" y="596" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="114" y="596" text-anchor="start" style="font-size:19px;font-weight:800;fill:#2563eb">Current public key</text><text x="76" y="625" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="76" dy="0">The tag advertises Pᵢ, which changes</tspan><tspan x="76" dy="21">over time (Scene 28).</tspan></text>
  </g>
  <g data-f="2">
    <rect x="390" y="300" width="110" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="445" y="336" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#166534">place+time</text>
    <path d="M445,360 L445,400" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="405" y="405" width="80" height="53" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><path d="M405,411 L445,434 L485,411" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <path d="M464,444 L464,439 a6,6 0 0 1 13,0 L477,444" fill="none" stroke="#7c3aed" stroke-width="2.2"/><rect x="460" y="443" width="22" height="17" rx="3" fill="#7c3aed"/><circle cx="471" cy="450" r="2" fill="#ffffff"/><rect x="470" y="451" width="2" height="4" fill="#ffffff"/>
    <rect x="540" y="560" width="440" height="130" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="566" cy="590" r="18" fill="#7c3aed"/><text x="566" y="596" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="594" y="596" text-anchor="start" style="font-size:19px;font-weight:800;fill:#7c3aed">Encrypt to Pᵢ</text><text x="556" y="625" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="556" dy="0">The finder seals its own location and</tspan><tspan x="556" dy="21">the time with the tag’s public key.</tspan><tspan x="556" dy="21">Only the matching private key opens it.</tspan></text>
  </g>
  <g data-f="3">
    <path d="M664,340 a40,40 0 0 1 4,-68 a52,52 0 0 1 100,-13 a36,36 0 0 1 8,81 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/><text x="720.0" y="315.8" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#14213d">internet</text>
    <path d="M530,370 L640,370" class="a-crypto" marker-end="url(#m-crypto)"/>
    <path d="M820,330 L975,330" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="811" y="278" width="174" height="26" rx="6" class="lab"/>
    <text x="898" y="296" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#7e22ce"><tspan x="898" dy="0">encrypted report</tspan></text>
  </g>
  <g data-f="4">
    <rect x="990" y="170" width="550" height="370" rx="18" class="bound"/>
    <text x="1012" y="206" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">Find My relay (Apple)</text>
    <rect x="1020" y="240" width="108" height="38" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="1036" cy="259" r="4" fill="#22c55e"/><rect x="1056" y="254" width="58" height="9" rx="3" fill="#94a3b8"/><rect x="1020" y="285" width="108" height="38" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="1036" cy="304" r="4" fill="#22c55e"/><rect x="1056" y="299" width="58" height="9" rx="3" fill="#94a3b8"/><rect x="1020" y="330" width="108" height="38" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="1036" cy="349" r="4" fill="#22c55e"/><rect x="1056" y="344" width="58" height="9" rx="3" fill="#94a3b8"/>
    <rect x="1160" y="240" width="360" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1176" y="270" text-anchor="start" style="font-size:15px;font-weight:800;fill:#334155">lookup value</text><text x="1356" y="270" text-anchor="start" style="font-size:15px;font-weight:800;fill:#334155">stored report</text>
    <text x="1176" y="302" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:14.5px;font-weight:400;fill:#334155">SHA-256(P₁₇)</text>
    <rect x="1356" y="286" width="140" height="22" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="1426" y="302" text-anchor="middle" style="font-size:13px;font-weight:600;fill:#6d28d9">▒▒ ciphertext</text>
    <text x="1176" y="336" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:14.5px;font-weight:400;fill:#334155">SHA-256(P₁₈)</text>
    <rect x="1356" y="320" width="140" height="22" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="1426" y="336" text-anchor="middle" style="font-size:13px;font-weight:600;fill:#6d28d9">▒▒ ciphertext</text>
    <text x="1176" y="370" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:14.5px;font-weight:400;fill:#334155">SHA-256(P₂₁)</text>
    <rect x="1356" y="354" width="140" height="22" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="1426" y="370" text-anchor="middle" style="font-size:13px;font-weight:600;fill:#6d28d9">▒▒ ciphertext</text>
    <rect x="1020" y="430" width="500" height="96" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="1046" cy="460" r="18" fill="#7c3aed"/><text x="1046" y="466" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="1074" y="466" text-anchor="start" style="font-size:19px;font-weight:800;fill:#7c3aed">Filed under a hash</text><text x="1036" y="495" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">Stored by SHA-256 of the public key.</text>
  </g>
  <g data-f="5">
    <rect x="540" y="700" width="1000" height="120" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="582" cy="744" r="26" fill="#334155"/><text x="582" y="753" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text><text x="622" y="754" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d">Hidden content is not zero metadata</text>
    <text x="620" y="776" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">Apple says it cannot read the location and does not know the finder. Still present: the lookup</text>
    <text x="620" y="800" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">hash, the encrypted report, the upload time and ordinary network connection data.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="106" y="866" class="s">Radio signal or wave</text>
    <path d="M308.0,861 L342.0,861" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="354.0" y="866" class="s">Plaintext / local information</text>
    <path d="M633.4,861 L667.4,861" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="679.4" y="866" class="s">Encrypted / cryptographic</text>
    <rect x="924.4" y="852" width="34" height="18" rx="3" class="bound" style="stroke-width:4"/>
    <text x="970.4" y="866" class="s">Trust or hardware boundary</text>
  </g>
</svg>
