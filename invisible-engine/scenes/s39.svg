<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 39: Finding it nearby is a different mechanism</title>
  <desc>Five frames. Left, Find My’s map shows a last-seen point built from sightings, a global location. Right, in the same room, the owner’s iPhone asks the tag to play a sound over Bluetooth; a compatible iPhone with ultra-wideband exchanges ranging messages with the tag and measures distance from the time of flight; the phone combines that with its camera, ARKit and motion sensors to point an arrow; and a note that the Bluetooth advertisement itself carries no direction, and Precision Finding needs an iPhone with ultra-wideband: iPhone 11 or later, not iPhone SE.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 39</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Finding it nearby is a different mechanism</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">The map says roughly where. Up close, sound and ultra-wideband say which way and how far.</text>
  <g data-f="1">
    <rect x="60" y="160" width="440" height="520" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="102" cy="204" r="26" fill="#334155"/><text x="102" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="142" y="214" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Far away: the map</text>
    <rect x="175" y="247" width="200" height="400" rx="34" fill="#0f172a" opacity="0.14"/><rect x="170" y="240" width="200" height="400" rx="34" fill="#111827"/><rect x="182" y="252" width="176" height="376" rx="27" fill="#f8fafc"/><rect x="242" y="260" width="56" height="14" rx="7" fill="#111827"/>
    <rect x="186" y="290" width="168" height="250" rx="10" fill="#ecfdf5" stroke="#94a3b8" stroke-width="2"/><path d="M186,378 L354,428 M236,290 L262,540 M304,290 L290,540" stroke="#ffffff" stroke-width="9"/><path d="M186,378 L354,428 M236,290 L262,540 M304,290 L290,540" stroke="#cbd5e1" stroke-width="1.5"/><rect x="194" y="445" width="30" height="62" rx="4" fill="#bbf7d0"/>
    <path d="M270,430 C250,400 250,376 270,374 C290,376 290,400 270,430 Z" fill="#2563eb"/><circle cx="270" cy="392" r="7" fill="#ffffff"/>
    <text x="270" y="580" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#14213d">last seen, 2 km</text>
    <text x="280" y="665" text-anchor="middle" style="font-size:15.5px;font-weight:600;fill:#475569">global location, from sightings</text>
    <path d="M520,170 L520,810" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="720" cy="390" r="30" fill="#475569"/><path d="M678,535 L678,460 Q678,430 708,430 L732,430 Q762,430 762,460 L762,535 Z" fill="#475569"/><rect x="688" y="525" width="25" height="110" rx="10" fill="#475569"/><rect x="728" y="525" width="25" height="110" rx="10" fill="#475569"/><rect x="762" y="475" width="22" height="40" rx="5" fill="#111827" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="1240" y="560" width="250" height="90" rx="20" fill="#cbd5e1"/><rect x="1220" y="520" width="290" height="60" rx="20" fill="#94a3b8"/>
    <circle cx="1363" cy="510" r="28" fill="#0f172a" opacity="0.13"/><circle cx="1360" cy="505" r="28" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="1360" cy="505" r="17" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1360" y="680" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#475569">same room</text>
  </g>
  <g data-f="2">
    <path d="M800,440 L1328,488" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="949" y="412" width="222" height="26" rx="6" class="lab"/>
    <text x="1060" y="430" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#1d4ed8"><tspan x="1060" dy="0">Bluetooth: play sound</tspan></text>
    <path d="M1400,432 L1410,432 L1422,421 L1422,459 L1410,448 L1400,448 Z" fill="#334155"/><path d="M1430,432 q6,8 0,16" fill="none" stroke="#334155" stroke-width="2.8" stroke-linecap="round"/><path d="M1438,426 q10,14 0,27" fill="none" stroke="#334155" stroke-width="2.8" stroke-linecap="round"/><path d="M1446,421 q13,19 0,38" fill="none" stroke="#334155" stroke-width="2.8" stroke-linecap="round"/>
    <rect x="560" y="160" width="430" height="110" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="586" cy="190" r="18" fill="#2563eb"/><text x="586" y="196" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="614" y="196" text-anchor="start" style="font-size:19px;font-weight:800;fill:#2563eb">Play Sound (Bluetooth)</text><text x="576" y="225" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="576" dy="0">In Bluetooth range, the owner asks</tspan><tspan x="576" dy="21">the tag to beep.</tspan></text>
  </g>
  <g data-f="3">
    <path d="M805,580 L1334,528" class="a-signal" marker-end="url(#m-signal)" marker-start="url(#ms-signal)"/>
    <rect x="954" y="598" width="212" height="26" rx="6" class="lab"/>
    <text x="1060" y="616" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#1d4ed8"><tspan x="1060" dy="0">UWB ranging exchange</tspan></text>
    <rect x="1010" y="160" width="530" height="130" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="1036" cy="190" r="18" fill="#2563eb"/><text x="1036" y="196" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="1064" y="196" text-anchor="start" style="font-size:19px;font-weight:800;fill:#2563eb">Distance from time of flight</text><text x="1026" y="225" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1026" dy="0">Ultra-wideband messages go back and forth;</tspan><tspan x="1026" dy="21">the round-trip time gives the distance.</tspan><tspan x="1026" dy="21">A ranging exchange, not a location broadcast.</tspan></text>
  </g>
  <g data-f="4">
    <rect x="560" y="690" width="460" height="120" rx="16" fill="#111827"/>
    <path d="M612,752 L662,752 L662,730 L704,762 L662,794 L662,772 L612,772 Z" fill="#22c55e" transform="rotate(-25 658 762)"/>
    <text x="760" y="752" text-anchor="start" style="font-size:32px;font-weight:800;fill:#ffffff">8 m</text><text x="760" y="786" text-anchor="start" style="font-size:17px;font-weight:600;fill:#e5e7eb">to the right</text>
    <text x="1000" y="790" text-anchor="end" style="font-style:italic;font-size:13.5px;font-weight:400;fill:#9ca3af">illustrative</text>
    <rect x="1060" y="690" width="480" height="120" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="1086" cy="720" r="18" fill="#0d9488"/><text x="1086" y="726" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="1114" y="726" text-anchor="start" style="font-size:19px;font-weight:800;fill:#0d9488">Direction needs the phone’s sensors</text><text x="1076" y="755" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1076" dy="0">UWB with camera, ARKit, accelerometer</tspan><tspan x="1076" dy="21">and gyroscope. Illustrative readout.</tspan></text>
  </g>
  <g data-f="5">
    <rect x="60" y="690" width="440" height="120" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="86" cy="720" r="18" fill="#b45309"/><text x="86" y="726" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="114" y="726" text-anchor="start" style="font-size:19px;font-weight:800;fill:#b45309">No direction in the whisper</text><text x="76" y="755" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="76" dy="0">The BLE advert carries no bearing. Needs</tspan><tspan x="76" dy="21">iPhone 11 or later, not iPhone SE.</tspan></text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="106" y="866" class="s">Radio signal or wave</text>
  </g>
</svg>
