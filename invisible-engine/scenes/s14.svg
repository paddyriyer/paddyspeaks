<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 14: Layers of agreement: from radio to payment</title>
  <desc>Five frames. A sequence between a terminal and a card, grouped by standards layer: ISO/IEC 14443-2 radio; 14443-3 activation and anticollision; 14443-4 transport; the EMV application exchange; and a note that the exact sequence depends on card type and payment-network kernel.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 14</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Layers of agreement: from radio to payment</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Each layer trusts the one beneath it. Illustrative, not a packet trace.</text>
  <g>
    <rect x="911" y="158" width="94" height="151" rx="11" fill="#0f172a" opacity="0.15"/><rect x="905" y="150" width="94" height="151" rx="11" fill="#1f2937"/><rect x="907" y="152" width="89" height="147" rx="9" fill="#374151"/><rect x="914" y="159" width="76" height="54" rx="4" fill="#e0f2fe" stroke="#0f172a" stroke-width="1.1"/><path d="M946.8,175.5 q2.9,3.3 0,6.6" fill="none" stroke="#0c4a6e" stroke-width="1.152" stroke-linecap="round"/><path d="M950.5,172.6 q5.0,6.2 0,12.4" fill="none" stroke="#0c4a6e" stroke-width="1.152" stroke-linecap="round"/><path d="M954.2,169.7 q7.0,9.1 0,18.2" fill="none" stroke="#0c4a6e" stroke-width="1.152" stroke-linecap="round"/><text x="951.8" y="204.0" text-anchor="middle" style="font-size:7.92px;font-weight:800;fill:#0c4a6e">Tap to pay</text><rect x="919" y="224" width="19" height="12" rx="3" fill="#9ca3af" stroke="#111827" stroke-width="0.5"/><rect x="942" y="224" width="19" height="12" rx="3" fill="#9ca3af" stroke="#111827" stroke-width="0.5"/><rect x="965" y="224" width="19" height="12" rx="3" fill="#9ca3af" stroke="#111827" stroke-width="0.5"/><rect x="919" y="240" width="19" height="12" rx="3" fill="#9ca3af" stroke="#111827" stroke-width="0.5"/><rect x="942" y="240" width="19" height="12" rx="3" fill="#9ca3af" stroke="#111827" stroke-width="0.5"/><rect x="965" y="240" width="19" height="12" rx="3" fill="#9ca3af" stroke="#111827" stroke-width="0.5"/><rect x="919" y="257" width="19" height="12" rx="3" fill="#9ca3af" stroke="#111827" stroke-width="0.5"/><rect x="942" y="257" width="19" height="12" rx="3" fill="#9ca3af" stroke="#111827" stroke-width="0.5"/><rect x="965" y="257" width="19" height="12" rx="3" fill="#9ca3af" stroke="#111827" stroke-width="0.5"/><rect x="919" y="273" width="19" height="12" rx="3" fill="#ef4444" stroke="#111827" stroke-width="0.5"/><rect x="942" y="273" width="19" height="12" rx="3" fill="#facc15" stroke="#111827" stroke-width="0.5"/><rect x="965" y="273" width="19" height="12" rx="3" fill="#22c55e" stroke="#111827" stroke-width="0.5"/>
    <rect x="1344" y="176" width="150" height="94" rx="8" fill="#0f172a" opacity="0.12"/><rect x="1340" y="170" width="150" height="94" rx="8" fill="#1e3a8a"/><path d="M1340,229 Q1415,213 1490,236 L1490,257 Q1490,264 1482,264 L1348,264 Q1340,264 1340,257 Z" fill="#1d4ed8" opacity="0.55"/><path d="M1460.0,199.4 q4.0,4.6 0,9.2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M1465.2,195.4 q6.9,8.7 0,17.3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M1470.4,191.3 q9.8,12.7 0,25.4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><rect x="1355.0" y="201.185" width="22.5" height="22.68" rx="4" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M1366.25,201.185 L1366.25,223.865 M1355.0,208.745 L1363.55,208.745 M1368.95,208.745 L1377.5,208.745 M1355.0,216.305 L1363.55,216.305 M1368.95,216.305 L1377.5,216.305" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="1363.55" y="206.1746" width="5.3999999999999995" height="12.700800000000001" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/><text x="1481.0" y="188.9" text-anchor="end" style="font-size:10.500000000000002px;font-weight:800;fill:#e0e7ff">BANK</text><text x="1355.0" y="249.38" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:9.75px;font-weight:600;fill:#ffffff">•••• 1234</text>
    <line x1="952" y1="310" x2="952" y2="800" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 6"/><line x1="1415" y1="270" x2="1415" y2="800" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 6"/>
  </g>
  <g data-f="1">
    <path d="M958,352 L1409,352" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="1183" y="344" class="s" text-anchor="middle">field on (13.56 MHz)</text>
    <rect x="60" y="316" width="800" height="76" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="102" cy="360" r="26" fill="#2563eb"/><text x="102" y="369" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="142" y="370" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">14443-2 · Radio</text>
    <text x="560" y="366" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">field on, power, modulation</text>
  </g>
  <g data-f="2">
    <path d="M958,436 L1409,436" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="1183" y="428" class="s" text-anchor="middle">REQA / WUPA</text>
    <path d="M1409,466 L958,466" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="1183" y="458" class="s" text-anchor="middle">ATQA</text>
    <path d="M958,496 L1409,496" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="1183" y="488" class="s" text-anchor="middle">ANTICOLLISION / SELECT (UID)</text>
    <path d="M1409,526 L958,526" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="1183" y="518" class="s" text-anchor="middle">SAK</text>
    <rect x="60" y="400" width="800" height="142" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="102" cy="444" r="26" fill="#0d9488"/><text x="102" y="453" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="142" y="454" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">14443-3 · Activation</text>
    <text x="560" y="450" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">who is there? pick one card</text>
  </g>
  <g data-f="3">
    <path d="M958,586 L1409,586" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="1183" y="578" class="s" text-anchor="middle">RATS</text>
    <path d="M1409,616 L958,616" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="1183" y="608" class="s" text-anchor="middle">ATS</text>
    <rect x="60" y="550" width="800" height="82" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="102" cy="594" r="26" fill="#b45309"/><text x="102" y="603" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="142" y="604" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">14443-4 · Transport</text>
    <text x="560" y="600" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">reliable message blocks</text>
  </g>
  <g data-f="4">
    <path d="M958,676 L1409,676" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="1183" y="668" class="s" text-anchor="middle">SELECT PPSE → app list</text>
    <path d="M958,706 L1409,706" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="1183" y="698" class="s" text-anchor="middle">SELECT AID</text>
    <path d="M958,736 L1409,736" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="1183" y="728" class="s" text-anchor="middle">GET PROCESSING OPTIONS</text>
    <path d="M1409,766 L958,766" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="1183" y="758" class="s" text-anchor="middle">card data + cryptogram</text>
    <rect x="60" y="640" width="800" height="142" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="102" cy="684" r="26" fill="#7c3aed"/><text x="102" y="693" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text><text x="142" y="694" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">EMV application</text>
    <text x="560" y="690" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="560" dy="0">choose app; terminal data</tspan><tspan x="560" dy="21">incl. amount and UN</tspan></text>
  </g>
  <g data-f="5">
    <rect x="60" y="160" width="800" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="86" cy="190" r="18" fill="#334155"/><text x="86" y="196" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="114" y="196" text-anchor="start" style="font-size:20px;font-weight:800;fill:#334155">Illustrative, not a packet trace</text><text x="76" y="226" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="76" dy="0">Type B cards use different activation commands. The EMV</tspan><tspan x="76" dy="21">steps — and where the cryptogram appears — depend on the</tspan><tspan x="76" dy="21">payment network’s contactless kernel.</tspan></text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="106" y="866" class="s">Energy / power</text>
    <path d="M256.4,861 L290.4,861" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="302.4" y="866" class="s">Radio signal or wave</text>
    <path d="M504.4,861 L538.4,861" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="550.4" y="866" class="s">Plaintext / local information</text>
    <path d="M829.8,861 L863.8,861" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="875.8" y="866" class="s">Encrypted / cryptographic</text>
    <text x="1540" y="866" class="note" text-anchor="end">UN = unpredictable number from the terminal.</text>
  </g>
</svg>
