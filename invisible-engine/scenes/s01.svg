<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 01: From a switch to a transistor</title>
  <desc>Four frames. A flashlight circuit with the switch open: no current, the bulb is dark, we call it 0. The switch closed: current carries energy, the bulb lights, we call it 1. A transistor cutaway with the gate below its threshold voltage: no channel, off. The gate above threshold: a conducting channel forms between source and drain, on. The 0 and 1 are agreed readings of voltage ranges.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 01</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">From a switch to a transistor</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">A 0 or a 1 is an agreed reading of a physical voltage.</text>
  <g data-f="1">
    <rect x="60" y="160" width="720" height="330" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="102" cy="204" r="26" fill="#334155"/><text x="102" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="142" y="214" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Switch open</text>
    <rect x="172" y="278" width="25" height="14" rx="3" fill="#475569"/><rect x="150" y="290" width="70" height="130" rx="12" fill="#ffffff" stroke="#334155" stroke-width="4"/><rect x="158" y="321" width="54" height="91" rx="6" fill="#4ade80"/>
    <path d="M185,278 L185,250 L340,250" class="wire"/><path d="M420,250 L630,250 L630,300" class="wire"/><path d="M630,430 L630,470 L185,470 L185,420" class="wire"/><circle cx="340" cy="250" r="8" fill="#334155"/><circle cx="420" cy="250" r="8" fill="#334155"/>
    <path d="M340,250 L410,205" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <circle cx="630" cy="360" r="46" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><path d="M616,366 q7,-18 14,0 q7,18 14,0" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="610" y="402" width="40" height="26" rx="4" fill="#9ca3af" stroke="#334155" stroke-width="2"/>
    <text x="750" y="212" text-anchor="end" style="font-size:20px;font-weight:800;fill:#334155">No current → dark → 0</text>
  </g>
  <g data-f="2">
    <rect x="820" y="160" width="720" height="330" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="862" cy="204" r="26" fill="#b45309"/><text x="862" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="902" y="214" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Switch closed</text>
    <rect x="932" y="278" width="25" height="14" rx="3" fill="#475569"/><rect x="910" y="290" width="70" height="130" rx="12" fill="#ffffff" stroke="#334155" stroke-width="4"/><rect x="918" y="321" width="54" height="91" rx="6" fill="#4ade80"/>
    <path d="M945,278 L945,250 L1100,250" class="wire"/><path d="M1180,250 L1390,250 L1390,300" class="wire"/><path d="M1390,430 L1390,470 L945,470 L945,420" class="wire"/><circle cx="1100" cy="250" r="8" fill="#334155"/><circle cx="1180" cy="250" r="8" fill="#334155"/>
    <path d="M1100,250 L1180,250" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <path d="M1452,360 L1472,360" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M1434,404 L1448,418" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M1390,422 L1390,442" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M1346,404 L1332,418" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M1328,360 L1308,360" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M1346,316 L1332,302" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M1390,298 L1390,278" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M1434,316 L1448,302" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><circle cx="1390" cy="360" r="46" fill="#fde047" stroke="#334155" stroke-width="3"/><path d="M1376,366 q7,-18 14,0 q7,18 14,0" fill="none" stroke="#b45309" stroke-width="3"/><rect x="1370" y="402" width="40" height="26" rx="4" fill="#9ca3af" stroke="#334155" stroke-width="2"/>
    <path d="M960,236 L1080,236" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="1510" y="212" text-anchor="end" style="font-size:20px;font-weight:800;fill:#92400e">Current → light → 1</text>
  </g>
  <g data-f="3">
    <rect x="60" y="510" width="720" height="300" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="102" cy="554" r="26" fill="#334155"/><text x="102" y="563" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="142" y="564" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Transistor: gate below threshold</text>
    <rect x="130" y="640" width="580" height="140" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="150" y="640" width="140" height="56" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><rect x="550" y="640" width="140" height="56" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><rect x="310" y="624" width="220" height="14" fill="#fef9c3" stroke="#a16207" stroke-width="2"/><rect x="310" y="590" width="220" height="34" rx="4" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
    <text x="420" y="613" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#14213d">gate</text>
    <text x="220" y="724" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#1e3a8a">source</text>
    <text x="620" y="724" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#1e3a8a">drain</text>
    <text x="420" y="762" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#334155">no conducting channel → 0</text>
  </g>
  <g data-f="4">
    <rect x="820" y="510" width="720" height="300" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="862" cy="554" r="26" fill="#7c3aed"/><text x="862" y="563" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text><text x="902" y="564" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Transistor: gate above threshold</text>
    <rect x="890" y="640" width="580" height="140" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="910" y="640" width="140" height="56" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><rect x="1310" y="640" width="140" height="56" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><rect x="1070" y="624" width="220" height="14" fill="#fef9c3" stroke="#a16207" stroke-width="2"/><rect x="1070" y="590" width="220" height="34" rx="4" fill="#fcd34d" stroke="#334155" stroke-width="2"/>
    <text x="1180" y="613" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#14213d">gate (+V)</text>
    <text x="980" y="724" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#1e3a8a">source</text>
    <text x="1380" y="724" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#1e3a8a">drain</text>
    <rect x="1050" y="642" width="260" height="16" fill="#60a5fa"/>
    <circle cx="1065" cy="650" r="4" fill="#1e3a8a"/>
    <circle cx="1095" cy="650" r="4" fill="#1e3a8a"/>
    <circle cx="1125" cy="650" r="4" fill="#1e3a8a"/>
    <circle cx="1155" cy="650" r="4" fill="#1e3a8a"/>
    <circle cx="1185" cy="650" r="4" fill="#1e3a8a"/>
    <circle cx="1215" cy="650" r="4" fill="#1e3a8a"/>
    <circle cx="1245" cy="650" r="4" fill="#1e3a8a"/>
    <circle cx="1275" cy="650" r="4" fill="#1e3a8a"/>
    <circle cx="1305" cy="650" r="4" fill="#1e3a8a"/>
    <path d="M1060,690 L1300,690" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="1180" y="762" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#5b21b6">a channel forms: current flows → 1</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="106" y="866" class="s">Energy / power</text>
    <text x="1540" y="866" class="note" text-anchor="end">Schematic, not to scale.</text>
  </g>
</svg>
