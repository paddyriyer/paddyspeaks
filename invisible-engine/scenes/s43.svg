<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 43: The journey of a secret: from birth to revocation</title>
  <desc>Five frames along two lanes. Top lane, the owner-held keys that open location reports: 1, they are generated on the owner’s device, a key pair plus a secret seed; 2, at setup the tag receives only what it needs to derive rotating public keys, never the private key; 3, the private keys stay on the owner’s trusted devices and, Apple says, sync between them through end-to-end encrypted iCloud Keychain; 4, both sides derive a new key pair about every 15 minutes. 5, recovery and revocation, and the bottom lane: manufacturer and service keys (TLS certificates, device attestation, firmware signing) do different jobs and cannot open the reports.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 43</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The journey of a secret: from birth to revocation</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Two families of keys. Only one of them can read where the tag has been.</text>
  <g>
    <text x="60" y="182" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;font-weight:800;fill:#6b21a8">OWNER-HELD KEYS — they open location reports</text>
  </g>
  <g data-f="1">
    <rect x="60" y="200" width="270" height="250" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="94" cy="236" r="20" fill="#7c3aed"/><text x="94" y="243" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">1</text>
    <text x="124" y="244" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d">Generate</text>
    <text x="78" y="290" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155"><tspan x="78" dy="0">on the owner’s device:</tspan><tspan x="78" dy="20">a key pair (d, P) and</tspan><tspan x="78" dy="20">a secret seed SK₀</tspan></text>
    <rect x="78" y="400" width="106" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="131.0" y="419" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#1e40af">DOCUMENTED</text>
    <path d="M332,325 L358,325" class="a-crypto" marker-end="url(#m-crypto)"/>
  </g>
  <g data-f="2">
    <rect x="360" y="200" width="270" height="250" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="394" cy="236" r="20" fill="#7c3aed"/><text x="394" y="243" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">2</text>
    <text x="424" y="244" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d">Provision</text>
    <text x="378" y="290" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155"><tspan x="378" dy="0">at setup the tag gets</tspan><tspan x="378" dy="20">P and SK₀ — enough to</tspan><tspan x="378" dy="20">derive public keys only</tspan></text>
    <rect x="378" y="400" width="106" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="431.0" y="419" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#1e40af">DOCUMENTED</text>
    <path d="M632,325 L658,325" class="a-crypto" marker-end="url(#m-crypto)"/>
  </g>
  <g data-f="3">
    <rect x="660" y="200" width="270" height="250" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="694" cy="236" r="20" fill="#7c3aed"/><text x="694" y="243" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">3</text>
    <text x="724" y="244" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d">Store and sync</text>
    <text x="678" y="290" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155"><tspan x="678" dy="0">d stays on trusted</tspan><tspan x="678" dy="20">devices; synced via</tspan><tspan x="678" dy="20">E2E iCloud Keychain</tspan></text>
    <rect x="678" y="400" width="72" height="28" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="714.2" y="419" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#9a3412">VERIFY</text>
    <path d="M932,325 L958,325" class="a-crypto" marker-end="url(#m-crypto)"/>
  </g>
  <g data-f="4">
    <rect x="960" y="200" width="270" height="250" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="994" cy="236" r="20" fill="#7c3aed"/><text x="994" y="243" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">4</text>
    <text x="1024" y="244" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d">Derive and rotate</text>
    <text x="978" y="290" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155"><tspan x="978" dy="0">new Pᵢ (tag) and dᵢ</tspan><tspan x="978" dy="20">(owner) about every</tspan><tspan x="978" dy="20">15 minutes</tspan></text>
    <rect x="978" y="400" width="106" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="1031.0" y="419" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#1e40af">DOCUMENTED</text>
    <path d="M1232,325 L1258,325" class="a-crypto" marker-end="url(#m-crypto)"/>
  </g>
  <g data-f="5">
    <rect x="1260" y="200" width="270" height="250" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="1294" cy="236" r="20" fill="#334155"/><text x="1294" y="243" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">5</text>
    <text x="1324" y="244" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d">Recover or revoke</text>
    <text x="1278" y="290" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155"><tspan x="1278" dy="0">account recovery;</tspan><tspan x="1278" dy="20">Remove Item stops</tspan><tspan x="1278" dy="20">future use</tspan></text>
    <rect x="1278" y="400" width="173" height="28" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="1364.6" y="419" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#374151">PARTLY UNDISCLOSED</text>
    <text x="60" y="512" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;font-weight:800;fill:#334155">MANUFACTURER AND SERVICE KEYS — a different job</text>
    <rect x="60" y="530" width="270" height="160" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="78" y="566" text-anchor="start" style="font-size:17px;font-weight:800;fill:#14213d">TLS certificates</text>
    <text x="78" y="596" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#475569"><tspan x="78" dy="0">protect phone ↔ server</tspan><tspan x="78" dy="19">connections in transit</tspan></text>
    <rect x="360" y="530" width="270" height="160" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="378" y="566" text-anchor="start" style="font-size:17px;font-weight:800;fill:#14213d">Device attestation</text>
    <text x="378" y="596" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#475569"><tspan x="378" dy="0">lets a service check a</tspan><tspan x="378" dy="19">genuine device (detail</tspan><tspan x="378" dy="19">not public)</tspan></text>
    <rect x="660" y="530" width="270" height="160" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="678" y="566" text-anchor="start" style="font-size:17px;font-weight:800;fill:#14213d">Firmware signing</text>
    <text x="678" y="596" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#475569"><tspan x="678" dy="0">proves an update came</tspan><tspan x="678" dy="19">from the maker</tspan></text>
    <rect x="960" y="530" width="270" height="160" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="978" y="566" text-anchor="start" style="font-size:17px;font-weight:800;fill:#14213d">Account authentication</text>
    <text x="978" y="596" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#475569"><tspan x="978" dy="0">passwords, 2FA, passkeys:</tspan><tspan x="978" dy="19">decide who may ask</tspan></text>
    <rect x="1260" y="530" width="280" height="160" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/><text x="1276" y="566" text-anchor="start" style="font-size:19px;font-weight:800;fill:#dc2626">None of these</text><text x="1276" y="595" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1276" dy="0">can open a sealed</tspan><tspan x="1276" dy="21">location report.</tspan></text>
    <rect x="60" y="710" width="1480" height="104" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><text x="84" y="754" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d">Why the split matters</text>
    <text x="84" y="786" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">A service can run, check devices and route reports without ever holding the keys that read them. That is what “end-to-end” means here.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="106" y="866" class="s">Encrypted / cryptographic</text>
    <text x="1540" y="866" class="note" text-anchor="end">Apple Platform Security guide (Find My). Schematic.</text>
  </g>
</svg>
