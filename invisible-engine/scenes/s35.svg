<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 35: Whose location is it? The finder phone’s own</title>
  <desc>Four frames. The tag’s whisper reaches the finder phone carrying no location; the finder phone works out its own approximate position from satellites, Wi-Fi access points and cell towers, as it would for a map; the phone records a sighting: its own estimated position and the time, meaning the tag was somewhere within radio range of this point; and the tag never asks a satellite anything, shown crossed out.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 35</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Whose location is it? The finder phone’s own</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">The tag has no position to give. The sighting uses where the finder’s phone thinks it is.</text>
  <g data-f="1">
    <circle cx="173" cy="525" r="40" fill="#0f172a" opacity="0.13"/><circle cx="170" cy="520" r="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="170" cy="520" r="25" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="170" y="590" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">item tracker</text>
    <rect x="705" y="367" width="150" height="300" rx="26" fill="#0f172a" opacity="0.14"/><rect x="700" y="360" width="150" height="300" rx="26" fill="#111827"/><rect x="709" y="369" width="132" height="282" rx="20" fill="#f8fafc"/><rect x="754" y="375" width="42" height="11" rx="5" fill="#111827"/>
    <path d="M220,520 L690,520" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="320" y="468" width="260" height="26" rx="6" class="lab"/>
    <text x="450" y="486" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#1d4ed8"><tspan x="450" dy="0">whisper: key, no location</tspan></text>
    <rect x="60" y="640" width="470" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="86" cy="670" r="18" fill="#2563eb"/><text x="86" y="676" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="114" y="676" text-anchor="start" style="font-size:19px;font-weight:800;fill:#2563eb">The whisper has no position in it</text><text x="76" y="705" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="76" dy="0">Only a rotating key. The tag does not</tspan><tspan x="76" dy="21">know where it is.</tspan></text>
  </g>
  <g data-f="2">
    <rect x="546" y="190" width="28" height="20" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="502" y="192" width="40" height="16" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><rect x="578" y="192" width="40" height="16" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><rect x="986" y="180" width="28" height="20" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="942" y="182" width="40" height="16" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><rect x="1018" y="182" width="40" height="16" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
    <rect x="1180" y="410" width="110" height="40" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="3"/><path d="M1200,410 L1192,370 M1270,410 L1278,370" stroke="#475569" stroke-width="5.0" stroke-linecap="round"/><circle cx="1210" cy="430" r="4" fill="#22c55e"/><circle cx="1226" cy="430" r="4" fill="#22c55e"/><circle cx="1242" cy="430" r="4" fill="#22c55e"/>
    <path d="M1154,730 L1180,610 L1206,730 M1162,694 L1198,694 M1170,658 L1190,658" fill="none" stroke="#475569" stroke-width="4.0" stroke-linejoin="round"/><circle cx="1180" cy="610" r="6" fill="#475569"/><path d="M1192,600 q7,10 0,20" fill="none" stroke="#475569" stroke-width="2.8" stroke-linecap="round" opacity="1.00"/><path d="M1202,592 q11,18 0,36" fill="none" stroke="#475569" stroke-width="2.8" stroke-linecap="round" opacity="0.80"/><path d="M1168,600 q-7,10 0,20" fill="none" stroke="#475569" stroke-width="2.8" stroke-linecap="round" opacity="1.00"/><path d="M1158,592 q-11,18 0,36" fill="none" stroke="#475569" stroke-width="2.8" stroke-linecap="round" opacity="0.80"/>
    <path d="M590,230 L730,350" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M980,220 L830,350" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M1170,430 L860,470" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M1150,650 L860,580" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="1060" y="160" width="480" height="140" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="1086" cy="190" r="18" fill="#0d9488"/><text x="1086" y="196" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="1114" y="196" text-anchor="start" style="font-size:19px;font-weight:800;fill:#0d9488">The phone finds itself</text><text x="1076" y="225" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1076" dy="0">Satellites (GNSS), Wi-Fi and cell towers,</tspan><tspan x="1076" dy="21">fused as for any map app. An estimate,</tspan><tspan x="1076" dy="21">not an exact point.</tspan></text>
  </g>
  <g data-f="3">
    <circle cx="775" cy="510" r="70" fill="#22c55e" fill-opacity="0.12" stroke="#15803d" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M775,500 C755,470 755,446 775,444 C795,446 795,470 775,500 Z" fill="#15803d"/><circle cx="775" cy="462" r="7" fill="#ffffff"/>
    <rect x="560" y="690" width="480" height="120" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="586" cy="720" r="18" fill="#16a34a"/><text x="586" y="726" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="614" y="726" text-anchor="start" style="font-size:19px;font-weight:800;fill:#16a34a">A sighting = phone’s place + time</text><text x="576" y="755" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="576" dy="0">Meaning: the tag was somewhere within</tspan><tspan x="576" dy="21">radio range of this point, at this time.</tspan></text>
  </g>
  <g data-f="4">
    <path d="M190,470 L540,225" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8"/>
    <circle cx="360" cy="360" r="24" fill="#ffffff" stroke="#475569" stroke-width="4"/><path d="M349,349 L371,371 M371,349 L349,371" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <text x="250" y="300" text-anchor="middle" style="font-size:16.5px;font-weight:700;fill:#475569"><tspan x="250" dy="0">the tag never asks</tspan><tspan x="250" dy="21">a satellite anything</tspan></text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="106" y="866" class="s">Radio signal or wave</text>
    <text x="1540" y="866" class="note" text-anchor="end">Schematic.</text>
  </g>
</svg>
