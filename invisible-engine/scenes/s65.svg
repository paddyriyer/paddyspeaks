<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 65: Entanglement: two qubits, one shared story</title>
  <desc>Five frames. 1, a circuit: two qubits start in 0; a Hadamard gate acts on the first; then a CNOT gate uses the first as control and the second as target. 2, after the Hadamard the amplitudes for 00, 01, 10 and 11 are 0.707, 0, 0.707, 0. 3, after the CNOT they are 0.707, 0, 0, 0.707: the Bell state (|00⟩+|11⟩)/√2, with probability 0.5 for 00 and 0.5 for 11. 4, ten simulated runs of preparing and measuring it: the two qubits agree in all 10 runs, while each qubit alone looks random. 5, no faster-than-light messages: one side’s results look 50/50 whatever the other side does; the correlation appears only when the two lists are compared over an ordinary channel.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 65</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Entanglement: two qubits, one shared story</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Measure one and you know the other — but neither side can send a message this way.</text>
  <g data-f="1">
    <path d="M150,215 L760,215" stroke="#334155" stroke-width="2.5"/><text x="138" y="222" text-anchor="end" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:18px;font-weight:700;fill:#14213d">|0⟩</text><path d="M150,295 L760,295" stroke="#334155" stroke-width="2.5"/><text x="138" y="302" text-anchor="end" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:18px;font-weight:700;fill:#14213d">|0⟩</text>
    <rect x="232" y="189" width="56" height="52" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/><text x="260" y="223" text-anchor="middle" style="font-size:22px;font-weight:800;fill:#1d4ed8">H</text>
    <path d="M420,215 L420,315" stroke="#334155" stroke-width="3"/><circle cx="420" cy="215" r="9" fill="#334155"/><circle cx="420" cy="295" r="20" fill="#ffffff" stroke="#334155" stroke-width="3"/><path d="M400,295 L440,295 M420,275 L420,315" stroke="#334155" stroke-width="3"/>
    <text x="260" y="176" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#1d4ed8">Hadamard on q0</text>
    <text x="420" y="176" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#334155">CNOT: q0 controls q1</text>
    <text x="530" y="210" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">Left to right: start, then gates.</text><text x="530" y="234" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">Wires carry qubits, not current.</text>
    <rect x="80" y="335" width="680" height="92" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="106" cy="365" r="18" fill="#2563eb"/><text x="106" y="371" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="134" y="371" text-anchor="start" style="font-size:19px;font-weight:800;fill:#2563eb">The recipe</text><text x="96" y="400" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">H puts the first qubit in an even mix; CNOT flips the second only where the first is 1.</text>
  </g>
  <g data-f="2">
    <text x="80" y="486" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">After H</text><path d="M80,565 L280,565" stroke="#334155" stroke-width="2"/><rect x="80" y="500" width="200" height="130" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><rect x="91" y="519.0" width="28" height="46.0" rx="4" fill="#2563eb"/><text x="105.0" y="511.0380592228744" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#2563eb">0.707</text><text x="105.0" y="654" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:15px;font-weight:600;fill:#334155">00</text><text x="155.0" y="557.0" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#64748b">0</text><text x="155.0" y="654" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:15px;font-weight:600;fill:#334155">01</text><rect x="191" y="519.0" width="28" height="46.0" rx="4" fill="#2563eb"/><text x="205.0" y="511.0380592228744" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#2563eb">0.707</text><text x="205.0" y="654" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:15px;font-weight:600;fill:#334155">10</text><text x="255.0" y="557.0" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#64748b">0</text><text x="255.0" y="654" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:15px;font-weight:600;fill:#334155">11</text>
    <text x="180" y="690" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#334155">(|00⟩ + |10⟩)/√2</text>
    <text x="180" y="712" text-anchor="middle" style="font-size:14px;font-weight:400;fill:#475569">not yet linked</text>
  </g>
  <g data-f="3">
    <text x="320" y="486" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">After CNOT</text><path d="M320,565 L520,565" stroke="#334155" stroke-width="2"/><rect x="320" y="500" width="200" height="130" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><rect x="331" y="519.0" width="28" height="46.0" rx="4" fill="#2563eb"/><text x="345.0" y="511.0380592228744" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#2563eb">0.707</text><text x="345.0" y="654" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:15px;font-weight:600;fill:#334155">00</text><text x="395.0" y="557.0" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#64748b">0</text><text x="395.0" y="654" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:15px;font-weight:600;fill:#334155">01</text><text x="445.0" y="557.0" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#64748b">0</text><text x="445.0" y="654" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:15px;font-weight:600;fill:#334155">10</text><rect x="481" y="519.0" width="28" height="46.0" rx="4" fill="#2563eb"/><text x="495.0" y="511.0380592228744" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#2563eb">0.707</text><text x="495.0" y="654" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:15px;font-weight:600;fill:#334155">11</text>
    <text x="560" y="486" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">Probabilities</text><path d="M560,630 L760,630" stroke="#334155" stroke-width="2"/><rect x="571" y="565.0" width="28" height="65.0" rx="4" fill="#16a34a"/><text x="585.0" y="557.0" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#16a34a">0.5</text><text x="585.0" y="654" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:15px;font-weight:600;fill:#334155">00</text><text x="635.0" y="622.0" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#64748b">0</text><text x="635.0" y="654" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:15px;font-weight:600;fill:#334155">01</text><text x="685.0" y="622.0" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#64748b">0</text><text x="685.0" y="654" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:15px;font-weight:600;fill:#334155">10</text><rect x="721" y="565.0" width="28" height="65.0" rx="4" fill="#16a34a"/><text x="735.0" y="557.0" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#16a34a">0.5</text><text x="735.0" y="654" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:15px;font-weight:600;fill:#334155">11</text>
    <text x="540" y="712" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#14213d">(|00⟩ + |11⟩)/√2 — the Bell state</text>
    <text x="540" y="740" text-anchor="middle" style="font-size:14.5px;font-weight:400;fill:#475569">probability = amplitude²</text>
  </g>
  <g data-f="4">
    <rect x="880" y="430" width="660" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="910" cy="466" r="18" fill="#334155"/><text x="910" y="472" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="940" y="473" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">Ten simulated runs (prepare, then measure both)</text>
    <rect x="920" y="510" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="972" y="543" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:800;fill:#1d4ed8">00</text>
    <rect x="1042" y="510" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="1094" y="543" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:800;fill:#1d4ed8">00</text>
    <rect x="1164" y="510" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="1216" y="543" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:800;fill:#1d4ed8">11</text>
    <rect x="1286" y="510" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="1338" y="543" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:800;fill:#1d4ed8">00</text>
    <rect x="1408" y="510" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="1460" y="543" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:800;fill:#1d4ed8">11</text>
    <rect x="920" y="584" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="972" y="617" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:800;fill:#1d4ed8">11</text>
    <rect x="1042" y="584" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="1094" y="617" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:800;fill:#1d4ed8">00</text>
    <rect x="1164" y="584" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="1216" y="617" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:800;fill:#1d4ed8">11</text>
    <rect x="1286" y="584" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="1338" y="617" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:800;fill:#1d4ed8">11</text>
    <rect x="1408" y="584" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="1460" y="617" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:800;fill:#1d4ed8">00</text>
    <text x="910" y="690" text-anchor="start" style="font-size:15.5px;font-weight:700;fill:#334155">The two qubits agree in 10 of 10 runs.</text>
    <text x="910" y="714" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">q0 alone: 5 zeros, 5 ones — it looks random.</text>
  </g>
  <g data-f="5">
    <rect x="880" y="160" width="660" height="170" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="906" cy="190" r="18" fill="#7c3aed"/><text x="906" y="196" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="934" y="196" text-anchor="start" style="font-size:20px;font-weight:800;fill:#7c3aed">No faster-than-light messages</text><text x="896" y="226" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="896" dy="0">Whatever the far side does, the near side’s own results stay</tspan><tspan x="896" dy="21">50/50: P(q0 = 0) = 0.5. The agreement only shows up</tspan><tspan x="896" dy="21">when both lists are brought together over an ordinary</tspan><tspan x="896" dy="21">channel, at ordinary speed (the no-signalling theorem).</tspan></text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Amplitudes computed with a two-qubit statevector simulation.</text>
  </g>
</svg>
