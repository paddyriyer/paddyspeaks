<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 62: The Z gate changes a phase you cannot see directly</title>
  <desc>Five frames. 1, the plus state: amplitudes plus 0.707 and plus 0.707, probabilities 0.50 and 0.50. 2, the Z gate, matrix one, zero, zero, minus one: it flips the sign of the ket 1 part. 3, the result is the minus state, amplitudes plus 0.707 and minus 0.707, with exactly the same probabilities, 0.50 and 0.50. 4, as arrows, the ket 1 part turns by 180 degrees while the ket 0 part stays: a relative phase. 5, a note that measuring now cannot tell plus from minus, but the next H gate can (Scene 63).</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 62</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The Z gate changes a phase you cannot see directly</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Same odds before and after. What changed is the relative phase.</text>
  <g data-f="1">
    <rect x="60" y="160" width="440" height="420" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="102" cy="204" r="26" fill="#7c3aed"/><text x="102" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="142" y="214" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Before: |+⟩</text>
    <path d="M86,380 L252,380" stroke="#334155" stroke-width="2"/><rect x="100" y="309.3" width="54" height="70.7" rx="4" fill="#7c3aed"/><text x="127.0" y="300.28932188134524" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#7c3aed">+0.707</text><rect x="184" y="309.3" width="54" height="70.7" rx="4" fill="#7c3aed"/><text x="211.0" y="300.28932188134524" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#7c3aed">+0.707</text>
    <text x="127.0" y="540" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">|0⟩</text><text x="211.0" y="540" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">|1⟩</text>
    <path d="M286,380 L452,380" stroke="#334155" stroke-width="2"/><rect x="300" y="330.0" width="54" height="50.0" rx="4" fill="#0d9488"/><text x="327.0" y="321.0" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#0d9488">0.50</text><rect x="384" y="330.0" width="54" height="50.0" rx="4" fill="#0d9488"/><text x="411.0" y="321.0" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#0d9488">0.50</text>
    <text x="327.0" y="540" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">P(0)</text><text x="411.0" y="540" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">P(1)</text>
  </g>
  <g data-f="2">
    <path d="M500,340 L560,340" stroke="#334155" stroke-width="3"/><rect x="560" y="305" width="90" height="70" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="605.0" y="352.0" text-anchor="middle" style="font-size:32px;font-weight:800;fill:#7c3aed">Z</text><path d="M650,340 L700,340" stroke="#334155" stroke-width="3"/>
    <text x="540" y="451.0" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:18px;font-weight:700;fill:#7c3aed">Z =</text><path d="M593.48,418 L583.48,418 L583.48,476 L593.48,476" fill="none" stroke="#7c3aed" stroke-width="2.5"/><path d="M663.48,418 L673.48,418 L673.48,476 L663.48,476" fill="none" stroke="#7c3aed" stroke-width="2.5"/><text x="613.48" y="436" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:18px;font-weight:700;fill:#7c3aed">1</text><text x="653.48" y="436" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:18px;font-weight:700;fill:#7c3aed">0</text><text x="613.48" y="466" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:18px;font-weight:700;fill:#7c3aed">0</text><text x="653.48" y="466" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:18px;font-weight:700;fill:#7c3aed">−1</text>
    <text x="605" y="500" text-anchor="middle" style="font-size:14.5px;font-weight:600;fill:#475569">flips the sign</text><text x="605" y="520" text-anchor="middle" style="font-size:14.5px;font-weight:600;fill:#475569">of the |1⟩ part</text>
  </g>
  <g data-f="3">
    <rect x="710" y="160" width="440" height="420" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="752" cy="204" r="26" fill="#7c3aed"/><text x="752" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="792" y="214" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">After: |−⟩</text>
    <path d="M736,380 L902,380" stroke="#334155" stroke-width="2"/><rect x="750" y="309.3" width="54" height="70.7" rx="4" fill="#7c3aed"/><text x="777.0" y="300.28932188134524" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#7c3aed">+0.707</text><rect x="834" y="380.0" width="54" height="70.7" rx="4" fill="#be185d"/><text x="861.0" y="470.71067811865476" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#be185d">−0.707</text>
    <text x="777.0" y="540" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">|0⟩</text><text x="861.0" y="540" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">|1⟩</text>
    <path d="M936,380 L1102,380" stroke="#334155" stroke-width="2"/><rect x="950" y="330.0" width="54" height="50.0" rx="4" fill="#0d9488"/><text x="977.0" y="321.0" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#0d9488">0.50</text><rect x="1034" y="330.0" width="54" height="50.0" rx="4" fill="#0d9488"/><text x="1061.0" y="321.0" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#0d9488">0.50</text>
    <text x="977.0" y="540" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">P(0)</text><text x="1061.0" y="540" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">P(1)</text>
  </g>
  <g data-f="4">
    <rect x="1190" y="160" width="350" height="420" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="1232" cy="204" r="26" fill="#334155"/><text x="1232" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text><text x="1272" y="214" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">As arrows</text>
    <text x="1214" y="306" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:18px;font-weight:800;fill:#7c3aed">|+⟩</text>
    <circle cx="1330" cy="300" r="46" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M1330,300 L1364.5,300.0" stroke="#7c3aed" stroke-width="4"/><path d="M1364.5,300.0 L1350.5,307.0 L1350.5,293.0 Z" fill="#7c3aed"/>
    <text x="1330" y="244" text-anchor="middle" style="font-size:13px;font-weight:600;fill:#475569">|0⟩ part</text>
    <circle cx="1450" cy="300" r="46" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M1450,300 L1484.5,300.0" stroke="#7c3aed" stroke-width="4"/><path d="M1484.5,300.0 L1470.5,307.0 L1470.5,293.0 Z" fill="#7c3aed"/>
    <text x="1450" y="244" text-anchor="middle" style="font-size:13px;font-weight:600;fill:#475569">|1⟩ part</text>
    <text x="1214" y="456" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:18px;font-weight:800;fill:#7c3aed">|−⟩</text>
    <circle cx="1330" cy="450" r="46" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M1330,450 L1364.5,450.0" stroke="#7c3aed" stroke-width="4"/><path d="M1364.5,450.0 L1350.5,457.0 L1350.5,443.0 Z" fill="#7c3aed"/>
    <circle cx="1450" cy="450" r="46" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M1450,450 L1415.5,450.0" stroke="#7c3aed" stroke-width="4"/><path d="M1415.5,450.0 L1429.5,443.0 L1429.5,457.0 Z" fill="#7c3aed"/>
    <text x="1214" y="540" text-anchor="start" style="font-size:14.5px;font-weight:700;fill:#7c3aed">|1⟩ part turned by 180°</text>
  </g>
  <g data-f="5">
    <rect x="60" y="610" width="1480" height="190" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="96" cy="648" r="20" fill="#334155"/><text x="96" y="655" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">5</text><text x="126" y="656" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">Invisible now, decisive next</text>
    <text x="126" y="694" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">Measured right now, |+⟩ and |−⟩ give the same 50 : 50: no single reading can tell them apart.</text><text x="126" y="724" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">The difference is a relative phase of 180°. One more H turns |+⟩ into 0 every time and |−⟩ into 1 every time (Scene 63).</text><text x="126" y="754" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">A phase you cannot read directly still decides the outcome of the next step.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Ideal gates. Purple: amplitudes. Teal: probabilities.</text>
  </g>
</svg>
