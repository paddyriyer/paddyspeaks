  <text x="60" y="50" class="k">SCENE 75</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Why trackers cannot simply switch: bytes, chips and batteries</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Post-quantum keys and signatures are tens to hundreds of times larger.</text>
