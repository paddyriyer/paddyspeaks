<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 75: Why trackers cannot simply switch: bytes, chips and batteries</title>
  <desc>Five frames. 1, object sizes from the standards on a logarithmic scale: an X25519 public key is 32 bytes, a compressed P-256 key 33, an ECDSA P-256 signature 64; an ML-KEM-768 ciphertext is 1,088 bytes and its encapsulation key 1,184, an ML-DSA-65 public key 1,952 and signature 3,309, and an SLH-DSA-SHA2-128s signature 7,856. 2, a legacy Bluetooth advertisement carries at most 31 bytes of data, so one ML-KEM-768 key would need 39 of them; even the largest ATT packet size of 517 bytes needs 3 packets. 3, inside a tracker: a boot ROM fixed at the factory, flash for firmware and keys, RAM of tens of kilobytes, and a coin cell — every extra byte sent costs energy. 4, beyond the device: new account devices, key synchronisation and the backend that looks reports up must all change together. 5, these are design constraints, not vulnerabilities: they decide how and when a migration can happen.</desc>
