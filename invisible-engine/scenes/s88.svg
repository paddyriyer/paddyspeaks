<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 88: What post-quantum cryptography does not fix</title>
  <desc>Five frames. 1, a passer-by’s phone sends a sealed report to the relay through a pipe protected by post-quantum key exchange and signatures: this protects the content against a future quantum computer. 2, consent: a tag hidden in someone else’s bag still reports the carrier’s location to the account holder. 3, coercion: someone pressured into sharing their location is still located. 4, phishing and account takeover, and stale shares or careless admin access: whoever gets into the account sees what the owner sees. 5, what helps instead: alerts to the person a tag travels with, sharing reviews, strong sign-in, policy and support; and a safety note that disabling a tracker can alert whoever placed it.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 88</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">What post-quantum cryptography does not fix</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Stronger locks protect the message. They cannot decide who should be allowed to read it.</text>
  <g data-f="1">
    <rect x="85" y="207" width="80" height="150" rx="14" fill="#0f172a" opacity="0.14"/><rect x="80" y="200" width="80" height="150" rx="14" fill="#111827"/><rect x="85" y="205" width="70" height="140" rx="11" fill="#e0f2fe"/><rect x="109" y="208" width="22" height="6" rx="3" fill="#111827"/>
    <text x="64" y="372" text-anchor="start" style="font-size:13.5px;font-weight:600;fill:#475569">passer-by’s phone</text>
    <path d="M557,290 a34,34 0 0 1 3,-58 a44,44 0 0 1 85,-11 a31,31 0 0 1 7,69 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/><text x="605.0" y="268.93" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#14213d">Relay</text>
    <path d="M170,270 L512,260" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="200" y="216" width="279" height="26" rx="6" class="lab"/>
    <text x="340" y="234" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#7e22ce"><tspan x="340" dy="0">sealed report, post-quantum</tspan></text>
    <path d="M320,312 L320,302 a14,14 0 0 1 28,0 L348,312" fill="none" stroke="#7c3aed" stroke-width="5.0"/><rect x="310" y="310" width="48" height="38" rx="6" fill="#7c3aed"/><circle cx="334" cy="326" r="5" fill="#ffffff"/><rect x="332" y="328" width="4" height="10" fill="#ffffff"/>
    <rect x="720" y="180" width="820" height="150" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="746" cy="210" r="18" fill="#7c3aed"/><text x="746" y="216" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="774" y="216" text-anchor="start" style="font-size:20px;font-weight:800;fill:#7c3aed">What it fixes</text><text x="736" y="246" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="736" dy="0">Key exchange and signatures that a future large, fault-tolerant quantum</tspan><tspan x="736" dy="21">computer could otherwise attack (ML-KEM, ML-DSA, SLH-DSA; Modules 9–10).</tspan><tspan x="736" dy="21">Nothing here is broken today.</tspan></text>
  </g>
  <g data-f="2">
    <rect x="60" y="380" width="340" height="200" rx="14" class="hz"/>
    <circle cx="94" cy="418" r="20" fill="#dc2626"/><text x="94" y="425" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">2</text>
    <text x="126" y="426" text-anchor="start" style="font-size:21px;font-weight:800;fill:#991b1b">Consent</text>
    <text x="84" y="468" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="84" dy="0">A tag hidden in someone’s bag:</tspan><tspan x="84" dy="21">the account holder still sees</tspan><tspan x="84" dy="21">the carrier’s location.</tspan></text>
    <text x="84" y="560" text-anchor="start" style="font-size:13.5px;font-weight:700;fill:#b91c1c">unchanged by post-quantum crypto</text>
  </g>
  <g data-f="3">
    <rect x="440" y="380" width="340" height="200" rx="14" class="hz"/>
    <circle cx="474" cy="418" r="20" fill="#dc2626"/><text x="474" y="425" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">3</text>
    <text x="506" y="426" text-anchor="start" style="font-size:21px;font-weight:800;fill:#991b1b">Coercion</text>
    <text x="464" y="468" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="464" dy="0">Someone pressured into sharing</tspan><tspan x="464" dy="21">is located just the same.</tspan><tspan x="464" dy="21">The maths cannot see pressure.</tspan></text>
    <text x="464" y="560" text-anchor="start" style="font-size:13.5px;font-weight:700;fill:#b91c1c">unchanged by post-quantum crypto</text>
  </g>
  <g data-f="4">
    <rect x="820" y="380" width="340" height="200" rx="14" class="hz"/>
    <circle cx="854" cy="418" r="20" fill="#dc2626"/><text x="854" y="425" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">4</text>
    <text x="886" y="426" text-anchor="start" style="font-size:21px;font-weight:800;fill:#991b1b">Phishing, takeover</text>
    <text x="844" y="468" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="844" dy="0">A fake sign-in page hands over</tspan><tspan x="844" dy="21">the account; the attacker then</tspan><tspan x="844" dy="21">sees what the owner sees.</tspan></text>
    <text x="844" y="560" text-anchor="start" style="font-size:13.5px;font-weight:700;fill:#b91c1c">unchanged by post-quantum crypto</text>
    <rect x="1200" y="380" width="340" height="200" rx="14" class="hz"/>
    <circle cx="1234" cy="418" r="20" fill="#dc2626"/><text x="1234" y="425" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">5</text>
    <text x="1266" y="426" text-anchor="start" style="font-size:21px;font-weight:800;fill:#991b1b">Stale access</text>
    <text x="1224" y="468" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1224" dy="0">Old shares, forgotten devices,</tspan><tspan x="1224" dy="21">an admin who sees too much:</tspan><tspan x="1224" dy="21">permission, not encryption.</tspan></text>
    <text x="1224" y="560" text-anchor="start" style="font-size:13.5px;font-weight:700;fill:#b91c1c">unchanged by post-quantum crypto</text>
  </g>
  <g data-f="5">
    <rect x="60" y="600" width="1480" height="112" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="86" cy="630" r="18" fill="#16a34a"/><text x="86" y="636" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">6</text><text x="114" y="636" text-anchor="start" style="font-size:20px;font-weight:800;fill:#16a34a">What helps instead</text><text x="76" y="666" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="76" dy="0">Alerts on the carrier’s own phone and a sound from separated tags · sharing reviews such as Safety Check · passkeys or security keys</tspan><tspan x="76" dy="21">and two-factor sign-in · least-privilege admin access · a written policy · people and support services (Modules 7 and 11).</tspan></text>
    <rect x="60" y="726" width="1480" height="82" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="84" y="760" text-anchor="start" style="font-size:17px;font-weight:800;fill:#7f1d1d">Safety first. If a tracker may be following you, disabling it can alert whoever placed it.</text>
    <text x="84" y="788" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#7f1d1d">Use the platform’s safety guide, someone you trust or a support service to decide when and whether.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="106" y="866" class="s">Encrypted / cryptographic</text>
    <rect x="351.0" y="852" width="34" height="18" rx="3" class="hz" style="stroke-width:3"/>
    <text x="397.0" y="866" class="s">Attacker zone / hazard</text>
    <text x="1540" y="866" class="note" text-anchor="end">Agrees with demo K: encryption decides who else can read, never who agreed.</text>
  </g>
</svg>
