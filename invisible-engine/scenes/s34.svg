<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 34: A passer-by’s phone overhears the whisper</title>
  <desc>Four frames. The tag in the suitcase repeats a Bluetooth advertisement carrying a rotating public key; a passer-by’s participating iPhone, within radio range, receives it one way; there is no pairing, no handshake and no reply to the tag, shown crossed out; and the finder’s phone handles it in the background as an observation, not a connection to the owner or to the tag.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 34</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">A passer-by’s phone overhears the whisper</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">One-way: the tag talks, a phone listens. Nobody pairs, nobody connects.</text>
  <g data-f="1">
    <path d="M195,360 L195,320 L255,320 L255,360" fill="none" stroke="#334155" stroke-width="6.0"/><rect x="155" y="367" width="150" height="190" rx="18" fill="#0f172a" opacity="0.13"/><rect x="150" y="360" width="150" height="190" rx="18" fill="#0e7490"/><path d="M195,374 L195,536" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5.0"/><path d="M225,374 L225,536" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5.0"/><path d="M255,374 L255,536" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5.0"/><circle cx="180" cy="562" r="11" fill="#334155"/><circle cx="270" cy="562" r="11" fill="#334155"/>
    <circle cx="333" cy="395" r="30" fill="#0f172a" opacity="0.13"/><circle cx="330" cy="390" r="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="330" cy="390" r="19" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M377,375 q11,15 0,31" fill="none" stroke="#2563eb" stroke-width="4.4" stroke-linecap="round" opacity="1.00"/><path d="M393,361 q18,29 0,57" fill="none" stroke="#2563eb" stroke-width="4.4" stroke-linecap="round" opacity="0.80"/><path d="M408,348 q24,42 0,84" fill="none" stroke="#2563eb" stroke-width="4.4" stroke-linecap="round" opacity="0.60"/>
    <rect x="60" y="640" width="520" height="150" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="86" cy="670" r="18" fill="#2563eb"/><text x="86" y="676" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="114" y="676" text-anchor="start" style="font-size:19px;font-weight:800;fill:#2563eb">The tag repeats an advertisement</text><text x="76" y="705" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="76" dy="0">A short Bluetooth LE broadcast with a</tspan><tspan x="76" dy="21">rotating public key in it — no name, no</tspan><tspan x="76" dy="21">owner, no location.</tspan></text>
  </g>
  <g data-f="2">
    <circle cx="940" cy="248" r="28" fill="#475569"/><path d="M901,381 L901,312 Q901,284 928,284 L952,284 Q979,284 979,312 L979,381 Z" fill="#475569"/><rect x="910" y="372" width="23" height="101" rx="9" fill="#475569"/><rect x="947" y="372" width="23" height="101" rx="9" fill="#475569"/><rect x="979" y="326" width="21" height="37" rx="5" fill="#111827" stroke="#e5e7eb" stroke-width="1.5"/>
    <path d="M430,390 L895,390" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="526" y="332" width="327" height="26" rx="6" class="lab"/>
    <text x="690" y="350" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#1d4ed8"><tspan x="690" dy="0">BLE advertisement (rotating key)</tspan></text>
    <rect x="620" y="640" width="460" height="150" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="646" cy="670" r="18" fill="#2563eb"/><text x="646" y="676" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="674" y="676" text-anchor="start" style="font-size:19px;font-weight:800;fill:#2563eb">A participating iPhone hears it</text><text x="636" y="705" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="636" dy="0">Any nearby Apple device in the Find My</tspan><tspan x="636" dy="21">network that is in range may pick it up.</tspan><tspan x="636" dy="21">Reception is not guaranteed.</tspan></text>
  </g>
  <g data-f="3">
    <path d="M960,470 L440,470" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 10"/>
    <circle cx="700" cy="470" r="24" fill="#ffffff" stroke="#475569" stroke-width="4"/><path d="M689,459 L711,481 M711,459 L689,481" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <text x="700" y="530" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#475569">no pairing · no handshake · no reply</text>
    <rect x="1120" y="640" width="420" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="1146" cy="670" r="18" fill="#334155"/><text x="1146" y="676" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="1174" y="676" text-anchor="start" style="font-size:19px;font-weight:800;fill:#334155">Not a connection</text><text x="1136" y="705" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1136" dy="0">The tag never learns who heard it.</tspan><tspan x="1136" dy="21">The finder’s phone sees only a</tspan><tspan x="1136" dy="21">random-looking key.</tspan></text>
  </g>
  <g data-f="4">
    <rect x="1120" y="300" width="420" height="180" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="1146" cy="330" r="18" fill="#16a34a"/><text x="1146" y="336" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="1174" y="336" text-anchor="start" style="font-size:19px;font-weight:800;fill:#16a34a">An observation</text><text x="1136" y="365" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1136" dy="0">The finder does nothing and is not</tspan><tspan x="1136" dy="21">asked. The phone handles it in the</tspan><tspan x="1136" dy="21">background; neither the owner nor</tspan><tspan x="1136" dy="21">the tag connects to it.</tspan></text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="106" y="866" class="s">Radio signal or wave</text>
    <text x="1540" y="866" class="note" text-anchor="end">Radio arcs illustrative.</text>
  </g>
</svg>
