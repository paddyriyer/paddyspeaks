  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 44</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Open padlocks and private keys — and why a signature is not a lock</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Encryption controls who can read. A signature proves who wrote. Different keys, different jobs.</text>
  <g data-f="1">
    <rect x="60" y="160" width="520" height="380" rx="18" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
    <circle cx="100" cy="200" r="22" fill="#7c3aed"/><text x="100" y="208" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#ffffff">1</text><text x="134" y="209" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">The analogy</text>
    <path d="M111,300 L111,273 a16,16 0 0 1 32,0 L143,280" fill="none" stroke="#a78bfa" stroke-width="6.3" transform="translate(13,-11)"/><rect x="100" y="300" width="54" height="43" rx="7" fill="#a78bfa"/><circle cx="127" cy="318" r="5" fill="#ffffff"/><rect x="125" y="319" width="4" height="13" fill="#ffffff"/>
    <path d="M191,300 L191,273 a16,16 0 0 1 32,0 L223,280" fill="none" stroke="#a78bfa" stroke-width="6.3" transform="translate(13,-11)"/><rect x="180" y="300" width="54" height="43" rx="7" fill="#a78bfa"/><circle cx="207" cy="318" r="5" fill="#ffffff"/><rect x="205" y="319" width="4" height="13" fill="#ffffff"/>
    <path d="M271,300 L271,273 a16,16 0 0 1 32,0 L303,280" fill="none" stroke="#a78bfa" stroke-width="6.3" transform="translate(13,-11)"/><rect x="260" y="300" width="54" height="43" rx="7" fill="#a78bfa"/><circle cx="287" cy="318" r="5" fill="#ffffff"/><rect x="285" y="319" width="4" height="13" fill="#ffffff"/>
    <text x="190" y="400" text-anchor="middle" style="font-size:15.5px;font-weight:700;fill:#6b21a8">open padlocks: hand out</text>
    <text x="190" y="422" text-anchor="middle" style="font-size:15.5px;font-weight:400;fill:#334155">copies to anyone</text>
    <circle cx="400" cy="330" r="18" fill="none" stroke="#7c3aed" stroke-width="7.0"/><path d="M418,330 L492,330 M472,330 L472,346 M486,330 L486,342" fill="none" stroke="#7c3aed" stroke-width="7.0" stroke-linecap="round"/>
    <text x="450" y="400" text-anchor="middle" style="font-size:15.5px;font-weight:700;fill:#6b21a8">one key: keep it</text>
    <text x="80" y="480" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">Anyone can snap a padlock shut. Only the keyholder opens it.</text>
    <text x="80" y="504" text-anchor="start" style="font-size:15.5px;font-weight:600;fill:#14213d">Public key = open padlock. Private key = the only key.</text>
  </g>
  <g data-f="2">
    <rect x="620" y="160" width="920" height="380" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="660" cy="200" r="22" fill="#7c3aed"/><text x="660" y="208" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#ffffff">2</text><text x="694" y="209" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">The precise version: encrypt to a public key</text>
    <rect x="665" y="257" width="100" height="190" rx="17" fill="#0f172a" opacity="0.14"/><rect x="660" y="250" width="100" height="190" rx="17" fill="#111827"/><rect x="666" y="256" width="88" height="178" rx="13" fill="#f0fdf4"/><rect x="696" y="260" width="28" height="7" rx="4" fill="#111827"/>
    <text x="710" y="462" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">finder</text>
    <text x="710" y="330" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#166534">place</text><text x="710" y="348" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#166534">+ time</text>
    <rect x="880" y="300" width="110" height="73" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><path d="M880,306 L935,340 L990,306" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <path d="M917,330 L917,320 a11,11 0 0 1 22,0 L939,330" fill="none" stroke="#7c3aed" stroke-width="4.2"/><rect x="910" y="330" width="36" height="29" rx="5" fill="#7c3aed"/><circle cx="928" cy="342" r="4" fill="#ffffff"/><rect x="926" y="343" width="3" height="8" fill="#ffffff"/>
    <path d="M770,345 L870,345" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="781" y="300" width="78" height="26" rx="6" class="lab"/>
    <text x="820" y="318" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#7e22ce"><tspan x="820" dy="0">with P</tspan></text>
    <path d="M1000,345 L1290,345" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="1073" y="300" width="145" height="26" rx="6" class="lab"/>
    <text x="1145" y="318" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#7e22ce"><tspan x="1145" dy="0">sealed report</tspan></text>
    <rect x="1305" y="257" width="100" height="190" rx="17" fill="#0f172a" opacity="0.14"/><rect x="1300" y="250" width="100" height="190" rx="17" fill="#111827"/><rect x="1306" y="256" width="88" height="178" rx="13" fill="#f5f3ff"/><rect x="1336" y="260" width="28" height="7" rx="4" fill="#111827"/>
    <circle cx="1316" cy="345" r="10" fill="none" stroke="#7c3aed" stroke-width="3.9"/><path d="M1326,345 L1367,345 M1356,345 L1356,354 M1363,345 L1363,352" fill="none" stroke="#7c3aed" stroke-width="3.9" stroke-linecap="round"/>
    <text x="1350" y="462" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">owner</text>
    <text x="1420" y="300" text-anchor="start" style="font-size:15px;font-weight:800;fill:#6b21a8">only d</text>
    <text x="1420" y="320" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">opens it</text>
  </g>
  <g data-f="3">
    <text x="660" y="506" text-anchor="start" style="font-size:15px;font-weight:400;fill:#475569">In practice: one-time key agreement (ECDH) → key derivation → AES-GCM. The public key never decrypts anything.</text>
  </g>
