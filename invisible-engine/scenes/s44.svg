    <text x="385" y="700" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#166534">update v2.1</text>
    <text x="385" y="724" text-anchor="middle" style="font-size:14px;font-weight:400;fill:#334155">(readable)</text>
    <rect x="330" y="740" width="110" height="22" rx="5" fill="#7c3aed"/><text x="385" y="756" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#ffffff">signature</text>
