    <text x="588" y="690" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#15803d"><tspan x="588" dy="0">update + signature</tspan></text>
    <circle cx="748" cy="720" r="36" fill="#0f172a" opacity="0.13"/><circle cx="745" cy="715" r="36" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="745" cy="715" r="22" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="795" cy="690" r="16" fill="#16a34a"/><path d="M788,690 L793,696 L803,684" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="800" y="742" text-anchor="start" style="font-size:14px;font-weight:400;fill:#334155">checks with the</text>
    <text x="800" y="760" text-anchor="start" style="font-size:14px;font-weight:400;fill:#334155">maker’s public key</text>
  </g>
  <g data-f="5">
    <rect x="1000" y="570" width="540" height="244" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <circle cx="1040" cy="610" r="22" fill="#b45309"/><text x="1040" y="618" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#ffffff">5</text><text x="1074" y="619" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Not the same thing</text>
    <text x="1030" y="668" text-anchor="start" style="font-size:16px;font-weight:800;fill:#6b21a8">Encryption</text><text x="1220" y="668" text-anchor="start" style="font-size:16px;font-weight:800;fill:#1e40af">Signature</text>
    <text x="1030" y="698" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">who can read it</text><text x="1220" y="698" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">who wrote it</text>
    <text x="1030" y="724" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">lock with public,</text><text x="1220" y="724" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">sign with private,</text>
    <text x="1030" y="750" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">open with private</text><text x="1220" y="750" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">check with public</text>
    <text x="1030" y="776" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">hides the content</text><text x="1220" y="776" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">hides nothing</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
