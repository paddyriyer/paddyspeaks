    <circle cx="100" cy="610" r="22" fill="#2563eb"/><text x="100" y="618" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#ffffff">4</text><text x="134" y="619" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">A different job: a signed firmware update</text>
    <rect x="100" y="650" width="90" height="32" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="114" cy="666" r="4" fill="#22c55e"/><rect x="130" y="662" width="48" height="8" rx="3" fill="#94a3b8"/><rect x="100" y="688" width="90" height="32" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="114" cy="703" r="4" fill="#22c55e"/><rect x="130" y="700" width="48" height="8" rx="3" fill="#94a3b8"/><rect x="100" y="725" width="90" height="32" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="114" cy="741" r="4" fill="#22c55e"/><rect x="130" y="737" width="48" height="8" rx="3" fill="#94a3b8"/>
    <text x="145" y="790" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">maker</text>
