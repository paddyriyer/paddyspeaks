<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 04: Induction: a changing field pushes current around a coil</title>
  <desc>Four frames. A bar magnet moving into a coil makes a meter needle swing; when the magnet stops the needle returns to zero, because only change induces voltage; an AC-driven primary coil induces an alternating voltage in a secondary coil with no wire between them; and three energy sources compared: a battery, near-field induction and far-field radio harvesting.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 04</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Induction: a changing field pushes current around a coil</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">v = −N · dΦ/dt — voltage appears only while the magnetic flux changes.</text>
  <g data-f="1">
    <rect x="60" y="160" width="720" height="330" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="102" cy="204" r="26" fill="#2563eb"/><text x="102" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="142" y="214" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Move the magnet</text>
    <rect x="110" y="300" width="80" height="54" rx="6" fill="#fecaca" stroke="#991b1b" stroke-width="3"/><rect x="190" y="300" width="80" height="54" rx="6" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="3"/><text x="150" y="336" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#991b1b">N</text><text x="230" y="336" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#1e3a8a">S</text>
    <path d="M110,390 L250,390" stroke="#64748b" stroke-width="5"/><path d="M248,378 L270,390 L248,402 Z" fill="#64748b"/>
    <text x="180" y="425" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#475569">moving</text>
    <rect x="380.0" y="260.0" width="180" height="130" rx="18" class="coil"/>
    <rect x="390.0" y="270.0" width="160" height="110" rx="15" class="coil"/>
    <rect x="400.0" y="280.0" width="140" height="90" rx="12" class="coil"/>
    <path d="M560,325 L620,325" class="wire"/><path d="M470,390 L470,440 L670,440 L670,375" class="wire"/>
    <circle cx="670" cy="330" r="48" fill="#ffffff" stroke="#334155" stroke-width="4"/><path d="M636,336 A36,36 0 0 1 704,336" fill="none" stroke="#cbd5e1" stroke-width="3"/><path d="M670,344 L696,313" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/><circle cx="670" cy="344" r="5" fill="#334155"/>
    <text x="110" y="470" text-anchor="start" style="font-size:17px;font-weight:600;fill:#1e3a8a">The needle swings while the magnet moves.</text>
  </g>
  <g data-f="2">
    <rect x="820" y="160" width="720" height="330" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="862" cy="204" r="26" fill="#334155"/><text x="862" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="902" y="214" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Stop the magnet</text>
    <rect x="1140.0" y="260.0" width="180" height="130" rx="18" class="coil"/>
    <rect x="1150.0" y="270.0" width="160" height="110" rx="15" class="coil"/>
    <rect x="1160.0" y="280.0" width="140" height="90" rx="12" class="coil"/>
    <rect x="1060" y="298" width="80" height="54" rx="6" fill="#fecaca" stroke="#991b1b" stroke-width="3"/><rect x="1140" y="298" width="80" height="54" rx="6" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="3"/><text x="1100" y="334" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#991b1b">N</text><text x="1180" y="334" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#1e3a8a">S</text>
    <path d="M1320,325 L1380,325" class="wire"/><path d="M1230,390 L1230,440 L1430,440 L1430,375" class="wire"/>
    <circle cx="1430" cy="330" r="48" fill="#ffffff" stroke="#334155" stroke-width="4"/><path d="M1396,336 A36,36 0 0 1 1464,336" fill="none" stroke="#cbd5e1" stroke-width="3"/><path d="M1430,344 L1430,304" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/><circle cx="1430" cy="344" r="5" fill="#334155"/>
    <text x="870" y="470" text-anchor="start" style="font-size:16.5px;font-weight:600;fill:#334155">A steady field induces nothing. Lenz: the current opposes the change.</text>
  </g>
  <g data-f="3">
    <rect x="60" y="510" width="1480" height="150" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="102" cy="554" r="26" fill="#ea580c"/><text x="102" y="563" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="142" y="564" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Drive one coil with AC → the other gets an AC voltage</text>
    <rect x="410.0" y="575.0" width="220" height="70" rx="18" class="coil"/>
    <rect x="420.0" y="585.0" width="200" height="50" rx="15" class="coil"/>
    <rect x="430.0" y="595.0" width="180" height="30" rx="12" class="coil"/>
    <rect x="970.0" y="575.0" width="220" height="70" rx="18" class="coil"/>
    <rect x="980.0" y="585.0" width="200" height="50" rx="15" class="coil"/>
    <rect x="990.0" y="595.0" width="180" height="30" rx="12" class="coil"/>
    <path d="M650,610 L950,610" class="a-energy" marker-end="url(#m-energy)"/>
    <rect x="651" y="574" width="298" height="26" rx="6" class="lab"/>
    <text x="800" y="592" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#c2410c"><tspan x="800" dy="0">energy via the changing field</tspan></text>
    <text x="1220" y="616" text-anchor="start" style="font-size:16px;font-weight:600;fill:#9a3412">a loose, air-cored transformer</text>
  </g>
  <g data-f="4">
    <rect x="60" y="680" width="480" height="130" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="76" y="716" text-anchor="start" style="font-size:20px;font-weight:800;fill:#16a34a">Battery</text><text x="76" y="746" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="76" dy="0">energy stored inside;</tspan><tspan x="76" dy="21">works anywhere, runs down</tspan></text>
    <rect x="560" y="680" width="480" height="130" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="576" y="716" text-anchor="start" style="font-size:20px;font-weight:800;fill:#ea580c">Near-field induction (NFC)</text><text x="576" y="746" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="576" dy="0">energy from a nearby coil;</tspan><tspan x="576" dy="21">useful only at centimetres</tspan></text>
    <rect x="1060" y="680" width="480" height="130" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="1076" y="716" text-anchor="start" style="font-size:20px;font-weight:800;fill:#2563eb">Far-field RF harvesting</text><text x="1076" y="746" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1076" dy="0">energy scavenged from a radio</tspan><tspan x="1076" dy="21">wave; typically far weaker</tspan></text>
    <rect x="481" y="703" width="12" height="14" rx="3" fill="#475569"/><rect x="470" y="715" width="34" height="64" rx="12" fill="#ffffff" stroke="#334155" stroke-width="4"/><rect x="478" y="733" width="18" height="38" rx="6" fill="#4ade80"/>
    <rect x="895.0" y="720.0" width="70" height="50" rx="18" class="coil"/>
    <rect x="902.0" y="727.0" width="56" height="36" rx="15" class="coil"/>
    <rect x="909.0" y="734.0" width="42" height="22" rx="12" class="coil"/>
    <path d="M1440,800 L1440,722 M1424,800 L1456,800" stroke="#334155" stroke-width="4" fill="none"/><circle cx="1440" cy="718" r="6" fill="#334155"/>
    <path d="M1430,708 q-7,10 0,20" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" opacity="1.00"/><path d="M1420,700 q-11,18 0,36" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" opacity="0.80"/><path d="M1411,691 q-15,27 0,53" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" opacity="0.60"/>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="106" y="866" class="s">Energy / power</text>
    <text x="1540" y="866" class="note" text-anchor="end">Schematic. The grey arrow shows the magnet moving.</text>
  </g>
</svg>
