<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 81: A risk register with its reasons showing</title>
  <desc>Three frames, each adding one worked row of a risk register as a card with eleven fields: threat, actor, preconditions, impact, likelihood basis, controls, detection, incident owner, residual risk, evidence confidence and privacy or legal review. 1, a company tag on a laptop registered to a personal account, so a leaver keeps location access; owner IT asset management; residual risk low once re-registered. 2, an unknown tracker found in an executive’s bag; owner executive protection with HR and legal; safety-first playbook; residual risk stated plainly because alerts can miss or be late. 3, a cloned static-ID badge used to open a door; owner physical security; move to challenge-response credentials; relay remains possible in principle. Likelihood is given as its basis in words, not as a number.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 81</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">A risk register with its reasons showing</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Each field answers a question someone will ask later. Likelihood is a reason, not a number.</text>
  <g data-f="1">
    <rect x="60" y="158" width="470" height="652" rx="14" fill="#ffffff" stroke="#5eead4" stroke-width="2.5"/>
    <rect x="60" y="158" width="470" height="54" rx="14" fill="#f0fdfa"/>
    <rect x="60" y="196" width="470" height="16" fill="#f0fdfa"/>
    <circle cx="90" cy="185" r="17" fill="#0d9488"/><text x="90" y="191" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#ffffff">1</text><text x="116" y="192" text-anchor="start" style="font-size:18px;font-weight:800;fill:#0d9488">Company tag on a laptop</text>
    <text x="78" y="240" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#0d9488">Threat</text><text x="78" y="262" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">tag on a personal account; leaver keeps access</text>
    <text x="78" y="292" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#0d9488">Actor</text><text x="78" y="314" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">a departing employee — no malice needed</text>
    <text x="78" y="344" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#0d9488">Preconditions</text><text x="78" y="366" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">tags bought ad hoc; no offboarding step</text>
    <text x="78" y="396" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#0d9488">Impact</text><text x="78" y="418" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">laptop location visible outside the company</text>
    <text x="78" y="448" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#0d9488">Likelihood basis</text><text x="78" y="470" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">common where tags are bought ad hoc</text>
    <text x="78" y="500" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#0d9488">Controls</text><text x="78" y="522" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">register to a managed account; offboarding</text>
    <text x="78" y="552" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#0d9488">Detection</text><text x="78" y="574" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">quarterly review of who shares company tags</text>
    <text x="78" y="604" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#0d9488">Incident owner</text><text x="78" y="626" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">IT asset management</text>
    <text x="78" y="656" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#0d9488">Residual risk</text><text x="78" y="678" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">low once re-registered</text>
    <text x="78" y="708" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#0d9488">Evidence confidence</text><text x="78" y="730" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">vendor-documented: one account per tag</text>
    <text x="78" y="760" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#0d9488">Privacy / legal review</text><text x="78" y="782" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">tags locate assets, never people — in policy</text>
  </g>
  <g data-f="2">
    <rect x="565" y="158" width="470" height="652" rx="14" fill="#ffffff" stroke="#fca5a5" stroke-width="2.5"/>
    <rect x="565" y="158" width="470" height="54" rx="14" fill="#fef2f2"/>
    <rect x="565" y="196" width="470" height="16" fill="#fef2f2"/>
    <circle cx="595" cy="185" r="17" fill="#dc2626"/><text x="595" y="191" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#ffffff">2</text><text x="621" y="192" text-anchor="start" style="font-size:18px;font-weight:800;fill:#dc2626">Unknown tracker, executive’s bag</text>
    <text x="583" y="240" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#dc2626">Threat</text><text x="583" y="262" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">someone learns the executive’s routine</text>
    <text x="583" y="292" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#dc2626">Actor</text><text x="583" y="314" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">unknown; insider or stranger</text>
    <text x="583" y="344" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#dc2626">Preconditions</text><text x="583" y="366" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">access to the bag; alerts need time and a phone</text>
    <text x="583" y="396" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#dc2626">Impact</text><text x="583" y="418" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">the person’s safety first; company exposure</text>
    <text x="583" y="448" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#dc2626">Likelihood basis</text><text x="583" y="470" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">documented cases elsewhere; no local data</text>
    <text x="583" y="500" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#dc2626">Controls</text><text x="583" y="522" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">safety-first playbook; travel briefings</text>
    <text x="583" y="552" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#dc2626">Detection</text><text x="583" y="574" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">the person’s own phone alert; offered checks</text>
    <text x="583" y="604" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#dc2626">Incident owner</text><text x="583" y="626" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">executive protection with HR and legal</text>
    <text x="583" y="656" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#dc2626">Residual risk</text><text x="583" y="678" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">alerts can miss or be late — said plainly</text>
    <text x="583" y="708" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#dc2626">Evidence confidence</text><text x="583" y="730" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">platform-documented alerts and their limits</text>
    <text x="583" y="760" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#dc2626">Privacy / legal review</text><text x="583" y="782" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">person’s consent first; legal before police</text>
  </g>
  <g data-f="3">
    <rect x="1070" y="158" width="470" height="652" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2.5"/>
    <rect x="1070" y="158" width="470" height="54" rx="14" fill="#eff6ff"/>
    <rect x="1070" y="196" width="470" height="16" fill="#eff6ff"/>
    <circle cx="1100" cy="185" r="17" fill="#2563eb"/><text x="1100" y="191" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#ffffff">3</text><text x="1126" y="192" text-anchor="start" style="font-size:18px;font-weight:800;fill:#2563eb">Cloned static-ID badge</text>
    <text x="1088" y="240" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#2563eb">Threat</text><text x="1088" y="262" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">a door opened with a copied card number</text>
    <text x="1088" y="292" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#2563eb">Actor</text><text x="1088" y="314" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">anyone briefly near the badge with a reader</text>
    <text x="1088" y="344" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#2563eb">Preconditions</text><text x="1088" y="366" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">125 kHz static-ID cards still in use</text>
    <text x="1088" y="396" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#2563eb">Impact</text><text x="1088" y="418" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">unauthorised entry; log names the wrong person</text>
    <text x="1088" y="448" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#2563eb">Likelihood basis</text><text x="1088" y="470" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">widely documented weakness (Scene 21)</text>
    <text x="1088" y="500" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#2563eb">Controls</text><text x="1088" y="522" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">challenge-response credentials; PIN at key doors</text>
    <text x="1088" y="552" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#2563eb">Detection</text><text x="1088" y="574" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">review of door events that cannot both be true</text>
    <text x="1088" y="604" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#2563eb">Incident owner</text><text x="1088" y="626" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">physical security</text>
    <text x="1088" y="656" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#2563eb">Residual risk</text><text x="1088" y="678" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">relay still possible in principle</text>
    <text x="1088" y="708" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#2563eb">Evidence confidence</text><text x="1088" y="730" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">documented, long-standing</text>
    <text x="1088" y="760" text-anchor="start" style="font-size:13.5px;font-weight:800;fill:#2563eb">Privacy / legal review</text><text x="1088" y="782" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#1f2937">door logs are personal data — keep them briefly</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Worked examples; re-rate every row for your own organisation.</text>
  </g>
</svg>
