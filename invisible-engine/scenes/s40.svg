<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 40: NFC Lost Mode: a tap that shows a note, not a location</title>
  <desc>Four frames. Someone finds a tag and holds an NFC-capable phone, iPhone or Android, a few centimetres from it; the phone opens a web page with the item’s serial number; if the owner turned on Lost Mode, the page also shows the owner’s message and the contact details the owner chose to share; and what NFC cannot do: no distant tracking, nothing about the finder sent to the owner by the tap itself, and only what the owner chose is shown.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 40</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">NFC Lost Mode: a tap that shows a note, not a location</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Centimetres, on purpose. The owner decides what a finder may read.</text>
  <g data-f="1">
    <circle cx="200" cy="269" r="29" fill="#64748b"/><path d="M159,408 L159,336 Q159,307 188,307 L212,307 Q241,307 241,336 L241,408 Z" fill="#64748b"/><rect x="169" y="398" width="24" height="106" rx="10" fill="#64748b"/><rect x="207" y="398" width="24" height="106" rx="10" fill="#64748b"/>
    <rect x="425" y="307" width="150" height="290" rx="26" fill="#0f172a" opacity="0.14"/><rect x="420" y="300" width="150" height="290" rx="26" fill="#111827"/><rect x="429" y="309" width="132" height="272" rx="20" fill="#f8fafc"/><rect x="474" y="315" width="42" height="11" rx="5" fill="#111827"/>
    <circle cx="673" cy="475" r="44" fill="#0f172a" opacity="0.13"/><circle cx="670" cy="470" r="44" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="670" cy="470" r="27" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="670" y="545" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">found item tracker</text>
    <path d="M580,470 L618,470" class="a-signal" marker-end="url(#m-signal)" marker-start="url(#ms-signal)"/>
    <text x="680" y="410" text-anchor="middle" style="font-size:15.5px;font-weight:700;fill:#1d4ed8">NFC, a few cm</text>
    <rect x="60" y="650" width="560" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="86" cy="680" r="18" fill="#2563eb"/><text x="86" y="686" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="114" y="686" text-anchor="start" style="font-size:19px;font-weight:800;fill:#2563eb">Hold an NFC phone to the tag</text><text x="76" y="715" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="76" dy="0">iPhone or an NFC-capable Android phone.</tspan><tspan x="76" dy="21">No app and no account are needed to read it.</tspan></text>
  </g>
  <g data-f="2">
    <rect x="434" y="330" width="122" height="236" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="495" y="360" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11.5px;font-weight:700;fill:#1d4ed8">found.apple.com</text>
    <text x="495" y="392" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:#14213d">Serial number</text><text x="495" y="412" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:12px;font-weight:400;fill:#475569">H2X••••••9K</text>
    <rect x="820" y="170" width="720" height="120" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="846" cy="200" r="18" fill="#16a34a"/><text x="846" y="206" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="874" y="206" text-anchor="start" style="font-size:19px;font-weight:800;fill:#16a34a">A web page about the item</text><text x="836" y="235" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="836" dy="0">The tap opens a page with the item’s serial number. The finder’s</tspan><tspan x="836" dy="21">phone shows it; nothing is installed.</tspan></text>
  </g>
  <g data-f="3">
    <rect x="440" y="430" width="110" height="122" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="495" y="452" text-anchor="middle" style="font-size:12.5px;font-weight:800;fill:#92400e">Lost Mode</text>
    <text x="495" y="474" text-anchor="middle" style="font-size:11.5px;font-weight:400;fill:#334155">“Reward if</text><text x="495" y="490" text-anchor="middle" style="font-size:11.5px;font-weight:400;fill:#334155">found. Call:”</text>
    <text x="495" y="512" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;font-weight:400;fill:#334155">+44 •••• 0123</text>
    <text x="495" y="538" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#92400e">owner’s choice</text>
    <rect x="820" y="310" width="720" height="140" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="846" cy="340" r="18" fill="#b45309"/><text x="846" y="346" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="874" y="346" text-anchor="start" style="font-size:19px;font-weight:800;fill:#b45309">Only if the owner turned on Lost Mode</text><text x="836" y="375" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="836" dy="0">The owner’s message and the phone number or email the owner</tspan><tspan x="836" dy="21">chose to share. Without Lost Mode, a finder sees much less</tspan><tspan x="836" dy="21">(details in level C below).</tspan></text>
  </g>
  <g data-f="4">
    <rect x="820" y="480" width="720" height="330" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="862" cy="524" r="26" fill="#334155"/><text x="862" y="533" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text><text x="902" y="534" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">What NFC does not do</text>
    <circle cx="880" cy="600" r="20" fill="#ffffff" stroke="#475569" stroke-width="4"/><path d="M871,591 L889,609 M889,591 L871,609" stroke="#475569" stroke-width="5" stroke-linecap="round"/><text x="916" y="607" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">No distant tracking: NFC works at centimetres.</text>
    <circle cx="880" cy="670" r="20" fill="#ffffff" stroke="#475569" stroke-width="4"/><path d="M871,661 L889,679 M889,661 L871,679" stroke="#475569" stroke-width="5" stroke-linecap="round"/><text x="916" y="666" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Not part of the crowd-sourced finding network</text><text x="916" y="690" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">(that is Bluetooth sightings, Scenes 34–37).</text>
    <circle cx="880" cy="750" r="20" fill="#ffffff" stroke="#475569" stroke-width="4"/><path d="M871,741 L889,759 M889,741 L871,759" stroke="#475569" stroke-width="5" stroke-linecap="round"/><text x="916" y="757" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">No contact details unless the owner chose them.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="106" y="866" class="s">Radio signal or wave</text>
    <text x="1540" y="866" class="note" text-anchor="end">Fictional serial and number.</text>
  </g>
</svg>
