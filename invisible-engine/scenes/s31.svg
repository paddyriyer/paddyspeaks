<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 31: First-time setup: from a new tag to a named item</title>
  <desc>Five frames. A new item tracker is held next to the owner’s iPhone, which notices it at close range; the iPhone shows a Connect prompt; after the owner taps Connect and Continue, the item is registered to the owner’s Apple Account, which needs two-factor authentication; the item now appears in Find My with the name the owner chose; and a note that these are Apple’s documented user steps, not a public trace of the messages underneath.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 31</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">First-time setup: from a new tag to a named item</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Apple documents the steps you see. The messages underneath are mostly not public.</text>
  <g data-f="1">
    <rect x="125" y="197" width="230" height="460" rx="39" fill="#0f172a" opacity="0.14"/><rect x="120" y="190" width="230" height="460" rx="39" fill="#111827"/><rect x="134" y="204" width="202" height="432" rx="30" fill="#f1f5f9"/><rect x="203" y="213" width="64" height="16" rx="8" fill="#111827"/>
    <text x="235" y="270" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">Find My</text>
    <circle cx="523" cy="475" r="54" fill="#0f172a" opacity="0.13"/><circle cx="520" cy="470" r="54" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="520" cy="470" r="33" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="520" y="556" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">new item tracker</text>
    <path d="M454,456 q-10,14 0,28" fill="none" stroke="#2563eb" stroke-width="4.0" stroke-linecap="round" opacity="1.00"/><path d="M440,444 q-16,26 0,52" fill="none" stroke="#2563eb" stroke-width="4.0" stroke-linecap="round" opacity="0.80"/>
    <rect x="430" y="180" width="420" height="140" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="456" cy="210" r="18" fill="#2563eb"/><text x="456" y="216" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="484" y="216" text-anchor="start" style="font-size:19px;font-weight:800;fill:#2563eb">Hold it near the iPhone</text><text x="446" y="245" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="446" dy="0">Pull the battery tab and hold the new</tspan><tspan x="446" dy="21">tag next to an unlocked iPhone. Close</tspan><tspan x="446" dy="21">range is part of the setup step.</tspan></text>
    <path d="M560,320 L520,410" stroke="#93c5fd" stroke-width="2"/><circle cx="520" cy="410" r="5" fill="#93c5fd"/>
  </g>
  <g data-f="2">
    <rect x="146" y="440" width="178" height="170" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="235.0" y="474" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#14213d">AirTag</text><text x="235.0" y="500" text-anchor="middle" style="font-size:13.5px;font-weight:400;fill:#475569">Hold near iPhone</text><rect x="160" y="562" width="150" height="36" rx="10" fill="#2563eb"/><text x="235.0" y="586" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#ffffff">Connect</text>
    <rect x="430" y="600" width="420" height="112" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="456" cy="630" r="18" fill="#16a34a"/><text x="456" y="636" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="484" y="636" text-anchor="start" style="font-size:19px;font-weight:800;fill:#16a34a">The Connect prompt</text><text x="446" y="665" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="446" dy="0">The iPhone offers to add the item.</tspan><tspan x="446" dy="21">Nothing is linked until the owner agrees.</tspan></text>
    <path d="M430,650 L330,600" stroke="#86efac" stroke-width="2"/><circle cx="330" cy="600" r="5" fill="#86efac"/>
  </g>
  <g data-f="3">
    <path d="M1195,377 a68,68 0 0 1 7,-116 a88,88 0 0 1 170,-22 a61,61 0 0 1 14,138 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/><text x="1290.0" y="335.86" text-anchor="middle" style="font-size:25.5px;font-weight:700;fill:#14213d">Apple Account</text>
    <text x="1290" y="410" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#475569">two-factor authentication required</text>
    <path d="M360,372 L1150,372" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="826" y="324" width="327" height="26" rx="6" class="lab"/>
    <text x="990" y="342" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#4b5563"><tspan x="990" dy="0">Continue: register to my account</tspan></text>
    <rect x="920" y="450" width="620" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="946" cy="480" r="18" fill="#334155"/><text x="946" y="486" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="974" y="486" text-anchor="start" style="font-size:19px;font-weight:800;fill:#334155">Explicit account linking</text><text x="936" y="515" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="936" dy="0">The owner taps Continue. The item is registered to their</tspan><tspan x="936" dy="21">Apple Account. One account at a time: to give the tag away,</tspan><tspan x="936" dy="21">the owner removes it from their account first.</tspan></text>
  </g>
  <g data-f="4">
    <rect x="146" y="226" width="178" height="392" rx="22" fill="#f8fafc"/>
    <text x="235" y="270" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">Items</text>
    <rect x="160" y="300" width="150" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="190" cy="335" r="18" fill="#e5e7eb" stroke="#94a3b8" stroke-width="2"/>
    <text x="220" y="330" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Keys</text>
    <text x="220" y="352" text-anchor="start" style="font-size:13.5px;font-weight:400;fill:#475569">with you</text>
    <rect x="920" y="610" width="620" height="110" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="946" cy="640" r="18" fill="#2563eb"/><text x="946" y="646" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="974" y="646" text-anchor="start" style="font-size:19px;font-weight:800;fill:#2563eb">A named item in Find My</text><text x="936" y="675" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="936" dy="0">The owner chose the name (here “Keys”). The item now</tspan><tspan x="936" dy="21">appears in the Items list on their devices.</tspan></text>
  </g>
  <g data-f="5">
    <rect x="60" y="730" width="840" height="90" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="102" cy="774" r="26" fill="#b45309"/><text x="102" y="783" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text><text x="142" y="784" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d">User steps, not a packet trace</text>
    <text x="140" y="805" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">What travels between tag, phone and Apple during setup is mostly undisclosed (Scene 32).</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-admin" marker-end="url(#m-admin)"/>
    <text x="106" y="866" class="s">Registration / authorisation (not data)</text>
    <text x="1540" y="866" class="note" text-anchor="end">Steps: Apple Support. Schematic.</text>
  </g>
</svg>
