<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 30: Three “trackers” that work in completely different ways</title>
  <desc>Four frames in three columns and a comparison. A small item tracker of the AirTag class does not know where it is: it whispers over Bluetooth, a stranger’s phone nearby adds its own location and sends an encrypted report to a service the owner can query; a Bluetooth beacon fixed to a wall broadcasts the same identifier so apps on nearby phones can react, with no network of its own; a GPS tracker computes its own coordinates from satellite signals and reports them over a cellular network to a service; and a table comparing whether each knows where it is, how a location reaches anyone, its power and where it works.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 30</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Three “trackers” that work in completely different ways</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Same word, three different machines. Only one of them knows where it is.</text>
  <g data-f="1">
    <rect x="60" y="160" width="480" height="400" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="102" cy="204" r="26" fill="#2563eb"/><text x="102" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="142" y="214" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">Item tracker (AirTag-class)</text>
    <circle cx="123" cy="335" r="34" fill="#0f172a" opacity="0.13"/><circle cx="120" cy="330" r="34" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="120" cy="330" r="21" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="215" y="277" width="64" height="124" rx="11" fill="#0f172a" opacity="0.14"/><rect x="210" y="270" width="64" height="124" rx="11" fill="#111827"/><rect x="214" y="274" width="56" height="116" rx="8" fill="#eff6ff"/><rect x="233" y="276" width="18" height="4" rx="2" fill="#111827"/>
    <path d="M156,330 L204,330" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M326,316 a24,24 0 0 1 2,-41 a31,31 0 0 1 60,-8 a22,22 0 0 1 5,49 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M280,300 L318,300" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="455" y="277" width="64" height="124" rx="11" fill="#0f172a" opacity="0.14"/><rect x="450" y="270" width="64" height="124" rx="11" fill="#111827"/><rect x="454" y="274" width="56" height="116" rx="8" fill="#f5f3ff"/><rect x="473" y="276" width="18" height="4" rx="2" fill="#111827"/>
    <path d="M424,300 L444,300" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="120" y="430" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155"><tspan x="120" dy="0">whisper → a stranger’s phone adds its</tspan><tspan x="120" dy="20">own location → encrypted report →</tspan><tspan x="120" dy="20">only the owner can read it (Module 5)</tspan></text>
    <text x="120" y="530" text-anchor="start" style="font-size:16px;font-weight:800;fill:#1e3a8a">Knows where it is? No.</text>
  </g>
  <g data-f="2">
    <rect x="560" y="160" width="480" height="400" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="602" cy="204" r="26" fill="#0d9488"/><text x="602" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="642" y="214" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">BLE beacon</text>
    <rect x="600" y="240" width="20" height="200" fill="#d6d3d1"/>
    <rect x="634" y="286" width="99" height="63" rx="18" fill="#0f172a" opacity="0.13"/><rect x="630" y="280" width="99" height="63" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><circle cx="657" cy="312" r="8" fill="#2563eb"/><text x="694.8" y="316.9" text-anchor="middle" style="font-size:14.4px;font-weight:800;fill:#334155">BLE</text>
    <path d="M748,299 q9,13 0,25" fill="none" stroke="#1d4ed8" stroke-width="3.6" stroke-linecap="round" opacity="1.00"/><path d="M760,289 q14,23 0,47" fill="none" stroke="#1d4ed8" stroke-width="3.6" stroke-linecap="round" opacity="0.80"/><path d="M773,278 q20,34 0,68" fill="none" stroke="#1d4ed8" stroke-width="3.6" stroke-linecap="round" opacity="0.60"/>
    <rect x="885" y="267" width="64" height="124" rx="11" fill="#0f172a" opacity="0.14"/><rect x="880" y="260" width="64" height="124" rx="11" fill="#111827"/><rect x="884" y="264" width="56" height="116" rx="8" fill="#f0fdfa"/><rect x="903" y="266" width="18" height="4" rx="2" fill="#111827"/>
    <path d="M800,330 L874,330" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="630" y="430" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155"><tspan x="630" dy="0">fixed ID on a wall → an app on a</tspan><tspan x="630" dy="20">nearby phone reacts (“you are at</tspan><tspan x="630" dy="20">the exhibit”). No network of its own.</tspan></text>
    <text x="630" y="530" text-anchor="start" style="font-size:15.5px;font-weight:800;fill:#0f766e">Knows where it is? Only where it was fixed.</text>
  </g>
  <g data-f="3">
    <rect x="1060" y="160" width="480" height="400" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="1102" cy="204" r="26" fill="#b45309"/><text x="1102" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="1142" y="214" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">GPS + cellular tracker</text>
    <rect x="1130" y="243" width="20" height="14" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="1099" y="244" width="28" height="11" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><rect x="1153" y="244" width="28" height="11" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
    <rect x="1250" y="229" width="20" height="14" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="1219" y="230" width="28" height="11" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><rect x="1273" y="230" width="28" height="11" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
    <rect x="1114" y="336" width="112" height="70" rx="11" fill="#0f172a" opacity="0.13"/><rect x="1110" y="330" width="112" height="70" rx="11" fill="#334155"/><rect x="1194" y="309" width="8" height="24" rx="4" fill="#334155"/><rect x="1121" y="343" width="49" height="21" rx="5" fill="#0ea5e9"/><text x="1145.7" y="357.3" text-anchor="middle" style="font-size:10.5px;font-weight:800;fill:#ffffff">GPS</text><circle cx="1201" cy="379" r="5" fill="#22c55e"/>
    <path d="M1150,262 L1170,316" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M1260,248 L1210,316" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M1340,300 L1322,390 M1340,300 L1358,390 M1331,345 L1349,345 M1327,366 L1353,366" stroke="#334155" stroke-width="2.4" fill="none"/><circle cx="1340" cy="300" r="4" fill="#334155"/>
    <path d="M1224,370 L1320,370" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M1416,366 a24,24 0 0 1 2,-41 a31,31 0 0 1 60,-8 a22,22 0 0 1 5,49 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M1352,340 L1400,340" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="1100" y="460" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155"><tspan x="1100" dy="0">computes its own coordinates (GNSS),</tspan><tspan x="1100" dy="20">sends them over cellular to a service.</tspan><tspan x="1100" dy="20">Bigger battery; usually a subscription.</tspan></text>
    <text x="1100" y="530" text-anchor="start" style="font-size:16px;font-weight:800;fill:#92400e">Knows where it is? Yes.</text>
  </g>
  <g data-f="4">
    <rect x="60" y="590" width="300" height="52" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="74" y="623" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d"></text>
    <rect x="360" y="590" width="393" height="52" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="374" y="623" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">Item tracker</text>
    <rect x="753" y="590" width="393" height="52" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="767" y="623" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">BLE beacon</text>
    <rect x="1146" y="590" width="393" height="52" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1160" y="623" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">GPS tracker</text>
    <rect x="60" y="642" width="300" height="52" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="74" y="675" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">Knows its location</text>
    <rect x="360" y="642" width="393" height="52" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="374" y="675" text-anchor="start" style="font-size:16px;font-weight:400;fill:#14213d">no</text>
    <rect x="753" y="642" width="393" height="52" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="767" y="675" text-anchor="start" style="font-size:16px;font-weight:400;fill:#14213d">no (fixed place)</text>
    <rect x="1146" y="642" width="393" height="52" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1160" y="675" text-anchor="start" style="font-size:16px;font-weight:400;fill:#14213d">yes</text>
    <rect x="60" y="694" width="300" height="52" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="74" y="727" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">Location reaches someone via</text>
    <rect x="360" y="694" width="393" height="52" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="374" y="727" text-anchor="start" style="font-size:16px;font-weight:400;fill:#14213d">strangers’ phones</text>
    <rect x="753" y="694" width="393" height="52" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="767" y="727" text-anchor="start" style="font-size:16px;font-weight:400;fill:#14213d">the nearby app</text>
    <rect x="1146" y="694" width="393" height="52" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1160" y="727" text-anchor="start" style="font-size:16px;font-weight:400;fill:#14213d">its own cellular link</text>
    <rect x="60" y="746" width="300" height="52" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="74" y="779" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">Power (typical)</text>
    <rect x="360" y="746" width="393" height="52" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="374" y="779" text-anchor="start" style="font-size:16px;font-weight:400;fill:#14213d">coin cell, a year or more</text>
    <rect x="753" y="746" width="393" height="52" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="767" y="779" text-anchor="start" style="font-size:16px;font-weight:400;fill:#14213d">coin cell or mains</text>
    <rect x="1146" y="746" width="393" height="52" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1160" y="779" text-anchor="start" style="font-size:16px;font-weight:400;fill:#14213d">rechargeable, days–weeks</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="106" y="866" class="s">Radio signal or wave</text>
    <path d="M308.0,861 L342.0,861" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="354.0" y="866" class="s">Encrypted / cryptographic</text>
    <text x="1540" y="866" class="note" text-anchor="end">Generic devices. Radio arcs illustrative.</text>
  </g>
</svg>
