  <text x="60" y="50" class="k">SCENE 25</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">A whisper anyone nearby can hear</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Advertising is a broadcast. Hearing it needs no pairing, no connection and no reply.</text>
