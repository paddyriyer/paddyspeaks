<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 25: A whisper anyone nearby can hear</title>
  <desc>Five frames. A small tracker broadcasts the same advertising packet on Bluetooth LE advertising channels 37, 38 and 39, at 2402, 2426 and 2480 MHz, out of forty 2 MHz channels in the 2.4 GHz band; a passer-by’s phone, scanning, receives one copy while it happens to listen on that channel; no connection, pairing or reply is needed to receive a broadcast; reception is probabilistic because the tracker’s events and the phone’s scan windows must overlap, and walls, bodies and other radios interfere; and the phone checks the packet’s format and only acts on packets its software is built to recognise.</desc>
