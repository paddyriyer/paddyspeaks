<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 26: What is in an advertising packet</title>
  <desc>Five frames. A Bluetooth LE legacy advertising packet on the 1M PHY as a strip of fields: a 1-byte preamble, a 4-byte access address, a 2-byte PDU header, a 6-byte advertiser address, up to 31 bytes of advertising data and a 3-byte CRC; what each field is for; the advertising data as a list of length-type-value structures, one of which an ecosystem can use for its own short-lived identifier, shown conceptually; advertising, a one-way broadcast anyone can hear, contrasted with a connection, where two devices agree to talk and can encrypt after pairing; and changing addresses for privacy.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 26</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">What is in an advertising packet</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Educational field layout from the Bluetooth Core Specification. Not a capture of any product.</text>
  <g data-f="1">
    <rect x="125" y="180" width="90" height="80" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
    <text x="170.0" y="214" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">Preamble</text>
    <text x="170.0" y="242" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#334155">1 B</text>
    <rect x="215" y="180" width="190" height="80" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
    <text x="310.0" y="214" text-anchor="middle" style="font-size:16.5px;font-weight:800;fill:#14213d">Access address</text>
    <text x="310.0" y="242" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#334155">4 B</text>
    <rect x="405" y="180" width="130" height="80" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
    <text x="470.0" y="214" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">Header</text>
    <text x="470.0" y="242" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#b45309">2 B</text>
    <rect x="535" y="180" width="330" height="80" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5"/>
    <text x="700.0" y="214" text-anchor="middle" style="font-size:16.5px;font-weight:800;fill:#14213d">Advertiser address (AdvA)</text>
    <text x="700.0" y="242" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#0d9488">6 B</text>
    <rect x="865" y="180" width="470" height="80" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <text x="1100.0" y="214" text-anchor="middle" style="font-size:16.5px;font-weight:800;fill:#14213d">Advertising data (AdvData)</text>
    <text x="1100.0" y="242" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#16a34a">≤ 31 B</text>
    <rect x="1335" y="180" width="150" height="80" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
    <text x="1410.0" y="214" text-anchor="middle" style="font-size:16.5px;font-weight:800;fill:#14213d">CRC</text>
    <text x="1410.0" y="242" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#334155">3 B</text>
    <path d="M535,286 L1460,286" stroke="#334155" stroke-width="2"/><path d="M535,278 L535,294 M1460,278 L1460,294" stroke="#334155" stroke-width="2"/>
    <text x="997" y="312" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#334155">PDU (header + payload)</text>
  </g>
  <g data-f="2">
    <text x="170.0" y="346" text-anchor="middle" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="170.0" dy="0">bit-timing</tspan><tspan x="170.0" dy="19">sync</tspan></text>
    <text x="310.0" y="346" text-anchor="middle" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="310.0" dy="0">0x8E89BED6</tspan><tspan x="310.0" dy="19">for advertising</tspan></text>
    <text x="470.0" y="346" text-anchor="middle" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="470.0" dy="0">packet type</tspan><tspan x="470.0" dy="19">+ length</tspan></text>
    <text x="1410.0" y="346" text-anchor="middle" style="font-size:14.5px;font-weight:400;fill:#334155"><tspan x="1410.0" dy="0">catches errors,</tspan><tspan x="1410.0" dy="19">not attackers</tspan></text>
  </g>
  <g data-f="3">
    <path d="M865,262 L500,426 M1335,262 L1100,426" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 6"/>
    <text x="130" y="410" text-anchor="start" style="font-size:17px;font-weight:800;fill:#14213d">AdvData = a list of [length | type | value] structures</text>
    <rect x="130" y="430" width="70" height="44" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><rect x="200" y="430" width="300" height="44" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><rect x="500" y="430" width="600" height="44" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <text x="165" y="458" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#334155">len</text>
    <text x="350" y="458" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#334155">type: flags</text>
    <text x="800" y="458" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#16a34a">value</text>
    <rect x="130" y="482" width="70" height="44" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><rect x="200" y="482" width="300" height="44" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><rect x="500" y="482" width="600" height="44" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="165" y="510" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#334155">len</text>
    <text x="350" y="510" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#334155">type: manufacturer data</text>
    <text x="800" y="510" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#7c3aed">ecosystem’s short-lived identifier (conceptual)</text>
    <text x="1130" y="470" text-anchor="start" style="font-style:italic;font-size:15px;font-weight:400;fill:#475569"><tspan x="1130" dy="0">Exact tracker bytes are</tspan><tspan x="1130" dy="20">not shown: no verified</tspan><tspan x="1130" dy="20">capture is claimed here.</tspan></text>
  </g>
  <g data-f="4">
    <rect x="60" y="560" width="720" height="250" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="102" cy="604" r="26" fill="#2563eb"/><text x="102" y="613" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text><text x="142" y="614" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">Advertising vs a connection</text>
    <circle cx="133" cy="717" r="30" fill="#0f172a" opacity="0.13"/><circle cx="130" cy="712" r="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="130" cy="712" r="19" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="335" y="649" width="26" height="48" rx="4" fill="#0f172a" opacity="0.14"/><rect x="330" y="642" width="26" height="48" rx="4" fill="#111827"/><rect x="332" y="644" width="23" height="45" rx="3" fill="#eff6ff"/><rect x="339" y="645" width="7" height="2" rx="1" fill="#111827"/>
    <path d="M166,712 L322,668" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="335" y="701" width="26" height="48" rx="4" fill="#0f172a" opacity="0.14"/><rect x="330" y="694" width="26" height="48" rx="4" fill="#111827"/><rect x="332" y="696" width="23" height="45" rx="3" fill="#eff6ff"/><rect x="339" y="697" width="7" height="2" rx="1" fill="#111827"/>
    <path d="M166,712 L322,720" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="335" y="753" width="26" height="48" rx="4" fill="#0f172a" opacity="0.14"/><rect x="330" y="746" width="26" height="48" rx="4" fill="#111827"/><rect x="332" y="748" width="23" height="45" rx="3" fill="#eff6ff"/><rect x="339" y="749" width="7" height="2" rx="1" fill="#111827"/>
    <path d="M166,712 L322,772" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="90" y="790" text-anchor="start" style="font-size:14.5px;font-weight:700;fill:#1e3a8a">one-way, anyone can hear</text>
    <rect x="475" y="637" width="40" height="76" rx="7" fill="#0f172a" opacity="0.14"/><rect x="470" y="630" width="40" height="76" rx="7" fill="#111827"/><rect x="472" y="632" width="35" height="71" rx="5" fill="#eff6ff"/><rect x="484" y="634" width="11" height="3" rx="1" fill="#111827"/>
    <rect x="705" y="637" width="40" height="76" rx="7" fill="#0f172a" opacity="0.14"/><rect x="700" y="630" width="40" height="76" rx="7" fill="#111827"/><rect x="702" y="632" width="35" height="71" rx="5" fill="#eff6ff"/><rect x="714" y="634" width="11" height="3" rx="1" fill="#111827"/>
    <path d="M518,668 L692,668" class="a-signal" marker-end="url(#m-signal)" marker-start="url(#ms-signal)"/>
    <path d="M598,706 L598,701 a8,8 0 0 1 15,0 L613,706" fill="none" stroke="#7c3aed" stroke-width="2.8"/><rect x="592" y="705" width="26" height="21" rx="3" fill="#7c3aed"/><circle cx="605" cy="714" r="3" fill="#ffffff"/><rect x="604" y="715" width="2" height="6" fill="#ffffff"/>
    <text x="605" y="768" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#334155">connection (GATT): agreed, two-way,</text>
    <text x="605" y="788" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#6b21a8">encrypted after pairing</text>
  </g>
  <g data-f="5">
    <rect x="820" y="560" width="720" height="250" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="862" cy="604" r="26" fill="#7c3aed"/><text x="862" y="613" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text><text x="902" y="614" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">Addresses that change</text>
    <text x="860" y="650" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="860" dy="0">Bluetooth privacy: a resolvable private address</tspan><tspan x="860" dy="21">changes every so often (interval set by the stack).</tspan><tspan x="860" dy="21">Devices bonded with the owner can recognise it;</tspan><tspan x="860" dy="21">strangers see an unrelated value. Ecosystems such as</tspan><tspan x="860" dy="21">Find My rotate their own identifiers too (Scene 28).</tspan></text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="106" y="866" class="s">Radio signal or wave</text>
    <text x="1540" y="866" class="note" text-anchor="end">Legacy advertising, LE 1M PHY. Field widths not to scale.</text>
  </g>
</svg>
