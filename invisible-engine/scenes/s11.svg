<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 11: The reader makes the field</title>
  <desc>Three frames. A payment terminal, opened: a 13.56 MHz oscillator, a modulator, a power amplifier and a matching network drive the reader’s antenna coil; an alternating current flows in the coil; and an illustrative magnetic field reaches a few centimetres, where a card can sit.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 11</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The reader makes the field</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">The terminal supplies all the energy. The card does not transmit a carrier of its own.</text>
  <g data-f="1">
    <rect x="76" y="198" width="273" height="441" rx="32" fill="#0f172a" opacity="0.15"/><rect x="70" y="190" width="273" height="441" rx="32" fill="#1f2937"/><rect x="76" y="196" width="260" height="428" rx="27" fill="#374151"/><rect x="95" y="217" width="223" height="158" rx="13" fill="#e0f2fe" stroke="#0f172a" stroke-width="3.2"/><path d="M191.8,264.3 q8.5,9.7 0,19.3" fill="none" stroke="#0c4a6e" stroke-width="3.3600000000000003" stroke-linecap="round"/><path d="M202.7,255.9 q14.5,18.1 0,36.2" fill="none" stroke="#0c4a6e" stroke-width="3.3600000000000003" stroke-linecap="round"/><path d="M213.5,247.4 q20.5,26.6 0,53.1" fill="none" stroke="#0c4a6e" stroke-width="3.3600000000000003" stroke-linecap="round"/><text x="206.5" y="347.5" text-anchor="middle" style="font-size:23.1px;font-weight:800;fill:#0c4a6e">Tap to pay</text><rect x="112" y="405" width="55" height="34" rx="7" fill="#9ca3af" stroke="#111827" stroke-width="1.6"/><rect x="179" y="405" width="55" height="34" rx="7" fill="#9ca3af" stroke="#111827" stroke-width="1.6"/><rect x="246" y="405" width="55" height="34" rx="7" fill="#9ca3af" stroke="#111827" stroke-width="1.6"/><rect x="112" y="454" width="55" height="34" rx="7" fill="#9ca3af" stroke="#111827" stroke-width="1.6"/><rect x="179" y="454" width="55" height="34" rx="7" fill="#9ca3af" stroke="#111827" stroke-width="1.6"/><rect x="246" y="454" width="55" height="34" rx="7" fill="#9ca3af" stroke="#111827" stroke-width="1.6"/><rect x="112" y="502" width="55" height="34" rx="7" fill="#9ca3af" stroke="#111827" stroke-width="1.6"/><rect x="179" y="502" width="55" height="34" rx="7" fill="#9ca3af" stroke="#111827" stroke-width="1.6"/><rect x="246" y="502" width="55" height="34" rx="7" fill="#9ca3af" stroke="#111827" stroke-width="1.6"/><rect x="112" y="550" width="55" height="34" rx="7" fill="#ef4444" stroke="#111827" stroke-width="1.6"/><rect x="179" y="550" width="55" height="34" rx="7" fill="#facc15" stroke="#111827" stroke-width="1.6"/><rect x="246" y="550" width="55" height="34" rx="7" fill="#22c55e" stroke="#111827" stroke-width="1.6"/>
    <path d="M346,330 L430,250 M346,520 L430,770" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="430" y="170" width="520" height="620" rx="18" class="bound"/>
    <text x="456" y="210" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Inside the reader</text>
    <rect x="470" y="240" width="440" height="92" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="484" y="270" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Oscillator</text><text x="484" y="294" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">13.56 MHz, very stable</text>
    <path d="M690,334 L690,368" class="a-energy" marker-end="url(#m-energy)"/>
    <rect x="470" y="372" width="440" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="484" y="402" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Modulator</text><text x="484" y="426" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">adds the commands</text>
    <path d="M690,466 L690,500" class="a-energy" marker-end="url(#m-energy)"/>
    <rect x="470" y="504" width="440" height="92" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="484" y="534" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Amplifier</text><text x="484" y="558" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">drives the power</text>
    <path d="M690,598 L690,632" class="a-energy" marker-end="url(#m-energy)"/>
    <rect x="470" y="636" width="440" height="92" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="484" y="666" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Matching</text><text x="484" y="690" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">tunes energy into the coil</text>
  </g>
  <g data-f="2">
    <path d="M950,470 L1050,470" class="a-energy" marker-end="url(#m-energy)"/>
    <rect x="1080.0" y="360.0" width="340" height="220" rx="18" class="coil"/>
    <rect x="1091.0" y="371.0" width="318" height="198" rx="15" class="coil"/>
    <rect x="1102.0" y="382.0" width="296" height="176" rx="12" class="coil"/>
    <rect x="1113.0" y="393.0" width="274" height="154" rx="9" class="coil"/>
    <text x="1250" y="478" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#92400e">reader antenna coil</text>
    <rect x="1060" y="170" width="470" height="120" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="1086" cy="200" r="18" fill="#ea580c"/><text x="1086" y="206" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="1114" y="206" text-anchor="start" style="font-size:20px;font-weight:800;fill:#ea580c">Alternating current in the coil</text><text x="1076" y="236" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">13.56 million reversals a second.</text>
  </g>
  <g data-f="3">
    <ellipse cx="1250" cy="470" rx="210" ry="151" class="field"/>
    <ellipse cx="1250" cy="470" rx="250" ry="180" class="field"/>
    <rect x="1154" y="686" width="200" height="126" rx="10" fill="#0f172a" opacity="0.12"/><rect x="1150" y="680" width="200" height="126" rx="10" fill="#1e3a8a"/><path d="M1150,758 Q1250,737 1350,768 L1350,796 Q1350,806 1340,806 L1160,806 Q1150,806 1150,796 Z" fill="#1d4ed8" opacity="0.55"/><path d="M1310.0,719.2 q5.4,6.2 0,12.3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M1316.9,713.8 q9.2,11.5 0,23.1" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M1323.8,708.4 q13.1,16.9 0,33.8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><rect x="1170.0" y="721.58" width="30.0" height="30.24" rx="5" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M1185.0,721.58 L1185.0,751.82 M1170.0,731.6600000000001 L1181.4,731.6600000000001 M1188.6,731.6600000000001 L1200.0,731.6600000000001 M1170.0,741.74 L1181.4,741.74 M1188.6,741.74 L1200.0,741.74" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="1181.4" y="728.2328" width="7.199999999999999" height="16.9344" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/><text x="1338.0" y="705.2" text-anchor="end" style="font-size:14.000000000000002px;font-weight:800;fill:#e0e7ff">BANK</text><text x="1170.0" y="785.84" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13.0px;font-weight:600;fill:#ffffff">•••• 1234</text>
    <text x="1140" y="760" text-anchor="end" style="font-size:16px;font-weight:600;fill:#334155">card a few cm away</text>
    <rect x="60" y="700" width="330" height="110" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="86" cy="730" r="18" fill="#2563eb"/><text x="86" y="736" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="114" y="736" text-anchor="start" style="font-size:19px;font-weight:800;fill:#2563eb">Field strength</text><text x="76" y="765" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155"><tspan x="76" dy="0">ISO/IEC 14443: about</tspan><tspan x="76" dy="20">1.5–7.5 A/m, unmodulated.</tspan></text>
    <text x="470" y="820" class="note" text-anchor="start">Field rings: illustrative visualisation, not literal visible waves.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="106" y="866" class="s">Energy / power</text>
    <rect x="256.4" y="852" width="34" height="18" rx="3" class="bound" style="stroke-width:4"/>
    <text x="302.4" y="866" class="s">Trust or hardware boundary</text>
    <text x="1540" y="866" class="note" text-anchor="end">Block diagram; real readers integrate these stages.</text>
  </g>
</svg>
