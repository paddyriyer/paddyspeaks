<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 41: An owner’s life with the tag: what survives each change</title>
  <desc>Six frames showing states and transitions. 1, setup moves the tag from unregistered to registered to one Apple Account. 2, the owner can share it with up to five people and later stop sharing; sharing grants viewing, not ownership. 3, a lost or replaced iPhone changes nothing about ownership, because items belong to the account; a newly signed-in device gets access, with key material synced through end-to-end encrypted iCloud Keychain according to Apple. 4, Remove Item unlinks the tag so another account can add it; if it is out of range, Apple documents a reset procedure. 5, losing the account itself without a recovery path means losing access to the item; account recovery restores it. 6, a key distinguishing disclosed behaviour from undisclosed cryptographic implementation.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 41</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">An owner’s life with the tag: what survives each change</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Ownership lives in the Apple Account, not in a phone. Grey dashed arrows are permissions, not data.</text>
  <g data-f="1">
    <rect x="60" y="200" width="300" height="86" rx="43" fill="#f8fafc" stroke="#334155" stroke-width="3"/><text x="210.0" y="238" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#14213d">Unregistered</text><text x="210.0" y="264" text-anchor="middle" style="font-size:14.5px;font-weight:400;fill:#475569">new, removed or reset</text>
    <rect x="560" y="200" width="340" height="86" rx="43" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="730.0" y="238" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#14213d">Registered</text><text x="730.0" y="264" text-anchor="middle" style="font-size:14.5px;font-weight:400;fill:#475569">linked to one Apple Account</text>
    <path d="M360,243 L550,243" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="411" y="204" width="87" height="26" rx="6" class="lab"/>
    <text x="455" y="222" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#4b5563"><tspan x="455" dy="0">1 setup</tspan></text>
  </g>
  <g data-f="2">
    <rect x="1150" y="200" width="340" height="86" rx="43" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="1320.0" y="238" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#14213d">Shared</text><text x="1320.0" y="264" text-anchor="middle" style="font-size:14.5px;font-weight:400;fill:#475569">up to 5 people can view it</text>
    <path d="M900,228 L1140,228" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="976" y="190" width="87" height="26" rx="6" class="lab"/>
    <text x="1020" y="208" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#4b5563"><tspan x="1020" dy="0">2 share</tspan></text>
    <path d="M1140,262 L900,262" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="952" y="282" width="135" height="26" rx="6" class="lab"/>
    <text x="1020" y="300" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#4b5563"><tspan x="1020" dy="0">stop sharing</tspan></text>
  </g>
  <g data-f="3">
    <rect x="625" y="387" width="90" height="170" rx="15" fill="#0f172a" opacity="0.14"/><rect x="620" y="380" width="90" height="170" rx="15" fill="#111827"/><rect x="625" y="385" width="79" height="159" rx="12" fill="#f8fafc"/><rect x="652" y="389" width="25" height="6" rx="3" fill="#111827"/>
    <circle cx="665" cy="465" r="22" fill="#ffffff" stroke="#475569" stroke-width="4"/><path d="M655,455 L675,475 M675,455 L655,475" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <rect x="785" y="387" width="90" height="170" rx="15" fill="#0f172a" opacity="0.14"/><rect x="780" y="380" width="90" height="170" rx="15" fill="#111827"/><rect x="785" y="385" width="79" height="159" rx="12" fill="#f8fafc"/><rect x="812" y="389" width="25" height="6" rx="3" fill="#111827"/>
    <path d="M718,465 L772,465" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="745" y="372" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#6d28d9">keys sync</text>
    <rect x="890" y="360" width="650" height="140" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="916" cy="390" r="18" fill="#7c3aed"/><text x="916" y="396" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="944" y="396" text-anchor="start" style="font-size:19px;font-weight:800;fill:#7c3aed">Phone lost or replaced: ownership unchanged</text><text x="906" y="425" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="906" dy="0">Items belong to the account. A new signed-in device gets access;</tspan><tspan x="906" dy="21">Apple says Find My key material syncs via end-to-end encrypted</tspan><tspan x="906" dy="21">iCloud Keychain.</tspan></text>
  </g>
  <g data-f="4">
    <path d="M610,204 L610,176 L210,176 L210,194" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="338" y="158" width="145" height="26" rx="6" class="lab"/>
    <text x="410" y="176" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#4b5563"><tspan x="410" dy="0">4 Remove Item</tspan></text>
    <rect x="60" y="340" width="430" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="86" cy="370" r="18" fill="#334155"/><text x="86" y="376" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="114" y="376" text-anchor="start" style="font-size:19px;font-weight:800;fill:#334155">Remove, then transfer</text><text x="76" y="405" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="76" dy="0">Remove Item unlinks the tag; then</tspan><tspan x="76" dy="21">another account can set it up. Out of</tspan><tspan x="76" dy="21">range? Apple documents a reset.</tspan></text>
  </g>
  <g data-f="5">
    <rect x="60" y="570" width="380" height="86" rx="43" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><text x="250.0" y="608" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#14213d">Account inaccessible</text><text x="250.0" y="634" text-anchor="middle" style="font-size:14.5px;font-weight:400;fill:#475569">no sign-in, no recovery</text>
    <path d="M600,282 L600,330 L520,330 L520,595 L448,595" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="377" y="514" width="126" height="26" rx="6" class="lab"/>
    <text x="440" y="532" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#4b5563"><tspan x="440" dy="0">lose access</tspan></text>
    <path d="M440,640 L570,640 L570,355 L650,355 L650,294" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="512" y="672" width="116" height="26" rx="6" class="lab"/>
    <text x="570" y="690" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#4b5563"><tspan x="570" dy="0">5 recovery</tspan></text>
    <rect x="780" y="560" width="760" height="110" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/><circle cx="806" cy="590" r="18" fill="#dc2626"/><text x="806" y="596" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="834" y="596" text-anchor="start" style="font-size:19px;font-weight:800;fill:#dc2626">Lose the account, lose the item</text><text x="796" y="625" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="796" dy="0">Without recovery (recovery contact, key or Apple’s process), the</tspan><tspan x="796" dy="21">owner cannot see the item or its sightings.</tspan></text>
  </g>
  <g data-f="6">
    <rect x="60" y="700" width="1480" height="116" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="102" cy="744" r="26" fill="#b45309"/><text x="102" y="753" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">6</text><text x="142" y="754" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d">Disclosed behaviour vs undisclosed implementation</text>
    <rect x="140" y="770" width="106" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="193.0" y="789" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#1e40af">DOCUMENTED</text><text x="286" y="790" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">every transition shown</text>
    <rect x="560" y="770" width="114" height="28" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="617.2" y="789" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#374151">UNDISCLOSED</text><text x="714" y="790" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">how keys are re-issued, revoked or erased at each step</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="106" y="866" class="s">Encrypted / cryptographic</text>
    <path d="M351.0,861 L385.0,861" class="a-admin" marker-end="url(#m-admin)"/>
    <text x="397.0" y="866" class="s">Registration / authorisation (not data)</text>
  </g>
</svg>
