<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 33: Far-away luggage: a tag that does not know where it is</title>
  <desc>Four frames. A suitcase with an item tracker is left on a station platform while its owner is far away; the tag has no satellite receiver and no cellular connection, shown crossed out; what it does have is a coin cell and a Bluetooth Low Energy radio that whispers a short advertisement over and over; and a question: who knows where it is? Someone else’s phone, in the next scene.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 33</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Far-away luggage: a tag that does not know where it is</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">No map, no satellite, no SIM. Just a coin cell and a short-range whisper.</text>
  <g data-f="1">
    <rect x="60" y="560" width="900" height="40" fill="#cbd5e1"/><rect x="60" y="600" width="900" height="16" fill="#94a3b8"/><path d="M60,640 L960,640 M60,668 L960,668" stroke="#64748b" stroke-width="5"/>
    <rect x="120" y="230" width="190" height="62" rx="8" fill="#1e3a8a"/>
    <text x="215" y="270" text-anchor="middle" style="font-size:22px;font-weight:800;fill:#ffffff">Platform 3</text>
    <path d="M215,292 L215,560" stroke="#334155" stroke-width="6"/>
    <path d="M465,370 L465,330 L525,330 L525,370" fill="none" stroke="#334155" stroke-width="6.0"/><rect x="425" y="377" width="150" height="190" rx="18" fill="#0f172a" opacity="0.13"/><rect x="420" y="370" width="150" height="190" rx="18" fill="#0e7490"/><path d="M465,384 L465,546" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5.0"/><path d="M495,384 L495,546" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5.0"/><path d="M525,384 L525,546" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5.0"/><circle cx="450" cy="572" r="11" fill="#334155"/><circle cx="540" cy="572" r="11" fill="#334155"/>
    <circle cx="603" cy="405" r="30" fill="#0f172a" opacity="0.13"/><circle cx="600" cy="400" r="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="600" cy="400" r="19" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M570,400 L556,400" stroke="#334155" stroke-width="3"/>
    <circle cx="1390" cy="334" r="24" fill="#64748b"/><path d="M1356,450 L1356,390 Q1356,366 1380,366 L1400,366 Q1424,366 1424,390 L1424,450 Z" fill="#64748b"/><rect x="1364" y="442" width="20" height="88" rx="8" fill="#64748b"/><rect x="1396" y="442" width="20" height="88" rx="8" fill="#64748b"/><rect x="1424" y="402" width="18" height="32" rx="4" fill="#111827" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="1390" y="566" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#334155">the owner, 200 km away</text>
    <path d="M1060,450 L1300,450" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4 10"/>
    <rect x="60" y="690" width="440" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="86" cy="720" r="18" fill="#334155"/><text x="86" y="726" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="114" y="726" text-anchor="start" style="font-size:19px;font-weight:800;fill:#334155">Left behind</text><text x="76" y="755" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="76" dy="0">The suitcase stays on the platform.</tspan><tspan x="76" dy="21">The owner is far away (illustrative).</tspan></text>
  </g>
  <g data-f="2">
    <rect x="746" y="200" width="28" height="20" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="702" y="202" width="40" height="16" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><rect x="778" y="202" width="40" height="16" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
    <circle cx="760" cy="270" r="22" fill="#ffffff" stroke="#475569" stroke-width="4"/><path d="M750,260 L770,280 M770,260 L750,280" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <path d="M877,330 L900,222 L923,330 M884,298 L916,298 M891,265 L909,265" fill="none" stroke="#475569" stroke-width="3.6" stroke-linejoin="round"/><circle cx="900" cy="222" r="5" fill="#475569"/><path d="M911,213 q6,9 0,18" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" opacity="1.00"/><path d="M919,206 q10,16 0,33" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" opacity="0.80"/><path d="M889,213 q-6,9 0,18" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" opacity="1.00"/><path d="M881,206 q-10,16 0,33" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" opacity="0.80"/>
    <circle cx="900" cy="270" r="22" fill="#ffffff" stroke="#475569" stroke-width="4"/><path d="M890,260 L910,280 M910,260 L890,280" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <rect x="520" y="690" width="480" height="120" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/><circle cx="546" cy="720" r="18" fill="#dc2626"/><text x="546" y="726" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="574" y="726" text-anchor="start" style="font-size:19px;font-weight:800;fill:#dc2626">No GPS, no cellular</text><text x="536" y="755" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="536" dy="0">The tag has no satellite receiver and no</tspan><tspan x="536" dy="21">SIM or mobile modem. It cannot look itself up.</tspan></text>
  </g>
  <g data-f="3">
    <path d="M647,385 q11,15 0,31" fill="none" stroke="#2563eb" stroke-width="4.4" stroke-linecap="round" opacity="1.00"/><path d="M663,371 q18,29 0,57" fill="none" stroke="#2563eb" stroke-width="4.4" stroke-linecap="round" opacity="0.80"/><path d="M678,358 q24,42 0,84" fill="none" stroke="#2563eb" stroke-width="4.4" stroke-linecap="round" opacity="0.60"/>
    <circle cx="1130" cy="330" r="46" fill="#e5e7eb" stroke="#6b7280" stroke-width="4"/><circle cx="1130" cy="330" r="37" fill="none" stroke="#9ca3af" stroke-width="2"/><text x="1130" y="336" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#374151">CR2032</text>
    <text x="1130" y="404" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#334155">coin cell</text>
    <rect x="1030" y="160" width="470" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="1056" cy="190" r="18" fill="#2563eb"/><text x="1056" y="196" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="1084" y="196" text-anchor="start" style="font-size:19px;font-weight:800;fill:#2563eb">What it does have</text><text x="1046" y="225" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1046" dy="0">A Bluetooth Low Energy radio that repeats</tspan><tspan x="1046" dy="21">a short advertisement, and a coin cell.</tspan></text>
  </g>
  <g data-f="4">
    <rect x="1020" y="700" width="520" height="110" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="1046" cy="730" r="18" fill="#16a34a"/><text x="1046" y="736" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="1074" y="736" text-anchor="start" style="font-size:19px;font-weight:800;fill:#16a34a">So who knows where it is?</text><text x="1036" y="765" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1036" dy="0">Not the tag. A passing phone that knows</tspan><tspan x="1036" dy="21">where it is itself — Scene 34.</tspan></text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Radio arcs illustrative.</text>
  </g>
</svg>
