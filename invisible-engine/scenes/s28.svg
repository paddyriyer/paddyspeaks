<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 28: Changing names: why a rotating identifier protects privacy</title>
  <desc>Five frames. A tracker with a fixed identifier passes a café, a station and an office, and anyone with a scanner can link the three sightings into a path; a tracker whose identifier changes over time shows a passer-by three unrelated values; only the owner, who holds the key the identifiers come from, can link them; what rotation does not stop: radio fingerprinting, correlating one moving thing over time, long rotation intervals and implementation flaws; and a note that Find My identifiers are derived from rotating keys, with Apple documents a key change about every 15 minutes; behaviour while separated from the owner comes from independent research.</desc>
