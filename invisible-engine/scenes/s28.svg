  <text x="60" y="50" class="k">SCENE 28</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Changing names: why a rotating identifier protects privacy</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">A changing name stops casual linking. It does not make a tracker invisible.</text>
