<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 17: What contactless does not promise — and the layers that defend it</title>
  <desc>Five frames. Who sees transaction data; a relay hazard that stretches a tap across distance, with timing checks as a defence; a nearby reader reading some card data at centimetres but unable to create future cryptograms without the card’s key; a separate risk, a sticker that sends a phone to a fake web page; and layered defences.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 17</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">What contactless does not promise — and the layers that defend it</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Explained only as far as a defender needs. No instructions.</text>
  <g data-f="1">
    <rect x="60" y="160" width="720" height="230" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="102" cy="204" r="26" fill="#334155"/><text x="102" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="142" y="214" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Visible to the payment chain</text>
    <path d="M80,290 Q116,263 152,290 Q116,317 80,290 Z" fill="#ffffff" stroke="#334155" stroke-width="2.7"/><circle cx="116" cy="290" r="11" fill="#334155"/>
    <text x="180" y="270" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155"><tspan x="180" dy="0">Merchant, acquirer, network and issuer see</tspan><tspan x="180" dy="22">amount, time, place, a card or token number.</tspan><tspan x="180" dy="22">Cryptograms stop copying — they do not make</tspan><tspan x="180" dy="22">the payment private.</tspan></text>
  </g>
  <g data-f="2">
    <rect x="820" y="160" width="720" height="230" rx="18" class="hz"/>
    <circle cx="862" cy="204" r="26" fill="#dc2626"/><text x="862" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text>
    <text x="902" y="214" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Relay (hazard, conceptual)</text>
    <rect x="854" y="276" width="110" height="69" rx="6" fill="#0f172a" opacity="0.12"/><rect x="850" y="270" width="110" height="69" rx="6" fill="#1e3a8a"/><path d="M850,313 Q905,301 960,319 L960,334 Q960,339 954,339 L856,339 Q850,339 850,334 Z" fill="#1d4ed8" opacity="0.55"/><path d="M938.0,291.6 q3.0,3.4 0,6.8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M941.8,288.6 q5.1,6.3 0,12.7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M945.6,285.6 q7.2,9.3 0,18.6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><rect x="861.0" y="292.869" width="16.5" height="16.631999999999998" rx="3" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M869.25,292.869 L869.25,309.50100000000003 M861.0,298.413 L867.27,298.413 M871.23,298.413 L877.5,298.413 M861.0,303.95700000000005 L867.27,303.95700000000005 M871.23,303.95700000000005 L877.5,303.95700000000005" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="867.27" y="296.52804000000003" width="3.96" height="9.31392" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/>
    <path d="M970,305 L1200,305" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 8"/>
    <rect x="1216" y="258" width="57" height="92" rx="7" fill="#0f172a" opacity="0.15"/><rect x="1210" y="250" width="57" height="92" rx="7" fill="#1f2937"/><rect x="1211" y="251" width="55" height="90" rx="6" fill="#374151"/><rect x="1215" y="256" width="47" height="33" rx="3" fill="#e0f2fe" stroke="#0f172a" stroke-width="0.7"/><path d="M1235.5,265.6 q1.8,2.0 0,4.0" fill="none" stroke="#0c4a6e" stroke-width="0.7040000000000001" stroke-linecap="round"/><path d="M1237.8,263.8 q3.0,3.8 0,7.6" fill="none" stroke="#0c4a6e" stroke-width="0.7040000000000001" stroke-linecap="round"/><path d="M1240.1,262.0 q4.3,5.6 0,11.1" fill="none" stroke="#0c4a6e" stroke-width="0.7040000000000001" stroke-linecap="round"/><text x="1238.6" y="283.0" text-anchor="middle" style="font-size:4.84px;font-weight:800;fill:#0c4a6e">Tap to pay</text><rect x="1219" y="295" width="11" height="7" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="0.3"/><rect x="1233" y="295" width="11" height="7" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="0.3"/><rect x="1247" y="295" width="11" height="7" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="0.3"/><rect x="1219" y="305" width="11" height="7" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="0.3"/><rect x="1233" y="305" width="11" height="7" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="0.3"/><rect x="1247" y="305" width="11" height="7" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="0.3"/><rect x="1219" y="315" width="11" height="7" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="0.3"/><rect x="1233" y="315" width="11" height="7" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="0.3"/><rect x="1247" y="315" width="11" height="7" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="0.3"/><rect x="1219" y="325" width="11" height="7" rx="2" fill="#ef4444" stroke="#111827" stroke-width="0.3"/><rect x="1233" y="325" width="11" height="7" rx="2" fill="#facc15" stroke="#111827" stroke-width="0.3"/><rect x="1247" y="325" width="11" height="7" rx="2" fill="#22c55e" stroke="#111827" stroke-width="0.3"/>
    <text x="1290" y="280" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">Two devices forward the</text>
    <text x="1290" y="302" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">exchange over distance.</text>
    <text x="850" y="372" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">Defences: tight timing checks (relay-resistance protocols), amount limits, issuer risk scoring.</text>
  </g>
  <g data-f="3">
    <rect x="60" y="410" width="720" height="230" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="102" cy="454" r="26" fill="#b45309"/><text x="102" y="463" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="142" y="464" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Skimming at centimetres</text>
    <text x="100" y="500" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155"><tspan x="100" dy="0">A nearby reader can read some card data. It cannot</tspan><tspan x="100" dy="22">invent future cryptograms without the card’s secret</tspan><tspan x="100" dy="22">key; issuers check counters and unpredictable</tspan><tspan x="100" dy="22">numbers. Weak unpredictable numbers in some</tspan><tspan x="100" dy="22">terminals were a past research finding.</tspan></text>
  </g>
  <g data-f="4">
    <rect x="820" y="410" width="720" height="230" rx="18" class="hz"/>
    <circle cx="862" cy="454" r="26" fill="#dc2626"/><text x="862" y="463" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text>
    <text x="902" y="464" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">A different risk: malicious NFC tags</text>
    <rect x="860" y="500" width="90" height="90" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text x="905" y="553" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#92400e">NFC</text>
    <text x="980" y="520" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155"><tspan x="980" dy="0">A sticker’s NDEF record can send a phone to a</tspan><tspan x="980" dy="21">fake page. It cannot take money from a card; it</tspan><tspan x="980" dy="21">targets the person tapping. Check the address;</tspan><tspan x="980" dy="21">never pay or sign in from a tapped link.</tspan></text>
  </g>
  <g data-f="5">
    <rect x="60" y="660" width="1480" height="150" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="102" cy="704" r="26" fill="#16a34a"/><text x="102" y="713" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text><text x="142" y="714" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Layered defences — no single one is enough</text>
    <path d="M1450,700 L1478,690 L1507,700 L1507,724 Q1507,749 1478,760 Q1450,749 1450,724 Z" fill="#16a34a"/><path d="M1466,725 L1476,735 L1493,716" fill="none" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="748" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">Card &amp; wallet: secret keys, counters, phone authentication · Terminal: certified readers, unpredictable numbers</text>
    <text x="100" y="774" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">Network &amp; issuer: risk scoring, limits, token suspension · Person: report a lost card quickly</text>
    <text x="100" y="800" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">Stolen cards and compromised terminals remain real risks; limits cap the damage, they do not remove it.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="60" y="852" width="34" height="18" rx="3" class="hz" style="stroke-width:3"/>
    <text x="106" y="866" class="s">Attacker zone / hazard</text>
  </g>
</svg>
