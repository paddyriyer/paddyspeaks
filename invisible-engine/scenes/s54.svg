<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 54: What can be kept, and what it can and cannot show</title>
  <desc>Five frames on a timeline under a banner that is always shown: safety first; if in danger, contact local emergency services; disabling a tracker can alert the person who placed it. 1, the alert: screenshot it and any map it shows, and note the date and time. 2, the tag’s identity: if it is found, tapping it with an NFC phone shows its serial number. 3, your own notes: where and when it appeared, and who has had access to your bag, car or coat. 4, your accounts, when it is safe: who you share your location or items with, and your trusted devices, for example with Safety Check on iPhone. 5, the vendor and the police: police can ask the vendor for the account a tag is paired to, and Apple says it can provide paired-account details to valid requests; and what the evidence cannot show: a sighting is approximate, an alert can be wrong either way, and a serial number points to an account, not to the person who placed the tag.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 54</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">What can be kept, and what it can and cannot show</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Collect only what you can collect safely. Evidence helps others act; it rarely proves who placed a tag.</text>
  <g>
    <rect x="60" y="154" width="1480" height="54" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="84" y="188" text-anchor="start" style="font-size:17px;font-weight:700;fill:#991b1b">Safety first. If you are in danger, contact local emergency services. Disabling a tracker can alert the person who placed it.</text>
    <path d="M110,262 L1490,262" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g data-f="1">
    <circle cx="200" cy="262" r="22" fill="#b45309"/><text x="200" y="270" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#ffffff">1</text>
    <rect x="62" y="300" width="276" height="160" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <text x="80" y="334" text-anchor="start" style="font-size:18px;font-weight:800;fill:#b45309">The alert</text><text x="80" y="368" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">Screenshot the alert and</text><text x="80" y="393" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">any map it shows. Note</text><text x="80" y="418" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">the date and time.</text>
  </g>
  <g data-f="2">
    <circle cx="500" cy="262" r="22" fill="#2563eb"/><text x="500" y="270" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#ffffff">2</text>
    <rect x="362" y="300" width="276" height="160" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="380" y="334" text-anchor="start" style="font-size:18px;font-weight:800;fill:#2563eb">The tag’s identity</text><text x="380" y="368" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">If you find it, an NFC</text><text x="380" y="393" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">phone tap shows its</text><text x="380" y="418" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">serial number.</text>
  </g>
  <g data-f="3">
    <circle cx="800" cy="262" r="22" fill="#334155"/><text x="800" y="270" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#ffffff">3</text>
    <rect x="662" y="300" width="276" height="160" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="680" y="334" text-anchor="start" style="font-size:18px;font-weight:800;fill:#334155">Your own notes</text><text x="680" y="368" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">Where and when it</text><text x="680" y="393" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">appeared; who had access</text><text x="680" y="418" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">to your bag, car or coat.</text>
  </g>
  <g data-f="4">
    <circle cx="1100" cy="262" r="22" fill="#7c3aed"/><text x="1100" y="270" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#ffffff">4</text>
    <rect x="962" y="300" width="276" height="160" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="980" y="334" text-anchor="start" style="font-size:18px;font-weight:800;fill:#7c3aed">Your accounts</text><text x="980" y="368" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">When safe: who sees your</text><text x="980" y="393" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">location or items; trusted</text><text x="980" y="418" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">devices (Safety Check).</text>
  </g>
  <g data-f="5">
    <circle cx="1400" cy="262" r="22" fill="#16a34a"/><text x="1400" y="270" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#ffffff">5</text>
    <rect x="1262" y="300" width="276" height="160" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="1280" y="334" text-anchor="start" style="font-size:18px;font-weight:800;fill:#16a34a">Vendor and police</text><text x="1280" y="368" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">Police can ask the vendor</text><text x="1280" y="393" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">for the paired account;</text><text x="1280" y="418" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">Apple says it can provide it.</text>
    <rect x="60" y="490" width="1480" height="290" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><text x="84" y="534" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">What this evidence cannot show</text>
    <text x="90" y="580" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">• A sighting is approximate: it is where a passer-by’s phone was, not where the tag is now.</text><text x="90" y="624" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">• An alert can be wrong both ways: a false alarm, or silence when a tag is there (Scene 52).</text><text x="90" y="668" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">• A serial number points to an account, not to the person who placed the tag.</text><text x="90" y="712" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">• Laws and procedures differ by place. This lesson draws no legal conclusions.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Steps follow Apple’s and Google’s published safety guidance; check the current versions.</text>
  </g>
</svg>
