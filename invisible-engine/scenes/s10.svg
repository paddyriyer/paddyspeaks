<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 10: Inside the card</title>
  <desc>Four frames. A cutaway of an ID-1 payment card, 85.60 by 53.98 millimetres, showing a few turns of antenna coil near the edge; the coil’s two ends joining the chip module at its antenna terminals; the chip opened as a block diagram: rectifier, regulator, clock recovery, demodulator, load modulator, processor, crypto engine and secure memory; and a note that layouts vary.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 10</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Inside the card</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">A coil, a chip, and the circuits that turn a magnetic field into power and answers.</text>
  <g data-f="1">
    <rect x="74" y="206" width="780" height="491" rx="39" fill="#0f172a" opacity="0.12"/><rect x="70" y="200" width="780" height="491" rx="39" fill="#1e3a8a"/><path d="M70,505 Q460,421 850,544 L850,652 Q850,691 811,691 L109,691 Q70,691 70,652 Z" fill="#1d4ed8" opacity="0.55"/><rect x="109" y="239" width="484" height="413" rx="27" fill="#fdf6e3" stroke="#d6c7a1" stroke-width="1.5"/><rect x="128.5" y="258.5" width="444.6" height="374.4" rx="23" fill="none" stroke="#b45309" stroke-width="4.3"/><rect x="142.5" y="272.5" width="416.5" height="346.3" rx="21" fill="none" stroke="#b45309" stroke-width="4.3"/><rect x="156.6" y="286.6" width="388.4" height="318.2" rx="19" fill="none" stroke="#b45309" stroke-width="4.3"/><rect x="170.6" y="300.6" width="360.4" height="290.2" rx="17" fill="none" stroke="#b45309" stroke-width="4.3"/><rect x="280.6" y="362.16200000000003" width="117.0" height="117.93599999999999" rx="19" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M339.1,362.16200000000003 L339.1,480.098 M280.6,401.47400000000005 L325.06,401.47400000000005 M353.14000000000004,401.47400000000005 L397.6,401.47400000000005 M280.6,440.78600000000006 L325.06,440.78600000000006 M353.14000000000004,440.78600000000006 L397.6,440.78600000000006" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="325.06" y="388.10792000000004" width="28.08" height="66.04416" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/><text x="803.2" y="298.28" text-anchor="end" style="font-size:54.60000000000001px;font-weight:800;fill:#e0e7ff">BANK</text>
    <rect x="70" y="712" width="400" height="100" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="96" cy="742" r="18" fill="#ea580c"/><text x="96" y="748" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="124" y="748" text-anchor="start" style="font-size:19px;font-weight:800;fill:#ea580c">Antenna coil</text><text x="86" y="777" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">A few turns near the edge (drawn heavier).</text>
    <path d="M270,712 L140,640" stroke="#fdba74" stroke-width="2"/><circle cx="140" cy="640" r="5" fill="#fdba74"/>
  </g>
  <g data-f="2">
    <path d="M130,330 L180,330 L180,390 L280,390" fill="none" stroke="#b45309" stroke-width="5"/><path d="M130,560 L180,560 L180,452 L280,452" fill="none" stroke="#b45309" stroke-width="5"/><circle cx="280" cy="390" r="7" fill="#0f172a"/><circle cx="280" cy="452" r="7" fill="#0f172a"/>
    <rect x="490" y="712" width="360" height="100" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="516" cy="742" r="18" fill="#b45309"/><text x="516" y="748" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="544" y="748" text-anchor="start" style="font-size:19px;font-weight:800;fill:#b45309">Antenna terminals</text><text x="506" y="777" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">The coil’s two ends join the module.</text>
    <path d="M560,712 L284,456" stroke="#fcd34d" stroke-width="2"/><circle cx="284" cy="456" r="5" fill="#fcd34d"/>
  </g>
  <g data-f="3">
    <path d="M400,340 L900,170" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 6"/><path d="M400,450 L900,800" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="900" y="160" width="640" height="640" rx="18" class="bound"/>
    <circle cx="944" cy="204" r="24" fill="#7c3aed"/><text x="944" y="213" text-anchor="middle" style="font-size:25px;font-weight:800;fill:#ffffff">3</text>
    <text x="980" y="214" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">The chip, opened (block diagram)</text>
    <rect x="930" y="250" width="280" height="92" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="944" y="280" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Rectifier</text><text x="944" y="304" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">AC → DC</text>
    <rect x="1230" y="250" width="280" height="92" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="1244" y="280" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Regulator</text><text x="1244" y="304" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">steady supply</text>
    <rect x="930" y="362" width="280" height="92" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="944" y="392" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Clock recovery</text><text x="944" y="416" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">timing from 13.56 MHz</text>
    <rect x="1230" y="362" width="280" height="92" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="1244" y="392" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Demodulator</text><text x="1244" y="416" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">reads the reader</text>
    <rect x="930" y="474" width="280" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="944" y="504" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Load modulator</text><text x="944" y="528" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">answers the reader</text>
    <rect x="1230" y="474" width="280" height="92" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="1244" y="504" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Processor</text><text x="1244" y="528" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">runs the application</text>
    <rect x="930" y="586" width="280" height="92" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="944" y="616" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Crypto engine</text><text x="944" y="640" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">computes cryptograms</text>
    <rect x="1230" y="586" width="280" height="92" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1244" y="616" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Secure memory</text><text x="1244" y="640" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">keys, payment app</text>
    <path d="M1447,608 L1447,601 a10,10 0 0 1 20,0 L1467,608" fill="none" stroke="#7c3aed" stroke-width="3.5"/><rect x="1440" y="607" width="34" height="27" rx="4" fill="#7c3aed"/><circle cx="1457" cy="618" r="4" fill="#ffffff"/><rect x="1455" y="619" width="3" height="7" fill="#ffffff"/>
    <text x="930" y="720" text-anchor="start" style="font-size:17px;font-weight:600;fill:#334155">Power (orange) → logic → secrets (purple).</text>
    <text x="930" y="746" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Keys are meant never to leave the secure memory.</text>
  </g>
  <g data-f="4">
    <text x="930" y="780" text-anchor="start" style="font-style:italic;font-size:15.5px;font-weight:400;fill:#475569">Layouts vary: some cards couple the module through a small coil.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="60" y="852" width="34" height="18" rx="3" class="bound" style="stroke-width:4"/>
    <text x="106" y="866" class="s">Trust or hardware boundary</text>
    <text x="1540" y="866" class="note" text-anchor="end">Schematic, not to scale. Generic block names, not a specific chip.</text>
  </g>
</svg>
