<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 16: A plastic card and a phone wallet are different credentials</title>
  <desc>Four frames in two columns. A plastic contactless card holds the card number and card keys and gives the terminal the card number with a cryptogram; a phone wallet keeps a device-specific token and keys in a secure element and releases a per-transaction cryptogram only after the user authenticates; the payment network’s token service maps the token to the card for the issuer; and what each party still sees.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 16</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">A plastic card and a phone wallet are different credentials</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Both use fresh cryptograms. Only the wallet hides the card number from the merchant.</text>
  <g data-f="1">
    <rect x="60" y="160" width="720" height="520" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="102" cy="204" r="26" fill="#2563eb"/><text x="102" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="142" y="214" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Plastic contactless card</text>
    <rect x="104" y="246" width="300" height="189" rx="15" fill="#0f172a" opacity="0.12"/><rect x="100" y="240" width="300" height="189" rx="15" fill="#1e3a8a"/><path d="M100,357 Q250,325 400,372 L400,414 Q400,429 385,429 L115,429 Q100,429 100,414 Z" fill="#1d4ed8" opacity="0.55"/><path d="M340.0,298.8 q8.1,9.2 0,18.5" fill="none" stroke="#ffffff" stroke-width="2.727272727272727" stroke-linecap="round"/><path d="M350.4,290.7 q13.8,17.3 0,34.6" fill="none" stroke="#ffffff" stroke-width="2.727272727272727" stroke-linecap="round"/><path d="M360.8,282.7 q19.6,25.4 0,50.8" fill="none" stroke="#ffffff" stroke-width="2.727272727272727" stroke-linecap="round"/><rect x="130.0" y="302.37" width="45.0" height="45.36" rx="7" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M152.5,302.37 L152.5,347.73 M130.0,317.49 L147.1,317.49 M157.9,317.49 L175.0,317.49 M130.0,332.61 L147.1,332.61 M157.9,332.61 L175.0,332.61" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="147.1" y="312.3492" width="10.799999999999999" height="25.401600000000002" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/><text x="382.0" y="277.8" text-anchor="end" style="font-size:21.000000000000004px;font-weight:800;fill:#e0e7ff">BANK</text><text x="130.0" y="398.76" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:19.5px;font-weight:600;fill:#ffffff">•••• 1234</text>
    <text x="440" y="260" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">The chip holds</text>
    <text x="440" y="290" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155"><tspan x="440" dy="0">• the card number (PAN)</tspan><tspan x="440" dy="22">• the card’s secret keys</tspan></text>
    <path d="M200,450 L200,560" class="a-plain" marker-end="url(#m-plain)"/>
    <path d="M300,450 L300,560" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="188" y="510" text-anchor="end" style="font-size:16px;font-weight:600;fill:#166534">card no.</text>
    <text x="312" y="510" text-anchor="start" style="font-size:16px;font-weight:600;fill:#6b21a8">cryptogram</text>
    <text x="100" y="600" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">Terminal receives the card number and a fresh cryptogram.</text>
    <text x="100" y="628" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">Small payments often need no PIN; the limit varies by region.</text>
  </g>
  <g data-f="2">
    <rect x="820" y="160" width="720" height="520" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="862" cy="204" r="26" fill="#16a34a"/><text x="862" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="902" y="214" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Phone wallet (e.g. Apple Pay)</text>
    <rect x="865" y="247" width="160" height="320" rx="27" fill="#0f172a" opacity="0.14"/><rect x="860" y="240" width="160" height="320" rx="27" fill="#111827"/><rect x="870" y="250" width="141" height="301" rx="21" fill="#f8fafc"/><rect x="918" y="256" width="45" height="11" rx="6" fill="#111827"/>
    <rect x="880" y="296" width="128" height="81" rx="6" fill="#0f172a" opacity="0.12"/><rect x="876" y="290" width="128" height="81" rx="6" fill="#1e3a8a"/><path d="M876,340 Q940,326 1004,346 L1004,364 Q1004,371 998,371 L882,371 Q876,371 876,364 Z" fill="#1d4ed8" opacity="0.55"/><path d="M978.4,315.1 q3.4,3.9 0,7.9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M982.8,311.6 q5.9,7.4 0,14.8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M987.3,308.2 q8.4,10.8 0,21.7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><rect x="888.8" y="316.6112" width="19.2" height="19.3536" rx="3" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M898.4,316.6112 L898.4,335.96479999999997 M888.8,323.0624 L896.096,323.0624 M900.704,323.0624 L908.0,323.0624 M888.8,329.5136 L896.096,329.5136 M900.704,329.5136 L908.0,329.5136" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="896.096" y="320.868992" width="4.608" height="10.838016000000001" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/><text x="888.8" y="357.7376" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:8.32px;font-weight:600;fill:#ffffff">•••• 4821</text>
    <rect x="890" y="430" width="100" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="940" y="465" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#6d28d9">SE</text>
    <text x="1060" y="260" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">The secure element holds</text>
    <text x="1060" y="290" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155"><tspan x="1060" dy="0">• a device token (Apple: “Device</tspan><tspan x="1060" dy="22">  Account Number”), not the card number</tspan><tspan x="1060" dy="22">• keys for per-transaction cryptograms</tspan></text>
    <text x="1060" y="400" text-anchor="start" style="font-size:18px;font-weight:800;fill:#166534">Released only after you authenticate</text>
    <text x="1060" y="428" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">face, finger or passcode</text>
    <path d="M940,570 L940,600" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="860" y="630" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">Terminal receives the token and a per-transaction cryptogram.</text>
    <text x="860" y="656" text-anchor="start" style="font-style:italic;font-size:15px;font-weight:400;fill:#475569">Apple Pay: Apple Platform Security. Other wallets vary.</text>
  </g>
  <g data-f="3">
    <rect x="820" y="700" width="720" height="112" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="846" cy="730" r="18" fill="#b45309"/><text x="846" y="736" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="874" y="736" text-anchor="start" style="font-size:19px;font-weight:800;fill:#b45309">Token service (payment network)</text><text x="836" y="765" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="836" dy="0">Maps token → card account for the issuer; can suspend one</tspan><tspan x="836" dy="21">device’s token without replacing the card.</tspan></text>
    <path d="M1350,690 L1350,700" class="a-admin" marker-end="url(#m-admin)"/>
  </g>
  <g data-f="4">
    <rect x="60" y="700" width="720" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="86" cy="730" r="18" fill="#334155"/><text x="86" y="736" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="114" y="736" text-anchor="start" style="font-size:19px;font-weight:800;fill:#334155">Who still sees the payment (both)</text><text x="76" y="765" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="76" dy="0">Merchant: amount, time, a card or token number · Network routes it ·</tspan><tspan x="76" dy="21">Issuer: the full transaction. Contactless is not anonymous.</tspan></text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="106" y="866" class="s">Plaintext / local information</text>
    <path d="M385.4,861 L419.4,861" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="431.4" y="866" class="s">Encrypted / cryptographic</text>
    <path d="M676.4,861 L710.4,861" class="a-admin" marker-end="url(#m-admin)"/>
    <text x="722.4" y="866" class="s">Registration / authorisation (not data)</text>
  </g>
</svg>
