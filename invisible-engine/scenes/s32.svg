    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 32</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">What setup actually establishes, layer by layer</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Six things get set up. Apple documents some of them; the rest we can only infer, or not see at all.</text>
  <g data-f="1">
    <rect x="60" y="156" width="1480" height="94" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="104" cy="204" r="24" fill="#334155"/><text x="104" y="213" text-anchor="middle" style="font-size:25px;font-weight:800;fill:#ffffff">1</text>
    <text x="146" y="198" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Tag hardware identity</text>
    <text x="146" y="228" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">A serial number, readable on the tag and by NFC.</text>
    <rect x="1000" y="190" width="173" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="1086.6" y="209" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#1e40af">DOCUMENTED: serial</text>
    <rect x="1187.2" y="190" width="232" height="28" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="1303.2" y="209" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#374151">UNDISCLOSED: factory keys</text>
  </g>
  <g data-f="2">
    <rect x="60" y="260" width="1480" height="94" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="104" cy="308" r="24" fill="#2563eb"/><text x="104" y="317" text-anchor="middle" style="font-size:25px;font-weight:800;fill:#ffffff">2</text>
    <text x="146" y="302" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Onboarding transport</text>
    <text x="146" y="332" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">A short-range radio exchange with the owner’s iPhone.</text>
    <rect x="1000" y="294" width="249" height="28" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/><text x="1124.4" y="313" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#6b21a8">INFERRED: close-range radio</text>
    <rect x="1262.8" y="294" width="198" height="28" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="1362.0" y="313" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#374151">UNDISCLOSED: messages</text>
  </g>
  <g data-f="3">
    <rect x="60" y="364" width="1480" height="94" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <circle cx="104" cy="412" r="24" fill="#16a34a"/><text x="104" y="421" text-anchor="middle" style="font-size:25px;font-weight:800;fill:#ffffff">3</text>
    <text x="146" y="406" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">User authorisation</text>
    <text x="146" y="436" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">Owner taps Connect on a device signed in with two-factor auth.</text>
    <rect x="1000" y="398" width="106" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="1053.0" y="417" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#1e40af">DOCUMENTED</text>
  </g>
  <g data-f="4">
    <rect x="60" y="468" width="1480" height="94" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="104" cy="516" r="24" fill="#334155"/><text x="104" y="525" text-anchor="middle" style="font-size:25px;font-weight:800;fill:#ffffff">4</text>
    <text x="146" y="510" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Account registration</text>
    <text x="146" y="540" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">The item is linked to one Apple Account at a time.</text>
    <rect x="1000" y="502" width="198" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="1099.2" y="521" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#1e40af">DOCUMENTED: behaviour</text>
    <rect x="1212.4" y="502" width="182" height="28" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="1303.2" y="521" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#374151">UNDISCLOSED: format</text>
  </g>
  <g data-f="5">
    <rect x="60" y="572" width="1480" height="94" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="104" cy="620" r="24" fill="#7c3aed"/><text x="104" y="629" text-anchor="middle" style="font-size:25px;font-weight:800;fill:#ffffff">5</text>
    <text x="146" y="614" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Key provisioning</text>
    <text x="146" y="644" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">Owner device makes a P-224 key pair and secret for rotating keys.</text>
    <rect x="1000" y="606" width="173" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="1086.6" y="625" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#1e40af">DOCUMENTED: design</text>
    <rect x="1187.2" y="606" width="198" height="28" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="1286.4" y="625" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#374151">UNDISCLOSED: exchange</text>
  </g>
  <g data-f="6">
    <rect x="60" y="676" width="1480" height="94" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <circle cx="104" cy="724" r="24" fill="#b45309"/><text x="104" y="733" text-anchor="middle" style="font-size:25px;font-weight:800;fill:#ffffff">6</text>
    <text x="146" y="718" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Revocation / transfer</text>
    <text x="146" y="748" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">Remove Item unlinks it; then another account can add it.</text>
    <rect x="1000" y="710" width="198" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="1099.2" y="729" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#1e40af">DOCUMENTED: behaviour</text>
    <rect x="1212.4" y="710" width="207" height="28" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="1315.8000000000002" y="729" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#374151">UNDISCLOSED: mechanism</text>
    <text x="1020" y="810" text-anchor="end" style="font-size:15px;font-weight:700;fill:#334155">Key:</text><rect x="1032" y="790" width="106" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="1085.0" y="809" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#1e40af">DOCUMENTED</text><rect x="1172" y="790" width="89" height="28" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/><text x="1216.6" y="809" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#6b21a8">INFERRED</text><rect x="1292" y="790" width="114" height="28" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="1349.2" y="809" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#374151">UNDISCLOSED</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
  </g>
</svg>
