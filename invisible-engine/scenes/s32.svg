<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 32: What setup actually establishes, layer by layer</title>
  <desc>Six frames, one layer each, every layer marked documented, inferred or undisclosed. 1, the tag’s hardware identity: a serial number is documented, factory key material is not disclosed. 2, the onboarding transport: a short-range radio exchange with the owner’s iPhone, inferred from the documented hold-it-near step. 3, user authorisation: the owner taps Connect on a device signed in to an Apple Account with two-factor authentication, documented. 4, account registration: the item is linked to one Apple Account, documented; the message format is undisclosed. 5, key provisioning: the owner’s device creates a key pair and secret for rotating identifiers, documented in Apple Platform Security; the exact exchange is undisclosed. 6, revocation and transfer: Remove Item unlinks the item, documented; the cryptographic mechanism is undisclosed.</desc>
  <style>
