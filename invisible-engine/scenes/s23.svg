<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 23: Inside a tiny tracker</title>
  <desc>Five frames. The outside of a small round item tracker of the AirTag class, about three centimetres across, with no screen, no GPS and no SIM; the tracker opened into three illustrative layers, a top cover with a speaker, a circuit board and a coin-cell battery under a cover; the power parts, a CR2032-class coin cell and power management, feeding the rest; the radio parts, a microcontroller with a Bluetooth Low Energy radio, a 2.4 GHz antenna, an ultra-wideband radio and an NFC interface; and the remaining parts, a speaker and an accelerometer, with a note that the layout is illustrative, not a teardown.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 23</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Inside a tiny tracker</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">A coin cell, a few radios and a speaker. The layout is illustrative, not a teardown.</text>
  <g data-f="1">
    <circle cx="213" cy="335" r="105" fill="#0f172a" opacity="0.13"/><circle cx="210" cy="330" r="105" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="210" cy="330" r="65" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M105,470 L315,470" stroke="#334155" stroke-width="2"/><path d="M105,462 L105,478 M315,462 L315,478" stroke="#334155" stroke-width="2"/>
    <text x="210" y="500" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#334155">about 3 cm across</text>
    <rect x="60" y="560" width="330" height="170" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="86" cy="590" r="18" fill="#2563eb"/><text x="86" y="596" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="114" y="596" text-anchor="start" style="font-size:20px;font-weight:800;fill:#2563eb">The outside</text><text x="76" y="626" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155"><tspan x="76" dy="0">A small item tracker</tspan><tspan x="76" dy="21">(AirTag-class). No screen,</tspan><tspan x="76" dy="21">no GPS, no SIM card.</tspan></text>
  </g>
  <g data-f="2">
    <path d="M610,250 L610,700" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 8"/>
    <ellipse cx="610" cy="294" rx="175" ry="62" fill="#94a3b8" opacity="0.35"/><ellipse cx="610" cy="280" rx="175" ry="62" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/><text x="610" y="286" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#14213d">Top cover + speaker</text>
    <ellipse cx="610" cy="484" rx="175" ry="62" fill="#16a34a" opacity="0.35"/><ellipse cx="610" cy="470" rx="175" ry="62" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="610" y="470" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#14213d">Circuit board</text><text x="610" y="494" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#334155">radios · microcontroller · antennas</text>
    <ellipse cx="610" cy="674" rx="175" ry="62" fill="#6b7280" opacity="0.35"/><ellipse cx="610" cy="660" rx="175" ry="62" fill="#e5e7eb" stroke="#6b7280" stroke-width="3"/><text x="610" y="660" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#14213d">Coin cell + cover</text><text x="610" y="684" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#334155">user-replaceable</text>
    <text x="440" y="780" class="note" text-anchor="start">Illustrative layout, not a teardown.</text>
  </g>
  <g data-f="3">
    <rect x="920" y="165" width="300" height="86" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="934" y="195" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Coin cell (CR2032)</text><text x="934" y="219" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">3 V lithium, ~225 mAh nominal</text>
    <rect x="1240" y="165" width="300" height="86" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="1254" y="195" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Power management</text><text x="1254" y="219" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">steady supply, sleep modes</text>
    <path d="M700,604 L700,538" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="714" y="580" text-anchor="start" style="font-size:16px;font-weight:700;fill:#c2410c">power</text>
  </g>
  <g data-f="4">
    <rect x="920" y="265" width="300" height="86" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="934" y="295" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Microcontroller</text><text x="934" y="319" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">runs the firmware</text>
    <rect x="1240" y="265" width="300" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1254" y="295" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Bluetooth LE radio</text><text x="1254" y="319" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">whispers on 2.4 GHz</text>
    <rect x="920" y="365" width="300" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="934" y="395" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">2.4 GHz antenna</text><text x="934" y="419" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">tiny, compromised (Scene 27)</text>
    <rect x="1240" y="365" width="300" height="86" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text x="1254" y="395" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">UWB radio</text><text x="1254" y="419" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">Apple U1: nearby ranging</text>
    <rect x="920" y="465" width="300" height="86" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="934" y="495" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">NFC interface</text><text x="934" y="519" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">tap for Lost Mode info</text>
    <path d="M335,285 q11,15 0,31" fill="none" stroke="#1d4ed8" stroke-width="4.4" stroke-linecap="round" opacity="1.00"/><path d="M351,271 q18,29 0,57" fill="none" stroke="#1d4ed8" stroke-width="4.4" stroke-linecap="round" opacity="0.80"/><path d="M366,258 q24,42 0,84" fill="none" stroke="#1d4ed8" stroke-width="4.4" stroke-linecap="round" opacity="0.60"/>
    <text x="250" y="200" text-anchor="start" style="font-size:15px;font-weight:600;fill:#1d4ed8">radio (illustrative)</text>
  </g>
  <g data-f="5">
    <rect x="1240" y="465" width="300" height="86" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="1254" y="495" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Speaker</text><text x="1254" y="519" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">plays a sound to be found</text>
    <rect x="920" y="565" width="300" height="86" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="934" y="595" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Accelerometer</text><text x="934" y="619" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">senses motion</text>
    <rect x="1240" y="565" width="300" height="86" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="1254" y="595" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">Firmware details</text><text x="1254" y="619" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#475569">not publicly disclosed</text>
    <rect x="920" y="680" width="620" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="946" cy="710" r="18" fill="#334155"/><text x="946" y="716" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="974" y="716" text-anchor="start" style="font-size:19px;font-weight:800;fill:#334155">Documented parts, illustrative layout</text><text x="936" y="745" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155"><tspan x="936" dy="0">Apple lists Bluetooth LE, a U1 chip (UWB), NFC, a speaker, an</tspan><tspan x="936" dy="20">accelerometer and a user-replaceable CR2032. Exact boards,</tspan><tspan x="936" dy="20">chips and firmware are not shown here.</tspan></text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="106" y="866" class="s">Energy / power</text>
    <text x="1540" y="866" class="note" text-anchor="end">Generic tracker; not a specific product’s board.</text>
  </g>
</svg>
