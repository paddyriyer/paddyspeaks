  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 71</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Where quantum helps, and where it does not</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">A specialised tool for certain problem shapes, not a faster everything-computer.</text>
  <g data-f="1">
    <rect x="70" y="170" width="810" height="46" fill="#eef2ff" stroke="#e2e8f0" stroke-width="1"/><text x="220.0" y="198.58" text-anchor="middle" style="font-size:15.5px;font-weight:800;fill:#14213d">Problem</text><text x="520.0" y="198.58" text-anchor="middle" style="font-size:15.5px;font-weight:800;fill:#14213d">Known quantum help</text><text x="775.0" y="198.58" text-anchor="middle" style="font-size:15.5px;font-weight:800;fill:#14213d">How much</text><rect x="70" y="216" width="810" height="46" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="220.0" y="244.58" text-anchor="middle" style="font-size:15.5px;font-weight:500;fill:#14213d">Factoring, discrete logs</text><text x="520.0" y="244.58" text-anchor="middle" style="font-size:15.5px;font-weight:500;fill:#14213d">Shor (needs fault tolerance)</text><text x="775.0" y="244.58" text-anchor="middle" style="font-size:15.5px;font-weight:500;fill:#14213d">exponential</text><rect x="70" y="262" width="810" height="46" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="220.0" y="290.58" text-anchor="middle" style="font-size:15.5px;font-weight:500;fill:#14213d">Unstructured search</text><text x="520.0" y="290.58" text-anchor="middle" style="font-size:15.5px;font-weight:500;fill:#14213d">Grover</text><text x="775.0" y="290.58" text-anchor="middle" style="font-size:15.5px;font-weight:500;fill:#14213d">quadratic (√N)</text><rect x="70" y="308" width="810" height="46" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="220.0" y="336.58" text-anchor="middle" style="font-size:15.5px;font-weight:500;fill:#14213d">Simulating molecules, materials</text><text x="520.0" y="336.58" text-anchor="middle" style="font-size:15.5px;font-weight:500;fill:#14213d">Quantum simulation</text><text x="775.0" y="336.58" text-anchor="middle" style="font-size:15.5px;font-weight:500;fill:#14213d">problem-dependent</text><rect x="70" y="354" width="810" height="46" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="220.0" y="382.58" text-anchor="middle" style="font-size:15.5px;font-weight:500;fill:#14213d">NP-complete puzzles in general</text><text x="520.0" y="382.58" text-anchor="middle" style="font-size:15.5px;font-weight:500;fill:#14213d">none known to make them easy</text><text x="775.0" y="382.58" text-anchor="middle" style="font-size:15.5px;font-weight:500;fill:#14213d">no proof of big gains</text><rect x="70" y="400" width="810" height="46" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="220.0" y="428.58" text-anchor="middle" style="font-size:15.5px;font-weight:500;fill:#14213d">Email, video, spreadsheets</text><text x="520.0" y="428.58" text-anchor="middle" style="font-size:15.5px;font-weight:500;fill:#14213d">none</text><text x="775.0" y="428.58" text-anchor="middle" style="font-size:15.5px;font-weight:500;fill:#14213d">none</text>
    <rect x="70" y="470" width="810" height="90" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="96" cy="500" r="18" fill="#2563eb"/><text x="96" y="506" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="124" y="506" text-anchor="start" style="font-size:19px;font-weight:800;fill:#2563eb">The pattern</text><text x="86" y="535" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">Advantages come from structure that interference can exploit.</text>
  </g>
  <g data-f="2">
    <rect x="960" y="180" width="560" height="280" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <polyline points="960.0,436.7 1010.9,413.3 1061.8,390.0 1112.7,366.7 1163.6,343.3 1214.5,320.0 1265.5,296.7 1316.4,273.3 1367.3,250.0 1418.2,226.7 1469.1,203.3 1520.0,180.0" fill="none" stroke="#64748b" stroke-width="3.5"/>
    <polyline points="960.0,448.3 1010.9,436.7 1061.8,425.0 1112.7,413.3 1163.6,401.7 1214.5,390.0 1265.5,378.3 1316.4,366.7 1367.3,355.0 1418.2,343.3 1469.1,331.7 1520.0,320.0" fill="none" stroke="#7c3aed" stroke-width="3.5"/>
    <path d="M980,206 L1016,206" stroke="#64748b" stroke-width="3.5"/><text x="1026" y="211" text-anchor="start" style="font-size:15px;font-weight:700;fill:#475569">N steps (look one by one)</text>
    <path d="M980,234 L1016,234" stroke="#7c3aed" stroke-width="3.5"/><text x="1026" y="239" text-anchor="start" style="font-size:15px;font-weight:700;fill:#6d28d9">√N steps (Grover)</text>
    <circle cx="974" cy="158" r="15" fill="#7c3aed"/><text x="974" y="163" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#ffffff">2</text><text x="998" y="164" text-anchor="start" style="font-size:15.5px;font-weight:800;fill:#14213d">Steps vs problem size N (log scales, computed)</text>
    <text x="960" y="484" text-anchor="start" style="font-size:14px;font-weight:600;fill:#475569">N = 10</text><text x="1520" y="484" text-anchor="end" style="font-size:14px;font-weight:600;fill:#475569">N = 10¹²</text>
  </g>
  <g data-f="3">
    <rect x="120" y="610" width="108" height="38" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="136" cy="629" r="4" fill="#22c55e"/><rect x="156" y="624" width="58" height="9" rx="3" fill="#94a3b8"/><rect x="120" y="655" width="108" height="38" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="136" cy="674" r="4" fill="#22c55e"/><rect x="156" y="669" width="58" height="9" rx="3" fill="#94a3b8"/><rect x="120" y="700" width="108" height="38" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="136" cy="719" r="4" fill="#22c55e"/><rect x="156" y="714" width="58" height="9" rx="3" fill="#94a3b8"/><text x="174.0" y="764.8" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#334155">ordinary computer</text>
    <rect x="560" y="610" width="186" height="136" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="3"/><rect x="603" y="641" width="99" height="74" rx="18" fill="none" stroke="#94a3b8" stroke-width="7"/><rect x="647" y="636" width="12" height="10" fill="#e2e8f0"/><rect x="651" y="636" width="4" height="10" fill="#7c3aed"/>
    <text x="653" y="770" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#334155">quantum processor</text>
    <path d="M250,650 C380,600 450,600 535,636" fill="none" stroke="#334155" stroke-width="3"/><path d="M528,624 L548,642 L522,648 Z" fill="#334155"/><path d="M545,720 C450,760 380,760 262,724" fill="none" stroke="#334155" stroke-width="3"/><path d="M270,712 L250,722 L270,736 Z" fill="#334155"/>
    <text x="400" y="600" text-anchor="middle" style="font-size:14.5px;font-weight:600;fill:#334155">prepare a short circuit</text><text x="400" y="790" text-anchor="middle" style="font-size:14.5px;font-weight:600;fill:#334155">results back, checked</text><circle cx="96" cy="600" r="15" fill="#334155"/><text x="96" y="605" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#ffffff">3</text>
  </g>
  <g data-f="4">
    <rect x="960" y="560" width="580" height="210" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="986" cy="590" r="18" fill="#b45309"/><text x="986" y="596" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="1014" y="596" text-anchor="start" style="font-size:19px;font-weight:800;fill:#b45309">Honest feasibility</text><text x="976" y="625" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="976" dy="0">Error-correction overhead, loading data into</tspan><tspan x="976" dy="21">qubits and slow gate rates can erase a speedup.</tspan><tspan x="976" dy="21">A quadratic gain needs very large problems to</tspan><tspan x="976" dy="21">pay off. Claims of advantage are checked one</tspan><tspan x="976" dy="21">problem at a time.</tspan></text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Advantage classes as established in the literature; the chart is computed, not measured.</text>
  </g>
