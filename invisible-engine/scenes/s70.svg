  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 70</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Noise: why qubits forget, and what error correction costs</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Every qubit leaks. Error correction trades many noisy qubits for one reliable one.</text>
