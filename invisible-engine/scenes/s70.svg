    <text x="80" y="172" text-anchor="start" style="font-size:15.5px;font-weight:800;fill:#14213d">P(still 1) vs time — illustrative T1 = 100 µs</text>
    <text x="84" y="430" text-anchor="start" style="font-size:14px;font-weight:600;fill:#475569">0</text><text x="300" y="430" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#475569">150</text><text x="520" y="430" text-anchor="end" style="font-size:14px;font-weight:600;fill:#475569">300</text><text x="520" y="450" text-anchor="end" style="font-size:14px;font-weight:600;fill:#475569">time (µs) →</text>
    <rect x="80" y="460" width="440" height="110" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="106" cy="490" r="18" fill="#ea580c"/><text x="106" y="496" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="134" y="496" text-anchor="start" style="font-size:19px;font-weight:800;fill:#ea580c">T1: relaxation</text><text x="96" y="525" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="96" dy="0">Energy leaks to the surroundings;</tspan><tspan x="96" dy="21">a 1 slowly becomes a 0.</tspan></text>
  </g>
