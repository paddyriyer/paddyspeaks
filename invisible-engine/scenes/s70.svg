    <rect x="580" y="460" width="440" height="110" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="606" cy="490" r="18" fill="#7c3aed"/><text x="606" y="496" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="634" y="496" text-anchor="start" style="font-size:19px;font-weight:800;fill:#7c3aed">T2: dephasing</text><text x="596" y="525" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="596" dy="0">The relative phase blurs, so</tspan><tspan x="596" dy="21">interference stops working.</tspan></text>
  </g>
  <g data-f="3">
    <rect x="1080" y="190" width="460" height="40" fill="#eef2ff" stroke="#e2e8f0" stroke-width="1"/><text x="1145.0" y="215.4" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">error per gate</text><text x="1265.0" y="215.4" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">10 gates</text><text x="1375.0" y="215.4" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">100 gates</text><text x="1485.0" y="215.4" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">1,000 gates</text><rect x="1080" y="230" width="460" height="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1145.0" y="255.4" text-anchor="middle" style="font-size:15px;font-weight:500;fill:#14213d">0.01</text><text x="1265.0" y="255.4" text-anchor="middle" style="font-size:15px;font-weight:500;fill:#14213d">90 %</text><text x="1375.0" y="255.4" text-anchor="middle" style="font-size:15px;font-weight:500;fill:#14213d">37 %</text><text x="1485.0" y="255.4" text-anchor="middle" style="font-size:15px;font-weight:500;fill:#14213d">&lt;1 %</text><rect x="1080" y="270" width="460" height="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="1145.0" y="295.4" text-anchor="middle" style="font-size:15px;font-weight:500;fill:#14213d">0.001</text><text x="1265.0" y="295.4" text-anchor="middle" style="font-size:15px;font-weight:500;fill:#14213d">99 %</text><text x="1375.0" y="295.4" text-anchor="middle" style="font-size:15px;font-weight:500;fill:#14213d">90 %</text><text x="1485.0" y="295.4" text-anchor="middle" style="font-size:15px;font-weight:500;fill:#14213d">37 %</text>
    <text x="1080" y="340" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">Chance a circuit runs with no error,</text><text x="1080" y="364" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">if errors are independent (computed).</text><text x="1080" y="388" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">Readout adds its own errors.</text>
    <rect x="1080" y="460" width="460" height="110" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/><circle cx="1106" cy="490" r="18" fill="#dc2626"/><text x="1106" y="496" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="1134" y="496" text-anchor="start" style="font-size:19px;font-weight:800;fill:#dc2626">Errors add up</text><text x="1096" y="525" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1096" dy="0">Deeper circuits fail more often,</tspan><tspan x="1096" dy="21">even with good gates.</tspan></text>
  </g>
