<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 42: Three kinds of “mine”: holding it, owning the account, holding the keys</title>
  <desc>Four frames building a Venn diagram of three overlapping circles. 1, physical possession: whoever holds the tracker. 2, the linked cloud account: the account the tracker is registered to. 3, cryptographic authority: whoever holds the private keys that open location reports. 4, the overlaps: the rightful owner with a trusted device sits in all three; a finder or thief holds the tag but can read nothing; the owner far away has the account and the keys but not the tag; and a newly signed-in device has the account but receives the end-to-end keys only once it meets the trusted-device conditions.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 42</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Three kinds of “mine”: holding it, owning the account, holding the keys</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Signing in to an account is not the same as holding every secret behind it.</text>
  <g data-f="1">
    <circle cx="590" cy="390" r="205" fill="#fff7ed" fill-opacity="0.75" stroke="#ea580c" stroke-width="4"/>
    <circle cx="473" cy="335" r="34" fill="#0f172a" opacity="0.13"/><circle cx="470" cy="330" r="34" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="470" cy="330" r="21" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="530" y="250" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;font-weight:800;fill:#9a3412">POSSESSION</text>
    <rect x="60" y="170" width="330" height="150" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="86" cy="200" r="18" fill="#ea580c"/><text x="86" y="206" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="114" y="206" text-anchor="start" style="font-size:19px;font-weight:800;fill:#ea580c">Holding it</text><text x="76" y="235" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="76" dy="0">Whoever has the tag in</tspan><tspan x="76" dy="21">their hand or bag. That</tspan><tspan x="76" dy="21">alone opens nothing.</tspan></text>
  </g>
  <g data-f="2">
    <circle cx="890" cy="390" r="205" fill="#eff6ff" fill-opacity="0.75" stroke="#2563eb" stroke-width="4"/>
    <path d="M934,362 a26,26 0 0 1 3,-44 a34,34 0 0 1 65,-9 a23,23 0 0 1 5,53 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
    <text x="960" y="250" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;font-weight:800;fill:#1e40af">ACCOUNT</text>
    <rect x="1180" y="170" width="360" height="150" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="1206" cy="200" r="18" fill="#2563eb"/><text x="1206" y="206" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="1234" y="206" text-anchor="start" style="font-size:19px;font-weight:800;fill:#2563eb">The linked account</text><text x="1196" y="235" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1196" dy="0">The one account the tag is</tspan><tspan x="1196" dy="21">registered to (Scene 31).</tspan><tspan x="1196" dy="21">It decides who may ask.</tspan></text>
  </g>
  <g data-f="3">
    <circle cx="740" cy="610" r="205" fill="#f5f3ff" fill-opacity="0.75" stroke="#7c3aed" stroke-width="4"/>
    <circle cx="690" cy="730" r="16" fill="none" stroke="#7c3aed" stroke-width="6.3"/><path d="M706,730 L773,730 M755,730 L755,744 M767,730 L767,741" fill="none" stroke="#7c3aed" stroke-width="6.3" stroke-linecap="round"/>
    <text x="740" y="795" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;font-weight:800;fill:#6b21a8">KEYS</text>
    <rect x="1060" y="640" width="480" height="150" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="1086" cy="670" r="18" fill="#7c3aed"/><text x="1086" y="676" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="1114" y="676" text-anchor="start" style="font-size:19px;font-weight:800;fill:#7c3aed">The private keys</text><text x="1076" y="705" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1076" dy="0">Whoever holds them can open the sealed</tspan><tspan x="1076" dy="21">location reports. They live only on</tspan><tspan x="1076" dy="21">trusted devices (Scene 43).</tspan></text>
  </g>
  <g data-f="4">
    <text x="740" y="452" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">rightful owner,</text>
    <text x="740" y="472" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#14213d">trusted device</text>
    <text x="470" y="410" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#334155">a finder or thief:</text>
    <text x="470" y="430" text-anchor="middle" style="font-size:14px;font-weight:400;fill:#334155">holds it, reads nothing</text>
    <text x="985" y="410" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#334155">new device signed in:</text>
    <text x="985" y="430" text-anchor="middle" style="font-size:14px;font-weight:400;fill:#334155">keys only once trusted</text>
    <text x="850" y="560" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#334155">owner far away:</text>
    <text x="850" y="580" text-anchor="middle" style="font-size:14px;font-weight:400;fill:#334155">sees sightings</text>
    <rect x="60" y="560" width="400" height="230" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="86" cy="590" r="18" fill="#334155"/><text x="86" y="596" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="114" y="596" text-anchor="start" style="font-size:19px;font-weight:800;fill:#334155">The overlaps matter</text><text x="76" y="625" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="76" dy="0">Possession without keys reads</tspan><tspan x="76" dy="21">nothing. An account sign-in on a</tspan><tspan x="76" dy="21">new device is not, by itself,</tspan><tspan x="76" dy="21">access to end-to-end keys: the</tspan><tspan x="76" dy="21">device must be trusted first.</tspan></text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Conceptual. Overlap labels follow Apple’s documented Find My design.</text>
  </g>
</svg>
