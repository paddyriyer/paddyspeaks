<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 21: Weak badge, strong badge</title>
  <desc>Four frames. A static-ID badge sends the same number every time it is tapped. A copied badge, marked as a hazard, sends the identical number and the reader accepts it, because it checks only the number. A secure badge, by contrast, receives a fresh random challenge from the reader and answers with a response computed from the challenge and a secret key that never leaves its chip; replaying an old response fails because the next challenge is different. A table compares, at the level of concepts only, the risk of copying, replay and real-time relay for both badges, and what reduces relay risk.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 21</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Weak badge, strong badge</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">One badge repeats a number. The other proves, each time, that it holds a secret.</text>
  <g data-f="1">
    <rect x="60" y="150" width="720" height="420" rx="18" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/><text x="84" y="194" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Static-ID badge</text>
    <rect x="146" y="218" width="23" height="30" rx="6" fill="#94a3b8"/><rect x="114" y="246" width="96" height="139" rx="12" fill="#0f172a" opacity="0.12"/><rect x="110" y="240" width="96" height="139" rx="12" fill="#ffffff" stroke="#334155" stroke-width="3"/><rect x="110" y="240" width="96" height="28" rx="12" fill="#64748b"/><rect x="110" y="257" width="96" height="11" fill="#64748b"/><text x="158.0" y="260.88" text-anchor="middle" style="font-size:10.56px;font-weight:800;fill:#ffffff">STAFF</text><circle cx="158" cy="298" r="16" fill="#cbd5e1"/><rect x="129" y="332" width="58" height="7" rx="4" fill="#94a3b8"/><rect x="137" y="346" width="42" height="6" rx="4" fill="#cbd5e1"/>
    <rect x="604" y="241" width="99" height="153" rx="14" fill="#0f172a" opacity="0.14"/><rect x="600" y="235" width="99" height="153" rx="14" fill="#1f2937"/><circle cx="650" cy="298" r="27" fill="none" stroke="#9ca3af" stroke-width="2.7"/><path d="M637.8,293.0 q4.4,5.0 0,10.1" fill="none" stroke="#e5e7eb" stroke-width="2.25" stroke-linecap="round"/><path d="M643.5,288.6 q7.6,9.4 0,18.9" fill="none" stroke="#e5e7eb" stroke-width="2.25" stroke-linecap="round"/><path d="M649.1,284.1 q10.7,13.9 0,27.7" fill="none" stroke="#e5e7eb" stroke-width="2.25" stroke-linecap="round"/><circle cx="650" cy="361" r="7" fill="#22c55e"/>
    <path d="M214,300 L594,300" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="269" y="272" width="270" height="26" rx="6" class="lab"/>
    <text x="404" y="290" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#15803d"><tspan x="404" dy="0">ID 48213 (same every time)</tspan></text>
  </g>
  <g data-f="2">
    <rect x="92" y="408" width="140" height="146" rx="10" class="hz"/>
    <rect x="151" y="406" width="18" height="30" rx="6" fill="#94a3b8"/><rect x="126" y="434" width="76" height="110" rx="12" fill="#0f172a" opacity="0.12"/><rect x="122" y="428" width="76" height="110" rx="12" fill="#ffffff" stroke="#334155" stroke-width="3"/><rect x="122" y="428" width="76" height="22" rx="12" fill="#94a3b8"/><rect x="122" y="441" width="76" height="9" fill="#94a3b8"/><text x="160.0" y="444.53" text-anchor="middle" style="font-size:8.36px;font-weight:800;fill:#ffffff">COPY</text><circle cx="160" cy="474" r="13" fill="#cbd5e1"/><rect x="137" y="501" width="46" height="6" rx="4" fill="#94a3b8"/><rect x="143" y="512" width="33" height="4" rx="4" fill="#cbd5e1"/>
    <path d="M206,486 L520,486 L520,400 L594,400" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="269" y="458" width="202" height="26" rx="6" class="lab"/>
    <text x="370" y="476" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#15803d"><tspan x="370" dy="0">ID 48213: identical</tspan></text>
    <circle cx="660" cy="430" r="16" fill="#16a34a"/><path d="M653,430 L658,436 L668,424" fill="none" stroke="#fff" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="682" y="436" text-anchor="start" style="font-size:16px;font-weight:700;fill:#166534">accepted</text>
    <text x="250" y="540" text-anchor="start" style="font-size:17px;font-weight:700;fill:#991b1b">The reader checks only the number.</text>
  </g>
  <g data-f="3">
    <rect x="820" y="150" width="720" height="420" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><text x="844" y="194" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Challenge–response badge</text>
    <rect x="906" y="218" width="23" height="30" rx="6" fill="#94a3b8"/><rect x="874" y="246" width="96" height="139" rx="12" fill="#0f172a" opacity="0.12"/><rect x="870" y="240" width="96" height="139" rx="12" fill="#ffffff" stroke="#334155" stroke-width="3"/><rect x="870" y="240" width="96" height="28" rx="12" fill="#7c3aed"/><rect x="870" y="257" width="96" height="11" fill="#7c3aed"/><text x="918.0" y="260.88" text-anchor="middle" style="font-size:10.56px;font-weight:800;fill:#ffffff">SECURE</text><circle cx="918" cy="298" r="16" fill="#cbd5e1"/><rect x="889" y="332" width="58" height="7" rx="4" fill="#94a3b8"/><rect x="897" y="346" width="42" height="6" rx="4" fill="#cbd5e1"/>
    <path d="M906,345 L906,337 a11,11 0 0 1 22,0 L928,345" fill="none" stroke="#7c3aed" stroke-width="4.0"/><rect x="898" y="343" width="38" height="30" rx="5" fill="#7c3aed"/><circle cx="917" cy="356" r="4" fill="#ffffff"/><rect x="916" y="358" width="3" height="8" fill="#ffffff"/>
    <rect x="1364" y="241" width="99" height="153" rx="14" fill="#0f172a" opacity="0.14"/><rect x="1360" y="235" width="99" height="153" rx="14" fill="#1f2937"/><circle cx="1410" cy="298" r="27" fill="none" stroke="#9ca3af" stroke-width="2.7"/><path d="M1397.8,293.0 q4.4,5.0 0,10.1" fill="none" stroke="#e5e7eb" stroke-width="2.25" stroke-linecap="round"/><path d="M1403.5,288.6 q7.6,9.4 0,18.9" fill="none" stroke="#e5e7eb" stroke-width="2.25" stroke-linecap="round"/><path d="M1409.1,284.1 q10.7,13.9 0,27.7" fill="none" stroke="#e5e7eb" stroke-width="2.25" stroke-linecap="round"/><circle cx="1410" cy="361" r="7" fill="#22c55e"/>
    <path d="M1354,290 L974,290" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="1000" y="262" width="327" height="26" rx="6" class="lab"/>
    <text x="1164" y="280" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#15803d"><tspan x="1164" dy="0">challenge: a fresh random number</tspan></text>
    <path d="M974,360 L1354,360" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="986" y="332" width="356" height="26" rx="6" class="lab"/>
    <text x="1164" y="350" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#7e22ce"><tspan x="1164" dy="0">response = f(secret key, challenge)</tspan></text>
    <text x="860" y="470" text-anchor="start" style="font-size:17px;font-weight:700;fill:#6b21a8">The secret key never leaves the chip.</text>
    <circle cx="872" cy="518" r="14" fill="#dc2626"/><path d="M867,513 L877,523 M877,513 L867,523" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
    <text x="894" y="524" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">An old response fails: the next challenge is different.</text>
  </g>
  <g data-f="4">
    <rect x="60" y="595" width="1480" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="60" y="595" width="1480" height="44" rx="12" fill="#f1f5f9"/>
    <text x="84" y="624" text-anchor="start" style="font-size:17px;font-weight:800;fill:#14213d">Risk (concept only)</text>
    <text x="440" y="624" text-anchor="start" style="font-size:17px;font-weight:800;fill:#14213d">Static-ID badge</text>
    <text x="920" y="624" text-anchor="start" style="font-size:17px;font-weight:800;fill:#14213d">Challenge–response badge</text>
    <path d="M60,646 L1540,646" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="84" y="672" text-anchor="start" style="font-size:16.5px;font-weight:700;fill:#14213d">Copying the credential</text>
    <text x="440" y="672" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#991b1b">the number can be read and copied</text>
    <text x="920" y="672" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#166534">key not readable, if well implemented</text>
    <path d="M60,690 L1540,690" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="84" y="716" text-anchor="start" style="font-size:16.5px;font-weight:700;fill:#14213d">Replaying an old exchange</text>
    <text x="440" y="716" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#991b1b">works: same number each time</text>
    <text x="920" y="716" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#166534">fails: fresh challenge each time</text>
    <path d="M60,734 L1540,734" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="84" y="760" text-anchor="start" style="font-size:16.5px;font-weight:700;fill:#14213d">Relaying a live exchange</text>
    <text x="440" y="760" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">possible in principle</text>
    <text x="920" y="760" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155">still possible in principle</text>
    <text x="84" y="800" text-anchor="start" style="font-style:italic;font-size:15.5px;font-weight:400;fill:#475569">Relay is reduced by tight timing limits (distance bounding) or a second factor such as a PIN.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="106" y="866" class="s">Plaintext / local information</text>
    <path d="M385.4,861 L419.4,861" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="431.4" y="866" class="s">Encrypted / cryptographic</text>
    <rect x="676.4" y="852" width="34" height="18" rx="3" class="hz" style="stroke-width:3"/>
    <text x="722.4" y="866" class="s">Attacker zone / hazard</text>
    <text x="1540" y="866" class="note" text-anchor="end">Conceptual comparison. No attack detail. Badge names are generic.</text>
  </g>
</svg>
