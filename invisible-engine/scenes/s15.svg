  </g>
  <g data-f="1">
    <path d="M360,440 L318,440" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="360" y="400" width="320" height="110" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="386" cy="430" r="18" fill="#16a34a"/><text x="386" y="436" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="414" y="436" text-anchor="start" style="font-size:19px;font-weight:800;fill:#16a34a">Terminal data</text><text x="376" y="465" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155"><tspan x="376" dy="0">amount · currency · date ·</tspan><tspan x="376" dy="20">unpredictable number</tspan></text>
  </g>
  <g data-f="2">
    <rect x="60" y="400" width="250" height="190" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="86" cy="430" r="18" fill="#7c3aed"/><text x="86" y="436" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="114" y="436" text-anchor="start" style="font-size:19px;font-weight:800;fill:#7c3aed">Inside the card</text><text x="76" y="465" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="76" dy="0">terminal data</tspan><tspan x="76" dy="21">+ counter (ATC)</tspan><tspan x="76" dy="21">+ secret card key</tspan><tspan x="76" dy="21">→ cryptogram</tspan></text>
    <path d="M258,541 L258,533 a11,11 0 0 1 22,0 L280,541" fill="none" stroke="#7c3aed" stroke-width="4.0"/><rect x="250" y="539" width="38" height="30" rx="5" fill="#7c3aed"/><circle cx="269" cy="552" r="4" fill="#ffffff"/><rect x="268" y="554" width="3" height="8" fill="#ffffff"/>
  </g>
  <g data-f="3">
    <path d="M310,620 L670,620" class="a-crypto" marker-end="url(#m-crypto)"/>
    <path d="M690,620 L980,620" class="a-crypto" marker-end="url(#m-crypto)"/>
    <path d="M1000,620 L1290,620" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="536" y="580" width="529" height="26" rx="6" class="lab"/>
    <text x="800" y="598" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#7e22ce"><tspan x="800" dy="0">cryptogram + transaction data → authorisation request</tspan></text>
  </g>
  <g data-f="4">
    <rect x="1300" y="400" width="250" height="190" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="1326" cy="430" r="18" fill="#7c3aed"/><text x="1326" y="436" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="1354" y="436" text-anchor="start" style="font-size:19px;font-weight:800;fill:#7c3aed">Issuer checks</text><text x="1316" y="465" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1316" dy="0">derives the card key</tspan><tspan x="1316" dy="21">recomputes the</tspan><tspan x="1316" dy="21">cryptogram; checks</tspan><tspan x="1316" dy="21">counter, limits, risk</tspan></text>
    <path d="M1290,690 L318,690" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="555" y="654" width="490" height="26" rx="6" class="lab"/>
    <text x="800" y="672" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#15803d"><tspan x="800" dy="0">approve / decline (back via network and acquirer)</tspan></text>
  </g>
  <g data-f="5">
    <rect x="60" y="720" width="1490" height="92" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="86" cy="750" r="18" fill="#334155"/><text x="86" y="756" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="114" y="756" text-anchor="start" style="font-size:19px;font-weight:800;fill:#334155">Not a reusable password</text><text x="76" y="785" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">A copied cryptogram fails the counter and unpredictable-number checks. The merchant never learns the card key. Card and issuer share symmetric keys.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="106" y="866" class="s">Plaintext / local information</text>
    <path d="M385.4,861 L419.4,861" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="431.4" y="866" class="s">Encrypted / cryptographic</text>
    <rect x="676.4" y="852" width="34" height="18" rx="3" class="bound" style="stroke-width:4"/>
    <text x="722.4" y="866" class="s">Trust or hardware boundary</text>
    <text x="1540" y="866" class="note" text-anchor="end">Schematic; exact data elements depend on the kernel.</text>
  </g>
</svg>
