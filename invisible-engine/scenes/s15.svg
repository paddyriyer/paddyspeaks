    <rect x="680" y="160" width="250" height="210" rx="16" class="bound"/>
    <text x="805" y="322" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#14213d"><tspan x="805" dy="0">Acquirer</tspan><tspan x="805" dy="22">(merchant’s bank)</tspan></text>
    <rect x="990" y="160" width="250" height="210" rx="16" class="bound"/>
    <text x="1115" y="322" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#14213d">Payment network</text>
    <rect x="1300" y="160" width="250" height="210" rx="16" class="bound"/>
    <text x="1425" y="322" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#14213d"><tspan x="1425" dy="0">Issuer</tspan><tspan x="1425" dy="22">(card’s bank)</tspan></text>
    <rect x="99" y="196" width="180" height="113" rx="9" fill="#0f172a" opacity="0.12"/><rect x="95" y="190" width="180" height="113" rx="9" fill="#1e3a8a"/><path d="M95,260 Q185,241 275,269 L275,294 Q275,303 266,303 L104,303 Q95,303 95,294 Z" fill="#1d4ed8" opacity="0.55"/><path d="M239.0,225.3 q4.8,5.5 0,11.1" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M245.2,220.4 q8.3,10.4 0,20.8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M251.5,215.6 q11.8,15.2 0,30.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><rect x="113.0" y="227.422" width="27.0" height="27.216" rx="4" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M126.5,227.422 L126.5,254.638 M113.0,236.494 L123.26,236.494 M129.74,236.494 L140.0,236.494 M113.0,245.566 L123.26,245.566 M129.74,245.566 L140.0,245.566" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="123.26" y="233.40952" width="6.4799999999999995" height="15.240960000000001" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/><text x="264.2" y="212.68" text-anchor="end" style="font-size:12.600000000000001px;font-weight:800;fill:#e0e7ff">BANK</text><text x="113.0" y="285.256" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11.700000000000001px;font-weight:600;fill:#ffffff">•••• 1234</text>
