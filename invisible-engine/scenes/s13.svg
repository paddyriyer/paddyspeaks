    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 13</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">How the reader talks — and how the card answers without a transmitter</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">The reader dips its field; the card changes how much energy it absorbs.</text>
  <g>
    <rect x="66" y="218" width="161" height="260" rx="19" fill="#0f172a" opacity="0.15"/><rect x="60" y="210" width="161" height="260" rx="19" fill="#1f2937"/><rect x="64" y="214" width="154" height="253" rx="16" fill="#374151"/><rect x="75" y="226" width="131" height="93" rx="7" fill="#e0f2fe" stroke="#0f172a" stroke-width="1.9"/><path d="M131.9,253.9 q5.0,5.7 0,11.4" fill="none" stroke="#0c4a6e" stroke-width="1.984" stroke-linecap="round"/><path d="M138.3,248.9 q8.6,10.7 0,21.4" fill="none" stroke="#0c4a6e" stroke-width="1.984" stroke-linecap="round"/><path d="M144.8,243.9 q12.1,15.7 0,31.4" fill="none" stroke="#0c4a6e" stroke-width="1.984" stroke-linecap="round"/><text x="140.6" y="303.0" text-anchor="middle" style="font-size:13.64px;font-weight:800;fill:#0c4a6e">Tap to pay</text><rect x="85" y="337" width="32" height="20" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.9"/><rect x="124" y="337" width="32" height="20" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.9"/><rect x="164" y="337" width="32" height="20" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.9"/><rect x="85" y="366" width="32" height="20" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.9"/><rect x="124" y="366" width="32" height="20" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.9"/><rect x="164" y="366" width="32" height="20" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.9"/><rect x="85" y="394" width="32" height="20" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.9"/><rect x="124" y="394" width="32" height="20" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.9"/><rect x="164" y="394" width="32" height="20" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.9"/><rect x="85" y="423" width="32" height="20" rx="4" fill="#ef4444" stroke="#111827" stroke-width="0.9"/><rect x="124" y="423" width="32" height="20" rx="4" fill="#facc15" stroke="#111827" stroke-width="0.9"/><rect x="164" y="423" width="32" height="20" rx="4" fill="#22c55e" stroke="#111827" stroke-width="0.9"/>
    <rect x="1274" y="276" width="270" height="170" rx="14" fill="#0f172a" opacity="0.12"/><rect x="1270" y="270" width="270" height="170" rx="14" fill="#1e3a8a"/><path d="M1270,375 Q1405,347 1540,389 L1540,427 Q1540,440 1526,440 L1284,440 Q1270,440 1270,427 Z" fill="#1d4ed8" opacity="0.55"/><path d="M1486.0,322.9 q7.3,8.3 0,16.6" fill="none" stroke="#ffffff" stroke-width="2.4545454545454546" stroke-linecap="round"/><path d="M1495.3,315.7 q12.5,15.6 0,31.2" fill="none" stroke="#ffffff" stroke-width="2.4545454545454546" stroke-linecap="round"/><path d="M1504.7,308.4 q17.7,22.8 0,45.7" fill="none" stroke="#ffffff" stroke-width="2.4545454545454546" stroke-linecap="round"/><rect x="1297.0" y="326.133" width="40.5" height="40.824" rx="7" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M1317.25,326.133 L1317.25,366.957 M1297.0,339.741 L1312.39,339.741 M1322.11,339.741 L1337.5,339.741 M1297.0,353.349 L1312.39,353.349 M1322.11,353.349 L1337.5,353.349" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="1312.39" y="335.11428" width="9.719999999999999" height="22.86144" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/><text x="1523.8" y="304.02" text-anchor="end" style="font-size:18.900000000000002px;font-weight:800;fill:#e0e7ff">BANK</text><text x="1297.0" y="412.884" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17.55px;font-weight:600;fill:#ffffff">•••• 1234</text>
    <text x="140" y="500" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#334155">reader</text>
  </g>
  <g data-f="1">
    <rect x="260" y="160" width="980" height="190" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="302" cy="204" r="26" fill="#2563eb"/><text x="302" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="342" y="214" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Reader → card: dips in the field</text>
    <path d="M300,280 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 l32,0 l32,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 l32,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <text x="300" y="330" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">Type A: field paused (100 % ASK), modified Miller · Type B: ~10 % ASK, NRZ · base rate 106 kbit/s</text>
    <path d="M1160,280 L1250,340" class="a-signal" marker-end="url(#m-signal)"/>
  </g>
  <g data-f="2">
    <rect x="1270" y="470" width="270" height="120" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="1296" cy="500" r="18" fill="#16a34a"/><text x="1296" y="506" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="1324" y="506" text-anchor="start" style="font-size:19px;font-weight:800;fill:#16a34a">Demodulator</text><text x="1286" y="535" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155"><tspan x="1286" dy="0">turns dips into</tspan><tspan x="1286" dy="20">command bits</tspan></text>
    <path d="M1405,600 L1405,650" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="1405" y="676" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#166534">processor replies</text>
  </g>
  <g data-f="3">
    <rect x="260" y="380" width="980" height="190" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="302" cy="424" r="26" fill="#ea580c"/><text x="302" y="433" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="342" y="434" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Card → reader: load modulation</text>
    <rect x="300" y="460" width="180" height="80" rx="10" fill="#ffffff" stroke="#9a3412" stroke-width="2"/><rect x="560" y="460" width="180" height="80" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/><path d="M480,500 L560,500" class="wire"/>
    <text x="390" y="497" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#14213d">coil + chip</text>
    <text x="390" y="522" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#475569">draws energy</text>
    <text x="650" y="497" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#14213d">extra load</text>
    <text x="650" y="522" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#475569">switched on/off</text>
    <text x="770" y="480" text-anchor="start" style="font-size:17px;font-weight:600;fill:#9a3412">Switching at 847.5 kHz (13.56 MHz ÷ 16)</text>
    <text x="770" y="506" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">changes how much energy the card absorbs.</text>
    <text x="770" y="540" text-anchor="start" style="font-size:16px;font-weight:800;fill:#14213d">The card never makes its own carrier wave.</text>
  </g>
  <g data-f="4">
    <rect x="260" y="600" width="980" height="210" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="302" cy="644" r="26" fill="#2563eb"/><text x="302" y="653" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text><text x="342" y="654" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Reader sees the change: sidebands</text>
    <line x1="420" y1="780" x2="1180" y2="780" stroke="#334155" stroke-width="2"/><line x1="800" y1="780" x2="800" y2="664" stroke="#1d4ed8" stroke-width="9"/><line x1="620" y1="780" x2="620" y2="746" stroke="#1d4ed8" stroke-width="6"/><line x1="980" y1="780" x2="980" y2="746" stroke="#1d4ed8" stroke-width="6"/>
    <text x="820" y="680" text-anchor="start" style="font-size:15px;font-weight:600;fill:#1e3a8a">carrier 13.56 MHz</text>
    <text x="620" y="736" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#1e3a8a">−847.5 kHz</text>
    <text x="980" y="736" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#1e3a8a">+847.5 kHz</text>
    <text x="1190" y="802" text-anchor="end" style="font-style:italic;font-size:14px;font-weight:400;fill:#475569">heights not to scale</text>
    <path d="M1270,560 L1150,700" class="a-signal" marker-end="url(#m-signal)"/>
  </g>
