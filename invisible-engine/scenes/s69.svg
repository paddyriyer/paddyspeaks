<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 69: What a quantum computer physically is</title>
  <desc>Five frames. 1, a dilution refrigerator drawn as its gold “chandelier” of stacked plates, from room temperature down to about 10–20 millikelvin at the bottom, where the chip sits. 2, a superconducting qubit: an aluminium loop interrupted by a Josephson junction, controlled by microwave pulses of a few gigahertz and read out through a resonator. 3, trapped ions: a row of charged atoms held by electric fields in a vacuum, controlled and read with lasers. 4, other approaches: neutral atoms held in beams of laser light, and photons in optical chips. 5, what is not inside: no water, no visible waves, no tiny whirlpools — “waves” in this lesson are mathematics about amplitudes.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 69</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">What a quantum computer physically is</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Cold metal circuits, or atoms held by light — not ripples in a tank.</text>
  <g data-f="1">
    <rect x="65" y="175" width="314" height="15" rx="5" fill="#d4a017" stroke="#92400e" stroke-width="2"/><text x="392.25" y="188.3" text-anchor="start" style="font-size:14.5px;font-weight:600;fill:#334155">room temperature</text><path d="M131,190 L131,249" stroke="#b7791f" stroke-width="3.8"/><path d="M222,190 L222,249" stroke="#b7791f" stroke-width="3.8"/><path d="M312,190 L312,249" stroke="#b7791f" stroke-width="3.8"/><rect x="77" y="249" width="289" height="15" rx="5" fill="#d4a017" stroke="#92400e" stroke-width="2"/><text x="379.9" y="262.4" text-anchor="start" style="font-size:14.5px;font-weight:600;fill:#334155">~50 K</text><path d="M138,264 L138,323" stroke="#b7791f" stroke-width="3.8"/><path d="M222,264 L222,323" stroke="#b7791f" stroke-width="3.8"/><path d="M305,264 L305,323" stroke="#b7791f" stroke-width="3.8"/><rect x="89" y="323" width="264" height="15" rx="5" fill="#d4a017" stroke="#92400e" stroke-width="2"/><text x="367.54999999999995" y="336.5" text-anchor="start" style="font-size:14.5px;font-weight:600;fill:#334155">~4 K</text><path d="M145,338 L145,397" stroke="#b7791f" stroke-width="3.8"/><path d="M222,338 L222,397" stroke="#b7791f" stroke-width="3.8"/><path d="M298,338 L298,397" stroke="#b7791f" stroke-width="3.8"/><rect x="102" y="397" width="239" height="15" rx="5" fill="#d4a017" stroke="#92400e" stroke-width="2"/><text x="355.2" y="410.59999999999997" text-anchor="start" style="font-size:14.5px;font-weight:600;fill:#334155">~1 K</text><path d="M153,412 L153,471" stroke="#b7791f" stroke-width="3.8"/><path d="M222,412 L222,471" stroke="#b7791f" stroke-width="3.8"/><path d="M290,412 L290,471" stroke="#b7791f" stroke-width="3.8"/><rect x="114" y="471" width="215" height="15" rx="5" fill="#d4a017" stroke="#92400e" stroke-width="2"/><text x="342.85" y="484.7" text-anchor="start" style="font-size:14.5px;font-weight:600;fill:#334155">~100 mK</text><path d="M160,487 L160,546" stroke="#b7791f" stroke-width="3.8"/><path d="M222,487 L222,546" stroke="#b7791f" stroke-width="3.8"/><path d="M283,487 L283,546" stroke="#b7791f" stroke-width="3.8"/><rect x="126" y="546" width="190" height="15" rx="5" fill="#d4a017" stroke="#92400e" stroke-width="2"/><text x="330.5" y="558.8" text-anchor="start" style="font-size:14.5px;font-weight:600;fill:#334155">~10–20 mK</text><rect x="193" y="574" width="57" height="28" rx="4" fill="#334155"/>
    <text x="220" y="812" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#334155">Dilution refrigerator (schematic)</text>
  </g>
  <g data-f="2">
    <rect x="560" y="190" width="300" height="220" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="3"/><rect x="630" y="240" width="160" height="120" rx="18" fill="none" stroke="#94a3b8" stroke-width="12"/><rect x="700" y="232" width="20" height="16" fill="#e2e8f0"/><rect x="707" y="232" width="6" height="16" fill="#7c3aed"/>
    <text x="722" y="226" text-anchor="start" style="font-size:13.5px;font-weight:700;fill:#6d28d9">Josephson junction</text>
    <path d="M560,330 q20,-30 40,0 t40,0 t40,0" fill="none" stroke="#c2410c" stroke-width="3"/>
    <text x="560" y="436" text-anchor="start" style="font-size:15px;font-weight:600;fill:#9a3412">microwave pulses (a few GHz) steer the qubit</text>
    <rect x="910" y="250" width="630" height="160" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="936" cy="280" r="18" fill="#7c3aed"/><text x="936" y="286" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="964" y="286" text-anchor="start" style="font-size:19px;font-weight:800;fill:#7c3aed">Superconducting circuits</text><text x="926" y="315" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="926" dy="0">Aluminium loops lose all resistance when very cold.</tspan><tspan x="926" dy="21">The junction makes the energy levels uneven, so the</tspan><tspan x="926" dy="21">lowest two act as 0 and 1. A resonator reads it out.</tspan></text>
  </g>
  <g data-f="3">
    <rect x="560" y="470" width="560" height="34" rx="6" fill="#94a3b8"/><rect x="560" y="626" width="560" height="34" rx="6" fill="#94a3b8"/><circle cx="680" cy="565" r="15" fill="#0ea5e9" stroke="#075985" stroke-width="2"/><circle cx="760" cy="565" r="15" fill="#0ea5e9" stroke="#075985" stroke-width="2"/><circle cx="840" cy="565" r="15" fill="#0ea5e9" stroke="#075985" stroke-width="2"/><circle cx="920" cy="565" r="15" fill="#0ea5e9" stroke="#075985" stroke-width="2"/><circle cx="1000" cy="565" r="15" fill="#0ea5e9" stroke="#075985" stroke-width="2"/>
    <path d="M650,512 L680,565" stroke="#ef4444" stroke-width="2.5" opacity="0.85"/>
    <path d="M730,512 L760,565" stroke="#ef4444" stroke-width="2.5" opacity="0.85"/>
    <path d="M810,512 L840,565" stroke="#ef4444" stroke-width="2.5" opacity="0.85"/>
    <path d="M890,512 L920,565" stroke="#ef4444" stroke-width="2.5" opacity="0.85"/>
    <path d="M970,512 L1000,565" stroke="#ef4444" stroke-width="2.5" opacity="0.85"/>
    <text x="840" y="690" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#334155">electrodes hold a row of ions; lasers set and read each one</text>
    <rect x="1150" y="440" width="390" height="190" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="1176" cy="470" r="18" fill="#0d9488"/><text x="1176" y="476" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="1204" y="476" text-anchor="start" style="font-size:19px;font-weight:800;fill:#0d9488">Trapped ions</text><text x="1166" y="505" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1166" dy="0">Charged atoms in a vacuum,</tspan><tspan x="1166" dy="21">held by electric fields. Two</tspan><tspan x="1166" dy="21">atomic energy levels are 0 and 1;</tspan><tspan x="1166" dy="21">lasers control and read them.</tspan></text>
  </g>
  <g data-f="4">
    <rect x="560" y="720" width="980" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="586" cy="750" r="18" fill="#334155"/><text x="586" y="756" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="614" y="756" text-anchor="start" style="font-size:19px;font-weight:800;fill:#334155">Other approaches</text><text x="576" y="785" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">Neutral atoms held in tightly focused laser beams (“tweezers”); photons travelling through optical chips.</text>
  </g>
  <g data-f="5">
    <rect x="910" y="160" width="630" height="80" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/><circle cx="936" cy="190" r="18" fill="#dc2626"/><text x="936" y="196" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="964" y="196" text-anchor="start" style="font-size:18px;font-weight:800;fill:#dc2626">Not inside: water, waves or whirlpools</text><text x="926" y="224" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">“Waves” in this lesson are amplitudes — mathematics.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Schematic, not to scale. Temperatures are typical stages, not one machine’s specification.</text>
  </g>
</svg>
