    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 50</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Where the system can fail people</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Encryption keeps a report secret. It does not decide who agreed to be located.</text>
  <g data-f="1">
    <circle cx="150" cy="198" r="23" fill="#64748b"/><path d="M118,308 L118,251 Q118,228 140,228 L160,228 Q182,228 182,251 L182,308 Z" fill="#64748b"/><rect x="125" y="300" width="19" height="84" rx="8" fill="#64748b"/><rect x="156" y="300" width="19" height="84" rx="8" fill="#64748b"/>
    <circle cx="225" cy="317" r="24" fill="#0f172a" opacity="0.13"/><circle cx="222" cy="312" r="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="222" cy="312" r="15" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="150" y="420" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">person with a bag</text>
    <path d="M252,312 L392,312" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="283" y="262" width="78" height="26" rx="6" class="lab"/>
    <text x="322" y="280" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#1d4ed8"><tspan x="322" dy="0">advert</tspan></text>
    <rect x="405" y="207" width="110" height="210" rx="19" fill="#0f172a" opacity="0.14"/><rect x="400" y="200" width="110" height="210" rx="19" fill="#111827"/><rect x="407" y="207" width="97" height="197" rx="15" fill="#f1f5f9"/><rect x="440" y="211" width="31" height="8" rx="4" fill="#111827"/>
    <text x="455" y="432" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">passer-by’s phone</text>
    <path d="M520,312 L652,312" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="547" y="262" width="78" height="26" rx="6" class="lab"/>
    <text x="586" y="280" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#7e22ce"><tspan x="586" dy="0">sealed</tspan></text>
    <path d="M717,358 a50,50 0 0 1 5,-85 a65,65 0 0 1 125,-16 a45,45 0 0 1 10,102 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/><text x="787.0" y="327.25" text-anchor="middle" style="font-size:18.75px;font-weight:700;fill:#14213d">relay service</text>
    <path d="M922,312 L1052,312" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="948" y="262" width="78" height="26" rx="6" class="lab"/>
    <text x="987" y="280" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#7e22ce"><tspan x="987" dy="0">report</tspan></text>
    <rect x="1067" y="207" width="110" height="210" rx="19" fill="#0f172a" opacity="0.14"/><rect x="1062" y="200" width="110" height="210" rx="19" fill="#111827"/><rect x="1069" y="207" width="97" height="197" rx="15" fill="#f1f5f9"/><rect x="1102" y="211" width="31" height="8" rx="4" fill="#111827"/>
    <path d="M1103,296 L1103,286 a14,14 0 0 1 28,0 L1131,296" fill="none" stroke="#7c3aed" stroke-width="5.0"/><rect x="1093" y="294" width="48" height="38" rx="6" fill="#7c3aed"/><circle cx="1117" cy="310" r="5" fill="#ffffff"/><rect x="1115" y="312" width="4" height="10" fill="#ffffff"/>
    <text x="1117" y="432" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">owner’s phone (keys)</text>
    <rect x="1220" y="180" width="320" height="200" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="1246" cy="210" r="18" fill="#2563eb"/><text x="1246" y="216" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="1274" y="216" text-anchor="start" style="font-size:19px;font-weight:800;fill:#2563eb">The system</text><text x="1236" y="245" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="1236" dy="0">A tag whispers. A passer-by’s</tspan><tspan x="1236" dy="21">phone seals a report. A relay</tspan><tspan x="1236" dy="21">stores it. Only the owner’s</tspan><tspan x="1236" dy="21">devices can open it.</tspan></text>
  </g>
  <g data-f="2">
    <rect x="60" y="462" width="470" height="212" rx="14" class="hz"/>
    <circle cx="94" cy="496" r="18" fill="#dc2626"/><text x="94" y="502" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="122" y="503" text-anchor="start" style="font-size:19px;font-weight:800;fill:#b91c1c">Around the tag and the radio</text>
    <text x="84" y="540" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">• Radio observation: anyone can listen</text><text x="84" y="566" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">• Correlation across time and place</text><text x="84" y="592" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">• A tag hidden in someone’s things</text><text x="84" y="618" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">• Firmware or supply-chain tampering</text>
    <path d="M240,462 L222,340" stroke="#fca5a5" stroke-width="2.5" stroke-dasharray="6 5"/>
  </g>
  <g data-f="3">
    <rect x="565" y="462" width="470" height="212" rx="14" class="hz"/>
    <circle cx="599" cy="496" r="18" fill="#dc2626"/><text x="599" y="502" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="627" y="503" text-anchor="start" style="font-size:19px;font-weight:800;fill:#b91c1c">Around the reports and the service</text>
    <text x="589" y="540" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">• Spoofed sightings: invented reports</text><text x="589" y="566" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">• Report integrity: altered or replayed</text><text x="589" y="592" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">• The relay itself as a target</text><text x="589" y="618" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">• Metadata: when, how often, from where</text>
    <path d="M790,462 L790,364" stroke="#fca5a5" stroke-width="2.5" stroke-dasharray="6 5"/>
  </g>
  <g data-f="4">
    <rect x="1070" y="462" width="470" height="212" rx="14" class="hz"/>
    <circle cx="1104" cy="496" r="18" fill="#dc2626"/><text x="1104" y="502" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="1132" y="503" text-anchor="start" style="font-size:19px;font-weight:800;fill:#b91c1c">Around accounts and people</text>
    <text x="1094" y="540" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">• Account takeover: every report readable</text><text x="1094" y="566" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">• Shared or coerced access</text><text x="1094" y="592" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">• Stale shares after a relationship ends</text><text x="1094" y="618" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">• The person carrying a tag they never chose</text>
    <path d="M1300,462 L1182,360" stroke="#fca5a5" stroke-width="2.5" stroke-dasharray="6 5"/>
  </g>
  <g data-f="5">
    <rect x="60" y="692" width="355" height="124" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="78" y="726" text-anchor="start" style="font-size:20px;font-weight:800;fill:#7c3aed">Confidentiality</text><text x="78" y="758" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">Who can read it?</text><text x="78" y="782" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">Encryption’s job.</text>
    <rect x="435" y="692" width="355" height="124" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="453" y="726" text-anchor="start" style="font-size:20px;font-weight:800;fill:#2563eb">Integrity</text><text x="453" y="758" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">Was it changed</text><text x="453" y="782" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">on the way?</text>
    <rect x="810" y="692" width="355" height="124" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <text x="828" y="726" text-anchor="start" style="font-size:20px;font-weight:800;fill:#0d9488">Authenticity</text><text x="828" y="758" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">Did it really come</text><text x="828" y="782" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">from a tag and a finder?</text>
    <rect x="1185" y="692" width="355" height="124" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="1203" y="726" text-anchor="start" style="font-size:20px;font-weight:800;fill:#dc2626">Consent</text><text x="1203" y="758" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">Did the person located</text><text x="1203" y="782" text-anchor="start" style="font-size:15.5px;font-weight:400;fill:#334155">agree? No cipher answers this.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="106" y="866" class="s">Radio signal or wave</text>
    <path d="M308.0,861 L342.0,861" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="354.0" y="866" class="s">Encrypted / cryptographic</text>
    <rect x="599.0" y="852" width="34" height="18" rx="3" class="hz" style="stroke-width:3"/>
    <text x="645.0" y="866" class="s">Attacker zone / hazard</text>
    <text x="1540" y="866" class="note" text-anchor="end">Schematic. Threats named, not explained step by step.</text>
  </g>
</svg>
