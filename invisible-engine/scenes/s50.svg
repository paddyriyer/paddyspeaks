<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 50: Where the system can fail people</title>
  <desc>Five frames. 1, the whole system: a person carries a bag with a small tracker; the tag’s radio advertisement reaches a passer-by’s phone; the phone sends a sealed report to a relay service; the relay passes it to the owner’s phone, which holds the keys. 2, threats around the tag and the radio: anyone can listen to the radio, sightings can be correlated across time and place, a tag can be hidden in someone’s things, and firmware or the supply chain can be tampered with. 3, threats around the reports and the service: spoofed sightings, altered or replayed reports, the relay itself as a target, and metadata. 4, threats around accounts and people: account takeover, shared or coerced access, stale shares, and the person carrying a tag they never chose. 5, four separate questions: confidentiality, integrity, authenticity and consent; encryption answers the first, and no cipher answers the last.</desc>
  <style>
