<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 80: Two lenses: security threats and privacy threats</title>
  <desc>Four frames. 1, the STRIDE security lens: spoofing, tampering, repudiation, information disclosure, denial of service, elevation of privilege. 2, the LINDDUN privacy lens: linking, identifying, non-repudiation, detecting, data disclosure, unawareness, non-compliance. 3 and 4, a table that applies both lenses to five attack surfaces, each with an honest evidence label rather than a score: item tags (spoofed broadcasts or sightings, firmware tampering and radio jamming; linking sightings by time and route, and a hidden tag identifying a person who is unaware; research and documented); the finder network and relay (invented or replayed reports, upload metadata; linking across uploads, and data disclosure limited by end-to-end encryption; research and documented design); accounts (takeover by phishing, stale or coerced shares; the account identifies the owner, and sharing without consent; documented); NFC and RFID badges (copied static-ID badges and entry with them; door logs linking movements, and detecting who is in a room; documented, long-standing); payment terminals (altered terminals and skimmers, relay; a static card number linking payments and identifying the cardholder; documented and research).</desc>
