<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 76: Hybrid key exchange: two locks on one door</title>
  <desc>Five frames. 1, today a client and a server agree a key with classical elliptic-curve Diffie–Hellman (X25519). 2, a hybrid adds a post-quantum key encapsulation (ML-KEM-768) alongside it in the same handshake. 3, a combiner feeds both shared secrets, with the handshake transcript, into one key-derivation function, so the session key stays secret if either part holds. 4, downgrade prevention: an attacker in the middle who strips the post-quantum part is caught, because both sides check a hash of everything that was offered. 5, rollout states: classical only, then hybrid, then post-quantum only once confidence allows. Reviewed designs such as TLS’s X25519MLKEM768, not an improvised protocol.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 76</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Hybrid key exchange: two locks on one door</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">The session stays secret if either lock holds. Use reviewed designs, never a home-made one.</text>
  <g>
    <rect x="85" y="207" width="130" height="260" rx="22" fill="#0f172a" opacity="0.14"/><rect x="80" y="200" width="130" height="260" rx="22" fill="#111827"/><rect x="88" y="208" width="114" height="244" rx="17" fill="#e0f2fe"/><rect x="127" y="213" width="36" height="9" rx="5" fill="#111827"/><text x="145" y="500" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#334155">client</text>
    <rect x="1380" y="230" width="120" height="42" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="1398" cy="251" r="5" fill="#22c55e"/><rect x="1420" y="246" width="64" height="10" rx="3" fill="#94a3b8"/><rect x="1380" y="280" width="120" height="42" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="1398" cy="301" r="5" fill="#22c55e"/><rect x="1420" y="296" width="64" height="10" rx="3" fill="#94a3b8"/><rect x="1380" y="330" width="120" height="42" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="1398" cy="351" r="5" fill="#22c55e"/><rect x="1420" y="346" width="64" height="10" rx="3" fill="#94a3b8"/><text x="1440.0" y="402.0" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#334155">server</text>
  </g>
  <g data-f="1">
    <path d="M230,260 L1360,260" class="a-crypto" marker-end="url(#m-crypto)" marker-start="url(#ms-crypto)"/>
    <rect x="699" y="230" width="193" height="26" rx="6" class="lab"/>
    <text x="795" y="248" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#7e22ce"><tspan x="795" dy="0">X25519 (classical)</tspan></text>
    <text x="795" y="300" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#6d28d9">shared secret 1</text>
  </g>
  <g data-f="2">
    <path d="M230,360 L1360,360" class="a-crypto" marker-end="url(#m-crypto)" marker-start="url(#ms-crypto)"/>
    <rect x="665" y="330" width="260" height="26" rx="6" class="lab"/>
    <text x="795" y="348" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#7e22ce"><tspan x="795" dy="0">ML-KEM-768 (post-quantum)</tspan></text>
    <text x="795" y="400" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#6d28d9">shared secret 2</text>
  </g>
  <g data-f="3">
    <rect x="545" y="430" width="500" height="120" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="575" cy="462" r="18" fill="#7c3aed"/><text x="575" y="468" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="605" y="470" text-anchor="start" style="font-size:20px;font-weight:800;fill:#6d28d9">Combiner</text>
    <text x="795" y="506" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;font-weight:700;fill:#14213d">KDF(secret 1 ‖ secret 2 ‖ transcript)</text>
    <text x="795" y="534" text-anchor="middle" style="font-size:15px;font-weight:500;fill:#334155">→ one session key: secret if either part holds</text>
  </g>
  <g data-f="4">
    <rect x="70" y="580" width="700" height="220" rx="14" class="hz"/>
    <circle cx="100" cy="612" r="18" fill="#dc2626"/><text x="100" y="618" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="130" y="620" text-anchor="start" style="font-size:20px;font-weight:800;fill:#b91c1c">Downgrade prevention</text>
    <text x="100" y="660" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">An attacker in the middle removes the post-quantum</text><text x="100" y="686" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">offer, hoping both sides fall back to classical only.</text><text x="100" y="712" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">Both sides hash the whole transcript of what was</text><text x="100" y="738" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155">offered; the mismatch ends the handshake.</text>
  </g>
  <g data-f="5">
    <rect x="800" y="580" width="740" height="220" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <circle cx="830" cy="612" r="18" fill="#16a34a"/><text x="830" y="618" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="860" y="620" text-anchor="start" style="font-size:20px;font-weight:800;fill:#166534">Rollout states</text>
    <rect x="830" y="650" width="200" height="54" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/><text x="930" y="684" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#14213d">classical only</text>
    <path d="M1034,677 L1058,677" stroke="#334155" stroke-width="3"/><path d="M1058,669 L1066,677 L1058,685 Z" fill="#334155"/>
    <rect x="1065" y="650" width="200" height="54" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="1165" y="684" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#14213d">hybrid</text>
    <path d="M1269,677 L1293,677" stroke="#334155" stroke-width="3"/><path d="M1293,669 L1301,677 L1293,685 Z" fill="#334155"/>
    <rect x="1300" y="650" width="200" height="54" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="1400" y="684" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#14213d">post-quantum only</text>
    <text x="830" y="742" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">Move on only when the newer state is measured and trusted.</text><text x="830" y="766" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">Use reviewed designs (e.g. TLS X25519MLKEM768), not a home-made one.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="106" y="866" class="s">Encrypted / cryptographic</text>
    <rect x="351.0" y="852" width="34" height="18" rx="3" class="hz" style="stroke-width:3"/>
    <text x="397.0" y="866" class="s">Attacker zone / hazard</text>
    <text x="1540" y="866" class="note" text-anchor="end">Conceptual. The combiner shown is the pattern, not a protocol specification.</text>
  </g>
</svg>
