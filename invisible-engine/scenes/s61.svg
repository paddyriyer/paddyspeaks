<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 61: The Hadamard gate: even odds, not half a particle</title>
  <desc>Five frames. 1, the state ket 0, amplitudes 1 and 0, goes through an H gate and comes out with amplitudes plus 0.707 and plus 0.707, probabilities 0.50 and 0.50. 2, ket 1 goes through H and comes out with plus 0.707 and minus 0.707, also 0.50 and 0.50. 3, the H matrix, one over root two times one, one, one, minus one. 4, a note that a measurement always finds a whole particle, 0 or 1; the half is a probability. 5, applying H twice returns ket 0, because the two contributions to 1 cancel: a first taste of interference.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 61</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The Hadamard gate: even odds, not half a particle</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">H turns a definite 0 into equal odds of 0 and 1, and does the same to a 1 with a sign flip.</text>
  <g data-f="1">
    <rect x="60" y="160" width="980" height="250" rx="16" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <circle cx="94" cy="194" r="20" fill="#7c3aed"/><text x="94" y="201" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">1</text><text x="124" y="202" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">start in |0⟩</text>
    <path d="M96,310 L262,310" stroke="#334155" stroke-width="2"/><rect x="110" y="240.0" width="54" height="70.0" rx="4" fill="#7c3aed"/><text x="137.0" y="231" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#7c3aed">+1.000</text><text x="221.0" y="301" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#475569">0</text>
    <text x="137.0" y="398" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">|0⟩</text><text x="221.0" y="398" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">|1⟩</text>
    <path d="M270,290 L420,290" stroke="#334155" stroke-width="3"/><rect x="420" y="255" width="90" height="70" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="465.0" y="302.0" text-anchor="middle" style="font-size:32px;font-weight:800;fill:#7c3aed">H</text><path d="M510,290 L580,290" stroke="#334155" stroke-width="3"/>
    <path d="M586,310 L752,310" stroke="#334155" stroke-width="2"/><rect x="600" y="260.5" width="54" height="49.5" rx="4" fill="#7c3aed"/><text x="627.0" y="251.50252531694167" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#7c3aed">+0.707</text><rect x="684" y="260.5" width="54" height="49.5" rx="4" fill="#7c3aed"/><text x="711.0" y="251.50252531694167" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#7c3aed">+0.707</text>
    <text x="627.0" y="398" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">|0⟩</text><text x="711.0" y="398" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">|1⟩</text>
    <text x="800" y="290" text-anchor="middle" style="font-size:26px;font-weight:700;fill:#475569">→</text>
    <path d="M836,310 L1002,310" stroke="#334155" stroke-width="2"/><rect x="850" y="275.0" width="54" height="35.0" rx="4" fill="#0d9488"/><text x="877.0" y="266.0" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#0d9488">0.50</text><rect x="934" y="275.0" width="54" height="35.0" rx="4" fill="#0d9488"/><text x="961.0" y="266.0" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#0d9488">0.50</text>
    <text x="877.0" y="398" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">P(0)</text><text x="961.0" y="398" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">P(1)</text>
  </g>
  <g data-f="2">
    <rect x="60" y="430" width="980" height="250" rx="16" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <circle cx="94" cy="464" r="20" fill="#7c3aed"/><text x="94" y="471" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">2</text><text x="124" y="472" text-anchor="start" style="font-size:18px;font-weight:800;fill:#14213d">start in |1⟩</text>
    <path d="M96,580 L262,580" stroke="#334155" stroke-width="2"/><text x="137.0" y="571" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#475569">0</text><rect x="194" y="510.0" width="54" height="70.0" rx="4" fill="#7c3aed"/><text x="221.0" y="501" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#7c3aed">+1.000</text>
    <text x="137.0" y="668" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">|0⟩</text><text x="221.0" y="668" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">|1⟩</text>
    <path d="M270,560 L420,560" stroke="#334155" stroke-width="3"/><rect x="420" y="525" width="90" height="70" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="465.0" y="572.0" text-anchor="middle" style="font-size:32px;font-weight:800;fill:#7c3aed">H</text><path d="M510,560 L580,560" stroke="#334155" stroke-width="3"/>
    <path d="M586,580 L752,580" stroke="#334155" stroke-width="2"/><rect x="600" y="530.5" width="54" height="49.5" rx="4" fill="#7c3aed"/><text x="627.0" y="521.5025253169417" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#7c3aed">+0.707</text><rect x="684" y="580.0" width="54" height="49.5" rx="4" fill="#be185d"/><text x="711.0" y="649.4974746830583" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#be185d">−0.707</text>
    <text x="627.0" y="668" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">|0⟩</text><text x="711.0" y="668" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">|1⟩</text>
    <text x="800" y="560" text-anchor="middle" style="font-size:26px;font-weight:700;fill:#475569">→</text>
    <path d="M836,580 L1002,580" stroke="#334155" stroke-width="2"/><rect x="850" y="545.0" width="54" height="35.0" rx="4" fill="#0d9488"/><text x="877.0" y="536.0" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#0d9488">0.50</text><rect x="934" y="545.0" width="54" height="35.0" rx="4" fill="#0d9488"/><text x="961.0" y="536.0" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#0d9488">0.50</text>
    <text x="877.0" y="668" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">P(0)</text><text x="961.0" y="668" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">P(1)</text>
  </g>
  <g data-f="3">
    <rect x="1080" y="160" width="460" height="250" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="1122" cy="204" r="26" fill="#334155"/><text x="1122" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="1162" y="214" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">The rule, as a matrix</text>
    <text x="1110" y="310.0" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:700;fill:#7c3aed">H = 1/√2 ·</text><path d="M1266.4,270 L1256.4,270 L1256.4,338 L1266.4,338" fill="none" stroke="#7c3aed" stroke-width="2.5"/><path d="M1372.4,270 L1382.4,270 L1382.4,338 L1372.4,338" fill="none" stroke="#7c3aed" stroke-width="2.5"/><text x="1295.4" y="292" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:700;fill:#7c3aed">1</text><text x="1353.4" y="292" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:700;fill:#7c3aed">1</text><text x="1295.4" y="328" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:700;fill:#7c3aed">1</text><text x="1353.4" y="328" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:700;fill:#7c3aed">−1</text>
    <text x="1110" y="372" text-anchor="start" style="font-size:15px;font-weight:400;fill:#475569">Ideal gates are reversible (unitary).</text>
  </g>
  <g data-f="4">
    <rect x="1080" y="430" width="460" height="250" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="1106" cy="460" r="18" fill="#b45309"/><text x="1106" y="466" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="1134" y="466" text-anchor="start" style="font-size:20px;font-weight:800;fill:#b45309">Not half a particle</text><text x="1096" y="496" text-anchor="start" style="font-size:16.5px;font-weight:400;fill:#334155"><tspan x="1096" dy="0">Every measurement finds a whole</tspan><tspan x="1096" dy="21">thing: a 0 or a 1, a whole photon or</tspan><tspan x="1096" dy="21">electron. “Half” is a probability.</tspan><tspan x="1096" dy="21">Nothing is split in two.</tspan></text>
  </g>
  <g data-f="5">
    <rect x="60" y="710" width="1480" height="100" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="94" cy="744" r="20" fill="#7c3aed"/><text x="94" y="751" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">5</text><text x="124" y="752" text-anchor="start" style="font-size:18px;font-weight:800;fill:#7c3aed">H twice gives back |0⟩</text>
    <text xml:space="preserve" x="124" y="786" text-anchor="start" style="white-space:pre;font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:15.5px;font-weight:600;fill:#334155">to 0:  0.707·0.707 + 0.707·0.707 = 1     to 1:  0.707·0.707 + 0.707·(−0.707) = 0     the paths to 1 cancel</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Ideal gates. Amplitudes to three places.</text>
  </g>
</svg>
