<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 19: Three kinds of RFID tag</title>
  <desc>Four frames. A passive tag has no battery: the reader’s signal powers it and it replies by backscatter. A battery-assisted passive tag adds a small cell that runs its chip and sensors, but still replies by backscatter, so it can answer a weaker reader signal from further away. An active tag has its own battery and its own transmitter and sends its own signal, often on a timer, to readers tens of metres or more away. A range chart compares illustrative typical ranges on a logarithmic scale from one centimetre to one hundred metres, with the trade-offs: cost, size, battery life.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 19</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Three kinds of RFID tag</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">The more of its own energy a tag carries, the further it reaches, and the more it costs.</text>
  <g data-f="1">
    <rect x="60" y="155" width="460" height="400" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="102" cy="199" r="26" fill="#2563eb"/><text x="102" y="208" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="142" y="209" text-anchor="start" style="font-size:23px;font-weight:800;fill:#14213d">Passive</text><text x="142" y="239" text-anchor="start" style="font-size:17px;font-weight:600;fill:#2563eb">No battery</text>
    <rect x="94" y="286" width="90" height="130" rx="14" fill="#0f172a" opacity="0.13"/><rect x="90" y="280" width="90" height="130" rx="14" fill="#1f2937"/><rect x="102" y="294" width="66" height="44" rx="6" fill="#e0f2fe"/><path d="M125.0,310.1 q5.2,6.0 0,12.0" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/><path d="M131.8,304.9 q9.0,11.2 0,22.5" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/><path d="M138.5,299.6 q12.8,16.5 0,33.0" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/><circle cx="135" cy="386" r="7" fill="#22c55e"/><text x="135.0" y="434" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#334155">reader</text>
    <rect x="333" y="304" width="160" height="58" rx="6" fill="#0f172a" opacity="0.10"/><rect x="330" y="300" width="160" height="58" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><path d="M400,329 L389,344 L378,314 L366,344 L355,314 L344,344 L333,314" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/><path d="M420,329 L431,344 L442,314 L454,344 L465,314 L476,344 L487,314" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/><rect x="401" y="320" width="18" height="18" rx="3" fill="#111827"/>
    <path d="M190,318 L322,318" class="a-energy" marker-end="url(#m-energy)"/>
    <path d="M322,372 L190,372" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="88" y="476" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Powered by the reader’s signal.</text>
    <text x="88" y="502" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Replies by backscatter.</text>
    <text x="88" y="528" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Cheapest and smallest; nothing to wear out.</text>
  </g>
  <g data-f="2">
    <rect x="570" y="155" width="460" height="400" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="612" cy="199" r="26" fill="#0d9488"/><text x="612" y="208" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="652" y="209" text-anchor="start" style="font-size:23px;font-weight:800;fill:#14213d">Battery-assisted passive</text><text x="652" y="239" text-anchor="start" style="font-size:17px;font-weight:600;fill:#0d9488">Battery runs the chip</text>
    <rect x="604" y="286" width="90" height="130" rx="14" fill="#0f172a" opacity="0.13"/><rect x="600" y="280" width="90" height="130" rx="14" fill="#1f2937"/><rect x="612" y="294" width="66" height="44" rx="6" fill="#e0f2fe"/><path d="M635.0,310.1 q5.2,6.0 0,12.0" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/><path d="M641.8,304.9 q9.0,11.2 0,22.5" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/><path d="M648.5,299.6 q12.8,16.5 0,33.0" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/><circle cx="645" cy="386" r="7" fill="#22c55e"/><text x="645.0" y="434" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#334155">reader</text>
    <rect x="843" y="304" width="160" height="58" rx="6" fill="#0f172a" opacity="0.10"/><rect x="840" y="300" width="160" height="58" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><path d="M910,329 L899,344 L888,314 L876,344 L865,314 L854,344 L843,314" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/><path d="M930,329 L941,344 L952,314 L964,344 L975,314 L986,344 L997,314" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/><rect x="911" y="320" width="18" height="18" rx="3" fill="#111827"/>
    <path d="M700,318 L832,318" class="a-energy" marker-end="url(#m-energy)"/>
    <path d="M832,372 L700,372" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="892" y="404" width="56" height="34" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><rect x="948" y="413" width="6" height="16" rx="2" fill="#334155"/><rect x="897" y="409" width="34" height="24" rx="3" fill="#4ade80"/>
    <text x="870" y="427" text-anchor="end" style="font-size:15px;font-weight:700;fill:#334155">cell</text>
    <path d="M920,402 L920,364" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="598" y="476" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">A cell runs the chip and sensors.</text>
    <text x="598" y="502" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Still replies by backscatter.</text>
    <text x="598" y="528" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Hears a weaker reader, further away.</text>
  </g>
  <g data-f="3">
    <rect x="1080" y="155" width="460" height="400" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="1122" cy="199" r="26" fill="#7c3aed"/><text x="1122" y="208" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="1162" y="209" text-anchor="start" style="font-size:23px;font-weight:800;fill:#14213d">Active</text><text x="1162" y="239" text-anchor="start" style="font-size:17px;font-weight:600;fill:#7c3aed">Own battery and transmitter</text>
    <rect x="1115" y="300" width="150" height="100" rx="14" fill="#334155"/><rect x="1131" y="320" width="54" height="60" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><rect x="1147" y="314" width="22" height="8" rx="2" fill="#94a3b8"/><rect x="1136" y="346" width="44" height="29" rx="4" fill="#4ade80"/><rect x="1199" y="330" width="50" height="40" rx="5" fill="#111827"/>
    <text x="1224" y="355" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#e5e7eb">TX</text>
    <path d="M1285,335 q11,15 0,31" fill="none" stroke="#1d4ed8" stroke-width="4.4" stroke-linecap="round" opacity="1.00"/><path d="M1301,321 q18,29 0,57" fill="none" stroke="#1d4ed8" stroke-width="4.4" stroke-linecap="round" opacity="0.80"/><path d="M1316,308 q24,42 0,84" fill="none" stroke="#1d4ed8" stroke-width="4.4" stroke-linecap="round" opacity="0.60"/>
    <path d="M1330,350 L1410,350" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="1424" y="286" width="90" height="130" rx="14" fill="#0f172a" opacity="0.13"/><rect x="1420" y="280" width="90" height="130" rx="14" fill="#1f2937"/><rect x="1432" y="294" width="66" height="44" rx="6" fill="#e0f2fe"/><path d="M1455.0,310.1 q5.2,6.0 0,12.0" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/><path d="M1461.8,304.9 q9.0,11.2 0,22.5" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/><path d="M1468.5,299.6 q12.8,16.5 0,33.0" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/><circle cx="1465" cy="386" r="7" fill="#22c55e"/><text x="1465.0" y="434" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#334155">reader</text>
    <text x="1108" y="476" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Sends its own signal, often on a timer.</text>
    <text x="1108" y="502" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Longest range; costs most.</text>
    <text x="1108" y="528" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Battery sets its life.</text>
  </g>
  <g data-f="4">
    <rect x="60" y="585" width="1480" height="232" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="84" y="622" text-anchor="start" style="font-size:19px;font-weight:800;fill:#14213d">Typical read range (illustrative, log scale)</text>
    <path d="M380,640 L380,780" stroke="#e2e8f0" stroke-width="2"/>
    <text x="380.0" y="803" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">1 cm</text>
    <path d="M660,640 L660,780" stroke="#e2e8f0" stroke-width="2"/>
    <text x="660.0" y="803" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">10 cm</text>
    <path d="M940,640 L940,780" stroke="#e2e8f0" stroke-width="2"/>
    <text x="940.0" y="803" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">1 m</text>
    <path d="M1220,640 L1220,780" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1220.0" y="803" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">10 m</text>
    <path d="M1500,640 L1500,780" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1500.0" y="803" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#475569">100 m</text>
    <text x="84" y="669" text-anchor="start" style="font-size:16px;font-weight:600;fill:#334155">Passive HF (13.56 MHz)</text>
    <rect x="380" y="654" width="560" height="20" rx="10" fill="#2563eb" opacity="0.85"/>
    <text x="84" y="701" text-anchor="start" style="font-size:16px;font-weight:600;fill:#334155">Passive UHF (860–960 MHz)</text>
    <rect x="660" y="686" width="560" height="20" rx="10" fill="#2563eb" opacity="0.85"/>
    <text x="84" y="733" text-anchor="start" style="font-size:16px;font-weight:600;fill:#334155">Battery-assisted passive</text>
    <rect x="856" y="718" width="498" height="20" rx="10" fill="#0d9488" opacity="0.85"/>
    <text x="84" y="765" text-anchor="start" style="font-size:16px;font-weight:600;fill:#334155">Active</text>
    <rect x="940" y="750" width="560" height="20" rx="10" fill="#7c3aed" opacity="0.85"/>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="106" y="866" class="s">Energy / power</text>
    <path d="M256.4,861 L290.4,861" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="302.4" y="866" class="s">Radio signal or wave</text>
    <text x="1540" y="866" class="note" text-anchor="end">Ranges are illustrative: reader power, antennas, regulation and surroundings change them.</text>
  </g>
</svg>
