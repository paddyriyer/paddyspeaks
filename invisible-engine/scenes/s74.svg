  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 74</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The new standard locks: three NIST algorithms</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Published August 2024. Classical algorithms, designed to resist known quantum attacks.</text>
  <g data-f="1">
    <rect x="70" y="165" width="470" height="330" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="112" cy="209" r="26" fill="#7c3aed"/><text x="112" y="218" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text>
    <text x="152" y="219" text-anchor="start" style="font-size:34px;font-weight:800;fill:#14213d">ML-KEM</text>
    <rect x="370" y="190" width="140" height="38" rx="19" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="440" y="216" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;font-weight:800;fill:#7c3aed">FIPS 203</text>
    <text x="98" y="278" text-anchor="start" style="font-size:21px;font-weight:800;fill:#7c3aed">Key establishment</text>
    <text x="98" y="318" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Two parties agree a shared secret.</text><text x="98" y="346" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Replaces ECDH / RSA key transport.</text><text x="98" y="374" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Module lattices.</text>
    <path d="M462,431 L462,419 a17,17 0 0 1 34,0 L496,431" fill="none" stroke="#7c3aed" stroke-width="6.0"/><rect x="450" y="429" width="58" height="46" rx="7" fill="#7c3aed"/><circle cx="479" cy="448" r="6" fill="#ffffff"/><rect x="476" y="450" width="5" height="12" fill="#ffffff"/>
    <text x="98" y="470" text-anchor="start" style="font-size:15px;font-weight:600;fill:#475569">Published 13 August 2024</text>
  </g>
  <g data-f="2">
    <rect x="565" y="165" width="470" height="330" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="607" cy="209" r="26" fill="#2563eb"/><text x="607" y="218" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text>
    <text x="647" y="219" text-anchor="start" style="font-size:34px;font-weight:800;fill:#14213d">ML-DSA</text>
    <rect x="865" y="190" width="140" height="38" rx="19" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="935" y="216" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;font-weight:800;fill:#2563eb">FIPS 204</text>
    <text x="593" y="278" text-anchor="start" style="font-size:21px;font-weight:800;fill:#2563eb">Signatures</text>
    <text x="593" y="318" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Proves who signed and that nothing</text><text x="593" y="346" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">changed. Replaces ECDSA / RSA</text><text x="593" y="374" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">signatures. Module lattices.</text>
    <circle cx="925" cy="430" r="20" fill="none" stroke="#2563eb" stroke-width="7.0"/><path d="M945,430 L992,430 M978,430 L978,444 M989,430 L989,441" stroke="#2563eb" stroke-width="7.0"/>
    <text x="593" y="470" text-anchor="start" style="font-size:15px;font-weight:600;fill:#475569">Published 13 August 2024</text>
  </g>
  <g data-f="3">
    <rect x="1060" y="165" width="470" height="330" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <circle cx="1102" cy="209" r="26" fill="#0d9488"/><text x="1102" y="218" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text>
    <text x="1142" y="219" text-anchor="start" style="font-size:34px;font-weight:800;fill:#14213d">SLH-DSA</text>
    <rect x="1360" y="190" width="140" height="38" rx="19" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="1430" y="216" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;font-weight:800;fill:#0d9488">FIPS 205</text>
    <text x="1088" y="278" text-anchor="start" style="font-size:21px;font-weight:800;fill:#0d9488">Signatures, hash-based</text>
    <text x="1088" y="318" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Rests only on hash functions.</text><text x="1088" y="346" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">Larger and slower: a conservative</text><text x="1088" y="374" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">alternative to ML-DSA.</text>
    <circle cx="1420" cy="430" r="20" fill="none" stroke="#0d9488" stroke-width="7.0"/><path d="M1440,430 L1487,430 M1473,430 L1473,444 M1484,430 L1484,441" stroke="#0d9488" stroke-width="7.0"/>
    <text x="1088" y="470" text-anchor="start" style="font-size:15px;font-weight:600;fill:#475569">Published 13 August 2024</text>
  </g>
  <g data-f="4">
    <rect x="70" y="520" width="700" height="150" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="96" cy="550" r="18" fill="#b45309"/><text x="96" y="556" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="124" y="556" text-anchor="start" style="font-size:19px;font-weight:800;fill:#b45309">In progress — check NIST’s current pages</text><text x="86" y="585" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="86" dy="0">FN-DSA (Falcon): draft FIPS 206, a compact lattice signature.</tspan><tspan x="86" dy="21">HQC: selected March 2025 as a backup key-encapsulation</tspan><tspan x="86" dy="21">mechanism built on different mathematics (codes).</tspan></text>
  </g>
  <g data-f="5">
    <rect x="800" y="520" width="740" height="150" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="826" cy="550" r="18" fill="#16a34a"/><text x="826" y="556" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="854" y="556" text-anchor="start" style="font-size:19px;font-weight:800;fill:#16a34a">They run on ordinary chips</text><text x="816" y="585" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="816" dy="0">Post-quantum cryptography is classical software and</tspan><tspan x="816" dy="21">hardware: phones, servers, smart cards. It is designed to</tspan><tspan x="816" dy="21">resist known quantum attacks — not run on quantum computers.</tspan></text>
    <rect x="1185" y="697" width="60" height="120" rx="10" fill="#0f172a" opacity="0.14"/><rect x="1180" y="690" width="60" height="120" rx="10" fill="#111827"/><rect x="1184" y="694" width="53" height="113" rx="8" fill="#e0f2fe"/><rect x="1202" y="696" width="17" height="4" rx="2" fill="#111827"/><rect x="1270" y="690" width="96" height="34" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="1284" cy="707" r="4" fill="#22c55e"/><rect x="1302" y="703" width="51" height="8" rx="3" fill="#94a3b8"/><rect x="1270" y="730" width="96" height="34" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="1284" cy="747" r="4" fill="#22c55e"/><rect x="1302" y="743" width="51" height="8" rx="3" fill="#94a3b8"/><rect x="1270" y="770" width="96" height="34" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="1284" cy="787" r="4" fill="#22c55e"/><rect x="1302" y="783" width="51" height="8" rx="3" fill="#94a3b8"/><rect x="1390" y="700" width="130" height="85" rx="10" fill="#1f2937"/><rect x="1401" y="694" width="6" height="6" fill="#9ca3af"/><rect x="1401" y="785" width="6" height="6" fill="#9ca3af"/><rect x="1418" y="694" width="6" height="6" fill="#9ca3af"/><rect x="1418" y="785" width="6" height="6" fill="#9ca3af"/><rect x="1435" y="694" width="6" height="6" fill="#9ca3af"/><rect x="1435" y="785" width="6" height="6" fill="#9ca3af"/><rect x="1452" y="694" width="6" height="6" fill="#9ca3af"/><rect x="1452" y="785" width="6" height="6" fill="#9ca3af"/><rect x="1469" y="694" width="6" height="6" fill="#9ca3af"/><rect x="1469" y="785" width="6" height="6" fill="#9ca3af"/><rect x="1486" y="694" width="6" height="6" fill="#9ca3af"/><rect x="1486" y="785" width="6" height="6" fill="#9ca3af"/><rect x="1503" y="694" width="6" height="6" fill="#9ca3af"/><rect x="1503" y="785" width="6" height="6" fill="#9ca3af"/><rect x="1397" y="720" width="36" height="40" rx="6" fill="#fca5a5"/><text x="1415.0" y="737.0" text-anchor="middle" style="font-size:6.5px;font-weight:800;fill:#111827">boot ROM</text><text x="1415.0" y="748.0" text-anchor="middle" style="font-size:5.5px;font-weight:500;fill:#111827">fixed</text><rect x="1438" y="720" width="36" height="40" rx="6" fill="#fcd34d"/><text x="1456.0" y="737.0" text-anchor="middle" style="font-size:6.5px;font-weight:800;fill:#111827">flash</text><text x="1456.0" y="748.0" text-anchor="middle" style="font-size:5.5px;font-weight:500;fill:#111827">firmware</text><rect x="1479" y="720" width="36" height="40" rx="6" fill="#93c5fd"/><text x="1497.0" y="737.0" text-anchor="middle" style="font-size:6.5px;font-weight:800;fill:#111827">RAM</text><text x="1497.0" y="748.0" text-anchor="middle" style="font-size:5.5px;font-weight:500;fill:#111827">tens</text><text x="1455.0" y="777.0" text-anchor="middle" style="font-size:7.0px;font-weight:700;fill:#e5e7eb">card chip</text>
    <text x="870" y="760" text-anchor="start" style="font-size:16px;font-weight:600;fill:#166534">the same everyday devices →</text>
  </g>
