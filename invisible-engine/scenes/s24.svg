<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 24: The whisper is a pulse, not a stream</title>
  <desc>Five frames. A chart of the tracker’s supply current against time: a low sleep current of a few microamps; a brief advertising event in which the radio transmits the same short packet on three channels in a few milliseconds, at a few milliamps; the events repeating after an advertising interval plus a small random delay; the average current, a dashed line only just above sleep, set mostly by how often the tracker speaks; and a worked example of average current and power with illustrative values.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 24</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The whisper is a pulse, not a stream</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Asleep almost all the time; awake for a few milliseconds to speak. Values are illustrative.</text>
  <g>
    <path d="M150,190 L150,550 L1100,550" fill="none" stroke="#334155" stroke-width="3"/><path d="M1100,542 L1116,550 L1100,558 Z" fill="#334155"/><path d="M142,190 L150,174 L158,190 Z" fill="#334155"/>
    <text x="1110" y="584" text-anchor="end" style="font-size:17px;font-weight:700;fill:#334155">time →</text>
    <text x="138" y="166" text-anchor="start" style="font-size:17px;font-weight:700;fill:#334155">supply current</text>
    <path d="M140,470 l20,-8 M140,480 l20,-8" stroke="#334155" stroke-width="2"/>
    <text x="134" y="448" text-anchor="end" style="font-size:13px;font-weight:400;fill:#475569"><tspan x="134" dy="0">axis</tspan><tspan x="134" dy="17">broken</tspan></text>
  </g>
  <g data-f="1">
    <path d="M150,540 L1080,540" stroke="#16a34a" stroke-width="4"/>
    <text x="164" y="496" text-anchor="start" style="font-size:16px;font-weight:700;fill:#166534">sleep: a few µA</text>
  </g>
  <g data-f="2">
    <rect x="320" y="240" width="20" height="300" fill="#1d4ed8"/>
    <text x="352" y="254" text-anchor="start" style="font-size:16px;font-weight:700;fill:#1e3a8a">advertising event</text>
    <text x="352" y="276" text-anchor="start" style="font-size:15px;font-weight:400;fill:#334155">a few mA for a few ms</text>
    <path d="M340,240 L1120,200" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 6"/>
    <rect x="1120" y="160" width="420" height="330" rx="14" class="boxw"/>
    <text x="1140" y="192" text-anchor="start" style="font-size:17px;font-weight:800;fill:#14213d">Zoom: one advertising event</text>
    <rect x="1170" y="250" width="70" height="170" rx="4" fill="#1d4ed8"/>
    <text x="1205" y="446" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#1e3a8a">ch 37</text>
    <rect x="1290" y="250" width="70" height="170" rx="4" fill="#1d4ed8"/>
    <text x="1325" y="446" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#1e3a8a">ch 38</text>
    <rect x="1410" y="250" width="70" height="170" rx="4" fill="#1d4ed8"/>
    <text x="1445" y="446" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#1e3a8a">ch 39</text>
    <path d="M1145,420 L1520,420" stroke="#16a34a" stroke-width="3"/>
    <text x="1140" y="474" text-anchor="start" style="font-size:14.5px;font-weight:400;fill:#475569">Same packet on three channels; ≈ a few ms total</text>
  </g>
  <g data-f="3">
    <rect x="590" y="240" width="20" height="300" fill="#1d4ed8"/>
    <rect x="860" y="240" width="20" height="300" fill="#1d4ed8"/>
    <path d="M330,580 L600,580" stroke="#334155" stroke-width="2"/><path d="M330,572 l0,16 M600,572 l0,16" stroke="#334155" stroke-width="2"/>
    <text x="465.0" y="610" text-anchor="middle" style="font-size:15.5px;font-weight:700;fill:#334155">interval T (illustrative) + random 0–10 ms</text>
    <text x="805.0" y="610" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#475569">the random delay stops two devices</text>
    <text x="805.0" y="630" text-anchor="middle" style="font-size:15px;font-weight:400;fill:#475569">colliding again and again</text>
  </g>
  <g data-f="4">
    <path d="M150,522 L1080,522" stroke="#c2410c" stroke-width="3" stroke-dasharray="12 8"/>
    <text x="1074" y="512" text-anchor="end" style="font-size:16px;font-weight:800;fill:#9a3412">average current</text>
    <rect x="60" y="650" width="700" height="160" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="86" cy="680" r="18" fill="#ea580c"/><text x="86" y="686" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="114" y="686" text-anchor="start" style="font-size:19px;font-weight:800;fill:#ea580c">Average current</text><text x="76" y="715" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="76" dy="0">I_avg = (I_tx × t_on + I_sleep × (T − t_on)) / T</tspan><tspan x="76" dy="21">Set mostly by how often it speaks (T), not how loudly.</tspan><tspan x="76" dy="21">Speak twice as often → roughly twice the radio drain.</tspan></text>
  </g>
  <g data-f="5">
    <rect x="800" y="650" width="740" height="160" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="826" cy="680" r="18" fill="#2563eb"/><text x="826" y="686" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="854" y="686" text-anchor="start" style="font-size:19px;font-weight:800;fill:#2563eb">Worked example (illustrative values)</text><text x="816" y="715" text-anchor="start" style="font-size:16px;font-weight:400;fill:#334155"><tspan x="816" dy="0">I_tx = 6 mA, t_on = 3 ms, T = 2 s, I_sleep = 2 µA</tspan><tspan x="816" dy="21">I_avg ≈ (18 µA·s + 4 µA·s) / 2 s ≈ 11 µA</tspan><tspan x="816" dy="21">Power ≈ 3 V × 11 µA ≈ 33 µW (radio and sleep only)</tspan></text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1540" y="866" class="note" text-anchor="end">Not to scale. Not a measurement of any product.</text>
  </g>
</svg>
