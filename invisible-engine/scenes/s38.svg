<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Arial, sans-serif">
  <title>Scene 38: The whole exchange in five lanes</title>
  <desc>A sequence diagram in five frames across five lanes: the tag, the finder phone, the Find My relay at Apple, the owner’s Apple Account service, and the owner’s device. 1, the tag broadcasts its current public key over Bluetooth; 2, the finder phone takes its own location; 3, it encrypts location and time to the public key. 4, it uploads the encrypted report with a SHA-256 lookup hash; 5, the relay stores it. 6, the owner’s device signs in with two-factor authentication; 7, it receives an authorised session. 8, it regenerates the public keys and hashes; 9, it requests reports by hash; 10, the relay returns the encrypted reports; 11, the device decrypts them with its private keys. Final frame: trust boundaries around Apple’s services and around the owner’s device, where the private keys stay.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 38</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The whole exchange in five lanes</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Numbered messages, left to right. Short form: From Tap to Trace, Figure 06.</text>
  <g data-f="1">
    <rect x="65" y="164" width="230" height="66" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="180" y="192" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#14213d">Item tracker</text><text x="180" y="216" text-anchor="middle" style="font-size:14px;font-weight:400;fill:#475569">broadcasts</text>
    <path d="M180,230 L180,770" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="365" y="164" width="230" height="66" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="480" y="192" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#14213d">Finder phone</text><text x="480" y="216" text-anchor="middle" style="font-size:14px;font-weight:400;fill:#475569">any passer-by</text>
    <path d="M480,230 L480,770" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="675" y="164" width="230" height="66" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="790" y="192" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#14213d">Find My relay</text><text x="790" y="216" text-anchor="middle" style="font-size:14px;font-weight:400;fill:#475569">Apple</text>
    <path d="M790,230 L790,770" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="965" y="164" width="230" height="66" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="1080" y="192" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#14213d">Account service</text><text x="1080" y="216" text-anchor="middle" style="font-size:14px;font-weight:400;fill:#475569">Apple Account</text>
    <path d="M1080,230 L1080,770" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="1290" y="164" width="230" height="66" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="1405" y="192" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#14213d">Owner’s device</text><text x="1405" y="216" text-anchor="middle" style="font-size:14px;font-weight:400;fill:#475569">signed in</text>
    <path d="M1405,230 L1405,770" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M180,290 L476,290" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="243" y="264" width="174" height="26" rx="6" class="lab"/>
    <text x="330" y="282" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#1d4ed8"><tspan x="330" dy="0">1 BLE advert: Pᵢ</tspan></text>
    <rect x="382" y="317" width="196" height="28" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="480" y="337" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#15803d">2 own location + time</text>
    <rect x="406" y="362" width="147" height="28" rx="7" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/><text x="480" y="382" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#7e22ce">3 encrypt to Pᵢ</text>
  </g>
  <g data-f="2">
    <path d="M480,425 L786,425" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="534" y="399" width="202" height="26" rx="6" class="lab"/>
    <text x="635" y="417" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#7e22ce"><tspan x="635" dy="0">4 hash + ciphertext</tspan></text>
    <rect x="716" y="452" width="147" height="28" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="790" y="472" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#334155">5 store by hash</text>
  </g>
  <g data-f="3">
    <path d="M1405,515 L1084,515" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="1113" y="489" width="154" height="26" rx="6" class="lab"/>
    <text x="1190" y="507" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#4b5563"><tspan x="1190" dy="0">6 sign in, 2FA</tspan></text>
    <path d="M1080,560 L1401,560" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="1137" y="534" width="106" height="26" rx="6" class="lab"/>
    <text x="1190" y="552" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#4b5563"><tspan x="1190" dy="0">7 session</tspan></text>
  </g>
  <g data-f="4">
    <rect x="1323" y="587" width="163" height="28" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="1405" y="607" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#15803d">8 derive Pᵢ, hash</text>
    <path d="M1405,650 L794,650" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="834" y="624" width="202" height="26" rx="6" class="lab"/>
    <text x="935" y="642" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#15803d"><tspan x="935" dy="0">9 request by hashes</tspan></text>
    <path d="M790,695 L1401,695" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="829" y="669" width="212" height="26" rx="6" class="lab"/>
    <text x="935" y="687" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#7e22ce"><tspan x="935" dy="0">10 encrypted reports</tspan></text>
    <rect x="1319" y="722" width="172" height="28" rx="7" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/><text x="1405" y="742" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#7e22ce">11 decrypt with dᵢ</text>
  </g>
  <g data-f="5">
    <rect x="664" y="154" width="542" height="86" rx="14" fill="none" stroke="#14213d" stroke-width="5"/><rect x="678" y="227" width="136" height="26" rx="5" fill="#14213d"/><text x="686" y="246" text-anchor="start" style="font-size:14.5px;font-weight:700;fill:#ffffff">Apple services</text>
    <rect x="1280" y="154" width="250" height="640" rx="14" fill="none" stroke="#14213d" stroke-width="5"/><rect x="1294" y="781" width="205" height="26" rx="5" fill="#14213d"/><text x="1302" y="800" text-anchor="start" style="font-size:14.5px;font-weight:700;fill:#ffffff">private keys stay here</text>
    <text x="60" y="810" text-anchor="start" style="font-size:15.5px;font-weight:600;fill:#334155">Thick boxes: trust boundaries. Apple stores and routes; only the owner’s device decrypts.</text>
  </g>
  <g class="legend">
    <line x1="60" y1="832" x2="1540" y2="832" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60,861 L94,861" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="106" y="866" class="s">Radio signal or wave</text>
    <path d="M308.0,861 L342.0,861" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="354.0" y="866" class="s">Plaintext / local information</text>
    <path d="M633.4,861 L667.4,861" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="679.4" y="866" class="s">Encrypted / cryptographic</text>
    <path d="M924.4,861 L958.4,861" class="a-admin" marker-end="url(#m-admin)"/>
    <text x="970.4" y="866" class="s">Registration / authorisation (not data)</text>
  </g>
</svg>
