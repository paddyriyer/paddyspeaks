<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1562" width="720" height="1562" font-family="Inter, Arial, sans-serif">
  <title>Scene 26: What is in an advertising packet</title>
  <desc>Five frames. A Bluetooth LE legacy advertising packet on the 1M PHY as a strip of fields: a 1-byte preamble, a 4-byte access address, a 2-byte PDU header, a 6-byte advertiser address, up to 31 bytes of advertising data and a 3-byte CRC; what each field is for; the advertising data as a list of length-type-value structures, one of which an ecosystem can use for its own short-lived identifier, shown conceptually; advertising, a one-way broadcast anyone can hear, contrasted with a connection, where two devices agree to talk and can encrypt after pairing; and changing addresses for privacy.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1562"/>
  <text x="40" y="50" class="k">SCENE 26</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">What is in an advertising</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">packet</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Educational field layout from the Bluetooth Core</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">Specification. Not a capture of any product.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="0" width="360" height="48" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
    <text x="56" y="32.0" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Preamble</text>
    <text x="384" y="32.0" text-anchor="end" style="font-size:21px;font-weight:600;fill:#334155">1 B</text>
    <rect x="40" y="48" width="360" height="60" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
    <text x="56" y="86.0" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Access address</text>
    <text x="384" y="86.0" text-anchor="end" style="font-size:21px;font-weight:600;fill:#334155">4 B</text>
    <rect x="40" y="108" width="360" height="52" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
    <text x="56" y="142.0" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Header</text>
    <text x="384" y="142.0" text-anchor="end" style="font-size:21px;font-weight:600;fill:#b45309">2 B</text>
    <rect x="40" y="160" width="360" height="58" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5"/>
    <text x="56" y="197.0" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Advertiser address (AdvA)</text>
    <text x="384" y="197.0" text-anchor="end" style="font-size:21px;font-weight:600;fill:#0d9488">6 B</text>
    <rect x="40" y="218" width="360" height="80" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <text x="56" y="253.0" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d"><tspan x="56" dy="0">Advertising data</tspan><tspan x="56" dy="27">(AdvData)</tspan></text>
    <text x="384" y="266.0" text-anchor="end" style="font-size:21px;font-weight:600;fill:#16a34a">≤ 31 B</text>
    <rect x="40" y="298" width="360" height="60" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
    <text x="56" y="336.0" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">CRC</text>
    <text x="384" y="336.0" text-anchor="end" style="font-size:21px;font-weight:600;fill:#334155">3 B</text>
    <path d="M412,108 L412,298" stroke="#334155" stroke-width="2"/><path d="M404,108 L420,108 M404,298 L420,298" stroke="#334155" stroke-width="2"/>
    <text x="432" y="200" text-anchor="start" style="font-size:21px;font-weight:700;fill:#334155"><tspan x="432" dy="0">PDU (header +</tspan><tspan x="432" dy="27">payload)</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <text x="432" y="31.0" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">bit-timing sync</text>
    <text x="432" y="73.0" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="432" dy="0">0x8E89BED6</tspan><tspan x="432" dy="26">for advertising</tspan></text>
    <text x="432" y="141.0" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">packet type + length</text>
    <text x="432" y="323.0" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="432" dy="0">catches errors,</tspan><tspan x="432" dy="26">not attackers</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <path d="M40,236 L24,236 L24,445 L40,445" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 6"/>
    <text x="40" y="402" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">AdvData = a list of [length | type | value] structures</text>
    <rect x="40" y="420" width="70" height="50" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><rect x="110" y="420" width="220" height="50" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><rect x="330" y="420" width="350" height="50" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <text x="75" y="452.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#334155">len</text>
    <text x="220" y="452.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#334155">type: flags</text>
    <text x="505" y="452.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#16a34a">value</text>
    <rect x="40" y="478" width="70" height="76" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><rect x="110" y="478" width="220" height="76" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><rect x="330" y="478" width="350" height="76" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="75" y="523.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#334155">len</text>
    <text x="220" y="510.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#334155"><tspan x="220" dy="0">type: manufacturer</tspan><tspan x="220" dy="26">data</tspan></text>
    <text x="505" y="510.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#7c3aed"><tspan x="505" dy="0">ecosystem’s short-lived</tspan><tspan x="505" dy="26">identifier (conceptual)</tspan></text>
    <text x="40" y="584" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#475569"><tspan x="40" dy="0">Exact tracker bytes are not shown: no verified</tspan><tspan x="40" dy="26">capture is claimed here.</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="632" width="640" height="276" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="82" cy="676" r="26" fill="#2563eb"/><text x="82" y="685" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text><text x="122" y="686" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Advertising vs a connection</text>
    <circle cx="103" cy="789" r="32" fill="#0f172a" opacity="0.13"/><circle cx="100" cy="784" r="32" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="100" cy="784" r="20" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="255" y="717" width="26" height="44" rx="4" fill="#0f172a" opacity="0.14"/><rect x="250" y="710" width="26" height="44" rx="4" fill="#111827"/><rect x="252" y="712" width="23" height="41" rx="3" fill="#eff6ff"/><rect x="259" y="713" width="7" height="2" rx="1" fill="#111827"/>
    <path d="M136,784 L242,732" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="255" y="769" width="26" height="44" rx="4" fill="#0f172a" opacity="0.14"/><rect x="250" y="762" width="26" height="44" rx="4" fill="#111827"/><rect x="252" y="764" width="23" height="41" rx="3" fill="#eff6ff"/><rect x="259" y="765" width="7" height="2" rx="1" fill="#111827"/>
    <path d="M136,784 L242,784" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="255" y="821" width="26" height="44" rx="4" fill="#0f172a" opacity="0.14"/><rect x="250" y="814" width="26" height="44" rx="4" fill="#111827"/><rect x="252" y="816" width="23" height="41" rx="3" fill="#eff6ff"/><rect x="259" y="817" width="7" height="2" rx="1" fill="#111827"/>
    <path d="M136,784 L242,836" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="64" y="888" text-anchor="start" style="font-size:21px;font-weight:700;fill:#1e3a8a">one-way, anyone can hear</text>
    <rect x="377" y="717" width="46" height="86" rx="8" fill="#0f172a" opacity="0.14"/><rect x="372" y="710" width="46" height="86" rx="8" fill="#111827"/><rect x="375" y="713" width="40" height="80" rx="6" fill="#eff6ff"/><rect x="389" y="715" width="13" height="3" rx="2" fill="#111827"/>
    <rect x="617" y="717" width="46" height="86" rx="8" fill="#0f172a" opacity="0.14"/><rect x="612" y="710" width="46" height="86" rx="8" fill="#111827"/><rect x="615" y="713" width="40" height="80" rx="6" fill="#eff6ff"/><rect x="629" y="715" width="13" height="3" rx="2" fill="#111827"/>
    <path d="M426,742 L604,742" class="a-signal" marker-end="url(#m-signal)" marker-start="url(#ms-signal)"/>
    <path d="M508,770 L508,765 a8,8 0 0 1 15,0 L523,770" fill="none" stroke="#7c3aed" stroke-width="2.8"/><rect x="502" y="769" width="26" height="21" rx="3" fill="#7c3aed"/><circle cx="515" cy="778" r="3" fill="#ffffff"/><rect x="514" y="779" width="2" height="6" fill="#ffffff"/>
    <text x="516" y="832" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#334155"><tspan x="516" dy="0">connection (GATT):</tspan><tspan x="516" dy="26">agreed, two-way,</tspan></text>
    <text x="516" y="884" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#6b21a8">encrypted after pairing</text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="922" width="640" height="232" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="82" cy="966" r="26" fill="#7c3aed"/><text x="82" y="975" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text><text x="122" y="976" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Addresses that change</text>
    <text x="64" y="1020" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="64" dy="0">Bluetooth privacy: a resolvable private address changes</tspan><tspan x="64" dy="27">every so often (interval set by the stack). Devices</tspan><tspan x="64" dy="27">bonded with the owner can recognise it; strangers see an</tspan><tspan x="64" dy="27">unrelated value. Ecosystems such as Find My rotate</tspan><tspan x="64" dy="27">their own identifiers too (Scene 28).</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1434" x2="680" y2="1434" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1464" class="note">Legacy advertising, LE 1M PHY. Field widths not to</text>
    <text x="40" y="1491" class="note">scale.</text>
    <path d="M40,1527 L74,1527" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="86" y="1532" class="s">Radio signal or wave</text>
  </g>
</svg>
