<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1596" width="720" height="1596" font-family="Inter, Arial, sans-serif">
  <title>Scene 44: Open padlocks and private keys — and why a signature is not a lock</title>
  <desc>Five frames. 1, the analogy: the owner hands out open padlocks (public keys) that anyone can snap shut, and keeps the only key that opens them (the private key). 2, the precise version: a finder encrypts a location to the public key; only the owner’s private key decrypts it. 3, in practice a fresh one-time key and a symmetric cipher do the bulk work: ephemeral key agreement, a key-derivation function and authenticated encryption. 4, a different job: a maker signs a firmware update with its signing key and the device checks it with the matching public key; the update itself is not hidden. 5, a comparison: encryption decides who can read; a signature proves who wrote; different keys, different jobs.</desc>
