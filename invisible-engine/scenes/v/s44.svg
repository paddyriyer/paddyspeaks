    <rect x="40" y="666" width="640" height="220" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="74" cy="700" r="20" fill="#2563eb"/><text x="74" y="707" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">4</text><text x="104" y="708" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">A different job: a signed firmware update</text>
    <rect x="56" y="732" width="72" height="25" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="67" cy="745" r="3" fill="#22c55e"/><rect x="80" y="742" width="38" height="6" rx="3" fill="#94a3b8"/><rect x="56" y="762" width="72" height="25" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="67" cy="775" r="3" fill="#22c55e"/><rect x="80" y="772" width="38" height="6" rx="3" fill="#94a3b8"/><rect x="56" y="792" width="72" height="25" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="67" cy="805" r="3" fill="#22c55e"/><rect x="80" y="802" width="38" height="6" rx="3" fill="#94a3b8"/>
    <text x="92" y="848" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#475569">maker</text>
    <rect x="206" y="728" width="170" height="104" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="291" y="760" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#166534">update v2.1</text>
    <text x="291" y="786" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#334155">(readable)</text>
    <rect x="226" y="796" width="130" height="28" rx="5" fill="#7c3aed"/><text x="291" y="817" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#ffffff">signature</text>
    <path d="M134,778 L196,778" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="132" y="730" width="66" height="32" rx="6" class="lab"/>
    <text x="165" y="752" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#7e22ce"><tspan x="165" dy="0">sign</tspan></text>
    <path d="M386,778 L524,778" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="393" y="716" width="124" height="58" rx="6" class="lab"/>
    <text x="455" y="738" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#15803d"><tspan x="455" dy="0">update +</tspan><tspan x="455" dy="26">signature</tspan></text>
    <circle cx="577" cy="783" r="34" fill="#0f172a" opacity="0.13"/><circle cx="574" cy="778" r="34" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="574" cy="778" r="21" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="616" cy="752" r="16" fill="#16a34a"/><path d="M609,752 L614,758 L624,746" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="574" y="842" text-anchor="middle" style="font-size:21px;font-weight:400;fill:#334155">checks with the</text>
    <text x="574" y="868" text-anchor="middle" style="font-size:21px;font-weight:400;fill:#334155">maker’s public key</text>
  </g>
  <g data-f="5" transform="translate(0,314)">
    <rect x="40" y="896" width="640" height="208" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <circle cx="74" cy="930" r="20" fill="#b45309"/><text x="74" y="937" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">5</text><text x="104" y="938" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Not the same thing</text>
    <text x="64" y="980" text-anchor="start" style="font-size:21px;font-weight:800;fill:#6b21a8">Encryption</text><text x="370" y="980" text-anchor="start" style="font-size:21px;font-weight:800;fill:#1e40af">Signature</text>
    <text x="64" y="1008" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">who can read it</text><text x="370" y="1008" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">who wrote it</text>
    <text x="64" y="1034" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">lock with public,</text><text x="370" y="1034" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">sign with private,</text>
    <text x="64" y="1060" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">open with private</text><text x="370" y="1060" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">check with public</text>
    <text x="64" y="1086" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">hides the content</text><text x="370" y="1086" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">hides nothing</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1434" x2="680" y2="1434" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1464" class="note">Conceptual. Keys and algorithms simplified; Apple</text>
    <text x="40" y="1491" class="note">documents ECDH, a KDF and AES-GCM for Find My.</text>
    <path d="M40,1527 L74,1527" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="86" y="1532" class="s">Plaintext / local information</text>
    <path d="M40,1561 L74,1561" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="86" y="1566" class="s">Encrypted / cryptographic</text>
  </g>
