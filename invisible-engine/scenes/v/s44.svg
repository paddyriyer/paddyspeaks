  <rect class="bg" width="720" height="1596"/>
  <text x="40" y="50" class="k">SCENE 44</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Open padlocks and private</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">keys — and why a</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">signature is not a lock</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">Encryption controls who can read. A signature</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">proves who wrote. Different keys, different jobs.</text>
  <g data-f="1" transform="translate(0,314)">
    <rect x="40" y="0" width="640" height="306" rx="18" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
    <circle cx="74" cy="34" r="20" fill="#7c3aed"/><text x="74" y="41" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">1</text><text x="104" y="42" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">The analogy</text>
    <path d="M88,112 L88,88 a14,14 0 0 1 29,0 L116,94" fill="none" stroke="#a78bfa" stroke-width="5.6" transform="translate(11,-10)"/><rect x="78" y="112" width="48" height="38" rx="6" fill="#a78bfa"/><circle cx="102" cy="128" r="5" fill="#ffffff"/><rect x="100" y="129" width="4" height="11" fill="#ffffff"/>
    <path d="M164,112 L164,88 a14,14 0 0 1 29,0 L192,94" fill="none" stroke="#a78bfa" stroke-width="5.6" transform="translate(11,-10)"/><rect x="154" y="112" width="48" height="38" rx="6" fill="#a78bfa"/><circle cx="178" cy="128" r="5" fill="#ffffff"/><rect x="176" y="129" width="4" height="11" fill="#ffffff"/>
    <path d="M240,112 L240,88 a14,14 0 0 1 29,0 L268,94" fill="none" stroke="#a78bfa" stroke-width="5.6" transform="translate(11,-10)"/><rect x="230" y="112" width="48" height="38" rx="6" fill="#a78bfa"/><circle cx="254" cy="128" r="5" fill="#ffffff"/><rect x="252" y="129" width="4" height="11" fill="#ffffff"/>
    <text x="180" y="176" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#6b21a8">open padlocks: hand out</text>
    <text x="180" y="201" text-anchor="middle" style="font-size:21px;font-weight:400;fill:#334155">copies to anyone</text>
    <circle cx="452" cy="124" r="18" fill="none" stroke="#7c3aed" stroke-width="7.0"/><path d="M470,124 L544,124 M524,124 L524,140 M538,124 L538,136" fill="none" stroke="#7c3aed" stroke-width="7.0" stroke-linecap="round"/>
    <text x="500" y="176" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#6b21a8">one key: keep it</text>
    <text x="60" y="238" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="60" dy="0">Anyone can snap a padlock shut. Only the keyholder</tspan><tspan x="60" dy="27">opens it.</tspan></text>
    <text x="60" y="292" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d">Public key = open padlock. Private key = the only key.</text>
  </g>
