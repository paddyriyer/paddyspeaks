    <rect x="40" y="316" width="640" height="340" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="74" cy="350" r="20" fill="#7c3aed"/><text x="74" y="357" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">2</text><text x="104" y="358" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">The precise version: encrypt to a public key</text>
    <rect x="63" y="387" width="84" height="144" rx="14" fill="#0f172a" opacity="0.14"/><rect x="58" y="380" width="84" height="144" rx="14" fill="#111827"/><rect x="63" y="385" width="74" height="134" rx="11" fill="#f0fdf4"/><rect x="88" y="388" width="24" height="6" rx="3" fill="#111827"/>
    <text x="100" y="440" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#166534">place</text><text x="100" y="464" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#166534">+ time</text>
    <text x="100" y="550" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#475569">finder</text>
    <rect x="246" y="420" width="100" height="66" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><path d="M246,426 L296,456 L346,426" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <path d="M280,446 L280,437 a10,10 0 0 1 20,0 L299,446" fill="none" stroke="#7c3aed" stroke-width="3.9"/><rect x="273" y="446" width="33" height="26" rx="4" fill="#7c3aed"/><circle cx="290" cy="457" r="3" fill="#ffffff"/><rect x="288" y="458" width="3" height="8" fill="#ffffff"/>
    <path d="M150,452 L236,452" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="148" y="404" width="90" height="32" rx="6" class="lab"/>
    <text x="193" y="426" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#7e22ce"><tspan x="193" dy="0">with P</tspan></text>
    <path d="M356,452 L530,452" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="358" y="404" width="171" height="32" rx="6" class="lab"/>
    <text x="443" y="426" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#7e22ce"><tspan x="443" dy="0">sealed report</tspan></text>
    <rect x="545" y="387" width="84" height="144" rx="14" fill="#0f172a" opacity="0.14"/><rect x="540" y="380" width="84" height="144" rx="14" fill="#111827"/><rect x="545" y="385" width="74" height="134" rx="11" fill="#f5f3ff"/><rect x="570" y="388" width="24" height="6" rx="3" fill="#111827"/>
    <circle cx="554" cy="452" r="9" fill="none" stroke="#7c3aed" stroke-width="3.5"/><path d="M563,452 L600,452 M590,452 L590,460 M597,452 L597,458" fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round"/>
    <text x="582" y="550" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#475569">owner</text>
    <text x="443" y="492" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#6b21a8">only d</text>
    <text x="443" y="518" text-anchor="middle" style="font-size:21px;font-weight:400;fill:#334155">opens it</text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <text x="60" y="586" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569"><tspan x="60" dy="0">In practice: one-time key agreement (ECDH) →</tspan><tspan x="60" dy="27">key derivation → AES-GCM. The public key never</tspan><tspan x="60" dy="27">decrypts anything.</tspan></text>
  </g>
