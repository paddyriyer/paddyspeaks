<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1502" width="720" height="1502" font-family="Inter, Arial, sans-serif">
  <title>Scene 10: Inside the card</title>
  <desc>Four frames. A cutaway of an ID-1 payment card, 85.60 by 53.98 millimetres, showing a few turns of antenna coil near the edge; the coil’s two ends joining the chip module at its antenna terminals; the chip opened as a block diagram: rectifier, regulator, clock recovery, demodulator, load modulator, processor, crypto engine and secure memory; and a note that layouts vary.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1502"/>
  <text x="40" y="50" class="k">SCENE 10</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Inside the card</text>
  <text x="40" y="153" style="font-size:23px;fill:#475569">A coil, a chip, and the circuits that turn a</text>
  <text x="40" y="184" style="font-size:23px;fill:#475569">magnetic field into power and answers.</text>
  <g data-f="1" transform="translate(0,210)">
    <rect x="64" y="6" width="600" height="378" rx="30" fill="#0f172a" opacity="0.12"/><rect x="60" y="0" width="600" height="378" rx="30" fill="#1e3a8a"/><path d="M60,234 Q360,170 660,265 L660,348 Q660,378 630,378 L90,378 Q60,378 60,348 Z" fill="#1d4ed8" opacity="0.55"/><rect x="90" y="30" width="372" height="318" rx="21" fill="#fdf6e3" stroke="#d6c7a1" stroke-width="1.5"/><rect x="105.0" y="45.0" width="342.0" height="288.0" rx="18" fill="none" stroke="#b45309" stroke-width="3.3"/><rect x="115.8" y="55.8" width="320.4" height="266.4" rx="16" fill="none" stroke="#b45309" stroke-width="3.3"/><rect x="126.6" y="66.6" width="298.8" height="244.8" rx="14" fill="none" stroke="#b45309" stroke-width="3.3"/><rect x="137.4" y="77.4" width="277.2" height="223.2" rx="12" fill="none" stroke="#b45309" stroke-width="3.3"/><rect x="222.0" y="124.74000000000001" width="90.0" height="90.72" rx="15" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M267.0,124.74000000000001 L267.0,215.46 M222.0,154.98000000000002 L256.2,154.98000000000002 M277.8,154.98000000000002 L312.0,154.98000000000002 M222.0,185.22 L256.2,185.22 M277.8,185.22 L312.0,185.22" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="256.2" y="144.69840000000002" width="21.599999999999998" height="50.803200000000004" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/><text x="624.0" y="75.60000000000001" text-anchor="end" style="font-size:42.00000000000001px;font-weight:800;fill:#e0e7ff">BANK</text>
    <rect x="40" y="398" width="312" height="124" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="66" cy="428" r="18" fill="#ea580c"/><text x="66" y="434" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="94" y="434" text-anchor="start" style="font-size:23px;font-weight:800;fill:#ea580c">Antenna coil</text><text x="56" y="467" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">A few turns near the</tspan><tspan x="56" dy="27">edge (drawn heavier).</tspan></text>
    <path d="M140,398 L108,320" stroke="#fdba74" stroke-width="2"/><circle cx="108" cy="320" r="5" fill="#fdba74"/>
  </g>
  <g data-f="2" transform="translate(0,210)">
    <path d="M105,100 L150,100 L150,147 L222,147" fill="none" stroke="#b45309" stroke-width="5"/><path d="M105,285 L150,285 L150,194 L222,194" fill="none" stroke="#b45309" stroke-width="5"/><circle cx="222" cy="147" r="7" fill="#0f172a"/><circle cx="222" cy="194" r="7" fill="#0f172a"/>
    <rect x="368" y="398" width="312" height="124" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="394" cy="428" r="18" fill="#b45309"/><text x="394" y="434" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="422" y="434" text-anchor="start" style="font-size:23px;font-weight:800;fill:#b45309">Antenna terminals</text><text x="384" y="467" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="384" dy="0">The coil’s two ends</tspan><tspan x="384" dy="27">join the module.</tspan></text>
    <path d="M470,398 L226,198" stroke="#fcd34d" stroke-width="2"/><circle cx="226" cy="198" r="5" fill="#fcd34d"/>
  </g>
  <g data-f="3" transform="translate(0,210)">
    <path d="M232,216 L356,330 L356,540" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 6"/><path d="M308,216 L364,300 L364,540" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="40" y="540" width="640" height="604" rx="18" class="bound"/>
    <circle cx="82" cy="582" r="22" fill="#7c3aed"/><text x="82" y="590" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#ffffff">3</text>
    <text x="116" y="591" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">The chip, opened (block diagram)</text>
    <rect x="60" y="620" width="294" height="80" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="74" y="651" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Rectifier</text><text x="74" y="680" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">AC → DC</text>
    <rect x="366" y="620" width="294" height="80" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="380" y="651" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Regulator</text><text x="380" y="680" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">steady supply</text>
    <rect x="60" y="714" width="294" height="80" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="74" y="745" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Clock recovery</text><text x="74" y="774" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">timing from 13.56 MHz</text>
    <rect x="366" y="714" width="294" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="380" y="745" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Demodulator</text><text x="380" y="774" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">reads the reader</text>
    <rect x="60" y="808" width="294" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="74" y="839" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Load modulator</text><text x="74" y="868" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">answers the reader</text>
    <rect x="366" y="808" width="294" height="80" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="380" y="839" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Processor</text><text x="380" y="868" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">runs the application</text>
    <rect x="60" y="902" width="294" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="74" y="933" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Crypto engine</text><text x="74" y="962" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">computes cryptograms</text>
    <rect x="366" y="902" width="294" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="380" y="933" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Secure memory</text><text x="380" y="962" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">keys, payment app</text>
    <path d="M619,930 L619,923 a10,10 0 0 1 20,0 L639,930" fill="none" stroke="#7c3aed" stroke-width="3.5"/><rect x="612" y="929" width="34" height="27" rx="4" fill="#7c3aed"/><circle cx="629" cy="940" r="4" fill="#ffffff"/><rect x="627" y="941" width="3" height="7" fill="#ffffff"/>
    <text x="60" y="1028" text-anchor="start" style="font-size:21px;font-weight:600;fill:#334155">Power (orange) → logic → secrets (purple).</text>
    <text x="60" y="1056" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Keys are meant never to leave the secure memory.</text>
  </g>
  <g data-f="4" transform="translate(0,210)">
    <text x="60" y="1094" text-anchor="start" style="font-style:italic;font-size:21px;font-weight:400;fill:#475569"><tspan x="60" dy="0">Layouts vary: some cards couple the module</tspan><tspan x="60" dy="27">through a small coil.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1374" x2="680" y2="1374" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1404" class="note">Schematic, not to scale. Generic block names, not a</text>
    <text x="40" y="1431" class="note">specific chip.</text>
    <rect x="40" y="1458" width="34" height="18" rx="3" class="bound" style="stroke-width:4"/>
    <text x="86" y="1472" class="s">Trust or hardware boundary</text>
  </g>
</svg>
