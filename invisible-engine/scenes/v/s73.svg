    <rect x="414" y="567" width="250" height="30" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/><text x="539" y="588" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#374151">unknown: not published</text>
