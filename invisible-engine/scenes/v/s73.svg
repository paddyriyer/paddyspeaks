    <rect x="444" y="775" width="220" height="30" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="554" y="796" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#6d28d9">yes: Shor-exposed</text>
    <rect x="444" y="879" width="220" height="30" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="554" y="900" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#6d28d9">yes: Shor-exposed</text>
    <text x="40" y="966" text-anchor="start" style="font-size:21px;font-weight:500;fill:#334155">VERIFIED = in the vendor’s or standard’s own</text><text x="40" y="993" text-anchor="start" style="font-size:21px;font-weight:500;fill:#334155">documentation. UNVERIFIED = documented for some</text><text x="40" y="1020" text-anchor="start" style="font-size:21px;font-weight:500;fill:#334155">products or versions, not confirmed for yours.</text><text x="40" y="1047" text-anchor="start" style="font-size:21px;font-weight:500;fill:#334155">UNKNOWN = not published. “Shor-exposed” means:</text><text x="40" y="1074" text-anchor="start" style="font-size:21px;font-weight:500;fill:#334155">only on a large fault-tolerant quantum computer,</text><text x="40" y="1101" text-anchor="start" style="font-size:21px;font-weight:500;fill:#334155">which is not publicly known to exist.</text>
  </g>
