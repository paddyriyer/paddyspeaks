    <rect x="514" y="849" width="150" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="589.0" y="872" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:800;fill:#92400e">UNVERIFIED</text>
