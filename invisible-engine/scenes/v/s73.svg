    <text x="56" y="766" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Cloud connection</text>
    <rect x="514" y="745" width="150" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="589.0" y="768" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:800;fill:#92400e">UNVERIFIED</text>
    <text x="56" y="794" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">TLS 1.3 key exchange</text>
    <text x="56" y="822" text-anchor="start" style="font-size:21px;font-weight:500;fill:#14213d">ECDHE; hybrid with ML-KEM rolling out</text>
