  <rect class="bg" width="720" height="1546"/>
  <text x="40" y="50" class="k">SCENE 73</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Inventory first: which</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">cryptography does each</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">part use?</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">You cannot plan a migration for algorithms you</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">have not listed — or cannot see.</text>
