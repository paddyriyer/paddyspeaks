<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1600" width="720" height="1600" font-family="Inter, Arial, sans-serif">
  <title>Scene 51: Two good goals that pull against each other</title>
  <desc>Five frames. 1, owner privacy: a tag that changes its identifier often shows a passer-by unrelated values at each place, and only the owner’s key links them. 2, the safety of the person carrying it: a tag that keeps travelling with someone — home, bus, office — should be noticed, which means recognising the same tag again. 3, a balance between the two goals: unlinkable on one side, detectable on the other. 4, four illustrative design dials: how often the identifier rotates, how the tag behaves when separated from its owner, whether it plays a sound when moved, and how long a tag must travel with someone before an alert. 5, a note that this is a tension tuned by design choices, not an impossibility.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1600"/>
  <text x="40" y="50" class="k">SCENE 51</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Two good goals that pull</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">against each other</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Rotation hides a tag from strangers. Protection</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">must still notice a tag that stays with you.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="0" width="640" height="272" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="82" cy="44" r="26" fill="#7c3aed"/><text x="82" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="122" y="54" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Owner privacy</text><text x="122" y="86" text-anchor="start" style="font-size:21px;font-weight:600;fill:#7c3aed">Strangers should not follow my tag</text>
    <rect x="64" y="104" width="186" height="46" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/><text x="157.0" y="134" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#15803d">K1 · 2C9E</text><rect x="261" y="104" width="186" height="46" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/><text x="354.0" y="134" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#15803d">K2 · A417</text><rect x="458" y="104" width="186" height="46" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/><text x="551.0" y="134" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#15803d">K3 · 51D0</text>
    <text x="64" y="180" text-anchor="start" style="font-size:20px;font-weight:600;fill:#475569">café</text><text x="261" y="180" text-anchor="start" style="font-size:20px;font-weight:600;fill:#475569">station</text><text x="458" y="180" text-anchor="start" style="font-size:20px;font-weight:600;fill:#475569">office</text>
    <path d="M64,216 Q88,198 112,216 Q88,234 64,216 Z" fill="#ffffff" stroke="#334155" stroke-width="1.8"/><circle cx="88" cy="216" r="7" fill="#334155"/><text x="126" y="223" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">a passer-by sees unrelated values</text>
    <text x="64" y="256" text-anchor="start" style="font-size:21px;font-weight:700;fill:#6b21a8">only the owner’s key links them</text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="40" y="462" width="640" height="264" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="82" cy="506" r="26" fill="#0d9488"/><text x="82" y="515" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="122" y="516" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">The person carrying it</text><text x="122" y="548" text-anchor="start" style="font-size:21px;font-weight:600;fill:#0d9488">A tag that stays with me should be noticed</text>
    <circle cx="96" cy="585" r="13" fill="#64748b"/><path d="M77,649 L77,616 Q77,603 90,603 L102,603 Q115,603 115,616 L115,649 Z" fill="#64748b"/><rect x="82" y="645" width="11" height="48" rx="4" fill="#64748b"/><rect x="99" y="645" width="11" height="48" rx="4" fill="#64748b"/>
    <circle cx="133" cy="649" r="12" fill="#0f172a" opacity="0.13"/><circle cx="130" cy="644" r="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="130" cy="644" r="7" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M154,674 C260,614 380,704 640,624" fill="none" stroke="#0d9488" stroke-width="3" stroke-dasharray="7 7"/>
    <circle cx="250" cy="648" r="9" fill="#0d9488"/><text x="250" y="628" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#0f766e">home</text>
    <circle cx="420" cy="666" r="9" fill="#0d9488"/><text x="420" y="700" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#0f766e">bus</text>
    <circle cx="610" cy="632" r="9" fill="#0d9488"/><text x="610" y="612" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#0f766e">office</text>
    <text x="64" y="718" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">the same tag, again and again</text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <text x="360" y="310" text-anchor="middle" style="font-size:26px;font-weight:800;fill:#14213d">in tension</text><text x="360" y="340" text-anchor="middle" style="font-size:21px;font-weight:400;fill:#475569">tuned, not traded away</text>
    <path d="M360,364 L320,424 L400,424 Z" fill="#334155"/><path d="M210,364 L510,364" stroke="#334155" stroke-width="6" stroke-linecap="round"/><path d="M230,364 L210,402 M230,364 L250,402 M490,364 L470,402 M490,364 L510,402" stroke="#64748b" stroke-width="2"/><path d="M198,402 L262,402 M458,402 L522,402" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <text x="230" y="440" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#6b21a8">unlinkable</text><text x="490" y="440" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0f766e">detectable</text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="738" width="640" height="392" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="82" cy="782" r="24" fill="#334155"/><text x="82" y="791" text-anchor="middle" style="font-size:25px;font-weight:800;fill:#ffffff">4</text><text x="120" y="791" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Design dials (illustrative)</text>
    <text x="66" y="834" text-anchor="start" style="font-size:21px;font-weight:700;fill:#14213d">Identifier rotation</text><text x="66" y="861" text-anchor="start" style="font-size:21px;font-weight:700;fill:#14213d">period</text><rect x="66" y="882" width="280" height="8" rx="4" fill="#cbd5e1"/><rect x="66" y="882" width="84" height="8" rx="4" fill="#64748b"/><circle cx="150" cy="886" r="12" fill="#ffffff" stroke="#334155" stroke-width="3"/><text x="66" y="926" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">short: hard to follow</text><text x="346" y="952" text-anchor="end" style="font-size:20px;font-weight:400;fill:#475569">long: easy to link</text>
    <text x="384" y="834" text-anchor="start" style="font-size:21px;font-weight:700;fill:#14213d">When separated from</text><text x="384" y="861" text-anchor="start" style="font-size:21px;font-weight:700;fill:#14213d">owner</text><rect x="384" y="882" width="280" height="8" rx="4" fill="#cbd5e1"/><rect x="384" y="882" width="196" height="8" rx="4" fill="#64748b"/><circle cx="580" cy="886" r="12" fill="#ffffff" stroke="#334155" stroke-width="3"/><text x="384" y="926" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">near owner: private</text><text x="664" y="952" text-anchor="end" style="font-size:20px;font-weight:400;fill:#475569">separated: findable</text>
    <text x="66" y="998" text-anchor="start" style="font-size:21px;font-weight:700;fill:#14213d">Sound when moved</text><rect x="66" y="1046" width="280" height="8" rx="4" fill="#cbd5e1"/><rect x="66" y="1046" width="210" height="8" rx="4" fill="#64748b"/><circle cx="276" cy="1050" r="12" fill="#ffffff" stroke="#334155" stroke-width="3"/><text x="66" y="1090" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">silent</text><text x="346" y="1116" text-anchor="end" style="font-size:20px;font-weight:400;fill:#475569">plays a sound</text>
    <text x="384" y="998" text-anchor="start" style="font-size:21px;font-weight:700;fill:#14213d">Time together before</text><text x="384" y="1025" text-anchor="start" style="font-size:21px;font-weight:700;fill:#14213d">an alert</text><rect x="384" y="1046" width="280" height="8" rx="4" fill="#cbd5e1"/><rect x="384" y="1046" width="126" height="8" rx="4" fill="#64748b"/><circle cx="510" cy="1050" r="12" fill="#ffffff" stroke="#334155" stroke-width="3"/><text x="384" y="1090" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">short: early warning</text><text x="664" y="1116" text-anchor="end" style="font-size:20px;font-weight:400;fill:#475569">long: fewer false alarms</text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="1140" width="640" height="152" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="82" cy="1184" r="26" fill="#b45309"/><text x="82" y="1193" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text><text x="122" y="1194" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">A tension, not an impossibility</text>
    <text x="64" y="1228" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Every dial moves protection between the two goals.</text><text x="64" y="1255" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Designs give up some unlinkability mainly while a</text><text x="64" y="1282" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">tag is away from its owner.</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1568" x2="680" y2="1568" stroke="#e2e8f0" stroke-width="2"/>
  </g>
</svg>
