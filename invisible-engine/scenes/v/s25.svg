    <text x="70" y="862" text-anchor="start" style="font-size:20px;font-weight:700;fill:#1e3a8a">tracker speaks</text>
    <text x="70" y="924" text-anchor="start" style="font-size:20px;font-weight:700;fill:#334155">phone listens</text>
