    <rect x="40" y="440" width="640" height="126" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="470" r="18" fill="#2563eb"/><text x="66" y="476" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="94" y="476" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">One packet, three channels</text><text x="56" y="512" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">The tracker repeats the same advertising</tspan><tspan x="56" dy="27">packet on 37, 38, 39.</tspan></text>
  </g>
