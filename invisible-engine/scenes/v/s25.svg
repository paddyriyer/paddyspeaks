  <rect class="bg" width="720" height="1582"/>
  <text x="40" y="50" class="k">SCENE 25</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">A whisper anyone nearby</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">can hear</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Advertising is a broadcast. Hearing it needs no</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">pairing, no connection and no reply.</text>
