  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="40" y="580" width="640" height="160" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="66" cy="610" r="18" fill="#16a34a"/><text x="66" y="616" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="94" y="616" text-anchor="start" style="font-size:26px;font-weight:800;fill:#16a34a">No pairing, no connection, no reply</text><text x="56" y="652" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Any receiver in range that is listening on the</tspan><tspan x="56" dy="27">channel can pick up the broadcast. The tracker</tspan><tspan x="56" dy="27">never learns who heard.</tspan></text>
  </g>
