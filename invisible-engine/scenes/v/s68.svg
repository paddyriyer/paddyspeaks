<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1527" width="720" height="1527" font-family="Inter, Arial, sans-serif">
  <title>Scene 68: Gates and circuits: reversible steps, then one irreversible look</title>
  <desc>Five frames. 1, a gallery of gates: X swaps 0 and 1; Z flips the sign of the 1 part; H makes an even mix; CNOT flips a target qubit when the control is 1; a controlled-phase gate adds a phase when both are 1 — each with its matrix. 2, ideal gates are unitary, so they can be undone: H followed by H gives the identity, computed here as [[1, 0], [0, 1]]. 3, a two-qubit circuit: H on the first qubit, a CNOT, then a Z, drawn on wires read left to right. 4, measurement is separate: it turns each qubit into one classical bit (double lines) and cannot be undone. 5, try it: demo H in Module 8 is a small statevector simulator.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1527"/>
  <text x="40" y="50" class="k">SCENE 68</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Gates and circuits:</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">reversible steps, then</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">one irreversible look</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">Every ideal gate can be run backwards. Measuring</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">cannot.</text>
  <g data-f="1" transform="translate(0,314)">
    <text x="110.0" y="20" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">X (bit flip)</text><path d="M50,34 L40,34 L40,124 L50,124" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M170,34 L180,34 L180,124 L170,124" fill="none" stroke="#334155" stroke-width="2.5"/><text x="82.0" y="69" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">0</text><text x="138.0" y="69" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">1</text><text x="82.0" y="107" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">1</text><text x="138.0" y="107" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">0</text>
    <text x="300.0" y="20" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">Z (phase flip)</text><path d="M235,34 L225,34 L225,124 L235,124" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M365,34 L375,34 L375,124 L365,124" fill="none" stroke="#334155" stroke-width="2.5"/><text x="270.0" y="69" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">1</text><text x="330.0" y="69" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">0</text><text x="270.0" y="107" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">0</text><text x="330.0" y="107" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">−1</text>
    <text x="550.0" y="20" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">H (Hadamard)</text><path d="M450,34 L440,34 L440,124 L450,124" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M650,34 L660,34 L660,124 L650,124" fill="none" stroke="#334155" stroke-width="2.5"/><text x="506.0" y="69" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">1/√2</text><text x="594.0" y="69" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">1/√2</text><text x="506.0" y="107" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">1/√2</text><text x="594.0" y="107" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">−1/√2</text>
    <text x="70" y="182" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">CNOT</text><path d="M70,214 L70,300" stroke="#334155" stroke-width="3"/><circle cx="70" cy="214" r="9" fill="#334155"/><circle cx="70" cy="280" r="20" fill="#ffffff" stroke="#334155" stroke-width="3"/><path d="M50,280 L90,280 M70,260 L70,300" stroke="#334155" stroke-width="3"/>
    <text x="110" y="236" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="110" dy="0">flips the target</tspan><tspan x="110" dy="27">when the control is 1</tspan></text>
    <text x="400" y="182" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">Controlled phase</text>
    <path d="M410,214 L410,280" stroke="#334155" stroke-width="3"/><circle cx="410" cy="214" r="9" fill="#334155"/><circle cx="410" cy="280" r="9" fill="#334155"/>
    <text x="440" y="236" style="font-size:21px;font-weight:400;fill:#334155">adds phase e<tspan dy="-8" style="font-size:20px">iφ</tspan></text><text x="440" y="263" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">when both are 1</text>
    <rect x="40" y="318" width="640" height="100" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="68" cy="348" r="18" fill="#2563eb"/><text x="68" y="354" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="96" y="356" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">A gate is a rule for amplitudes</text><text x="56" y="390" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Each one is a small matrix acting on the state.</text>
  </g>
  <g data-f="2" transform="translate(0,314)">
    <path d="M50,442 L40,442 L40,532 L50,532" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M220,442 L230,442 L230,532 L220,532" fill="none" stroke="#334155" stroke-width="2.5"/><text x="97.0" y="477" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">1/√2</text><text x="173.0" y="477" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">1/√2</text><text x="97.0" y="515" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">1/√2</text><text x="173.0" y="515" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">−1/√2</text><text x="255" y="497" text-anchor="middle" style="font-size:30px;font-weight:800;fill:#334155">×</text>
    <path d="M290,442 L280,442 L280,532 L290,532" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M460,442 L470,442 L470,532 L460,532" fill="none" stroke="#334155" stroke-width="2.5"/><text x="337.0" y="477" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">1/√2</text><text x="413.0" y="477" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">1/√2</text><text x="337.0" y="515" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">1/√2</text><text x="413.0" y="515" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">−1/√2</text><text x="495" y="497" text-anchor="middle" style="font-size:30px;font-weight:800;fill:#334155">=</text>
    <path d="M530,442 L520,442 L520,532 L530,532" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M670,442 L680,442 L680,532 L670,532" fill="none" stroke="#334155" stroke-width="2.5"/><text x="568.0" y="477" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">1</text><text x="632.0" y="477" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">0</text><text x="568.0" y="515" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">0</text><text x="632.0" y="515" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">1</text>
    <text x="360" y="572" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#166534">H then H undoes itself: the identity (computed)</text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <path d="M100,662 L600,662" stroke="#334155" stroke-width="2.5"/><text x="88" y="670" text-anchor="end" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:700;fill:#14213d">|0⟩</text><path d="M100,752 L600,752" stroke="#334155" stroke-width="2.5"/><text x="88" y="760" text-anchor="end" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:700;fill:#14213d">|0⟩</text>
    <rect x="142" y="636" width="56" height="52" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/><text x="170" y="670" text-anchor="middle" style="font-size:22px;font-weight:800;fill:#1d4ed8">H</text><path d="M270,662 L270,772" stroke="#334155" stroke-width="3"/><circle cx="270" cy="662" r="9" fill="#334155"/><circle cx="270" cy="752" r="20" fill="#ffffff" stroke="#334155" stroke-width="3"/><path d="M250,752 L290,752 M270,732 L270,772" stroke="#334155" stroke-width="3"/><rect x="342" y="636" width="56" height="52" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="370" y="670" text-anchor="middle" style="font-size:22px;font-weight:800;fill:#7c3aed">Z</text>
    <text x="360" y="818" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#334155">Read left to right: H, then CNOT, then Z</text>
  </g>
  <g data-f="4" transform="translate(0,314)">
    <rect x="440" y="636" width="60" height="52" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="3"/><path d="M452,674 A20,20 0 0 1 488,674" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M470,674 L482,650" stroke="#334155" stroke-width="2.5"/><rect x="440" y="726" width="60" height="52" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="3"/><path d="M452,764 A20,20 0 0 1 488,764" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M470,764 L482,740" stroke="#334155" stroke-width="2.5"/>
    <rect x="500" y="622" width="110" height="170" fill="#ffffff"/>
    <path d="M500,659 L600,659 M500,665 L600,665" stroke="#64748b" stroke-width="2"/><path d="M500,749 L600,749 M500,755 L600,755" stroke="#64748b" stroke-width="2"/>
    <text x="612" y="670" text-anchor="start" style="font-size:21px;font-weight:700;fill:#475569">bit</text><text x="612" y="760" text-anchor="start" style="font-size:21px;font-weight:700;fill:#475569">bit</text>
    <rect x="40" y="848" width="640" height="127" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="68" cy="878" r="18" fill="#b45309"/><text x="68" y="884" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="96" y="886" text-anchor="start" style="font-size:26px;font-weight:800;fill:#b45309">Measurement is separate</text><text x="56" y="920" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">It gives one classical bit per qubit (double lines) and</tspan><tspan x="56" dy="27">destroys the superposition. It cannot be undone.</tspan></text>
  </g>
  <g data-f="5" transform="translate(0,314)">
    <rect x="40" y="989" width="640" height="127" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="68" cy="1019" r="18" fill="#16a34a"/><text x="68" y="1025" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="96" y="1027" text-anchor="start" style="font-size:26px;font-weight:800;fill:#16a34a">Try it yourself</text><text x="56" y="1061" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Demo H in Module 8 runs these gates on a small</tspan><tspan x="56" dy="27">simulator and shows every amplitude after every step.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1460" x2="680" y2="1460" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1490" class="note">Ideal gates. Real gates are imperfect (Scene 70).</text>
  </g>
</svg>
