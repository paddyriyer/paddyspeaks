<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1464" width="720" height="1464" font-family="Inter, Arial, sans-serif">
  <title>Scene 61: The Hadamard gate: even odds, not half a particle</title>
  <desc>Five frames. 1, the state ket 0, amplitudes 1 and 0, goes through an H gate and comes out with amplitudes plus 0.707 and plus 0.707, probabilities 0.50 and 0.50. 2, ket 1 goes through H and comes out with plus 0.707 and minus 0.707, also 0.50 and 0.50. 3, the H matrix, one over root two times one, one, one, minus one. 4, a note that a measurement always finds a whole particle, 0 or 1; the half is a probability. 5, applying H twice returns ket 0, because the two contributions to 1 cancel: a first taste of interference.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1464"/>
  <text x="40" y="50" class="k">SCENE 61</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The Hadamard gate: even</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">odds, not half a particle</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">H turns a definite 0 into equal odds of 0 and 1,</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">and does the same to a 1 with a sign flip.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="0" width="640" height="275" rx="16" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <circle cx="74" cy="34" r="20" fill="#7c3aed"/><text x="74" y="41" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">1</text><text x="104" y="42" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">start in |0⟩</text>
    <path d="M52,165 L202,165" stroke="#334155" stroke-width="2"/><rect x="64" y="95.0" width="50" height="70.0" rx="4" fill="#7c3aed"/><text x="89.0" y="86" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#7c3aed">+1.000</text><text x="165.0" y="156" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#475569">0</text>
    <text x="89.0" y="262" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">|0⟩</text><text x="165.0" y="262" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">|1⟩</text>
    <path d="M196,145 L226,145" stroke="#334155" stroke-width="3"/><rect x="226" y="113" width="76" height="64" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="264.0" y="157.0" text-anchor="middle" style="font-size:32px;font-weight:800;fill:#7c3aed">H</text><path d="M302,145 L330,145" stroke="#334155" stroke-width="3"/>
    <path d="M328,165 L478,165" stroke="#334155" stroke-width="2"/><rect x="340" y="115.5" width="50" height="49.5" rx="4" fill="#7c3aed"/><text x="365.0" y="106.50252531694167" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#7c3aed">+0.707</text><rect x="416" y="115.5" width="50" height="49.5" rx="4" fill="#7c3aed"/><text x="441.0" y="106.50252531694167" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#7c3aed">+0.707</text>
    <text x="365.0" y="262" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">|0⟩</text><text x="441.0" y="262" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">|1⟩</text>
    <text x="496" y="145" text-anchor="middle" style="font-size:26px;font-weight:700;fill:#475569">→</text>
    <path d="M510,165 L660,165" stroke="#334155" stroke-width="2"/><rect x="522" y="130.0" width="50" height="35.0" rx="4" fill="#0d9488"/><text x="547.0" y="121.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0d9488">0.50</text><rect x="598" y="130.0" width="50" height="35.0" rx="4" fill="#0d9488"/><text x="623.0" y="121.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0d9488">0.50</text>
    <text x="547.0" y="262" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">P(0)</text><text x="623.0" y="262" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">P(1)</text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="40" y="287" width="640" height="275" rx="16" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <circle cx="74" cy="321" r="20" fill="#7c3aed"/><text x="74" y="328" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">2</text><text x="104" y="329" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">start in |1⟩</text>
    <path d="M52,452 L202,452" stroke="#334155" stroke-width="2"/><text x="89.0" y="443" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#475569">0</text><rect x="140" y="382.0" width="50" height="70.0" rx="4" fill="#7c3aed"/><text x="165.0" y="373" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#7c3aed">+1.000</text>
    <text x="89.0" y="549" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">|0⟩</text><text x="165.0" y="549" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">|1⟩</text>
    <path d="M196,432 L226,432" stroke="#334155" stroke-width="3"/><rect x="226" y="400" width="76" height="64" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="264.0" y="444.0" text-anchor="middle" style="font-size:32px;font-weight:800;fill:#7c3aed">H</text><path d="M302,432 L330,432" stroke="#334155" stroke-width="3"/>
    <path d="M328,452 L478,452" stroke="#334155" stroke-width="2"/><rect x="340" y="402.5" width="50" height="49.5" rx="4" fill="#7c3aed"/><text x="365.0" y="393.50252531694167" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#7c3aed">+0.707</text><rect x="416" y="452.0" width="50" height="49.5" rx="4" fill="#be185d"/><text x="441.0" y="525.4974746830583" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#be185d">−0.707</text>
    <text x="365.0" y="549" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">|0⟩</text><text x="441.0" y="549" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">|1⟩</text>
    <text x="496" y="432" text-anchor="middle" style="font-size:26px;font-weight:700;fill:#475569">→</text>
    <path d="M510,452 L660,452" stroke="#334155" stroke-width="2"/><rect x="522" y="417.0" width="50" height="35.0" rx="4" fill="#0d9488"/><text x="547.0" y="408.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0d9488">0.50</text><rect x="598" y="417.0" width="50" height="35.0" rx="4" fill="#0d9488"/><text x="623.0" y="408.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0d9488">0.50</text>
    <text x="547.0" y="549" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">P(0)</text><text x="623.0" y="549" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">P(1)</text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="40" y="574" width="640" height="196" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="82" cy="618" r="26" fill="#334155"/><text x="82" y="627" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="122" y="628" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">The rule, as a matrix</text>
    <text x="64" y="704.0" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:24px;font-weight:700;fill:#7c3aed">H = 1/√2 ·</text><path d="M232.8,662 L222.8,662 L222.8,732 L232.8,732" fill="none" stroke="#7c3aed" stroke-width="2.5"/><path d="M342.8,662 L352.8,662 L352.8,732 L342.8,732" fill="none" stroke="#7c3aed" stroke-width="2.5"/><text x="262.8" y="686" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:24px;font-weight:700;fill:#7c3aed">1</text><text x="322.8" y="686" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:24px;font-weight:700;fill:#7c3aed">1</text><text x="262.8" y="722" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:24px;font-weight:700;fill:#7c3aed">1</text><text x="322.8" y="722" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:24px;font-weight:700;fill:#7c3aed">−1</text>
    <text x="64" y="754" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">Ideal gates are reversible (unitary).</text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="782" width="640" height="151" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="66" cy="812" r="18" fill="#b45309"/><text x="66" y="818" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="94" y="818" text-anchor="start" style="font-size:26px;font-weight:800;fill:#b45309">Not half a particle</text><text x="56" y="854" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Every measurement finds a whole thing: a 0 or a 1,</tspan><tspan x="56" dy="27">a whole photon or electron. “Half” is a probability.</tspan><tspan x="56" dy="27">Nothing is split in two.</tspan></text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="945" width="640" height="160" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="74" cy="979" r="20" fill="#7c3aed"/><text x="74" y="986" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">5</text><text x="104" y="987" text-anchor="start" style="font-size:22px;font-weight:800;fill:#7c3aed">H twice gives back |0⟩</text>
    <text xml:space="preserve" x="64" y="1026" text-anchor="start" style="white-space:pre;font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#334155">to 0:  0.707·0.707 + 0.707·0.707 = 1</text><text xml:space="preserve" x="64" y="1056" text-anchor="start" style="white-space:pre;font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#334155">to 1:  0.707·0.707 + 0.707·(−0.707) = 0</text><text xml:space="preserve" x="64" y="1086" text-anchor="start" style="white-space:pre;font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#334155">the paths to 1 cancel</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1397" x2="680" y2="1397" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1427" class="note">Ideal gates. Amplitudes to three places.</text>
  </g>
</svg>
