    <rect x="380" y="0" width="300" height="200" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="406" cy="30" r="18" fill="#334155"/><text x="406" y="36" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="434" y="36" text-anchor="start" style="font-size:24px;font-weight:800;fill:#334155">A tagged pallet</text><text x="434" y="66" text-anchor="start" style="font-size:24px;font-weight:800;fill:#334155">arrives</text><text x="396" y="99" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="396" dy="0">Each box carries a</tspan><tspan x="396" dy="27">paper-thin UHF tag: an</tspan><tspan x="396" dy="27">antenna and a chip. No</tspan><tspan x="396" dy="27">battery.</tspan></text>
  </g>
