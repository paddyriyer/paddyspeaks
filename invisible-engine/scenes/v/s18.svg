    <rect x="380" y="397" width="300" height="200" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="406" cy="427" r="18" fill="#2563eb"/><text x="406" y="433" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="434" y="433" text-anchor="start" style="font-size:24px;font-weight:800;fill:#2563eb">Each tag answers</text><text x="434" y="463" text-anchor="start" style="font-size:24px;font-weight:800;fill:#2563eb">in its own slot</text><text x="396" y="496" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="396" dy="0">By backscatter: it</tspan><tspan x="396" dy="27">switches how strongly</tspan><tspan x="396" dy="27">its antenna reflects.</tspan><tspan x="396" dy="27">Many tags a second.</tspan></text>
  </g>
