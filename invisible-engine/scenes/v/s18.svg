<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1600" width="720" height="1600" font-family="Inter, Arial, sans-serif">
  <title>Scene 18: Passive RFID: the warehouse dock door</title>
  <desc>Five frames. A pallet of boxes, each carrying a thin battery-free UHF RFID tag, passes through a dock-door portal with a reader and two antennas. The reader’s 860–960 MHz radio wave powers the tags; the reader sends commands and each tag answers in its own time slot by backscatter, changing how strongly its antenna reflects. The reader passes the tag numbers, with its own door, antenna and time, to an inventory system: the tag sends an identifier, not a location. A final panel contrasts HF tags at 13.56 MHz, which couple magnetically in the near field over centimetres to about a metre, with UHF tags, which use far-field backscatter over several metres.</desc>
