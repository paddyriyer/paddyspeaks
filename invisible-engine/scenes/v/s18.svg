    <path d="M296,352 L268,352" class="a-energy" marker-end="url(#m-energy)"/>
    <rect x="380" y="212" width="300" height="173" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="406" cy="242" r="18" fill="#ea580c"/><text x="406" y="248" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="434" y="248" text-anchor="start" style="font-size:24px;font-weight:800;fill:#ea580c">The wave powers</text><text x="434" y="278" text-anchor="start" style="font-size:24px;font-weight:800;fill:#ea580c">the tags</text><text x="396" y="311" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="396" dy="0">Each tag harvests a tiny</tspan><tspan x="396" dy="27">amount of energy from</tspan><tspan x="396" dy="27">the 860–960 MHz signal.</tspan></text>
  </g>
