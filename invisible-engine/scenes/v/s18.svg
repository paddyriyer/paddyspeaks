    <text x="56" y="770" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:500;fill:#14213d">EPC …0459</text>
    <text x="56" y="794" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:500;fill:#14213d">dock door 3 · ant 2</text>
    <text x="56" y="818" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:500;fill:#14213d">10:42:07</text>
    <rect x="380" y="609" width="300" height="200" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="406" cy="639" r="18" fill="#16a34a"/><text x="406" y="645" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="434" y="645" text-anchor="start" style="font-size:24px;font-weight:800;fill:#16a34a">An ID, not a</text><text x="434" y="675" text-anchor="start" style="font-size:24px;font-weight:800;fill:#16a34a">location</text><text x="396" y="708" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="396" dy="0">The tag sends only its</tspan><tspan x="396" dy="27">number. “Where” is</tspan><tspan x="396" dy="27">inferred: which reader</tspan><tspan x="396" dy="27">heard it, and when.</tspan></text>
  </g>
  <g data-f="5" transform="translate(0,293)">
    <rect x="40" y="844" width="640" height="136" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="64" y="888" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">HF · 13.56 MHz · near field</text>
    <text x="60" y="916" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="60" dy="0">Magnetic (inductive) coupling and load modulation.</tspan><tspan x="60" dy="26">λ ≈ 22 m, so a reader works deep inside λ/2π ≈ 3.5 m.</tspan><tspan x="60" dy="26">Reads at centimetres to about a metre (vicinity tags).</tspan></text>
    <rect x="605.0" y="858.0" width="54" height="40" rx="18" class="coil"/>
    <rect x="611.0" y="864.0" width="42" height="28" rx="15" class="coil"/>
    <rect x="617.0" y="870.0" width="30" height="16" rx="12" class="coil"/>
    <rect x="40" y="988" width="640" height="136" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="64" y="1032" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">UHF · 860–960 MHz · far field</text>
    <text x="60" y="1060" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="60" dy="0">Radiative coupling; the tag replies by backscatter.</tspan><tspan x="60" dy="26">λ ≈ 33 cm: a tag a metre away is three wavelengths out.</tspan><tspan x="60" dy="26">Reads at several metres (typical; varies widely).</tspan></text>
    <rect x="581" y="1010" width="86" height="31" rx="6" fill="#0f172a" opacity="0.10"/><rect x="578" y="1006" width="86" height="31" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><path d="M611,1021 L605,1030 L599,1013 L593,1030 L587,1013 L581,1030 L575,1013" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/><path d="M631,1021 L637,1030 L643,1013 L649,1030 L655,1013 L661,1030 L667,1013" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/><rect x="612" y="1012" width="18" height="18" rx="3" fill="#111827"/>
  </g>
