  <rect class="bg" width="720" height="1600"/>
  <text x="40" y="50" class="k">SCENE 18</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Passive RFID: the</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">warehouse dock door</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">The tag says only “I am number …”. The system</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">works out where from which reader heard it, and</text>
  <text x="40" y="267" style="font-size:23px;fill:#475569">when.</text>
