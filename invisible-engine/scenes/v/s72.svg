<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1600" width="720" height="1600" font-family="Inter, Arial, sans-serif">
  <title>Scene 72: Quantum and security: which locks, and when</title>
  <desc>Five frames. 1, public-key cryptography (RSA and elliptic curves, as used for key exchange and signatures): Shor’s algorithm would break it on a large fault-tolerant quantum computer, which is not publicly known to exist. 2, symmetric keys and hashes: an idealised Grover search halves the exponent — AES-128 from 2^128 to 2^64 steps, AES-256 to 2^128, SHA-256 preimages to 2^128 — and it parallelises poorly, so the usual response is longer keys, not new ciphers. 3, published resource estimates for breaking RSA-2048 have fallen: about 20 million noisy qubits in 2019, under a million in 2025, each under stated assumptions. 4, harvest now, decrypt later matters only when long-lived secret data is encrypted with quantum-vulnerable keys and someone captures and keeps it. 5, NIST published post-quantum standards in August 2024 — ML-KEM, ML-DSA and SLH-DSA (FIPS 203, 204, 205) — which run on ordinary chips; Module 10 covers migration.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1600"/>
  <text x="40" y="50" class="k">SCENE 72</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Quantum and security:</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">which locks, and when</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Some locks would fail, some only weaken, and the</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">replacements already exist.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="0" width="640" height="181" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="68" cy="30" r="18" fill="#7c3aed"/><text x="68" y="36" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="96" y="38" text-anchor="start" style="font-size:26px;font-weight:800;fill:#7c3aed">Public keys: RSA and elliptic curves</text><text x="56" y="72" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Key exchange and signatures rest on factoring</tspan><tspan x="56" dy="27">or discrete logs. Shor would solve them — IF a</tspan><tspan x="56" dy="27">large, fault-tolerant quantum computer exists.</tspan><tspan x="56" dy="27">None is publicly known to exist today.</tspan></text>
    <path d="M613,106 L613,93 a18,18 0 0 1 36,0 L649,106" fill="none" stroke="#7c3aed" stroke-width="6.5"/><rect x="600" y="103" width="62" height="49" rx="8" fill="#7c3aed"/><circle cx="631" cy="124" r="6" fill="#ffffff"/><rect x="629" y="127" width="5" height="13" fill="#ffffff"/>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <circle cx="58" cy="215" r="18" fill="#2563eb"/><text x="58" y="221" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="86" y="222" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Symmetric keys and hashes</text>
    <rect x="40" y="237" width="640" height="60" fill="#eef2ff" stroke="#e2e8f0" stroke-width="1"/><text x="110.0" y="274" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">Primitive</text><text x="260.0" y="261" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d"><tspan x="260.0" dy="0">Classical</tspan><tspan x="260.0" dy="26">generic attack</tspan></text><text x="405.0" y="261" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d"><tspan x="405.0" dy="0">Idealised</tspan><tspan x="405.0" dy="26">Grover</tspan></text><text x="575.0" y="274" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">Usual response</text><rect x="40" y="297" width="640" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="110.0" y="334" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">AES-128 key</text><text x="260.0" y="334" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">2^128</text><text x="405.0" y="334" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">2^64</text><text x="575.0" y="321" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d"><tspan x="575.0" dy="0">use 256-bit for</tspan><tspan x="575.0" dy="26">long-lived data</tspan></text><rect x="40" y="357" width="640" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="110.0" y="381" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">AES-256 key</text><text x="260.0" y="381" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">2^256</text><text x="405.0" y="381" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">2^128</text><text x="575.0" y="381" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">wide margin</text><rect x="40" y="391" width="640" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="110.0" y="415" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d"><tspan x="110.0" dy="0">SHA-256</tspan><tspan x="110.0" dy="26">preimage</tspan></text><text x="260.0" y="428" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">2^256</text><text x="405.0" y="428" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">2^128</text><text x="575.0" y="428" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">margin remains</text>
    <text x="40" y="483" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="40" dy="0">Grover gives a square-root speedup in an idealised</tspan><tspan x="40" dy="27">count, and splitting it across k machines saves only √k.</tspan><tspan x="40" dy="27">Hashes: collision search gains little in practice.</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="40" y="559" width="640" height="240" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="68" cy="591" r="18" fill="#0d9488"/><text x="68" y="597" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="96" y="599" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Published estimates for RSA-2048 (research)</text>
    <rect x="140" y="615" width="460" height="28" rx="6" fill="#5eead4"/><text x="60" y="637" text-anchor="start" style="font-size:21px;font-weight:800;fill:#0f766e">2019</text>
    <text x="60" y="665" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">Gidney &amp; Ekerå: ~20 million noisy qubits, ~8 hours</text>
    <rect x="140" y="675" width="378" height="28" rx="6" fill="#5eead4"/><text x="60" y="697" text-anchor="start" style="font-size:21px;font-weight:800;fill:#0f766e">2025</text>
    <text x="60" y="725" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">Gidney: under 1 million noisy qubits, under a week</text>
    <text x="60" y="755" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#475569"><tspan x="60" dy="0">Bar length: log scale. Estimates change with new methods</tspan><tspan x="60" dy="26">and hardware.</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="811" width="640" height="154" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="68" cy="841" r="18" fill="#b45309"/><text x="68" y="847" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="96" y="849" text-anchor="start" style="font-size:26px;font-weight:800;fill:#b45309">Harvest now, decrypt later</text><text x="56" y="883" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Matters only when all three hold: the data must stay</tspan><tspan x="56" dy="27">secret for years; it is protected by quantum-vulnerable</tspan><tspan x="56" dy="27">key exchange; and someone captures and keeps it.</tspan></text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="979" width="640" height="235" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="68" cy="1009" r="18" fill="#16a34a"/><text x="68" y="1015" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="96" y="1017" text-anchor="start" style="font-size:26px;font-weight:800;fill:#16a34a">Replacements exist, on ordinary chips</text><text x="56" y="1051" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">NIST, August 2024: ML-KEM (FIPS 203) for key</tspan><tspan x="56" dy="27">establishment; ML-DSA (FIPS 204) and SLH-DSA (FIPS 205)</tspan><tspan x="56" dy="27">for signatures. Post-quantum cryptography is classical</tspan><tspan x="56" dy="27">cryptography designed to resist known quantum attacks.</tspan><tspan x="56" dy="27">What migrating cards, trackers and accounts involves is</tspan><tspan x="56" dy="27">Module 10.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1506" x2="680" y2="1506" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1536" class="note">Nothing here is broken today. Grover figures idealised;</text>
    <text x="40" y="1563" class="note">estimates dated.</text>
  </g>
</svg>
