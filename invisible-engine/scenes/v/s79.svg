    <text x="60" y="688" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Vendor finder</text><text x="60" y="714" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">networks</text>
    <path d="M246,728 a23,23 0 0 1 2,-40 a30,30 0 0 1 58,-8 a21,21 0 0 1 5,47 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
    <text x="60" y="750" text-anchor="start" style="font-size:20px;font-weight:700;fill:#14213d">relays, accounts</text>
    <text x="60" y="782" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">Run by Apple, Google,</text><text x="60" y="807" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">Samsung, Life360.</text><text x="60" y="832" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">No company sees inside.</text>
    <rect x="368" y="652" width="312" height="200" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="388" y="688" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">The wireless</text><text x="388" y="714" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">environment</text>
    <path d="M618,686 q10,14 0,28" fill="none" stroke="#2563eb" stroke-width="4.0" stroke-linecap="round" opacity="1.00"/><path d="M632,674 q16,26 0,52" fill="none" stroke="#2563eb" stroke-width="4.0" stroke-linecap="round" opacity="0.80"/><path d="M646,662 q22,38 0,76" fill="none" stroke="#2563eb" stroke-width="4.0" stroke-linecap="round" opacity="0.60"/>
    <text x="388" y="756" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">radio reaches everyone;</text><text x="388" y="783" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">nobody owns the air</text>
    <text x="388" y="832" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#475569">Arcs are illustrative.</text>
  </g>
  <g data-f="4" transform="translate(0,293)">
    <circle cx="378" cy="519" r="15" fill="#0f172a" opacity="0.13"/><circle cx="375" cy="514" r="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="375" cy="514" r="9" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="353" y="492" width="44" height="44" rx="8" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="5 4"/>
    <rect x="436" y="384" width="244" height="186" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><text x="452" y="420" text-anchor="start" style="font-size:22px;font-weight:800;fill:#b45309">A private tracker</text><text x="452" y="452" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="452" dy="0">Not the company’s.</tspan><tspan x="452" dy="27">It cannot read it</tspan><tspan x="452" dy="27">or switch it off:</tspan><tspan x="452" dy="27">advise and support.</tspan></text>
  </g>
  <g data-f="5" transform="translate(0,293)">
    <rect x="40" y="866" width="312" height="132" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <circle cx="64" cy="894" r="15" fill="#16a34a"/><text x="64" y="899" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#ffffff">1</text>
    <text x="86" y="901" text-anchor="start" style="font-size:20px;font-weight:800;fill:#16a34a">Controls directly</text>
    <text x="56" y="932" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">company property,</text><text x="56" y="957" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">managed devices and</text><text x="56" y="982" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">accounts</text>
    <rect x="368" y="866" width="312" height="132" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="392" cy="894" r="15" fill="#2563eb"/><text x="392" y="899" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#ffffff">2</text>
    <text x="414" y="901" text-anchor="start" style="font-size:20px;font-weight:800;fill:#2563eb">Can set by policy</text>
    <text x="384" y="932" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">managed phone settings,</text><text x="384" y="957" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">procurement terms,</text><text x="384" y="982" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">visitor rules</text>
    <rect x="40" y="1008" width="312" height="132" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <circle cx="64" cy="1036" r="15" fill="#b45309"/><text x="64" y="1041" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#ffffff">3</text>
    <text x="86" y="1043" text-anchor="start" style="font-size:20px;font-weight:800;fill:#b45309">Can advise and support</text>
    <text x="56" y="1074" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">personal phones and</text><text x="56" y="1099" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">accounts, privately</text><text x="56" y="1124" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">owned trackers</text>
    <rect x="368" y="1008" width="312" height="132" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="392" cy="1036" r="15" fill="#334155"/><text x="392" y="1041" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#ffffff">4</text>
    <text x="414" y="1043" text-anchor="start" style="font-size:20px;font-weight:800;fill:#334155">Cannot reach</text>
    <text x="384" y="1074" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">vendor networks — only</text><text x="384" y="1099" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">through procurement</text><text x="384" y="1124" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">and legal requests</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1457" x2="680" y2="1457" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1487" class="note">Schematic. Organisations differ; the bands, not the</text>
    <text x="40" y="1514" class="note">drawing, are the point.</text>
    <rect x="40" y="1541" width="34" height="18" rx="3" class="bound" style="stroke-width:4"/>
    <text x="86" y="1555" class="s">Trust or hardware boundary</text>
  </g>
</svg>
