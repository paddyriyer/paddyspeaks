  <rect class="bg" width="720" height="1585"/>
  <text x="40" y="50" class="k">SCENE 79</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Where the company’s</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">authority stops</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Most of a company’s leverage is over its own</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">assets, accounts and processes — not over the</text>
  <text x="40" y="267" style="font-size:23px;fill:#475569">networks.</text>
