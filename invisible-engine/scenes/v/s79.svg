    <text x="40" y="578" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">body, home and</text><text x="40" y="604" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">personal phone</text><text x="40" y="630" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">are their own</text>
