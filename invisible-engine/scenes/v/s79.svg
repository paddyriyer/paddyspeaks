    <path d="M363,462 L363,447 L386,447 L386,462" fill="none" stroke="#334155" stroke-width="2.3"/><rect x="351" y="469" width="57" height="72" rx="7" fill="#0f172a" opacity="0.13"/><rect x="346" y="462" width="57" height="72" rx="7" fill="#64748b"/><path d="M363,467 L363,529" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.9"/><path d="M374,467 L374,529" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.9"/><path d="M386,467 L386,529" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.9"/><circle cx="357" cy="539" r="4" fill="#334155"/><circle cx="392" cy="539" r="4" fill="#334155"/>
    <text x="296" y="550" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#14213d">visitor</text>
    <text x="232" y="578" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">their own bag,</text><text x="232" y="604" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">their own phone</text>
  </g>
  <g data-f="3" transform="translate(0,293)">
