    <text x="64" y="40" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">The company</text><text x="64" y="70" text-anchor="start" style="font-size:21px;font-weight:600;fill:#15803d">controls these directly</text>
    <text x="390" y="36" text-anchor="start" style="font-size:20px;font-weight:700;fill:#166534">Company property ·</text><text x="390" y="60" text-anchor="start" style="font-size:20px;font-weight:700;fill:#166534">managed devices ·</text><text x="390" y="84" text-anchor="start" style="font-size:20px;font-weight:700;fill:#166534">managed accounts</text>
    <rect x="74" y="112" width="110" height="196" rx="6" fill="#0f172a" opacity="0.12"/><rect x="70" y="106" width="110" height="196" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><rect x="62" y="94" width="126" height="16" rx="4" fill="#334155"/><rect x="84" y="122" width="17" height="26" rx="3" fill="#bfdbfe" stroke="#475569" stroke-width="1.5"/><rect x="113" y="122" width="17" height="26" rx="3" fill="#bfdbfe" stroke="#475569" stroke-width="1.5"/><rect x="143" y="122" width="17" height="26" rx="3" fill="#bfdbfe" stroke="#475569" stroke-width="1.5"/><rect x="84" y="158" width="17" height="26" rx="3" fill="#bfdbfe" stroke="#475569" stroke-width="1.5"/><rect x="113" y="158" width="17" height="26" rx="3" fill="#bfdbfe" stroke="#475569" stroke-width="1.5"/><rect x="143" y="158" width="17" height="26" rx="3" fill="#bfdbfe" stroke="#475569" stroke-width="1.5"/><rect x="84" y="194" width="17" height="26" rx="3" fill="#bfdbfe" stroke="#475569" stroke-width="1.5"/><rect x="113" y="194" width="17" height="26" rx="3" fill="#bfdbfe" stroke="#475569" stroke-width="1.5"/><rect x="143" y="194" width="17" height="26" rx="3" fill="#bfdbfe" stroke="#475569" stroke-width="1.5"/><rect x="84" y="230" width="17" height="26" rx="3" fill="#bfdbfe" stroke="#475569" stroke-width="1.5"/><rect x="113" y="230" width="17" height="26" rx="3" fill="#bfdbfe" stroke="#475569" stroke-width="1.5"/><rect x="143" y="230" width="17" height="26" rx="3" fill="#bfdbfe" stroke="#475569" stroke-width="1.5"/><rect x="107" y="258" width="36" height="44" rx="3" fill="#64748b"/>
    <text x="125" y="328" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#334155">office</text>
    <rect x="208" y="200" width="120" height="84" rx="8" fill="#1f2937"/><rect x="216" y="208" width="104" height="66" rx="4" fill="#e0f2fe"/><path d="M198,298 L208,284 L328,284 L338,298 Z" fill="#475569"/>
    <circle cx="353" cy="197" r="16" fill="#0f172a" opacity="0.13"/><circle cx="350" cy="192" r="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="350" cy="192" r="10" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="268" y="328" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#334155">company laptop</text><text x="268" y="352" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#475569">+ asset tag</text>
    <rect x="403" y="131" width="82" height="164" rx="14" fill="#0f172a" opacity="0.14"/><rect x="398" y="124" width="82" height="164" rx="14" fill="#111827"/><rect x="403" y="129" width="72" height="154" rx="11" fill="#dcfce7"/><rect x="428" y="132" width="23" height="6" rx="3" fill="#111827"/>
    <text x="439" y="328" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#334155">managed</text><text x="439" y="352" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#334155">phone</text>
    <path d="M537,244 a34,34 0 0 1 3,-58 a44,44 0 0 1 85,-11 a31,31 0 0 1 7,69 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
    <text x="585" y="206" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#14213d">managed</text><text x="585" y="228" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#14213d">account</text>
    <text x="585" y="328" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#475569">company-owned,</text><text x="585" y="352" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#475569">strong sign-in</text>
  </g>
