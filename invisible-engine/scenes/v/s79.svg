<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1585" width="720" height="1585" font-family="Inter, Arial, sans-serif">
  <title>Scene 79: Where the company’s authority stops</title>
  <desc>Five frames. 1, inside a thick company boundary: the office, a company laptop with an asset tag, a corporate-managed phone and the company’s managed cloud account; the company controls these directly. 2, outside the boundary, two people: an employee, whose body, home and personal phone are their own, and a visitor wearing a visitor badge and carrying their own bag. 3, further out, the vendors’ finder networks and their relays and accounts, run by the vendors, which no company can see inside; and the wireless environment, radio that reaches everyone and that nobody owns. 4, a privately owned tracker on the visitor’s bag: not the company’s; it cannot read it or switch it off, only advise and support. 5, four bands of authority: controls directly (company property, managed devices and accounts); can set by policy (managed phone settings, procurement terms, visitor rules); can only advise and support (personal phones, personal accounts, private trackers); cannot reach (vendor networks, except through procurement and legal requests).</desc>
