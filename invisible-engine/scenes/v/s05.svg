<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1434" width="720" height="1434" font-family="Inter, Arial, sans-serif">
  <title>Scene 05: Three antennas, three jobs</title>
  <desc>Three frames. A card-sized loop antenna with a few turns that couples magnetically at 13.56 MHz; a small Bluetooth antenna, a printed trace roughly a quarter wavelength long at 2.4 GHz, that radiates; and an Ultra Wideband module with several antennas, built for wide bandwidth and angle measurement.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1434"/>
  <text x="40" y="50" class="k">SCENE 05</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Three antennas, three</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">jobs</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">A loop that couples, a trace that radiates, an</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">array that times and points.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="0" width="640" height="340" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="82" cy="44" r="26" fill="#ea580c"/><text x="82" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="122" y="54" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">Loop / coil</text><text x="122" y="88" text-anchor="start" style="font-size:21px;font-weight:600;fill:#ea580c">NFC · HF RFID</text>
    <rect x="68" y="126" width="220" height="139" rx="11" fill="#0f172a" opacity="0.12"/><rect x="64" y="120" width="220" height="139" rx="11" fill="#1e3a8a"/><path d="M64,206 Q174,182 284,217 L284,248 Q284,259 273,259 L75,259 Q64,259 64,248 Z" fill="#1d4ed8" opacity="0.55"/><rect x="75" y="131" width="136" height="117" rx="8" fill="#fdf6e3" stroke="#d6c7a1" stroke-width="1.5"/><rect x="80.5" y="136.5" width="125.4" height="105.6" rx="7" fill="none" stroke="#b45309" stroke-width="1.6"/><rect x="84.5" y="140.5" width="117.5" height="97.7" rx="5" fill="none" stroke="#b45309" stroke-width="1.6"/><rect x="88.4" y="144.4" width="109.6" height="89.8" rx="3" fill="none" stroke="#b45309" stroke-width="1.6"/><rect x="92.4" y="148.4" width="101.6" height="81.8" rx="3" fill="none" stroke="#b45309" stroke-width="1.6"/><rect x="123.4" y="165.738" width="33.0" height="33.263999999999996" rx="5" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M139.9,165.738 L139.9,199.002 M123.4,176.826 L135.94,176.826 M143.86,176.826 L156.4,176.826 M123.4,187.914 L135.94,187.914 M143.86,187.914 L156.4,187.914" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="135.94" y="173.05608" width="7.92" height="18.62784" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/>
    <text x="174" y="290" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#9a3412"><tspan x="174" dy="0">85.60 × 53.98 mm</tspan><tspan x="174" dy="27">card (ID-1)</tspan></text>
    <text x="304" y="136" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d"><tspan x="304" dy="0">Job: couple to a reader coil</tspan><tspan x="304" dy="29">through the magnetic near</tspan><tspan x="304" dy="29">field.</tspan></text>
    <text x="304" y="235" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• a few turns near the edge</text>
    <text x="304" y="262" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• tuned near 13.56 MHz</text>
    <text x="304" y="289" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• more area, more flux</text>
    <text x="304" y="316" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• not built to radiate far</text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="40" y="356" width="640" height="370" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="82" cy="400" r="26" fill="#2563eb"/><text x="82" y="409" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="122" y="410" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">Small radiator</text><text x="122" y="444" text-anchor="start" style="font-size:21px;font-weight:600;fill:#2563eb">Bluetooth LE · 2.4 GHz</text>
    <g transform="translate(64,476) scale(0.63)"><rect x="0" y="0" width="350" height="230" rx="14" fill="#166534" stroke="#14532d" stroke-width="3"/><path d="M65,190 L65,40 L135,40 L135,100 L205,100 L205,40 L305,40" fill="none" stroke="#fcd34d" stroke-width="7" stroke-linejoin="round"/><rect x="35" y="170" width="70" height="44" rx="4" fill="#111827"/><circle cx="265" cy="175" r="18" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/></g>
    <text x="174" y="652" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#1e3a8a"><tspan x="174" dy="0">printed trace ≈</tspan><tspan x="174" dy="27">λ/4 ≈ 3 cm, often</tspan><tspan x="174" dy="27">meandered</tspan></text>
    <text x="304" y="492" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d"><tspan x="304" dy="0">Job: launch a wave that phones</tspan><tspan x="304" dy="29">metres away can hear.</tspan></text>
    <text x="304" y="562" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• size is a fraction of λ</text>
    <text x="304" y="589" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• efficiency vs size vs bandwidth</text>
    <text x="304" y="616" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• detuned by hands and bodies</text>
    <text x="304" y="643" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• pattern is not a neat sphere</text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="40" y="742" width="640" height="346" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="82" cy="786" r="26" fill="#7c3aed"/><text x="82" y="795" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="122" y="796" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">Wideband array</text><text x="122" y="830" text-anchor="start" style="font-size:21px;font-weight:600;fill:#7c3aed">UWB · ~6.5 / 8 GHz</text>
    <g transform="translate(64,862) scale(0.63)"><rect x="0" y="0" width="350" height="230" rx="14" fill="#1e1b4b" stroke="#312e81" stroke-width="3"/><rect x="44" y="29" width="52" height="52" rx="6" fill="#fcd34d" stroke="#a16207" stroke-width="3"/><rect x="254" y="29" width="52" height="52" rx="6" fill="#fcd34d" stroke="#a16207" stroke-width="3"/><rect x="149" y="149" width="52" height="52" rx="6" fill="#fcd34d" stroke="#a16207" stroke-width="3"/><path d="M96,55 L254,55 M70,81 L160,165 M280,81 L190,165" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="5 5"/></g>
    <text x="174" y="1038" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#5b21b6"><tspan x="174" dy="0">several antennas →</tspan><tspan x="174" dy="27">angle of arrival</tspan></text>
    <text x="304" y="878" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d"><tspan x="304" dy="0">Job: send and time very short</tspan><tspan x="304" dy="29">pulses over ≥ 500 MHz.</tspan></text>
    <text x="304" y="948" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• wide bandwidth = sharp timing</text>
    <text x="304" y="975" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• phase differences give direction</text>
    <text x="304" y="1002" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• needs a compatible partner</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1367" x2="680" y2="1367" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1397" class="note">Schematic; real antenna geometry varies by product.</text>
  </g>
</svg>
