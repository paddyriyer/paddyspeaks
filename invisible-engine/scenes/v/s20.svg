    <text x="296" y="760" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">Doors</text>
    <text x="440" y="760" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">Hours</text>
    <text x="56" y="800" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:400;fill:#334155">48213</text>
    <text x="150" y="800" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">A. Rao*</text>
    <text x="296" y="800" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">Lab, Lobby</text>
    <text x="440" y="800" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">07–19</text>
    <text x="56" y="830" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:400;fill:#334155">48214</text>
    <text x="150" y="830" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">B. Lee*</text>
    <text x="296" y="830" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">Lobby</text>
    <text x="440" y="830" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">08–18</text>
    <text x="56" y="860" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:400;fill:#334155">48215</text>
    <text x="150" y="860" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">C. Diaz*</text>
    <text x="296" y="860" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">All</text>
    <text x="440" y="860" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">any</text>
    <text x="56" y="888" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#64748b">* fictional</text>
  </g>
