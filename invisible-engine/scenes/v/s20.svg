  <g data-f="3" transform="translate(0,262)">
    <rect x="398" y="404" width="96" height="34" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="412" cy="421" r="4" fill="#22c55e"/><rect x="430" y="417" width="51" height="8" rx="3" fill="#94a3b8"/><rect x="398" y="444" width="96" height="34" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="412" cy="461" r="4" fill="#22c55e"/><rect x="430" y="457" width="51" height="8" rx="3" fill="#94a3b8"/><rect x="398" y="484" width="96" height="34" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="412" cy="501" r="4" fill="#22c55e"/><rect x="430" y="497" width="51" height="8" rx="3" fill="#94a3b8"/>
    <text x="506" y="440" text-anchor="start" style="font-size:21px;font-weight:700;fill:#334155"><tspan x="506" dy="0">Access-control</tspan><tspan x="506" dy="27">server</tspan></text>
