    <rect x="194" y="170" width="10" height="60" rx="2" fill="#c2410c"/>
    <circle cx="166" cy="376" r="16" fill="#ea580c"/><text x="166" y="382" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#ffffff">4</text>
    <rect x="40" y="606" width="640" height="112" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="56" y="636" text-anchor="start" style="font-size:21px;font-weight:800;fill:#166534">Audit log</text>
    <text x="56" y="668" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:500;fill:#14213d">10:42:07 · badge 48213 · Lab door · granted</text>
    <text x="56" y="698" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:500;fill:#14213d">10:42:09 · door opened</text>
    <path d="M80,514 L80,600" class="a-plain" marker-end="url(#m-plain)"/>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="914" width="640" height="232" rx="14" class="hz"/>
    <circle cx="78" cy="952" r="20" fill="#dc2626"/><text x="78" y="959" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">5</text>
    <text x="110" y="960" text-anchor="start" style="font-size:23px;font-weight:800;fill:#991b1b">The number is a claim, not proof</text>
    <text x="60" y="996" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="60" dy="0">If a badge sends only a fixed number, a copy sends the</tspan><tspan x="60" dy="27">same number, and the server cannot tell them apart.</tspan><tspan x="60" dy="27">Stronger badges prove they hold a secret key (Scene 21).</tspan><tspan x="60" dy="27">Either way, a badge shows possession of a card, not who</tspan><tspan x="60" dy="27">is holding it: sites that need more add a PIN, a face</tspan><tspan x="60" dy="27">check or a guard.</tspan></text>
  </g>
