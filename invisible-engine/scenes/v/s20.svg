  <rect class="bg" width="720" height="1600"/>
  <text x="40" y="50" class="k">SCENE 20</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">An office badge: the door</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">asks a server</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">The badge carries a number. The decision lives in</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">a server, in a table someone maintains.</text>
