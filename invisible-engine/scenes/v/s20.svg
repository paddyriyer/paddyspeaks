    <rect x="457" y="88" width="17" height="30" rx="6" fill="#94a3b8"/><rect x="434" y="116" width="72" height="104" rx="12" fill="#0f172a" opacity="0.12"/><rect x="430" y="110" width="72" height="104" rx="12" fill="#ffffff" stroke="#334155" stroke-width="3"/><rect x="430" y="110" width="72" height="34" rx="12" fill="#0f766e"/><rect x="430" y="132" width="72" height="12" fill="#0f766e"/><text x="466.0" y="134" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#ffffff">STAFF</text><circle cx="466" cy="157" r="12" fill="#cbd5e1"/><rect x="444" y="181" width="43" height="5" rx="4" fill="#94a3b8"/><rect x="450" y="191" width="32" height="4" rx="4" fill="#cbd5e1"/>
    <rect x="254" y="106" width="94" height="144" rx="14" fill="#0f172a" opacity="0.14"/><rect x="250" y="100" width="94" height="144" rx="14" fill="#1f2937"/><circle cx="297" cy="160" r="26" fill="none" stroke="#9ca3af" stroke-width="2.5"/><path d="M285.7,154.7 q4.2,4.8 0,9.5" fill="none" stroke="#e5e7eb" stroke-width="2.125" stroke-linecap="round"/><path d="M291.1,150.6 q7.1,8.9 0,17.8" fill="none" stroke="#e5e7eb" stroke-width="2.125" stroke-linecap="round"/><path d="M296.4,146.4 q10.1,13.1 0,26.2" fill="none" stroke="#e5e7eb" stroke-width="2.125" stroke-linecap="round"/><circle cx="297" cy="219" r="7" fill="#22c55e"/>
    <path d="M424,175 L352,175" class="a-signal" marker-end="url(#m-signal)"/>
    <circle cx="388" cy="142" r="16" fill="#2563eb"/><text x="388" y="148" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#ffffff">1</text>
    <text x="470" y="300" class="sb" text-anchor="start">Tap the badge</text>
  </g>
