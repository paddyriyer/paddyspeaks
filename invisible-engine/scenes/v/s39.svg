<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1592" width="720" height="1592" font-family="Inter, Arial, sans-serif">
  <title>Scene 39: Finding it nearby is a different mechanism</title>
  <desc>Five frames. First, Find My’s map shows a last-seen point built from sightings, a global location. Then, in the same room, the owner’s iPhone asks the tag to play a sound over Bluetooth; a compatible iPhone with ultra-wideband exchanges ranging messages with the tag and measures distance from the time of flight; the phone combines that with its camera, ARKit and motion sensors to point an arrow; and a note that the Bluetooth advertisement itself carries no direction, and Precision Finding needs an iPhone with ultra-wideband: iPhone 11 or later, not iPhone SE.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1592"/>
  <text x="40" y="50" class="k">SCENE 39</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Finding it nearby is a</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">different mechanism</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">The map says roughly where. Up close, sound and</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">ultra-wideband say which way and how far.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="0" width="640" height="282" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="82" cy="44" r="26" fill="#334155"/><text x="82" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="122" y="54" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Far away: the map</text>
    <rect x="69" y="77" width="120" height="200" rx="20" fill="#0f172a" opacity="0.14"/><rect x="64" y="70" width="120" height="200" rx="20" fill="#111827"/><rect x="71" y="77" width="106" height="186" rx="16" fill="#f8fafc"/><rect x="107" y="82" width="34" height="8" rx="4" fill="#111827"/>
    <rect x="74" y="100" width="100" height="120" rx="10" fill="#ecfdf5" stroke="#94a3b8" stroke-width="2"/><path d="M74,142 L174,166 M104,100 L119,220 M144,100 L136,220" stroke="#ffffff" stroke-width="9"/><path d="M74,142 L174,166 M104,100 L119,220 M144,100 L136,220" stroke="#cbd5e1" stroke-width="1.5"/><rect x="79" y="174" width="18" height="30" rx="4" fill="#bbf7d0"/>
    <path d="M124,192 C109,170 109,152 124,150 C139,152 139,170 124,192 Z" fill="#2563eb"/><circle cx="124" cy="163" r="5" fill="#ffffff"/>
    <text x="216" y="160" text-anchor="start" style="font-size:21px;font-weight:700;fill:#14213d">last seen, 2 km</text>
    <text x="216" y="210" text-anchor="start" style="font-size:21px;font-weight:600;fill:#475569">global location, from sightings</text>
    <path d="M40,302 L680,302" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="110" cy="354" r="28" fill="#475569"/><path d="M71,487 L71,418 Q71,390 98,390 L122,390 Q149,390 149,418 L149,487 Z" fill="#475569"/><rect x="80" y="478" width="23" height="101" rx="9" fill="#475569"/><rect x="117" y="478" width="23" height="101" rx="9" fill="#475569"/><rect x="149" y="432" width="21" height="37" rx="5" fill="#111827" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="470" y="586" width="200" height="70" rx="20" fill="#cbd5e1"/><rect x="450" y="550" width="240" height="50" rx="20" fill="#94a3b8"/>
    <circle cx="573" cy="537" r="26" fill="#0f172a" opacity="0.13"/><circle cx="570" cy="532" r="26" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="570" cy="532" r="16" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="570" y="690" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#475569">same room</text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <path d="M180,486 L540,524" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="218" y="444" width="264" height="32" rx="6" class="lab"/>
    <text x="350" y="466" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#1d4ed8"><tspan x="350" dy="0">Bluetooth: play sound</tspan></text>
    <path d="M606,487 L614,487 L626,477 L626,511 L614,501 L606,501 Z" fill="#334155"/><path d="M633,487 q6,7 0,14" fill="none" stroke="#334155" stroke-width="2.4" stroke-linecap="round"/><path d="M640,482 q8,12 0,24" fill="none" stroke="#334155" stroke-width="2.4" stroke-linecap="round"/><path d="M647,477 q11,17 0,34" fill="none" stroke="#334155" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="40" y="716" width="640" height="116" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="746" r="18" fill="#2563eb"/><text x="66" y="752" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="94" y="752" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">Play Sound (Bluetooth)</text><text x="56" y="788" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">In Bluetooth range, the owner asks the tag to beep.</text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <path d="M180,556 L542,548" class="a-signal" marker-end="url(#m-signal)" marker-start="url(#ms-signal)"/>
    <rect x="224" y="576" width="252" height="32" rx="6" class="lab"/>
    <text x="350" y="598" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#1d4ed8"><tspan x="350" dy="0">UWB ranging exchange</tspan></text>
    <rect x="40" y="844" width="640" height="143" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="874" r="18" fill="#2563eb"/><text x="66" y="880" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="94" y="880" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">Distance from time of flight</text><text x="56" y="916" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Ultra-wideband messages go back and forth; the</tspan><tspan x="56" dy="27">round-trip time gives the distance. A ranging</tspan><tspan x="56" dy="27">exchange, not a location broadcast.</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="290" y="330" width="390" height="104" rx="16" fill="#111827"/>
    <path d="M318,382 L362,382 L362,362 L400,390 L362,418 L362,398 L318,398 Z" fill="#22c55e" transform="rotate(-25 358 390)"/>
    <text x="424" y="378" text-anchor="start" style="font-size:32px;font-weight:800;fill:#ffffff">8 m</text><text x="424" y="414" text-anchor="start" style="font-size:21px;font-weight:600;fill:#e5e7eb">to the right</text>
    <text x="668" y="424" text-anchor="end" style="font-style:italic;font-size:20px;font-weight:400;fill:#9ca3af">illustrative</text>
    <rect x="40" y="999" width="640" height="116" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="66" cy="1029" r="18" fill="#0d9488"/><text x="66" y="1035" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="94" y="1035" text-anchor="start" style="font-size:26px;font-weight:800;fill:#0d9488">Direction needs the phone’s sensors</text><text x="56" y="1071" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">UWB with camera, ARKit, accelerometer and</tspan><tspan x="56" dy="27">gyroscope. Illustrative readout.</tspan></text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="1127" width="640" height="116" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="66" cy="1157" r="18" fill="#b45309"/><text x="66" y="1163" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="94" y="1163" text-anchor="start" style="font-size:26px;font-weight:800;fill:#b45309">No direction in the whisper</text><text x="56" y="1199" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">The BLE advert carries no bearing. Needs iPhone 11</tspan><tspan x="56" dy="27">or later, not iPhone SE.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1526" x2="680" y2="1526" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M40,1557 L74,1557" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="86" y="1562" class="s">Radio signal or wave</text>
  </g>
</svg>
