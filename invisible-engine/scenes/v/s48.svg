<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1564" width="720" height="1564" font-family="Inter, Arial, sans-serif">
  <title>Scene 48: Where the account is the weak point</title>
  <desc>Five frames around one account with its trusted devices. Seven risks appear as red dashed cards, each with what it needs and what it exposes: 1, the account, its trusted devices and shares. 2, a shared or reused password, and an old trusted device nobody manages. 3, coercive access by someone close, and a share nobody remembers. 4, account takeover, and abuse of account recovery. 5, shared household permissions, and the defences: review devices and sharing (for example Apple’s Safety Check), a unique password with two-factor authentication, and a recovery method you control.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1564"/>
  <text x="40" y="50" class="k">SCENE 48</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Where the account is the</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">weak point</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Strong encryption protects the reports. It cannot</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">tell who is holding the account.</text>
  <g data-f="1" transform="translate(0,262)">
    <path d="M284,148 a54,54 0 0 1 5,-92 a70,70 0 0 1 135,-18 a49,49 0 0 1 11,110 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/><text x="360.0" y="115.83" text-anchor="middle" style="font-size:20.25px;font-weight:700;fill:#14213d">one account</text>
    <rect x="253" y="175" width="64" height="116" rx="11" fill="#0f172a" opacity="0.14"/><rect x="248" y="168" width="64" height="116" rx="11" fill="#111827"/><rect x="252" y="172" width="56" height="108" rx="8" fill="#f8fafc"/><rect x="271" y="174" width="18" height="4" rx="2" fill="#111827"/>
    <rect x="333" y="175" width="64" height="116" rx="11" fill="#0f172a" opacity="0.14"/><rect x="328" y="168" width="64" height="116" rx="11" fill="#111827"/><rect x="332" y="172" width="56" height="108" rx="8" fill="#f8fafc"/><rect x="351" y="174" width="18" height="4" rx="2" fill="#111827"/>
    <rect x="413" y="175" width="64" height="116" rx="11" fill="#0f172a" opacity="0.14"/><rect x="408" y="168" width="64" height="116" rx="11" fill="#111827"/><rect x="412" y="172" width="56" height="108" rx="8" fill="#f8fafc"/><rect x="431" y="174" width="18" height="4" rx="2" fill="#111827"/>
    <text x="360" y="318" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#475569">trusted devices and shares</text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="40" y="344" width="310" height="193" rx="12" class="hz"/>
    <text x="58" y="378" text-anchor="start" style="font-size:22px;font-weight:800;fill:#991b1b"><tspan x="58" dy="0">Shared or reused</tspan><tspan x="58" dy="29">password</tspan></text>
    <text x="58" y="438" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="58" dy="0">Needs: the password, and</tspan><tspan x="58" dy="27">a way past 2FA. Exposes:</tspan><tspan x="58" dy="27">what the owner sees.</tspan></text>
    <rect x="370" y="344" width="310" height="193" rx="12" class="hz"/>
    <text x="388" y="378" text-anchor="start" style="font-size:22px;font-weight:800;fill:#991b1b"><tspan x="388" dy="0">Forgotten trusted</tspan><tspan x="388" dy="29">device</tspan></text>
    <text x="388" y="438" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="388" dy="0">Needs: an old phone still</tspan><tspan x="388" dy="27">signed in. Exposes: the</tspan><tspan x="388" dy="27">owner’s view, for whoever</tspan><tspan x="388" dy="27">holds it.</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="40" y="549" width="310" height="193" rx="12" class="hz"/>
    <text x="58" y="583" text-anchor="start" style="font-size:22px;font-weight:800;fill:#991b1b">Coercive access</text>
    <text x="58" y="617" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="58" dy="0">Needs: someone with power</tspan><tspan x="58" dy="27">over the owner. Exposes:</tspan><tspan x="58" dy="27">whatever they are made to</tspan><tspan x="58" dy="27">show.</tspan></text>
    <rect x="370" y="549" width="310" height="193" rx="12" class="hz"/>
    <text x="388" y="583" text-anchor="start" style="font-size:22px;font-weight:800;fill:#991b1b"><tspan x="388" dy="0">A share nobody</tspan><tspan x="388" dy="29">remembers</tspan></text>
    <text x="388" y="643" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="388" dy="0">Needs: an old share not</tspan><tspan x="388" dy="27">reviewed. Exposes: the</tspan><tspan x="388" dy="27">item’s location, to that</tspan><tspan x="388" dy="27">person.</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="754" width="310" height="140" rx="12" class="hz"/>
    <text x="58" y="788" text-anchor="start" style="font-size:22px;font-weight:800;fill:#991b1b">Account takeover</text>
    <text x="58" y="822" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="58" dy="0">Needs: credentials plus</tspan><tspan x="58" dy="27">a 2FA bypass. Exposes:</tspan><tspan x="58" dy="27">all items, as the owner.</tspan></text>
    <rect x="370" y="754" width="310" height="140" rx="12" class="hz"/>
    <text x="388" y="788" text-anchor="start" style="font-size:22px;font-weight:800;fill:#991b1b">Recovery abuse</text>
    <text x="388" y="822" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="388" dy="0">Needs: control of a</tspan><tspan x="388" dy="27">recovery path. Exposes:</tspan><tspan x="388" dy="27">the account after reset.</tspan></text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="908" width="640" height="114" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><text x="58" y="946" text-anchor="start" style="font-size:24px;font-weight:800;fill:#b45309">Shared household permissions</text><text x="58" y="980" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="58" dy="0">Family or shared accounts can mean several people</tspan><tspan x="58" dy="27">see one item — by design, until reviewed.</tspan></text>
    <rect x="40" y="1034" width="640" height="150" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="64" y="1078" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Defences</text>
    <text x="64" y="1114" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14532d"><tspan x="64" dy="0">Review devices and sharing (e.g. Apple Safety</tspan><tspan x="64" dy="27">Check) · unique password + 2FA · a recovery</tspan><tspan x="64" dy="27">method you control</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1463" x2="680" y2="1463" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1493" class="note">Defensive summary; no attack steps.</text>
    <rect x="40" y="1520" width="34" height="18" rx="3" class="hz" style="stroke-width:3"/>
    <text x="86" y="1534" class="s">Attacker zone / hazard</text>
  </g>
</svg>
