<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1461" width="720" height="1461" font-family="Inter, Arial, sans-serif">
  <title>Scene 32: What setup actually establishes, layer by layer</title>
  <desc>Six frames, one layer each, every layer marked documented, inferred or undisclosed. 1, the tag’s hardware identity: a serial number is documented, factory key material is not disclosed. 2, the onboarding transport: a short-range radio exchange with the owner’s iPhone, inferred from the documented hold-it-near step. 3, user authorisation: the owner taps Connect on a device signed in to an Apple Account with two-factor authentication, documented. 4, account registration: the item is linked to one Apple Account, documented; the message format is undisclosed. 5, key provisioning: the owner’s device creates a key pair and secret for rotating identifiers, documented in Apple Platform Security; the exact exchange is undisclosed. 6, revocation and transfer: Remove Item unlinks the item, documented; the cryptographic mechanism is undisclosed.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1461"/>
  <text x="40" y="50" class="k">SCENE 32</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">What setup actually</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">establishes, layer by</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">layer</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">Six things get set up. Apple documents some of</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">them; the rest we can only infer, or not see at</text>
  <text x="40" y="319" style="font-size:23px;fill:#475569">all.</text>
  <g data-f="1" transform="translate(0,345)">
    <rect x="40" y="0" width="640" height="132" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="70" cy="33" r="18" fill="#334155"/><text x="70" y="39" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text>
    <text x="98" y="42" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Tag hardware identity</text>
    <text x="98" y="74" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">A serial number, readable on the tag and by NFC.</text>
    <rect x="64" y="86" width="240" height="34" rx="17" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="183.89999999999998" y="110" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#1e40af">DOCUMENTED: serial</text>
    <rect x="315.79999999999995" y="86" width="324" height="34" rx="17" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="478.04999999999995" y="110" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#374151">UNDISCLOSED: factory keys</text>
  </g>
  <g data-f="2" transform="translate(0,345)">
    <rect x="40" y="144" width="640" height="204" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="70" cy="177" r="18" fill="#2563eb"/><text x="70" y="183" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text>
    <text x="98" y="186" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Onboarding transport</text>
    <text x="98" y="218" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="98" dy="0">A short-range radio exchange with the owner’s</tspan><tspan x="98" dy="27">iPhone.</tspan></text>
    <rect x="64" y="258" width="349" height="34" rx="17" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/><text x="238.35" y="282" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#6b21a8">INFERRED: close-range radio</text>
    <rect x="64" y="302" width="276" height="34" rx="17" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="202.05" y="326" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#374151">UNDISCLOSED: messages</text>
  </g>
  <g data-f="3" transform="translate(0,345)">
    <rect x="40" y="360" width="640" height="160" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <circle cx="70" cy="393" r="18" fill="#16a34a"/><text x="70" y="399" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text>
    <text x="98" y="402" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">User authorisation</text>
    <text x="98" y="434" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="98" dy="0">Owner taps Connect on a device signed in with</tspan><tspan x="98" dy="27">two-factor auth.</tspan></text>
    <rect x="64" y="474" width="143" height="34" rx="17" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="135.5" y="498" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#1e40af">DOCUMENTED</text>
  </g>
  <g data-f="4" transform="translate(0,345)">
    <rect x="40" y="532" width="640" height="132" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="70" cy="565" r="18" fill="#334155"/><text x="70" y="571" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text>
    <text x="98" y="574" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Account registration</text>
    <text x="98" y="606" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">The item is linked to one Apple Account at a time.</text>
    <rect x="64" y="618" width="276" height="34" rx="17" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="202.05" y="642" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#1e40af">DOCUMENTED: behaviour</text>
    <rect x="352.1" y="618" width="252" height="34" rx="17" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="478.05" y="642" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#374151">UNDISCLOSED: format</text>
  </g>
  <g data-f="5" transform="translate(0,345)">
    <rect x="40" y="676" width="640" height="160" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="70" cy="709" r="18" fill="#7c3aed"/><text x="70" y="715" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text>
    <text x="98" y="718" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Key provisioning</text>
    <text x="98" y="750" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="98" dy="0">Owner device makes a P-224 key pair and secret for</tspan><tspan x="98" dy="27">rotating keys.</tspan></text>
    <rect x="64" y="790" width="240" height="34" rx="17" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="183.89999999999998" y="814" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#1e40af">DOCUMENTED: design</text>
    <rect x="315.79999999999995" y="790" width="276" height="34" rx="17" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="453.84999999999997" y="814" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#374151">UNDISCLOSED: exchange</text>
  </g>
  <g data-f="6" transform="translate(0,345)">
    <rect x="40" y="848" width="640" height="160" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <circle cx="70" cy="881" r="18" fill="#b45309"/><text x="70" y="887" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">6</text>
    <text x="98" y="890" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Revocation / transfer</text>
    <text x="98" y="922" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="98" dy="0">Remove Item unlinks it; then another account can</tspan><tspan x="98" dy="27">add it.</tspan></text>
    <rect x="64" y="962" width="276" height="34" rx="17" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="202.05" y="986" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#1e40af">DOCUMENTED: behaviour</text>
    <rect x="352.1" y="962" width="288" height="34" rx="17" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="496.20000000000005" y="986" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#374151">UNDISCLOSED: mechanism</text>
    <text x="40" y="1054" text-anchor="start" style="font-size:21px;font-weight:700;fill:#334155">Key:</text><rect x="98" y="1030" width="143" height="34" rx="17" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="169.5" y="1054" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#1e40af">DOCUMENTED</text><rect x="253.0" y="1030" width="119" height="34" rx="17" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/><text x="312.4" y="1054" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#6b21a8">INFERRED</text><rect x="383.8" y="1030" width="155" height="34" rx="17" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="461.35" y="1054" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#374151">UNDISCLOSED</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1429" x2="680" y2="1429" stroke="#e2e8f0" stroke-width="2"/>
  </g>
</svg>
