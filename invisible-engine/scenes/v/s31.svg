<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1488" width="720" height="1488" font-family="Inter, Arial, sans-serif">
  <title>Scene 31: First-time setup: from a new tag to a named item</title>
  <desc>Five frames. A new item tracker is held next to the owner’s iPhone, which notices it at close range; the iPhone shows a Connect prompt; after the owner taps Connect and Continue, the item is registered to the owner’s Apple Account, which needs two-factor authentication; the item now appears in Find My with the name the owner chose; and a note that these are Apple’s documented user steps, not a public trace of the messages underneath.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1488"/>
  <text x="40" y="50" class="k">SCENE 31</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">First-time setup: from a</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">new tag to a named item</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Apple documents the steps you see. The messages</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">underneath are mostly not public.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="45" y="7" width="200" height="400" rx="34" fill="#0f172a" opacity="0.14"/><rect x="40" y="0" width="200" height="400" rx="34" fill="#111827"/><rect x="52" y="12" width="176" height="376" rx="27" fill="#f1f5f9"/><rect x="112" y="20" width="56" height="14" rx="7" fill="#111827"/>
    <text x="140" y="72" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#14213d">Find My</text>
    <circle cx="343" cy="117" r="44" fill="#0f172a" opacity="0.13"/><circle cx="340" cy="112" r="44" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="340" cy="112" r="27" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="340" y="194" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">new item tracker</text>
    <path d="M282,98 q-10,14 0,28" fill="none" stroke="#2563eb" stroke-width="4.0" stroke-linecap="round" opacity="1.00"/><path d="M268,86 q-16,26 0,52" fill="none" stroke="#2563eb" stroke-width="4.0" stroke-linecap="round" opacity="0.80"/>
    <circle cx="398" cy="64" r="16" fill="#2563eb"/><text x="398" y="70" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#ffffff">1</text>
    <rect x="40" y="420" width="640" height="116" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="450" r="18" fill="#2563eb"/><text x="66" y="456" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="94" y="456" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">Hold it near the iPhone</text><text x="56" y="492" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Pull the battery tab and hold the new tag next to an</tspan><tspan x="56" dy="27">unlocked iPhone. Close range is part of the setup step.</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="52" y="196" width="176" height="180" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="140.0" y="234" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#14213d">AirTag</text><text x="140.0" y="266" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#475569">Hold near iPhone</text><rect x="64" y="324" width="152" height="40" rx="10" fill="#2563eb"/><text x="140.0" y="351" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#ffffff">Connect</text>
    <rect x="40" y="548" width="640" height="116" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="66" cy="578" r="18" fill="#16a34a"/><text x="66" y="584" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="94" y="584" text-anchor="start" style="font-size:26px;font-weight:800;fill:#16a34a">The Connect prompt</text><text x="56" y="620" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">The iPhone offers to add the item. Nothing is</tspan><tspan x="56" dy="27">linked until the owner agrees.</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <path d="M469,148 a54,54 0 0 1 5,-92 a70,70 0 0 1 135,-18 a49,49 0 0 1 11,110 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/><text x="545.0" y="115.83" text-anchor="middle" style="font-size:20.25px;font-weight:700;fill:#14213d">Apple Account</text>
    <text x="466" y="352" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">two-factor authentication required</text>
    <path d="M246,300 L600,300 L600,158" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="266" y="250" width="391" height="32" rx="6" class="lab"/>
    <text x="462" y="272" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#4b5563"><tspan x="462" dy="0">Continue: register to my account</tspan></text>
    <circle cx="632" cy="236" r="16" fill="#334155"/><text x="632" y="242" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#ffffff">3</text>
    <rect x="40" y="676" width="640" height="143" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="66" cy="706" r="18" fill="#334155"/><text x="66" y="712" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="94" y="712" text-anchor="start" style="font-size:26px;font-weight:800;fill:#334155">Explicit account linking</text><text x="56" y="748" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">The owner taps Continue. The item is registered to their</tspan><tspan x="56" dy="27">Apple Account. One account at a time: to give the tag</tspan><tspan x="56" dy="27">away, the owner removes it from their account first.</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="52" y="40" width="176" height="348" rx="20" fill="#f8fafc"/>
    <text x="140" y="82" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#14213d">Items</text>
    <rect x="60" y="108" width="160" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="88" cy="148" r="16" fill="#e5e7eb" stroke="#94a3b8" stroke-width="2"/>
    <text x="114" y="142" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Keys</text>
    <text x="114" y="170" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">with you</text>
    <rect x="40" y="831" width="640" height="116" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="861" r="18" fill="#2563eb"/><text x="66" y="867" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="94" y="867" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">A named item in Find My</text><text x="56" y="903" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">The owner chose the name (here “Keys”). The item now</tspan><tspan x="56" dy="27">appears in the Items list on their devices.</tspan></text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="959" width="640" height="140" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="82" cy="1003" r="26" fill="#b45309"/><text x="82" y="1012" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text><text x="122" y="1013" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">User steps, not a packet trace</text>
    <text x="64" y="1052" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="64" dy="0">What travels between tag, phone and Apple during setup</tspan><tspan x="64" dy="27">is mostly undisclosed (Scene 32).</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1387" x2="680" y2="1387" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1417" class="note">Steps: Apple Support. Schematic.</text>
    <path d="M40,1453 L74,1453" class="a-admin" marker-end="url(#m-admin)"/>
    <text x="86" y="1458" class="s">Registration / authorisation (not data)</text>
  </g>
</svg>
