  <rect class="bg" width="720" height="1600"/>
  <text x="40" y="50" class="k">SCENE 52</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Alerts across iPhone and</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Android</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Since May 2024 both platforms alert about</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">compatible trackers. The standard is still being</text>
  <text x="40" y="267" style="font-size:23px;fill:#475569">written.</text>
  <g data-f="1" transform="translate(0,293)">
    <circle cx="67" cy="71" r="22" fill="#0f172a" opacity="0.13"/><circle cx="64" cy="66" r="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="64" cy="66" r="14" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/><text x="94" y="73" text-anchor="start" style="font-size:20px;font-weight:600;fill:#475569">tracker A</text>
    <path d="M196,66 L224,150" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="67" cy="153" r="22" fill="#0f172a" opacity="0.13"/><circle cx="64" cy="148" r="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="64" cy="148" r="14" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/><text x="94" y="155" text-anchor="start" style="font-size:20px;font-weight:600;fill:#475569">tracker B</text>
    <path d="M196,148 L224,150" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="67" cy="235" r="22" fill="#0f172a" opacity="0.13"/><circle cx="64" cy="230" r="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="64" cy="230" r="14" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/><text x="94" y="237" text-anchor="start" style="font-size:20px;font-weight:600;fill:#475569">tracker C</text>
    <path d="M196,230 L224,150" stroke="#94a3b8" stroke-width="2.5"/>
    <path d="M224,60 L316,60 L346,90 L346,244 L224,244 Z" fill="#ffffff" stroke="#334155" stroke-width="3"/><path d="M316,60 L316,90 L346,90" fill="none" stroke="#334155" stroke-width="3"/><rect x="240" y="132" width="90" height="7" rx="3" fill="#cbd5e1"/><rect x="240" y="152" width="90" height="7" rx="3" fill="#cbd5e1"/><rect x="240" y="172" width="90" height="7" rx="3" fill="#cbd5e1"/><rect x="240" y="192" width="90" height="7" rx="3" fill="#cbd5e1"/><rect x="240" y="212" width="64" height="7" rx="3" fill="#cbd5e1"/><text x="285.0" y="112" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">DULT spec</text>
    <path d="M285,60 L285,16 L604,16 L604,40 M440,16 L440,40" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
    <rect x="367" y="47" width="156" height="252" rx="27" fill="#0f172a" opacity="0.14"/><rect x="362" y="40" width="156" height="252" rx="27" fill="#111827"/><rect x="371" y="49" width="137" height="233" rx="21" fill="#f8fafc"/><rect x="418" y="56" width="44" height="11" rx="5" fill="#111827"/><rect x="366" y="92" width="147" height="98" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/><circle cx="377" cy="114" r="6" fill="#f59e0b"/><text x="387" y="121" text-anchor="start" style="font-size:20px;font-weight:700;fill:#14213d">Tracker</text><text x="387" y="147" text-anchor="start" style="font-size:20px;font-weight:400;fill:#14213d">moving with</text><text x="387" y="173" text-anchor="start" style="font-size:20px;font-weight:400;fill:#14213d">you</text>
    <rect x="531" y="47" width="156" height="252" rx="27" fill="#0f172a" opacity="0.14"/><rect x="526" y="40" width="156" height="252" rx="27" fill="#111827"/><rect x="535" y="49" width="137" height="233" rx="21" fill="#f8fafc"/><rect x="582" y="56" width="44" height="11" rx="5" fill="#111827"/><rect x="530" y="92" width="147" height="98" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/><circle cx="541" cy="114" r="6" fill="#f59e0b"/><text x="551" y="121" text-anchor="start" style="font-size:20px;font-weight:700;fill:#14213d">Tracker</text><text x="551" y="147" text-anchor="start" style="font-size:20px;font-weight:400;fill:#14213d">moving with</text><text x="551" y="173" text-anchor="start" style="font-size:20px;font-weight:400;fill:#14213d">you</text>
    <text x="440" y="324" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#334155">iPhone ·</text><text x="440" y="350" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#334155">iOS 17.5+</text>
    <text x="604" y="324" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#334155">Android 6.0+</text>
    <text x="40" y="292" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Trackers from makers that</text><text x="40" y="319" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">adopt it</text>
    <rect x="40" y="368" width="640" height="112" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="398" r="18" fill="#2563eb"/><text x="66" y="404" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="94" y="404" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">One specification, two platforms</text><text x="56" y="440" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Apple and Google wrote one industry specification. Both</tspan><tspan x="56" dy="27">platforms alert about compatible trackers (May 2024).</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,293)">
    <rect x="40" y="494" width="312" height="236" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="82" cy="538" r="26" fill="#16a34a"/><text x="82" y="547" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="122" y="548" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Deployed</text>
    <text x="60" y="584" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Built into iOS 17.5+</text><text x="60" y="611" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">and Android 6.0+ since</text><text x="60" y="638" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">May 2024. Works with</text><text x="60" y="665" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">trackers whose makers</text><text x="60" y="692" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">adopt the specification.</text>
  </g>
  <g data-f="3" transform="translate(0,293)">
    <rect x="368" y="494" width="312" height="236" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="410" cy="538" r="26" fill="#b45309"/><text x="410" y="547" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="450" y="548" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Standards track</text>
    <text x="388" y="584" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">The IETF DULT working</text><text x="388" y="609" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">group is turning the work</text><text x="388" y="634" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">into standards. Drafts</text><text x="388" y="659" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">change: check current</text><text x="388" y="684" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">status. A draft is not a</text><text x="388" y="709" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">promise.</text>
  </g>
  <g data-f="4" transform="translate(0,293)">
    <rect x="40" y="744" width="640" height="230" rx="14" class="hz"/>
    <circle cx="74" cy="778" r="18" fill="#dc2626"/><text x="74" y="784" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="102" y="786" text-anchor="start" style="font-size:23px;font-weight:800;fill:#b91c1c">When an alert may not come</text>
    <text x="64" y="822" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• The tag is often near its owner</text><text x="64" y="850" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• A short trip: not enough time together</text><text x="64" y="878" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• Bluetooth or location off; old software</text><text x="64" y="906" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• A tracker that does not follow the spec</text><text x="64" y="934" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• A manual scan sees what is near now,</text>
    <text x="84" y="962" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">not what followed you</text>
  </g>
  <g data-f="5" transform="translate(0,293)">
    <rect x="40" y="986" width="640" height="176" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="82" cy="1030" r="26" fill="#334155"/><text x="82" y="1039" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text><text x="122" y="1040" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">No timing guarantee</text>
    <text x="64" y="1092" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Neither platform promises how soon an alert appears.</text><text x="64" y="1119" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">An alert is a prompt to check; no alert is not proof</text><text x="64" y="1146" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">of safety.</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1472" x2="680" y2="1472" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1502" class="note">Versions as Apple and Google documented them in May</text>
    <text x="40" y="1529" class="note">2024.</text>
    <rect x="40" y="1556" width="34" height="18" rx="3" class="hz" style="stroke-width:3"/>
    <text x="86" y="1570" class="s">Attacker zone / hazard</text>
  </g>
</svg>
