<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1592" width="720" height="1592" font-family="Inter, Arial, sans-serif">
  <title>Scene 47: Four networks, similar goals, different designs</title>
  <desc>Four frames building a comparison of Apple Find My, Google Find Hub, Samsung SmartThings Find and Tile, with no ranking. 1, the four networks and who relays sightings. 2, encryption and account linking as each company documents them. 3, precise finding, sharing and alerts for the person a tag travels with. 4, how much each publishes about its protocol, and a note that cells marked verify could not be confirmed from the company’s own pages for this lesson.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1592"/>
  <text x="40" y="50" class="k">SCENE 47</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Four networks, similar</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">goals, different designs</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">As each company documents it. No scores, no</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">winners. “Verify” = not confirmed from the</text>
  <text x="40" y="267" style="font-size:23px;fill:#475569">company’s own page.</text>
  <g data-f="1" transform="translate(0,293)">
    <rect x="40" y="0" width="640" height="92" rx="10" fill="#f1f5f9"/>
    <circle cx="58" cy="29" r="14" fill="#2563eb"/><text x="58" y="34" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#ffffff">1</text><text x="82" y="36" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Apple Find My</text>
    <circle cx="432" cy="29" r="14" fill="#16a34a"/><text x="432" y="34" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#ffffff">2</text><text x="456" y="36" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Google Find Hub</text>
    <circle cx="58" cy="69" r="14" fill="#7c3aed"/><text x="58" y="74" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#ffffff">3</text><text x="82" y="76" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Samsung SmartThings Find</text>
    <circle cx="432" cy="69" r="14" fill="#0d9488"/><text x="432" y="74" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#ffffff">4</text><text x="456" y="76" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Tile (Life360)</text>
    <rect x="40" y="102" width="640" height="170" rx="8" fill="#fbfaf7" stroke="#e5e7eb" stroke-width="1"/>
    <text x="56" y="130" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Who relays</text>
    <circle cx="66" cy="151" r="12" fill="#2563eb"/><text x="66" y="155" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">1</text>
    <text x="88" y="158" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">Nearby Apple devices, in the background</text>
    <circle cx="66" cy="177" r="12" fill="#16a34a"/><text x="66" y="181" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">2</text>
    <text x="88" y="184" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">Android devices; by default only in busy areas,</text><text x="88" y="210" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">aggregated</text>
    <circle cx="66" cy="229" r="12" fill="#7c3aed"/><text x="66" y="233" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">3</text>
    <text x="88" y="236" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">Galaxy devices (“nodes”)</text>
    <circle cx="66" cy="255" r="12" fill="#0d9488"/><text x="66" y="259" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">4</text>
    <text x="88" y="262" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#9a3412">Phones running the Tile or Life360 app (verify)</text>
  </g>
  <g data-f="2" transform="translate(0,293)">
    <rect x="40" y="276" width="640" height="144" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="56" y="304" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Encryption</text>
    <circle cx="66" cy="325" r="12" fill="#2563eb"/><text x="66" y="329" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">1</text>
    <text x="88" y="332" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">End to end; Apple says it cannot read locations</text>
    <circle cx="66" cy="351" r="12" fill="#16a34a"/><text x="66" y="355" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">2</text>
    <text x="88" y="358" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">End to end; key unlocked by the phone’s screen lock</text>
    <circle cx="66" cy="377" r="12" fill="#7c3aed"/><text x="66" y="381" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">3</text>
    <text x="88" y="384" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">Encrypted, Knox-protected; private ID changes / 15 min</text>
    <circle cx="66" cy="403" r="12" fill="#0d9488"/><text x="66" y="407" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">4</text>
    <text x="88" y="410" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#9a3412">Not compared here: check Tile’s own pages</text>
    <rect x="40" y="424" width="640" height="144" rx="8" fill="#fbfaf7" stroke="#e5e7eb" stroke-width="1"/>
    <text x="56" y="452" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Account link</text>
    <circle cx="66" cy="473" r="12" fill="#2563eb"/><text x="66" y="477" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">1</text>
    <text x="88" y="480" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">One Apple Account per AirTag</text>
    <circle cx="66" cy="499" r="12" fill="#16a34a"/><text x="66" y="503" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">2</text>
    <text x="88" y="506" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#9a3412">Google Account; trackers from partner makers (verify)</text>
    <circle cx="66" cy="525" r="12" fill="#7c3aed"/><text x="66" y="529" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">3</text>
    <text x="88" y="532" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">One account or device at a time</text>
    <circle cx="66" cy="551" r="12" fill="#0d9488"/><text x="66" y="555" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">4</text>
    <text x="88" y="558" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#9a3412">Tile account (verify)</text>
  </g>
  <g data-f="3" transform="translate(0,293)">
    <rect x="40" y="572" width="640" height="144" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="56" y="600" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Precise finding</text>
    <circle cx="66" cy="621" r="12" fill="#2563eb"/><text x="66" y="625" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">1</text>
    <text x="88" y="628" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">UWB on supported iPhones</text>
    <circle cx="66" cy="647" r="12" fill="#16a34a"/><text x="66" y="651" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">2</text>
    <text x="88" y="654" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#9a3412">Depends on the tracker model (verify)</text>
    <circle cx="66" cy="673" r="12" fill="#7c3aed"/><text x="66" y="677" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">3</text>
    <text x="88" y="680" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#9a3412">UWB on supported Galaxy phones (verify)</text>
    <circle cx="66" cy="699" r="12" fill="#0d9488"/><text x="66" y="703" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">4</text>
    <text x="88" y="706" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#9a3412">Depends on the model (verify)</text>
    <rect x="40" y="720" width="640" height="144" rx="8" fill="#fbfaf7" stroke="#e5e7eb" stroke-width="1"/>
    <text x="56" y="748" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Alerts for the carrier</text>
    <circle cx="66" cy="769" r="12" fill="#2563eb"/><text x="66" y="773" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">1</text>
    <text x="88" y="776" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">iPhone alert; tag sounds; Android via shared spec</text>
    <circle cx="66" cy="795" r="12" fill="#16a34a"/><text x="66" y="799" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">2</text>
    <text x="88" y="802" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">Android 6.0+ alerts and a manual Scan now</text>
    <circle cx="66" cy="821" r="12" fill="#7c3aed"/><text x="66" y="825" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">3</text>
    <text x="88" y="828" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">Unknown-tag alert is a setting; manual search</text>
    <circle cx="66" cy="847" r="12" fill="#0d9488"/><text x="66" y="851" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">4</text>
    <text x="88" y="854" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#9a3412">Scan and Secure: a manual scan (verify)</text>
  </g>
  <g data-f="4" transform="translate(0,293)">
    <rect x="40" y="868" width="640" height="144" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="56" y="896" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">What is published</text>
    <circle cx="66" cy="917" r="12" fill="#2563eb"/><text x="66" y="921" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">1</text>
    <text x="88" y="924" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">Design in Apple Platform Security; studied by research</text>
    <circle cx="66" cy="943" r="12" fill="#16a34a"/><text x="66" y="947" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">2</text>
    <text x="88" y="950" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">Design on Google’s security blog</text>
    <circle cx="66" cy="969" r="12" fill="#7c3aed"/><text x="66" y="973" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">3</text>
    <text x="88" y="976" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">Newsroom-level descriptions</text>
    <circle cx="66" cy="995" r="12" fill="#0d9488"/><text x="66" y="999" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">4</text>
    <text x="88" y="1002" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#9a3412">Less public technical detail (verify)</text>
    <text x="40" y="1042" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d"><tspan x="40" dy="0">All four aim to find lost things without revealing</tspan><tspan x="40" dy="27">the finder; the published detail differs a great deal.</tspan></text>
    <text x="40" y="1108" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569"><tspan x="40" dy="0">Apple and Google share one specification for</tspan><tspan x="40" dy="27">unwanted-tracking alerts (Scene 52). Nothing here</tspan><tspan x="40" dy="27">implies the networks share data or use the same</tspan><tspan x="40" dy="27">algorithms.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1525" x2="680" y2="1525" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1555" class="note">Company documentation as cited on the page. No ranking.</text>
  </g>
</svg>
