<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1327" width="720" height="1327" font-family="Inter, Arial, sans-serif">
  <title>Scene 35: Whose location is it? The finder phone’s own</title>
  <desc>Four frames. The tag’s whisper reaches the finder phone carrying no location; the finder phone works out its own approximate position from satellites, Wi-Fi access points and cell towers, as it would for a map; the phone records a sighting: its own estimated position and the time, meaning the tag was somewhere within radio range of this point; and the tag never asks a satellite anything, shown crossed out.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1327"/>
  <text x="40" y="50" class="k">SCENE 35</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Whose location is it? The</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">finder phone’s own</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">The tag has no position to give. The sighting uses</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">where the finder’s phone thinks it is.</text>
  <g data-f="1" transform="translate(0,262)">
    <circle cx="93" cy="405" r="38" fill="#0f172a" opacity="0.13"/><circle cx="90" cy="400" r="38" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="90" cy="400" r="24" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="90" y="470" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">item tracker</text>
    <rect x="335" y="207" width="140" height="280" rx="24" fill="#0f172a" opacity="0.14"/><rect x="330" y="200" width="140" height="280" rx="24" fill="#111827"/><rect x="338" y="208" width="123" height="263" rx="19" fill="#f8fafc"/><rect x="380" y="214" width="39" height="10" rx="5" fill="#111827"/>
    <path d="M132,400 L322,400" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="142" y="328" width="171" height="58" rx="6" class="lab"/>
    <text x="227" y="350" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#1d4ed8"><tspan x="227" dy="0">whisper: key,</tspan><tspan x="227" dy="26">no location</tspan></text>
    <rect x="40" y="570" width="640" height="116" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="600" r="18" fill="#2563eb"/><text x="66" y="606" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="94" y="606" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">The whisper has no position in it</text><text x="56" y="642" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Only a rotating key. The tag does not know where</tspan><tspan x="56" dy="27">it is.</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="366" y="30" width="28" height="20" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="322" y="32" width="40" height="16" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><rect x="398" y="32" width="40" height="16" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><rect x="606" y="60" width="28" height="20" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="562" y="62" width="40" height="16" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><rect x="638" y="62" width="40" height="16" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
    <rect x="560" y="300" width="110" height="40" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="3"/><path d="M580,300 L572,260 M650,300 L658,260" stroke="#475569" stroke-width="5.0" stroke-linecap="round"/><circle cx="590" cy="320" r="4" fill="#22c55e"/><circle cx="606" cy="320" r="4" fill="#22c55e"/><circle cx="622" cy="320" r="4" fill="#22c55e"/>
    <path d="M597,540 L620,432 L643,540 M604,508 L636,508 M611,475 L629,475" fill="none" stroke="#475569" stroke-width="3.6" stroke-linejoin="round"/><circle cx="620" cy="432" r="5" fill="#475569"/><path d="M631,423 q6,9 0,18" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" opacity="1.00"/><path d="M639,416 q10,16 0,33" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" opacity="0.80"/><path d="M609,423 q-6,9 0,18" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" opacity="1.00"/><path d="M601,416 q-10,16 0,33" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" opacity="0.80"/>
    <path d="M386,60 L396,190" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M600,90 L476,210" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M552,320 L480,336" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M588,470 L480,436" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="40" y="698" width="640" height="116" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="66" cy="728" r="18" fill="#0d9488"/><text x="66" y="734" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="94" y="734" text-anchor="start" style="font-size:26px;font-weight:800;fill:#0d9488">The phone finds itself</text><text x="56" y="770" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Satellites (GNSS), Wi-Fi and cell towers, fused as for</tspan><tspan x="56" dy="27">any map app. An estimate, not an exact point.</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <circle cx="400" cy="345" r="58" fill="#22c55e" fill-opacity="0.12" stroke="#15803d" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M400,340 C381,312 381,290 400,288 C419,290 419,312 400,340 Z" fill="#15803d"/><circle cx="400" cy="305" r="6" fill="#ffffff"/>
    <rect x="40" y="826" width="640" height="116" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="66" cy="856" r="18" fill="#16a34a"/><text x="66" y="862" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="94" y="862" text-anchor="start" style="font-size:26px;font-weight:800;fill:#16a34a">A sighting = phone’s place + time</text><text x="56" y="898" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Meaning: the tag was somewhere within radio range</tspan><tspan x="56" dy="27">of this point, at this time.</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <path d="M110,362 L322,42" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8"/>
    <circle cx="216" cy="202" r="24" fill="#ffffff" stroke="#475569" stroke-width="4"/><path d="M205,191 L227,213 M227,191 L205,213" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <text x="40" y="66" text-anchor="start" style="font-size:21px;font-weight:700;fill:#475569"><tspan x="40" dy="0">the tag never asks</tspan><tspan x="40" dy="27">a satellite anything</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1226" x2="680" y2="1226" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1256" class="note">Schematic.</text>
    <path d="M40,1292 L74,1292" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="86" y="1297" class="s">Radio signal or wave</text>
  </g>
</svg>
