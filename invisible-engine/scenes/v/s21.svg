<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1600" width="720" height="1600" font-family="Inter, Arial, sans-serif">
  <title>Scene 21: Weak badge, strong badge</title>
  <desc>Four frames. On the left, a static-ID badge sends the same number every time it is tapped. A copied badge, marked as a hazard, sends the identical number and the reader accepts it, because it checks only the number. On the right, a secure badge receives a fresh random challenge from the reader and answers with a response computed from the challenge and a secret key that never leaves its chip; replaying an old response fails because the next challenge is different. A table compares, at the level of concepts only, the risk of copying, replay and real-time relay for both badges, and what reduces relay risk.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1600"/>
  <text x="40" y="50" class="k">SCENE 21</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Weak badge, strong badge</text>
  <text x="40" y="153" style="font-size:23px;fill:#475569">One badge repeats a number. The other proves, each</text>
  <text x="40" y="184" style="font-size:23px;fill:#475569">time, that it holds a secret.</text>
  <g data-f="1" transform="translate(0,210)">
    <rect x="40" y="0" width="640" height="410" rx="18" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/><text x="64" y="44" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Static-ID badge</text>
    <rect x="101" y="74" width="22" height="30" rx="6" fill="#94a3b8"/><rect x="70" y="102" width="92" height="133" rx="12" fill="#0f172a" opacity="0.12"/><rect x="66" y="96" width="92" height="133" rx="12" fill="#ffffff" stroke="#334155" stroke-width="3"/><rect x="66" y="96" width="92" height="34" rx="12" fill="#64748b"/><rect x="66" y="118" width="92" height="12" fill="#64748b"/><text x="112.0" y="120" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#ffffff">STAFF</text><circle cx="112" cy="156" r="16" fill="#cbd5e1"/><rect x="84" y="187" width="55" height="7" rx="4" fill="#94a3b8"/><rect x="92" y="200" width="40" height="5" rx="4" fill="#cbd5e1"/>
    <rect x="570" y="76" width="88" height="136" rx="13" fill="#0f172a" opacity="0.14"/><rect x="566" y="70" width="88" height="136" rx="13" fill="#1f2937"/><circle cx="610" cy="126" r="24" fill="none" stroke="#9ca3af" stroke-width="2.4"/><path d="M599.6,121.5 q3.9,4.5 0,9.0" fill="none" stroke="#e5e7eb" stroke-width="2.0" stroke-linecap="round"/><path d="M604.6,117.6 q6.7,8.4 0,16.8" fill="none" stroke="#e5e7eb" stroke-width="2.0" stroke-linecap="round"/><path d="M609.7,113.7 q9.5,12.3 0,24.6" fill="none" stroke="#e5e7eb" stroke-width="2.0" stroke-linecap="round"/><circle cx="610" cy="182" r="6" fill="#22c55e"/>
    <path d="M164,140 L560,140" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="201" y="106" width="322" height="32" rx="6" class="lab"/>
    <text x="362" y="128" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#15803d"><tspan x="362" dy="0">ID 48213 (same every time)</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,210)">
    <rect x="56" y="246" width="128" height="148" rx="10" class="hz"/>
    <rect x="110" y="248" width="19" height="30" rx="6" fill="#94a3b8"/><rect x="84" y="276" width="80" height="116" rx="12" fill="#0f172a" opacity="0.12"/><rect x="80" y="270" width="80" height="116" rx="12" fill="#ffffff" stroke="#334155" stroke-width="3"/><rect x="80" y="270" width="80" height="34" rx="12" fill="#94a3b8"/><rect x="80" y="292" width="80" height="12" fill="#94a3b8"/><text x="120.0" y="294" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#ffffff">COPY</text><circle cx="120" cy="322" r="14" fill="#cbd5e1"/><rect x="96" y="349" width="48" height="6" rx="4" fill="#94a3b8"/><rect x="102" y="360" width="35" height="5" rx="4" fill="#cbd5e1"/>
    <path d="M164,326 L500,326 L500,196 L560,196" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="210" y="292" width="240" height="32" rx="6" class="lab"/>
    <text x="330" y="314" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#15803d"><tspan x="330" dy="0">ID 48213: identical</tspan></text>
    <circle cx="546" cy="252" r="16" fill="#16a34a"/><path d="M539,252 L544,258 L554,246" fill="none" stroke="#fff" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="568" y="259" text-anchor="start" style="font-size:21px;font-weight:700;fill:#166534">accepted</text>
    <text x="200" y="384" text-anchor="start" style="font-size:21px;font-weight:700;fill:#991b1b">The reader checks only the number.</text>
  </g>
  <g data-f="3" transform="translate(0,210)">
    <rect x="40" y="424" width="640" height="410" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><text x="64" y="468" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Challenge–response badge</text>
    <rect x="101" y="498" width="22" height="30" rx="6" fill="#94a3b8"/><rect x="70" y="526" width="92" height="133" rx="12" fill="#0f172a" opacity="0.12"/><rect x="66" y="520" width="92" height="133" rx="12" fill="#ffffff" stroke="#334155" stroke-width="3"/><rect x="66" y="520" width="92" height="34" rx="12" fill="#7c3aed"/><rect x="66" y="542" width="92" height="12" fill="#7c3aed"/><text x="112.0" y="544" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#ffffff">SECURE</text><circle cx="112" cy="580" r="16" fill="#cbd5e1"/><rect x="84" y="611" width="55" height="7" rx="4" fill="#94a3b8"/><rect x="92" y="624" width="40" height="5" rx="4" fill="#cbd5e1"/>
    <path d="M98,631 L98,623 a11,11 0 0 1 22,0 L120,631" fill="none" stroke="#7c3aed" stroke-width="4.0"/><rect x="90" y="629" width="38" height="30" rx="5" fill="#7c3aed"/><circle cx="109" cy="642" r="4" fill="#ffffff"/><rect x="108" y="644" width="3" height="8" fill="#ffffff"/>
    <rect x="570" y="500" width="88" height="136" rx="13" fill="#0f172a" opacity="0.14"/><rect x="566" y="494" width="88" height="136" rx="13" fill="#1f2937"/><circle cx="610" cy="550" r="24" fill="none" stroke="#9ca3af" stroke-width="2.4"/><path d="M599.6,545.5 q3.9,4.5 0,9.0" fill="none" stroke="#e5e7eb" stroke-width="2.0" stroke-linecap="round"/><path d="M604.6,541.6 q6.7,8.4 0,16.8" fill="none" stroke="#e5e7eb" stroke-width="2.0" stroke-linecap="round"/><path d="M609.7,537.7 q9.5,12.3 0,24.6" fill="none" stroke="#e5e7eb" stroke-width="2.0" stroke-linecap="round"/><circle cx="610" cy="606" r="6" fill="#22c55e"/>
    <path d="M560,556 L164,556" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="166" y="506" width="391" height="32" rx="6" class="lab"/>
    <text x="362" y="528" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#15803d"><tspan x="362" dy="0">challenge: a fresh random number</tspan></text>
    <path d="M164,656 L560,656" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="213" y="606" width="298" height="58" rx="6" class="lab"/>
    <text x="362" y="628" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#7e22ce"><tspan x="362" dy="0">response = f(secret key,</tspan><tspan x="362" dy="26">challenge)</tspan></text>
    <text x="60" y="742" text-anchor="start" style="font-size:21px;font-weight:700;fill:#6b21a8">The secret key never leaves the chip.</text>
    <circle cx="74" cy="778" r="14" fill="#dc2626"/><path d="M69,773 L79,783 M79,773 L69,783" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
    <text x="96" y="785" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="96" dy="0">An old response fails: the next challenge is</tspan><tspan x="96" dy="27">different.</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,210)">
    <rect x="40" y="846" width="640" height="352" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="40" y="846" width="640" height="72" rx="12" fill="#f1f5f9"/>
    <text x="56" y="876" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d"><tspan x="56" dy="0">Risk (concept</tspan><tspan x="56" dy="26">only)</tspan></text>
    <text x="236" y="876" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">Static-ID badge</text>
    <text x="458" y="876" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d"><tspan x="458" dy="0">Challenge–response</tspan><tspan x="458" dy="26">badge</tspan></text>
    <path d="M40,918 L680,918" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="56" y="948" text-anchor="start" style="font-size:20px;font-weight:700;fill:#14213d"><tspan x="56" dy="0">Copying the</tspan><tspan x="56" dy="26">credential</tspan></text>
    <text x="236" y="948" text-anchor="start" style="font-size:20px;font-weight:400;fill:#991b1b"><tspan x="236" dy="0">the number can be</tspan><tspan x="236" dy="26">read and copied</tspan></text>
    <text x="458" y="948" text-anchor="start" style="font-size:20px;font-weight:400;fill:#166534"><tspan x="458" dy="0">key not readable, if</tspan><tspan x="458" dy="26">well implemented</tspan></text>
    <path d="M40,986 L680,986" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="56" y="1016" text-anchor="start" style="font-size:20px;font-weight:700;fill:#14213d"><tspan x="56" dy="0">Replaying an old</tspan><tspan x="56" dy="26">exchange</tspan></text>
    <text x="236" y="1016" text-anchor="start" style="font-size:20px;font-weight:400;fill:#991b1b"><tspan x="236" dy="0">works: same number</tspan><tspan x="236" dy="26">each time</tspan></text>
    <text x="458" y="1016" text-anchor="start" style="font-size:20px;font-weight:400;fill:#166534"><tspan x="458" dy="0">fails: fresh</tspan><tspan x="458" dy="26">challenge each time</tspan></text>
    <path d="M40,1054 L680,1054" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="56" y="1084" text-anchor="start" style="font-size:20px;font-weight:700;fill:#14213d"><tspan x="56" dy="0">Relaying a live</tspan><tspan x="56" dy="26">exchange</tspan></text>
    <text x="236" y="1084" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="236" dy="0">possible in</tspan><tspan x="236" dy="26">principle</tspan></text>
    <text x="458" y="1084" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="458" dy="0">still possible in</tspan><tspan x="458" dy="26">principle</tspan></text>
    <text x="56" y="1156" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#475569"><tspan x="56" dy="0">Relay is reduced by tight timing limits (distance</tspan><tspan x="56" dy="26">bounding) or a second factor such as a PIN.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1438" x2="680" y2="1438" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1468" class="note">Conceptual comparison. No attack detail. Badge names are</text>
    <text x="40" y="1495" class="note">generic.</text>
    <path d="M40,1531 L74,1531" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="86" y="1536" class="s">Plaintext / local information</text>
    <path d="M40,1565 L74,1565" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="86" y="1570" class="s">Encrypted / cryptographic</text>
    <rect x="375.0" y="1556" width="34" height="18" rx="3" class="hz" style="stroke-width:3"/>
    <text x="421.0" y="1570" class="s">Attacker zone / hazard</text>
  </g>
</svg>
