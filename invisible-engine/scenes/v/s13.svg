<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1542" width="720" height="1542" font-family="Inter, Arial, sans-serif">
  <title>Scene 13: How the reader talks — and how the card answers without a transmitter</title>
  <desc>Four frames. The reader sends bits by briefly reducing its field (amplitude-shift keying); the card’s demodulator turns the dips into bits; the card switches an extra load on and off at an 847.5 kHz subcarrier, changing how much energy it draws; the reader sees small changes in its coil, which appear as sidebands either side of the 13.56 MHz carrier.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1542"/>
  <text x="40" y="50" class="k">SCENE 13</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">How the reader talks —</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">and how the card answers</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">without a transmitter</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">The reader dips its field; the card changes how</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">much energy it absorbs.</text>
  <g transform="translate(0,314)">
    <rect x="66" y="8" width="143" height="231" rx="16" fill="#0f172a" opacity="0.15"/><rect x="60" y="0" width="143" height="231" rx="16" fill="#1f2937"/><rect x="63" y="3" width="136" height="224" rx="14" fill="#374151"/><rect x="73" y="14" width="117" height="82" rx="7" fill="#e0f2fe" stroke="#0f172a" stroke-width="1.7"/><path d="M123.8,38.9 q4.4,5.1 0,10.1" fill="none" stroke="#0c4a6e" stroke-width="1.7600000000000002" stroke-linecap="round"/><path d="M129.5,34.5 q7.6,9.5 0,19.0" fill="none" stroke="#0c4a6e" stroke-width="1.7600000000000002" stroke-linecap="round"/><path d="M135.2,30.1 q10.8,13.9 0,27.8" fill="none" stroke="#0c4a6e" stroke-width="1.7600000000000002" stroke-linecap="round"/><text x="131.5" y="82.5" text-anchor="middle" style="font-size:12.100000000000001px;font-weight:800;fill:#0c4a6e"></text><rect x="82" y="113" width="29" height="18" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.8"/><rect x="117" y="113" width="29" height="18" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.8"/><rect x="152" y="113" width="29" height="18" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.8"/><rect x="82" y="138" width="29" height="18" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.8"/><rect x="117" y="138" width="29" height="18" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.8"/><rect x="152" y="138" width="29" height="18" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.8"/><rect x="82" y="163" width="29" height="18" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.8"/><rect x="117" y="163" width="29" height="18" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.8"/><rect x="152" y="163" width="29" height="18" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.8"/><rect x="82" y="189" width="29" height="18" rx="4" fill="#ef4444" stroke="#111827" stroke-width="0.8"/><rect x="117" y="189" width="29" height="18" rx="4" fill="#facc15" stroke="#111827" stroke-width="0.8"/><rect x="152" y="189" width="29" height="18" rx="4" fill="#22c55e" stroke="#111827" stroke-width="0.8"/><text x="131.5" y="82.5" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#0c4a6e">Tap to pay</text>
    <rect x="444" y="6" width="220" height="139" rx="11" fill="#0f172a" opacity="0.12"/><rect x="440" y="0" width="220" height="139" rx="11" fill="#1e3a8a"/><path d="M440,86 Q550,62 660,97 L660,128 Q660,139 649,139 L451,139 Q440,139 440,128 Z" fill="#1d4ed8" opacity="0.55"/><path d="M616.0,43.1 q5.9,6.8 0,13.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M623.6,37.2 q10.2,12.7 0,25.4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M631.2,31.3 q14.4,18.6 0,37.2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><rect x="462.0" y="45.738" width="33.0" height="33.263999999999996" rx="5" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M478.5,45.738 L478.5,79.002 M462.0,56.826 L474.54,56.826 M482.46,56.826 L495.0,56.826 M462.0,67.914 L474.54,67.914 M482.46,67.914 L495.0,67.914" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="474.54" y="53.05608" width="7.92" height="18.62784" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/><text x="580.8" y="33.263999999999996" text-anchor="end" style="font-size:20px;font-weight:800;fill:#e0e7ff">BANK</text><text x="457.6" y="119.196" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#ffffff">•••• 1234</text>
    <text x="131" y="262" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#334155">reader</text>
  </g>
  <g data-f="1" transform="translate(0,314)">
    <rect x="40" y="352" width="600" height="182" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="82" cy="396" r="26" fill="#2563eb"/><text x="82" y="405" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="122" y="406" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Reader → card: dips in the field</text>
    <path d="M70,447 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 l32,0 l32,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 l32,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0 q8,-30 16,0 t16,0" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <text x="66" y="490" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="66" dy="0">Type A: field paused (100 % ASK), modified Miller ·</tspan><tspan x="66" dy="26">Type B: ~10 % ASK, NRZ · base rate 106 kbit/s</tspan></text>
    <path d="M610,350 L610,146" class="a-signal" marker-end="url(#m-signal)"/>
  </g>
  <g data-f="2" transform="translate(0,314)">
    <rect x="222" y="150" width="340" height="118" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="248" cy="180" r="18" fill="#16a34a"/><text x="248" y="186" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="276" y="186" text-anchor="start" style="font-size:26px;font-weight:800;fill:#16a34a">Demodulator</text><text x="238" y="222" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="238" dy="0">turns dips into</tspan><tspan x="238" dy="27">command bits</tspan></text>
    <path d="M392,270 L392,306" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="392" y="334" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#166534">processor replies</text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <rect x="40" y="548" width="600" height="270" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="82" cy="592" r="26" fill="#ea580c"/><text x="82" y="601" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="122" y="602" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Card → reader: load modulation</text>
    <rect x="66" y="624" width="220" height="84" rx="10" fill="#ffffff" stroke="#9a3412" stroke-width="2"/><rect x="346" y="624" width="220" height="84" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/><path d="M286,666 L346,666" class="wire"/>
    <text x="176" y="658" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#14213d">coil + chip</text>
    <text x="176" y="688" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#475569">draws energy</text>
    <text x="456" y="658" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#14213d">extra load</text>
    <text x="456" y="688" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#475569">switched on/off</text>
    <text x="66" y="744" text-anchor="start" style="font-size:21px;font-weight:600;fill:#9a3412">Switching at 847.5 kHz (13.56 MHz ÷ 16)</text>
    <text x="66" y="771" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">changes how much energy the card absorbs.</text>
    <text x="66" y="799" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">The card never makes its own carrier wave.</text>
  </g>
  <g data-f="4" transform="translate(0,314)">
    <rect x="40" y="834" width="600" height="216" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="82" cy="878" r="26" fill="#2563eb"/><text x="82" y="887" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text><text x="122" y="888" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Reader sees the change: sidebands</text>
    <line x1="90" y1="1012" x2="590" y2="1012" stroke="#334155" stroke-width="2"/><line x1="340" y1="1012" x2="340" y2="910" stroke="#1d4ed8" stroke-width="9"/><line x1="160" y1="1012" x2="160" y2="982" stroke="#1d4ed8" stroke-width="6"/><line x1="520" y1="1012" x2="520" y2="982" stroke="#1d4ed8" stroke-width="6"/>
    <text x="356" y="926" text-anchor="start" style="font-size:20px;font-weight:600;fill:#1e3a8a">carrier 13.56 MHz</text>
    <text x="160" y="970" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#1e3a8a">−847.5 kHz</text>
    <text x="520" y="970" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#1e3a8a">+847.5 kHz</text>
    <text x="626" y="1040" text-anchor="end" style="font-style:italic;font-size:20px;font-weight:400;fill:#475569">heights not to scale</text>
    <path d="M662,90 L694,90 L694,880 L646,880" class="a-signal" marker-end="url(#m-signal)"/>
  </g>
