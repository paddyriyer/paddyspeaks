    <text x="40" y="1410" class="note">ISO/IEC 14443-2 values as summarised by independent</text>
    <text x="40" y="1437" class="note">sources.</text>
    <path d="M40,1473 L74,1473" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="86" y="1478" class="s">Radio signal or wave</text>
    <path d="M40,1507 L74,1507" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="86" y="1512" class="s">Plaintext / local information</text>
  </g>
