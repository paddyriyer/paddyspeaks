<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1600" width="720" height="1600" font-family="Inter, Arial, sans-serif">
  <title>Scene 84: The first 180 days: decide, fix, build in</title>
  <desc>Four frames. 1, days 0 to 30, decide: name owners for tracker policy, company asset tags and safety cases; write the safety-first playbook with HR and legal; brief staff on reading alerts; check that endpoint baselines do not switch off Bluetooth detection on managed phones without a reason. 2, days 31 to 90, inventory and fix: list company tags and re-register any on personal accounts; add a tracker step to offboarding; assess vendors and the technical estate; run an incident tabletop. 3, days 91 to 180, build in: procurement criteria, audits of sharing and offboarding, recurring quarterly reviews, and a cryptographic inventory of long-lived readers and devices. 4, metrics: measure capabilities — share of company tags on managed accounts, share of leavers with the tracker step closed, time from a report to a safety plan, share of doors on modern credentials; never measure or rank people, count scans of staff, or set a target for incidents found.</desc>
  <style>
