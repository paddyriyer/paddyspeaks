    <text x="58" y="74" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d">Name owners: policy, company tags, safety cases</text><rect x="58" y="82" width="175" height="32" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="145.5" y="104" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#2563eb">security lead</text><text x="58" y="142" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d">Safety-first playbook, with advocate referral</text><rect x="58" y="150" width="54" height="32" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="85.0" y="172" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#2563eb">HR</text><rect x="120.0" y="150" width="87" height="32" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="163.5" y="172" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#2563eb">legal</text><text x="58" y="210" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d">Teach staff to read tracker alerts</text><rect x="449.0" y="188" width="120" height="32" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="509.0" y="210" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#2563eb">security</text><rect x="577.0" y="188" width="87" height="32" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="620.5" y="210" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#2563eb">comms</text><text x="58" y="250" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d">Bluetooth detection not switched off on managed phones</text><rect x="58" y="258" width="54" height="32" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="85.0" y="280" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#2563eb">IT</text>
    <path d="M360,301 L360,311" stroke="#94a3b8" stroke-width="3"/>
  </g>
