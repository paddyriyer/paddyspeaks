    <text x="58" y="698" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d">Security and privacy criteria in procurement</text><rect x="58" y="706" width="153" height="32" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="134.5" y="728" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#7c3aed">procurement</text><text x="58" y="766" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d">Audit sharing and offboarding</text><rect x="478.0" y="744" width="186" height="32" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="571.0" y="766" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#7c3aed">internal audit</text><text x="58" y="806" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d">Quarterly reviews become routine</text><rect x="482.0" y="784" width="54" height="32" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="509.0" y="806" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#7c3aed">IT</text><rect x="544.0" y="784" width="120" height="32" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="604.0" y="806" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#7c3aed">security</text><text x="58" y="846" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d">Crypto inventory of long-lived readers (Module 10)</text><rect x="58" y="854" width="186" height="32" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="151.0" y="876" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#7c3aed">security arch.</text>
  </g>
  <g data-f="4" transform="translate(0,262)">
