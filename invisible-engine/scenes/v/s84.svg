    <circle cx="76" cy="973" r="11" fill="#16a34a"/><path d="M71,974 L75,977 L82,969" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="980" text-anchor="start" style="font-size:20px;font-weight:600;fill:#14213d">Company tags on managed accounts (%)</text>
    <circle cx="76" cy="1001" r="11" fill="#16a34a"/><path d="M71,1002 L75,1005 L82,997" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="1008" text-anchor="start" style="font-size:20px;font-weight:600;fill:#14213d">Leavers with the tracker step closed (%)</text>
    <circle cx="76" cy="1029" r="11" fill="#16a34a"/><path d="M71,1030 L75,1033 L82,1025" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="1036" text-anchor="start" style="font-size:20px;font-weight:600;fill:#14213d">Time from a report to a safety plan</text>
    <circle cx="76" cy="1057" r="11" fill="#16a34a"/><path d="M71,1058 L75,1061 L82,1053" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="1064" text-anchor="start" style="font-size:20px;font-weight:600;fill:#14213d">Doors on modern credentials (%)</text>
    <rect x="40" y="1086" width="640" height="140" rx="18" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="64" y="1124" text-anchor="start" style="font-size:23px;font-weight:800;fill:#991b1b">Never measure</text>
    <circle cx="76" cy="1151" r="11" fill="#dc2626"/><path d="M71,1146 L81,1156 M81,1146 L71,1156" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><text x="98" y="1158" text-anchor="start" style="font-size:20px;font-weight:600;fill:#14213d">People, ranked or scored</text>
    <circle cx="76" cy="1179" r="11" fill="#dc2626"/><path d="M71,1174 L81,1184 M81,1174 L71,1184" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><text x="98" y="1186" text-anchor="start" style="font-size:20px;font-weight:600;fill:#14213d">How many staff were scanned</text>
    <circle cx="76" cy="1207" r="11" fill="#dc2626"/><path d="M71,1202 L81,1212 M81,1202 L71,1212" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><text x="98" y="1214" text-anchor="start" style="font-size:20px;font-weight:600;fill:#14213d">A target for incidents found</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1506" x2="680" y2="1506" stroke="#e2e8f0" stroke-width="2"/>
