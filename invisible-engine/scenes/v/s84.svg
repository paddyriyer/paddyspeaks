    <text x="58" y="386" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d">List company tags; re-register to managed accounts</text><rect x="58" y="394" width="175" height="32" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="145.5" y="416" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0d9488">IT asset mgmt</text><text x="58" y="454" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d">Tracker and sharing step in offboarding</text><rect x="548.0" y="432" width="54" height="32" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="575.0" y="454" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0d9488">HR</text><rect x="610.0" y="432" width="54" height="32" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="637.0" y="454" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0d9488">IT</text><text x="58" y="494" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d">Assess vendors and the technical estate</text><rect x="58" y="502" width="120" height="32" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="118.0" y="524" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0d9488">security</text><rect x="186.0" y="502" width="153" height="32" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="262.5" y="524" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0d9488">procurement</text><text x="58" y="562" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d">Incident tabletop: a tag found on a person</text><rect x="58" y="570" width="120" height="32" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="118.0" y="592" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0d9488">security</text><rect x="186.0" y="570" width="54" height="32" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="213.0" y="592" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0d9488">HR</text><rect x="248.0" y="570" width="87" height="32" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="291.5" y="592" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0d9488">legal</text>
    <path d="M360,613 L360,623" stroke="#94a3b8" stroke-width="3"/>
