  <rect class="bg" width="720" height="1600"/>
  <text x="40" y="50" class="k">SCENE 84</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The first 180 days:</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">decide, fix, build in</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Each step has an owner. Each metric measures a</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">capability, never a person.</text>
