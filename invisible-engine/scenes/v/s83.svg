<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1511" width="720" height="1511" font-family="Inter, Arial, sans-serif">
  <title>Scene 83: A tracker safety policy that protects people without watching them</title>
  <desc>Five frames. 1, notices: visitors and employees are told that company tags locate assets, never people, and how to report a tag that is not theirs; facilities and security with communications. 2, executive travel: briefings, bag and vehicle checks offered with consent, and alerts left on the phones they carry; travel security. 3, discreet escalation: a private route to security and HR, no public naming, and safety first because disabling a tracker can alert whoever placed it. 4, voluntary support and due process: advocate referral, time and practical help, fair investigation with legal review, and nobody confronts a suspected stalker on the employee’s behalf. 5, what the policy must not do: no blanket location tracking of staff, no constant scanning of people, no reading of personal phones in the name of privacy protection; scanning, if any, is limited to restricted areas after legal and works-council review.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1511"/>
  <text x="40" y="50" class="k">SCENE 83</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">A tracker safety policy</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">that protects people</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">without watching them</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">The aim is a safe person, not a watched one.</text>
  <g data-f="1" transform="translate(0,283)">
    <rect x="40" y="0" width="640" height="176" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="68" cy="30" r="18" fill="#2563eb"/><text x="68" y="36" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="98" y="38" text-anchor="start" style="font-size:23px;font-weight:800;fill:#2563eb">Notices</text>
    <text x="58" y="72" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Visitors and staff are told: company</text><text x="58" y="99" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">tags locate assets, never people.</text><text x="58" y="126" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">How to report a tag that is not theirs.</text>
    <text x="58" y="158" text-anchor="start" style="font-size:20px;font-weight:800;fill:#475569">Who does it</text>
    <rect x="190" y="135" width="142" height="32" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="261.0" y="157" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#2563eb">facilities</text><rect x="340.0" y="135" width="120" height="32" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="400.0" y="157" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#2563eb">security</text><rect x="468.0" y="135" width="87" height="32" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="511.5" y="157" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#2563eb">comms</text>
  </g>
  <g data-f="2" transform="translate(0,283)">
    <rect x="40" y="186" width="640" height="176" rx="14" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <circle cx="68" cy="216" r="18" fill="#0d9488"/><text x="68" y="222" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="98" y="224" text-anchor="start" style="font-size:23px;font-weight:800;fill:#0d9488">Executive travel</text>
    <text x="58" y="258" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Briefings before trips. Bag and</text><text x="58" y="285" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">vehicle checks offered, with consent.</text><text x="58" y="312" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Alerts left on the phones they carry.</text>
    <text x="58" y="344" text-anchor="start" style="font-size:20px;font-weight:800;fill:#475569">Who does it</text>
    <rect x="190" y="321" width="197" height="32" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="288.5" y="343" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0d9488">travel security</text>
  </g>
  <g data-f="3" transform="translate(0,283)">
    <rect x="40" y="372" width="640" height="176" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <circle cx="68" cy="402" r="18" fill="#b45309"/><text x="68" y="408" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="98" y="410" text-anchor="start" style="font-size:23px;font-weight:800;fill:#b45309">Discreet escalation</text>
    <text x="58" y="444" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">A private route to security and HR.</text><text x="58" y="471" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">No public naming. Safety first:</text><text x="58" y="498" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">disabling can alert whoever placed it.</text>
    <text x="58" y="530" text-anchor="start" style="font-size:20px;font-weight:800;fill:#475569">Who does it</text>
    <rect x="190" y="507" width="120" height="32" rx="16" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="250.0" y="529" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#b45309">security</text><rect x="318.0" y="507" width="54" height="32" rx="16" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="345.0" y="529" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#b45309">HR</text>
  </g>
  <g data-f="4" transform="translate(0,283)">
    <rect x="40" y="558" width="640" height="176" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <circle cx="68" cy="588" r="18" fill="#16a34a"/><text x="68" y="594" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="98" y="596" text-anchor="start" style="font-size:23px;font-weight:800;fill:#16a34a">Support and due process</text>
    <text x="58" y="630" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Advocate referral, time, practical help.</text><text x="58" y="657" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Fair investigation with legal review.</text><text x="58" y="684" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Nobody confronts on the person’s behalf.</text>
    <text x="58" y="716" text-anchor="start" style="font-size:20px;font-weight:800;fill:#475569">Who does it</text>
    <rect x="190" y="693" width="54" height="32" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="217.0" y="715" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#16a34a">HR</text><rect x="252.0" y="693" width="87" height="32" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="295.5" y="715" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#16a34a">legal</text>
  </g>
  <g data-f="5" transform="translate(0,283)">
    <rect x="40" y="744" width="640" height="372" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="64" y="788" text-anchor="start" style="font-size:24px;font-weight:800;fill:#991b1b">What it must not do</text>
    <path d="M570,776 Q606,749 642,776 Q606,803 570,776 Z" fill="#ffffff" stroke="#991b1b" stroke-width="2.7"/><circle cx="606" cy="776" r="11" fill="#991b1b"/>
    <path d="M564,760 L646,794" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
    <circle cx="78" cy="829" r="13" fill="#dc2626"/><path d="M73,824 L83,834 M83,824 L73,834" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><text x="104" y="836" text-anchor="start" style="font-size:21px;font-weight:600;fill:#1f2937">Track where staff go, all the time</text>
    <circle cx="78" cy="867" r="13" fill="#dc2626"/><path d="M73,862 L83,872 M83,862 L73,872" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><text x="104" y="874" text-anchor="start" style="font-size:21px;font-weight:600;fill:#1f2937">Scan people constantly for radio signals</text>
    <circle cx="78" cy="905" r="13" fill="#dc2626"/><path d="M73,900 L83,910 M83,900 L73,910" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><text x="104" y="912" text-anchor="start" style="font-size:21px;font-weight:600;fill:#1f2937">Read personal phones or personal accounts</text>
    <circle cx="78" cy="943" r="13" fill="#dc2626"/><path d="M73,938 L83,948 M83,938 L73,948" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><text x="104" y="950" text-anchor="start" style="font-size:21px;font-weight:600;fill:#1f2937">Call any of this “privacy protection”</text>
    <rect x="60" y="986" width="600" height="114" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
    <text x="78" y="1018" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">If any scanning: restricted areas only, data minimised,</text><text x="78" y="1044" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">after legal and works-council review.</text>
    <rect x="78" y="1056" width="87" height="32" rx="16" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="121.5" y="1078" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#dc2626">legal</text><rect x="173.0" y="1056" width="120" height="32" rx="16" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="233.0" y="1078" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#dc2626">security</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1417" x2="680" y2="1417" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1447" class="note">Policy outline, not legal advice. Follow local law and</text>
    <text x="40" y="1474" class="note">labour rules.</text>
  </g>
</svg>
