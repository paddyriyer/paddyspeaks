    <circle cx="62" cy="635" r="7" fill="#1e3a8a"/><path d="M52,670 L52,652 Q52,645 59,645 L65,645 Q72,645 72,652 L72,670 Z" fill="#1e3a8a"/><rect x="54" y="668" width="6" height="26" rx="2" fill="#1e3a8a"/><rect x="64" y="668" width="6" height="26" rx="2" fill="#1e3a8a"/>
    <text x="100" y="656" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">An employee or executive</text><text x="100" y="684" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">at work or travelling</text>
    <rect x="40" y="706" width="300" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="749.5" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">Alert at work or while</text><text x="56" y="776.5" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">travelling</text>
    <rect x="380" y="706" width="300" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="396" y="749.5" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">Tell security or HR as</text><text x="396" y="776.5" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">well as someone you trust</text>
    <rect x="40" y="828" width="300" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="858.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">The company can help:</text><text x="56" y="885.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">safer workplace, travel</text><text x="56" y="912.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">and parking</text>
    <rect x="380" y="828" width="300" height="100" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="396" y="858.0" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d">Its playbook: safety first,</text><text x="396" y="885.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">evidence, advice. Never</text><text x="396" y="912.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">search colleagues’ things.</text>
    <path d="M342,756 L378,756" fill="none" stroke="#94a3b8" stroke-width="3"/><path d="M368,749 L378,756 L368,763 Z" fill="#94a3b8"/>
    <path d="M530,806 L530,817 L190,817 L190,828" fill="none" stroke="#94a3b8" stroke-width="3"/><path d="M183,818 L190,828 L197,818 Z" fill="#94a3b8"/>
    <path d="M342,878 L378,878" fill="none" stroke="#94a3b8" stroke-width="3"/><path d="M368,871 L378,878 L368,885 Z" fill="#94a3b8"/>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="940" width="640" height="150" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <path d="M58,960 L83,952 L107,960 L107,982 Q107,1003 83,1013 Q58,1003 58,982 Z" fill="#dc2626"/><path d="M72,982 L80,991 L95,974" fill="none" stroke="#ffffff" stroke-width="4.1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="124" y="980" text-anchor="start" style="font-size:24px;font-weight:800;fill:#991b1b">Consider your safety first.</text>
    <text x="124" y="1016" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Disabling a tracker can alert the person who</text><text x="124" y="1043" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">placed it. Decide when, and whether, with</text><text x="124" y="1070" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">someone who can help.</text>
    <rect x="40" y="1102" width="315" height="56" rx="28" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <text x="197" y="1137" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#166534">A person you trust</text>
    <rect x="365" y="1102" width="315" height="56" rx="28" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <text x="522" y="1137" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#166534">Local support services</text>
    <rect x="40" y="1168" width="315" height="56" rx="28" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <text x="197" y="1203" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#166534">Law enforcement</text>
    <rect x="365" y="1168" width="315" height="56" rx="28" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <text x="522" y="1203" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#166534">The platform’s safety guide</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1506" x2="680" y2="1506" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1536" class="note">Illustrative people. Not legal advice; local services</text>
    <text x="40" y="1563" class="note">and laws differ.</text>
  </g>
</svg>
