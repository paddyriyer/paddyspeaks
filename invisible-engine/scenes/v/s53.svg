  <rect class="bg" width="720" height="1600"/>
  <text x="40" y="50" class="k">SCENE 53</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Three people, three safe</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">paths</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Safety first, then help. None of these paths asks</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">anyone to confront, search or bypass.</text>
  <g data-f="1" transform="translate(0,262)">
    <circle cx="62" cy="7" r="7" fill="#475569"/><path d="M52,42 L52,24 Q52,17 59,17 L65,17 Q72,17 72,24 L72,42 Z" fill="#475569"/><rect x="54" y="40" width="6" height="26" rx="2" fill="#475569"/><rect x="64" y="40" width="6" height="26" rx="2" fill="#475569"/>
    <text x="100" y="28" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">The traveller</text><text x="100" y="56" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">an alert on a trip</text>
    <rect x="40" y="78" width="300" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="121.5" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">Alert: an unknown tracker</text><text x="56" y="148.5" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">is moving with you</text>
    <rect x="380" y="78" width="300" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="396" y="108.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">Are you safe right now?</text><text x="396" y="135.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">If not, get somewhere</text><text x="396" y="162.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">safe first.</text>
    <rect x="40" y="200" width="300" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="230.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">Innocent explanation?</text><text x="56" y="257.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">A companion’s tag in a</text><text x="56" y="284.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">shared bag or car.</text>
    <rect x="380" y="200" width="300" height="100" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="396" y="230.0" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d">Not explained? Record the</text><text x="396" y="257.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">alert, use its tools, get</text><text x="396" y="284.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">help before disabling.</text>
    <path d="M342,128 L378,128" fill="none" stroke="#94a3b8" stroke-width="3"/><path d="M368,121 L378,128 L368,135 Z" fill="#94a3b8"/>
    <path d="M530,178 L530,189 L190,189 L190,200" fill="none" stroke="#94a3b8" stroke-width="3"/><path d="M183,190 L190,200 L197,190 Z" fill="#94a3b8"/>
    <path d="M342,250 L378,250" fill="none" stroke="#94a3b8" stroke-width="3"/><path d="M368,243 L378,250 L368,257 Z" fill="#94a3b8"/>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <circle cx="62" cy="321" r="7" fill="#0f766e"/><path d="M52,356 L52,338 Q52,331 59,331 L65,331 Q72,331 72,338 L72,356 Z" fill="#0f766e"/><rect x="54" y="354" width="6" height="26" rx="2" fill="#0f766e"/><rect x="64" y="354" width="6" height="26" rx="2" fill="#0f766e"/>
    <text x="100" y="342" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">A family member at risk</text><text x="100" y="370" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">an older relative, a teenager</text>
    <rect x="40" y="392" width="300" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="435.5" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">Worried someone knows</text><text x="56" y="462.5" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">where they go</text>
    <rect x="380" y="392" width="300" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="396" y="422.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">Tell a trusted person —</text><text x="396" y="449.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">for a child, a grown-up</text><text x="396" y="476.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">they trust</text>
    <rect x="40" y="514" width="300" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="544.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">Make a plan with an</text><text x="56" y="571.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">advocate or a support</text><text x="56" y="598.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">service</text>
    <rect x="380" y="514" width="300" height="100" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="396" y="544.0" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d">Record what is safe to</text><text x="396" y="571.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">record; decide together</text><text x="396" y="598.0" text-anchor="start" style="font-size:21px;font-weight:400;fill:#14213d">whether to disable.</text>
    <path d="M342,442 L378,442" fill="none" stroke="#94a3b8" stroke-width="3"/><path d="M368,435 L378,442 L368,449 Z" fill="#94a3b8"/>
    <path d="M530,492 L530,503 L190,503 L190,514" fill="none" stroke="#94a3b8" stroke-width="3"/><path d="M183,504 L190,514 L197,504 Z" fill="#94a3b8"/>
    <path d="M342,564 L378,564" fill="none" stroke="#94a3b8" stroke-width="3"/><path d="M368,557 L378,564 L368,571 Z" fill="#94a3b8"/>
  </g>
