    <path d="M336,836 L574,836" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="317" y="794" width="275" height="32" rx="6" class="lab"/>
    <text x="455" y="816" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#15803d"><tspan x="455" dy="0">SELECT PPSE → app list</tspan></text>
    <path d="M336,884 L574,884" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="387" y="842" width="136" height="32" rx="6" class="lab"/>
    <text x="455" y="864" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#15803d"><tspan x="455" dy="0">SELECT AID</tspan></text>
