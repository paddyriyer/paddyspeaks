    <path d="M40,1526 L74,1526" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="86" y="1531" class="s">Plaintext / local information</text>
    <path d="M40,1560 L74,1560" class="a-crypto" marker-end="url(#m-crypto)"/>
