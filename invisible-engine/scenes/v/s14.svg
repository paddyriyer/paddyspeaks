"29" height="18" rx="4" fill="#22c55e" stroke="#111827" stroke-width="0.8"/><text x="329.5" y="82.5" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#0c4a6e">Tap to pay</text>
    <rect x="484" y="46" width="200" height="126" rx="10" fill="#0f172a" opacity="0.12"/><rect x="480" y="40" width="200" height="126" rx="10" fill="#1e3a8a"/><path d="M480,118 Q580,97 680,128 L680,156 Q680,166 670,166 L490,166 Q480,166 480,156 Z" fill="#1d4ed8" opacity="0.55"/><path d="M640.0,79.2 q5.4,6.2 0,12.3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M646.9,73.8 q9.2,11.5 0,23.1" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M653.8,68.4 q13.1,16.9 0,33.8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><rect x="500.0" y="81.58000000000001" width="30.0" height="30.24" rx="5" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M515.0,81.58000000000001 L515.0,111.82000000000001 M500.0,91.66000000000001 L511.4,91.66000000000001 M518.6,91.66000000000001 L530.0,91.66000000000001 M500.0,101.74000000000001 L511.4,101.74000000000001 M518.6,101.74000000000001 L530.0,101.74000000000001" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="511.4" y="88.23280000000001" width="7.199999999999999" height="16.9344" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/><text x="608.0" y="70.24" text-anchor="end" style="font-size:20px;font-weight:800;fill:#e0e7ff">BANK</text><text x="496.0" y="148.36" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#ffffff">•••• 1234</text>
