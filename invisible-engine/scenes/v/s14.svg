    <rect x="283" y="516" width="345" height="32" rx="6" class="lab"/>
    <text x="455" y="538" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#1d4ed8"><tspan x="455" dy="0">ANTICOLLISION / SELECT (UID)</tspan></text>
    <path d="M574,606 L336,606" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="428" y="564" width="55" height="32" rx="6" class="lab"/>
    <text x="455" y="586" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#1d4ed8"><tspan x="455" dy="0">SAK</tspan></text>
    <rect x="40" y="400" width="220" height="214" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="82" cy="444" r="26" fill="#0d9488"/><text x="82" y="453" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text>
    <text x="118" y="440" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d"><tspan x="118" dy="0">14443-3 ·</tspan><tspan x="118" dy="27">Activation</tspan></text>
    <text x="58" y="500" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="58" dy="0">who is there?</tspan><tspan x="58" dy="27">pick one card</tspan></text>
  </g>
