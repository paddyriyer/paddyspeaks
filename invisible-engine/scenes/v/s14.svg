    <text x="455" y="912" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#15803d"><tspan x="455" dy="0">GET PROCESSING OPTIONS</tspan></text>
    <path d="M574,980 L336,980" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="317" y="938" width="275" height="32" rx="6" class="lab"/>
    <text x="455" y="960" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#7e22ce"><tspan x="455" dy="0">card data + cryptogram</tspan></text>
    <rect x="40" y="774" width="220" height="214" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="82" cy="818" r="26" fill="#7c3aed"/><text x="82" y="827" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text>
    <text x="118" y="814" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d"><tspan x="118" dy="0">EMV</tspan><tspan x="118" dy="27">application</tspan></text>
    <text x="58" y="874" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="58" dy="0">choose app;</tspan><tspan x="58" dy="27">terminal data</tspan><tspan x="58" dy="27">incl. amount</tspan><tspan x="58" dy="27">and UN</tspan></text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="1006" width="640" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="66" cy="1036" r="18" fill="#334155"/><text x="66" y="1042" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="94" y="1042" text-anchor="start" style="font-size:26px;font-weight:800;fill:#334155">Illustrative, not a packet trace</text><text x="56" y="1078" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Type B cards use different activation commands. The EMV</tspan><tspan x="56" dy="26">steps — and where the cryptogram appears — depend on the</tspan><tspan x="56" dy="26">payment network’s contactless kernel.</tspan></text>
  </g>
