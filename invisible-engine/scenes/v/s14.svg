  </g>
  <g data-f="1" transform="translate(0,262)">
    <path d="M336,312 L574,312" class="a-energy" marker-end="url(#m-energy)"/>
    <rect x="329" y="270" width="252" height="32" rx="6" class="lab"/>
    <text x="455" y="292" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#c2410c"><tspan x="455" dy="0">field on (13.56 MHz)</tspan></text>
    <rect x="40" y="250" width="220" height="140" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="82" cy="294" r="26" fill="#2563eb"/><text x="82" y="303" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text>
    <text x="118" y="290" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d"><tspan x="118" dy="0">14443-2 ·</tspan><tspan x="118" dy="27">Radio</tspan></text>
    <text x="58" y="350" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="58" dy="0">field on, power,</tspan><tspan x="58" dy="27">modulation</tspan></text>
  </g>
