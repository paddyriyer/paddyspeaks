  <rect class="bg" width="720" height="1595"/>
  <text x="40" y="50" class="k">SCENE 14</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Layers of agreement: from</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">radio to payment</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Each layer trusts the one beneath it.</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">Illustrative, not a packet trace.</text>
