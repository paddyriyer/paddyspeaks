    <text x="455" y="666" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#1d4ed8"><tspan x="455" dy="0">RATS</tspan></text>
    <path d="M574,734 L336,734" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="428" y="692" width="55" height="32" rx="6" class="lab"/>
    <text x="455" y="714" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#1d4ed8"><tspan x="455" dy="0">ATS</tspan></text>
    <rect x="40" y="624" width="220" height="140" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="82" cy="668" r="26" fill="#b45309"/><text x="82" y="677" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text>
    <text x="118" y="664" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d"><tspan x="118" dy="0">14443-4 ·</tspan><tspan x="118" dy="27">Transport</tspan></text>
    <text x="58" y="724" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="58" dy="0">reliable message</tspan><tspan x="58" dy="27">blocks</tspan></text>
  </g>
