<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1578" width="720" height="1578" font-family="Inter, Arial, sans-serif">
  <title>Scene 82: Accounts first: company tags on company accounts</title>
  <desc>Five frames. 1, two separate worlds: the company’s managed account holds company tags, managed phones and laptops; the person’s own account holds their own phone and their own tags; the two are never mixed. 2, minimum necessary sharing: a company tag is shared only with the people whose role needs it, and personal locations are never shared with the company. 3, strong sign-in: security keys or multi-factor authentication where available, and limits on who may enrol new devices. 4, trusted-device review and rotation: review the trusted devices regularly and rotate keys and credentials when people or devices change. 5, deprovisioning: when someone leaves, remove their shares, move company tags off any account they control, and revoke their devices; each step names who does it.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1578"/>
  <text x="40" y="50" class="k">SCENE 82</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Accounts first: company</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">tags on company accounts</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Zero trust for a finder network starts with which</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">account owns which tag.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="0" width="640" height="236" rx="18" class="bound"/>
    <text x="64" y="38" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Company’s managed account</text>
    <path d="M97,160 a34,34 0 0 1 3,-58 a44,44 0 0 1 85,-11 a31,31 0 0 1 7,69 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/><text x="145" y="140" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#14213d">managed</text>
    <circle cx="285" cy="125" r="22" fill="#0f172a" opacity="0.13"/><circle cx="282" cy="120" r="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="282" cy="120" r="14" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/><circle cx="343" cy="125" r="22" fill="#0f172a" opacity="0.13"/><circle cx="340" cy="120" r="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="340" cy="120" r="14" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="311" y="178" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#334155">company tags</text>
    <rect x="409" y="63" width="64" height="128" rx="11" fill="#0f172a" opacity="0.14"/><rect x="404" y="56" width="64" height="128" rx="11" fill="#111827"/><rect x="408" y="60" width="56" height="120" rx="8" fill="#dcfce7"/><rect x="427" y="62" width="18" height="4" rx="2" fill="#111827"/><text x="436" y="206" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#334155">managed</text><text x="436" y="228" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#334155">phone</text>
    <rect x="520" y="96" width="120" height="84" rx="8" fill="#1f2937"/><rect x="528" y="104" width="104" height="66" rx="4" fill="#e0f2fe"/><path d="M510,194 L520,180 L640,180 L650,194 Z" fill="#475569"/><text x="580" y="210" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#334155">laptop</text>
    <rect x="290" y="246" width="140" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="360" y="273" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#b91c1c">never mix</text>
    <rect x="40" y="296" width="640" height="236" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="64" y="334" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">The person’s own account</text>
    <path d="M97,456 a34,34 0 0 1 3,-58 a44,44 0 0 1 85,-11 a31,31 0 0 1 7,69 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/><text x="145" y="436" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#14213d">personal</text>
    <rect x="275" y="359" width="64" height="128" rx="11" fill="#0f172a" opacity="0.14"/><rect x="270" y="352" width="64" height="128" rx="11" fill="#111827"/><rect x="274" y="356" width="56" height="120" rx="8" fill="#e0f2fe"/><rect x="293" y="358" width="18" height="4" rx="2" fill="#111827"/><text x="302" y="506" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#334155">own phone</text>
    <circle cx="423" cy="421" r="22" fill="#0f172a" opacity="0.13"/><circle cx="420" cy="416" r="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="420" cy="416" r="14" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/><text x="420" y="474" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#334155">own tag</text>
    <text x="530" y="398" text-anchor="start" style="font-size:21px;font-weight:600;fill:#475569">theirs,</text><text x="530" y="426" text-anchor="start" style="font-size:21px;font-weight:600;fill:#475569">not the</text><text x="530" y="454" text-anchor="start" style="font-size:21px;font-weight:600;fill:#475569">company’s</text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="40" y="546" width="640" height="150" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="68" cy="574" r="17" fill="#2563eb"/><text x="68" y="580" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#ffffff">2</text><text x="96" y="582" text-anchor="start" style="font-size:22px;font-weight:800;fill:#2563eb">Minimum sharing</text>
    <text x="58" y="616" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Share a company tag only with the roles that need it.</text><text x="58" y="643" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Personal locations are never shared with the company.</text>
    <text x="58" y="678" text-anchor="start" style="font-size:20px;font-weight:800;fill:#475569">Who does it</text>
    <rect x="190" y="655" width="54" height="32" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="217.0" y="677" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#2563eb">IT</text><rect x="252.0" y="655" width="131" height="32" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="317.5" y="677" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#2563eb">team lead</text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="40" y="704" width="640" height="150" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="68" cy="732" r="17" fill="#7c3aed"/><text x="68" y="738" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#ffffff">3</text><text x="96" y="740" text-anchor="start" style="font-size:22px;font-weight:800;fill:#7c3aed">Strong sign-in</text>
    <text x="58" y="774" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Security keys or multi-factor where available; limits on</text><text x="58" y="801" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">who may enrol a new device to the account.</text>
    <text x="58" y="836" text-anchor="start" style="font-size:20px;font-weight:800;fill:#475569">Who does it</text>
    <rect x="190" y="813" width="175" height="32" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="277.5" y="835" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#7c3aed">IT / identity</text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="862" width="640" height="150" rx="14" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <circle cx="68" cy="890" r="17" fill="#0d9488"/><text x="68" y="896" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#ffffff">4</text><text x="96" y="898" text-anchor="start" style="font-size:22px;font-weight:800;fill:#0d9488">Review and rotate</text>
    <text x="58" y="932" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Review trusted devices every quarter; rotate keys and</text><text x="58" y="959" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">credentials when people or devices change.</text>
    <text x="58" y="994" text-anchor="start" style="font-size:20px;font-weight:800;fill:#475569">Who does it</text>
    <rect x="190" y="971" width="175" height="32" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="277.5" y="993" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0d9488">IT / identity</text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="1020" width="640" height="150" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <circle cx="68" cy="1048" r="17" fill="#b45309"/><text x="68" y="1054" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#ffffff">5</text><text x="96" y="1056" text-anchor="start" style="font-size:22px;font-weight:800;fill:#b45309">Deprovision leavers</text>
    <text x="58" y="1090" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Remove their shares; move company tags off accounts</text><text x="58" y="1117" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">they control; revoke their devices.</text>
    <text x="58" y="1152" text-anchor="start" style="font-size:20px;font-weight:800;fill:#475569">Who does it</text>
    <rect x="190" y="1129" width="54" height="32" rx="16" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="217.0" y="1151" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#b45309">HR</text><rect x="252.0" y="1129" width="54" height="32" rx="16" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="279.0" y="1151" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#b45309">IT</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1450" x2="680" y2="1450" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1480" class="note">Follows zero-trust principles (NIST SP 800-207);</text>
    <text x="40" y="1507" class="note">controls depend on what each vendor offers.</text>
    <rect x="40" y="1534" width="34" height="18" rx="3" class="bound" style="stroke-width:4"/>
    <text x="86" y="1548" class="s">Trust or hardware boundary</text>
  </g>
</svg>
