<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1587" width="720" height="1587" font-family="Inter, Arial, sans-serif">
  <title>Scene 29: Battery life is a budget</title>
  <desc>Five frames. A CR2032-class coin cell of about 225 milliamp-hours nominal, with usable capacity lower under pulses and cold; the radio’s average current from the advertising duty cycle, about 11 microamps with illustrative values; the whole budget as a stacked bar, adding motion sensing, occasional sound and ultra-wideband or NFC sessions, and self-discharge, about 14 microamps in total; the estimated life, usable capacity divided by average current, about a year and a half with these assumptions; and the levers, speaking less often lasts longer but gives fewer chances to be heard.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1587"/>
  <text x="40" y="50" class="k">SCENE 29</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Battery life is a budget</text>
  <text x="40" y="153" style="font-size:23px;fill:#475569">Every number on this page is an illustrative</text>
  <text x="40" y="184" style="font-size:23px;fill:#475569">assumption. Real devices differ.</text>
  <g data-f="1" transform="translate(0,210)">
    <circle cx="120" cy="86" r="72" fill="#e5e7eb" stroke="#6b7280" stroke-width="4"/><circle cx="120" cy="86" r="58" fill="none" stroke="#9ca3af" stroke-width="2"/><text x="120" y="92" text-anchor="middle" style="font-size:23px;font-weight:700;fill:#374151">CR2032</text>
    <rect x="240" y="0" width="440" height="172" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="266" cy="30" r="18" fill="#ea580c"/><text x="266" y="36" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="294" y="36" text-anchor="start" style="font-size:26px;font-weight:800;fill:#ea580c">The battery</text><text x="256" y="72" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="256" dy="0">CR2032-class: 3 V, ~225 mAh</tspan><tspan x="256" dy="27">nominal. Usable is less with</tspan><tspan x="256" dy="27">pulses, cold and age.</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,210)">
    <rect x="40" y="186" width="640" height="262" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="82" cy="230" r="26" fill="#2563eb"/><text x="82" y="239" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="122" y="240" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Radio: the duty cycle</text>
    <text x="64" y="282" text-anchor="start" style="font-size:21px;font-weight:700;fill:#1e3a8a">speaks 3 ms every 2 s → on 0.15% of the time</text>
    <rect x="80" y="302" width="10" height="56" fill="#1d4ed8"/>
    <rect x="200" y="302" width="10" height="56" fill="#1d4ed8"/>
    <rect x="320" y="302" width="10" height="56" fill="#1d4ed8"/>
    <rect x="440" y="302" width="10" height="56" fill="#1d4ed8"/>
    <rect x="560" y="302" width="10" height="56" fill="#1d4ed8"/>
    <path d="M64,358 L656,358" stroke="#16a34a" stroke-width="3"/>
    <text x="64" y="398" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:21px;font-weight:800;fill:#14213d">I_avg ≈ 6 mA × 0.0015 + 2 µA ≈ 11 µA</text>
    <text x="64" y="428" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">radio events + sleep (from Scene 24)</text>
  </g>
  <g data-f="3" transform="translate(0,210)">
    <rect x="40" y="462" width="640" height="390" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="82" cy="506" r="26" fill="#334155"/><text x="82" y="515" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="122" y="516" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Whole budget (µA)</text>
    <rect x="80" y="668" width="100" height="162" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/>
    <rect x="80" y="632" width="100" height="36" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
    <rect x="80" y="605" width="100" height="27" fill="#0d9488" stroke="#ffffff" stroke-width="2"/>
    <rect x="80" y="578" width="100" height="27" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
    <rect x="80" y="573" width="100" height="5" fill="#6b7280" stroke="#ffffff" stroke-width="2"/>
    <text x="200" y="582.3" text-anchor="start" style="font-size:21px;font-weight:700;fill:#14213d">self-discharge: 0.3</text>
    <text x="200" y="614.3" text-anchor="start" style="font-size:21px;font-weight:700;fill:#14213d">sound, UWB, NFC (averaged): 1.5</text>
    <text x="200" y="646.3" text-anchor="start" style="font-size:21px;font-weight:700;fill:#14213d">motion sensing: 1.5</text>
    <text x="200" y="678.3" text-anchor="start" style="font-size:21px;font-weight:700;fill:#14213d">sleep, timers: 2</text>
    <text x="200" y="756.0" text-anchor="start" style="font-size:21px;font-weight:700;fill:#14213d">advertising: 9</text>
    <text x="80" y="554.6" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">total ≈ 14 µA</text>
  </g>
  <g data-f="4" transform="translate(0,210)">
    <rect x="40" y="866" width="640" height="180" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="82" cy="910" r="26" fill="#ea580c"/><text x="82" y="919" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text><text x="122" y="920" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Estimated life</text>
    <text x="64" y="962" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:21px;font-weight:800;fill:#14213d">life ≈ usable capacity / I_avg</text>
    <text x="64" y="994" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:21px;font-weight:700;fill:#9a3412">≈ 180 mAh / 0.014 mA ≈ 12,600 h ≈ 1.4 years</text>
    <text x="64" y="1026" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#475569">Apple states “more than a year” for AirTag (documented).</text>
  </g>
  <g data-f="5" transform="translate(0,210)">
    <rect x="40" y="1060" width="640" height="232" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="82" cy="1104" r="26" fill="#0d9488"/><text x="82" y="1113" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text><text x="122" y="1114" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">The levers trade against each other</text>
    <text x="64" y="1158" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="64" dy="0">Speak less often → longer life, fewer chances to be</tspan><tspan x="64" dy="27">heard · Speak more quietly → longer life, shorter range</tspan></text>
    <text x="64" y="1218" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="64" dy="0">More sensing or sound → shorter life · Cold weather →</tspan><tspan x="64" dy="27">less usable capacity. Try the trade-offs in demo C</tspan><tspan x="64" dy="27">below.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1520" x2="680" y2="1520" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1550" class="note">Illustrative assumptions throughout.</text>
  </g>
</svg>
