<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1596" width="720" height="1596" font-family="Inter, Arial, sans-serif">
  <title>Scene 74: The new standard locks: three NIST algorithms</title>
  <desc>Five frames. 1, ML-KEM, FIPS 203: a key-encapsulation mechanism for agreeing a shared secret, built on module lattices. 2, ML-DSA, FIPS 204: a digital signature scheme, also lattice-based. 3, SLH-DSA, FIPS 205: a stateless hash-based signature scheme whose security rests only on hash functions; larger and slower, a conservative alternative. All three were published by NIST on 13 August 2024. 4, in progress, to be checked against NIST’s current pages: FN-DSA (Falcon, draft FIPS 206) and HQC, selected in March 2025 as a backup key-encapsulation mechanism. 5, all of these run on ordinary classical chips — phones, servers, smart cards — not on quantum computers; they are designed to resist known quantum attacks.</desc>
