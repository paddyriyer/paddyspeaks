  <rect class="bg" width="720" height="1596"/>
  <text x="40" y="50" class="k">SCENE 74</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The new standard locks:</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">three NIST algorithms</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Published August 2024. Classical algorithms,</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">designed to resist known quantum attacks.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="0" width="640" height="196" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="78" cy="40" r="24" fill="#7c3aed"/><text x="78" y="49" text-anchor="middle" style="font-size:25px;font-weight:800;fill:#ffffff">1</text>
    <text x="114" y="52" text-anchor="start" style="font-size:32px;font-weight:800;fill:#14213d">ML-KEM</text>
    <rect x="506" y="18" width="150" height="40" rx="20" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="581" y="46" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:800;fill:#7c3aed">FIPS 203</text>
    <text x="62" y="94" text-anchor="start" style="font-size:24px;font-weight:800;fill:#7c3aed">Key establishment</text>
    <text x="656" y="94" text-anchor="end" style="font-size:21px;font-weight:600;fill:#475569">Published 13 August 2024</text>
    <text x="62" y="128" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Two parties agree a shared secret.</text><text x="62" y="155" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Replaces ECDH / RSA key transport.</text><text x="62" y="182" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Module lattices.</text>
    <path d="M603,142 L603,129 a18,18 0 0 1 36,0 L639,142" fill="none" stroke="#7c3aed" stroke-width="6.5"/><rect x="590" y="139" width="62" height="49" rx="8" fill="#7c3aed"/><circle cx="621" cy="160" r="6" fill="#ffffff"/><rect x="619" y="163" width="5" height="13" fill="#ffffff"/>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="40" y="208" width="640" height="196" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="78" cy="248" r="24" fill="#2563eb"/><text x="78" y="257" text-anchor="middle" style="font-size:25px;font-weight:800;fill:#ffffff">2</text>
    <text x="114" y="260" text-anchor="start" style="font-size:32px;font-weight:800;fill:#14213d">ML-DSA</text>
    <rect x="506" y="226" width="150" height="40" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="581" y="254" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:800;fill:#2563eb">FIPS 204</text>
    <text x="62" y="302" text-anchor="start" style="font-size:24px;font-weight:800;fill:#2563eb">Signatures</text>
    <text x="656" y="302" text-anchor="end" style="font-size:21px;font-weight:600;fill:#475569">Published 13 August 2024</text>
    <text x="62" y="336" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Proves who signed and that nothing</text><text x="62" y="363" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">changed. Replaces ECDSA / RSA</text><text x="62" y="390" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">signatures. Module lattices.</text>
    <circle cx="566" cy="354" r="20" fill="none" stroke="#2563eb" stroke-width="7.0"/><path d="M586,354 L633,354 M619,354 L619,368 M630,354 L630,365" stroke="#2563eb" stroke-width="7.0"/>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="40" y="416" width="640" height="196" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <circle cx="78" cy="456" r="24" fill="#0d9488"/><text x="78" y="465" text-anchor="middle" style="font-size:25px;font-weight:800;fill:#ffffff">3</text>
    <text x="114" y="468" text-anchor="start" style="font-size:32px;font-weight:800;fill:#14213d">SLH-DSA</text>
    <rect x="506" y="434" width="150" height="40" rx="20" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="581" y="462" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:800;fill:#0d9488">FIPS 205</text>
    <text x="62" y="510" text-anchor="start" style="font-size:24px;font-weight:800;fill:#0d9488">Signatures, hash-based</text>
    <text x="656" y="510" text-anchor="end" style="font-size:21px;font-weight:600;fill:#475569">Published 13 August 2024</text>
    <text x="62" y="544" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Rests only on hash functions. Larger and</text><text x="62" y="571" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">slower: a conservative alternative to</text><text x="62" y="598" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">ML-DSA.</text>
    <circle cx="566" cy="562" r="20" fill="none" stroke="#0d9488" stroke-width="7.0"/><path d="M586,562 L633,562 M619,562 L619,576 M630,562 L630,573" stroke="#0d9488" stroke-width="7.0"/>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="626" width="640" height="175" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="66" cy="656" r="18" fill="#b45309"/><text x="66" y="662" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="94" y="662" text-anchor="start" style="font-size:23px;font-weight:800;fill:#b45309">In progress — check NIST’s current pages</text><text x="56" y="695" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">FN-DSA (Falcon): draft FIPS 206, a compact lattice</tspan><tspan x="56" dy="27">signature. HQC: selected March 2025 as a backup</tspan><tspan x="56" dy="27">key-encapsulation mechanism built on different</tspan><tspan x="56" dy="27">mathematics (codes).</tspan></text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="813" width="640" height="175" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="66" cy="843" r="18" fill="#16a34a"/><text x="66" y="849" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="94" y="849" text-anchor="start" style="font-size:26px;font-weight:800;fill:#16a34a">They run on ordinary chips</text><text x="56" y="885" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Post-quantum cryptography is classical software and</tspan><tspan x="56" dy="27">hardware: phones, servers, smart cards. It is designed</tspan><tspan x="56" dy="27">to resist known quantum attacks — not run on quantum</tspan><tspan x="56" dy="27">computers.</tspan></text>
    <text x="40" y="1018" text-anchor="start" style="font-size:21px;font-weight:600;fill:#166534">the same everyday devices →</text>
    <rect x="65" y="1055" width="70" height="140" rx="12" fill="#0f172a" opacity="0.14"/><rect x="60" y="1048" width="70" height="140" rx="12" fill="#111827"/><rect x="64" y="1052" width="62" height="132" rx="9" fill="#e0f2fe"/><rect x="85" y="1055" width="20" height="5" rx="2" fill="#111827"/><rect x="160" y="1058" width="96" height="34" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="174" cy="1075" r="4" fill="#22c55e"/><rect x="192" y="1071" width="51" height="8" rx="3" fill="#94a3b8"/><rect x="160" y="1098" width="96" height="34" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="174" cy="1115" r="4" fill="#22c55e"/><rect x="192" y="1111" width="51" height="8" rx="3" fill="#94a3b8"/><rect x="160" y="1138" width="96" height="34" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="174" cy="1155" r="4" fill="#22c55e"/><rect x="192" y="1151" width="51" height="8" rx="3" fill="#94a3b8"/><rect x="316" y="1034" width="364" height="170" rx="10" fill="#1f2937"/><rect x="338" y="1022" width="12" height="12" fill="#9ca3af"/><rect x="338" y="1204" width="12" height="12" fill="#9ca3af"/><rect x="376" y="1022" width="12" height="12" fill="#9ca3af"/><rect x="376" y="1204" width="12" height="12" fill="#9ca3af"/><rect x="414" y="1022" width="12" height="12" fill="#9ca3af"/><rect x="414" y="1204" width="12" height="12" fill="#9ca3af"/><rect x="452" y="1022" width="12" height="12" fill="#9ca3af"/><rect x="452" y="1204" width="12" height="12" fill="#9ca3af"/><rect x="490" y="1022" width="12" height="12" fill="#9ca3af"/><rect x="490" y="1204" width="12" height="12" fill="#9ca3af"/><rect x="528" y="1022" width="12" height="12" fill="#9ca3af"/><rect x="528" y="1204" width="12" height="12" fill="#9ca3af"/><rect x="566" y="1022" width="12" height="12" fill="#9ca3af"/><rect x="566" y="1204" width="12" height="12" fill="#9ca3af"/><rect x="604" y="1022" width="12" height="12" fill="#9ca3af"/><rect x="604" y="1204" width="12" height="12" fill="#9ca3af"/><rect x="642" y="1022" width="12" height="12" fill="#9ca3af"/><rect x="642" y="1204" width="12" height="12" fill="#9ca3af"/><rect x="330" y="1052" width="108" height="94" rx="6" fill="#fca5a5"/><text x="384" y="1090" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#111827">boot ROM</text><text x="384" y="1122" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#111827">fixed</text><rect x="444" y="1052" width="108" height="94" rx="6" fill="#fcd34d"/><text x="498" y="1090" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#111827">flash</text><text x="498" y="1122" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#111827">firmware</text><rect x="558" y="1052" width="108" height="94" rx="6" fill="#93c5fd"/><text x="612" y="1090" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#111827">RAM</text><text x="612" y="1122" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#111827">tens</text><text x="498" y="1184" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#e5e7eb">card chip</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1502" x2="680" y2="1502" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1532" class="note">NIST FIPS 203, 204 and 205 (13 August 2024). Draft and</text>
    <text x="40" y="1559" class="note">candidate status: verify.</text>
