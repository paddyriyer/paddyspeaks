<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1594" width="720" height="1594" font-family="Inter, Arial, sans-serif">
  <title>Scene 43: The journey of a secret: from birth to revocation</title>
  <desc>Five frames in two groups. First, the owner-held keys that open location reports: 1, they are generated on the owner’s device, a key pair plus a secret seed; 2, at setup the tag receives only what it needs to derive rotating public keys, never the private key; 3, the private keys stay on the owner’s trusted devices and, Apple says, sync between them through end-to-end encrypted iCloud Keychain; 4, both sides derive a new key pair about every 15 minutes. 5, recovery and revocation, and the second group: manufacturer and service keys (TLS certificates, device attestation, firmware signing) do different jobs and cannot open the reports.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1594"/>
  <text x="40" y="50" class="k">SCENE 43</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The journey of a secret:</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">from birth to revocation</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Two families of keys. Only one of them can read</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">where the tag has been.</text>
  <g transform="translate(0,262)">
    <text x="40" y="24" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:800;fill:#6b21a8">OWNER-HELD KEYS — they open location reports</text>
  </g>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="38" width="640" height="115" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="74" cy="70" r="20" fill="#7c3aed"/><text x="74" y="77" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">1</text>
    <text x="104" y="78" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Generate</text>
    <rect x="518.0" y="51" width="146" height="36" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="591.0" y="76" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#1e40af">DOCUMENTED</text>
    <text x="58" y="108" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="58" dy="0">on the owner’s device: a key pair (d, P) and</tspan><tspan x="58" dy="27">a secret seed SK₀</tspan></text>
    <path d="M360,147 L360,189" class="a-crypto" marker-end="url(#m-crypto)"/>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="40" y="179" width="640" height="115" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="74" cy="211" r="20" fill="#7c3aed"/><text x="74" y="218" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">2</text>
    <text x="104" y="219" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Provision</text>
    <rect x="518.0" y="192" width="146" height="36" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="591.0" y="217" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#1e40af">DOCUMENTED</text>
    <text x="58" y="249" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="58" dy="0">at setup the tag gets P and SK₀ — enough to</tspan><tspan x="58" dy="27">derive public keys only</tspan></text>
    <path d="M360,288 L360,330" class="a-crypto" marker-end="url(#m-crypto)"/>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="40" y="320" width="640" height="115" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="74" cy="352" r="20" fill="#7c3aed"/><text x="74" y="359" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">3</text>
    <text x="104" y="360" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Store and sync</text>
    <rect x="566.8" y="333" width="97" height="36" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="615.4" y="358" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#9a3412">VERIFY</text>
    <text x="58" y="390" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="58" dy="0">d stays on trusted devices; synced via</tspan><tspan x="58" dy="27">E2E iCloud Keychain</tspan></text>
    <path d="M360,429 L360,471" class="a-crypto" marker-end="url(#m-crypto)"/>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="461" width="640" height="88" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="74" cy="493" r="20" fill="#7c3aed"/><text x="74" y="500" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">4</text>
    <text x="104" y="501" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Derive and rotate</text>
    <rect x="518.0" y="474" width="146" height="36" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="591.0" y="499" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#1e40af">DOCUMENTED</text>
    <text x="58" y="531" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">new Pᵢ (tag) and dᵢ (owner) about every 15 minutes</text>
    <path d="M360,543 L360,585" class="a-crypto" marker-end="url(#m-crypto)"/>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="575" width="640" height="88" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="74" cy="607" r="20" fill="#334155"/><text x="74" y="614" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">5</text>
    <text x="104" y="615" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Recover or revoke</text>
    <rect x="420.4" y="588" width="244" height="36" rx="18" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="542.1999999999999" y="613" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#374151">PARTLY UNDISCLOSED</text>
    <text x="58" y="645" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">account recovery; Remove Item stops future use</text>
    <text x="40" y="693" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:800;fill:#334155">MANUFACTURER AND SERVICE KEYS — a different job</text>
    <rect x="40" y="709" width="310" height="128" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="58" y="743" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">TLS certificates</text>
    <text x="58" y="773" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569"><tspan x="58" dy="0">protect phone ↔ server</tspan><tspan x="58" dy="27">connections in transit</tspan></text>
    <rect x="370" y="709" width="310" height="128" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="388" y="743" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Device attestation</text>
    <text x="388" y="773" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569"><tspan x="388" dy="0">lets a service check a</tspan><tspan x="388" dy="27">genuine device (detail</tspan><tspan x="388" dy="27">not public)</tspan></text>
    <rect x="40" y="847" width="310" height="128" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="58" y="881" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Firmware signing</text>
    <text x="58" y="911" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569"><tspan x="58" dy="0">proves an update came</tspan><tspan x="58" dy="27">from the maker</tspan></text>
    <rect x="370" y="847" width="310" height="128" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="388" y="881" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d"><tspan x="388" dy="0">Account</tspan><tspan x="388" dy="29">authentication</tspan></text>
    <text x="388" y="939" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569"><tspan x="388" dy="0">passwords, 2FA, passkeys:</tspan><tspan x="388" dy="27">decide who may ask</tspan></text>
    <rect x="40" y="983" width="640" height="84" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/><text x="56" y="1019" text-anchor="start" style="font-size:26px;font-weight:800;fill:#dc2626">None of these</text><text x="56" y="1055" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">can open a sealed location report.</text>
    <rect x="40" y="1075" width="640" height="140" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><text x="64" y="1119" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Why the split matters</text>
    <text x="64" y="1153" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="64" dy="0">A service can run, check devices and route reports</tspan><tspan x="64" dy="27">without ever holding the keys that read them. That is</tspan><tspan x="64" dy="27">what “end-to-end” means here.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1493" x2="680" y2="1493" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1523" class="note">Apple Platform Security guide (Find My). Schematic.</text>
    <path d="M40,1559 L74,1559" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="86" y="1564" class="s">Encrypted / cryptographic</text>
  </g>
</svg>
