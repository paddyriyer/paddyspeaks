<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1568" width="720" height="1568" font-family="Inter, Arial, sans-serif">
  <title>Scene 36: The sighting is sealed before it leaves the finder’s phone</title>
  <desc>Five frames. The tag advertises its current rotating public key; the finder phone encrypts its own location and the time to that public key, producing a report it cannot itself read back; the report travels over the internet to Apple’s Find My relay; the relay stores it under a lookup value, a SHA-256 hash of the public key; and a panel of what remains visible: Apple says it cannot read the location and does not know the finder, but the lookup hash, the encrypted report, the upload time and network connection data still exist.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1568"/>
  <text x="40" y="50" class="k">SCENE 36</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The sighting is sealed</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">before it leaves the</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">finder’s phone</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">Encrypted to the tag’s public key, filed under a</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">hash. Content hidden — not every trace.</text>
  <g data-f="1" transform="translate(0,314)">
    <circle cx="79" cy="155" r="38" fill="#0f172a" opacity="0.13"/><circle cx="76" cy="150" r="38" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="76" cy="150" r="24" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="76" y="220" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">item tracker</text>
    <path d="M118,150 L254,150" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="83" y="78" width="171" height="32" rx="6" class="lab"/>
    <text x="168" y="100" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#1d4ed8"><tspan x="168" dy="0">public key Pᵢ</tspan></text>
    <rect x="267" y="7" width="160" height="300" rx="27" fill="#0f172a" opacity="0.14"/><rect x="262" y="0" width="160" height="300" rx="27" fill="#111827"/><rect x="272" y="10" width="141" height="281" rx="21" fill="#f8fafc"/><rect x="320" y="16" width="45" height="11" rx="6" fill="#111827"/>
    <rect x="40" y="556" width="314" height="202" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="586" r="18" fill="#2563eb"/><text x="66" y="592" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="94" y="592" text-anchor="start" style="font-size:24px;font-weight:800;fill:#2563eb">Current public key</text><text x="56" y="626" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">The tag advertises Pᵢ,</tspan><tspan x="56" dy="27">which changes over time</tspan><tspan x="56" dy="27">(Scene 28).</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,314)">
    <rect x="274" y="70" width="136" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="342" y="102" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#166534">place+time</text>
    <path d="M342,120 L342,160" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="297" y="166" width="90" height="59" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><path d="M297,172 L342,199 L387,172" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <path d="M354,202 L354,197 a6,6 0 0 1 13,0 L367,202" fill="none" stroke="#7c3aed" stroke-width="2.2"/><rect x="350" y="201" width="22" height="17" rx="3" fill="#7c3aed"/><circle cx="361" cy="208" r="2" fill="#ffffff"/><rect x="360" y="209" width="2" height="4" fill="#ffffff"/>
    <rect x="366" y="556" width="314" height="202" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="392" cy="586" r="18" fill="#7c3aed"/><text x="392" y="592" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="420" y="592" text-anchor="start" style="font-size:24px;font-weight:800;fill:#7c3aed">Encrypt to Pᵢ</text><text x="382" y="626" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="382" dy="0">The finder seals its own</tspan><tspan x="382" dy="27">location and the time with</tspan><tspan x="382" dy="27">the tag’s public key. Only</tspan><tspan x="382" dy="27">the matching private key</tspan><tspan x="382" dy="27">opens it.</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <path d="M524,170 a40,40 0 0 1 4,-68 a52,52 0 0 1 100,-13 a36,36 0 0 1 8,81 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
    <text x="580" y="152" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#14213d">internet</text>
    <path d="M426,140 L482,140" class="a-crypto" marker-end="url(#m-crypto)"/>
    <path d="M572,186 L572,316" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="469" y="240" width="206" height="32" rx="6" class="lab"/>
    <text x="572" y="262" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#7e22ce"><tspan x="572" dy="0">encrypted report</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,314)">
    <rect x="40" y="320" width="640" height="222" rx="18" class="bound"/>
    <text x="62" y="358" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Find My relay (Apple)</text>
    <rect x="60" y="384" width="84" height="29" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="73" cy="399" r="4" fill="#22c55e"/><rect x="88" y="395" width="45" height="7" rx="3" fill="#94a3b8"/><rect x="60" y="419" width="84" height="29" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="73" cy="434" r="4" fill="#22c55e"/><rect x="88" y="430" width="45" height="7" rx="3" fill="#94a3b8"/><rect x="60" y="454" width="84" height="29" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="73" cy="469" r="4" fill="#22c55e"/><rect x="88" y="465" width="45" height="7" rx="3" fill="#94a3b8"/>
    <rect x="164" y="374" width="500" height="152" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="180" y="404" text-anchor="start" style="font-size:20px;font-weight:800;fill:#334155">lookup value</text><text x="418" y="404" text-anchor="start" style="font-size:20px;font-weight:800;fill:#334155">stored report</text>
    <text x="180" y="440" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:400;fill:#334155">SHA-256(P₁₇)</text>
    <rect x="418" y="419" width="230" height="28" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="533" y="440" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#6d28d9">▒▒ ciphertext</text>
    <text x="180" y="474" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:400;fill:#334155">SHA-256(P₁₈)</text>
    <rect x="418" y="453" width="230" height="28" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="533" y="474" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#6d28d9">▒▒ ciphertext</text>
    <text x="180" y="508" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:400;fill:#334155">SHA-256(P₂₁)</text>
    <rect x="418" y="487" width="230" height="28" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="533" y="508" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#6d28d9">▒▒ ciphertext</text>
    <rect x="40" y="770" width="640" height="90" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="66" cy="800" r="18" fill="#7c3aed"/><text x="66" y="806" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="94" y="806" text-anchor="start" style="font-size:26px;font-weight:800;fill:#7c3aed">Filed under a hash</text><text x="56" y="842" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Stored by SHA-256 of the public key.</text>
  </g>
  <g data-f="5" transform="translate(0,314)">
    <rect x="40" y="872" width="640" height="196" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="82" cy="916" r="26" fill="#334155"/><text x="82" y="925" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text><text x="122" y="926" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Hidden content is not zero metadata</text>
    <text x="64" y="966" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="64" dy="0">Apple says it cannot read the location and does not</tspan><tspan x="64" dy="27">know the finder. Still present: the lookup hash, the</tspan><tspan x="64" dy="27">encrypted report, the upload time and ordinary</tspan><tspan x="64" dy="27">network connection data.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1400" x2="680" y2="1400" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M40,1431 L74,1431" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="86" y="1436" class="s">Radio signal or wave</text>
    <path d="M40,1465 L74,1465" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="86" y="1470" class="s">Plaintext / local information</text>
    <path d="M40,1499 L74,1499" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="86" y="1504" class="s">Encrypted / cryptographic</text>
    <rect x="40" y="1524" width="34" height="18" rx="3" class="bound" style="stroke-width:4"/>
    <text x="86" y="1538" class="s">Trust or hardware boundary</text>
  </g>
</svg>
