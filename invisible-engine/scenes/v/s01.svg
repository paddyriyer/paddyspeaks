<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1243" width="720" height="1243" font-family="Inter, Arial, sans-serif">
  <title>Scene 01: From a switch to a transistor</title>
  <desc>Four frames. A flashlight circuit with the switch open: no current, the bulb is dark, we call it 0. The switch closed: current carries energy, the bulb lights, we call it 1. A transistor cutaway with the gate below its threshold voltage: no channel, off. The gate above threshold: a conducting channel forms between source and drain, on. The 0 and 1 are agreed readings of voltage ranges.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1243"/>
  <text x="40" y="50" class="k">SCENE 01</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">From a switch to a</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">transistor</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">A 0 or a 1 is an agreed reading of a physical</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">voltage.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="0" width="312" height="262" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="82" cy="44" r="26" fill="#334155"/><text x="82" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="122" y="54" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Switch open</text>
    <g transform="translate(44,70) scale(0.5)">
    <rect x="62" y="88" width="25" height="14" rx="3" fill="#475569"/><rect x="40" y="100" width="70" height="130" rx="12" fill="#ffffff" stroke="#334155" stroke-width="4"/><rect x="48" y="131" width="54" height="91" rx="6" fill="#4ade80"/>
    <path d="M75,88 L75,60 L230,60" class="wire"/><path d="M310,60 L520,60 L520,110" class="wire"/><path d="M520,240 L520,280 L75,280 L75,230" class="wire"/><circle cx="230" cy="60" r="8" fill="#334155"/><circle cx="310" cy="60" r="8" fill="#334155"/>
    <path d="M230,60 L300,15" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <circle cx="520" cy="170" r="46" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><path d="M506,176 q7,-18 14,0 q7,18 14,0" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="500" y="212" width="40" height="26" rx="4" fill="#9ca3af" stroke="#334155" stroke-width="2"/>
    </g>
    <text x="64" y="246" text-anchor="start" style="font-size:21px;font-weight:800;fill:#334155">No current → dark → 0</text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="368" y="0" width="312" height="262" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="410" cy="44" r="26" fill="#b45309"/><text x="410" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="450" y="54" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Switch closed</text>
    <g transform="translate(372,70) scale(0.5)">
    <rect x="62" y="88" width="25" height="14" rx="3" fill="#475569"/><rect x="40" y="100" width="70" height="130" rx="12" fill="#ffffff" stroke="#334155" stroke-width="4"/><rect x="48" y="131" width="54" height="91" rx="6" fill="#4ade80"/>
    <path d="M75,88 L75,60 L230,60" class="wire"/><path d="M310,60 L520,60 L520,110" class="wire"/><path d="M520,240 L520,280 L75,280 L75,230" class="wire"/><circle cx="230" cy="60" r="8" fill="#334155"/><circle cx="310" cy="60" r="8" fill="#334155"/>
    <path d="M230,60 L310,60" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <path d="M582,170 L602,170" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M564,214 L578,228" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M520,232 L520,252" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M476,214 L462,228" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M458,170 L438,170" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M476,126 L462,112" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M520,108 L520,88" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M564,126 L578,112" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><circle cx="520" cy="170" r="46" fill="#fde047" stroke="#334155" stroke-width="3"/><path d="M506,176 q7,-18 14,0 q7,18 14,0" fill="none" stroke="#b45309" stroke-width="3"/><rect x="500" y="212" width="40" height="26" rx="4" fill="#9ca3af" stroke="#334155" stroke-width="2"/>
    </g>
    <path d="M413,93 L473,93" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="392" y="246" text-anchor="start" style="font-size:21px;font-weight:800;fill:#92400e">Current → light → 1</text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="40" y="278" width="640" height="284" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="82" cy="322" r="26" fill="#334155"/><text x="82" y="331" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="122" y="332" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">Transistor: gate below threshold</text>
    <rect x="70" y="408" width="580" height="110" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="90" y="408" width="140" height="56" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><rect x="490" y="408" width="140" height="56" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><rect x="250" y="392" width="220" height="14" fill="#fef9c3" stroke="#a16207" stroke-width="2"/><rect x="250" y="356" width="220" height="36" rx="4" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
    <text x="360" y="382" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#14213d">gate</text>
    <text x="160" y="500" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#1e3a8a">source</text>
    <text x="560" y="500" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#1e3a8a">drain</text>
    <text x="360" y="548" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#334155">no conducting channel → 0</text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="578" width="640" height="284" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="82" cy="622" r="26" fill="#7c3aed"/><text x="82" y="631" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text><text x="122" y="632" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">Transistor: gate above threshold</text>
    <rect x="70" y="708" width="580" height="110" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="90" y="708" width="140" height="56" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><rect x="490" y="708" width="140" height="56" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><rect x="250" y="692" width="220" height="14" fill="#fef9c3" stroke="#a16207" stroke-width="2"/><rect x="250" y="656" width="220" height="36" rx="4" fill="#fcd34d" stroke="#334155" stroke-width="2"/>
    <text x="360" y="682" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#14213d">gate (+V)</text>
    <text x="160" y="800" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#1e3a8a">source</text>
    <text x="560" y="800" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#1e3a8a">drain</text>
    <rect x="230" y="710" width="260" height="16" fill="#60a5fa"/>
    <circle cx="245" cy="718" r="4" fill="#1e3a8a"/>
    <circle cx="275" cy="718" r="4" fill="#1e3a8a"/>
    <circle cx="305" cy="718" r="4" fill="#1e3a8a"/>
    <circle cx="335" cy="718" r="4" fill="#1e3a8a"/>
    <circle cx="365" cy="718" r="4" fill="#1e3a8a"/>
    <circle cx="395" cy="718" r="4" fill="#1e3a8a"/>
    <circle cx="425" cy="718" r="4" fill="#1e3a8a"/>
    <circle cx="455" cy="718" r="4" fill="#1e3a8a"/>
    <circle cx="485" cy="718" r="4" fill="#1e3a8a"/>
    <path d="M240,760 L480,760" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="360" y="848" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#5b21b6">a channel forms: current flows → 1</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1142" x2="680" y2="1142" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1172" class="note">Schematic, not to scale.</text>
    <path d="M40,1208 L74,1208" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="86" y="1213" class="s">Energy / power</text>
  </g>
</svg>
