<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1464" width="720" height="1464" font-family="Inter, Arial, sans-serif">
  <title>Scene 59: Complex amplitudes: arrows with a length and an angle</title>
  <desc>Four frames, labelled quantum amplitude mathematics. 1, the complex plane with real and imaginary axes and a unit circle; an arrow at angle phi is e to the i phi, equal to cos phi plus i sin phi. 2, the arrow at 0, 90, 180 and 270 degrees is 1, i, minus 1 and minus i. 3, measuring in the 0 or 1 basis gives probabilities equal to the squared length of each amplitude, so the angle alone is not something you read. 4, global phase: turning both parts of a state by the same angle changes nothing any experiment can detect; relative phase: turning one part against the other changes what interference does next (Scene 63).</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1464"/>
  <text x="40" y="50" class="k">SCENE 59</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Complex amplitudes:</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">arrows with a length and</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">an angle</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">Amplitudes behave like arrows: they can point any</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">way, and they add like arrows.</text>
  <g data-f="1" transform="translate(0,314)">
    <rect x="40" y="0" width="407" height="34" rx="17" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="243.5" y="24" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#7c3aed">QUANTUM AMPLITUDE MATHEMATICS</text>
    <rect x="40" y="44" width="640" height="440" rx="18" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
    <circle cx="340" cy="262" r="125" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/><path d="M185,262 L495,262 M340,413 L340,111" stroke="#94a3b8" stroke-width="1.5"/><text x="495" y="290" text-anchor="end" style="font-size:20px;font-weight:700;fill:#475569">Re</text><text x="354" y="129" text-anchor="start" style="font-size:20px;font-weight:700;fill:#475569">Im</text>
    <path d="M390,262 A50,50 0 0 0 372.1,223.7" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <text x="400" y="246" text-anchor="start" style="font-size:22px;font-weight:800;fill:#b45309">φ</text>
    <path d="M340,262 L420.3,166.2" stroke="#7c3aed" stroke-width="4"/><path d="M420.3,166.2 L416.7,181.5 L406.0,172.5 Z" fill="#7c3aed"/>
    <text x="64" y="86" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:24px;font-weight:800;fill:#7c3aed">e^(iφ) = cos φ + i·sin φ</text>
    <text x="64" y="116" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">length 1, angle φ</text>
  </g>
  <g data-f="2" transform="translate(0,314)">
    <path d="M340,262 L465.0,262.0" stroke="#64748b" stroke-width="4" opacity="0.35"/><path d="M465.0,262.0 L451.0,269.0 L451.0,255.0 Z" fill="#64748b" opacity="0.35"/><text x="479" y="250" text-anchor="start" style="font-size:22px;font-weight:700;fill:#64748b">1</text>
    <path d="M340,262 L340.0,137.0" stroke="#64748b" stroke-width="4" opacity="0.35"/><path d="M340.0,137.0 L347.0,151.0 L333.0,151.0 Z" fill="#64748b" opacity="0.35"/><text x="324" y="129" text-anchor="end" style="font-size:22px;font-weight:700;fill:#64748b">i</text>
    <path d="M340,262 L215.0,262.0" stroke="#64748b" stroke-width="4" opacity="0.35"/><path d="M215.0,262.0 L229.0,255.0 L229.0,269.0 Z" fill="#64748b" opacity="0.35"/><text x="201" y="250" text-anchor="end" style="font-size:22px;font-weight:700;fill:#64748b">−1</text>
    <path d="M340,262 L340.0,387.0" stroke="#64748b" stroke-width="4" opacity="0.35"/><path d="M340.0,387.0 L333.0,373.0 L347.0,373.0 Z" fill="#64748b" opacity="0.35"/><text x="324" y="409" text-anchor="end" style="font-size:22px;font-weight:700;fill:#64748b">−i</text>
    <text x="64" y="440" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">Turning the arrow by 180° gives −1: same length,</text><text x="64" y="467" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">opposite direction.</text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <rect x="40" y="498" width="640" height="178" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="66" cy="528" r="18" fill="#7c3aed"/><text x="66" y="534" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="94" y="534" text-anchor="start" style="font-size:26px;font-weight:800;fill:#7c3aed">Phase is not something you read off</text><text x="56" y="570" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Measuring a qubit as 0 or 1 gives probabilities</tspan><tspan x="56" dy="27">equal to the squared length of each amplitude:</tspan><tspan x="56" dy="27">|amplitude|². The length sets them; the angle</tspan><tspan x="56" dy="27">alone does not show up in that measurement.</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,314)">
    <rect x="40" y="690" width="640" height="352" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="82" cy="734" r="26" fill="#334155"/><text x="82" y="743" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text><text x="122" y="744" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">Global phase and relative phase</text>
    <text x="64" y="782" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">Global: both parts</text><text x="64" y="807" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">turn together</text>
    <text x="64" y="883" text-anchor="start" style="font-size:20px;font-weight:600;fill:#475569">before</text>
    <circle cx="190" cy="876" r="30" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M190,876 L212.5,876.0" stroke="#7c3aed" stroke-width="4"/><path d="M212.5,876.0 L198.5,883.0 L198.5,869.0 Z" fill="#7c3aed"/>
    <text x="190" y="836" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">|0⟩ part</text>
    <circle cx="290" cy="876" r="30" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M290,876 L312.5,876.0" stroke="#7c3aed" stroke-width="4"/><path d="M312.5,876.0 L298.5,883.0 L298.5,869.0 Z" fill="#7c3aed"/>
    <text x="290" y="836" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">|1⟩ part</text>
    <text x="64" y="949" text-anchor="start" style="font-size:20px;font-weight:600;fill:#475569">after</text>
    <circle cx="190" cy="942" r="30" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M190,942 L201.2,922.5" stroke="#7c3aed" stroke-width="4"/><path d="M201.2,922.5 L200.3,938.1 L188.2,931.1 Z" fill="#7c3aed"/>
    <circle cx="290" cy="942" r="30" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M290,942 L301.2,922.5" stroke="#7c3aed" stroke-width="4"/><path d="M301.2,922.5 L300.3,938.1 L288.2,931.1 Z" fill="#7c3aed"/>
    <text x="64" y="992" text-anchor="start" style="font-size:20px;font-weight:700;fill:#334155">No experiment can tell</text><text x="64" y="1017" text-anchor="start" style="font-size:20px;font-weight:700;fill:#334155">these apart.</text>
    <text x="380" y="782" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">Relative: one part turns</text><text x="380" y="807" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">against the other</text>
    <text x="380" y="883" text-anchor="start" style="font-size:20px;font-weight:600;fill:#475569">before</text>
    <circle cx="506" cy="876" r="30" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M506,876 L528.5,876.0" stroke="#7c3aed" stroke-width="4"/><path d="M528.5,876.0 L514.5,883.0 L514.5,869.0 Z" fill="#7c3aed"/>
    <text x="506" y="836" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">|0⟩ part</text>
    <circle cx="606" cy="876" r="30" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M606,876 L628.5,876.0" stroke="#7c3aed" stroke-width="4"/><path d="M628.5,876.0 L614.5,883.0 L614.5,869.0 Z" fill="#7c3aed"/>
    <text x="606" y="836" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">|1⟩ part</text>
    <text x="380" y="949" text-anchor="start" style="font-size:20px;font-weight:600;fill:#475569">after</text>
    <circle cx="506" cy="942" r="30" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M506,942 L528.5,942.0" stroke="#7c3aed" stroke-width="4"/><path d="M528.5,942.0 L514.5,949.0 L514.5,935.0 Z" fill="#7c3aed"/>
    <circle cx="606" cy="942" r="30" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M606,942 L583.5,942.0" stroke="#7c3aed" stroke-width="4"/><path d="M583.5,942.0 L597.5,935.0 L597.5,949.0 Z" fill="#7c3aed"/>
    <text x="380" y="992" text-anchor="start" style="font-size:20px;font-weight:700;fill:#7c3aed">This changes what</text><text x="380" y="1017" text-anchor="start" style="font-size:20px;font-weight:700;fill:#7c3aed">interference does next.</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1370" x2="680" y2="1370" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1400" class="note">Purple: quantum amplitudes (mathematics, not something</text>
    <text x="40" y="1427" class="note">you can see).</text>
  </g>
</svg>
