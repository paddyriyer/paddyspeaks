<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1600" width="720" height="1600" font-family="Inter, Arial, sans-serif">
  <title>Scene 70: Noise: why qubits forget, and what error correction costs</title>
  <desc>Five frames. 1, relaxation: a qubit prepared in 1 decays towards 0; with an illustrative T1 of 100 microseconds the chance it is still 1 falls to 0.368 after one T1. 2, dephasing: the relative phase that interference needs blurs out on a timescale T2 (illustrative 70 microseconds). 3, errors add up: with an error of 1 in 100 per gate, a 100-gate circuit succeeds about 37 percent of the time; with 1 in 1,000, about 90 percent; readout can also be wrong. 4, error correction combines many physical qubits into one logical qubit; a distance-7 surface code uses about 97 physical qubits per logical qubit in a common layout. 5, the goal is fault tolerance: logical errors that fall as the code grows; Google reported this “below threshold” behaviour in 2024, a research result still far from the scale cryptography would need.</desc>
