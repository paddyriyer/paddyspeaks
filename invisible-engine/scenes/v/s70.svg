  <g data-f="5" transform="translate(0,314)">
    <rect x="40" y="981" width="640" height="181" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="68" cy="1011" r="18" fill="#16a34a"/><text x="68" y="1017" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="96" y="1019" text-anchor="start" style="font-size:26px;font-weight:800;fill:#16a34a">Fault tolerance</text><text x="56" y="1053" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">The goal: logical errors that fall as the code grows.</tspan><tspan x="56" dy="27">Google reported “below threshold” behaviour in 2024</tspan><tspan x="56" dy="27">(research result). Scale for cryptography is still far</tspan><tspan x="56" dy="27">beyond it.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1506" x2="680" y2="1506" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1536" class="note">T1, T2 and error rates illustrative; the curves and</text>
    <text x="40" y="1563" class="note">percentages computed from them.</text>
  </g>
</svg>
