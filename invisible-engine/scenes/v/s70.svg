  <rect class="bg" width="720" height="1600"/>
  <text x="40" y="50" class="k">SCENE 70</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Noise: why qubits forget,</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">and what error correction</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">costs</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">Every qubit leaks. Error correction trades many</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">noisy qubits for one reliable one.</text>
