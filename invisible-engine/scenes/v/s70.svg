    <rect x="40" y="419" width="640" height="38" fill="#eef2ff" stroke="#e2e8f0" stroke-width="1"/><text x="135.0" y="445" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">error per gate</text><text x="300.0" y="445" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">10 gates</text><text x="445.0" y="445" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">100 gates</text><text x="600.0" y="445" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">1,000 gates</text><rect x="40" y="457" width="640" height="38" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="135.0" y="483" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">0.01</text><text x="300.0" y="483" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">90 %</text><text x="445.0" y="483" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">37 %</text><text x="600.0" y="483" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">&lt;1 %</text><rect x="40" y="495" width="640" height="38" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="135.0" y="521" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">0.001</text><text x="300.0" y="521" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">99 %</text><text x="445.0" y="521" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">90 %</text><text x="600.0" y="521" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">37 %</text>
    <text x="40" y="565" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="40" dy="0">Chance a circuit runs with no error,</tspan><tspan x="40" dy="27">if errors are independent (computed).</tspan><tspan x="40" dy="27">Readout adds its own errors.</tspan></text>
    <rect x="40" y="637" width="640" height="100" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/><circle cx="68" cy="667" r="18" fill="#dc2626"/><text x="68" y="673" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="96" y="675" text-anchor="start" style="font-size:26px;font-weight:800;fill:#dc2626">Errors add up</text><text x="56" y="709" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Deeper circuits fail more often, even with good gates.</text>
  </g>
