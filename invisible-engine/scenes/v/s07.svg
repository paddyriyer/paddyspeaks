<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1488" width="720" height="1488" font-family="Inter, Arial, sans-serif">
  <title>Scene 07: Four different questions: who, near, where, which way</title>
  <desc>Four frames. Identity: a tag sends an identifier a phone can hear. Proximity: received signal strength jumps about, a noisy clue. Location: a phone computes its own coordinates from satellite signals; a tag without a receiver cannot. Distance and direction: two compatible devices exchange timed Ultra Wideband messages.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1488"/>
  <text x="40" y="50" class="k">SCENE 07</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Four different questions:</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">who, near, where, which</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">way</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">A broadcasting tag is not a satellite navigation</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">receiver.</text>
  <g data-f="1" transform="translate(0,314)">
    <rect x="40" y="0" width="640" height="248" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="82" cy="44" r="26" fill="#2563eb"/><text x="82" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="122" y="54" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">Identity: “what is this?”</text>
    <circle cx="115" cy="151" r="40" fill="#0f172a" opacity="0.13"/><circle cx="112" cy="146" r="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="112" cy="146" r="25" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M142,134 q8,12 0,24" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" opacity="1.00"/><path d="M154,124 q14,22 0,44" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" opacity="0.80"/><path d="M166,114 q19,32 0,65" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" opacity="0.60"/>
    <path d="M206,146 L500,146" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="268" y="102" width="171" height="32" rx="6" class="lab"/>
    <text x="353" y="124" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#1d4ed8"><tspan x="353" dy="0">an identifier</tspan></text>
    <rect x="545" y="89" width="64" height="128" rx="11" fill="#0f172a" opacity="0.14"/><rect x="540" y="82" width="64" height="128" rx="11" fill="#111827"/><rect x="544" y="86" width="56" height="120" rx="8" fill="#eff6ff"/><rect x="563" y="88" width="18" height="4" rx="2" fill="#111827"/>
    <text x="64" y="234" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Which object, or which rotating code — not where.</text>
  </g>
  <g data-f="2" transform="translate(0,314)">
    <rect x="40" y="262" width="640" height="248" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="82" cy="306" r="26" fill="#0d9488"/><text x="82" y="315" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="122" y="316" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">Proximity: “is it near?”</text>
    <rect x="80" y="430" width="30" height="38" rx="4" fill="#5eead4"/>
    <rect x="122" y="382" width="30" height="86" rx="4" fill="#5eead4"/>
    <rect x="164" y="411" width="30" height="57" rx="4" fill="#5eead4"/>
    <rect x="206" y="354" width="30" height="114" rx="4" fill="#5eead4"/>
    <rect x="248" y="402" width="30" height="66" rx="4" fill="#5eead4"/>
    <rect x="290" y="364" width="30" height="104" rx="4" fill="#5eead4"/>
    <rect x="332" y="420" width="30" height="48" rx="4" fill="#5eead4"/>
    <rect x="374" y="378" width="30" height="90" rx="4" fill="#5eead4"/>
    <rect x="416" y="392" width="30" height="76" rx="4" fill="#5eead4"/>
    <rect x="458" y="344" width="30" height="124" rx="4" fill="#5eead4"/>
    <rect x="565" y="347" width="64" height="128" rx="11" fill="#0f172a" opacity="0.14"/><rect x="560" y="340" width="64" height="128" rx="11" fill="#111827"/><rect x="564" y="344" width="56" height="120" rx="8" fill="#f0fdfa"/><rect x="583" y="346" width="18" height="4" rx="2" fill="#111827"/>
    <text x="64" y="496" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Signal strength (RSSI) jumps with bodies and walls.</text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <rect x="40" y="524" width="640" height="300" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="82" cy="568" r="26" fill="#16a34a"/><text x="82" y="577" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="122" y="578" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">Location: “where on Earth?”</text>
    <rect x="107" y="623" width="25" height="18" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="68" y="625" width="36" height="14" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><rect x="136" y="625" width="36" height="14" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
    <rect x="287" y="607" width="25" height="18" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="248" y="609" width="36" height="14" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><rect x="316" y="609" width="36" height="14" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
    <rect x="457" y="623" width="25" height="18" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="418" y="625" width="36" height="14" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><rect x="486" y="625" width="36" height="14" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
    <path d="M130,652 L564,740" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M300,636 L564,724" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M470,652 L564,708" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="585" y="681" width="64" height="128" rx="11" fill="#0f172a" opacity="0.14"/><rect x="580" y="674" width="64" height="128" rx="11" fill="#111827"/><rect x="584" y="678" width="56" height="120" rx="8" fill="#f0fdf4"/><rect x="603" y="680" width="18" height="4" rx="2" fill="#111827"/>
    <text x="64" y="774" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="64" dy="0">The phone computes its own coordinates.</tspan><tspan x="64" dy="27">A tag without a receiver cannot.</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,314)">
    <rect x="40" y="838" width="640" height="256" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="82" cy="882" r="26" fill="#7c3aed"/><text x="82" y="891" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text><text x="122" y="892" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d"><tspan x="122" dy="0">Distance &amp; direction:</tspan><tspan x="122" dy="34">“how far, which way?”</tspan></text>
    <rect x="75" y="957" width="64" height="128" rx="11" fill="#0f172a" opacity="0.14"/><rect x="70" y="950" width="64" height="128" rx="11" fill="#111827"/><rect x="74" y="954" width="56" height="120" rx="8" fill="#f5f3ff"/><rect x="93" y="956" width="18" height="4" rx="2" fill="#111827"/>
    <circle cx="639" cy="1019" r="34" fill="#0f172a" opacity="0.13"/><circle cx="636" cy="1014" r="34" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="636" cy="1014" r="21" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M150,1014 L596,1014" class="a-signal" marker-end="url(#m-signal)" marker-start="url(#ms-signal)"/>
    <rect x="195" y="970" width="356" height="32" rx="6" class="lab"/>
    <text x="373" y="992" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#1d4ed8"><tspan x="373" dy="0">timed UWB exchange: d = c · t</tspan></text>
    <text x="156" y="1052" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="156" dy="0">Two compatible devices, short range —</tspan><tspan x="156" dy="27">not a map position.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1422" x2="680" y2="1422" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M40,1453 L74,1453" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="86" y="1458" class="s">Radio signal or wave</text>
  </g>
</svg>
