<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1586" width="720" height="1586" font-family="Inter, Arial, sans-serif">
  <title>Scene 16: A plastic card and a phone wallet are different credentials</title>
  <desc>Four frames in two columns. A plastic contactless card holds the card number and card keys and gives the terminal the card number with a cryptogram; a phone wallet keeps a device-specific token and keys in a secure element and releases a per-transaction cryptogram only after the user authenticates; the payment network’s token service maps the token to the card for the issuer; and what each party still sees.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1586"/>
  <text x="40" y="50" class="k">SCENE 16</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">A plastic card and a</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">phone wallet are</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">different credentials</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">Both use fresh cryptograms. Only the wallet hides</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">the card number from the merchant.</text>
  <g data-f="1" transform="translate(0,314)">
    <rect x="40" y="0" width="640" height="356" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="82" cy="44" r="26" fill="#2563eb"/><text x="82" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="122" y="54" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Plastic contactless card</text>
    <rect x="68" y="82" width="220" height="139" rx="11" fill="#0f172a" opacity="0.12"/><rect x="64" y="76" width="220" height="139" rx="11" fill="#1e3a8a"/><path d="M64,162 Q174,138 284,173 L284,204 Q284,215 273,215 L75,215 Q64,215 64,204 Z" fill="#1d4ed8" opacity="0.55"/><path d="M240.0,119.1 q5.9,6.8 0,13.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M247.6,113.2 q10.2,12.7 0,25.4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M255.2,107.3 q14.4,18.6 0,37.2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><rect x="86.0" y="121.738" width="33.0" height="33.263999999999996" rx="5" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M102.5,121.738 L102.5,155.002 M86.0,132.826 L98.54,132.826 M106.46000000000001,132.826 L119.0,132.826 M86.0,143.914 L98.54,143.914 M106.46000000000001,143.914 L119.0,143.914" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="98.54" y="129.05608" width="7.92" height="18.62784" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/><text x="204.8" y="109.264" text-anchor="end" style="font-size:20px;font-weight:800;fill:#e0e7ff">BANK</text><text x="81.6" y="195.196" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#ffffff">•••• 1234</text>
    <text x="310" y="104" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">The chip holds</text>
    <text x="310" y="136" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="310" dy="0">• the card number (PAN)</tspan><tspan x="310" dy="27">• the card’s secret keys</tspan></text>
    <path d="M150,222 L150,272" class="a-plain" marker-end="url(#m-plain)"/>
    <path d="M250,222 L250,272" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="132" y="256" text-anchor="end" style="font-size:20px;font-weight:600;fill:#166534">card no.</text>
    <text x="268" y="256" text-anchor="start" style="font-size:20px;font-weight:600;fill:#6b21a8">cryptogram</text>
    <text x="310" y="192" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="310" dy="0">Terminal receives the card</tspan><tspan x="310" dy="27">number and a fresh cryptogram.</tspan></text>
    <text x="64" y="308" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="64" dy="0">Small payments often need no PIN; the limit varies</tspan><tspan x="64" dy="27">by region.</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,314)">
    <rect x="40" y="370" width="640" height="452" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="82" cy="414" r="26" fill="#16a34a"/><text x="82" y="423" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="122" y="424" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Phone wallet (e.g. Apple Pay)</text>
    <rect x="69" y="447" width="156" height="260" rx="27" fill="#0f172a" opacity="0.14"/><rect x="64" y="440" width="156" height="260" rx="27" fill="#111827"/><rect x="73" y="449" width="137" height="241" rx="21" fill="#f8fafc"/><rect x="120" y="456" width="44" height="11" rx="5" fill="#111827"/>
    <rect x="82" y="488" width="124" height="78" rx="6" fill="#0f172a" opacity="0.12"/><rect x="78" y="482" width="124" height="78" rx="6" fill="#1e3a8a"/><path d="M78,530 Q140,517 202,537 L202,554 Q202,560 196,560 L84,560 Q78,560 78,554 Z" fill="#1d4ed8" opacity="0.55"/><path d="M177.2,506.3 q3.3,3.8 0,7.6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M181.5,503.0 q5.7,7.2 0,14.3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M185.8,499.6 q8.1,10.5 0,21.0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><rect x="90.4" y="507.7796" width="18.599999999999998" height="18.7488" rx="3" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M99.7,507.7796 L99.7,526.5284 M90.4,514.0292000000001 L97.468,514.0292000000001 M101.932,514.0292000000001 L109.0,514.0292000000001 M90.4,520.2788 L97.468,520.2788 M101.932,520.2788 L109.0,520.2788" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="97.468" y="511.904336" width="4.4639999999999995" height="10.499328" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/><text x="87.92" y="549.1831999999999" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#ffffff">•••• 4821</text>
    <rect x="92" y="590" width="100" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="142" y="626" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#6d28d9">SE</text>
    <text x="238" y="466" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">The secure element holds</text>
    <text x="238" y="498" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="238" dy="0">• a device token (Apple: “Device</tspan><tspan x="238" dy="27">  Account Number”), not the card</tspan><tspan x="238" dy="27">  number</tspan><tspan x="238" dy="27">• keys for per-transaction</tspan><tspan x="238" dy="27">  cryptograms</tspan></text>
    <text x="238" y="648" text-anchor="start" style="font-size:21px;font-weight:800;fill:#166534">Released only after you authenticate</text>
    <text x="238" y="676" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">face, finger or passcode</text>
    <path d="M142,708 L142,744" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="64" y="772" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="64" dy="0">Terminal receives the token and a per-transaction</tspan><tspan x="64" dy="27">cryptogram.</tspan></text>
    <text x="238" y="712" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#475569"><tspan x="238" dy="0">Apple Pay: Apple Platform Security.</tspan><tspan x="238" dy="26">Other wallets vary.</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <rect x="40" y="852" width="640" height="116" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="66" cy="882" r="18" fill="#b45309"/><text x="66" y="888" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="94" y="888" text-anchor="start" style="font-size:26px;font-weight:800;fill:#b45309">Token service (payment network)</text><text x="56" y="924" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Maps token → card account for the issuer; can suspend</tspan><tspan x="56" dy="27">one device’s token without replacing the card.</tspan></text>
    <path d="M600,824 L600,850" class="a-admin" marker-end="url(#m-admin)"/>
  </g>
  <g data-f="4" transform="translate(0,314)">
    <rect x="40" y="980" width="640" height="144" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="66" cy="1010" r="18" fill="#334155"/><text x="66" y="1016" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="94" y="1016" text-anchor="start" style="font-size:26px;font-weight:800;fill:#334155">Who still sees the payment (both)</text><text x="56" y="1052" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Merchant: amount, time, a card or token number ·</tspan><tspan x="56" dy="27">Network routes it · Issuer: the full transaction.</tspan><tspan x="56" dy="27">Contactless is not anonymous.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1452" x2="680" y2="1452" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M40,1483 L74,1483" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="86" y="1488" class="s">Plaintext / local information</text>
    <path d="M40,1517 L74,1517" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="86" y="1522" class="s">Encrypted / cryptographic</text>
    <path d="M40,1551 L74,1551" class="a-admin" marker-end="url(#m-admin)"/>
    <text x="86" y="1556" class="s">Registration / authorisation (not data)</text>
  </g>
</svg>
