<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1569" width="720" height="1569" font-family="Inter, Arial, sans-serif">
  <title>Scene 40: NFC Lost Mode: a tap that shows a note, not a location</title>
  <desc>Four frames. Someone finds a tag and holds an NFC-capable phone, iPhone or Android, a few centimetres from it; the phone opens a web page with the item’s serial number; if the owner turned on Lost Mode, the page also shows the owner’s message and the contact details the owner chose to share; and what NFC cannot do: no distant tracking, nothing about the finder sent to the owner by the tap itself, and only what the owner chose is shown.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1569"/>
  <text x="40" y="50" class="k">SCENE 40</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">NFC Lost Mode: a tap that</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">shows a note, not a</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">location</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">Centimetres, on purpose. The owner decides what a</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">finder may read.</text>
  <g data-f="1" transform="translate(0,314)">
    <circle cx="120" cy="65" r="25" fill="#64748b"/><path d="M84,187 L84,124 Q84,99 110,99 L130,99 Q156,99 156,124 L156,187 Z" fill="#64748b"/><rect x="93" y="179" width="21" height="92" rx="8" fill="#64748b"/><rect x="126" y="179" width="21" height="92" rx="8" fill="#64748b"/>
    <rect x="255" y="7" width="230" height="440" rx="39" fill="#0f172a" opacity="0.14"/><rect x="250" y="0" width="230" height="440" rx="39" fill="#111827"/><rect x="264" y="14" width="202" height="412" rx="30" fill="#f8fafc"/><rect x="333" y="23" width="64" height="16" rx="8" fill="#111827"/>
    <circle cx="587" cy="235" r="44" fill="#0f172a" opacity="0.13"/><circle cx="584" cy="230" r="44" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="584" cy="230" r="27" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="582" y="310" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">found item tracker</text>
    <path d="M486,230 L534,230" class="a-signal" marker-end="url(#m-signal)" marker-start="url(#ms-signal)"/>
    <text x="586" y="160" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#1d4ed8">NFC, a few cm</text>
    <rect x="40" y="470" width="640" height="116" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="500" r="18" fill="#2563eb"/><text x="66" y="506" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="94" y="506" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">Hold an NFC phone to the tag</text><text x="56" y="542" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">iPhone or an NFC-capable Android phone. No app and</tspan><tspan x="56" dy="27">no account are needed to read it.</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,314)">
    <rect x="266" y="44" width="198" height="382" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="365" y="80" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#1d4ed8">found.apple.com</text>
    <text x="365" y="122" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#14213d">Serial number</text><text x="365" y="150" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:400;fill:#475569">H2X••••••9K</text>
    <rect x="40" y="598" width="640" height="116" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="66" cy="628" r="18" fill="#16a34a"/><text x="66" y="634" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="94" y="634" text-anchor="start" style="font-size:26px;font-weight:800;fill:#16a34a">A web page about the item</text><text x="56" y="670" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">The tap opens a page with the item’s serial number.</tspan><tspan x="56" dy="27">The finder’s phone shows it; nothing is installed.</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <rect x="274" y="176" width="182" height="196" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="365" y="208" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#92400e">Lost Mode</text>
    <text x="365" y="242" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#334155">“Reward if</text><text x="365" y="268" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#334155">found. Call:”</text>
    <text x="365" y="302" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:400;fill:#334155">+44 •••• 0123</text>
    <text x="365" y="340" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#92400e">owner’s choice</text>
    <rect x="40" y="726" width="640" height="143" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="66" cy="756" r="18" fill="#b45309"/><text x="66" y="762" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="94" y="762" text-anchor="start" style="font-size:26px;font-weight:800;fill:#b45309">Only if the owner turned on Lost Mode</text><text x="56" y="798" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">The owner’s message and the phone number or email the</tspan><tspan x="56" dy="27">owner chose to share. Without Lost Mode, a finder sees</tspan><tspan x="56" dy="27">much less (details in level C below).</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,314)">
    <rect x="40" y="881" width="640" height="258" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="82" cy="925" r="26" fill="#334155"/><text x="82" y="934" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text><text x="122" y="935" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">What NFC does not do</text>
    <circle cx="76" cy="982" r="18" fill="#ffffff" stroke="#475569" stroke-width="4"/><path d="M68,974 L84,990 M84,974 L68,990" stroke="#475569" stroke-width="5" stroke-linecap="round"/><text x="108" y="989" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">No distant tracking: NFC works at centimetres.</text>
    <circle cx="76" cy="1036" r="18" fill="#ffffff" stroke="#475569" stroke-width="4"/><path d="M68,1028 L84,1044 M84,1028 L68,1044" stroke="#475569" stroke-width="5" stroke-linecap="round"/><text x="108" y="1043" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Not part of the crowd-sourced finding network</text><text x="108" y="1070" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">(that is Bluetooth sightings, Scenes 34–37).</text>
    <circle cx="76" cy="1112" r="18" fill="#ffffff" stroke="#475569" stroke-width="4"/><path d="M68,1104 L84,1120 M84,1104 L68,1120" stroke="#475569" stroke-width="5" stroke-linecap="round"/><text x="108" y="1119" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">No contact details unless the owner chose them.</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1468" x2="680" y2="1468" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1498" class="note">Fictional serial and number.</text>
    <path d="M40,1534 L74,1534" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="86" y="1539" class="s">Radio signal or wave</text>
  </g>
</svg>
