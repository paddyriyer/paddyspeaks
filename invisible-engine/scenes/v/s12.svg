<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1538" width="720" height="1538" font-family="Inter, Arial, sans-serif">
  <title>Scene 12: How the chip wakes up without a battery</title>
  <desc>Five frames along a power path: the reader’s changing field; the card coil, where an alternating voltage is induced; a rectifier that makes pulsing direct current; a capacitor and regulator that hold a steady supply; and the chip running. A final panel lists what changes how much power arrives.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1538"/>
  <text x="40" y="50" class="k">SCENE 12</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">How the chip wakes up</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">without a battery</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Changing field → induced AC → rectified →</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">regulated → the chip runs.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="0" width="640" height="120" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="82" cy="44" r="26" fill="#2563eb"/><text x="82" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text>
    <text x="122" y="54" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Changing field</text>
    <text x="122" y="92" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">from the reader</text>
    <ellipse cx="565" cy="46" rx="68" ry="40" class="field"/><ellipse cx="565" cy="46" rx="45" ry="27" class="field"/><ellipse cx="565" cy="46" rx="22" ry="13" class="field"/>
    <text x="664" y="110" text-anchor="end" style="font-style:italic;font-size:20px;font-weight:400;fill:#475569">illustrative field drawing</text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="40" y="160" width="640" height="120" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="82" cy="204" r="26" fill="#ea580c"/><text x="82" y="213" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text>
    <text x="122" y="214" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Card coil</text>
    <text x="122" y="252" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:21px;font-weight:600;fill:#334155">v = −N · dΦ/dt</text>
    <path d="M250,122 L250,156" class="a-energy" marker-end="url(#m-energy)"/>
    <rect x="490.0" y="173.0" width="150" height="70" rx="18" class="coil"/>
    <rect x="500.0" y="183.0" width="130" height="50" rx="15" class="coil"/>
    <rect x="510.0" y="193.0" width="110" height="30" rx="12" class="coil"/>
    <path d="M490,268 q15,-30 30,0 t30,0 t30,0 t30,0 t30,0" fill="none" stroke="#ea580c" stroke-width="3"/>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="40" y="320" width="640" height="120" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="82" cy="364" r="26" fill="#ea580c"/><text x="82" y="373" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text>
    <text x="122" y="374" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Rectifier</text>
    <text x="122" y="412" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">AC → pulsing DC</text>
    <path d="M250,282 L250,316" class="a-energy" marker-end="url(#m-energy)"/>
    <path d="M525,338 L575,368 L525,398 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="3"/><path d="M575,338 L575,398" stroke="#9a3412" stroke-width="4"/>
    <path d="M490,430 q15,-24 30,0 q15,-24 30,0 q15,-24 30,0 q15,-24 30,0 q15,-24 30,0" fill="none" stroke="#ea580c" stroke-width="3"/><line x1="490" y1="430" x2="640" y2="430" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="480" width="640" height="120" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="82" cy="524" r="26" fill="#ea580c"/><text x="82" y="533" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text>
    <text x="122" y="534" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Capacitor + regulator</text>
    <text x="122" y="572" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">steady supply rail</text>
    <path d="M250,442 L250,476" class="a-energy" marker-end="url(#m-energy)"/>
    <path d="M515,496 L515,556 M495,522 L535,522 M495,532 L535,532" stroke="#9a3412" stroke-width="4" fill="none"/><rect x="565" y="498" width="74" height="56" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="3"/>
    <text x="602" y="533" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#9a3412">REG</text>
    <path d="M490,574 L640,574" stroke="#ea580c" stroke-width="4"/><line x1="490" y1="590" x2="640" y2="590" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="640" width="640" height="120" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="82" cy="684" r="26" fill="#7c3aed"/><text x="82" y="693" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text>
    <text x="122" y="694" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Chip runs</text>
    <text x="122" y="732" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">clock, logic, crypto</text>
    <path d="M250,602 L250,636" class="a-energy" marker-end="url(#m-energy)"/>
    <rect x="515" y="652" width="100" height="96" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
    <path d="M503,670 L515,670 M615,670 L627,670" stroke="#6d28d9" stroke-width="3"/>
    <path d="M503,690 L515,690 M615,690 L627,690" stroke="#6d28d9" stroke-width="3"/>
    <path d="M503,710 L515,710 M615,710 L627,710" stroke="#6d28d9" stroke-width="3"/>
    <path d="M503,730 L515,730 M615,730 L627,730" stroke="#6d28d9" stroke-width="3"/>
    <path d="M551,692 L551,682 a14,14 0 0 1 28,0 L579,692" fill="none" stroke="#6d28d9" stroke-width="5.0"/><rect x="541" y="690" width="48" height="38" rx="6" fill="#6d28d9"/><circle cx="565" cy="706" r="5" fill="#ffffff"/><rect x="563" y="708" width="4" height="10" fill="#ffffff"/>
    <text x="40" y="806" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">How much power arrives is not fixed</text>
    <rect x="40" y="826" width="312" height="142" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><text x="56" y="862" text-anchor="start" style="font-size:24px;font-weight:800;fill:#b45309">Distance</text><text x="56" y="896" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">coupling falls very</tspan><tspan x="56" dy="27">steeply as the card</tspan><tspan x="56" dy="27">moves away</tspan></text>
    <rect x="368" y="826" width="312" height="142" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><text x="384" y="862" text-anchor="start" style="font-size:24px;font-weight:800;fill:#b45309">Alignment &amp; size</text><text x="384" y="896" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="384" dy="0">the field must thread</tspan><tspan x="384" dy="27">the loop; tilt or a</tspan><tspan x="384" dy="27">smaller coil gets less</tspan></text>
    <rect x="40" y="980" width="312" height="142" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><text x="56" y="1016" text-anchor="start" style="font-size:24px;font-weight:800;fill:#b45309">Tuning</text><text x="56" y="1050" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">metal, other cards or</tspan><tspan x="56" dy="27">very close placement</tspan><tspan x="56" dy="27">can detune both sides</tspan></text>
    <rect x="368" y="980" width="312" height="142" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><text x="384" y="1016" text-anchor="start" style="font-size:24px;font-weight:800;fill:#b45309">Load</text><text x="384" y="1050" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="384" dy="0">computing draws more</tspan><tspan x="384" dy="27">current; designs must</tspan><tspan x="384" dy="27">allow for it</tspan></text>
    <text x="40" y="1160" class="note" text-anchor="start"><tspan x="40" dy="0">No calibrated watts anywhere in this lesson: real values</tspan><tspan x="40" dy="27">depend on the reader, the card and placement.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1472" x2="680" y2="1472" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M40,1503 L74,1503" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="86" y="1508" class="s">Energy / power</text>
  </g>
</svg>
