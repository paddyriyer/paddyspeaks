<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1329" width="720" height="1329" font-family="Inter, Arial, sans-serif">
  <title>Scene 77: Crypto agility: a lifecycle, not a switch</title>
  <desc>Five frames. A seven-step cycle: 1 and 2, inventory what cryptography runs where, by version, then prioritise by data shelf life and exposure; 3 and 4, engage vendors for roadmaps and firmware paths, and measure sizes, speed, battery and interoperability in a lab; 5 and 6, stage the rollout (hybrid first, small groups first) and keep the ability to roll back and retire old keys; 7, verify continuously and re-inventory as standards move, which returns to step 1. Last frame: why some devices cannot simply “switch on” new cryptography — no firmware update path, fixed silicon, and a coin-cell battery; their path is replacement at end of life.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1329"/>
  <text x="40" y="50" class="k">SCENE 77</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Crypto agility: a</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">lifecycle, not a switch</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">You cannot “switch on quantum encryption” for</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">every tag. You plan, measure and replace.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="0" width="300" height="104" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="66" cy="30" r="17" fill="#334155"/><text x="66" y="36" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#ffffff">1</text><text x="92" y="37" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Inventory</text><text x="56" y="68" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">what runs where,</text><text x="56" y="95" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">by version (Scene 73)</text>
    <path d="M190,108 L190,122" stroke="#334155" stroke-width="3"/><path d="M182,122 L190,130 L198,122 Z" fill="#334155"/>
    <rect x="40" y="134" width="300" height="104" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="164" r="17" fill="#2563eb"/><text x="66" y="170" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#ffffff">2</text><text x="92" y="171" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Prioritise</text><text x="56" y="202" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">by data shelf life</text><text x="56" y="229" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">and exposure (Scene 78)</text>
    <path d="M190,242 L190,256" stroke="#334155" stroke-width="3"/><path d="M182,256 L190,264 L198,256 Z" fill="#334155"/>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="40" y="268" width="300" height="104" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="66" cy="298" r="17" fill="#7c3aed"/><text x="66" y="304" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#ffffff">3</text><text x="92" y="305" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Engage vendors</text><text x="56" y="336" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">roadmaps, firmware</text><text x="56" y="363" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">paths, test builds</text>
    <path d="M190,376 L190,390" stroke="#334155" stroke-width="3"/><path d="M182,390 L190,398 L198,390 Z" fill="#334155"/>
    <rect x="40" y="402" width="300" height="104" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="66" cy="432" r="17" fill="#0d9488"/><text x="66" y="438" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#ffffff">4</text><text x="92" y="439" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Measure in a lab</text><text x="56" y="470" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">sizes, speed, battery,</text><text x="56" y="497" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">interoperability</text>
    <path d="M344,454 L368,454" stroke="#334155" stroke-width="3"/><path d="M368,446 L376,454 L368,462 Z" fill="#334155"/>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="380" y="402" width="300" height="104" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="406" cy="432" r="17" fill="#16a34a"/><text x="406" y="438" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#ffffff">5</text><text x="432" y="439" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Stage the rollout</text><text x="396" y="470" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">hybrid first;</text><text x="396" y="497" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">small groups first</text>
    <path d="M530,398 L530,384" stroke="#334155" stroke-width="3"/><path d="M522,384 L530,376 L538,384 Z" fill="#334155"/>
    <rect x="380" y="268" width="300" height="104" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="406" cy="298" r="17" fill="#ea580c"/><text x="406" y="304" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#ffffff">6</text><text x="432" y="305" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Recover and revoke</text><text x="396" y="336" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">roll back safely;</text><text x="396" y="363" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">retire old keys</text>
    <path d="M530,264 L530,250" stroke="#334155" stroke-width="3"/><path d="M522,250 L530,242 L538,250 Z" fill="#334155"/>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="380" y="134" width="300" height="104" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="406" cy="164" r="17" fill="#b45309"/><text x="406" y="170" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#ffffff">7</text><text x="432" y="171" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Verify, again</text><text x="396" y="202" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">monitor; re-inventory</text><text x="396" y="229" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">as standards move</text>
    <path d="M530,130 L530,52 L352,52" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 6"/><path d="M352,44 L342,52 L352,60 Z" fill="#334155"/>
    <text x="400" y="30" text-anchor="start" style="font-size:21px;font-weight:600;fill:#475569">back to step 1</text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="530" width="640" height="423" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <circle cx="68" cy="566" r="19" fill="#dc2626"/><text x="68" y="573" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#ffffff">!</text><text x="96" y="574" text-anchor="start" style="font-size:22px;font-weight:800;fill:#b91c1c"><tspan x="96" dy="0">Why some devices cannot simply “switch on”</tspan><tspan x="96" dy="29">new cryptography</tspan></text>
    <circle cx="109" cy="725" r="48" fill="#0f172a" opacity="0.13"/><circle cx="106" cy="720" r="48" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="106" cy="720" r="30" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="180" y="642" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">No update path</text><text x="180" y="671" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">some devices never receive new firmware</text><text x="180" y="714" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Fixed silicon</text><text x="180" y="743" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">boot ROM and crypto engine are set at</text><text x="180" y="770" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">the factory</text><text x="180" y="813" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">A coin cell</text><text x="180" y="842" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">bigger messages cost battery life</text>
    <text x="62" y="891" text-anchor="start" style="font-size:21px;font-weight:700;fill:#166534">For these, the path is replacement at end of life,</text><text x="62" y="918" text-anchor="start" style="font-size:21px;font-weight:700;fill:#166534">planned now.</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1235" x2="680" y2="1235" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1265" class="note">Process view. Steps run in parallel across product lines</text>
    <text x="40" y="1292" class="note">in practice.</text>
  </g>
</svg>
