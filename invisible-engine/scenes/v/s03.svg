<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1505" width="720" height="1505" font-family="Inter, Arial, sans-serif">
  <title>Scene 03: A changing current makes a changing magnetic field</title>
  <desc>Four frames. An alternating current source drives a coil; an illustrative magnetic field around the coil grows, shrinks and reverses with the current; the near field, within about one wavelength over two pi, where coupling dominates and falls very steeply, contrasted with the far field, where a wave travels on; and the sizes: at 13.56 MHz that boundary is about 3.5 metres, at 2.4 GHz about 2 centimetres.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1505"/>
  <text x="40" y="50" class="k">SCENE 03</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">A changing current makes</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">a changing magnetic field</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Near field: energy shared with nearby coils. Far</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">field: a wave that travels on.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="0" width="640" height="312" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="82" cy="44" r="26" fill="#ea580c"/><text x="82" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="122" y="54" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">Coil driven by AC</text>
    <circle cx="100" cy="160" r="38" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><path d="M78,160 C88,135 100,135 105,160 C110,185 122,185 130,160" fill="none" stroke="#c2410c" stroke-width="3"/><path d="M138,160 L300,160" class="wire"/>
    <text x="100" y="228" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#9a3412">AC source</text>
    <rect x="300.0" y="90.0" width="240" height="140" rx="18" class="coil"/>
    <rect x="311.0" y="101.0" width="218" height="118" rx="15" class="coil"/>
    <rect x="322.0" y="112.0" width="196" height="96" rx="12" class="coil"/>
    <rect x="333.0" y="123.0" width="174" height="74" rx="9" class="coil"/>
    <text x="64" y="270" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Current reverses 13.56 million times a second (NFC).</text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <ellipse cx="420" cy="160" rx="140" ry="77" class="field"/>
    <ellipse cx="420" cy="160" rx="165" ry="91" class="field"/>
    <text x="64" y="298" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#475569">Illustrative field visualisation — not literal visible waves.</text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="40" y="332" width="640" height="342" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="82" cy="376" r="26" fill="#2563eb"/><text x="82" y="385" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="122" y="386" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">Near field (inside ≈ λ/2π)</text>
    <rect x="68" y="412" width="161" height="260" rx="19" fill="#0f172a" opacity="0.15"/><rect x="62" y="404" width="161" height="260" rx="19" fill="#1f2937"/><rect x="66" y="408" width="154" height="253" rx="16" fill="#374151"/><rect x="77" y="420" width="131" height="93" rx="7" fill="#e0f2fe" stroke="#0f172a" stroke-width="1.9"/><path d="M133.9,447.9 q5.0,5.7 0,11.4" fill="none" stroke="#0c4a6e" stroke-width="1.984" stroke-linecap="round"/><path d="M140.3,442.9 q8.6,10.7 0,21.4" fill="none" stroke="#0c4a6e" stroke-width="1.984" stroke-linecap="round"/><path d="M146.8,437.9 q12.1,15.7 0,31.4" fill="none" stroke="#0c4a6e" stroke-width="1.984" stroke-linecap="round"/><text x="142.6" y="497.0" text-anchor="middle" style="font-size:13.64px;font-weight:800;fill:#0c4a6e"></text><rect x="87" y="531" width="32" height="20" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.9"/><rect x="126" y="531" width="32" height="20" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.9"/><rect x="166" y="531" width="32" height="20" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.9"/><rect x="87" y="560" width="32" height="20" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.9"/><rect x="126" y="560" width="32" height="20" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.9"/><rect x="166" y="560" width="32" height="20" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.9"/><rect x="87" y="588" width="32" height="20" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.9"/><rect x="126" y="588" width="32" height="20" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.9"/><rect x="166" y="588" width="32" height="20" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.9"/><rect x="87" y="617" width="32" height="20" rx="4" fill="#ef4444" stroke="#111827" stroke-width="0.9"/><rect x="126" y="617" width="32" height="20" rx="4" fill="#facc15" stroke="#111827" stroke-width="0.9"/><rect x="166" y="617" width="32" height="20" rx="4" fill="#22c55e" stroke="#111827" stroke-width="0.9"/>
    <text x="143" y="502" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#0c4a6e">Tap to pay</text>
    <rect x="238" y="534" width="104" height="66" rx="5" fill="#0f172a" opacity="0.12"/><rect x="234" y="528" width="104" height="66" rx="5" fill="#1e3a8a"/><path d="M234,569 Q286,557 338,574 L338,588 Q338,594 333,594 L239,594 Q234,594 234,588 Z" fill="#1d4ed8" opacity="0.55"/><path d="M317.2,548.4 q2.8,3.2 0,6.4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M320.8,545.6 q4.8,6.0 0,12.0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M324.4,542.8 q6.8,8.8 0,17.6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><rect x="244.4" y="549.6216" width="15.6" height="15.724799999999998" rx="3" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M252.20000000000002,549.6216 L252.20000000000002,565.3463999999999 M244.4,554.8631999999999 L250.328,554.8631999999999 M254.072,554.8631999999999 L260.0,554.8631999999999 M244.4,560.1048 L250.328,560.1048 M254.072,560.1048 L260.0,560.1048" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="250.328" y="553.081056" width="3.7439999999999998" height="8.805888" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/>
    <text x="360" y="452" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="360" dy="0">Energy is mostly stored and</tspan><tspan x="360" dy="27">exchanged with nearby coils,</tspan><tspan x="360" dy="27">and falls very steeply with</tspan><tspan x="360" dy="27">distance. A card on a</tspan><tspan x="360" dy="27">terminal lives here.</tspan></text>
    <rect x="40" y="690" width="640" height="222" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="82" cy="734" r="26" fill="#16a34a"/><text x="82" y="743" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="122" y="744" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">Far field (many λ away)</text>
    <circle cx="99" cy="845" r="26" fill="#0f172a" opacity="0.13"/><circle cx="96" cy="840" r="26" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="96" cy="840" r="16" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M129,827 q9,13 0,25" fill="none" stroke="#16a34a" stroke-width="3.6" stroke-linecap="round" opacity="1.00"/><path d="M141,817 q14,23 0,47" fill="none" stroke="#16a34a" stroke-width="3.6" stroke-linecap="round" opacity="0.80"/><path d="M154,806 q20,34 0,68" fill="none" stroke="#16a34a" stroke-width="3.6" stroke-linecap="round" opacity="0.60"/>
    <rect x="195" y="797" width="48" height="96" rx="8" fill="#0f172a" opacity="0.14"/><rect x="190" y="790" width="48" height="96" rx="8" fill="#111827"/><rect x="193" y="793" width="42" height="90" rx="6" fill="#ecfdf5"/><rect x="207" y="795" width="13" height="3" rx="2" fill="#111827"/>
    <text x="274" y="802" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="274" dy="0">A wave detaches and travels on,</tspan><tspan x="274" dy="27">weakening more gently. Bluetooth,</tspan><tspan x="274" dy="27">Wi-Fi and satellite receivers use</tspan><tspan x="274" dy="27">this radiation.</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="928" width="640" height="271" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="82" cy="972" r="26" fill="#334155"/><text x="82" y="981" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text><text x="122" y="982" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">Same rule, very different sizes</text>
    <text x="60" y="1028" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:19.5px;font-weight:600;fill:#14213d">13.56 MHz (NFC):   λ = c / f ≈ 22.1 m   →   λ/2π ≈ 3.5 m.</text>
    <text x="60" y="1056" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d">A card 2–4 cm away is deep in the near field.</text>
    <text x="60" y="1094" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:19.5px;font-weight:600;fill:#14213d">2.4 GHz (Bluetooth LE):   λ ≈ 12.5 cm   →   λ/2π ≈ 2 cm.</text>
    <text x="60" y="1122" text-anchor="start" style="font-size:21px;font-weight:600;fill:#14213d">A phone 10 m away is in the far field.</text>
    <text x="60" y="1160" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="60" dy="0">Range depends on power, antennas, coupling, noise and</tspan><tspan x="60" dy="27">the receiver — not on frequency alone.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1473" x2="680" y2="1473" stroke="#e2e8f0" stroke-width="2"/>
  </g>
</svg>
