<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1600" width="720" height="1600" font-family="Inter, Arial, sans-serif">
  <title>Scene 19: Three kinds of RFID tag</title>
  <desc>Four frames. A passive tag has no battery: the reader’s signal powers it and it replies by backscatter. A battery-assisted passive tag adds a small cell that runs its chip and sensors, but still replies by backscatter, so it can answer a weaker reader signal from further away. An active tag has its own battery and its own transmitter and sends its own signal, often on a timer, to readers tens of metres or more away. A range chart compares illustrative typical ranges on a logarithmic scale from one centimetre to one hundred metres, with the trade-offs: cost, size, battery life.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1600"/>
  <text x="40" y="50" class="k">SCENE 19</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Three kinds of RFID tag</text>
  <text x="40" y="153" style="font-size:23px;fill:#475569">The more of its own energy a tag carries, the</text>
  <text x="40" y="184" style="font-size:23px;fill:#475569">further it reaches, and the more it costs.</text>
  <g data-f="1" transform="translate(0,210)">
    <rect x="40" y="0" width="640" height="300" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="82" cy="44" r="26" fill="#2563eb"/><text x="82" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="122" y="54" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Passive</text>
    <text x="122" y="86" text-anchor="start" style="font-size:21px;font-weight:600;fill:#2563eb">No battery</text>
    <rect x="64" y="118" width="80" height="120" rx="14" fill="#0f172a" opacity="0.13"/><rect x="60" y="112" width="80" height="120" rx="14" fill="#1f2937"/><rect x="72" y="126" width="56" height="41" rx="6" fill="#e0f2fe"/><path d="M90.0,140.4 q5.2,6.0 0,12.0" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/><path d="M96.8,135.2 q9.0,11.2 0,22.5" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/><path d="M103.5,129.9 q12.8,16.5 0,33.0" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/><circle cx="100" cy="208" r="7" fill="#22c55e"/><text x="100.0" y="260" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#334155">reader</text>
    <rect x="229" y="124" width="120" height="43" rx="6" fill="#0f172a" opacity="0.10"/><rect x="226" y="120" width="120" height="43" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><path d="M276,142 L268,153 L259,130 L251,153 L242,130 L234,153 L226,130" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/><path d="M296,142 L304,153 L313,130 L321,153 L330,130 L338,153 L346,130" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/><rect x="277" y="133" width="18" height="18" rx="3" fill="#111827"/>
    <path d="M148,136 L220,136" class="a-energy" marker-end="url(#m-energy)"/>
    <path d="M220,182 L148,182" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="378" y="132" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="378" dy="0">Powered by the reader’s</tspan><tspan x="378" dy="27">signal.</tspan></text>
    <text x="378" y="196" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Replies by backscatter.</text>
    <text x="378" y="233" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="378" dy="0">Cheapest and smallest;</tspan><tspan x="378" dy="27">nothing to wear out.</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,210)">
    <rect x="40" y="312" width="640" height="300" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="82" cy="356" r="26" fill="#0d9488"/><text x="82" y="365" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="122" y="366" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Battery-assisted passive</text>
    <text x="122" y="398" text-anchor="start" style="font-size:21px;font-weight:600;fill:#0d9488">Battery runs the chip</text>
    <rect x="64" y="430" width="80" height="120" rx="14" fill="#0f172a" opacity="0.13"/><rect x="60" y="424" width="80" height="120" rx="14" fill="#1f2937"/><rect x="72" y="438" width="56" height="41" rx="6" fill="#e0f2fe"/><path d="M90.0,452.4 q5.2,6.0 0,12.0" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/><path d="M96.8,447.1 q9.0,11.2 0,22.5" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/><path d="M103.5,441.9 q12.8,16.5 0,33.0" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/><circle cx="100" cy="520" r="7" fill="#22c55e"/><text x="100.0" y="572" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#334155">reader</text>
    <rect x="229" y="436" width="120" height="43" rx="6" fill="#0f172a" opacity="0.10"/><rect x="226" y="432" width="120" height="43" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><path d="M276,454 L268,465 L259,442 L251,465 L242,442 L234,465 L226,442" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/><path d="M296,454 L304,465 L313,442 L321,465 L330,442 L338,465 L346,442" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/><rect x="277" y="445" width="18" height="18" rx="3" fill="#111827"/>
    <path d="M148,448 L220,448" class="a-energy" marker-end="url(#m-energy)"/>
    <path d="M220,494 L148,494" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="262" y="526" width="56" height="34" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><rect x="318" y="535" width="6" height="16" rx="2" fill="#334155"/><rect x="267" y="531" width="34" height="24" rx="3" fill="#4ade80"/>
    <text x="252" y="550" text-anchor="end" style="font-size:21px;font-weight:700;fill:#334155">cell</text>
    <path d="M290,524 L290,482" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="378" y="444" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="378" dy="0">A cell runs the chip and</tspan><tspan x="378" dy="27">sensors.</tspan></text>
    <text x="378" y="508" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="378" dy="0">Still replies by</tspan><tspan x="378" dy="27">backscatter.</tspan></text>
    <text x="378" y="572" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="378" dy="0">Hears a weaker reader,</tspan><tspan x="378" dy="27">further away.</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,210)">
    <rect x="40" y="624" width="640" height="300" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="82" cy="668" r="26" fill="#7c3aed"/><text x="82" y="677" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="122" y="678" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Active</text>
    <text x="122" y="710" text-anchor="start" style="font-size:21px;font-weight:600;fill:#7c3aed">Own battery and transmitter</text>
    <rect x="60" y="746" width="150" height="100" rx="14" fill="#334155"/><rect x="76" y="766" width="54" height="60" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><rect x="92" y="760" width="22" height="8" rx="2" fill="#94a3b8"/><rect x="81" y="792" width="44" height="29" rx="4" fill="#4ade80"/><rect x="144" y="776" width="50" height="40" rx="5" fill="#111827"/>
    <text x="169" y="803" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#e5e7eb">TX</text>
    <path d="M225,783 q9,13 0,25" fill="none" stroke="#1d4ed8" stroke-width="3.6" stroke-linecap="round" opacity="1.00"/><path d="M237,773 q14,23 0,47" fill="none" stroke="#1d4ed8" stroke-width="3.6" stroke-linecap="round" opacity="0.80"/><path d="M250,762 q20,34 0,68" fill="none" stroke="#1d4ed8" stroke-width="3.6" stroke-linecap="round" opacity="0.60"/>
    <path d="M256,796 L294,796" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="304" y="742" width="70" height="120" rx="14" fill="#0f172a" opacity="0.13"/><rect x="300" y="736" width="70" height="120" rx="14" fill="#1f2937"/><rect x="312" y="750" width="46" height="41" rx="6" fill="#e0f2fe"/><path d="M325.0,764.4 q5.2,6.0 0,12.0" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/><path d="M331.8,759.1 q9.0,11.2 0,22.5" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/><path d="M338.5,753.9 q12.8,16.5 0,33.0" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/><circle cx="335" cy="832" r="7" fill="#22c55e"/><text x="335.0" y="884" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#334155">reader</text>
    <text x="378" y="756" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="378" dy="0">Sends its own signal,</tspan><tspan x="378" dy="27">often on a timer.</tspan></text>
    <text x="378" y="820" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="378" dy="0">Longest range; costs</tspan><tspan x="378" dy="27">most.</tspan></text>
    <text x="378" y="884" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Battery sets its life.</text>
  </g>
  <g data-f="4" transform="translate(0,210)">
    <rect x="40" y="936" width="640" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="60" y="974" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Typical read range (illustrative, log scale)</text>
    <path d="M76,992 L76,1198" stroke="#e2e8f0" stroke-width="2"/>
    <text x="76.0" y="1222" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">1 cm</text>
    <path d="M216,992 L216,1198" stroke="#e2e8f0" stroke-width="2"/>
    <text x="216.0" y="1222" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">10 cm</text>
    <path d="M356,992 L356,1198" stroke="#e2e8f0" stroke-width="2"/>
    <text x="356.0" y="1222" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">1 m</text>
    <path d="M496,992 L496,1198" stroke="#e2e8f0" stroke-width="2"/>
    <text x="496.0" y="1222" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">10 m</text>
    <path d="M636,992 L636,1198" stroke="#e2e8f0" stroke-width="2"/>
    <text x="636.0" y="1222" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">100 m</text>
    <text x="60" y="1012" text-anchor="start" style="font-size:20px;font-weight:600;fill:#334155">Passive HF (13.56 MHz)</text>
    <rect x="76" y="1020" width="280" height="18" rx="9" fill="#2563eb" opacity="0.85"/>
    <text x="216.0" y="1060" text-anchor="start" style="font-size:20px;font-weight:600;fill:#334155">Passive UHF (860–960 MHz)</text>
    <rect x="216" y="1068" width="280" height="18" rx="9" fill="#2563eb" opacity="0.85"/>
    <text x="313.8558006070426" y="1108" text-anchor="start" style="font-size:20px;font-weight:600;fill:#334155">Battery-assisted passive</text>
    <rect x="314" y="1116" width="249" height="18" rx="9" fill="#0d9488" opacity="0.85"/>
    <text x="356.0" y="1156" text-anchor="start" style="font-size:20px;font-weight:600;fill:#334155">Active</text>
    <rect x="356" y="1164" width="280" height="18" rx="9" fill="#7c3aed" opacity="0.85"/>
  </g>
  <g class="legend">
    <line x1="40" y1="1472" x2="680" y2="1472" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1502" class="note">Ranges are illustrative: reader power, antennas,</text>
    <text x="40" y="1529" class="note">regulation and surroundings change them.</text>
    <path d="M40,1565 L74,1565" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="86" y="1570" class="s">Energy / power</text>
    <path d="M258.4,1565 L292.4,1565" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="304.4" y="1570" class="s">Radio signal or wave</text>
  </g>
</svg>
