<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1570" width="720" height="1570" font-family="Inter, Arial, sans-serif">
  <title>Scene 17: What contactless does not promise — and the layers that defend it</title>
  <desc>Five frames. Who sees transaction data; a relay hazard that stretches a tap across distance, with timing checks as a defence; a nearby reader reading some card data at centimetres but unable to create future cryptograms without the card’s key; a separate risk, a sticker that sends a phone to a fake web page; and layered defences.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1570"/>
  <text x="40" y="50" class="k">SCENE 17</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">What contactless does not</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">promise — and the layers</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">that defend it</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">Explained only as far as a defender needs. No</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">instructions.</text>
  <g data-f="1" transform="translate(0,314)">
    <rect x="40" y="0" width="640" height="160" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="82" cy="44" r="26" fill="#334155"/><text x="82" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="122" y="54" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Visible to the payment chain</text>
    <path d="M60,112 Q92,88 124,112 Q92,136 60,112 Z" fill="#ffffff" stroke="#334155" stroke-width="2.4"/><circle cx="92" cy="112" r="10" fill="#334155"/>
    <text x="146" y="92" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="146" dy="0">Merchant, acquirer, network and issuer see amount,</tspan><tspan x="146" dy="26">time, place, a card or token number. Cryptograms stop</tspan><tspan x="146" dy="26">copying — they do not make the payment private.</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,314)">
    <rect x="40" y="168" width="640" height="310" rx="18" class="hz"/>
    <circle cx="82" cy="212" r="26" fill="#dc2626"/><text x="82" y="221" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text>
    <text x="122" y="222" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Relay (hazard, conceptual)</text>
    <rect x="64" y="268" width="110" height="69" rx="6" fill="#0f172a" opacity="0.12"/><rect x="60" y="262" width="110" height="69" rx="6" fill="#1e3a8a"/><path d="M60,305 Q115,293 170,311 L170,326 Q170,331 164,331 L66,331 Q60,331 60,326 Z" fill="#1d4ed8" opacity="0.55"/><path d="M148.0,283.6 q3.0,3.4 0,6.8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M151.8,280.6 q5.1,6.3 0,12.7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M155.6,277.6 q7.2,9.3 0,18.6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><rect x="71.0" y="284.869" width="16.5" height="16.631999999999998" rx="3" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M79.25,284.869 L79.25,301.50100000000003 M71.0,290.413 L77.27,290.413 M81.23,290.413 L87.5,290.413 M71.0,295.95700000000005 L77.27,295.95700000000005 M81.23,295.95700000000005 L87.5,295.95700000000005" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="77.27" y="288.52804000000003" width="3.96" height="9.31392" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/>
    <path d="M176,297 L236,297 L236,400 L246,400" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 8"/>
    <rect x="256" y="244" width="143" height="231" rx="16" fill="#0f172a" opacity="0.15"/><rect x="250" y="236" width="143" height="231" rx="16" fill="#1f2937"/><rect x="253" y="239" width="136" height="224" rx="14" fill="#374151"/><rect x="263" y="250" width="117" height="82" rx="7" fill="#e0f2fe" stroke="#0f172a" stroke-width="1.7"/><path d="M313.8,274.9 q4.4,5.1 0,10.1" fill="none" stroke="#0c4a6e" stroke-width="1.7600000000000002" stroke-linecap="round"/><path d="M319.5,270.5 q7.6,9.5 0,19.0" fill="none" stroke="#0c4a6e" stroke-width="1.7600000000000002" stroke-linecap="round"/><path d="M325.2,266.1 q10.8,13.9 0,27.8" fill="none" stroke="#0c4a6e" stroke-width="1.7600000000000002" stroke-linecap="round"/><text x="321.5" y="318.5" text-anchor="middle" style="font-size:12.100000000000001px;font-weight:800;fill:#0c4a6e"></text><rect x="272" y="349" width="29" height="18" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.8"/><rect x="307" y="349" width="29" height="18" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.8"/><rect x="342" y="349" width="29" height="18" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.8"/><rect x="272" y="374" width="29" height="18" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.8"/><rect x="307" y="374" width="29" height="18" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.8"/><rect x="342" y="374" width="29" height="18" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.8"/><rect x="272" y="399" width="29" height="18" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.8"/><rect x="307" y="399" width="29" height="18" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.8"/><rect x="342" y="399" width="29" height="18" rx="4" fill="#9ca3af" stroke="#111827" stroke-width="0.8"/><rect x="272" y="425" width="29" height="18" rx="4" fill="#ef4444" stroke="#111827" stroke-width="0.8"/><rect x="307" y="425" width="29" height="18" rx="4" fill="#facc15" stroke="#111827" stroke-width="0.8"/><rect x="342" y="425" width="29" height="18" rx="4" fill="#22c55e" stroke="#111827" stroke-width="0.8"/><text x="321.5" y="318.5" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#0c4a6e">Tap to pay</text>
    <text x="412" y="276" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="412" dy="0">Two devices forward the</tspan><tspan x="412" dy="26">exchange over distance.</tspan></text>
    <text x="412" y="352" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="412" dy="0">Defences: tight timing</tspan><tspan x="412" dy="26">checks (relay-resistance</tspan><tspan x="412" dy="26">protocols), amount limits,</tspan><tspan x="412" dy="26">issuer risk scoring.</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <rect x="40" y="486" width="640" height="212" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="82" cy="530" r="26" fill="#b45309"/><text x="82" y="539" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="122" y="540" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Skimming at centimetres</text>
    <text x="60" y="578" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="60" dy="0">A nearby reader can read some card data. It cannot invent</tspan><tspan x="60" dy="26">future cryptograms without the card’s secret key; issuers</tspan><tspan x="60" dy="26">check counters and unpredictable numbers. Weak</tspan><tspan x="60" dy="26">unpredictable numbers in some terminals were a past</tspan><tspan x="60" dy="26">research finding.</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,314)">
    <rect x="40" y="706" width="640" height="192" rx="18" class="hz"/>
    <circle cx="82" cy="750" r="26" fill="#dc2626"/><text x="82" y="759" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text>
    <text x="122" y="760" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">A different risk: malicious NFC tags</text>
    <rect x="60" y="790" width="80" height="80" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text x="100" y="838" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#92400e">NFC</text>
    <text x="156" y="802" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="156" dy="0">A sticker’s NDEF record can send a phone to a fake</tspan><tspan x="156" dy="26">page. It cannot take money from a card; it targets</tspan><tspan x="156" dy="26">the person tapping. Check the address; never pay or</tspan><tspan x="156" dy="26">sign in from a tapped link.</tspan></text>
  </g>
  <g data-f="5" transform="translate(0,314)">
    <rect x="40" y="906" width="640" height="268" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="82" cy="950" r="26" fill="#16a34a"/><text x="82" y="959" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text><text x="122" y="960" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Layered defences — no single one is enough</text>
    <path d="M606,1000 L634,990 L663,1000 L663,1024 Q663,1049 634,1060 Q606,1049 606,1024 Z" fill="#16a34a"/><path d="M622,1025 L632,1035 L649,1016" fill="none" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="998" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="60" dy="0">Card &amp; wallet: secret keys, counters, phone</tspan><tspan x="60" dy="26">authentication · Terminal: certified readers,</tspan><tspan x="60" dy="26">unpredictable numbers</tspan><tspan x="60" dy="26">Network &amp; issuer: risk scoring, limits, token</tspan><tspan x="60" dy="26">suspension · Person: report a lost card quickly</tspan><tspan x="60" dy="26">Stolen cards and compromised terminals remain real</tspan><tspan x="60" dy="26">risks; limits cap the damage, they do not remove it.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1504" x2="680" y2="1504" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="40" y="1526" width="34" height="18" rx="3" class="hz" style="stroke-width:3"/>
    <text x="86" y="1540" class="s">Attacker zone / hazard</text>
  </g>
</svg>
