<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1585" width="720" height="1585" font-family="Inter, Arial, sans-serif">
  <title>Scene 41: An owner’s life with the tag: what survives each change</title>
  <desc>Six frames showing states and transitions. 1, setup moves the tag from unregistered to registered to one Apple Account. 2, the owner can share it with up to five people and later stop sharing; sharing grants viewing, not ownership. 3, a lost or replaced iPhone changes nothing about ownership, because items belong to the account; a newly signed-in device gets access, with key material synced through end-to-end encrypted iCloud Keychain according to Apple. 4, Remove Item unlinks the tag so another account can add it; if it is out of range, Apple documents a reset procedure. 5, losing the account itself without a recovery path means losing access to the item; account recovery restores it. 6, a key distinguishing disclosed behaviour from undisclosed cryptographic implementation.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1585"/>
  <text x="40" y="50" class="k">SCENE 41</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">An owner’s life with the</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">tag: what survives each</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">change</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">Ownership lives in the Apple Account, not in a</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">phone. Grey dashed arrows are permissions, not</text>
  <text x="40" y="319" style="font-size:23px;fill:#475569">data.</text>
  <g data-f="1" transform="translate(0,345)">
    <rect x="78" y="0" width="306" height="92" rx="46" fill="#f8fafc" stroke="#334155" stroke-width="3"/><text x="231.0" y="40" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#14213d">Unregistered</text><text x="231.0" y="70" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#475569">new, removed or reset</text>
    <rect x="78" y="136" width="306" height="92" rx="46" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="231.0" y="176" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#14213d">Registered</text><text x="231.0" y="206" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#475569">linked to one Apple Account</text>
    <path d="M300,94 L300,132" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="313" y="99" width="101" height="32" rx="6" class="lab"/>
    <text x="364" y="121" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#4b5563"><tspan x="364" dy="0">1 setup</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,345)">
    <rect x="78" y="272" width="306" height="92" rx="46" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="231.0" y="312" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#14213d">Shared</text><text x="231.0" y="342" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#475569">up to 5 people can view it</text>
    <path d="M160,230 L160,268" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="175" y="235" width="101" height="32" rx="6" class="lab"/>
    <text x="226" y="257" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#4b5563"><tspan x="226" dy="0">2 share</tspan></text>
    <path d="M300,270 L300,232" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="306" y="235" width="159" height="32" rx="6" class="lab"/>
    <text x="386" y="257" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#4b5563"><tspan x="386" dy="0">stop sharing</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,345)">
    <rect x="455" y="7" width="76" height="140" rx="13" fill="#0f172a" opacity="0.14"/><rect x="450" y="0" width="76" height="140" rx="13" fill="#111827"/><rect x="455" y="5" width="67" height="131" rx="10" fill="#f8fafc"/><rect x="477" y="8" width="21" height="5" rx="3" fill="#111827"/>
    <circle cx="488" cy="70" r="20" fill="#ffffff" stroke="#475569" stroke-width="4"/><path d="M479,61 L497,79 M497,61 L479,79" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <rect x="609" y="7" width="76" height="140" rx="13" fill="#0f172a" opacity="0.14"/><rect x="604" y="0" width="76" height="140" rx="13" fill="#111827"/><rect x="609" y="5" width="67" height="131" rx="10" fill="#f8fafc"/><rect x="631" y="8" width="21" height="5" rx="3" fill="#111827"/>
    <path d="M532,70 L596,70" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="565" y="164" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#6d28d9">keys sync</text>
    <rect x="40" y="516" width="640" height="143" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="66" cy="546" r="18" fill="#7c3aed"/><text x="66" y="552" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="94" y="552" text-anchor="start" style="font-size:23px;font-weight:800;fill:#7c3aed">Phone lost or replaced: ownership unchanged</text><text x="56" y="585" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Items belong to the account. A new signed-in device gets</tspan><tspan x="56" dy="27">access; Apple says Find My key material syncs via</tspan><tspan x="56" dy="27">end-to-end encrypted iCloud Keychain.</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,345)">
    <path d="M78,182 L56,182 L56,46 L74,46" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="65" y="99" width="171" height="32" rx="6" class="lab"/>
    <text x="150" y="121" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#4b5563"><tspan x="150" dy="0">4 Remove Item</tspan></text>
    <rect x="40" y="667" width="640" height="116" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="66" cy="697" r="18" fill="#334155"/><text x="66" y="703" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="94" y="703" text-anchor="start" style="font-size:26px;font-weight:800;fill:#334155">Remove, then transfer</text><text x="56" y="739" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Remove Item unlinks the tag; then another account can</tspan><tspan x="56" dy="27">set it up. Out of range? Apple documents a reset.</tspan></text>
  </g>
  <g data-f="5" transform="translate(0,345)">
    <rect x="78" y="408" width="306" height="92" rx="46" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><text x="231.0" y="448" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#14213d">Account inaccessible</text><text x="231.0" y="478" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#475569">no sign-in, no recovery</text>
    <path d="M388,210 L470,210 L470,454 L392,454" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="396" y="318" width="148" height="32" rx="6" class="lab"/>
    <text x="470" y="340" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#4b5563"><tspan x="470" dy="0">lose access</tspan></text>
    <path d="M388,480 L610,480 L610,184 L392,184" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="542" y="388" width="136" height="32" rx="6" class="lab"/>
    <text x="610" y="410" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#4b5563"><tspan x="610" dy="0">5 recovery</tspan></text>
    <rect x="40" y="791" width="640" height="116" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/><circle cx="66" cy="821" r="18" fill="#dc2626"/><text x="66" y="827" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="94" y="827" text-anchor="start" style="font-size:26px;font-weight:800;fill:#dc2626">Lose the account, lose the item</text><text x="56" y="863" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Without recovery (recovery contact, key or Apple’s</tspan><tspan x="56" dy="27">process), the owner cannot see the item or its sightings.</tspan></text>
  </g>
  <g data-f="6" transform="translate(0,345)">
    <rect x="40" y="915" width="640" height="208" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="82" cy="959" r="26" fill="#b45309"/><text x="82" y="968" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">6</text><text x="122" y="969" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d"><tspan x="122" dy="0">Disclosed behaviour vs</tspan><tspan x="122" dy="31">undisclosed implementation</tspan></text>
    <rect x="64" y="1018" width="143" height="34" rx="17" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="135.5" y="1042" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#1e40af">DOCUMENTED</text><text x="219.0" y="1042" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">every transition shown</text>
    <rect x="64" y="1064" width="155" height="34" rx="17" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="141.55" y="1088" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#374151">UNDISCLOSED</text><text x="231.1" y="1088" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="231.1" dy="0">how keys are re-issued, revoked or</tspan><tspan x="231.1" dy="27">erased at each step</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1485" x2="680" y2="1485" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M40,1516 L74,1516" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="86" y="1521" class="s">Encrypted / cryptographic</text>
    <path d="M40,1550 L74,1550" class="a-admin" marker-end="url(#m-admin)"/>
    <text x="86" y="1555" class="s">Registration / authorisation (not data)</text>
  </g>
</svg>
