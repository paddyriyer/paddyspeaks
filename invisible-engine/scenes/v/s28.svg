    <text x="64" y="386" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">a new name every so often</text>
    <rect x="107" y="429" width="86" height="58" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><path d="M100,406 L120,406 L120,429 Q110,437 100,429 Z" fill="#2563eb" stroke="#475569" stroke-width="1.5"/><path d="M120,406 L140,406 L140,429 Q130,437 120,429 Z" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><path d="M140,406 L160,406 L160,429 Q150,437 140,429 Z" fill="#2563eb" stroke="#475569" stroke-width="1.5"/><path d="M160,406 L181,406 L181,429 Q171,437 160,429 Z" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><path d="M181,406 L201,406 L201,429 Q191,437 181,429 Z" fill="#2563eb" stroke="#475569" stroke-width="1.5"/><rect x="120" y="446" width="27" height="22" fill="#bfdbfe" stroke="#475569" stroke-width="1.5"/><rect x="159" y="446" width="22" height="40" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
