  <g data-f="4" transform="translate(0,314)">
    <rect x="40" y="712" width="640" height="232" rx="18" class="hz"/>
    <circle cx="80" cy="754" r="24" fill="#dc2626"/><text x="80" y="763" text-anchor="middle" style="font-size:25px;font-weight:800;fill:#ffffff">4</text>
    <text x="118" y="764" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">What rotation does not stop</text>
    <text x="64" y="806" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="64" dy="0">• radio fingerprinting (tiny differences in each</tspan><tspan x="64" dy="27">transmitter)</tspan><tspan x="64" dy="27">• one moving thing seen again and again along a route</tspan><tspan x="64" dy="27">• long intervals between changes; implementation</tspan><tspan x="64" dy="27">flaws</tspan></text>
  </g>
