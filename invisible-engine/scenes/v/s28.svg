  <rect class="bg" width="720" height="1551"/>
  <text x="40" y="50" class="k">SCENE 28</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Changing names: why a</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">rotating identifier</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">protects privacy</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">A changing name stops casual linking. It does not</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">make a tracker invisible.</text>
