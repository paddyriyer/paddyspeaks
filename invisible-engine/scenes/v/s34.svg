<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1257" width="720" height="1257" font-family="Inter, Arial, sans-serif">
  <title>Scene 34: A passer-by’s phone overhears the whisper</title>
  <desc>Four frames. The tag in the suitcase repeats a Bluetooth advertisement carrying a rotating public key; a passer-by’s participating iPhone, within radio range, receives it one way; there is no pairing, no handshake and no reply to the tag, shown crossed out; and the finder’s phone handles it in the background as an observation, not a connection to the owner or to the tag.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1257"/>
  <text x="40" y="50" class="k">SCENE 34</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">A passer-by’s phone</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">overhears the whisper</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">One-way: the tag talks, a phone listens. Nobody</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">pairs, nobody connects.</text>
  <g data-f="1" transform="translate(0,262)">
    <path d="M78,60 L78,26 L129,26 L129,60" fill="none" stroke="#334155" stroke-width="5.1"/><rect x="45" y="67" width="128" height="162" rx="15" fill="#0f172a" opacity="0.13"/><rect x="40" y="60" width="128" height="162" rx="15" fill="#0e7490"/><path d="M78,72 L78,210" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4.2"/><path d="M104,72 L104,210" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4.2"/><path d="M129,72 L129,210" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4.2"/><circle cx="66" cy="232" r="9" fill="#334155"/><circle cx="142" cy="232" r="9" fill="#334155"/>
    <circle cx="207" cy="125" r="30" fill="#0f172a" opacity="0.13"/><circle cx="204" cy="120" r="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="204" cy="120" r="19" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M174,120 L168,120" stroke="#334155" stroke-width="3"/>
    <path d="M251,105 q11,15 0,31" fill="none" stroke="#2563eb" stroke-width="4.4" stroke-linecap="round" opacity="1.00"/><path d="M267,91 q18,29 0,57" fill="none" stroke="#2563eb" stroke-width="4.4" stroke-linecap="round" opacity="0.80"/><path d="M282,78 q24,42 0,84" fill="none" stroke="#2563eb" stroke-width="4.4" stroke-linecap="round" opacity="0.60"/>
    <rect x="40" y="310" width="640" height="116" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="340" r="18" fill="#2563eb"/><text x="66" y="346" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="94" y="346" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">The tag repeats an advertisement</text><text x="56" y="382" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">A short Bluetooth LE broadcast with a rotating public</tspan><tspan x="56" dy="27">key in it — no name, no owner, no location.</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <circle cx="610" cy="34" r="24" fill="#475569"/><path d="M576,150 L576,90 Q576,66 600,66 L620,66 Q644,66 644,90 L644,150 Z" fill="#475569"/><rect x="584" y="142" width="20" height="88" rx="8" fill="#475569"/><rect x="616" y="142" width="20" height="88" rx="8" fill="#475569"/><rect x="644" y="102" width="18" height="32" rx="4" fill="#111827" stroke="#e5e7eb" stroke-width="1.5"/>
    <path d="M300,120 L560,120" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="321" y="44" width="217" height="58" rx="6" class="lab"/>
    <text x="430" y="66" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#1d4ed8"><tspan x="430" dy="0">BLE advertisement</tspan><tspan x="430" dy="26">(rotating key)</tspan></text>
    <rect x="40" y="438" width="640" height="143" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="468" r="18" fill="#2563eb"/><text x="66" y="474" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="94" y="474" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">A participating iPhone hears it</text><text x="56" y="510" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Any nearby Apple device in the Find My network that</tspan><tspan x="56" dy="27">is in range may pick it up. Reception is not</tspan><tspan x="56" dy="27">guaranteed.</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <path d="M600,200 L230,200" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 10"/>
    <circle cx="415" cy="200" r="24" fill="#ffffff" stroke="#475569" stroke-width="4"/><path d="M404,189 L426,211 M426,189 L404,211" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <text x="415" y="270" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#475569">no pairing · no handshake · no reply</text>
    <rect x="40" y="593" width="640" height="116" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="66" cy="623" r="18" fill="#334155"/><text x="66" y="629" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="94" y="629" text-anchor="start" style="font-size:26px;font-weight:800;fill:#334155">Not a connection</text><text x="56" y="665" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">The tag never learns who heard it. The finder’s phone</tspan><tspan x="56" dy="27">sees only a random-looking key.</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="721" width="640" height="143" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="66" cy="751" r="18" fill="#16a34a"/><text x="66" y="757" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="94" y="757" text-anchor="start" style="font-size:26px;font-weight:800;fill:#16a34a">An observation</text><text x="56" y="793" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">The finder does nothing and is not asked. The phone</tspan><tspan x="56" dy="27">handles it in the background; neither the owner nor</tspan><tspan x="56" dy="27">the tag connects to it.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1156" x2="680" y2="1156" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1186" class="note">Radio arcs illustrative.</text>
    <path d="M40,1222 L74,1222" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="86" y="1227" class="s">Radio signal or wave</text>
  </g>
</svg>
