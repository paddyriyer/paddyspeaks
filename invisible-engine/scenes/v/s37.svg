<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1564" width="720" height="1564" font-family="Inter, Arial, sans-serif">
  <title>Scene 37: How the owner gets the answer</title>
  <desc>Five frames. The owner opens Find My on a device signed in to their Apple Account; that device regenerates the public keys its tag would have used and their lookup hashes; it asks the relay for reports filed under those hashes and downloads the encrypted reports; it decrypts them locally with the matching private keys and shows an estimated location with a time; and a contrast: sightings arrive as separate, delayed points, not a continuous live track.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1564"/>
  <text x="40" y="50" class="k">SCENE 37</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">How the owner gets the</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">answer</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">The owner’s own device does the decrypting. What</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">it shows is a last-seen point, not a live feed.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="0" width="400" height="380" rx="18" class="bound"/>
    <text x="60" y="36" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Owner’s device</text>
    <rect x="65" y="63" width="170" height="300" rx="29" fill="#0f172a" opacity="0.14"/><rect x="60" y="56" width="170" height="300" rx="29" fill="#111827"/><rect x="70" y="66" width="150" height="280" rx="23" fill="#f8fafc"/><rect x="121" y="73" width="48" height="12" rx="6" fill="#111827"/>
    <text x="145" y="112" text-anchor="middle" style="font-size:22px;font-weight:800;fill:#14213d">Find My</text>
    <path d="M503,158 a46,46 0 0 1 5,-79 a60,60 0 0 1 116,-15 a42,42 0 0 1 9,94 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
    <text x="568" y="132" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#14213d">Apple Account</text>
    <path d="M232,110 L456,110" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="274" y="42" width="136" height="58" rx="6" class="lab"/>
    <text x="342" y="64" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#4b5563"><tspan x="342" dy="0">signed in,</tspan><tspan x="342" dy="26">two-factor</tspan></text>
    <rect x="40" y="640" width="640" height="116" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="66" cy="670" r="18" fill="#334155"/><text x="66" y="676" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="94" y="676" text-anchor="start" style="font-size:26px;font-weight:800;fill:#334155">Open Find My</text><text x="56" y="712" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">On a device signed in to the owner’s</tspan><tspan x="56" dy="27">Apple Account.</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="246" y="140" width="184" height="170" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="338" y="172" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#166534">regenerate keys</text>
    <text x="338" y="204" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:400;fill:#334155">P₁₇, P₁₈ … P₂₄</text>
    <text x="338" y="248" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#166534">hash each one</text>
    <text x="338" y="280" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:400;fill:#334155">SHA-256(Pᵢ)</text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="40" y="500" width="640" height="120" rx="18" class="bound"/>
    <text x="62" y="538" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Find My relay (Apple)</text>
    <rect x="590" y="514" width="72" height="25" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="601" cy="527" r="3" fill="#22c55e"/><rect x="614" y="524" width="38" height="6" rx="3" fill="#94a3b8"/><rect x="590" y="544" width="72" height="25" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="601" cy="557" r="3" fill="#22c55e"/><rect x="614" y="554" width="38" height="6" rx="3" fill="#94a3b8"/><rect x="590" y="574" width="72" height="25" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="601" cy="587" r="3" fill="#22c55e"/><rect x="614" y="584" width="38" height="6" rx="3" fill="#94a3b8"/>
    <text x="62" y="574" text-anchor="start" style="font-size:21px;font-weight:600;fill:#334155">reports filed</text><text x="62" y="601" text-anchor="start" style="font-size:21px;font-weight:600;fill:#334155">under hashes</text>
    <path d="M290,384 L290,494" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="77" y="410" width="182" height="58" rx="6" class="lab"/>
    <text x="168" y="432" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#15803d"><tspan x="168" dy="0">request: these</tspan><tspan x="168" dy="26">lookup hashes</tspan></text>
    <path d="M390,494 L390,384" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="416" y="410" width="229" height="58" rx="6" class="lab"/>
    <text x="530" y="432" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#7e22ce"><tspan x="530" dy="0">matching encrypted</tspan><tspan x="530" dy="26">reports</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="78" y="122" width="134" height="100" rx="10" fill="#ecfdf5" stroke="#94a3b8" stroke-width="2"/><path d="M78,157 L212,177 M118,122 L138,222 M172,122 L161,222" stroke="#ffffff" stroke-width="9"/><path d="M78,157 L212,177 M118,122 L138,222 M172,122 L161,222" stroke="#cbd5e1" stroke-width="1.5"/><rect x="85" y="184" width="24" height="25" rx="4" fill="#bbf7d0"/>
    <path d="M145,200 C130,178 130,160 145,158 C160,160 160,178 145,200 Z" fill="#2563eb"/><circle cx="145" cy="171" r="5" fill="#ffffff"/>
    <text x="145" y="252" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#14213d"><tspan x="145" dy="0">near</tspan><tspan x="145" dy="26">Platform 3</tspan></text>
    <text x="145" y="306" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#475569"><tspan x="145" dy="0">seen 14</tspan><tspan x="145" dy="26">min ago</tspan></text>
    <rect x="40" y="768" width="640" height="116" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="66" cy="798" r="18" fill="#7c3aed"/><text x="66" y="804" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="94" y="804" text-anchor="start" style="font-size:26px;font-weight:800;fill:#7c3aed">Decrypted on the device</text><text x="56" y="840" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Only the owner’s devices hold the private keys dᵢ.</tspan><tspan x="56" dy="27">The result: a place and a time.</tspan></text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="896" width="640" height="222" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="82" cy="940" r="26" fill="#b45309"/><text x="82" y="949" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text><text x="122" y="950" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">A sighting, not live tracking</text>
    <path d="M64,990 L656,990" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="89" cy="990" r="9" fill="#2563eb"/>
    <circle cx="146" cy="990" r="9" fill="#2563eb"/>
    <circle cx="303" cy="990" r="9" fill="#2563eb"/>
    <circle cx="347" cy="990" r="9" fill="#2563eb"/>
    <circle cx="580" cy="990" r="9" fill="#2563eb"/>
    <text x="656" y="1026" text-anchor="end" style="font-style:italic;font-size:20px;font-weight:400;fill:#475569">times illustrative</text>
    <text x="64" y="1066" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="64" dy="0">Points arrive when phones pass by, with delays</tspan><tspan x="64" dy="27">and gaps.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1396" x2="680" y2="1396" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M40,1427 L74,1427" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="86" y="1432" class="s">Plaintext / local information</text>
    <path d="M40,1461 L74,1461" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="86" y="1466" class="s">Encrypted / cryptographic</text>
    <path d="M40,1495 L74,1495" class="a-admin" marker-end="url(#m-admin)"/>
    <text x="86" y="1500" class="s">Registration / authorisation (not data)</text>
    <rect x="40" y="1520" width="34" height="18" rx="3" class="bound" style="stroke-width:4"/>
    <text x="86" y="1534" class="s">Trust or hardware boundary</text>
  </g>
</svg>
