th="29" height="18" rx="4" fill="#22c55e" stroke="#111827" stroke-width="0.8"/><text x="119.5" y="294.5" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#0c4a6e">Tap to pay</text>
    <text x="256" y="316" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#14213d"><tspan x="256" dy="0">Terminal</tspan><tspan x="256" dy="27">(merchant)</tspan></text>
    <rect x="40" y="485" width="282" height="130" rx="16" class="bound"/>
    <path d="M56,527.5 L107.0,502 L158.0,527.5 Z" fill="#475569"/><rect x="66" y="534" width="12" height="46" fill="#475569"/><rect x="89" y="534" width="12" height="46" fill="#475569"/><rect x="112" y="534" width="12" height="46" fill="#475569"/><rect x="135" y="534" width="12" height="46" fill="#475569"/><rect x="56" y="582" width="102" height="10" fill="#475569"/>
    <text x="244" y="532" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#14213d"><tspan x="244" dy="0">Acquirer</tspan><tspan x="244" dy="27">(merchant’s</tspan><tspan x="244" dy="27">bank)</tspan></text>
    <rect x="40" y="645" width="282" height="120" rx="16" class="bound"/>
