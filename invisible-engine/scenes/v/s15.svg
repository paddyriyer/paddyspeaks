  <rect class="bg" width="720" height="1575"/>
  <text x="40" y="50" class="k">SCENE 15</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The cryptogram: a fresh</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">proof for every payment</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">The card proves it holds a key without ever</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">revealing it. The issuer checks.</text>
  <g transform="translate(0,262)">
    <rect x="40" y="0" width="282" height="150" rx="16" class="bound"/>
    <rect x="56" y="24" width="180" height="113" rx="9" fill="#0f172a" opacity="0.12"/><rect x="52" y="18" width="180" height="113" rx="9" fill="#1e3a8a"/><path d="M52,88 Q142,69 232,97 L232,122 Q232,131 223,131 L61,131 Q52,131 52,122 Z" fill="#1d4ed8" opacity="0.55"/><path d="M196.0,53.3 q4.8,5.5 0,11.1" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M202.2,48.4 q8.3,10.4 0,20.8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><path d="M208.5,43.6 q11.8,15.2 0,30.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><rect x="70.0" y="55.422000000000004" width="27.0" height="27.216" rx="4" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M83.5,55.422000000000004 L83.5,82.638 M70.0,64.494 L80.26,64.494 M86.74,64.494 L97.0,64.494 M70.0,73.566 L80.26,73.566 M86.74,73.566 L97.0,73.566" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="80.26" y="61.40952" width="6.4799999999999995" height="15.240960000000001" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/><text x="167.2" y="45.216" text-anchor="end" style="font-size:20px;font-weight:800;fill:#e0e7ff">BANK</text><text x="66.4" y="115.524" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#ffffff">•••• 1234</text>
    <text x="272" y="84" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#14213d">Card</text>
