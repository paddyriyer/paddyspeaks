    <text x="86" y="1477" class="s">Plaintext / local information</text>
    <path d="M40,1506 L74,1506" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="86" y="1511" class="s">Encrypted / cryptographic</text>
