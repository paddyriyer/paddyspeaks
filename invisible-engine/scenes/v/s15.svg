    <text x="240" y="698" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#14213d"><tspan x="240" dy="0">Payment</tspan><tspan x="240" dy="27">network</tspan></text>
    <rect x="40" y="795" width="282" height="130" rx="16" class="bound"/>
    <path d="M56,837.5 L107.0,812 L158.0,837.5 Z" fill="#1e3a8a"/><rect x="66" y="844" width="12" height="46" fill="#1e3a8a"/><rect x="89" y="844" width="12" height="46" fill="#1e3a8a"/><rect x="112" y="844" width="12" height="46" fill="#1e3a8a"/><rect x="135" y="844" width="12" height="46" fill="#1e3a8a"/><rect x="56" y="892" width="102" height="10" fill="#1e3a8a"/>
    <text x="240" y="842" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#14213d"><tspan x="240" dy="0">Issuer</tspan><tspan x="240" dy="27">(card’s</tspan><tspan x="240" dy="27">bank)</tspan></text>
  </g>
  <g data-f="1" transform="translate(0,262)">
    <path d="M142,198 L142,156" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="394" y="196" width="286" height="146" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="420" cy="226" r="18" fill="#16a34a"/><text x="420" y="232" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="448" y="232" text-anchor="start" style="font-size:26px;font-weight:800;fill:#16a34a">Terminal data</text><text x="410" y="268" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="410" dy="0">amount · currency ·</tspan><tspan x="410" dy="27">date · unpredictable</tspan><tspan x="410" dy="27">number</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="394" y="0" width="286" height="172" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="420" cy="30" r="18" fill="#7c3aed"/><text x="420" y="36" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="448" y="36" text-anchor="start" style="font-size:26px;font-weight:800;fill:#7c3aed">Inside the card</text><text x="410" y="72" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="410" dy="0">terminal data</tspan><tspan x="410" dy="27">+ counter (ATC)</tspan><tspan x="410" dy="27">+ secret card key</tspan><tspan x="410" dy="27">→ cryptogram</tspan></text>
    <path d="M634,127 L634,119 a11,11 0 0 1 22,0 L656,127" fill="none" stroke="#7c3aed" stroke-width="4.0"/><rect x="626" y="125" width="38" height="30" rx="5" fill="#7c3aed"/><circle cx="645" cy="138" r="4" fill="#ffffff"/><rect x="644" y="140" width="3" height="8" fill="#ffffff"/>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <path d="M322,110 L352,110 L352,535 L328,535" class="a-crypto" marker-end="url(#m-crypto)"/>
    <path d="M322,595 L352,595 L352,690 L328,690" class="a-crypto" marker-end="url(#m-crypto)"/>
    <path d="M322,735 L352,735 L352,845 L328,845" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="387" y="398" width="298" height="84" rx="6" class="lab"/>
    <text x="536" y="420" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#7e22ce"><tspan x="536" dy="0">cryptogram + transaction</tspan><tspan x="536" dy="26">data → authorisation</tspan><tspan x="536" dy="26">request</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="394" y="770" width="286" height="178" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="420" cy="800" r="18" fill="#7c3aed"/><text x="420" y="806" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="448" y="806" text-anchor="start" style="font-size:26px;font-weight:800;fill:#7c3aed">Issuer checks</text><text x="410" y="842" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="410" dy="0">derives the card key</tspan><tspan x="410" dy="27">recomputes the</tspan><tspan x="410" dy="27">cryptogram; checks</tspan><tspan x="410" dy="27">counter, limits, risk</tspan></text>
    <path d="M322,900 L376,900 L376,60 L328,60" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="393" y="598" width="287" height="84" rx="6" class="lab"/>
    <text x="536" y="620" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#15803d"><tspan x="536" dy="0">approve / decline (back</tspan><tspan x="536" dy="26">via network and</tspan><tspan x="536" dy="26">acquirer)</tspan></text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="976" width="640" height="146" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="66" cy="1006" r="18" fill="#334155"/><text x="66" y="1012" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="94" y="1012" text-anchor="start" style="font-size:26px;font-weight:800;fill:#334155">Not a reusable password</text><text x="56" y="1048" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">A copied cryptogram fails the counter and</tspan><tspan x="56" dy="27">unpredictable-number checks. The merchant never learns</tspan><tspan x="56" dy="27">the card key. Card and issuer share symmetric keys.</tspan></text>
  </g>
