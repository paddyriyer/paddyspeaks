<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1378" width="720" height="1378" font-family="Inter, Arial, sans-serif">
  <title>Scene 09: Tap at checkout</title>
  <desc>Four frames. A contactless card with no battery approaches a payment terminal; the terminal’s 13.56 MHz field reaches the card and powers its chip; terminal and card exchange commands and replies; the screen shows Approved, a decision that usually comes from the card issuer over the payment network.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1378"/>
  <text x="40" y="50" class="k">SCENE 09</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Tap at checkout</text>
  <text x="40" y="153" style="font-size:23px;fill:#475569">No battery in the card: the terminal supplies the</text>
  <text x="40" y="184" style="font-size:23px;fill:#475569">power, the issuer supplies the decision.</text>
  <g data-f="1" transform="translate(0,210)">
    <rect x="44" y="6" width="300" height="189" rx="15" fill="#0f172a" opacity="0.12"/><rect x="40" y="0" width="300" height="189" rx="15" fill="#1e3a8a"/><path d="M40,117 Q190,85 340,132 L340,174 Q340,189 325,189 L55,189 Q40,189 40,174 Z" fill="#1d4ed8" opacity="0.55"/><path d="M280.0,58.8 q8.1,9.2 0,18.5" fill="none" stroke="#ffffff" stroke-width="2.727272727272727" stroke-linecap="round"/><path d="M290.4,50.7 q13.8,17.3 0,34.6" fill="none" stroke="#ffffff" stroke-width="2.727272727272727" stroke-linecap="round"/><path d="M300.8,42.7 q19.6,25.4 0,50.8" fill="none" stroke="#ffffff" stroke-width="2.727272727272727" stroke-linecap="round"/><rect x="70.0" y="62.370000000000005" width="45.0" height="45.36" rx="7" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M92.5,62.370000000000005 L92.5,107.73 M70.0,77.49000000000001 L87.1,77.49000000000001 M97.9,77.49000000000001 L115.0,77.49000000000001 M70.0,92.61 L87.1,92.61 M97.9,92.61 L115.0,92.61" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="87.1" y="72.34920000000001" width="10.799999999999999" height="25.401600000000002" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/><text x="322.0" y="37.800000000000004" text-anchor="end" style="font-size:21.000000000000004px;font-weight:800;fill:#e0e7ff">BANK</text><text x="70.0" y="158.76" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:19.5px;font-weight:600;fill:#ffffff">•••• 1234</text>
    <path d="M190,200 L190,214" stroke="#64748b" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round"/><path d="M176,214 L190,232 L204,214 Z" fill="#64748b"/>
    <rect x="452" y="48" width="234" height="378" rx="27" fill="#0f172a" opacity="0.15"/><rect x="446" y="40" width="234" height="378" rx="27" fill="#1f2937"/><rect x="451" y="45" width="223" height="367" rx="23" fill="#374151"/><rect x="468" y="63" width="191" height="135" rx="11" fill="#e0f2fe" stroke="#0f172a" stroke-width="2.7"/><path d="M550.4,103.7 q7.2,8.3 0,16.6" fill="none" stroke="#0c4a6e" stroke-width="2.8800000000000003" stroke-linecap="round"/><path d="M559.7,96.5 q12.4,15.5 0,31.0" fill="none" stroke="#0c4a6e" stroke-width="2.8800000000000003" stroke-linecap="round"/><path d="M569.0,89.2 q17.6,22.8 0,45.5" fill="none" stroke="#0c4a6e" stroke-width="2.8800000000000003" stroke-linecap="round"/><text x="563.0" y="175.0" text-anchor="middle" style="font-size:19.8px;font-weight:800;fill:#0c4a6e">Tap to pay</text><rect x="482" y="224" width="47" height="29" rx="6" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/><rect x="540" y="224" width="47" height="29" rx="6" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/><rect x="597" y="224" width="47" height="29" rx="6" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/><rect x="482" y="266" width="47" height="29" rx="6" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/><rect x="540" y="266" width="47" height="29" rx="6" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/><rect x="597" y="266" width="47" height="29" rx="6" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/><rect x="482" y="307" width="47" height="29" rx="6" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/><rect x="540" y="307" width="47" height="29" rx="6" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/><rect x="597" y="307" width="47" height="29" rx="6" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/><rect x="482" y="349" width="47" height="29" rx="6" fill="#ef4444" stroke="#111827" stroke-width="1.4"/><rect x="540" y="349" width="47" height="29" rx="6" fill="#facc15" stroke="#111827" stroke-width="1.4"/><rect x="597" y="349" width="47" height="29" rx="6" fill="#22c55e" stroke="#111827" stroke-width="1.4"/>
    <rect x="40" y="455" width="640" height="116" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="485" r="18" fill="#2563eb"/><text x="66" y="491" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="94" y="491" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">The card arrives</text><text x="56" y="527" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">No battery inside. The chip is inert</tspan><tspan x="56" dy="27">until a reader is near.</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,210)">
    <rect x="44" y="246" width="300" height="189" rx="15" fill="#0f172a" opacity="0.12"/><rect x="40" y="240" width="300" height="189" rx="15" fill="#1e3a8a"/><path d="M40,357 Q190,325 340,372 L340,414 Q340,429 325,429 L55,429 Q40,429 40,414 Z" fill="#1d4ed8" opacity="0.55"/><path d="M280.0,298.8 q8.1,9.2 0,18.5" fill="none" stroke="#ffffff" stroke-width="2.727272727272727" stroke-linecap="round"/><path d="M290.4,290.7 q13.8,17.3 0,34.6" fill="none" stroke="#ffffff" stroke-width="2.727272727272727" stroke-linecap="round"/><path d="M300.8,282.7 q19.6,25.4 0,50.8" fill="none" stroke="#ffffff" stroke-width="2.727272727272727" stroke-linecap="round"/><rect x="70.0" y="302.37" width="45.0" height="45.36" rx="7" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M92.5,302.37 L92.5,347.73 M70.0,317.49 L87.1,317.49 M97.9,317.49 L115.0,317.49 M70.0,332.61 L87.1,332.61 M97.9,332.61 L115.0,332.61" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="87.1" y="312.3492" width="10.799999999999999" height="25.401600000000002" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/><text x="322.0" y="277.8" text-anchor="end" style="font-size:21.000000000000004px;font-weight:800;fill:#e0e7ff">BANK</text><text x="70.0" y="398.76" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:19.5px;font-weight:600;fill:#ffffff">•••• 1234</text>
    <path d="M432,375 A40,40 0 0 1 432,305" class="field"/>
    <path d="M421,394 A62,62 0 0 1 421,286" class="field"/>
    <path d="M410,413 A84,84 0 0 1 410,267" class="field"/>
    <path d="M436,384 L346,384" class="a-energy" marker-end="url(#m-energy)"/>
    <circle cx="391" cy="416" r="16" fill="#ea580c"/><text x="391" y="422" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#ffffff">2</text>
    <rect x="40" y="583" width="640" height="116" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="66" cy="613" r="18" fill="#ea580c"/><text x="66" y="619" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="94" y="619" text-anchor="start" style="font-size:26px;font-weight:800;fill:#ea580c">The field powers the chip</text><text x="56" y="655" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">The terminal’s 13.56 MHz magnetic field induces</tspan><tspan x="56" dy="27">power in the card’s coil.</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,210)">
    <path d="M346,300 L436,300" class="a-signal" marker-end="url(#m-signal)" marker-start="url(#ms-signal)"/>
    <circle cx="391" cy="266" r="16" fill="#2563eb"/><text x="391" y="272" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#ffffff">3</text>
    <rect x="40" y="711" width="640" height="116" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="741" r="18" fill="#2563eb"/><text x="66" y="747" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="94" y="747" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">Commands ⇄ replies</text><text x="56" y="783" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Only while the card sits in the field —</tspan><tspan x="56" dy="27">a few centimetres.</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,210)">
    <rect x="468" y="63" width="190" height="136" rx="11" fill="#dcfce7" stroke="#0f172a" stroke-width="3"/><circle cx="563" cy="108" r="24" fill="#16a34a"/><path d="M551,109 L560,118 L577,99" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="563" y="172" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#166534">Approved</text>
    <rect x="40" y="839" width="640" height="143" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="66" cy="869" r="18" fill="#16a34a"/><text x="66" y="875" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="94" y="875" text-anchor="start" style="font-size:26px;font-weight:800;fill:#16a34a">Who said yes?</text><text x="56" y="911" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Usually the card’s issuer, reached over the</tspan><tspan x="56" dy="27">payment network (Scene 15) — not the card</tspan><tspan x="56" dy="27">or the terminal alone.</tspan></text>
    <text x="40" y="1016" class="note" text-anchor="start"><tspan x="40" dy="0">Field rings are an illustrative visualisation,</tspan><tspan x="40" dy="27">not literal visible waves.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1277" x2="680" y2="1277" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1307" class="note">Schematic. Fictional card.</text>
    <path d="M40,1343 L74,1343" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="86" y="1348" class="s">Energy / power</text>
    <path d="M258.4,1343 L292.4,1343" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="304.4" y="1348" class="s">Radio signal or wave</text>
  </g>
</svg>
