<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1588" width="720" height="1588" font-family="Inter, Arial, sans-serif">
  <title>Scene 49: Same tag, two stories: a lost bag, or a person being followed</title>
  <desc>Five frames. 1, a lost bag: the owner sees their own bag on a map; this is the purpose of the network. 2, the same tag hidden in another person’s bag: the person carrying it is located and told nothing; the owner’s map now shows a person. 3, encryption cannot tell the stories apart: it protects the owner’s view in both. 4, protective alerts: a phone can warn the person a separated tag travels with, iPhone and Android alike through a shared specification, and a separated tag plays a sound when moved; alerts take time and need a compatible phone. 5, a safety note: disabling a tracker can alert the person who placed it; think about safety first and get support.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1588"/>
  <text x="40" y="50" class="k">SCENE 49</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Same tag, two stories: a</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">lost bag, or a person</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">being followed</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">The mechanism that finds keys can also locate a</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">person. Encryption cannot tell which.</text>
  <g data-f="1" transform="translate(0,314)">
    <rect x="40" y="0" width="640" height="310" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <circle cx="74" cy="34" r="20" fill="#16a34a"/><text x="74" y="41" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">1</text><text x="104" y="42" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">A lost bag</text>
    <path d="M111,92 L111,68 L147,68 L147,92" fill="none" stroke="#334155" stroke-width="3.6"/><rect x="89" y="99" width="90" height="114" rx="11" fill="#0f172a" opacity="0.13"/><rect x="84" y="92" width="90" height="114" rx="11" fill="#0e7490"/><path d="M111,100 L111,198" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3.0"/><path d="M129,100 L129,198" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3.0"/><path d="M147,100 L147,198" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3.0"/><circle cx="102" cy="213" r="7" fill="#334155"/><circle cx="156" cy="213" r="7" fill="#334155"/>
    <circle cx="181" cy="155" r="20" fill="#0f172a" opacity="0.13"/><circle cx="178" cy="150" r="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="178" cy="150" r="12" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="485" y="67" width="110" height="180" rx="19" fill="#0f172a" opacity="0.14"/><rect x="480" y="60" width="110" height="180" rx="19" fill="#111827"/><rect x="487" y="67" width="97" height="167" rx="15" fill="#ecfdf5"/><rect x="520" y="71" width="31" height="8" rx="4" fill="#111827"/>
    <path d="M535,168 C515,138 515,114 535,112 C555,114 555,138 535,168 Z" fill="#16a34a"/><circle cx="535" cy="130" r="7" fill="#ffffff"/>
    <text x="535" y="202" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#166534">my bag</text>
    <text x="60" y="270" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="60" dy="0">The owner finds their own bag. This is the network’s</tspan><tspan x="60" dy="27">purpose.</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,314)">
    <rect x="40" y="320" width="640" height="310" rx="18" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <circle cx="74" cy="354" r="20" fill="#dc2626"/><text x="74" y="361" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">2</text><text x="104" y="362" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">A tag hidden in someone’s bag</text>
    <circle cx="130" cy="403" r="19" fill="#64748b"/><path d="M103,493 L103,446 Q103,428 122,428 L138,428 Q157,428 157,446 L157,493 Z" fill="#64748b"/><rect x="110" y="487" width="16" height="69" rx="6" fill="#64748b"/><rect x="135" y="487" width="16" height="69" rx="6" fill="#64748b"/>
    <path d="M191,452 L191,435 L216,435 L216,452" fill="none" stroke="#334155" stroke-width="2.5"/><rect x="177" y="459" width="63" height="80" rx="8" fill="#0f172a" opacity="0.13"/><rect x="172" y="452" width="63" height="80" rx="8" fill="#475569"/><path d="M191,458 L191,526" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.1"/><path d="M204,458 L204,526" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.1"/><path d="M216,458 L216,526" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.1"/><circle cx="185" cy="537" r="5" fill="#334155"/><circle cx="222" cy="537" r="5" fill="#334155"/>
    <rect x="182" y="470" width="44" height="42" rx="8" class="hz"/>
    <circle cx="207" cy="496" r="13" fill="#0f172a" opacity="0.13"/><circle cx="204" cy="491" r="13" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="204" cy="491" r="8" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="479" y="387" width="122" height="180" rx="21" fill="#0f172a" opacity="0.14"/><rect x="474" y="380" width="122" height="180" rx="21" fill="#111827"/><rect x="481" y="387" width="107" height="165" rx="16" fill="#fef2f2"/><rect x="518" y="392" width="34" height="9" rx="4" fill="#111827"/>
    <path d="M535,488 C515,458 515,434 535,432 C555,434 555,458 535,488 Z" fill="#dc2626"/><circle cx="535" cy="450" r="7" fill="#ffffff"/>
    <text x="535" y="522" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#991b1b">a person</text>
    <text x="60" y="600" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">The person carrying it is located and was never asked.</text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <path d="M621,26 L621,16 a11,11 0 0 1 22,0 L643,26" fill="none" stroke="#7c3aed" stroke-width="4.2"/><rect x="614" y="26" width="36" height="29" rx="5" fill="#7c3aed"/><circle cx="632" cy="38" r="4" fill="#ffffff"/><rect x="630" y="39" width="3" height="8" fill="#ffffff"/><path d="M621,346 L621,336 a11,11 0 0 1 22,0 L643,346" fill="none" stroke="#7c3aed" stroke-width="4.2"/><rect x="614" y="346" width="36" height="29" rx="5" fill="#7c3aed"/><circle cx="632" cy="358" r="4" fill="#ffffff"/><rect x="630" y="359" width="3" height="8" fill="#ffffff"/>
    <rect x="40" y="640" width="640" height="138" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="66" cy="670" r="18" fill="#7c3aed"/><text x="66" y="676" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="94" y="676" text-anchor="start" style="font-size:24px;font-weight:800;fill:#7c3aed">Encryption cannot tell the stories apart</text><text x="56" y="710" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">It keeps the relay and strangers out — and protects</tspan><tspan x="56" dy="27">an abusive owner’s view exactly as well as a</tspan><tspan x="56" dy="27">rightful owner’s.</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,314)">
    <rect x="40" y="788" width="640" height="192" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="818" r="18" fill="#2563eb"/><text x="66" y="824" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="94" y="824" text-anchor="start" style="font-size:24px;font-weight:800;fill:#2563eb">Protective alerts — and their limits</text><text x="56" y="858" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">A phone can warn the person a separated tag travels with</tspan><tspan x="56" dy="27">(iPhone and Android, via one shared specification); a</tspan><tspan x="56" dy="27">separated tag sounds when moved. Alerts take time, need</tspan><tspan x="56" dy="27">separation from the owner and a compatible phone</tspan><tspan x="56" dy="27">(Scene 52).</tspan></text>
  </g>
  <g data-f="5" transform="translate(0,314)">
    <rect x="40" y="990" width="640" height="165" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="66" cy="1020" r="18" fill="#b45309"/><text x="66" y="1026" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="94" y="1026" text-anchor="start" style="font-size:24px;font-weight:800;fill:#b45309">If you find a tracker: safety first</text><text x="56" y="1060" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Disabling it can alert the person who placed it, and</tspan><tspan x="56" dy="27">stops their location updates. Think about your safety</tspan><tspan x="56" dy="27">first, and consider contacting police or a support</tspan><tspan x="56" dy="27">service before acting (Module 7).</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1487" x2="680" y2="1487" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1517" class="note">Defensive framing only. No placement or evasion detail.</text>
    <rect x="40" y="1544" width="34" height="18" rx="3" class="hz" style="stroke-width:3"/>
    <text x="86" y="1558" class="s">Attacker zone / hazard</text>
  </g>
</svg>
