<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1597" width="720" height="1597" font-family="Inter, Arial, sans-serif">
  <title>Scene 30: Three “trackers” that work in completely different ways</title>
  <desc>Four frames in three columns and a comparison. A small item tracker of the AirTag class does not know where it is: it whispers over Bluetooth, a stranger’s phone nearby adds its own location and sends an encrypted report to a service the owner can query; a Bluetooth beacon fixed to a wall broadcasts the same identifier so apps on nearby phones can react, with no network of its own; a GPS tracker computes its own coordinates from satellite signals and reports them over a cellular network to a service; and a table comparing whether each knows where it is, how a location reaches anyone, its power and where it works.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1597"/>
  <text x="40" y="50" class="k">SCENE 30</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Three “trackers” that</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">work in completely</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">different ways</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">Same word, three different machines. Only one of</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">them knows where it is.</text>
  <g data-f="1" transform="translate(0,314)">
    <rect x="40" y="0" width="640" height="250" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="82" cy="44" r="26" fill="#2563eb"/><text x="82" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="122" y="54" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Item tracker (AirTag-class)</text>
    <circle cx="103" cy="119" r="32" fill="#0f172a" opacity="0.13"/><circle cx="100" cy="114" r="32" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="100" cy="114" r="20" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="201" y="75" width="50" height="92" rx="8" fill="#0f172a" opacity="0.14"/><rect x="196" y="68" width="50" height="92" rx="8" fill="#111827"/><rect x="199" y="71" width="44" height="86" rx="7" fill="#eff6ff"/><rect x="214" y="73" width="14" height="4" rx="2" fill="#111827"/>
    <path d="M136,114 L188,114" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M353,148 a30,30 0 0 1 3,-51 a39,39 0 0 1 75,-10 a27,27 0 0 1 6,61 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M256,104 L330,104" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="571" y="75" width="50" height="92" rx="8" fill="#0f172a" opacity="0.14"/><rect x="566" y="68" width="50" height="92" rx="8" fill="#111827"/><rect x="569" y="71" width="44" height="86" rx="7" fill="#f5f3ff"/><rect x="584" y="73" width="14" height="4" rx="2" fill="#111827"/>
    <path d="M484,104 L558,104" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="64" y="190" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="64" dy="0">whisper → a stranger’s phone adds its own location →</tspan><tspan x="64" dy="26">encrypted report → only the owner can read it (Module 5)</tspan></text>
    <text x="64" y="238" text-anchor="start" style="font-size:21px;font-weight:800;fill:#1e3a8a">Knows where it is? No.</text>
  </g>
  <g data-f="2" transform="translate(0,314)">
    <rect x="40" y="260" width="640" height="250" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="82" cy="304" r="26" fill="#0d9488"/><text x="82" y="313" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="122" y="314" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">BLE beacon</text>
    <rect x="76" y="342" width="20" height="90" fill="#d6d3d1"/>
    <rect x="108" y="348" width="110" height="70" rx="20" fill="#0f172a" opacity="0.13"/><rect x="104" y="342" width="110" height="70" rx="20" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><circle cx="132" cy="377" r="9" fill="#2563eb"/><text x="174" y="384" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#334155">BLE</text>
    <path d="M229,364 q9,13 0,25" fill="none" stroke="#1d4ed8" stroke-width="3.6" stroke-linecap="round" opacity="1.00"/><path d="M241,354 q14,23 0,47" fill="none" stroke="#1d4ed8" stroke-width="3.6" stroke-linecap="round" opacity="0.80"/><path d="M254,343 q20,34 0,68" fill="none" stroke="#1d4ed8" stroke-width="3.6" stroke-linecap="round" opacity="0.60"/>
    <rect x="405" y="335" width="50" height="92" rx="8" fill="#0f172a" opacity="0.14"/><rect x="400" y="328" width="50" height="92" rx="8" fill="#111827"/><rect x="403" y="331" width="44" height="86" rx="7" fill="#f0fdfa"/><rect x="418" y="333" width="14" height="4" rx="2" fill="#111827"/>
    <path d="M296,377 L392,377" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="64" y="450" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="64" dy="0">fixed ID on a wall → an app on a nearby phone reacts</tspan><tspan x="64" dy="26">(“you are at the exhibit”). No network of its own.</tspan></text>
    <text x="64" y="498" text-anchor="start" style="font-size:21px;font-weight:800;fill:#0f766e">Knows where it is? Only where it was fixed.</text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <rect x="40" y="520" width="640" height="320" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="82" cy="564" r="26" fill="#b45309"/><text x="82" y="573" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="122" y="574" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">GPS + cellular tracker</text>
    <rect x="320" y="595" width="20" height="14" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="289" y="596" width="28" height="11" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><rect x="343" y="596" width="28" height="11" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
    <rect x="320" y="643" width="20" height="14" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="289" y="644" width="28" height="11" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><rect x="343" y="644" width="28" height="11" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
    <rect x="68" y="622" width="160" height="100" rx="16" fill="#0f172a" opacity="0.13"/><rect x="64" y="616" width="160" height="100" rx="16" fill="#334155"/><rect x="184" y="586" width="12" height="34" rx="4" fill="#334155"/><rect x="78" y="632" width="76" height="34" rx="5" fill="#0ea5e9"/><text x="116" y="656" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#ffffff">GPS</text><circle cx="194" cy="686" r="7" fill="#22c55e"/>
    <path d="M280,604 L236,626" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M280,652 L236,654" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M500,604 L481,697 M500,604 L519,697 M491,650 L509,650 M486,672 L514,672" stroke="#334155" stroke-width="2.5" fill="none"/><circle cx="500" cy="604" r="4" fill="#334155"/>
    <path d="M234,686 L474,686" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M574,688 a24,24 0 0 1 2,-41 a31,31 0 0 1 60,-8 a22,22 0 0 1 5,49 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M514,650 L556,650" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="64" y="754" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="64" dy="0">computes its own coordinates (GNSS), sends them over</tspan><tspan x="64" dy="26">cellular to a service. Bigger battery; usually a</tspan><tspan x="64" dy="26">subscription.</tspan></text>
    <text x="64" y="828" text-anchor="start" style="font-size:21px;font-weight:800;fill:#92400e">Knows where it is? Yes.</text>
  </g>
  <g data-f="4" transform="translate(0,314)">
    <rect x="40" y="852" width="166" height="46" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="50" y="882.0" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d"></text>
    <rect x="206" y="852" width="158" height="46" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="216" y="882.0" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">Item tracker</text>
    <rect x="364" y="852" width="158" height="46" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="374" y="882.0" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">BLE beacon</text>
    <rect x="522" y="852" width="158" height="46" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="532" y="882.0" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">GPS tracker</text>
    <rect x="40" y="898" width="166" height="80" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="50" y="932.0" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d"><tspan x="50" dy="0">Knows its</tspan><tspan x="50" dy="26">location</tspan></text>
    <rect x="206" y="898" width="158" height="80" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="216" y="945.0" text-anchor="start" style="font-size:20px;font-weight:400;fill:#14213d">no</text>
    <rect x="364" y="898" width="158" height="80" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="374" y="932.0" text-anchor="start" style="font-size:20px;font-weight:400;fill:#14213d"><tspan x="374" dy="0">no (fixed</tspan><tspan x="374" dy="26">place)</tspan></text>
    <rect x="522" y="898" width="158" height="80" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="532" y="945.0" text-anchor="start" style="font-size:20px;font-weight:400;fill:#14213d">yes</text>
    <rect x="40" y="978" width="166" height="105" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="50" y="1011.5" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d"><tspan x="50" dy="0">Location</tspan><tspan x="50" dy="26">reaches</tspan><tspan x="50" dy="26">someone via</tspan></text>
    <rect x="206" y="978" width="158" height="105" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="216" y="1024.5" text-anchor="start" style="font-size:20px;font-weight:400;fill:#14213d"><tspan x="216" dy="0">strangers’</tspan><tspan x="216" dy="26">phones</tspan></text>
    <rect x="364" y="978" width="158" height="105" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="374" y="1024.5" text-anchor="start" style="font-size:20px;font-weight:400;fill:#14213d"><tspan x="374" dy="0">the nearby</tspan><tspan x="374" dy="26">app</tspan></text>
    <rect x="522" y="978" width="158" height="105" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="532" y="1024.5" text-anchor="start" style="font-size:20px;font-weight:400;fill:#14213d"><tspan x="532" dy="0">its own</tspan><tspan x="532" dy="26">cellular link</tspan></text>
    <rect x="40" y="1083" width="166" height="80" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="50" y="1117.0" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d"><tspan x="50" dy="0">Power</tspan><tspan x="50" dy="26">(typical)</tspan></text>
    <rect x="206" y="1083" width="158" height="80" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="216" y="1117.0" text-anchor="start" style="font-size:20px;font-weight:400;fill:#14213d"><tspan x="216" dy="0">coin cell, a</tspan><tspan x="216" dy="26">year or more</tspan></text>
    <rect x="364" y="1083" width="158" height="80" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="374" y="1117.0" text-anchor="start" style="font-size:20px;font-weight:400;fill:#14213d"><tspan x="374" dy="0">coin cell or</tspan><tspan x="374" dy="26">mains</tspan></text>
    <rect x="522" y="1083" width="158" height="80" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="532" y="1117.0" text-anchor="start" style="font-size:20px;font-weight:400;fill:#14213d"><tspan x="532" dy="0">rechargeable,</tspan><tspan x="532" dy="26">days–weeks</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1496" x2="680" y2="1496" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1526" class="note">Generic devices. Radio arcs illustrative.</text>
    <path d="M40,1562 L74,1562" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="86" y="1567" class="s">Radio signal or wave</text>
    <path d="M322.0,1562 L356.0,1562" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="368.0" y="1567" class="s">Encrypted / cryptographic</text>
  </g>
</svg>
