<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1543" width="720" height="1543" font-family="Inter, Arial, sans-serif">
  <title>Scene 81: A risk register with its reasons showing</title>
  <desc>Three frames, each adding one worked row of a risk register as a card with eleven fields: threat, actor, preconditions, impact, likelihood basis, controls, detection, incident owner, residual risk, evidence confidence and privacy or legal review. 1, a company tag on a laptop registered to a personal account, so a leaver keeps location access; owner IT asset management; residual risk low once re-registered. 2, an unknown tracker found in an executive’s bag; owner executive protection with HR and legal; safety-first playbook; residual risk stated plainly because alerts can miss or be late. 3, a cloned static-ID badge used to open a door; owner physical security; move to challenge-response credentials; relay remains possible in principle. Likelihood is given as its basis in words, not as a number.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1543"/>
  <text x="40" y="50" class="k">SCENE 81</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">A risk register with its</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">reasons showing</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Each field answers a question someone will ask</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">later. Likelihood is a reason, not a number.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="0" width="640" height="367" rx="14" fill="#ffffff" stroke="#5eead4" stroke-width="2.5"/>
    <path d="M40,48 L40,14 Q40,0 54,0 L666,0 Q680,0 680,14 L680,48 Z" fill="#f0fdfa"/>
    <circle cx="66" cy="25" r="16" fill="#0d9488"/><text x="66" y="31" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#ffffff">1</text><text x="92" y="33" text-anchor="start" style="font-size:22px;font-weight:800;fill:#0d9488">Company tag on a laptop</text>
    <text x="56" y="76" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#0d9488">Threat </tspan><tspan dx="3">tag on a personal account; leaver keeps access</tspan></text><text x="56" y="101" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#0d9488">Actor </tspan><tspan dx="3">a departing employee — no malice needed</tspan></text><text x="56" y="126" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#0d9488">Preconditions </tspan><tspan dx="3">tags bought ad hoc; no offboarding step</tspan></text><text x="56" y="151" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#0d9488">Impact </tspan><tspan dx="3">laptop location visible outside the company</tspan></text><text x="56" y="176" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#0d9488">Likelihood basis </tspan><tspan dx="3">common where tags are bought ad hoc</tspan></text><text x="56" y="201" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#0d9488">Controls </tspan><tspan dx="3">register to a managed account; offboarding</tspan></text><text x="56" y="226" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#0d9488">Detection </tspan><tspan dx="3">quarterly review of who shares company tags</tspan></text><text x="56" y="251" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#0d9488">Incident owner </tspan><tspan dx="3">IT asset management</tspan></text><text x="56" y="276" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#0d9488">Residual risk </tspan><tspan dx="3">low once re-registered</tspan></text><text x="56" y="301" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#0d9488">Evidence confidence </tspan><tspan dx="3">vendor-documented: one account per tag</tspan></text><text x="56" y="326" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#0d9488">Privacy / legal review </tspan><tspan dx="3">tags locate assets, never people —</tspan></text><text x="72" y="350" text-anchor="start" style="font-size:20px;font-weight:400;fill:#1f2937">in policy</text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="40" y="377" width="640" height="415" rx="14" fill="#ffffff" stroke="#fca5a5" stroke-width="2.5"/>
    <path d="M40,425 L40,391 Q40,377 54,377 L666,377 Q680,377 680,391 L680,425 Z" fill="#fef2f2"/>
    <circle cx="66" cy="402" r="16" fill="#dc2626"/><text x="66" y="408" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#ffffff">2</text><text x="92" y="410" text-anchor="start" style="font-size:22px;font-weight:800;fill:#dc2626">Unknown tracker, executive’s bag</text>
    <text x="56" y="453" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#dc2626">Threat </tspan><tspan dx="3">someone learns the executive’s routine</tspan></text><text x="56" y="478" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#dc2626">Actor </tspan><tspan dx="3">unknown; insider or stranger</tspan></text><text x="56" y="503" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#dc2626">Preconditions </tspan><tspan dx="3">access to the bag; alerts need time and a</tspan></text><text x="72" y="527" text-anchor="start" style="font-size:20px;font-weight:400;fill:#1f2937">phone</text><text x="56" y="552" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#dc2626">Impact </tspan><tspan dx="3">the person’s safety first; company exposure</tspan></text><text x="56" y="577" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#dc2626">Likelihood basis </tspan><tspan dx="3">documented cases elsewhere; no local data</tspan></text><text x="56" y="602" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#dc2626">Controls </tspan><tspan dx="3">safety-first playbook; travel briefings</tspan></text><text x="56" y="627" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#dc2626">Detection </tspan><tspan dx="3">the person’s own phone alert; offered checks</tspan></text><text x="56" y="652" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#dc2626">Incident owner </tspan><tspan dx="3">executive protection with HR and legal</tspan></text><text x="56" y="677" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#dc2626">Residual risk </tspan><tspan dx="3">alerts can miss or be late — said plainly</tspan></text><text x="56" y="702" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#dc2626">Evidence confidence </tspan><tspan dx="3">platform-documented alerts and their</tspan></text><text x="72" y="726" text-anchor="start" style="font-size:20px;font-weight:400;fill:#1f2937">limits</text><text x="56" y="751" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#dc2626">Privacy / legal review </tspan><tspan dx="3">person’s consent first; legal</tspan></text><text x="72" y="775" text-anchor="start" style="font-size:20px;font-weight:400;fill:#1f2937">before police</text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="40" y="802" width="640" height="367" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2.5"/>
    <path d="M40,850 L40,816 Q40,802 54,802 L666,802 Q680,802 680,816 L680,850 Z" fill="#eff6ff"/>
    <circle cx="66" cy="827" r="16" fill="#2563eb"/><text x="66" y="833" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#ffffff">3</text><text x="92" y="835" text-anchor="start" style="font-size:22px;font-weight:800;fill:#2563eb">Cloned static-ID badge</text>
    <text x="56" y="878" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#2563eb">Threat </tspan><tspan dx="3">a door opened with a copied card number</tspan></text><text x="56" y="903" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#2563eb">Actor </tspan><tspan dx="3">anyone briefly near the badge with a reader</tspan></text><text x="56" y="928" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#2563eb">Preconditions </tspan><tspan dx="3">125 kHz static-ID cards still in use</tspan></text><text x="56" y="953" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#2563eb">Impact </tspan><tspan dx="3">unauthorised entry; log names the wrong person</tspan></text><text x="56" y="978" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#2563eb">Likelihood basis </tspan><tspan dx="3">widely documented weakness (Scene 21)</tspan></text><text x="56" y="1003" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#2563eb">Controls </tspan><tspan dx="3">challenge-response credentials; PIN at key doors</tspan></text><text x="56" y="1028" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#2563eb">Detection </tspan><tspan dx="3">review of door events that cannot both be true</tspan></text><text x="56" y="1053" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#2563eb">Incident owner </tspan><tspan dx="3">physical security</tspan></text><text x="56" y="1078" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#2563eb">Residual risk </tspan><tspan dx="3">relay still possible in principle</tspan></text><text x="56" y="1103" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#2563eb">Evidence confidence </tspan><tspan dx="3">documented, long-standing</tspan></text><text x="56" y="1128" style="font-size:20px;fill:#1f2937"><tspan style="font-weight:800;fill:#2563eb">Privacy / legal review </tspan><tspan dx="3">door logs are personal data — keep</tspan></text><text x="72" y="1152" text-anchor="start" style="font-size:20px;font-weight:400;fill:#1f2937">them briefly</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1449" x2="680" y2="1449" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1479" class="note">Worked examples; re-rate every row for your own</text>
    <text x="40" y="1506" class="note">organisation.</text>
  </g>
</svg>
