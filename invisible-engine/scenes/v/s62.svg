<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1464" width="720" height="1464" font-family="Inter, Arial, sans-serif">
  <title>Scene 62: The Z gate changes a phase you cannot see directly</title>
  <desc>Five frames. 1, the plus state: amplitudes plus 0.707 and plus 0.707, probabilities 0.50 and 0.50. 2, the Z gate, matrix one, zero, zero, minus one: it flips the sign of the ket 1 part. 3, the result is the minus state, amplitudes plus 0.707 and minus 0.707, with exactly the same probabilities, 0.50 and 0.50. 4, as arrows, the ket 1 part turns by 180 degrees while the ket 0 part stays: a relative phase. 5, a note that measuring now cannot tell plus from minus, but the next H gate can (Scene 63).</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1464"/>
  <text x="40" y="50" class="k">SCENE 62</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The Z gate changes a</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">phase you cannot see</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">directly</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">Same odds before and after. What changed is the</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">relative phase.</text>
  <g data-f="1" transform="translate(0,314)">
    <rect x="40" y="0" width="640" height="212" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="82" cy="44" r="26" fill="#7c3aed"/><text x="82" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="122" y="54" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">Before: |+⟩</text>
    <path d="M68,170 L218,170" stroke="#334155" stroke-width="2"/><rect x="80" y="119.1" width="50" height="50.9" rx="4" fill="#7c3aed"/><text x="105.0" y="110.08831175456858" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#7c3aed">+0.707</text><rect x="156" y="119.1" width="50" height="50.9" rx="4" fill="#7c3aed"/><text x="181.0" y="110.08831175456858" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#7c3aed">+0.707</text>
    <text x="105.0" y="200" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">|0⟩</text><text x="181.0" y="200" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">|1⟩</text>
    <path d="M318,170 L468,170" stroke="#334155" stroke-width="2"/><rect x="330" y="134.0" width="50" height="36.0" rx="4" fill="#0d9488"/><text x="355.0" y="125.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0d9488">0.50</text><rect x="406" y="134.0" width="50" height="36.0" rx="4" fill="#0d9488"/><text x="431.0" y="125.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0d9488">0.50</text>
    <text x="355.0" y="200" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">P(0)</text><text x="431.0" y="200" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">P(1)</text>
  </g>
  <g data-f="2" transform="translate(0,314)">
    <path d="M110,212 L110,236" stroke="#334155" stroke-width="3"/><rect x="72" y="236" width="76" height="64" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="110.0" y="280.0" text-anchor="middle" style="font-size:32px;font-weight:800;fill:#7c3aed">Z</text><path d="M110,300 L110,536" stroke="#334155" stroke-width="3"/><path d="M98,522 L110,540 L122,522 Z" fill="#334155"/>
    <text x="134" y="377.0" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:700;fill:#7c3aed">Z =</text><path d="M194.92000000000002,338 L184.92000000000002,338 L184.92000000000002,404 L194.92000000000002,404" fill="none" stroke="#7c3aed" stroke-width="2.5"/><path d="M272.92,338 L282.92,338 L282.92,404 L272.92,404" fill="none" stroke="#7c3aed" stroke-width="2.5"/><text x="216.92000000000002" y="360" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:700;fill:#7c3aed">1</text><text x="260.92" y="360" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:700;fill:#7c3aed">0</text><text x="216.92000000000002" y="394" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:700;fill:#7c3aed">0</text><text x="260.92" y="394" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:700;fill:#7c3aed">−1</text>
    <text x="134" y="450" text-anchor="start" style="font-size:20px;font-weight:600;fill:#475569">flips the sign</text><text x="134" y="476" text-anchor="start" style="font-size:20px;font-weight:600;fill:#475569">of the |1⟩ part</text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <rect x="40" y="548" width="640" height="262" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="82" cy="592" r="26" fill="#7c3aed"/><text x="82" y="601" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="122" y="602" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">After: |−⟩</text>
    <path d="M68,698 L218,698" stroke="#334155" stroke-width="2"/><rect x="80" y="647.1" width="50" height="50.9" rx="4" fill="#7c3aed"/><text x="105.0" y="638.0883117545686" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#7c3aed">+0.707</text><rect x="156" y="698.0" width="50" height="50.9" rx="4" fill="#be185d"/><text x="181.0" y="772.9116882454314" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#be185d">−0.707</text>
    <text x="105.0" y="800" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">|0⟩</text><text x="181.0" y="800" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">|1⟩</text>
    <path d="M318,698 L468,698" stroke="#334155" stroke-width="2"/><rect x="330" y="662.0" width="50" height="36.0" rx="4" fill="#0d9488"/><text x="355.0" y="653.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0d9488">0.50</text><rect x="406" y="662.0" width="50" height="36.0" rx="4" fill="#0d9488"/><text x="431.0" y="653.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0d9488">0.50</text>
    <text x="355.0" y="800" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">P(0)</text><text x="431.0" y="800" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">P(1)</text>
  </g>
  <g data-f="4" transform="translate(0,314)">
    <rect x="300" y="224" width="380" height="312" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="342" cy="268" r="26" fill="#334155"/><text x="342" y="277" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">4</text><text x="382" y="278" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">As arrows</text>
    <text x="324" y="382" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:800;fill:#7c3aed">|+⟩</text>
    <circle cx="450" cy="374" r="34" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M450,374 L475.5,374.0" stroke="#7c3aed" stroke-width="4"/><path d="M475.5,374.0 L461.5,381.0 L461.5,367.0 Z" fill="#7c3aed"/>
    <text x="450" y="330" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">|0⟩ part</text>
    <circle cx="570" cy="374" r="34" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M570,374 L595.5,374.0" stroke="#7c3aed" stroke-width="4"/><path d="M595.5,374.0 L581.5,381.0 L581.5,367.0 Z" fill="#7c3aed"/>
    <text x="570" y="330" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">|1⟩ part</text>
    <text x="324" y="466" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:800;fill:#7c3aed">|−⟩</text>
    <circle cx="450" cy="458" r="34" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M450,458 L475.5,458.0" stroke="#7c3aed" stroke-width="4"/><path d="M475.5,458.0 L461.5,465.0 L461.5,451.0 Z" fill="#7c3aed"/>
    <circle cx="570" cy="458" r="34" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <path d="M570,458 L544.5,458.0" stroke="#7c3aed" stroke-width="4"/><path d="M544.5,458.0 L558.5,451.0 L558.5,465.0 Z" fill="#7c3aed"/>
    <text x="324" y="516" text-anchor="start" style="font-size:20px;font-weight:700;fill:#7c3aed">|1⟩ part turned by 180°</text>
  </g>
  <g data-f="5" transform="translate(0,314)">
    <rect x="40" y="822" width="640" height="232" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="76" cy="858" r="20" fill="#334155"/><text x="76" y="865" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#ffffff">5</text><text x="106" y="866" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Invisible now, decisive next</text>
    <text x="64" y="902" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">Measured right now, |+⟩ and |−⟩ give the same</text><text x="64" y="927" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">50 : 50: no single reading can tell them apart.</text><text x="64" y="952" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">The difference is a relative phase of 180°. One more</text><text x="64" y="977" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">H turns |+⟩ into 0 every time and |−⟩ into 1 every</text><text x="64" y="1002" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">time (Scene 63). A phase you cannot read directly</text><text x="64" y="1027" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155">still decides the outcome of the next step.</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1397" x2="680" y2="1397" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1427" class="note">Ideal gates. Purple: amplitudes. Teal: probabilities.</text>
  </g>
</svg>
