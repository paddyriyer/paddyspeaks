<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1528" width="720" height="1528" font-family="Inter, Arial, sans-serif">
  <title>Scene 04: Induction: a changing field pushes current around a coil</title>
  <desc>Four frames. A bar magnet moving into a coil makes a meter needle swing; when the magnet stops the needle returns to zero, because only change induces voltage; an AC-driven primary coil induces an alternating voltage in a secondary coil with no wire between them; and three energy sources compared: a battery, near-field induction and far-field radio harvesting.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1528"/>
  <text x="40" y="50" class="k">SCENE 04</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Induction: a changing</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">field pushes current</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">around a coil</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">v = −N · dΦ/dt — voltage appears only while the</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">magnetic flux changes.</text>
  <g data-f="1" transform="translate(0,314)">
    <rect x="40" y="0" width="312" height="482" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="82" cy="44" r="26" fill="#2563eb"/><text x="82" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="122" y="54" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Move the magnet</text>
    <rect x="89" y="78" width="54" height="64" rx="6" fill="#fecaca" stroke="#991b1b" stroke-width="3"/><rect x="89" y="142" width="54" height="64" rx="6" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="3"/><text x="116" y="119" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#991b1b">N</text><text x="116" y="183" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#1e3a8a">S</text>
    <path d="M166,90 L166,184" stroke="#64748b" stroke-width="5"/><path d="M154,182 L166,204 L178,182 Z" fill="#64748b"/>
    <text x="178" y="152" text-anchor="start" style="font-size:21px;font-weight:600;fill:#475569">moving</text>
    <rect x="56.0" y="248.0" width="120" height="96" rx="18" class="coil"/>
    <rect x="66.0" y="258.0" width="100" height="76" rx="15" class="coil"/>
    <rect x="76.0" y="268.0" width="80" height="56" rx="12" class="coil"/>
    <path d="M176,296 L218,296" class="wire"/><path d="M116,344 L116,372 L266,372 L266,358" class="wire"/>
    <circle cx="266" cy="296" r="48" fill="#ffffff" stroke="#334155" stroke-width="4"/><path d="M232,302 A36,36 0 0 1 300,302" fill="none" stroke="#cbd5e1" stroke-width="3"/><path d="M266,310 L292,279" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/><circle cx="266" cy="310" r="5" fill="#334155"/>
    <text x="60" y="420" text-anchor="start" style="font-size:21px;font-weight:600;fill:#1e3a8a"><tspan x="60" dy="0">The needle swings while</tspan><tspan x="60" dy="27">the magnet moves.</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,314)">
    <rect x="368" y="0" width="312" height="482" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="410" cy="44" r="26" fill="#334155"/><text x="410" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="450" y="54" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Stop the magnet</text>
    <rect x="384.0" y="248.0" width="120" height="96" rx="18" class="coil"/>
    <rect x="394.0" y="258.0" width="100" height="76" rx="15" class="coil"/>
    <rect x="404.0" y="268.0" width="80" height="56" rx="12" class="coil"/>
    <path d="M504,296 L546,296" class="wire"/><path d="M444,344 L444,372 L594,372 L594,358" class="wire"/>
    <circle cx="594" cy="296" r="48" fill="#ffffff" stroke="#334155" stroke-width="4"/><path d="M560,302 A36,36 0 0 1 628,302" fill="none" stroke="#cbd5e1" stroke-width="3"/><path d="M594,310 L594,270" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/><circle cx="594" cy="310" r="5" fill="#334155"/>
    <rect x="417" y="196" width="54" height="64" rx="6" fill="#fecaca" stroke="#991b1b" stroke-width="3"/><rect x="417" y="260" width="54" height="64" rx="6" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="3"/><text x="444" y="237" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#991b1b">N</text><text x="444" y="301" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#1e3a8a">S</text>
    <text x="388" y="412" text-anchor="start" style="font-size:21px;font-weight:600;fill:#334155"><tspan x="388" dy="0">A steady field induces</tspan><tspan x="388" dy="27">nothing. Lenz: the current</tspan><tspan x="388" dy="27">opposes the change.</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <rect x="40" y="498" width="640" height="262" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="82" cy="542" r="26" fill="#ea580c"/><text x="82" y="551" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="122" y="552" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d"><tspan x="122" dy="0">Drive one coil with AC →</tspan><tspan x="122" dy="31">the other gets an AC voltage</tspan></text>
    <rect x="60.0" y="643.0" width="180" height="70" rx="18" class="coil"/>
    <rect x="70.0" y="653.0" width="160" height="50" rx="15" class="coil"/>
    <rect x="80.0" y="663.0" width="140" height="30" rx="12" class="coil"/>
    <rect x="440.0" y="643.0" width="180" height="70" rx="18" class="coil"/>
    <rect x="450.0" y="653.0" width="160" height="50" rx="15" class="coil"/>
    <rect x="460.0" y="663.0" width="140" height="30" rx="12" class="coil"/>
    <path d="M252,678 L428,678" class="a-energy" marker-end="url(#m-energy)"/>
    <rect x="249" y="604" width="182" height="58" rx="6" class="lab"/>
    <text x="340" y="626" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#c2410c"><tspan x="340" dy="0">energy via the</tspan><tspan x="340" dy="26">changing field</tspan></text>
    <text x="340" y="744" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#9a3412">a loose, air-cored transformer</text>
  </g>
  <g data-f="4" transform="translate(0,314)">
    <rect x="40" y="776" width="640" height="92" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="56" y="812" text-anchor="start" style="font-size:26px;font-weight:800;fill:#16a34a">Battery</text><text x="56" y="848" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">energy stored inside; works anywhere, runs down</text>
    <rect x="640" y="788" width="11" height="14" rx="3" fill="#475569"/><rect x="630" y="800" width="30" height="56" rx="12" fill="#ffffff" stroke="#334155" stroke-width="4"/><rect x="638" y="816" width="14" height="32" rx="6" fill="#4ade80"/>
    <rect x="40" y="880" width="640" height="92" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="56" y="916" text-anchor="start" style="font-size:26px;font-weight:800;fill:#ea580c">Near-field induction (NFC)</text><text x="56" y="952" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">energy from a nearby coil; useful only at centimetres</text>
    <rect x="618.0" y="894.0" width="56" height="36" rx="18" class="coil"/>
    <rect x="624.0" y="900.0" width="44" height="24" rx="15" class="coil"/>
    <rect x="630.0" y="906.0" width="32" height="12" rx="12" class="coil"/>
    <rect x="40" y="984" width="640" height="116" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="56" y="1020" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">Far-field RF harvesting</text><text x="56" y="1056" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">energy scavenged from a radio wave; typically</tspan><tspan x="56" dy="27">far weaker</tspan></text>
    <path d="M650,1080 L650,1014 M634,1080 L666,1080" stroke="#334155" stroke-width="4" fill="none"/><circle cx="650" cy="1010" r="6" fill="#334155"/>
    <path d="M640,1000 q-7,10 0,20" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" opacity="1.00"/><path d="M630,992 q-11,18 0,36" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" opacity="0.80"/><path d="M621,983 q-15,27 0,53" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" opacity="0.60"/>
  </g>
  <g class="legend">
    <line x1="40" y1="1427" x2="680" y2="1427" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1457" class="note">Schematic. The grey arrow shows the magnet moving.</text>
    <path d="M40,1493 L74,1493" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="86" y="1498" class="s">Energy / power</text>
  </g>
</svg>
