<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1598" width="720" height="1598" font-family="Inter, Arial, sans-serif">
  <title>Scene 88: What post-quantum cryptography does not fix</title>
  <desc>Five frames. 1, a passer-by’s phone sends a sealed report to the relay through a pipe protected by post-quantum key exchange and signatures: this protects the content against a future quantum computer. 2, consent: a tag hidden in someone else’s bag still reports the carrier’s location to the account holder. 3, coercion: someone pressured into sharing their location is still located. 4, phishing and account takeover, and stale shares or careless admin access: whoever gets into the account sees what the owner sees. 5, what helps instead: alerts to the person a tag travels with, sharing reviews, strong sign-in, policy and support; and a safety note that disabling a tracker can alert whoever placed it.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1598"/>
  <text x="40" y="50" class="k">SCENE 88</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">What post-quantum</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">cryptography does not fix</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Stronger locks protect the message. They cannot</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">decide who should be allowed to read it.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="61" y="15" width="70" height="134" rx="12" fill="#0f172a" opacity="0.14"/><rect x="56" y="8" width="70" height="134" rx="12" fill="#111827"/><rect x="60" y="12" width="62" height="126" rx="9" fill="#e0f2fe"/><rect x="81" y="15" width="20" height="5" rx="2" fill="#111827"/>
    <text x="40" y="170" text-anchor="start" style="font-size:20px;font-weight:600;fill:#475569">passer-by’s phone</text>
    <path d="M512,119 a38,38 0 0 1 4,-65 a49,49 0 0 1 95,-13 a34,34 0 0 1 8,77 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
    <text x="565" y="96" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#14213d">Relay</text>
    <path d="M134,72 L464,68" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="133" y="18" width="333" height="32" rx="6" class="lab"/>
    <text x="300" y="40" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#7e22ce"><tspan x="300" dy="0">sealed report, post-quantum</tspan></text>
    <path d="M285,109 L285,100 a13,13 0 0 1 25,0 L310,109" fill="none" stroke="#7c3aed" stroke-width="4.5"/><rect x="276" y="108" width="43" height="34" rx="5" fill="#7c3aed"/><circle cx="298" cy="122" r="4" fill="#ffffff"/><rect x="296" y="124" width="4" height="9" fill="#ffffff"/>
    <rect x="40" y="188" width="640" height="162" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="66" cy="218" r="18" fill="#7c3aed"/><text x="66" y="224" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="94" y="224" text-anchor="start" style="font-size:26px;font-weight:800;fill:#7c3aed">What it fixes</text><text x="56" y="260" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Key exchange and signatures that a future large,</tspan><tspan x="56" dy="26">fault-tolerant quantum computer could otherwise attack</tspan><tspan x="56" dy="26">(ML-KEM, ML-DSA, SLH-DSA; Modules 9–10). Nothing here is</tspan><tspan x="56" dy="26">broken today.</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="40" y="362" width="314" height="226" rx="14" class="hz"/>
    <circle cx="70" cy="396" r="18" fill="#dc2626"/><text x="70" y="402" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text>
    <text x="98" y="404" text-anchor="start" style="font-size:22px;font-weight:800;fill:#991b1b">Consent</text>
    <text x="56" y="442" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="56" dy="0">A tag hidden in someone’s</tspan><tspan x="56" dy="26">bag: the account holder</tspan><tspan x="56" dy="26">still sees the carrier’s</tspan><tspan x="56" dy="26">location.</tspan></text>
    <text x="56" y="548" text-anchor="start" style="font-size:20px;font-weight:700;fill:#b91c1c"><tspan x="56" dy="0">unchanged by post-quantum</tspan><tspan x="56" dy="26">crypto</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="366" y="362" width="314" height="226" rx="14" class="hz"/>
    <circle cx="396" cy="396" r="18" fill="#dc2626"/><text x="396" y="402" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text>
    <text x="424" y="404" text-anchor="start" style="font-size:22px;font-weight:800;fill:#991b1b">Coercion</text>
    <text x="382" y="442" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="382" dy="0">Someone pressured into</tspan><tspan x="382" dy="26">sharing is located just</tspan><tspan x="382" dy="26">the same. The maths cannot</tspan><tspan x="382" dy="26">see pressure.</tspan></text>
    <text x="382" y="548" text-anchor="start" style="font-size:20px;font-weight:700;fill:#b91c1c"><tspan x="382" dy="0">unchanged by post-quantum</tspan><tspan x="382" dy="26">crypto</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="598" width="314" height="226" rx="14" class="hz"/>
    <circle cx="70" cy="632" r="18" fill="#dc2626"/><text x="70" y="638" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text>
    <text x="98" y="640" text-anchor="start" style="font-size:22px;font-weight:800;fill:#991b1b">Phishing, takeover</text>
    <text x="56" y="678" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="56" dy="0">A fake sign-in page hands</tspan><tspan x="56" dy="26">over the account; the</tspan><tspan x="56" dy="26">attacker then sees what</tspan><tspan x="56" dy="26">the owner sees.</tspan></text>
    <text x="56" y="784" text-anchor="start" style="font-size:20px;font-weight:700;fill:#b91c1c"><tspan x="56" dy="0">unchanged by post-quantum</tspan><tspan x="56" dy="26">crypto</tspan></text>
    <rect x="366" y="598" width="314" height="226" rx="14" class="hz"/>
    <circle cx="396" cy="632" r="18" fill="#dc2626"/><text x="396" y="638" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text>
    <text x="424" y="640" text-anchor="start" style="font-size:22px;font-weight:800;fill:#991b1b">Stale access</text>
    <text x="382" y="678" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="382" dy="0">Old shares, forgotten</tspan><tspan x="382" dy="26">devices, an admin who sees</tspan><tspan x="382" dy="26">too much: permission, not</tspan><tspan x="382" dy="26">encryption.</tspan></text>
    <text x="382" y="784" text-anchor="start" style="font-size:20px;font-weight:700;fill:#b91c1c"><tspan x="382" dy="0">unchanged by post-quantum</tspan><tspan x="382" dy="26">crypto</tspan></text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="846" width="640" height="192" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="66" cy="876" r="18" fill="#16a34a"/><text x="66" y="882" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">6</text><text x="94" y="882" text-anchor="start" style="font-size:26px;font-weight:800;fill:#16a34a">What helps instead</text><text x="56" y="918" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Alerts on the carrier’s own phone and a sound from</tspan><tspan x="56" dy="26">separated tags · sharing reviews such as Safety Check ·</tspan><tspan x="56" dy="26">passkeys or security keys and two-factor sign-in ·</tspan><tspan x="56" dy="26">least-privilege admin access · a written policy · people</tspan><tspan x="56" dy="26">and support services (Modules 7 and 11).</tspan></text>
    <rect x="40" y="1050" width="640" height="140" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="58" y="1082" text-anchor="start" style="font-size:21px;font-weight:800;fill:#7f1d1d"><tspan x="58" dy="0">Safety first. If a tracker may be following you,</tspan><tspan x="58" dy="27">disabling it can alert whoever placed it.</tspan></text>
    <text x="58" y="1144" text-anchor="start" style="font-size:20px;font-weight:400;fill:#7f1d1d"><tspan x="58" dy="0">Use the platform’s safety guide, someone you trust or a</tspan><tspan x="58" dy="26">support service to decide when and whether.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1470" x2="680" y2="1470" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1500" class="note">Agrees with demo K: encryption decides who else can</text>
    <text x="40" y="1527" class="note">read, never who agreed.</text>
    <path d="M40,1563 L74,1563" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="86" y="1568" class="s">Encrypted / cryptographic</text>
    <rect x="375.0" y="1554" width="34" height="18" rx="3" class="hz" style="stroke-width:3"/>
    <text x="421.0" y="1568" class="s">Attacker zone / hazard</text>
  </g>
</svg>
