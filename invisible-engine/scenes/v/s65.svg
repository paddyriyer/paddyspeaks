<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1541" width="720" height="1541" font-family="Inter, Arial, sans-serif">
  <title>Scene 65: Entanglement: two qubits, one shared story</title>
  <desc>Five frames. 1, a circuit: two qubits start in 0; a Hadamard gate acts on the first; then a CNOT gate uses the first as control and the second as target. 2, after the Hadamard the amplitudes for 00, 01, 10 and 11 are 0.707, 0, 0.707, 0. 3, after the CNOT they are 0.707, 0, 0, 0.707: the Bell state (|00⟩+|11⟩)/√2, with probability 0.5 for 00 and 0.5 for 11. 4, ten simulated runs of preparing and measuring it: the two qubits agree in all 10 runs, while each qubit alone looks random. 5, no faster-than-light messages: one side’s results look 50/50 whatever the other side does; the correlation appears only when the two lists are compared over an ordinary channel.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1541"/>
  <text x="40" y="50" class="k">SCENE 65</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Entanglement: two qubits,</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">one shared story</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Measure one and you know the other — but neither</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">side can send a message this way.</text>
  <g data-f="1" transform="translate(0,262)">
    <path d="M110,74 L680,74" stroke="#334155" stroke-width="2.5"/><text x="98" y="82" text-anchor="end" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:700;fill:#14213d">|0⟩</text><path d="M110,154 L680,154" stroke="#334155" stroke-width="2.5"/><text x="98" y="162" text-anchor="end" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:700;fill:#14213d">|0⟩</text>
    <rect x="172" y="48" width="56" height="52" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/><text x="200" y="82" text-anchor="middle" style="font-size:22px;font-weight:800;fill:#1d4ed8">H</text>
    <path d="M470,74 L470,174" stroke="#334155" stroke-width="3"/><circle cx="470" cy="74" r="9" fill="#334155"/><circle cx="470" cy="154" r="20" fill="#ffffff" stroke="#334155" stroke-width="3"/><path d="M450,154 L490,154 M470,134 L470,174" stroke="#334155" stroke-width="3"/>
    <text x="200" y="26" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#1d4ed8">Hadamard on q0</text>
    <text x="470" y="26" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#334155">CNOT: q0 controls q1</text>
    <text x="40" y="214" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="40" dy="0">Left to right: start, then gates.</tspan><tspan x="40" dy="27">Wires carry qubits, not current.</tspan></text>
    <rect x="40" y="262" width="640" height="127" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="68" cy="292" r="18" fill="#2563eb"/><text x="68" y="298" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="96" y="300" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">The recipe</text><text x="56" y="334" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">H puts the first qubit in an even mix; CNOT flips the</tspan><tspan x="56" dy="27">second only where the first is 1.</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <text x="40" y="419" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">After H</text><path d="M40,494 L240,494" stroke="#334155" stroke-width="2"/><rect x="40" y="439" width="200" height="110" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><rect x="51" y="455.1" width="28" height="38.9" rx="4" fill="#2563eb"/><text x="65.0" y="447.1091270347399" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#2563eb">0.707</text><text x="65.0" y="575" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#334155">00</text><text x="115.0" y="486.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#64748b">0</text><text x="115.0" y="575" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#334155">01</text><rect x="151" y="455.1" width="28" height="38.9" rx="4" fill="#2563eb"/><text x="165.0" y="447.1091270347399" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#2563eb">0.707</text><text x="165.0" y="575" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#334155">10</text><text x="215.0" y="486.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#64748b">0</text><text x="215.0" y="575" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#334155">11</text>
    <text x="140" y="615" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#334155">(|00⟩ + |10⟩)/√2</text>
    <text x="140" y="641" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#475569">not yet linked</text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <text x="260" y="419" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">After CNOT</text><path d="M260,494 L460,494" stroke="#334155" stroke-width="2"/><rect x="260" y="439" width="200" height="110" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><rect x="271" y="455.1" width="28" height="38.9" rx="4" fill="#2563eb"/><text x="285.0" y="447.1091270347399" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#2563eb">0.707</text><text x="285.0" y="575" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#334155">00</text><text x="335.0" y="486.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#64748b">0</text><text x="335.0" y="575" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#334155">01</text><text x="385.0" y="486.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#64748b">0</text><text x="385.0" y="575" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#334155">10</text><rect x="421" y="455.1" width="28" height="38.9" rx="4" fill="#2563eb"/><text x="435.0" y="447.1091270347399" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#2563eb">0.707</text><text x="435.0" y="575" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#334155">11</text>
    <text x="480" y="419" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">Probabilities</text><path d="M480,549 L680,549" stroke="#334155" stroke-width="2"/><rect x="491" y="494.0" width="28" height="55.0" rx="4" fill="#16a34a"/><text x="505.0" y="486.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#16a34a">0.5</text><text x="505.0" y="575" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#334155">00</text><text x="555.0" y="541.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#64748b">0</text><text x="555.0" y="575" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#334155">01</text><text x="605.0" y="541.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#64748b">0</text><text x="605.0" y="575" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#334155">10</text><rect x="641" y="494.0" width="28" height="55.0" rx="4" fill="#16a34a"/><text x="655.0" y="486.0" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#16a34a">0.5</text><text x="655.0" y="575" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:600;fill:#334155">11</text>
    <text x="470" y="615" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">(|00⟩ + |11⟩)/√2 — the Bell state</text>
    <text x="470" y="641" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#475569">probability = amplitude²</text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="671" width="640" height="262" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="68" cy="705" r="18" fill="#334155"/><text x="68" y="711" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="96" y="712" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d">Ten simulated runs (prepare, then measure both)</text>
    <rect x="60" y="733" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="112" y="767" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:24px;font-weight:800;fill:#1d4ed8">00</text>
    <rect x="182" y="733" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="234" y="767" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:24px;font-weight:800;fill:#1d4ed8">00</text>
    <rect x="304" y="733" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="356" y="767" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:24px;font-weight:800;fill:#1d4ed8">11</text>
    <rect x="426" y="733" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="478" y="767" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:24px;font-weight:800;fill:#1d4ed8">00</text>
    <rect x="548" y="733" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="600" y="767" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:24px;font-weight:800;fill:#1d4ed8">11</text>
    <rect x="60" y="799" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="112" y="833" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:24px;font-weight:800;fill:#1d4ed8">11</text>
    <rect x="182" y="799" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="234" y="833" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:24px;font-weight:800;fill:#1d4ed8">00</text>
    <rect x="304" y="799" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="356" y="833" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:24px;font-weight:800;fill:#1d4ed8">11</text>
    <rect x="426" y="799" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="478" y="833" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:24px;font-weight:800;fill:#1d4ed8">11</text>
    <rect x="548" y="799" width="104" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="600" y="833" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:24px;font-weight:800;fill:#1d4ed8">00</text>
    <text x="60" y="883" text-anchor="start" style="font-size:21px;font-weight:700;fill:#334155">The two qubits agree in 10 of 10 runs.</text>
    <text x="60" y="913" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">q0 alone: 5 zeros, 5 ones — it looks random.</text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="947" width="640" height="208" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="68" cy="977" r="18" fill="#7c3aed"/><text x="68" y="983" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="96" y="985" text-anchor="start" style="font-size:26px;font-weight:800;fill:#7c3aed">No faster-than-light messages</text><text x="56" y="1019" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Whatever the far side does, the near side’s own results</tspan><tspan x="56" dy="27">stay 50/50: P(q0 = 0) = 0.5. The agreement only shows</tspan><tspan x="56" dy="27">up when both lists are brought together over an</tspan><tspan x="56" dy="27">ordinary channel, at ordinary speed (the no-signalling</tspan><tspan x="56" dy="27">theorem).</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1447" x2="680" y2="1447" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1477" class="note">Amplitudes computed with a two-qubit statevector</text>
    <text x="40" y="1504" class="note">simulation.</text>
  </g>
</svg>
