  <rect class="bg" width="720" height="1358"/>
  <text x="40" y="50" class="k">SCENE 02</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Energy and information</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">are different things</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Energy is measured in joules. Information is</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">measured in bits. One wire can carry both.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="0" width="640" height="272" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="82" cy="44" r="26" fill="#ea580c"/><text x="82" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="122" y="54" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">Energy</text><text x="122" y="88" text-anchor="start" style="font-size:21px;font-weight:600;fill:#ea580c">joules (J) · rate: watts (W = J/s)</text>
    <rect x="110" y="116" width="23" height="14" rx="3" fill="#475569"/><rect x="90" y="128" width="64" height="110" rx="12" fill="#ffffff" stroke="#334155" stroke-width="4"/><rect x="98" y="155" width="48" height="75" rx="6" fill="#4ade80"/>
