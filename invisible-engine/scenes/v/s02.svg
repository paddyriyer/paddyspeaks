    <text x="459" y="452" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:21px;font-weight:800;fill:#166534">0</text>
    <rect x="482" y="428" width="34" height="34" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="499" y="452" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:21px;font-weight:800;fill:#166534">1</text>
    <text x="66" y="582" text-anchor="start" style="font-size:21px;font-weight:700;fill:#166534">106 kbit/s = 106,000</text>
    <text x="288" y="582" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">yes/no choices each second.</text>
