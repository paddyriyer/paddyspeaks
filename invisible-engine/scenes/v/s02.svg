    <text x="536" y="160" text-anchor="start" style="font-size:21px;font-weight:700;fill:#9a3412"><tspan x="536" dy="0">1 watt for</tspan><tspan x="536" dy="27">1 second</tspan></text>
    <text x="536" y="222" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="536" dy="0">delivers</tspan><tspan x="536" dy="27">1 joule.</tspan></text>
  </g>
