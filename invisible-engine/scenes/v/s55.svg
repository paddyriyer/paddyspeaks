<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1454" width="720" height="1454" font-family="Inter, Arial, sans-serif">
  <title>Scene 55: Proportionate protection: who can do what</title>
  <desc>Five frames build a table of mitigations against five who-columns: a person, a household, an employer, the vendor and standards bodies. A filled dot means implements, a ring means supports. 1, consent before sharing a location, and regular reviews of who sees your location or items, are mainly for the person and household. 2, hardening accounts with two-factor authentication, trusted-device reviews and recovery contacts: person and employer. 3, anti-abuse controls built into the product — alerts, a sound when moved, serial and NFC information, one account per tag: the vendor, supported by standards. 4, minimising metadata and standards with responsible disclosure: vendors and standards bodies. 5, a note that proportionate means the smallest control that addresses the risk, chosen with the person it protects.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1454"/>
  <text x="40" y="50" class="k">SCENE 55</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Proportionate protection:</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">who can do what</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Each control has an owner. Proportionate means</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">fitting the control to the risk — never watching</text>
  <text x="40" y="267" style="font-size:23px;fill:#475569">the person you protect.</text>
  <g transform="translate(0,293)">
    <rect x="40" y="0" width="640" height="90" rx="10" fill="#f1f5f9"/>
    <text x="56" y="34" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Mitigation</text>
    <text x="104" y="74" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">Person</text>
    <text x="232" y="74" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">Household</text>
    <text x="360" y="74" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">Employer</text>
    <text x="488" y="74" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">Vendor</text>
    <text x="616" y="74" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">Standards</text>
  </g>
  <g data-f="1" transform="translate(0,293)">
    <rect x="40" y="100" width="640" height="116" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="56" y="132" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Consent before sharing a location</text><text x="56" y="160" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">Ask and agree openly; write down how to stop</text>
    <circle cx="104" cy="190" r="12" fill="#16a34a"/>
    <circle cx="232" cy="190" r="12" fill="#16a34a"/>
    <circle cx="360" cy="190" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <circle cx="488" cy="190" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <path d="M607,190 L625,190" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="40" y="224" width="640" height="116" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="56" y="256" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Review who sees your location or items</text><text x="56" y="284" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">For example Safety Check on iPhone</text>
    <circle cx="104" cy="314" r="12" fill="#16a34a"/>
    <circle cx="232" cy="314" r="12" fill="#16a34a"/>
    <path d="M351,314 L369,314" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="488" cy="314" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <path d="M607,314 L625,314" stroke="#cbd5e1" stroke-width="3"/>
  </g>
  <g data-f="2" transform="translate(0,293)">
    <rect x="40" y="348" width="640" height="116" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="56" y="380" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Harden accounts</text><text x="56" y="408" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">Two-factor, trusted devices, recovery contacts</text>
    <circle cx="104" cy="438" r="12" fill="#16a34a"/>
    <circle cx="232" cy="438" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <circle cx="360" cy="438" r="12" fill="#16a34a"/>
    <circle cx="488" cy="438" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <path d="M607,438 L625,438" stroke="#cbd5e1" stroke-width="3"/>
  </g>
  <g data-f="3" transform="translate(0,293)">
    <rect x="40" y="472" width="640" height="142" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="56" y="504" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Anti-abuse controls in the product</text><text x="56" y="532" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">Alerts, sound when moved, serial and NFC info,</text><text x="56" y="558" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">one account per tag</text>
    <path d="M95,588 L113,588" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M223,588 L241,588" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M351,588 L369,588" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="488" cy="588" r="12" fill="#16a34a"/>
    <circle cx="616" cy="588" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  </g>
  <g data-f="4" transform="translate(0,293)">
    <rect x="40" y="622" width="640" height="116" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="56" y="654" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Minimise metadata</text><text x="56" y="682" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">Keep less, for less time; aggregate where possible</text>
    <path d="M95,712 L113,712" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M223,712 L241,712" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="360" cy="712" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <circle cx="488" cy="712" r="12" fill="#16a34a"/>
    <circle cx="616" cy="712" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <rect x="40" y="746" width="640" height="142" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="56" y="778" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Standards and responsible disclosure</text><text x="56" y="806" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">Cross-platform alert specifications; report flaws</text><text x="56" y="832" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">privately first</text>
    <circle cx="104" cy="862" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <path d="M223,862 L241,862" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M351,862 L369,862" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="488" cy="862" r="12" fill="#16a34a"/>
    <circle cx="616" cy="862" r="12" fill="#16a34a"/>
  </g>
  <g data-f="5" transform="translate(0,293)">
    <rect x="40" y="902" width="640" height="172" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="82" cy="946" r="26" fill="#16a34a"/><text x="82" y="955" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">5</text><text x="122" y="956" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Proportionate</text>
    <circle cx="76" cy="988" r="12" fill="#16a34a"/><text x="96" y="995" text-anchor="start" style="font-size:21px;font-weight:600;fill:#334155">implements</text><circle cx="246" cy="988" r="11" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="266" y="995" text-anchor="start" style="font-size:21px;font-weight:600;fill:#334155">supports</text>
    <text x="64" y="1030" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">The smallest control that addresses the risk, chosen</text><text x="64" y="1057" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">with the person it protects.</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1387" x2="680" y2="1387" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1417" class="note">Who-columns are illustrative; organisations differ.</text>
  </g>
</svg>
