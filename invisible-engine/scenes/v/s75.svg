  <text x="40" y="50" class="k">SCENE 75</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Why trackers cannot</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">simply switch: bytes,</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">chips and batteries</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">Post-quantum keys and signatures are tens to</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">hundreds of times larger.</text>
