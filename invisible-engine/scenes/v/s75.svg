:#111827">tens</text><text x="238" y="808" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#e5e7eb">tracker chip</text>
    <circle cx="556" cy="742" r="64" fill="#e5e7eb" stroke="#6b7280" stroke-width="4"/><circle cx="556" cy="742" r="51" fill="none" stroke="#9ca3af" stroke-width="2"/><text x="556" y="748" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#374151">CR2032</text>
    <text x="56" y="866" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Boot ROM: fixed at the factory; may not verify new</text><text x="56" y="893" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">signature types. Every byte sent costs battery.</text>
