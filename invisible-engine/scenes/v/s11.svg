<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1557" width="720" height="1557" font-family="Inter, Arial, sans-serif">
  <title>Scene 11: The reader makes the field</title>
  <desc>Three frames. A payment terminal, opened: a 13.56 MHz oscillator, a modulator, a power amplifier and a matching network drive the reader’s antenna coil; an alternating current flows in the coil; and an illustrative magnetic field reaches a few centimetres, where a card can sit.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1557"/>
  <text x="40" y="50" class="k">SCENE 11</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The reader makes the</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">field</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">The terminal supplies all the energy. The card</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">does not transmit a carrier of its own.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="46" y="38" width="234" height="378" rx="27" fill="#0f172a" opacity="0.15"/><rect x="40" y="30" width="234" height="378" rx="27" fill="#1f2937"/><rect x="45" y="35" width="223" height="367" rx="23" fill="#374151"/><rect x="62" y="53" width="191" height="135" rx="11" fill="#e0f2fe" stroke="#0f172a" stroke-width="2.7"/><path d="M144.4,93.7 q7.2,8.3 0,16.6" fill="none" stroke="#0c4a6e" stroke-width="2.8800000000000003" stroke-linecap="round"/><path d="M153.7,86.5 q12.4,15.5 0,31.0" fill="none" stroke="#0c4a6e" stroke-width="2.8800000000000003" stroke-linecap="round"/><path d="M163.0,79.2 q17.6,22.8 0,45.5" fill="none" stroke="#0c4a6e" stroke-width="2.8800000000000003" stroke-linecap="round"/><text x="157.0" y="165.0" text-anchor="middle" style="font-size:19.8px;font-weight:800;fill:#0c4a6e">Tap to pay</text><rect x="76" y="214" width="47" height="29" rx="6" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/><rect x="134" y="214" width="47" height="29" rx="6" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/><rect x="191" y="214" width="47" height="29" rx="6" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/><rect x="76" y="256" width="47" height="29" rx="6" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/><rect x="134" y="256" width="47" height="29" rx="6" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/><rect x="191" y="256" width="47" height="29" rx="6" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/><rect x="76" y="297" width="47" height="29" rx="6" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/><rect x="134" y="297" width="47" height="29" rx="6" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/><rect x="191" y="297" width="47" height="29" rx="6" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/><rect x="76" y="339" width="47" height="29" rx="6" fill="#ef4444" stroke="#111827" stroke-width="1.4"/><rect x="134" y="339" width="47" height="29" rx="6" fill="#facc15" stroke="#111827" stroke-width="1.4"/><rect x="191" y="339" width="47" height="29" rx="6" fill="#22c55e" stroke="#111827" stroke-width="1.4"/>
    <path d="M274,120 L300,40 M274,330 L300,452" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="300" y="0" width="380" height="460" rx="18" class="bound"/>
    <text x="320" y="38" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Inside the reader</text>
    <rect x="318" y="58" width="344" height="76" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="332" y="89" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Oscillator</text><text x="332" y="118" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">13.56 MHz, very stable</text>
    <path d="M490,134 L490,156" class="a-energy" marker-end="url(#m-energy)"/>
    <rect x="318" y="158" width="344" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="332" y="189" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Modulator</text><text x="332" y="218" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">adds the commands</text>
    <path d="M490,234 L490,256" class="a-energy" marker-end="url(#m-energy)"/>
    <rect x="318" y="258" width="344" height="76" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="332" y="289" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Amplifier</text><text x="332" y="318" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">drives the power</text>
    <path d="M490,334 L490,356" class="a-energy" marker-end="url(#m-energy)"/>
    <rect x="318" y="358" width="344" height="76" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="332" y="389" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Matching</text><text x="332" y="418" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">tunes energy into the coil</text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <path d="M490,460 L490,546" class="a-energy" marker-end="url(#m-energy)"/>
    <rect x="170.0" y="550.0" width="380" height="180" rx="18" class="coil"/>
    <rect x="181.0" y="561.0" width="358" height="158" rx="15" class="coil"/>
    <rect x="192.0" y="572.0" width="336" height="136" rx="12" class="coil"/>
    <rect x="203.0" y="583.0" width="314" height="114" rx="9" class="coil"/>
    <text x="360" y="648" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#92400e">reader antenna coil</text>
    <rect x="40" y="1000" width="640" height="104" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="66" cy="1030" r="18" fill="#ea580c"/><text x="66" y="1036" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="94" y="1036" text-anchor="start" style="font-size:26px;font-weight:800;fill:#ea580c">Alternating current in the coil</text><text x="56" y="1072" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">13.56 million reversals a second.</text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <ellipse cx="360" cy="640" rx="215" ry="129" class="field"/>
    <ellipse cx="360" cy="640" rx="255" ry="153" class="field"/>
    <rect x="384" y="768" width="300" height="189" rx="15" fill="#0f172a" opacity="0.12"/><rect x="380" y="762" width="300" height="189" rx="15" fill="#1e3a8a"/><path d="M380,879 Q530,847 680,894 L680,936 Q680,951 665,951 L395,951 Q380,951 380,936 Z" fill="#1d4ed8" opacity="0.55"/><path d="M620.0,820.8 q8.1,9.2 0,18.5" fill="none" stroke="#ffffff" stroke-width="2.727272727272727" stroke-linecap="round"/><path d="M630.4,812.7 q13.8,17.3 0,34.6" fill="none" stroke="#ffffff" stroke-width="2.727272727272727" stroke-linecap="round"/><path d="M640.8,804.7 q19.6,25.4 0,50.8" fill="none" stroke="#ffffff" stroke-width="2.727272727272727" stroke-linecap="round"/><rect x="410.0" y="824.37" width="45.0" height="45.36" rx="7" fill="#fcd34d" stroke="#a16207" stroke-width="2"/><path d="M432.5,824.37 L432.5,869.73 M410.0,839.49 L427.1,839.49 M437.9,839.49 L455.0,839.49 M410.0,854.61 L427.1,854.61 M437.9,854.61 L455.0,854.61" stroke="#a16207" stroke-width="1.6" fill="none"/><rect x="427.1" y="834.3492" width="10.799999999999999" height="25.401600000000002" rx="3" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/><text x="662.0" y="799.8" text-anchor="end" style="font-size:21.000000000000004px;font-weight:800;fill:#e0e7ff">BANK</text><text x="410.0" y="920.76" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:19.5px;font-weight:600;fill:#ffffff">•••• 1234</text>
    <text x="530" y="980" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#334155">card a few cm away</text>
    <rect x="40" y="812" width="320" height="136" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="842" r="18" fill="#2563eb"/><text x="66" y="848" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="94" y="848" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">Field strength</text><text x="56" y="884" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">ISO/IEC 14443: about</tspan><tspan x="56" dy="27">1.5–7.5 A/m, unmodulated.</tspan></text>
    <text x="40" y="1140" class="note" text-anchor="start"><tspan x="40" dy="0">Field rings: illustrative visualisation, not literal</tspan><tspan x="40" dy="27">visible waves.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1456" x2="680" y2="1456" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1486" class="note">Block diagram; real readers integrate these stages.</text>
    <path d="M40,1522 L74,1522" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="86" y="1527" class="s">Energy / power</text>
    <rect x="258.4" y="1513" width="34" height="18" rx="3" class="bound" style="stroke-width:4"/>
    <text x="304.4" y="1527" class="s">Trust or hardware boundary</text>
  </g>
</svg>
