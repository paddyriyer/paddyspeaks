<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1599" width="720" height="1599" font-family="Inter, Arial, sans-serif">
  <title>Scene 50: Where the system can fail people</title>
  <desc>Five frames. 1, the whole system: a person carries a bag with a small tracker; the tag’s radio advertisement reaches a passer-by’s phone; the phone sends a sealed report to a relay service; the relay passes it to the owner’s phone, which holds the keys. 2, threats around the tag and the radio: anyone can listen to the radio, sightings can be correlated across time and place, a tag can be hidden in someone’s things, and firmware or the supply chain can be tampered with. 3, threats around the reports and the service: spoofed sightings, altered or replayed reports, the relay itself as a target, and metadata. 4, threats around accounts and people: account takeover, shared or coerced access, stale shares, and the person carrying a tag they never chose. 5, four separate questions: confidentiality, integrity, authenticity and consent; encryption answers the first, and no cipher answers the last.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1599"/>
  <text x="40" y="50" class="k">SCENE 50</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Where the system can fail</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">people</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Encryption keeps a report secret. It does not</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">decide who agreed to be located.</text>
  <g data-f="1" transform="translate(0,262)">
    <circle cx="80" cy="57" r="17" fill="#64748b"/><path d="M56,138 L56,96 Q56,79 73,79 L87,79 Q104,79 104,96 L104,138 Z" fill="#64748b"/><rect x="62" y="132" width="14" height="62" rx="6" fill="#64748b"/><rect x="84" y="132" width="14" height="62" rx="6" fill="#64748b"/>
    <circle cx="133" cy="129" r="18" fill="#0f172a" opacity="0.13"/><circle cx="130" cy="124" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="130" cy="124" r="11" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M152,124 L222,124" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="142" y="4" width="90" height="32" rx="6" class="lab"/>
    <text x="187" y="26" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#1d4ed8"><tspan x="187" dy="0">advert</tspan></text>
    <rect x="235" y="61" width="70" height="140" rx="12" fill="#0f172a" opacity="0.14"/><rect x="230" y="54" width="70" height="140" rx="12" fill="#111827"/><rect x="234" y="58" width="62" height="132" rx="9" fill="#f1f5f9"/><rect x="255" y="61" width="20" height="5" rx="2" fill="#111827"/>
    <path d="M306,124 L356,124" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="286" y="4" width="90" height="32" rx="6" class="lab"/>
    <text x="331" y="26" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#7e22ce"><tspan x="331" dy="0">sealed</tspan></text>
    <path d="M393,162 a30,30 0 0 1 3,-51 a39,39 0 0 1 75,-10 a27,27 0 0 1 6,61 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M516,124 L564,124" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="495" y="4" width="90" height="32" rx="6" class="lab"/>
    <text x="540" y="26" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#7e22ce"><tspan x="540" dy="0">report</tspan></text>
    <rect x="575" y="61" width="70" height="140" rx="12" fill="#0f172a" opacity="0.14"/><rect x="570" y="54" width="70" height="140" rx="12" fill="#111827"/><rect x="574" y="58" width="62" height="132" rx="9" fill="#f1f5f9"/><rect x="595" y="61" width="20" height="5" rx="2" fill="#111827"/>
    <path d="M593,119 L593,110 a13,13 0 0 1 25,0 L618,119" fill="none" stroke="#7c3aed" stroke-width="4.5"/><rect x="584" y="118" width="43" height="34" rx="5" fill="#7c3aed"/><circle cx="606" cy="132" r="4" fill="#ffffff"/><rect x="604" y="134" width="4" height="9" fill="#ffffff"/>
    <text x="40" y="226" text-anchor="start" style="font-size:21px;font-weight:600;fill:#475569">person with a bag</text>
    <text x="435" y="226" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#14213d">relay service</text>
    <text x="265" y="256" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#475569">passer-by’s phone</text>
    <text x="680" y="256" text-anchor="end" style="font-size:21px;font-weight:600;fill:#475569">owner’s phone (keys)</text>
    <rect x="40" y="270" width="640" height="112" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="300" r="18" fill="#2563eb"/><text x="66" y="306" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="94" y="306" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">The system</text><text x="56" y="342" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">A tag whispers. A passer-by’s phone seals a report.</tspan><tspan x="56" dy="27">A relay stores it. Only the owner’s devices can open it.</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="40" y="394" width="640" height="174" rx="14" class="hz"/>
    <circle cx="74" cy="428" r="18" fill="#dc2626"/><text x="74" y="434" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="102" y="436" text-anchor="start" style="font-size:23px;font-weight:800;fill:#b91c1c">Around the tag and the radio</text>
    <text x="64" y="474" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• Radio observation: anyone can listen</text><text x="64" y="501" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• Correlation across time and place</text><text x="64" y="528" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• A tag hidden in someone’s things</text><text x="64" y="555" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• Firmware or supply-chain tampering</text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="40" y="576" width="640" height="174" rx="14" class="hz"/>
    <circle cx="74" cy="610" r="18" fill="#dc2626"/><text x="74" y="616" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="102" y="618" text-anchor="start" style="font-size:23px;font-weight:800;fill:#b91c1c">Around the reports and the service</text>
    <text x="64" y="656" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• Spoofed sightings: invented reports</text><text x="64" y="683" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• Report integrity: altered or replayed</text><text x="64" y="710" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• The relay itself as a target</text><text x="64" y="737" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• Metadata: when, how often, from where</text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="758" width="640" height="174" rx="14" class="hz"/>
    <circle cx="74" cy="792" r="18" fill="#dc2626"/><text x="74" y="798" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="102" y="800" text-anchor="start" style="font-size:23px;font-weight:800;fill:#b91c1c">Around accounts and people</text>
    <text x="64" y="838" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• Account takeover: every report readable</text><text x="64" y="865" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• Shared or coerced access</text><text x="64" y="892" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• Stale shares after a relationship ends</text><text x="64" y="919" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">• The person carrying a tag they never chose</text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="944" width="315" height="106" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="58" y="976" text-anchor="start" style="font-size:22px;font-weight:800;fill:#7c3aed">Confidentiality</text><text x="58" y="1006" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Who can read it?</text><text x="58" y="1032" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Encryption’s job.</text>
    <rect x="365" y="944" width="315" height="106" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="383" y="976" text-anchor="start" style="font-size:22px;font-weight:800;fill:#2563eb">Integrity</text><text x="383" y="1006" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Was it changed</text><text x="383" y="1032" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">on the way?</text>
    <rect x="40" y="1056" width="315" height="132" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <text x="58" y="1088" text-anchor="start" style="font-size:22px;font-weight:800;fill:#0d9488">Authenticity</text><text x="58" y="1118" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Did it really come</text><text x="58" y="1144" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">from a tag and a finder?</text>
    <rect x="365" y="1056" width="315" height="132" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="383" y="1088" text-anchor="start" style="font-size:22px;font-weight:800;fill:#dc2626">Consent</text><text x="383" y="1118" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Did the person located</text><text x="383" y="1144" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">agree? No cipher</text><text x="383" y="1170" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">answers this.</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1464" x2="680" y2="1464" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1494" class="note">Schematic. Threats named, not explained step by step.</text>
    <path d="M40,1530 L74,1530" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="86" y="1535" class="s">Radio signal or wave</text>
    <path d="M322.0,1530 L356.0,1530" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="368.0" y="1535" class="s">Encrypted / cryptographic</text>
    <rect x="40" y="1555" width="34" height="18" rx="3" class="hz" style="stroke-width:3"/>
    <text x="86" y="1569" class="s">Attacker zone / hazard</text>
  </g>
</svg>
