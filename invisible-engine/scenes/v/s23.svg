<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1598" width="720" height="1598" font-family="Inter, Arial, sans-serif">
  <title>Scene 23: Inside a tiny tracker</title>
  <desc>Five frames. The outside of a small round item tracker of the AirTag class, about three centimetres across, with no screen, no GPS and no SIM; the tracker opened into three illustrative layers, a top cover with a speaker, a circuit board and a coin-cell battery under a cover; the power parts, a CR2032-class coin cell and power management, feeding the rest; the radio parts, a microcontroller with a Bluetooth Low Energy radio, a 2.4 GHz antenna, an ultra-wideband radio and an NFC interface; and the remaining parts, a speaker and an accelerometer, with a note that the layout is illustrative, not a teardown.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1598"/>
  <text x="40" y="50" class="k">SCENE 23</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Inside a tiny tracker</text>
  <text x="40" y="153" style="font-size:23px;fill:#475569">A coin cell, a few radios and a speaker. The</text>
  <text x="40" y="184" style="font-size:23px;fill:#475569">layout is illustrative, not a teardown.</text>
  <g data-f="1" transform="translate(0,210)">
    <circle cx="123" cy="81" r="64" fill="#0f172a" opacity="0.13"/><circle cx="120" cy="76" r="64" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="120" cy="76" r="40" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M56,164 L184,164" stroke="#334155" stroke-width="2"/><path d="M56,156 L56,172 M184,156 L184,172" stroke="#334155" stroke-width="2"/>
    <text x="120" y="198" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#334155">about 3 cm across</text>
    <rect x="270" y="0" width="410" height="150" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="296" cy="30" r="18" fill="#2563eb"/><text x="296" y="36" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="324" y="36" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">The outside</text><text x="286" y="72" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="286" dy="0">A small item tracker</tspan><tspan x="286" dy="27">(AirTag-class). No screen,</tspan><tspan x="286" dy="27">no GPS, no SIM card.</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,210)">
    <path d="M140,262 L140,520" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 8"/>
    <ellipse cx="140" cy="304" rx="100" ry="30" fill="#94a3b8" opacity="0.35"/><ellipse cx="140" cy="292" rx="100" ry="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
    <text x="278" y="300" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Top cover + speaker</text>
    <ellipse cx="140" cy="404" rx="100" ry="30" fill="#16a34a" opacity="0.35"/><ellipse cx="140" cy="392" rx="100" ry="30" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="278" y="388" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Circuit board</text>
    <text x="278" y="415" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">radios · microcontroller · antennas</text>
    <ellipse cx="140" cy="504" rx="100" ry="30" fill="#6b7280" opacity="0.35"/><ellipse cx="140" cy="492" rx="100" ry="30" fill="#e5e7eb" stroke="#6b7280" stroke-width="3"/>
    <text x="278" y="488" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Coin cell + cover</text>
    <text x="278" y="515" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">user-replaceable</text>
    <text x="278" y="558" class="note" text-anchor="start">Illustrative layout, not a teardown.</text>
  </g>
  <g data-f="3" transform="translate(0,210)">
    <rect x="40" y="578" width="315" height="100" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="54" y="610" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Coin cell (CR2032)</text><text x="54" y="639" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569"><tspan x="54" dy="0">3 V lithium, ~225 mAh</tspan><tspan x="54" dy="27">nominal</tspan></text>
    <rect x="365" y="578" width="315" height="100" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="379" y="610" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Power management</text><text x="379" y="639" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">steady supply, sleep modes</text>
    <path d="M256,480 L256,416" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="270" y="456" text-anchor="start" style="font-size:21px;font-weight:700;fill:#c2410c">power</text>
  </g>
  <g data-f="4" transform="translate(0,210)">
    <rect x="40" y="683" width="315" height="100" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="54" y="715" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Microcontroller</text><text x="54" y="744" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">runs the firmware</text>
    <rect x="365" y="683" width="315" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="379" y="715" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Bluetooth LE radio</text><text x="379" y="744" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">whispers on 2.4 GHz</text>
    <rect x="40" y="788" width="315" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="54" y="820" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">2.4 GHz antenna</text><text x="54" y="849" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569"><tspan x="54" dy="0">tiny, compromised</tspan><tspan x="54" dy="27">(Scene 27)</tspan></text>
    <rect x="365" y="788" width="315" height="100" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text x="379" y="820" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">UWB radio</text><text x="379" y="849" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">Apple U1: nearby ranging</text>
    <rect x="40" y="893" width="315" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="54" y="925" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">NFC interface</text><text x="54" y="954" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">tap for Lost Mode info</text>
    <path d="M207,63 q9,13 0,25" fill="none" stroke="#1d4ed8" stroke-width="3.6" stroke-linecap="round" opacity="1.00"/><path d="M219,53 q14,23 0,47" fill="none" stroke="#1d4ed8" stroke-width="3.6" stroke-linecap="round" opacity="0.80"/><path d="M232,42 q20,34 0,68" fill="none" stroke="#1d4ed8" stroke-width="3.6" stroke-linecap="round" opacity="0.60"/>
    <text x="40" y="236" text-anchor="start" style="font-size:20px;font-weight:600;fill:#1d4ed8">radio (illustrative)</text>
  </g>
  <g data-f="5" transform="translate(0,210)">
    <rect x="365" y="893" width="315" height="100" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="379" y="925" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Speaker</text><text x="379" y="954" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">plays a sound to be found</text>
    <rect x="40" y="998" width="315" height="100" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="54" y="1030" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Accelerometer</text><text x="54" y="1059" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">senses motion</text>
    <rect x="365" y="998" width="315" height="100" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="379" y="1030" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Firmware details</text><text x="379" y="1059" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">not publicly disclosed</text>
    <rect x="40" y="1108" width="640" height="162" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="66" cy="1138" r="18" fill="#334155"/><text x="66" y="1144" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="94" y="1144" text-anchor="start" style="font-size:26px;font-weight:800;fill:#334155">Documented parts, illustrative layout</text><text x="56" y="1180" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Apple lists Bluetooth LE, a U1 chip (UWB), NFC, a</tspan><tspan x="56" dy="27">speaker, an accelerometer and a user-replaceable</tspan><tspan x="56" dy="27">CR2032. Exact boards, chips and firmware are not</tspan><tspan x="56" dy="27">shown here.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1497" x2="680" y2="1497" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1527" class="note">Generic tracker; not a specific product’s board.</text>
    <path d="M40,1563 L74,1563" class="a-energy" marker-end="url(#m-energy)"/>
    <text x="86" y="1568" class="s">Energy / power</text>
  </g>
</svg>
