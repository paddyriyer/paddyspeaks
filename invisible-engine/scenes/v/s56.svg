<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1464" width="720" height="1464" font-family="Inter, Arial, sans-serif">
  <title>Scene 56: A bit is a switch that is either on or off</title>
  <desc>Four frames. 1, a transistor used as a switch: a high voltage is read as 1 and a low voltage as 0, drawn as a lit and an unlit lamp. 2, a three-bit register and the eight strings it could hold, 000 to 111. 3, the register actually holds one of them, 101, and reading it does not change it. 4, bits can be read as often as you like and copied exactly; n bits have 2 to the n possible strings but hold one at a time, unlike the qubits that start in Scene 60.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1464"/>
  <text x="40" y="50" class="k">SCENE 56</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">A bit is a switch that is</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">either on or off</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Definite, readable, copyable. Everything in a</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">classical computer is built from this.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="0" width="640" height="300" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="82" cy="44" r="26" fill="#334155"/><text x="82" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="122" y="54" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">A switch makes a bit</text><text x="122" y="86" text-anchor="start" style="font-size:21px;font-weight:600;fill:#334155">a transistor, on or off</text>
    <g transform="translate(110,150) scale(0.52)"><path d="M62,0 L82,0" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M44,44 L58,58" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M0,62 L0,82" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M-44,44 L-58,58" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M-62,0 L-82,0" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M-44,-44 L-58,-58" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M-0,-62 L-0,-82" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><path d="M44,-44 L58,-58" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><circle cx="0" cy="0" r="46" fill="#fde047" stroke="#334155" stroke-width="3"/><path d="M-14,6 q7,-18 14,0 q7,18 14,0" fill="none" stroke="#b45309" stroke-width="3"/><rect x="-20" y="42" width="40" height="26" rx="4" fill="#9ca3af" stroke="#334155" stroke-width="2"/></g>
    <text x="180" y="146" text-anchor="start" style="font-size:24px;font-weight:700;fill:#14213d">high voltage</text><text x="180" y="174" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">read as 1</text>
    <text x="640" y="170" text-anchor="end" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:54px;font-weight:800;fill:#b45309">1</text>
    <g transform="translate(110,222) scale(0.52)"><circle cx="0" cy="0" r="46" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><path d="M-14,6 q7,-18 14,0 q7,18 14,0" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="-20" y="42" width="40" height="26" rx="4" fill="#9ca3af" stroke="#334155" stroke-width="2"/></g>
    <text x="180" y="222" text-anchor="start" style="font-size:24px;font-weight:700;fill:#14213d">low voltage</text><text x="180" y="250" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">read as 0</text>
    <text x="640" y="246" text-anchor="end" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:54px;font-weight:800;fill:#64748b">0</text>
    <text x="64" y="286" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#475569">Voltages are ranges, not exact values (illustrative).</text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="40" y="314" width="640" height="262" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="82" cy="358" r="26" fill="#2563eb"/><text x="82" y="367" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">2</text><text x="122" y="368" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">Three bits, eight strings</text>
    <rect x="70" y="398" width="80" height="80" rx="10" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <text x="110" y="506" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">bit 2</text>
    <rect x="166" y="398" width="80" height="80" rx="10" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <text x="206" y="506" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">bit 1</text>
    <rect x="262" y="398" width="80" height="80" rx="10" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <text x="302" y="506" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">bit 0</text>
    <text x="410" y="420" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:#14213d">000</text>
    <text x="410" y="462" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:#14213d">001</text>
    <text x="410" y="504" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:#14213d">010</text>
    <text x="410" y="546" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:#14213d">011</text>
    <text x="540" y="420" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:#14213d">100</text>
    <text x="540" y="462" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:#14213d">101</text>
    <text x="540" y="504" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:#14213d">110</text>
    <text x="540" y="546" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:#14213d">111</text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <text x="110" y="454" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:44px;font-weight:800;fill:#1d4ed8">1</text>
    <text x="206" y="454" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:44px;font-weight:800;fill:#1d4ed8">0</text>
    <text x="302" y="454" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:44px;font-weight:800;fill:#1d4ed8">1</text>
    <rect x="530" y="433" width="68" height="40" rx="8" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <rect x="40" y="590" width="640" height="116" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="66" cy="620" r="18" fill="#16a34a"/><text x="66" y="626" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="94" y="626" text-anchor="start" style="font-size:26px;font-weight:800;fill:#16a34a">One value at a time</text><text x="56" y="662" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">The register holds exactly one of the eight</tspan><tspan x="56" dy="27">strings: here 101. Reading it does not change it.</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="720" width="640" height="143" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="66" cy="750" r="18" fill="#7c3aed"/><text x="66" y="756" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="94" y="756" text-anchor="start" style="font-size:26px;font-weight:800;fill:#7c3aed">Read and copy freely</text><text x="56" y="792" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">You can read a bit as often as you like and copy</tspan><tspan x="56" dy="27">it exactly. A qubit cannot be copied, and</tspan><tspan x="56" dy="27">measuring it can change it (Scenes 60–61).</tspan></text>
    <rect x="40" y="877" width="640" height="232" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="64" y="914" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">n bits → 2ⁿ possible strings,</text><text x="64" y="944" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">but only one at a time</text>
    <text x="64" y="986" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:21px;font-weight:600;fill:#1d4ed8">3 bits → 8</text><text x="260" y="986" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:21px;font-weight:600;fill:#1d4ed8">10 bits → 1,024</text><text x="64" y="1018" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:21px;font-weight:600;fill:#1d4ed8">64 bits → 18,446,744,073,709,551,616</text>
    <text x="64" y="1060" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">More bits mean more possible values to choose from,</text><text x="64" y="1088" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">never several values held at once.</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1397" x2="680" y2="1397" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1427" class="note">Schematic. Lamps stand for transistor states.</text>
  </g>
</svg>
