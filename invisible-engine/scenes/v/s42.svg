<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1590" width="720" height="1590" font-family="Inter, Arial, sans-serif">
  <title>Scene 42: Three kinds of “mine”: holding it, owning the account, holding the keys</title>
  <desc>Four frames building a Venn diagram of three overlapping circles. 1, physical possession: whoever holds the tracker. 2, the linked cloud account: the account the tracker is registered to. 3, cryptographic authority: whoever holds the private keys that open location reports. 4, the overlaps: the rightful owner with a trusted device sits in all three; a finder or thief holds the tag but can read nothing; the owner far away has the account and the keys but not the tag; and a newly signed-in device has the account but receives the end-to-end keys only once it meets the trusted-device conditions.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1590"/>
  <text x="40" y="50" class="k">SCENE 42</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Three kinds of “mine”:</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">holding it, owning the</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">account, holding the keys</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">Signing in to an account is not the same as</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">holding every secret behind it.</text>
  <g data-f="1" transform="translate(0,314)">
    <circle cx="240" cy="200" r="200" fill="#fff7ed" fill-opacity="0.75" stroke="#ea580c" stroke-width="4"/>
    <circle cx="153" cy="120" r="30" fill="#0f172a" opacity="0.13"/><circle cx="150" cy="115" r="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="150" cy="115" r="19" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="200" y="50" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:800;fill:#9a3412">POSSESSION</text>
    <rect x="40" y="628" width="640" height="112" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="66" cy="658" r="18" fill="#ea580c"/><text x="66" y="664" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="94" y="664" text-anchor="start" style="font-size:26px;font-weight:800;fill:#ea580c">Holding it</text><text x="56" y="700" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Whoever has the tag in their hand or bag.</tspan><tspan x="56" dy="27">That alone opens nothing.</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,314)">
    <circle cx="480" cy="200" r="200" fill="#eff6ff" fill-opacity="0.75" stroke="#2563eb" stroke-width="4"/>
    <path d="M544,140 a22,22 0 0 1 2,-38 a29,29 0 0 1 55,-7 a20,20 0 0 1 4,45 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
    <text x="520" y="50" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:800;fill:#1e40af">ACCOUNT</text>
    <rect x="40" y="750" width="640" height="112" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="780" r="18" fill="#2563eb"/><text x="66" y="786" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="94" y="786" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">The linked account</text><text x="56" y="822" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">The one account the tag is registered to</tspan><tspan x="56" dy="27">(Scene 31). It decides who may ask.</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <circle cx="360" cy="408" r="200" fill="#f5f3ff" fill-opacity="0.75" stroke="#7c3aed" stroke-width="4"/>
    <circle cx="312" cy="490" r="16" fill="none" stroke="#7c3aed" stroke-width="6.3"/><path d="M328,490 L395,490 M377,490 L377,504 M389,490 L389,501" fill="none" stroke="#7c3aed" stroke-width="6.3" stroke-linecap="round"/>
    <text x="360" y="552" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:800;fill:#6b21a8">KEYS</text>
    <rect x="40" y="872" width="640" height="139" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="66" cy="902" r="18" fill="#7c3aed"/><text x="66" y="908" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="94" y="908" text-anchor="start" style="font-size:26px;font-weight:800;fill:#7c3aed">The private keys</text><text x="56" y="944" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Whoever holds them can open the sealed location</tspan><tspan x="56" dy="27">reports. They live only on trusted devices</tspan><tspan x="56" dy="27">(Scene 43).</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,314)">
    <text x="360" y="240" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">rightful</text>
    <text x="360" y="264" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">owner,</text>
    <text x="360" y="288" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">trusted</text>
    <text x="360" y="312" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">device</text>
    <text x="150" y="180" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#334155">a finder</text>
    <text x="150" y="204" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#334155">or thief:</text>
    <text x="150" y="234" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#334155">holds it,</text>
    <text x="150" y="258" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#334155">reads nothing</text>
    <text x="570" y="180" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#334155">new device</text>
    <text x="570" y="204" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#334155">signed in:</text>
    <text x="570" y="234" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#334155">keys only</text>
    <text x="570" y="258" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#334155">once trusted</text>
    <text x="468" y="316" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#334155">owner far</text>
    <text x="468" y="340" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#334155">away:</text>
    <text x="468" y="364" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#334155">sees</text>
    <text x="468" y="388" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#334155">sightings</text>
    <rect x="40" y="1021" width="640" height="139" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="66" cy="1051" r="18" fill="#334155"/><text x="66" y="1057" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="94" y="1057" text-anchor="start" style="font-size:26px;font-weight:800;fill:#334155">The overlaps matter</text><text x="56" y="1093" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Possession without keys reads nothing. An account</tspan><tspan x="56" dy="27">sign-in on a new device is not, by itself, access to</tspan><tspan x="56" dy="27">end-to-end keys: the device must be trusted first.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1496" x2="680" y2="1496" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1526" class="note">Conceptual. Overlap labels follow Apple’s documented</text>
    <text x="40" y="1553" class="note">Find My design.</text>
  </g>
</svg>
