<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1444" width="720" height="1444" font-family="Inter, Arial, sans-serif">
  <title>Scene 24: The whisper is a pulse, not a stream</title>
  <desc>Five frames. A chart of the tracker’s supply current against time: a low sleep current of a few microamps; a brief advertising event in which the radio transmits the same short packet on three channels in a few milliseconds, at a few milliamps; the events repeating after an advertising interval plus a small random delay; the average current, a dashed line only just above sleep, set mostly by how often the tracker speaks; and a worked example of average current and power with illustrative values.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1444"/>
  <text x="40" y="50" class="k">SCENE 24</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The whisper is a pulse,</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">not a stream</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Asleep almost all the time; awake for a few</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">milliseconds to speak. Values are illustrative.</text>
  <g transform="translate(0,262)">
    <path d="M130,50 L130,370 L650,370" fill="none" stroke="#334155" stroke-width="3"/><path d="M650,362 L666,370 L650,378 Z" fill="#334155"/><path d="M122,50 L130,34 L138,50 Z" fill="#334155"/>
    <text x="680" y="406" text-anchor="end" style="font-size:21px;font-weight:700;fill:#334155">time →</text>
    <text x="118" y="22" text-anchor="start" style="font-size:21px;font-weight:700;fill:#334155">supply current</text>
    <path d="M120,290 l20,-8 M120,300 l20,-8" stroke="#334155" stroke-width="2"/>
    <text x="112" y="264" text-anchor="end" style="font-size:20px;font-weight:400;fill:#475569"><tspan x="112" dy="0">axis</tspan><tspan x="112" dy="26">broken</tspan></text>
  </g>
  <g data-f="1" transform="translate(0,262)">
    <path d="M130,360 L640,360" stroke="#16a34a" stroke-width="4"/>
    <text x="148" y="308" text-anchor="start" style="font-size:20px;font-weight:700;fill:#166534"><tspan x="148" dy="0">sleep:</tspan><tspan x="148" dy="26">a few µA</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="235" y="100" width="20" height="260" fill="#1d4ed8"/>
    <text x="265" y="116" text-anchor="start" style="font-size:21px;font-weight:700;fill:#1e3a8a"><tspan x="265" dy="0">advertising</tspan><tspan x="265" dy="27">event</tspan></text>
    <text x="265" y="178" text-anchor="start" style="font-size:20px;font-weight:400;fill:#334155"><tspan x="265" dy="0">a few mA</tspan><tspan x="265" dy="26">for a few ms</tspan></text>
    <rect x="40" y="520" width="640" height="262" rx="14" class="boxw"/>
    <text x="64" y="556" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Zoom: one advertising event</text>
    <rect x="120" y="580" width="90" height="110" rx="4" fill="#1d4ed8"/>
    <text x="165" y="718" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#1e3a8a">ch 37</text>
    <rect x="310" y="580" width="90" height="110" rx="4" fill="#1d4ed8"/>
    <text x="355" y="718" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#1e3a8a">ch 38</text>
    <rect x="500" y="580" width="90" height="110" rx="4" fill="#1d4ed8"/>
    <text x="545" y="718" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#1e3a8a">ch 39</text>
    <path d="M64,690 L656,690" stroke="#16a34a" stroke-width="3"/>
    <text x="64" y="758" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">Same packet on three channels; ≈ a few ms total</text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="442" y="100" width="20" height="260" fill="#1d4ed8"/>
    <rect x="622" y="100" width="20" height="260" fill="#1d4ed8"/>
    <path d="M245,400 L452,400" stroke="#334155" stroke-width="2"/><path d="M245,392 l0,16 M452,392 l0,16" stroke="#334155" stroke-width="2"/>
    <text x="40" y="438" text-anchor="start" style="font-size:21px;font-weight:700;fill:#334155">interval T (illustrative) + random 0–10 ms</text>
    <text x="40" y="468" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">the random delay stops two devices</text>
    <text x="40" y="494" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">colliding again and again</text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <path d="M130,342 L640,342" stroke="#c2410c" stroke-width="3" stroke-dasharray="12 8"/>
    <text x="263" y="330" text-anchor="start" style="font-size:20px;font-weight:800;fill:#9a3412">average current</text>
    <rect x="40" y="798" width="640" height="140" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="66" cy="828" r="18" fill="#ea580c"/><text x="66" y="834" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="94" y="834" text-anchor="start" style="font-size:26px;font-weight:800;fill:#ea580c">Average current</text><text x="56" y="870" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">I_avg = (I_tx × t_on + I_sleep × (T − t_on)) / T</tspan><tspan x="56" dy="27">Set mostly by how often it speaks (T), not how loudly.</tspan><tspan x="56" dy="27">Speak twice as often → roughly twice the radio drain.</tspan></text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="952" width="640" height="140" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="982" r="18" fill="#2563eb"/><text x="66" y="988" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="94" y="988" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">Worked example (illustrative values)</text><text x="56" y="1024" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">I_tx = 6 mA, t_on = 3 ms, T = 2 s, I_sleep = 2 µA</tspan><tspan x="56" dy="27">I_avg ≈ (18 µA·s + 4 µA·s) / 2 s ≈ 11 µA</tspan><tspan x="56" dy="27">Power ≈ 3 V × 11 µA ≈ 33 µW (radio and sleep only)</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1377" x2="680" y2="1377" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1407" class="note">Not to scale. Not a measurement of any product.</text>
  </g>
</svg>
