<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1562" width="720" height="1562" font-family="Inter, Arial, sans-serif">
  <title>Scene 78: Three clocks: shelf life, migration time, and the unknown</title>
  <desc>Five frames. 1, clock x: how long the data must stay secret (its shelf life). 2, clock y: how long migrating the systems that protect it will take. 3, clock z: how long until a cryptographically relevant quantum computer exists — drawn as an unknown band with no date, because published estimates disagree and none is a fact. 4, the rule (Mosca, 2015): if x + y is larger than z, data encrypted today is at risk; since z is unknown, the useful question is whether x + y is long. 5, prioritise by sensitivity and exposure: a card’s transaction cryptogram matters for minutes; a tracker’s location history for weeks, and patterns of life for longer; account backups and signed firmware (whose concern is authenticity) for years.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1562"/>
  <text x="40" y="50" class="k">SCENE 78</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Three clocks: shelf life,</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">migration time, and the</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">unknown</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">No Q-day dates here. Ask how long data must stay</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">secret, and how long change will take.</text>
  <g data-f="1" transform="translate(0,314)">
    <circle cx="102" cy="64" r="58" fill="#ffffff" stroke="#2563eb" stroke-width="5"/><path d="M102.0,16.0 L102.0,9.0" stroke="#2563eb" stroke-width="2"/><path d="M126.0,22.4 L129.5,16.4" stroke="#2563eb" stroke-width="2"/><path d="M143.6,40.0 L149.6,36.5" stroke="#2563eb" stroke-width="2"/><path d="M150.0,64.0 L157.0,64.0" stroke="#2563eb" stroke-width="2"/><path d="M143.6,88.0 L149.6,91.5" stroke="#2563eb" stroke-width="2"/><path d="M126.0,105.6 L129.5,111.6" stroke="#2563eb" stroke-width="2"/><path d="M102.0,112.0 L102.0,119.0" stroke="#2563eb" stroke-width="2"/><path d="M78.0,105.6 L74.5,111.6" stroke="#2563eb" stroke-width="2"/><path d="M60.4,88.0 L54.4,91.5" stroke="#2563eb" stroke-width="2"/><path d="M54.0,64.0 L47.0,64.0" stroke="#2563eb" stroke-width="2"/><path d="M60.4,40.0 L54.4,36.5" stroke="#2563eb" stroke-width="2"/><path d="M78.0,22.4 L74.5,16.4" stroke="#2563eb" stroke-width="2"/><path d="M102,64 L133.1,82.0" stroke="#14213d" stroke-width="5" stroke-linecap="round"/><path d="M102,64 L102,18.8" stroke="#14213d" stroke-width="3" stroke-linecap="round"/><circle cx="102" cy="64" r="6" fill="#14213d"/>
    <text x="196" y="34" text-anchor="start" style="font-size:24px;font-weight:800;fill:#2563eb">x: shelf life</text>
    <text x="196" y="68" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">How long must this data stay secret?</text>
  </g>
  <g data-f="2" transform="translate(0,314)">
    <circle cx="102" cy="204" r="58" fill="#ffffff" stroke="#ea580c" stroke-width="5"/><path d="M102.0,156.0 L102.0,149.0" stroke="#ea580c" stroke-width="2"/><path d="M126.0,162.4 L129.5,156.4" stroke="#ea580c" stroke-width="2"/><path d="M143.6,180.0 L149.6,176.5" stroke="#ea580c" stroke-width="2"/><path d="M150.0,204.0 L157.0,204.0" stroke="#ea580c" stroke-width="2"/><path d="M143.6,228.0 L149.6,231.5" stroke="#ea580c" stroke-width="2"/><path d="M126.0,245.6 L129.5,251.6" stroke="#ea580c" stroke-width="2"/><path d="M102.0,252.0 L102.0,259.0" stroke="#ea580c" stroke-width="2"/><path d="M78.0,245.6 L74.5,251.6" stroke="#ea580c" stroke-width="2"/><path d="M60.4,228.0 L54.4,231.5" stroke="#ea580c" stroke-width="2"/><path d="M54.0,204.0 L47.0,204.0" stroke="#ea580c" stroke-width="2"/><path d="M60.4,180.0 L54.4,176.5" stroke="#ea580c" stroke-width="2"/><path d="M78.0,162.4 L74.5,156.4" stroke="#ea580c" stroke-width="2"/><path d="M102,204 L78.9,231.5" stroke="#14213d" stroke-width="5" stroke-linecap="round"/><path d="M102,204 L102,158.8" stroke="#14213d" stroke-width="3" stroke-linecap="round"/><circle cx="102" cy="204" r="6" fill="#14213d"/>
    <text x="196" y="174" text-anchor="start" style="font-size:24px;font-weight:800;fill:#ea580c">y: migration time</text>
    <text x="196" y="208" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">How long will changing every system take?</text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <circle cx="102" cy="344" r="58" fill="#ffffff" stroke="#6b7280" stroke-width="5" stroke-dasharray="10 7"/><path d="M102.0,296.0 L102.0,289.0" stroke="#6b7280" stroke-width="2"/><path d="M126.0,302.4 L129.5,296.4" stroke="#6b7280" stroke-width="2"/><path d="M143.6,320.0 L149.6,316.5" stroke="#6b7280" stroke-width="2"/><path d="M150.0,344.0 L157.0,344.0" stroke="#6b7280" stroke-width="2"/><path d="M143.6,368.0 L149.6,371.5" stroke="#6b7280" stroke-width="2"/><path d="M126.0,385.6 L129.5,391.6" stroke="#6b7280" stroke-width="2"/><path d="M102.0,392.0 L102.0,399.0" stroke="#6b7280" stroke-width="2"/><path d="M78.0,385.6 L74.5,391.6" stroke="#6b7280" stroke-width="2"/><path d="M60.4,368.0 L54.4,371.5" stroke="#6b7280" stroke-width="2"/><path d="M54.0,344.0 L47.0,344.0" stroke="#6b7280" stroke-width="2"/><path d="M60.4,320.0 L54.4,316.5" stroke="#6b7280" stroke-width="2"/><path d="M78.0,302.4 L74.5,296.4" stroke="#6b7280" stroke-width="2"/><text x="102" y="358" text-anchor="middle" style="font-size:43.5px;font-weight:800;fill:#6b7280">?</text>
    <text x="196" y="314" text-anchor="start" style="font-size:24px;font-weight:800;fill:#6b7280">z: unknown</text>
    <text x="196" y="348" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Until a quantum computer that matters for</text><text x="196" y="375" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">cryptography exists. Estimates disagree: no date.</text>
  </g>
  <g data-f="4" transform="translate(0,314)">
    <rect x="40" y="424" width="640" height="186" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="70" cy="458" r="18" fill="#7c3aed"/><text x="70" y="464" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="100" y="466" text-anchor="start" style="font-size:24px;font-weight:800;fill:#6d28d9">The rule</text>
    <text x="660" y="472" text-anchor="end" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:34px;font-weight:800;fill:#14213d">x + y  &gt;  z</text>
    <text x="62" y="512" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">→ data encrypted today is at risk.</text><text x="62" y="539" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">z is unknown, so ask instead:</text><text x="62" y="566" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">is x + y long? Then start now.</text><text x="62" y="593" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">(Mosca, 2015)</text>
  </g>
  <g data-f="5" transform="translate(0,314)">
    <circle cx="58" cy="650" r="18" fill="#0d9488"/><text x="58" y="656" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="86" y="658" text-anchor="start" style="font-size:24px;font-weight:800;fill:#0f766e">Prioritise by</text>
    <text x="40" y="692" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">sensitivity and exposure, not by a guessed date.</text><text x="40" y="719" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Signed firmware is about authenticity: a forged</text><text x="40" y="746" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">signature would matter only after z arrives.</text>
    <rect x="40" y="790" width="640" height="64" rx="10" fill="#eef2ff" stroke="#e2e8f0"/>
    <text x="56" y="817" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">What</text><text x="664" y="817" text-anchor="end" style="font-size:21px;font-weight:800;fill:#14213d">Priority</text><text x="56" y="844" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Must stay protected for</text><text x="664" y="844" text-anchor="end" style="font-size:21px;font-weight:800;fill:#14213d">x + y</text>
    <rect x="40" y="860" width="640" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="56" y="887" text-anchor="start" style="font-size:21px;font-weight:700;fill:#14213d">Card transaction cryptogram</text><text x="664" y="887" text-anchor="end" style="font-size:21px;font-weight:800;fill:#166534">low</text><text x="56" y="914" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">minutes</text><text x="664" y="914" text-anchor="end" style="font-size:21px;font-weight:500;fill:#334155">short</text>
    <rect x="40" y="930" width="640" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="957" text-anchor="start" style="font-size:21px;font-weight:700;fill:#14213d">Tracker location history</text><text x="664" y="957" text-anchor="end" style="font-size:21px;font-weight:800;fill:#b45309">medium</text><text x="56" y="984" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">weeks; patterns of life longer</text><text x="664" y="984" text-anchor="end" style="font-size:21px;font-weight:500;fill:#334155">medium</text>
    <rect x="40" y="1000" width="640" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="56" y="1027" text-anchor="start" style="font-size:21px;font-weight:700;fill:#14213d">Account backups</text><text x="664" y="1027" text-anchor="end" style="font-size:21px;font-weight:800;fill:#b91c1c">high</text><text x="56" y="1054" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">years</text><text x="664" y="1054" text-anchor="end" style="font-size:21px;font-weight:500;fill:#334155">long</text>
    <rect x="40" y="1070" width="640" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="1097" text-anchor="start" style="font-size:21px;font-weight:700;fill:#14213d">Signed firmware (authenticity)</text><text x="664" y="1097" text-anchor="end" style="font-size:21px;font-weight:800;fill:#b91c1c">high</text><text x="56" y="1124" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">device lifetime</text><text x="664" y="1124" text-anchor="end" style="font-size:21px;font-weight:500;fill:#334155">long</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1468" x2="680" y2="1468" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1498" class="note">Concept (Mosca’s inequality). Shelf lives are typical</text>
    <text x="40" y="1525" class="note">examples, not measurements.</text>
  </g>
</svg>
