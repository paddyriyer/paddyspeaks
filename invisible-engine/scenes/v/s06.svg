<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1454" width="720" height="1454" font-family="Inter, Arial, sans-serif">
  <title>Scene 06: An energy budget: sleep, a short burst, sleep again</title>
  <desc>Four frames. A plot of current against time with a low sleep current and short radio bursts; the duty cycle as active time over period; the average-current formula; and an illustrative coin-cell lifetime estimate with its assumptions. All numbers are illustrative, not any product.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1454"/>
  <text x="40" y="50" class="k">SCENE 06</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">An energy budget: sleep,</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">a short burst, sleep</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">again</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">A tiny average comes from being asleep almost all</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">the time. All values illustrative.</text>
  <g data-f="1" transform="translate(0,314)">
    <rect x="40" y="0" width="640" height="372" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="82" cy="44" r="26" fill="#334155"/><text x="82" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="122" y="54" text-anchor="start" style="font-size:26px;font-weight:800;fill:#14213d">Current over time</text>
    <line x1="152" y1="290" x2="650" y2="290" stroke="#334155" stroke-width="3"/><line x1="152" y1="290" x2="152" y2="96" stroke="#334155" stroke-width="3"/>
    <text x="142" y="112" text-anchor="end" style="font-size:21px;font-weight:600;fill:#475569">current</text>
    <text x="650" y="322" text-anchor="end" style="font-size:21px;font-weight:600;fill:#475569">time →</text>
    <path d="M152,272 L262,272 L262,128 L274,128 L274,272 L448,272 L448,128 L460,128 L460,272 L634,272 L634,128 L646,128 L646,272 L650,272" fill="none" stroke="#c2410c" stroke-width="4"/>
    <text x="361" y="260" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#9a3412">sleep (µA)</text>
    <text x="270" y="116" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#9a3412">radio burst (mA)</text>
  </g>
  <g data-f="2" transform="translate(0,314)">
    <path d="M262,306 L262,318 L448,318 L448,306" fill="none" stroke="#14213d" stroke-width="2"/>
    <text x="355" y="348" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#14213d">period T</text>
    <rect x="40" y="388" width="640" height="116" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="418" r="18" fill="#2563eb"/><text x="66" y="424" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="94" y="424" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">Duty cycle</text><text x="56" y="460" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">D = t_on / T</tspan><tspan x="56" dy="27">active time ÷ period</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <rect x="40" y="520" width="640" height="143" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="66" cy="550" r="18" fill="#7c3aed"/><text x="66" y="556" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="94" y="556" text-anchor="start" style="font-size:26px;font-weight:800;fill:#7c3aed">Average current</text><text x="56" y="592" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">I_avg ≈ D·I_active</tspan><tspan x="56" dy="27">        + (1 − D)·I_sleep</tspan><tspan x="56" dy="27">ignores wake overhead, sensors</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,314)">
    <circle cx="110" cy="746" r="66" fill="#e5e7eb" stroke="#6b7280" stroke-width="4"/><circle cx="110" cy="746" r="53" fill="none" stroke="#9ca3af" stroke-width="2"/><text x="110" y="752" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#374151">CR2032</text>
    <text x="196" y="740" text-anchor="start" style="font-size:22px;font-weight:800;fill:#334155">220 mAh</text>
    <text x="196" y="768" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569">nominal</text>
    <rect x="40" y="828" width="640" height="206" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="66" cy="858" r="18" fill="#b45309"/><text x="66" y="864" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="94" y="864" text-anchor="start" style="font-size:26px;font-weight:800;fill:#b45309">Illustrative only — not a product</text><text x="56" y="900" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">8 mA for 2 ms every 1 s, and 2 µA asleep:</tspan><tspan x="56" dy="27">D = 0.002 → I_avg ≈ 16 µA + 2 µA ≈ 18 µA</tspan><tspan x="56" dy="27">220 mAh ÷ 0.018 mA ≈ 12,000 h ≈ 1.4 years —</tspan><tspan x="56" dy="27">before temperature, self-discharge, pulse-capacity</tspan><tspan x="56" dy="27">limits and everything else the device does.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1387" x2="680" y2="1387" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1417" class="note">Illustrative values, not a measured product.</text>
  </g>
</svg>
