<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1384" width="720" height="1384" font-family="Inter, Arial, sans-serif">
  <title>Scene 08: The wireless map: what each technology is for</title>
  <desc>Three frames revealing rows of a comparison table: radio-frequency identification families; near-field communication, Bluetooth Low Energy and Ultra Wideband; then Wi-Fi and cellular positioning and satellite navigation. Columns give power source, band, real job, typical range and a privacy note.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1384"/>
  <text x="40" y="50" class="k">SCENE 08</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The wireless map: what</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">each technology is for</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Only the last two rows answer “where on Earth?” —</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">for the device doing the receiving.</text>
  <g transform="translate(0,262)">
    <rect x="40" y="0" width="640" height="106" rx="10" fill="#0f172a"/>
    <text x="84" y="30" text-anchor="start" style="font-size:20px;font-weight:800;fill:#ffffff">Technology</text>
    <text x="384" y="30" text-anchor="start" style="font-size:20px;font-weight:800;fill:#ffffff">Privacy note</text>
    <text x="84" y="62" text-anchor="start" style="font-size:20px;font-weight:800;fill:#ffffff">Power</text>
    <text x="384" y="62" text-anchor="start" style="font-size:20px;font-weight:800;fill:#ffffff">Band</text>
    <text x="84" y="94" text-anchor="start" style="font-size:20px;font-weight:800;fill:#ffffff">Real job</text>
    <text x="384" y="94" text-anchor="start" style="font-size:20px;font-weight:800;fill:#ffffff">Range (typical)</text>
  </g>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="114" width="640" height="104" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <circle cx="62" cy="140" r="11" fill="#b45309"/>
    <text x="84" y="148" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">LF / HF RFID</text>
    <text x="384" y="148" text-anchor="start" style="font-size:21px;font-weight:600;fill:#334155">fixed IDs can be read</text>
    <text x="84" y="178" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">reader field</text>
    <text x="384" y="178" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">125 kHz · 13.56 MHz</text>
    <text x="84" y="206" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">identify at a reader</text>
    <text x="384" y="206" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">cm</text>
    <rect x="40" y="226" width="640" height="104" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <circle cx="62" cy="252" r="11" fill="#b45309"/>
    <text x="84" y="260" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">UHF RFID</text>
    <text x="384" y="260" text-anchor="start" style="font-size:21px;font-weight:600;fill:#334155">may outlive the sale</text>
    <text x="84" y="290" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">reader field</text>
    <text x="384" y="290" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">~860–960 MHz</text>
    <text x="84" y="318" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">inventory at portals</text>
    <text x="384" y="318" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">up to metres</text>
    <rect x="40" y="338" width="640" height="104" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <circle cx="62" cy="364" r="11" fill="#b45309"/>
    <text x="84" y="372" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Active RFID</text>
    <text x="384" y="372" text-anchor="start" style="font-size:21px;font-weight:600;fill:#334155">on-site beacon</text>
    <text x="84" y="402" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">battery</text>
    <text x="384" y="402" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">433 MHz / 2.4 GHz</text>
    <text x="84" y="430" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">site asset tracking</text>
    <text x="384" y="430" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">tens of m</text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="40" y="450" width="640" height="104" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <circle cx="62" cy="476" r="11" fill="#ea580c"/>
    <text x="84" y="484" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">NFC</text>
    <text x="384" y="484" text-anchor="start" style="font-size:21px;font-weight:600;fill:#334155">readable by tap</text>
    <text x="84" y="514" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">reader field (tags)</text>
    <text x="384" y="514" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">13.56 MHz</text>
    <text x="84" y="542" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">tap: pay, access, read</text>
    <text x="384" y="542" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">a few cm</text>
    <rect x="40" y="562" width="640" height="104" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="62" cy="588" r="11" fill="#2563eb"/>
    <text x="84" y="596" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Bluetooth LE</text>
    <text x="384" y="596" text-anchor="start" style="font-size:21px;font-weight:600;fill:#334155">IDs must rotate</text>
    <text x="84" y="626" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">battery</text>
    <text x="384" y="626" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">2.4 GHz</text>
    <text x="84" y="654" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">presence, data, beacons</text>
    <text x="384" y="654" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">~1 to tens of m</text>
    <rect x="40" y="674" width="640" height="104" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <circle cx="62" cy="700" r="11" fill="#7c3aed"/>
    <text x="84" y="708" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">UWB</text>
    <text x="384" y="708" text-anchor="start" style="font-size:21px;font-weight:600;fill:#334155">precise, but local</text>
    <text x="84" y="738" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">battery</text>
    <text x="384" y="738" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">~6.5 / 8 GHz</text>
    <text x="84" y="766" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">distance + direction</text>
    <text x="384" y="766" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">up to tens of m</text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="40" y="786" width="640" height="104" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
    <circle cx="62" cy="812" r="11" fill="#0d9488"/>
    <text x="84" y="820" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">Wi-Fi / cell position</text>
    <text x="384" y="820" text-anchor="start" style="font-size:21px;font-weight:600;fill:#334155">databases from phones</text>
    <text x="84" y="850" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">phone battery</text>
    <text x="384" y="850" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Wi-Fi · cellular</text>
    <text x="84" y="878" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">phone finds itself</text>
    <text x="384" y="878" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">building to city</text>
    <rect x="40" y="898" width="640" height="104" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="62" cy="924" r="11" fill="#16a34a"/>
    <text x="84" y="932" text-anchor="start" style="font-size:22px;font-weight:800;fill:#14213d">GNSS (GPS etc.)</text>
    <text x="384" y="932" text-anchor="start" style="font-size:21px;font-weight:600;fill:#334155">only if reported</text>
    <text x="84" y="962" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">receiver battery</text>
    <text x="384" y="962" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">~1.2–1.6 GHz</text>
    <text x="84" y="990" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">receiver finds itself</text>
    <text x="384" y="990" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">global, outdoors</text>
    <text x="40" y="1032" text-anchor="start" style="font-style:italic;font-size:20px;font-weight:400;fill:#475569"><tspan x="40" dy="0">Ranges are typical working distances, not limits:</tspan><tspan x="40" dy="26">antennas, power, bodies, walls and rules move them.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1352" x2="680" y2="1352" stroke="#e2e8f0" stroke-width="2"/>
  </g>
</svg>
