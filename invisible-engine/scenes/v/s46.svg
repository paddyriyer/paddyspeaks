    <text x="106" y="916.0" text-anchor="start" style="font-size:20px;font-weight:400;fill:#4b5563">○ no</text>
    <text x="306" y="916.0" text-anchor="start" style="font-size:20px;font-weight:400;fill:#374151">? undisclosed</text>
    <text x="496" y="916.0" text-anchor="start" style="font-size:20px;font-weight:400;fill:#4b5563">○ no</text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="470" width="640" height="54" rx="8" class="hz"/>
    <circle cx="58" cy="497.0" r="13" fill="#334155"/><text x="58" y="502" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#ffffff">8</text>
    <text x="80" y="492.0" text-anchor="start" style="font-size:20px;font-weight:700;fill:#14213d"><tspan x="80" dy="0">Outside</tspan><tspan x="80" dy="26">attacker</tspan></text>
