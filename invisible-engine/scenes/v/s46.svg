    <text x="40" y="1080" text-anchor="start" style="font-size:21px;font-weight:400;fill:#475569"><tspan x="40" dy="0">● yes   ○ no   ≈ metadata only   ? not publicly documented.</tspan><tspan x="40" dy="27">Agrees with Module 5, demo D.</tspan></text>
