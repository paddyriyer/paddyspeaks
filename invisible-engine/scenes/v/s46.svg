<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1570" width="720" height="1570" font-family="Inter, Arial, sans-serif">
  <title>Scene 46: Who can see what: one table, eight observers</title>
  <desc>Four frames revealing a table for Apple’s documented Find My design. Columns: the radio identifier, the approximate location, the owner’s identity, the finder’s identity, the sealed report and service metadata. 1, the tag sees only its own identifier; the passer-by’s phone sees the identifier, its own location, itself, and the report it made; a nearby radio listener sees only the identifier. 2, the relay operator sees a lookup hash, the sealed report and metadata, never the location; an internet provider sees only that connections happened. 3, the owner sees the location after decrypting and knows their own account; a person the owner shares with can see the location. 4, an outside attacker without the account or keys sees only what any radio listener sees, unless they take over the account (Scene 48).</desc>
