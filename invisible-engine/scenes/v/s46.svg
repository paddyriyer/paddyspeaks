    <text x="382" y="25" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d"><tspan x="382" dy="0">Approx.</tspan><tspan x="382" dy="26">location</tspan></text>
    <text x="506" y="25" text-anchor="start" style="font-size:20px;font-weight:800;fill:#14213d"><tspan x="506" dy="0">Owner</tspan><tspan x="506" dy="26">identity</tspan></text>
