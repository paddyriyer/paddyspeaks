  <rect class="bg" width="720" height="1570"/>
  <text x="40" y="50" class="k">SCENE 46</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Who can see what: one</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">table, eight observers</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Apple Find My, as documented. Other ecosystems are</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">compared in Scene 47.</text>
