<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1425" width="720" height="1425" font-family="Inter, Arial, sans-serif">
  <title>Scene 33: Far-away luggage: a tag that does not know where it is</title>
  <desc>Four frames. A suitcase with an item tracker is left on a station platform while its owner is far away; the tag has no satellite receiver and no cellular connection, shown crossed out; what it does have is a coin cell and a Bluetooth Low Energy radio that whispers a short advertisement over and over; and a question: who knows where it is? Someone else’s phone, in the next scene.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1425"/>
  <text x="40" y="50" class="k">SCENE 33</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Far-away luggage: a tag</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">that does not know where</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">it is</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">No map, no satellite, no SIM. Just a coin cell and</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">a short-range whisper.</text>
  <g data-f="1" transform="translate(0,314)">
    <rect x="40" y="410" width="640" height="34" fill="#cbd5e1"/><rect x="40" y="444" width="640" height="14" fill="#94a3b8"/><path d="M40,474 L680,474 M40,498 L680,498" stroke="#64748b" stroke-width="5"/>
    <rect x="40" y="150" width="190" height="62" rx="8" fill="#1e3a8a"/>
    <text x="135" y="190" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#ffffff">Platform 3</text>
    <path d="M135,212 L135,410" stroke="#334155" stroke-width="6"/>
    <path d="M290,216 L290,180 L344,180 L344,216" fill="none" stroke="#334155" stroke-width="5.4"/><rect x="255" y="223" width="135" height="171" rx="16" fill="#0f172a" opacity="0.13"/><rect x="250" y="216" width="135" height="171" rx="16" fill="#0e7490"/><path d="M290,229 L290,374" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4.5"/><path d="M318,229 L318,374" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4.5"/><path d="M344,229 L344,374" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4.5"/><circle cx="277" cy="398" r="10" fill="#334155"/><circle cx="358" cy="398" r="10" fill="#334155"/>
    <circle cx="439" cy="265" r="30" fill="#0f172a" opacity="0.13"/><circle cx="436" cy="260" r="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="436" cy="260" r="19" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M406,260 L385,260" stroke="#334155" stroke-width="3"/>
    <circle cx="620" cy="17" r="17" fill="#64748b"/><path d="M596,101 L596,58 Q596,40 613,40 L627,40 Q644,40 644,58 L644,101 Z" fill="#64748b"/><rect x="601" y="95" width="14" height="63" rx="6" fill="#64748b"/><rect x="624" y="95" width="14" height="63" rx="6" fill="#64748b"/><rect x="644" y="66" width="13" height="23" rx="3" fill="#111827" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="680" y="192" text-anchor="end" style="font-size:21px;font-weight:600;fill:#334155">the owner, 200 km away</text>
    <path d="M486,226 L650,206" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4 10"/>
    <rect x="40" y="530" width="640" height="116" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="66" cy="560" r="18" fill="#334155"/><text x="66" y="566" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="94" y="566" text-anchor="start" style="font-size:26px;font-weight:800;fill:#334155">Left behind</text><text x="56" y="602" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">The suitcase stays on the platform. The owner is</tspan><tspan x="56" dy="27">far away (illustrative).</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,314)">
    <rect x="286" y="30" width="28" height="20" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="242" y="32" width="40" height="16" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><rect x="318" y="32" width="40" height="16" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
    <circle cx="300" cy="96" r="22" fill="#ffffff" stroke="#475569" stroke-width="4"/><path d="M290,86 L310,106 M310,86 L290,106" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <path d="M428,140 L450,38 L472,140 M435,109 L465,109 M442,79 L458,79" fill="none" stroke="#475569" stroke-width="3.4" stroke-linejoin="round"/><circle cx="450" cy="38" r="5" fill="#475569"/><path d="M460,30 q6,8 0,17" fill="none" stroke="#475569" stroke-width="2.4" stroke-linecap="round" opacity="1.00"/><path d="M468,23 q10,15 0,31" fill="none" stroke="#475569" stroke-width="2.4" stroke-linecap="round" opacity="0.80"/><path d="M440,30 q-6,8 0,17" fill="none" stroke="#475569" stroke-width="2.4" stroke-linecap="round" opacity="1.00"/><path d="M432,23 q-10,15 0,31" fill="none" stroke="#475569" stroke-width="2.4" stroke-linecap="round" opacity="0.80"/>
    <circle cx="450" cy="96" r="22" fill="#ffffff" stroke="#475569" stroke-width="4"/><path d="M440,86 L460,106 M460,86 L440,106" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <rect x="40" y="658" width="640" height="116" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/><circle cx="66" cy="688" r="18" fill="#dc2626"/><text x="66" y="694" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="94" y="694" text-anchor="start" style="font-size:26px;font-weight:800;fill:#dc2626">No GPS, no cellular</text><text x="56" y="730" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">The tag has no satellite receiver and no SIM or</tspan><tspan x="56" dy="27">mobile modem. It cannot look itself up.</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <path d="M483,245 q11,15 0,31" fill="none" stroke="#2563eb" stroke-width="4.4" stroke-linecap="round" opacity="1.00"/><path d="M499,231 q18,29 0,57" fill="none" stroke="#2563eb" stroke-width="4.4" stroke-linecap="round" opacity="0.80"/><path d="M514,218 q24,42 0,84" fill="none" stroke="#2563eb" stroke-width="4.4" stroke-linecap="round" opacity="0.60"/>
    <circle cx="608" cy="300" r="64" fill="#e5e7eb" stroke="#6b7280" stroke-width="4"/><circle cx="608" cy="300" r="51" fill="none" stroke="#9ca3af" stroke-width="2"/><text x="608" y="306" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#374151">CR2032</text>
    <text x="608" y="396" text-anchor="middle" style="font-size:21px;font-weight:600;fill:#334155">coin cell</text>
    <rect x="40" y="786" width="640" height="116" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="66" cy="816" r="18" fill="#2563eb"/><text x="66" y="822" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="94" y="822" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">What it does have</text><text x="56" y="858" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">A Bluetooth Low Energy radio that repeats a short</tspan><tspan x="56" dy="27">advertisement, and a coin cell.</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,314)">
    <rect x="40" y="914" width="640" height="116" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="66" cy="944" r="18" fill="#16a34a"/><text x="66" y="950" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="94" y="950" text-anchor="start" style="font-size:26px;font-weight:800;fill:#16a34a">So who knows where it is?</text><text x="56" y="986" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Not the tag. A passing phone that knows where it is</tspan><tspan x="56" dy="27">itself — Scene 34.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1358" x2="680" y2="1358" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1388" class="note">Radio arcs illustrative.</text>
  </g>
</svg>
