<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1598" width="720" height="1598" font-family="Inter, Arial, sans-serif">
  <title>Scene 86: Three journeys, three different kinds of “wave”</title>
  <desc>Four frames compare three journeys. 1, energy harvested: a reader’s alternating magnetic field induces a current in a card’s coil a few centimetres away; physical energy moves. 2, a signal overheard: a tag radiates a short radio packet that any phone in range can receive without pairing; physical radio waves carry bits over metres. 3, amplitudes interfering: in H then Z then H, computed amplitudes go from 1 and 0, to 0.707 and 0.707, to 0.707 and −0.707, to 0 and 1; nothing ripples, the arithmetic of complex amplitudes adds and cancels. 4, a banner: induction, radio emission and quantum amplitude arithmetic share a vocabulary, not a mechanism.</desc>
