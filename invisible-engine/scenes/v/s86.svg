    <rect x="56" y="96" width="320" height="62" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/><text x="68" y="122" text-anchor="start" style="font-size:20px;font-weight:600;fill:#14213d"><tspan x="68" dy="0">What moves: energy, through</tspan><tspan x="68" dy="24">a magnetic field</tspan></text><rect x="56" y="164" width="320" height="62" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/><text x="68" y="190" text-anchor="start" style="font-size:20px;font-weight:400;fill:#14213d"><tspan x="68" dy="0">Physical: yes — a real</tspan><tspan x="68" dy="24">field, real current</tspan></text><rect x="56" y="232" width="320" height="38" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/><text x="68" y="258" text-anchor="start" style="font-size:20px;font-weight:400;fill:#14213d">Distance: a few centimetres</text><rect x="56" y="276" width="320" height="62" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/><text x="68" y="302" text-anchor="start" style="font-size:20px;font-weight:400;fill:#14213d"><tspan x="68" dy="0">Not: a broadcast, or a</tspan><tspan x="68" dy="24">battery</tspan></text>
