  <rect class="bg" width="720" height="1598"/>
  <text x="40" y="50" class="k">SCENE 86</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Three journeys, three</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">different kinds of “wave”</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Same word, three mechanisms: what is physical, and</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">what is mathematics.</text>
