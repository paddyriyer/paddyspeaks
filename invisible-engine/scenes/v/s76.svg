<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1324" width="720" height="1324" font-family="Inter, Arial, sans-serif">
  <title>Scene 76: Hybrid key exchange: two locks on one door</title>
  <desc>Five frames. 1, today a client and a server agree a key with classical elliptic-curve Diffie–Hellman (X25519). 2, a hybrid adds a post-quantum key encapsulation (ML-KEM-768) alongside it in the same handshake. 3, a combiner feeds both shared secrets, with the handshake transcript, into one key-derivation function, so the session key stays secret if either part holds. 4, downgrade prevention: an attacker in the middle who strips the post-quantum part is caught, because both sides check a hash of everything that was offered. 5, rollout states: classical only, then hybrid, then post-quantum only once confidence allows. Reviewed designs such as TLS’s X25519MLKEM768, not an improvised protocol.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1324"/>
  <text x="40" y="50" class="k">SCENE 76</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Hybrid key exchange: two</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">locks on one door</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">The session stays secret if either lock holds. Use</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">reviewed designs, never a home-made one.</text>
  <g transform="translate(0,262)">
    <rect x="45" y="23" width="100" height="200" rx="17" fill="#0f172a" opacity="0.14"/><rect x="40" y="16" width="100" height="200" rx="17" fill="#111827"/><rect x="46" y="22" width="88" height="188" rx="13" fill="#e0f2fe"/><rect x="76" y="26" width="28" height="7" rx="4" fill="#111827"/><text x="90" y="250" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#334155">client</text>
    <rect x="560" y="36" width="120" height="42" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="578" cy="57" r="5" fill="#22c55e"/><rect x="600" y="52" width="64" height="10" rx="3" fill="#94a3b8"/><rect x="560" y="86" width="120" height="42" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="578" cy="107" r="5" fill="#22c55e"/><rect x="600" y="102" width="64" height="10" rx="3" fill="#94a3b8"/><rect x="560" y="136" width="120" height="42" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="578" cy="157" r="5" fill="#22c55e"/><rect x="600" y="152" width="64" height="10" rx="3" fill="#94a3b8"/><text x="620" y="250" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#334155">server</text>
  </g>
  <g data-f="1" transform="translate(0,262)">
    <path d="M152,80 L548,80" class="a-crypto" marker-end="url(#m-crypto)" marker-start="url(#ms-crypto)"/>
    <rect x="236" y="42" width="229" height="32" rx="6" class="lab"/>
    <text x="350" y="64" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#7e22ce"><tspan x="350" dy="0">X25519 (classical)</tspan></text>
    <text x="350" y="116" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#6d28d9">shared secret 1</text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <path d="M152,178 L548,178" class="a-crypto" marker-end="url(#m-crypto)" marker-start="url(#ms-crypto)"/>
    <rect x="195" y="140" width="310" height="32" rx="6" class="lab"/>
    <text x="350" y="162" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#7e22ce"><tspan x="350" dy="0">ML-KEM-768 (post-quantum)</tspan></text>
    <text x="350" y="214" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#6d28d9">shared secret 2</text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="40" y="282" width="640" height="150" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="70" cy="316" r="18" fill="#7c3aed"/><text x="70" y="322" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="100" y="324" text-anchor="start" style="font-size:24px;font-weight:800;fill:#6d28d9">Combiner</text>
    <text x="360" y="372" text-anchor="middle" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:700;fill:#14213d">KDF(secret 1 ‖ secret 2 ‖ transcript)</text>
    <text x="360" y="410" text-anchor="middle" style="font-size:21px;font-weight:500;fill:#334155">→ one session key: secret if either part holds</text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="452" width="640" height="196" rx="14" class="hz"/>
    <circle cx="70" cy="486" r="18" fill="#dc2626"/><text x="70" y="492" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="100" y="494" text-anchor="start" style="font-size:24px;font-weight:800;fill:#b91c1c">Downgrade prevention</text>
    <text x="62" y="536" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">An attacker in the middle removes the post-quantum</text><text x="62" y="563" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">offer, hoping both sides fall back to classical</text><text x="62" y="590" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">only. Both sides hash the whole transcript of what</text><text x="62" y="617" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">was offered; the mismatch ends the handshake.</text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="668" width="640" height="240" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <circle cx="70" cy="702" r="18" fill="#16a34a"/><text x="70" y="708" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="100" y="710" text-anchor="start" style="font-size:24px;font-weight:800;fill:#166534">Rollout states</text>
    <rect x="60" y="732" width="170" height="54" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/><text x="145.0" y="766" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">classical only</text>
    <path d="M235,759 L255,759" stroke="#334155" stroke-width="3"/><path d="M254,751 L262,759 L254,767 Z" fill="#334155"/>
    <rect x="266" y="732" width="110" height="54" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="321.0" y="766" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">hybrid</text>
    <path d="M381,759 L401,759" stroke="#334155" stroke-width="3"/><path d="M400,751 L408,759 L400,767 Z" fill="#334155"/>
    <rect x="412" y="732" width="210" height="54" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="517.0" y="766" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">post-quantum only</text>
    <text x="62" y="820" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">Move on only when the newer state is measured and</text><text x="62" y="847" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">trusted. Use reviewed designs (e.g. TLS</text><text x="62" y="874" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">X25519MLKEM768), not a home-made one.</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1196" x2="680" y2="1196" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1226" class="note">Conceptual. The combiner shown is the pattern, not a</text>
    <text x="40" y="1253" class="note">protocol specification.</text>
    <path d="M40,1289 L74,1289" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="86" y="1294" class="s">Encrypted / cryptographic</text>
    <rect x="375.0" y="1280" width="34" height="18" rx="3" class="hz" style="stroke-width:3"/>
    <text x="421.0" y="1294" class="s">Attacker zone / hazard</text>
  </g>
</svg>
