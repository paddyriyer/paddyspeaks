    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1596"/>
  <text x="40" y="50" class="k">SCENE 27</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Why a tiny antenna is</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">enough — and when it is</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">not</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">At 2.4 GHz the wave is about 12 cm long. A quarter</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">of it fits inside a coin-sized tag.</text>
  <g data-f="1" transform="translate(0,314)">
    <rect x="40" y="0" width="640" height="244" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="82" cy="44" r="26" fill="#2563eb"/><text x="82" y="53" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">1</text><text x="122" y="54" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Wavelength at 2.44 GHz</text>
    <polyline points="70,128.0 72,127.0 74,126.1 76,125.1 78,124.1 80,123.2 82,122.2 84,121.2 86,120.3 88,119.4 90,118.4 92,117.5 94,116.6 96,115.7 98,114.8 100,113.9 102,113.0 104,112.1 106,111.3 108,110.4 110,109.6 112,108.8 114,108.0 116,107.2 118,106.5 120,105.7 122,105.0 124,104.3 126,103.6 128,103.0 130,102.3 132,101.7 134,101.1 136,100.5 138,99.9 140,99.4 142,98.9 144,98.4 146,97.9 148,97.5 150,97.1 152,96.7 154,96.3 156,96.0 158,95.7 160,95.4 162,95.1 164,94.9 166,94.7 168,94.5 170,94.3 172,94.2 174,94.1 176,94.1 178,94.0 180,94.0 182,94.0 184,94.1 186,94.1 188,94.2 190,94.3 192,94.5 194,94.7 196,94.9 198,95.1 200,95.4 202,95.7 204,96.0 206,96.3 208,96.7 210,97.1 212,97.5 214,97.9 216,98.4 218,98.9 220,99.4 222,99.9 224,100.5 226,101.1 228,101.7 230,102.3 232,103.0 234,103.6 236,104.3 238,105.0 240,105.7 242,106.5 244,107.2 246,108.0 248,108.8 250,109.6 252,110.4 254,111.3 256,112.1 258,113.0 260,113.9 262,114.8 264,115.7 266,116.6 268,117.5 270,118.4 272,119.4 274,120.3 276,121.2 278,122.2 280,123.2 282,124.1 284,125.1 286,126.1 288,127.0 290,128.0 292,129.0 294,129.9 296,130.9 298,131.9 300,132.8 302,133.8 304,134.8 306,135.7 308,136.6 310,137.6 312,138.5 314,139.4 316,140.3 318,141.2 320,142.1 322,143.0 324,143.9 326,144.7 328,145.6 330,146.4 332,147.2 334,148.0 336,148.8 338,149.5 340,150.3 342,151.0 344,151.7 346,152.4 348,153.0 350,153.7 352,154.3 354,154.9 356,155.5 358,156.1 360,156.6 362,157.1 364,157.6 366,158.1 368,158.5 370,158.9 372,159.3 374,159.7 376,160.0 378,160.3 380,160.6 382,160.9 384,161.1 386,161.3 388,161.5 390,161.7 392,161.8 394,161.9 396,161.9 398,162.0 400,162.0 402,162.0 404,161.9 406,161.9 408,161.8 410,161.7 412,161.5 414,161.3 416,161.1 418,160.9 420,160.6 422,160.3 424,160.0 426,159.7 428,159.3 430,158.9 432,158.5 434,158.1 436,157.6 438,157.1 440,156.6 442,156.1 444,155.5 446,154.9 448,154.3 450,153.7 452,153.0 454,152.4 456,151.7 458,151.0 460,150.3 462,149.5 464,148.8 466,148.0 468,147.2 470,146.4 472,145.6 474,144.7 476,143.9 478,143.0 480,142.1 482,141.2 484,140.3 486,139.4 488,138.5 490,137.6 492,136.6 494,135.7 496,134.8 498,133.8 500,132.8 502,131.9 504,130.9 506,129.9 508,129.0 510,128.0" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <path d="M70,196 L510,196" stroke="#334155" stroke-width="2"/><path d="M70,188 L70,204 M510,188 L510,204 M180,190 L180,202" stroke="#334155" stroke-width="2"/>
    <text x="290.0" y="228" text-anchor="middle" style="font-size:22px;font-weight:800;fill:#14213d">λ = c / f ≈ 12.3 cm</text>
    <text x="125.0" y="182" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#1e3a8a">λ/4 ≈ 3.1 cm</text>
    <circle cx="609" cy="133" r="46" fill="#0f172a" opacity="0.13"/><circle cx="606" cy="128" r="46" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="606" cy="128" r="29" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="606" y="204" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#334155">tag ≈ 3 cm</text>
  </g>
  <g data-f="2" transform="translate(0,314)">
    <rect x="40" y="254" width="640" height="180" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="66" cy="284" r="18" fill="#b45309"/><text x="66" y="290" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="94" y="290" text-anchor="start" style="font-size:26px;font-weight:800;fill:#b45309">Small antennas compromise</text><text x="56" y="326" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Smaller than ideal → less efficient and narrower in</tspan><tspan x="56" dy="27">frequency. A hand, a bag or metal nearby detunes</tspan><tspan x="56" dy="27">it. Designers trade size, battery and range; there</tspan><tspan x="56" dy="27">is no free lunch.</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <rect x="40" y="446" width="640" height="300" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="82" cy="490" r="26" fill="#334155"/><text x="82" y="499" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#ffffff">3</text><text x="122" y="500" text-anchor="start" style="font-size:24px;font-weight:800;fill:#14213d">Link budget (illustrative values)</text>
    <path d="M70,692 L616,692" stroke="#334155" stroke-width="2"/>
    <path d="M70,686 l0,12" stroke="#334155" stroke-width="2"/>
    <text x="70.0" y="722" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">-100</text>
    <path d="M174,686 l0,12" stroke="#334155" stroke-width="2"/>
    <text x="174.0" y="722" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">-80</text>
    <path d="M278,686 l0,12" stroke="#334155" stroke-width="2"/>
    <text x="278.0" y="722" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">-60</text>
    <path d="M382,686 l0,12" stroke="#334155" stroke-width="2"/>
    <text x="382.0" y="722" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">-40</text>
    <path d="M486,686 l0,12" stroke="#334155" stroke-width="2"/>
    <text x="486.0" y="722" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">-20</text>
    <path d="M590,686 l0,12" stroke="#334155" stroke-width="2"/>
    <text x="590.0" y="722" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#475569">0</text>
    <text x="622.0" y="722" text-anchor="start" style="font-size:20px;font-weight:700;fill:#475569">dBm</text>
    <rect x="70" y="530" width="520" height="32" rx="4" fill="#1d4ed8"/>
    <text x="580.0" y="553" text-anchor="end" style="font-size:20px;font-weight:700;fill:#ffffff">transmit 0 dBm</text>
    <rect x="70" y="570" width="208" height="32" rx="4" fill="#3b82f6"/>
    <text x="288.0" y="593" text-anchor="start" style="font-size:20px;font-weight:700;fill:#14213d">after 10 m free space (−60 dB)</text>
    <rect x="70" y="610" width="130" height="32" rx="4" fill="#93c5fd"/>
    <text x="210.0" y="633" text-anchor="start" style="font-size:20px;font-weight:700;fill:#14213d">after a body in the way (−15 dB)</text>
    <path d="M96,524 L96,682" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="106.0" y="672" text-anchor="start" style="font-size:20px;font-weight:700;fill:#b91c1c">receiver sensitivity ≈ −95 dBm → margin ≈ 20 dB</text>
  </g>
  <g data-f="4" transform="translate(0,314)">
    <rect x="40" y="758" width="640" height="240" rx="16" class="boxw"/>
    <text x="60" y="792" text-anchor="start" style="font-size:20px;font-weight:700;fill:#334155">Direct path: absorbed by a body (mostly water).</text>
    <text x="60" y="818" text-anchor="start" style="font-size:20px;font-weight:400;fill:#475569">A bounce off the floor may still arrive (multipath).</text>
    <path d="M60,980 L660,980" stroke="#a8a29e" stroke-width="6"/>
    <text x="660" y="968" text-anchor="end" style="font-size:20px;font-weight:700;fill:#57534e">floor</text>
    <circle cx="113" cy="913" r="26" fill="#0f172a" opacity="0.13"/><circle cx="110" cy="908" r="26" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="110" cy="908" r="16" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="330" cy="849" r="15" fill="#64748b"/><path d="M309,921 L309,884 Q309,869 324,869 L336,869 Q351,869 351,884 L351,921 Z" fill="#64748b"/><rect x="314" y="916" width="12" height="55" rx="5" fill="#64748b"/><rect x="334" y="916" width="12" height="55" rx="5" fill="#64748b"/>
    <rect x="545" y="869" width="50" height="92" rx="8" fill="#0f172a" opacity="0.14"/><rect x="540" y="862" width="50" height="92" rx="8" fill="#111827"/><rect x="543" y="865" width="44" height="86" rx="7" fill="#eff6ff"/><rect x="558" y="867" width="14" height="4" rx="2" fill="#111827"/>
    <path d="M140,908 L300,908" class="a-signal" marker-end="url(#m-signal)"/>
    <path d="M362,908 L530,908" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4 8"/>
    <path d="M134,926 L330,970 L532,936" class="a-signal" marker-end="url(#m-signal)"/>
  </g>
  <g data-f="5" transform="translate(0,314)">
    <rect x="40" y="1010" width="640" height="126" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="66" cy="1040" r="18" fill="#0d9488"/><text x="66" y="1046" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="94" y="1046" text-anchor="start" style="font-size:26px;font-weight:800;fill:#0d9488">Range is a probability</text><text x="56" y="1082" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Same tag, same phone: metres one moment,</tspan><tspan x="56" dy="27">nothing the next.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1468" x2="680" y2="1468" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1498" class="note">dB values illustrative except free-space loss</text>
    <text x="40" y="1525" class="note">(calculated).</text>
    <path d="M40,1561 L74,1561" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="86" y="1566" class="s">Radio signal or wave</text>
  </g>
</svg>
