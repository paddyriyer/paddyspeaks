<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1573" width="720" height="1573" font-family="Inter, Arial, sans-serif">
  <title>Scene 45: Three layers of protection, three different jobs</title>
  <desc>Five frames along the path from tag to owner. 1, the path: tag, passer-by’s phone, Apple’s relay, owner’s phone. 2, the radio link: the broadcast is not encrypted, because the identifier is public by design; Bluetooth link encryption applies only to connections. 3, TLS protects each internet hop in transit and ends at Apple’s servers. 4, end-to-end encryption wraps the location from the finder’s phone to the owner’s phone, through the relay and while stored there. 5, where data is readable: on the finder’s phone (its own location), as ciphertext with metadata at rest on the relay, and on the owner’s phone after decryption.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1573"/>
  <text x="40" y="50" class="k">SCENE 45</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Three layers of</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">protection, three</text>
  <text x="40" y="216" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">different jobs</text>
  <text x="40" y="257" style="font-size:23px;fill:#475569">The radio, the internet hop and the report itself</text>
  <text x="40" y="288" style="font-size:23px;fill:#475569">are protected differently.</text>
  <g data-f="1" transform="translate(0,314)">
    <circle cx="113" cy="59" r="36" fill="#0f172a" opacity="0.13"/><circle cx="110" cy="54" r="36" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><circle cx="110" cy="54" r="22" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="2"/><text x="164" y="62" text-anchor="start" style="font-size:21px;font-weight:600;fill:#475569">item tracker</text>
    <rect x="73" y="182" width="84" height="130" rx="14" fill="#0f172a" opacity="0.14"/><rect x="68" y="175" width="84" height="130" rx="14" fill="#111827"/><rect x="73" y="180" width="74" height="120" rx="11" fill="#f8fafc"/><rect x="98" y="183" width="24" height="6" rx="3" fill="#111827"/><text x="168" y="234" text-anchor="start" style="font-size:21px;font-weight:600;fill:#475569"><tspan x="168" dy="0">passer-by’s</tspan><tspan x="168" dy="27">phone</tspan></text>
    <rect x="68" y="407" width="84" height="29" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="81" cy="422" r="4" fill="#22c55e"/><rect x="96" y="418" width="45" height="7" rx="3" fill="#94a3b8"/><rect x="68" y="442" width="84" height="29" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="81" cy="457" r="4" fill="#22c55e"/><rect x="96" y="453" width="45" height="7" rx="3" fill="#94a3b8"/><rect x="68" y="477" width="84" height="29" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="81" cy="492" r="4" fill="#22c55e"/><rect x="96" y="488" width="45" height="7" rx="3" fill="#94a3b8"/>
    <rect x="40" y="387" width="160" height="150" rx="16" fill="none" stroke="#14213d" stroke-width="5"/><rect x="54" y="520" width="145" height="34" rx="6" fill="#14213d"/><text x="64" y="544" text-anchor="start" style="font-size:20px;font-weight:700;fill:#ffffff">Apple relay</text>
    <rect x="73" y="634" width="84" height="130" rx="14" fill="#0f172a" opacity="0.14"/><rect x="68" y="627" width="84" height="130" rx="14" fill="#111827"/><rect x="73" y="632" width="74" height="120" rx="11" fill="#f8fafc"/><rect x="98" y="635" width="24" height="6" rx="3" fill="#111827"/><text x="168" y="686" text-anchor="start" style="font-size:21px;font-weight:600;fill:#475569"><tspan x="168" dy="0">owner’s</tspan><tspan x="168" dy="27">phone</tspan></text>
    <text x="306" y="24" text-anchor="start" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:800;fill:#64748b">LAYER</text>
  </g>
  <g data-f="2" transform="translate(0,314)">
    <rect x="306" y="40" width="54" height="212" rx="10" fill="#eff6ff"/>
    <text x="322" y="147.0" transform="rotate(-90 322 147.0)" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#1e40af">Radio broadcast</text>
    <path d="M110,96 L110,167" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="124" y="100" width="159" height="58" rx="6" class="lab"/>
    <text x="204" y="122" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#1d4ed8"><tspan x="204" dy="0">Bluetooth:</tspan><tspan x="204" dy="26">in the clear</tspan></text>
    <path d="M340,54 L340,240" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>
    <text x="380" y="112" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="380" dy="0">not encrypted: the</tspan><tspan x="380" dy="27">rotating key is public</tspan><tspan x="380" dy="27">by design</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,314)">
    <rect x="476" y="226" width="54" height="480" rx="10" fill="#f8fafc"/>
    <text x="492" y="341.0" transform="rotate(-90 492 341.0)" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#334155">TLS (in transit)</text>
    <path d="M510,240 L510,442 M510,482 L510,692" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <text x="546" y="458" text-anchor="start" style="font-size:20px;font-weight:600;fill:#475569"><tspan x="546" dy="0">ends at the</tspan><tspan x="546" dy="26">server</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,314)">
    <rect x="386" y="226" width="54" height="480" rx="10" fill="#f5f3ff"/>
    <text x="402" y="577.0" transform="rotate(-90 402 577.0)" text-anchor="middle" style="font-size:21px;font-weight:800;fill:#6b21a8">End to end</text>
    <path d="M420,240 L420,692" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/>
    <path d="M110,311 L110,381" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="133" y="322" width="90" height="58" rx="6" class="lab"/>
    <text x="178" y="344" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#7e22ce"><tspan x="178" dy="0">sealed</tspan><tspan x="178" dy="26">report</tspan></text>
    <path d="M110,543 L110,621" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="133" y="552" width="90" height="58" rx="6" class="lab"/>
    <text x="178" y="574" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#7e22ce"><tspan x="178" dy="0">sealed</tspan><tspan x="178" dy="26">report</tspan></text>
    <path d="M223,442 L223,433 a10,10 0 0 1 20,0 L242,442" fill="none" stroke="#7c3aed" stroke-width="3.9"/><rect x="216" y="442" width="33" height="26" rx="4" fill="#7c3aed"/><circle cx="232" cy="453" r="3" fill="#ffffff"/><rect x="231" y="454" width="3" height="8" fill="#ffffff"/>
  </g>
  <g data-f="5" transform="translate(0,314)">
    <rect x="40" y="780" width="640" height="114" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="58" y="818" text-anchor="start" style="font-size:24px;font-weight:800;fill:#16a34a">On a device</text><text x="58" y="852" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="58" dy="0">Plaintext only on the finder’s phone (its own location)</tspan><tspan x="58" dy="27">and on the owner’s phone after decrypting.</tspan></text>
    <rect x="40" y="904" width="640" height="114" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="58" y="942" text-anchor="start" style="font-size:24px;font-weight:800;fill:#334155">In transit</text><text x="58" y="976" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="58" dy="0">TLS around the internet hops; the report inside stays</tspan><tspan x="58" dy="27">end-to-end encrypted.</tspan></text>
    <rect x="40" y="1028" width="640" height="114" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><text x="58" y="1066" text-anchor="start" style="font-size:24px;font-weight:800;fill:#7c3aed">At rest on the relay</text><text x="58" y="1100" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="58" dy="0">Ciphertext, a lookup hash, upload time and connection</tspan><tspan x="58" dy="27">metadata. Not the location.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1472" x2="680" y2="1472" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1502" class="note">Apple’s documented Find My design. Schematic.</text>
    <path d="M40,1538 L74,1538" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="86" y="1543" class="s">Radio signal or wave</text>
    <path d="M322.0,1538 L356.0,1538" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="368.0" y="1543" class="s">Encrypted / cryptographic</text>
  </g>
</svg>
