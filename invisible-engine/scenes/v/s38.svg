<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1574" width="720" height="1574" font-family="Inter, Arial, sans-serif">
  <title>Scene 38: The whole exchange in five lanes</title>
  <desc>A sequence diagram in five frames across five lanes: the tag, the finder phone, the Find My relay at Apple, the owner’s Apple Account service, and the owner’s device. 1, the tag broadcasts its current public key over Bluetooth; 2, the finder phone takes its own location; 3, it encrypts location and time to the public key. 4, it uploads the encrypted report with a SHA-256 lookup hash; 5, the relay stores it. 6, the owner’s device signs in with two-factor authentication; 7, it receives an authorised session. 8, it regenerates the public keys and hashes; 9, it requests reports by hash; 10, the relay returns the encrypted reports; 11, the device decrypts them with its private keys. Final frame: trust boundaries around Apple’s services and around the owner’s device, where the private keys stay.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1574"/>
  <text x="40" y="50" class="k">SCENE 38</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">The whole exchange in</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">five lanes</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Numbered messages, left to right. Short form: From</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">Tap to Trace, Figure 06.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="44" y="0" width="120" height="128" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="104" y="28" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d"><tspan x="104" dy="0">Item</tspan><tspan x="104" dy="26">tracker</tspan></text><text x="104" y="80" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#475569">broadcasts</text>
    <path d="M104,128 L104,1040" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="172" y="0" width="120" height="128" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="232" y="28" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d"><tspan x="232" dy="0">Finder</tspan><tspan x="232" dy="26">phone</tspan></text><text x="232" y="80" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#475569"><tspan x="232" dy="0">any</tspan><tspan x="232" dy="26">passer-by</tspan></text>
    <path d="M232,128 L232,1040" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="300" y="0" width="120" height="128" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="360" y="28" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d"><tspan x="360" dy="0">Find My</tspan><tspan x="360" dy="26">relay</tspan></text><text x="360" y="80" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#475569">Apple</text>
    <path d="M360,128 L360,1040" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="428" y="0" width="120" height="128" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="488" y="28" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d"><tspan x="488" dy="0">Account</tspan><tspan x="488" dy="26">service</tspan></text><text x="488" y="80" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#475569"><tspan x="488" dy="0">Apple</tspan><tspan x="488" dy="26">Account</tspan></text>
    <path d="M488,128 L488,1040" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="556" y="0" width="120" height="128" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="616" y="28" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d"><tspan x="616" dy="0">Owner’s</tspan><tspan x="616" dy="26">device</tspan></text><text x="616" y="80" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#475569">signed in</text>
    <path d="M616,128 L616,1040" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M104,196 L228,196" class="a-signal" marker-end="url(#m-signal)"/>
    <rect x="100" y="136" width="136" height="58" rx="6" class="lab"/>
    <text x="168" y="158" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#1d4ed8"><tspan x="168" dy="0">1 BLE</tspan><tspan x="168" dy="26">advert: Pᵢ</tspan></text>
    <rect x="106" y="257" width="253" height="32" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="232" y="279" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#15803d">2 own location + time</text>
    <rect x="138" y="339" width="187" height="32" rx="7" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/><text x="232" y="361" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#7e22ce">3 encrypt to Pᵢ</text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <path d="M232,442 L356,442" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="228" y="382" width="136" height="58" rx="6" class="lab"/>
    <text x="296" y="404" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#7e22ce"><tspan x="296" dy="0">4 hash +</tspan><tspan x="296" dy="26">ciphertext</tspan></text>
    <rect x="266" y="503" width="187" height="32" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="360" y="525" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#334155">5 store by hash</text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <path d="M616,606 L492,606" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="484" y="546" width="136" height="58" rx="6" class="lab"/>
    <text x="552" y="568" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#4b5563"><tspan x="552" dy="0">6 sign in,</tspan><tspan x="552" dy="26">2FA</tspan></text>
    <path d="M488,688 L612,688" class="a-admin" marker-end="url(#m-admin)"/>
    <rect x="490" y="652" width="124" height="32" rx="6" class="lab"/>
    <text x="552" y="674" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#4b5563"><tspan x="552" dy="0">7 session</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="471" y="749" width="209" height="32" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="575.5" y="771" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#15803d">8 derive Pᵢ, hash</text>
    <path d="M616,852 L364,852" class="a-plain" marker-end="url(#m-plain)"/>
    <rect x="426" y="792" width="124" height="58" rx="6" class="lab"/>
    <text x="488" y="814" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#15803d"><tspan x="488" dy="0">9 request</tspan><tspan x="488" dy="26">by hashes</tspan></text>
    <path d="M360,934 L612,934" class="a-crypto" marker-end="url(#m-crypto)"/>
    <rect x="408" y="874" width="159" height="58" rx="6" class="lab"/>
    <text x="488" y="896" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#7e22ce"><tspan x="488" dy="0">10 encrypted</tspan><tspan x="488" dy="26">reports</tspan></text>
    <rect x="460" y="995" width="220" height="32" rx="7" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/><text x="570.0" y="1017" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#7e22ce">11 decrypt with dᵢ</text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="290" y="-8" width="258" height="152" rx="14" fill="none" stroke="#14213d" stroke-width="5"/><rect x="304" y="128" width="178" height="32" rx="6" fill="#14213d"/><text x="313" y="151" text-anchor="start" style="font-size:20px;font-weight:700;fill:#ffffff">Apple services</text>
    <rect x="554" y="-8" width="128" height="196" rx="14" fill="none" stroke="#14213d" stroke-width="5"/><rect x="412" y="172" width="268" height="32" rx="6" fill="#14213d"/>
    <text x="421" y="195" text-anchor="start" style="font-size:20px;font-weight:700;fill:#ffffff">private keys stay here</text>
    <text x="40" y="1092" text-anchor="start" style="font-size:21px;font-weight:600;fill:#334155"><tspan x="40" dy="0">Thick boxes: trust boundaries. Apple stores and routes;</tspan><tspan x="40" dy="27">only the owner’s device decrypts.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1406" x2="680" y2="1406" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M40,1437 L74,1437" class="a-signal" marker-end="url(#m-signal)"/>
    <text x="86" y="1442" class="s">Radio signal or wave</text>
    <path d="M40,1471 L74,1471" class="a-plain" marker-end="url(#m-plain)"/>
    <text x="86" y="1476" class="s">Plaintext / local information</text>
    <path d="M40,1505 L74,1505" class="a-crypto" marker-end="url(#m-crypto)"/>
    <text x="86" y="1510" class="s">Encrypted / cryptographic</text>
    <path d="M40,1539 L74,1539" class="a-admin" marker-end="url(#m-admin)"/>
    <text x="86" y="1544" class="s">Registration / authorisation (not data)</text>
  </g>
</svg>
