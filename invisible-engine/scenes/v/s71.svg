    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1578"/>
  <text x="40" y="50" class="k">SCENE 71</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Where quantum helps, and</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">where it does not</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">A specialised tool for certain problem shapes, not</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">a faster everything-computer.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="0" width="640" height="38" fill="#eef2ff" stroke="#e2e8f0" stroke-width="1"/><text x="150.0" y="26" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">Problem</text><text x="370.0" y="26" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">Known quantum help</text><text x="580.0" y="26" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#14213d">How much</text><rect x="40" y="38" width="640" height="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="150.0" y="64" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d"><tspan x="150.0" dy="0">Factoring, discrete</tspan><tspan x="150.0" dy="26">logs</tspan></text><text x="370.0" y="64" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d"><tspan x="370.0" dy="0">Shor (needs fault</tspan><tspan x="370.0" dy="26">tolerance)</tspan></text><text x="580.0" y="77" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">exponential</text><rect x="40" y="102" width="640" height="38" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="150.0" y="128" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">Unstructured search</text><text x="370.0" y="128" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">Grover</text><text x="580.0" y="128" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">quadratic (√N)</text><rect x="40" y="140" width="640" height="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="150.0" y="166" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d"><tspan x="150.0" dy="0">Simulating</tspan><tspan x="150.0" dy="26">molecules, materials</tspan></text><text x="370.0" y="179" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">Quantum simulation</text><text x="580.0" y="179" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">problem-dependent</text><rect x="40" y="204" width="640" height="64" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="150.0" y="230" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d"><tspan x="150.0" dy="0">NP-complete puzzles</tspan><tspan x="150.0" dy="26">in general</tspan></text><text x="370.0" y="230" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d"><tspan x="370.0" dy="0">none known to make</tspan><tspan x="370.0" dy="26">them easy</tspan></text><text x="580.0" y="230" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d"><tspan x="580.0" dy="0">no proof of big</tspan><tspan x="580.0" dy="26">gains</tspan></text><rect x="40" y="268" width="640" height="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="150.0" y="294" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d"><tspan x="150.0" dy="0">Email, video,</tspan><tspan x="150.0" dy="26">spreadsheets</tspan></text><text x="370.0" y="307" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">none</text><text x="580.0" y="307" text-anchor="middle" style="font-size:20px;font-weight:500;fill:#14213d">none</text>
    <rect x="40" y="346" width="640" height="127" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="68" cy="376" r="18" fill="#2563eb"/><text x="68" y="382" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">1</text><text x="96" y="384" text-anchor="start" style="font-size:26px;font-weight:800;fill:#2563eb">The pattern</text><text x="56" y="418" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Advantages come from structure that interference can</tspan><tspan x="56" dy="27">exploit.</tspan></text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <circle cx="58" cy="503" r="15" fill="#7c3aed"/><text x="58" y="508" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#ffffff">2</text><text x="82" y="510" text-anchor="start" style="font-size:21px;font-weight:800;fill:#14213d">Steps vs problem size N (log scales, computed)</text>
    <rect x="40" y="529" width="640" height="180" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <polyline points="40.0,694.0 98.2,679.0 156.4,664.0 214.5,649.0 272.7,634.0 330.9,619.0 389.1,604.0 447.3,589.0 505.5,574.0 563.6,559.0 621.8,544.0 680.0,529.0" fill="none" stroke="#64748b" stroke-width="3.5"/>
    <polyline points="40.0,701.5 98.2,694.0 156.4,686.5 214.5,679.0 272.7,671.5 330.9,664.0 389.1,656.5 447.3,649.0 505.5,641.5 563.6,634.0 621.8,626.5 680.0,619.0" fill="none" stroke="#7c3aed" stroke-width="3.5"/>
    <path d="M60,557 L96,557" stroke="#64748b" stroke-width="3.5"/><text x="106" y="564" text-anchor="start" style="font-size:20px;font-weight:700;fill:#475569">N steps (look one by one)</text>
    <path d="M60,587 L96,587" stroke="#7c3aed" stroke-width="3.5"/><text x="106" y="594" text-anchor="start" style="font-size:20px;font-weight:700;fill:#6d28d9">√N steps (Grover)</text>
    <text x="40" y="737" text-anchor="start" style="font-size:20px;font-weight:600;fill:#475569">N = 10</text><text x="680" y="737" text-anchor="end" style="font-size:20px;font-weight:600;fill:#475569">N = 10¹²</text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="70" y="811" width="102" height="36" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="85" cy="829" r="4" fill="#22c55e"/><rect x="104" y="825" width="54" height="8" rx="3" fill="#94a3b8"/><rect x="70" y="854" width="102" height="36" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="85" cy="871" r="4" fill="#22c55e"/><rect x="104" y="867" width="54" height="8" rx="3" fill="#94a3b8"/><rect x="70" y="896" width="102" height="36" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><circle cx="85" cy="914" r="4" fill="#22c55e"/><rect x="104" y="910" width="54" height="8" rx="3" fill="#94a3b8"/><text x="121" y="987" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#334155">ordinary computer</text>
    <rect x="470" y="825" width="186" height="136" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="3"/><rect x="513" y="856" width="99" height="74" rx="18" fill="none" stroke="#94a3b8" stroke-width="7"/><rect x="557" y="851" width="12" height="10" fill="#e2e8f0"/><rect x="561" y="851" width="4" height="10" fill="#7c3aed"/>
    <text x="563" y="987" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#334155">quantum processor</text>
    <path d="M184,835 C300,785 380,785 455,825" fill="none" stroke="#334155" stroke-width="3"/><path d="M447,813 L467,831 L441,837 Z" fill="#334155"/><path d="M465,935 C380,975 300,975 196,935" fill="none" stroke="#334155" stroke-width="3"/><path d="M204,923 L184,933 L204,947 Z" fill="#334155"/>
    <text x="320" y="779" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#334155">prepare a short circuit</text><text x="340" y="989" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#334155">results back, checked</text><circle cx="52" cy="777" r="15" fill="#334155"/><text x="52" y="782" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#ffffff">3</text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="1011" width="640" height="181" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><circle cx="68" cy="1041" r="18" fill="#b45309"/><text x="68" y="1047" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="96" y="1049" text-anchor="start" style="font-size:26px;font-weight:800;fill:#b45309">Honest feasibility</text><text x="56" y="1083" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Error-correction overhead, loading data into qubits and</tspan><tspan x="56" dy="27">slow gate rates can erase a speedup. A quadratic gain</tspan><tspan x="56" dy="27">needs very large problems to pay off. Claims of</tspan><tspan x="56" dy="27">advantage are checked one problem at a time.</tspan></text>
  </g>
  <g class="legend">
    <line x1="40" y1="1484" x2="680" y2="1484" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1514" class="note">Advantage classes as established in the literature; the</text>
    <text x="40" y="1541" class="note">chart is computed, not measured.</text>
  </g>
</svg>
