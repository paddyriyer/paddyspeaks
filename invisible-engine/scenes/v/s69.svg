<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1569" width="720" height="1569" font-family="Inter, Arial, sans-serif">
  <title>Scene 69: What a quantum computer physically is</title>
  <desc>Five frames. 1, a dilution refrigerator drawn as its gold “chandelier” of stacked plates, from room temperature down to about 10–20 millikelvin at the bottom, where the chip sits. 2, a superconducting qubit: an aluminium loop interrupted by a Josephson junction, controlled by microwave pulses of a few gigahertz and read out through a resonator. 3, trapped ions: a row of charged atoms held by electric fields in a vacuum, controlled and read with lasers. 4, other approaches: neutral atoms held in beams of laser light, and photons in optical chips. 5, what is not inside: no water, no visible waves, no tiny whirlpools — “waves” in this lesson are mathematics about amplitudes.</desc>
  <style>
    .bg{fill:#ffffff}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#1f2937}
    .k{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#1d4ed8}
    .h{font-size:34px;font-weight:700;fill:#14213d}
    .t{font-size:21px}
    .tb{font-size:21px;font-weight:700;fill:#14213d}
    .s{font-size:17px;fill:#4b5563}
    .sb{font-size:17px;font-weight:700;fill:#14213d}
    .m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:16px;fill:#14213d}
    .note{font-size:16px;font-style:italic;fill:#4b5563}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boxw{fill:#ffffff;stroke:#64748b;stroke-width:2}
    .bound{fill:none;stroke:#14213d;stroke-width:5}
    .hz{fill:#fef2f2;stroke:#b91c1c;stroke-width:3;stroke-dasharray:12 8}
    .lab{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
    .wire{fill:none;stroke:#334155;stroke-width:3}
    .coil{fill:none;stroke:#b45309;stroke-width:4}
    .field{fill:none;stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6;opacity:.75}
    .a-energy{stroke:#c2410c;stroke-width:5;fill:none}
    .a-signal{stroke:#1d4ed8;stroke-width:5;fill:none}
    .a-plain{stroke:#15803d;stroke-width:5;fill:none}
    .a-crypto{stroke:#7e22ce;stroke-width:5;fill:none}
    .a-admin{stroke:#4b5563;stroke-width:4;fill:none;stroke-dasharray:12 9}
    .c-energy{fill:#c2410c}.c-signal{fill:#1d4ed8}.c-plain{fill:#15803d}.c-crypto{fill:#7e22ce}.c-admin{fill:#4b5563}.c-hazard{fill:#b91c1c}

    .k{font-size:20px}
    .t,.tb{font-size:24px}
    .s,.sb{font-size:21px}
    .m{font-size:20px}
    .note{font-size:20px}
  </style>
  <defs>
    <marker id="m-energy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-energy"/></marker>
    <marker id="ms-energy" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-energy"/></marker>
    <marker id="m-signal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-signal"/></marker>
    <marker id="ms-signal" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-signal"/></marker>
    <marker id="m-plain" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-plain"/></marker>
    <marker id="ms-plain" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-plain"/></marker>
    <marker id="m-crypto" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-crypto"/></marker>
    <marker id="ms-crypto" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-crypto"/></marker>
    <marker id="m-admin" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 Z" class="c-admin"/></marker>
    <marker id="ms-admin" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 Z" class="c-admin"/></marker>
  </defs>
  <rect class="bg" width="720" height="1569"/>
  <text x="40" y="50" class="k">SCENE 69</text>
  <text x="40" y="112" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">What a quantum computer</text>
  <text x="40" y="164" style="font-size:44px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">physically is</text>
  <text x="40" y="205" style="font-size:23px;fill:#475569">Cold metal circuits, or atoms held by light — not</text>
  <text x="40" y="236" style="font-size:23px;fill:#475569">ripples in a tank.</text>
  <g data-f="1" transform="translate(0,262)">
    <rect x="40" y="6" width="248" height="12" rx="5" fill="#d4a017" stroke="#92400e" stroke-width="2"/><text x="299.25" y="17.25" text-anchor="start" style="font-size:20px;font-weight:600;fill:#334155">room temperature</text><path d="M92,18 L92,64" stroke="#b7791f" stroke-width="3.0"/><path d="M164,18 L164,64" stroke="#b7791f" stroke-width="3.0"/><path d="M235,18 L235,64" stroke="#b7791f" stroke-width="3.0"/><rect x="50" y="64" width="228" height="12" rx="5" fill="#d4a017" stroke="#92400e" stroke-width="2"/><text x="289.5" y="75.75" text-anchor="start" style="font-size:20px;font-weight:600;fill:#334155">~50 K</text><path d="M98,76 L98,123" stroke="#b7791f" stroke-width="3.0"/><path d="M164,76 L164,123" stroke="#b7791f" stroke-width="3.0"/><path d="M229,76 L229,123" stroke="#b7791f" stroke-width="3.0"/><rect x="59" y="123" width="208" height="12" rx="5" fill="#d4a017" stroke="#92400e" stroke-width="2"/><text x="279.75" y="134.25" text-anchor="start" style="font-size:20px;font-weight:600;fill:#334155">~4 K</text><path d="M103,135 L103,182" stroke="#b7791f" stroke-width="3.0"/><path d="M164,135 L164,182" stroke="#b7791f" stroke-width="3.0"/><path d="M224,135 L224,182" stroke="#b7791f" stroke-width="3.0"/><rect x="69" y="182" width="189" height="12" rx="5" fill="#d4a017" stroke="#92400e" stroke-width="2"/><text x="270.0" y="192.75" text-anchor="start" style="font-size:20px;font-weight:600;fill:#334155">~1 K</text><path d="M109,194 L109,240" stroke="#b7791f" stroke-width="3.0"/><path d="M164,194 L164,240" stroke="#b7791f" stroke-width="3.0"/><path d="M218,194 L218,240" stroke="#b7791f" stroke-width="3.0"/><rect x="79" y="240" width="170" height="12" rx="5" fill="#d4a017" stroke="#92400e" stroke-width="2"/><text x="260.25" y="251.25" text-anchor="start" style="font-size:20px;font-weight:600;fill:#334155">~100 mK</text><path d="M115,252 L115,298" stroke="#b7791f" stroke-width="3.0"/><path d="M164,252 L164,298" stroke="#b7791f" stroke-width="3.0"/><path d="M212,252 L212,298" stroke="#b7791f" stroke-width="3.0"/><rect x="88" y="298" width="150" height="12" rx="5" fill="#d4a017" stroke="#92400e" stroke-width="2"/><text x="250.5" y="309.75" text-anchor="start" style="font-size:20px;font-weight:600;fill:#334155">~10–20 mK</text><rect x="141" y="321" width="45" height="22" rx="4" fill="#334155"/>
    <text x="40" y="372" text-anchor="start" style="font-size:20px;font-weight:700;fill:#334155">Dilution refrigerator (schematic)</text>
  </g>
  <g data-f="2" transform="translate(0,262)">
    <rect x="496" y="70" width="180" height="132" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="3"/><rect x="538" y="100" width="96" height="72" rx="18" fill="none" stroke="#94a3b8" stroke-width="7"/><rect x="580" y="95" width="12" height="10" fill="#e2e8f0"/><rect x="584" y="95" width="4" height="10" fill="#7c3aed"/>
    <text x="586" y="26" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#6d28d9"><tspan x="586" dy="0">Josephson</tspan><tspan x="586" dy="26">junction</tspan></text>
    <path d="M500,236 q15,-22 30,0 t30,0 t30,0 t30,0 t30,0" fill="none" stroke="#c2410c" stroke-width="3"/>
    <text x="496" y="280" text-anchor="start" style="font-size:20px;font-weight:600;fill:#9a3412"><tspan x="496" dy="0">microwave pulses</tspan><tspan x="496" dy="26">(a few GHz) steer</tspan><tspan x="496" dy="26">the qubit</tspan></text>
    <rect x="40" y="400" width="640" height="154" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="68" cy="430" r="18" fill="#7c3aed"/><text x="68" y="436" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">2</text><text x="96" y="438" text-anchor="start" style="font-size:26px;font-weight:800;fill:#7c3aed">Superconducting circuits</text><text x="56" y="472" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Aluminium loops lose all resistance when very cold. The</tspan><tspan x="56" dy="27">junction makes the energy levels uneven, so the lowest</tspan><tspan x="56" dy="27">two act as 0 and 1. A resonator reads it out.</tspan></text>
  </g>
  <g data-f="3" transform="translate(0,262)">
    <rect x="80" y="578" width="560" height="28" rx="6" fill="#94a3b8"/><rect x="80" y="676" width="560" height="28" rx="6" fill="#94a3b8"/><circle cx="200" cy="641" r="15" fill="#0ea5e9" stroke="#075985" stroke-width="2"/><circle cx="280" cy="641" r="15" fill="#0ea5e9" stroke="#075985" stroke-width="2"/><circle cx="360" cy="641" r="15" fill="#0ea5e9" stroke="#075985" stroke-width="2"/><circle cx="440" cy="641" r="15" fill="#0ea5e9" stroke="#075985" stroke-width="2"/><circle cx="520" cy="641" r="15" fill="#0ea5e9" stroke="#075985" stroke-width="2"/>
    <path d="M170,610 L200,641" stroke="#ef4444" stroke-width="2.5" opacity="0.85"/>
    <path d="M250,610 L280,641" stroke="#ef4444" stroke-width="2.5" opacity="0.85"/>
    <path d="M330,610 L360,641" stroke="#ef4444" stroke-width="2.5" opacity="0.85"/>
    <path d="M410,610 L440,641" stroke="#ef4444" stroke-width="2.5" opacity="0.85"/>
    <path d="M490,610 L520,641" stroke="#ef4444" stroke-width="2.5" opacity="0.85"/>
    <text x="360" y="736" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#334155"><tspan x="360" dy="0">electrodes hold a row of ions;</tspan><tspan x="360" dy="26">lasers set and read each one</tspan></text>
    <rect x="40" y="778" width="640" height="154" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><circle cx="68" cy="808" r="18" fill="#0d9488"/><text x="68" y="814" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">3</text><text x="96" y="816" text-anchor="start" style="font-size:26px;font-weight:800;fill:#0d9488">Trapped ions</text><text x="56" y="850" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Charged atoms in a vacuum, held by electric fields. Two</tspan><tspan x="56" dy="27">atomic energy levels are 0 and 1; lasers control and</tspan><tspan x="56" dy="27">read them.</tspan></text>
  </g>
  <g data-f="4" transform="translate(0,262)">
    <rect x="40" y="944" width="640" height="127" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="68" cy="974" r="18" fill="#334155"/><text x="68" y="980" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">4</text><text x="96" y="982" text-anchor="start" style="font-size:26px;font-weight:800;fill:#334155">Other approaches</text><text x="56" y="1016" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155"><tspan x="56" dy="0">Neutral atoms held in tightly focused laser beams</tspan><tspan x="56" dy="27">(“tweezers”); photons travelling through optical chips.</tspan></text>
  </g>
  <g data-f="5" transform="translate(0,262)">
    <rect x="40" y="1083" width="640" height="100" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/><circle cx="68" cy="1113" r="18" fill="#dc2626"/><text x="68" y="1119" text-anchor="middle" style="font-size:19px;font-weight:800;fill:#ffffff">5</text><text x="96" y="1121" text-anchor="start" style="font-size:24px;font-weight:800;fill:#dc2626">Not inside: water, waves or whirlpools</text><text x="56" y="1155" text-anchor="start" style="font-size:21px;font-weight:400;fill:#334155">“Waves” in this lesson are amplitudes — mathematics.</text>
  </g>
  <g class="legend">
    <line x1="40" y1="1475" x2="680" y2="1475" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="1505" class="note">Schematic, not to scale. Temperatures are typical</text>
    <text x="40" y="1532" class="note">stages, not one machine’s specification.</text>
  </g>
</svg>
