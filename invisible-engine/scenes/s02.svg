  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="50" class="k">SCENE 02</text>
  <text x="60" y="96" style="font-size:40px;font-weight:800;fill:#0f172a;letter-spacing:-0.5px">Energy and information are different things</text>
  <text x="60" y="132" style="font-size:20px;fill:#475569">Energy is measured in joules. Information is measured in bits. One wire can carry both.</text>
