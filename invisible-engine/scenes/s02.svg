    <text x="1180" y="250" text-anchor="start" style="font-size:17px;font-weight:600;fill:#9a3412">1 watt for 1 second</text>
    <text x="1180" y="276" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">delivers 1 joule.</text>
  </g>
