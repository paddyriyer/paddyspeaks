    <rect x="580" y="198" width="23" height="14" rx="3" fill="#475569"/><rect x="560" y="210" width="64" height="110" rx="12" fill="#ffffff" stroke="#334155" stroke-width="4"/><rect x="568" y="237" width="48" height="75" rx="6" fill="#4ade80"/>
