    <text x="1130" y="450" text-anchor="start" style="font-size:17px;font-weight:600;fill:#166534">106 kbit/s = 106,000</text>
    <text x="1130" y="476" text-anchor="start" style="font-size:17px;font-weight:400;fill:#334155">yes/no choices each second.</text>
