name: Add New Interview Questions

on:
  schedule:
    # Daily: 2 questions (6:23am UTC Monday-Friday)
    - cron: '23 6 * * 1-5'
    # Weekly: 10 questions (6:47am UTC every Monday)
    - cron: '47 6 * * 1'
    # Monthly: full review (7:11am UTC on the 1st)
    - cron: '11 7 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'daily'
        type: choice
        options: [daily, weekly, monthly]

jobs:
  add-questions:
    # Never run in mirror/fork repos (e.g. paddyspeaks-backup) — no secrets there
    if: github.repository == 'paddyriyer/paddyspeaks'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install anthropic

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$(date +%d)" = "01" ]; then
            echo "mode=monthly" >> $GITHUB_OUTPUT
          elif [ "$(date +%u)" = "1" ]; then
            echo "mode=weekly" >> $GITHUB_OUTPUT
          else
            echo "mode=daily" >> $GITHUB_OUTPUT
          fi

      - name: Generate questions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: python .github/scripts/generate_questions.py

      # Pool sizes are baked into the Skill Check's title, meta description and
      # schema.org block. Without this the counts drift every single run.
      - name: Refresh hardcoded counts
        run: python3 interview/scripts/update_counts.py

      # Every derived artefact (registry, stamped counts, the universal search
      # index, the public api/v1 feeds, graph and feeds) comes from the same
      # data; regenerate ALL of them in the same commit so the next PR's platform
      # check (build.py check) never inherits drift from a bot run. Running only
      # `registry stamp` here is what left data/search/core.json and
      # api/v1/registry.json stale and red every PR (fixed 2026-10-16).
      - name: Rebuild platform artefacts
        run: python3 scripts/platform_build/build.py all

      - name: Commit and push
        run: |
          git config user.name "PaddySpeaks Bot"
          git config user.email "bot@paddyspeaks.com"
          git add interview.app/evaluate/data/ interview.app/evaluate/index.html interview.app/evaluate/quiz.html
          # The full rebuild above also touches the registry, the manifest, the
          # search index + graph + feeds (data/), the public api feeds (api/) and
          # stamped pages anywhere on the site.
          git add data/ api/ interview/data/manifest.json
          git diff --name-only -z -- '*.html' | xargs -0 -r git add --
          git diff --cached --quiet && echo "No changes" && exit 0
          COUNT=$(git diff --cached --stat | grep -oP '\d+ insertion' | grep -oP '\d+' || echo "?")
          git commit -m "🤖 [${{ steps.mode.outputs.mode }}] Add new interview questions — $(date +%Y-%m-%d)"
          git push
