name: Accessibility

# axe-core (WCAG 2.2 A/AA) in headless Chromium over one page per journey plus
# every platform page, at desktop and phone widths (docs/ACCESSIBILITY.md).
# A RATCHET: legacy pages may not get worse than scripts/a11y/baseline.json;
# platform pages must be clean. Automated checks are not a substitute for the
# manual keyboard pass in docs/ACCESSIBILITY.md.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axe:
    if: github.repository == 'paddyriyer/paddyspeaks'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # Tooling only, installed outside the repo: nothing is added to the site.
      # axe-core is pinned: a floating "4" picked up 4.14.0 (5 Oct 2026), which
      # newly fails label-content-name-mismatch on pages no PR had touched, so the
      # ratchet broke for every PR at once. Upgrade deliberately, in its own PR,
      # together with the fixes and baseline the new rules need.
      - name: Install axe-core and Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/a11y" && cd "$RUNNER_TEMP/a11y"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1 axe-core@4.13.0 pdfjs-dist@4
          npx playwright install --with-deps chromium
      - name: axe (ratchet against scripts/a11y/baseline.json)
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y
        run: node scripts/a11y/axe-check.mjs
      - name: Privacy Command Center behaviour tests
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y
        run: node privacy-command-center/tests/run.mjs
      - name: Northstar Privacy Explorer (v10) behaviour tests
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y
        run: node privacy-command-center/v10/tests/run.mjs

      # Edition 4 (the live essay): lens switches by mouse and keyboard, deep links,
      # forwarding of edition-3 links, no-JS, axe, responsive widths, print and the PDF.
      - name: Every Arrow essay — browser tests (edition 4)
        env:
          EA_DEPS: ${{ runner.temp }}/a11y
        run: node articles/every-arrow/tests/edition4-browser.mjs

      # Edition 3 (archived at articles/every-arrow/edition-3.html): interaction,
      # keyboard, deep links, no-JS fallbacks, reduced motion, reading paths,
      # responsive widths, axe in every mode, print media and its PDF — docs/EVERY-ARROW.md.
      - name: Every Arrow essay — browser tests (edition 3, archived)
        env:
          EA_DEPS: ${{ runner.temp }}/a11y
        run: node articles/every-arrow/tests/browser.mjs
