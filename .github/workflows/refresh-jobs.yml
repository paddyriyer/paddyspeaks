name: Refresh Jobs Board

# Pulls real product, AI, program, data and engineering roles into
# interview.app/jobs/data/jobs.json from:
#   1. JobSignal's verified board (jobs/data/index.json, already in the checkout —
#      refreshed every 4 hours by jobsignal-ingest.yml),
#   2. companies' public ATS boards (Greenhouse/Lever/Ashby — keyless), and
#   3. the Adzuna jobs API (broader coverage) IF the ADZUNA_APP_ID/ADZUNA_APP_KEY
#      repo secrets are set (otherwise that step no-ops).
# build_jobs.py classifies every posting with interview/careers/roles.json.
# Board map for ATS: interview/scripts/ats_boards.json.
on:
  workflow_dispatch:
  schedule:
    # Daily, 06:30 UTC: after JobSignal's 04:00 ingest has landed and before its
    # 08:00 one, so the board reads a fresh index and the two rarely push together.
    - cron: '30 6 * * *'

# One rebuild at a time; a second trigger waits rather than racing the first.
concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh-jobs:
    # Never run in mirror/fork repos.
    if: github.repository == 'paddyriyer/paddyspeaks'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Keyless ATS boards. Exits non-zero if it found nothing.
      - name: Fetch ATS boards
        continue-on-error: true
        run: python interview/scripts/fetch_jobs_feed.py --out feed_ats.json

      # Adzuna aggregator. No-ops (writes nothing) unless both secrets are set.
      - name: Fetch Adzuna
        continue-on-error: true
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python interview/scripts/fetch_jobs_adzuna.py --out feed_adzuna.json

      # Rebuild from whichever feeds exist. Exits non-zero (leaving jobs.json
      # untouched) if both feeds are empty/absent, so we keep the last good board.
      - name: Rebuild board
        continue-on-error: true
        run: python interview/scripts/build_jobs.py --source feed_ats.json feed_adzuna.json

      - name: Commit if changed
        run: |
          git config user.name "PaddySpeaks Bot"
          git config user.email "bot@paddyspeaks.com"
          git add interview.app/jobs/data/jobs.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "🤖 Refresh jobs board — $(date +%Y-%m-%d)"
          # JobSignal's ingest also pushes to main; rebase and retry instead of failing.
          for attempt in 1 2 3 4; do
            git push && break
            echo "push failed, retrying in $((2 ** attempt))s"
            sleep $((2 ** attempt))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
