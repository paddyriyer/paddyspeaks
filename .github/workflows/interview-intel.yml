name: Interview Intelligence

# Discovers public interview reports through a search API, turns them into
# reviewed practice questions, and publishes what has been approved
# (docs/INTERVIEW-INTEL.md).
#
#   schedule          daily: apply decisions → discover → enrich → publish
#   push (decisions)  a reviewer committed a decision file: apply → enrich → publish
#   workflow_dispatch either, by hand
#
# Nothing reaches the public pages without a person's approval. Each stage
# whose secret is missing is skipped, not faked: no search key → no
# discovery; no ANTHROPIC_API_KEY → nothing is classified, extracted or
# enriched. Secrets: ANTHROPIC_API_KEY and the provider's key (EXA_API_KEY,
# TAVILY_API_KEY, BRAVE_SEARCH_API_KEY, or GOOGLE_CSE_KEY + GOOGLE_CSE_CX).
# Repository variables: INTEL_SEARCH_PROVIDER (default exa), INTEL_MODEL.

on:
  schedule:
    - cron: '37 6 * * *'
  push:
    branches: [main]
    paths:
      - 'interviewintel/decisions/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'all = search for new reports; publish = apply decisions and publish only'
        required: true
        default: 'all'
        type: choice
        options: [all, publish]

concurrency:
  group: interview-intel
  cancel-in-progress: false

jobs:
  run:
    # Never run in mirror/fork repos, matching the other workflows here.
    if: github.repository == 'paddyriyer/paddyspeaks'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The rules this product depends on — no invented question or company,
      # no copied post, no personal data, nothing unapproved published.
      - name: Pipeline tests
        run: python3 -m interviewintel.tests.test_pipeline

      - run: pip install anthropic

      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          INTEL_SEARCH_PROVIDER: ${{ vars.INTEL_SEARCH_PROVIDER || 'exa' }}
          INTEL_MODEL: ${{ vars.INTEL_MODEL }}
        run: |
          mode="${{ inputs.mode }}"
          if [ -z "$mode" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then mode=publish; else mode=all; fi
          fi
          python3 -m interviewintel.pipeline.run "$mode"

      # Re-check the committed output with the same tests before publishing it.
      - name: Tests on the fresh data
        run: python3 -m interviewintel.tests.test_pipeline

      - name: Commit if changed
        run: |
          git config user.name "PaddySpeaks Bot"
          git config user.email "bot@paddyspeaks.com"
          git add interviewintel/data interview.app/reported/data admin/interview-discovery/queue.json
          git diff --cached --quiet && echo "No changes" && exit 0
          pub=$(python3 -c "import json;print(len(json.load(open('interview.app/reported/data/questions.json'))['questions']))")
          pend=$(python3 -c "import json;print(len(json.load(open('admin/interview-discovery/queue.json'))['pending']))")
          git commit -m "🤖 Interview Intelligence: ${pub} published, ${pend} awaiting review ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3 4; do
            git push && break
            echo "push failed, retrying in $((2 ** attempt))s"
            sleep $((2 ** attempt))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
