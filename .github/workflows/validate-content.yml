name: Validate Content

# Read-only guardrail that runs on every PR into main. It never edits or
# regenerates anything (per CLAUDE.md) — it only checks:
#   • article_metadata.json is valid, deduped, and every slug has a real file
#   • all tracked JSON parses
#   • articles CHANGED in this PR have well-formed inline SVGs, a <title>,
#     and a <!doctype> (legacy articles are checked as warnings only)
#   • the Abhirami Anthadhi interpretation layer still matches the verified
#     Tamil word for word, and every Lalitha cross-link resolves
#   • the DE interview handbook's links, numbering, cards and code labels hold
#   • the JobSignal pipeline invariants hold (age never reset, a repost never
#     shown as newly posted, no aggregator apply links, no seeded jobs)
# Make this a required status check in branch protection to gate merges.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Skip on mirror/fork repos, matching the other workflows here.
    if: github.repository == 'paddyriyer/paddyspeaks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so we can diff against the base branch

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Determine article files changed in this PR
        id: changed
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'articles/*.html' | tr '\n' ' ')
          else
            files=""
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Strict (changed) article files: ${files:-<none>}"

      - name: Validate content
        run: python .github/scripts/validate_content.py --changed ${{ steps.changed.outputs.files }}

      - name: Validate DE interview handbook structure
        run: python scripts/check_handbook.py

      # One source of truth for public statistics (docs/PLATFORM-DATA.md):
      # the registry, every data-ps-stat span, the catalog, the article
      # set and the generated platform files must all agree with the content.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Platform registry and generated artefacts
        run: python3 scripts/platform_build/build.py check

      - name: Validate JobSignal pipeline invariants
        run: python -m jobsignal.tests.test_pipeline

      - name: Validate Abhirami Anthadhi interpretation layer
        run: node .github/scripts/validate_abhirami.js

      # Relevance is a product guarantee, so it is a build gate. These run the
      # SHIPPED ranker against the REAL committed index: a corpus change that
      # degrades search fails the build rather than reaching the site.
      - name: JobSignal search relevance
        run: node jobs/tests/relevance.mjs

      # PaddySpeaks Search: the shipped engine against the committed index.
      - name: Platform search relevance
        run: node lib/tests/search.mjs
