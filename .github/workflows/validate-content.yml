name: Validate Content

# Read-only guardrail that runs on every PR into main. It never edits or
# regenerates anything (per CLAUDE.md) — it only checks:
#   • article_metadata.json is valid, deduped, and every slug has a real file
#   • all tracked JSON parses
#   • articles CHANGED in this PR have well-formed inline SVGs, a <title>,
#     and a <!doctype> (legacy articles are checked as warnings only)
#   • the Abhirami Anthadhi interpretation layer still matches the verified
#     Tamil word for word, and every Lalitha cross-link resolves
#   • the DE interview handbook's links, numbering, cards and code labels hold
#   • the JobSignal pipeline invariants hold (age never reset, a repost never
#     shown as newly posted, no aggregator apply links, no seeded jobs)
#   • the Interview Intelligence invariants hold (no invented question or
#     company, nothing unapproved published, no personal data)
# Make this a required status check in branch protection to gate merges.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Skip on mirror/fork repos, matching the other workflows here.
    if: github.repository == 'paddyriyer/paddyspeaks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so we can diff against the base branch

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Determine article files changed in this PR
        id: changed
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'articles/*.html' | tr '\n' ' ')
          else
            files=""
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Strict (changed) article files: ${files:-<none>}"

      - name: Validate content
        run: python .github/scripts/validate_content.py --changed ${{ steps.changed.outputs.files }}

      - name: Validate DE interview handbook structure
        run: python scripts/check_handbook.py

      # One source of truth for public statistics (docs/PLATFORM-DATA.md):
      # the registry, every data-ps-stat span, the catalog, the article
      # set and the generated platform files must all agree with the content.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Platform registry and generated artefacts
        run: python3 scripts/platform_build/build.py check

      # "Every Arrow Is a Decision": generated fallbacks, counts, reading times,
      # the Northstar subset and the PDF are current; the figure contract, the
      # Command Center map and the legacy anchors hold (docs/EVERY-ARROW.md).
      - name: Every Arrow essay — generated parts are current
        run: node scripts/every_arrow/build.mjs --check

      - name: Every Arrow essay — structure (edition 4, the live essay)
        run: node articles/every-arrow/tests/edition4.mjs

      - name: Every Arrow essay — structure (edition 3, archived)
        run: node articles/every-arrow/tests/structure.mjs

      # The Invisible Engine (/invisible-engine/): scene SVGs are generated from
      # scripts/invisible_engine/scenes/ and current; every scene has five reader
      # levels, frame captions that match its SVG, a legend, a text alternative,
      # an accuracy check and sources; the demo models hold (docs/INVISIBLE-ENGINE.md).
      - name: The Invisible Engine — scenes current and contract holds
        run: |
          python3 scripts/invisible_engine/build.py --check
          python3 invisible-engine/tests/check.py
          node invisible-engine/tests/demos.mjs

      - name: Validate JobSignal pipeline invariants
        run: python -m jobsignal.tests.test_pipeline

      # Interview Intelligence: no invented question or company attribution,
      # no copied post, no personal data, nothing unapproved published, no
      # page fetched outside the search APIs (docs/INTERVIEW-INTEL.md).
      - name: Validate Interview Intelligence pipeline invariants
        run: python -m interviewintel.tests.test_pipeline

      # The Five-Round Loop (/interview.app/loop/): the page data is generated
      # from interview/loop/*.md and current; five questions in each round, no
      # company named as a question's style, no evaluator text in the candidate
      # file; every reference solution still beats its brute-force oracle and
      # still produces the results the page checks answers against
      # (docs/FIVE-ROUND-LOOP.md). SQL results are recorded against PostgreSQL
      # by verify/compute_expected.py, which needs a database, so CI re-checks
      # the Python ones.
      - name: Validate the Five-Round Loop
        run: |
          python3 interview/loop/build.py --check
          (cd interview/loop/verify && python3 algos.py > /dev/null)
          python3 interview/loop/verify/compute_expected.py --python --check

      # Company Interview Loops (/interview.app/company-loops/): the page data is
      # generated from interview/company-loops/ and current; every available
      # company has at least five templates per loop with all required sections,
      # nothing claims to be a real interview question, no evaluator text leaks
      # into the candidate files; and every generator is proven against its
      # reference solution across seeds and levels (SQL in PGlite, Python in
      # CPython) (docs/COMPANY-INTERVIEW-LOOPS.md).
      - name: Validate Company Interview Loops
        run: |
          python3 interview/company-loops/build.py --check
          node interview/company-loops/validate.mjs --seeds 12

      - name: Validate Abhirami Anthadhi interpretation layer
        run: node .github/scripts/validate_abhirami.js

      # The Lalitā Sahasranāma text is proven, not trusted: 1,000 names in
      # order, each inside its own half-line, every half-line 16 syllables,
      # every IAST the exact transliteration of its Devanagari. The site's
      # data.js / words.js and the study edition are generated from it
      # (docs/LALITHA-SAHASRANAMA-EDITION.md).
      - name: Validate Lalitha Sahasranama edition
        run: |
          python3 scripts/lalitha/check.py
          node scripts/lalitha/build.mjs --check

      # The Devī Māhātmyam text is proven, not trusted: 700 mantras, every
      # chapter's counts equal to its own colophon, every padaccheda rejoined by
      # the rules of sandhi into the recited verse, every word table matching
      # its padaccheda; the pages are generated from it
      # (docs/DEVI-MAHATMYAM-EDITION.md).
      - name: Validate Devi Mahatmyam edition
        run: |
          python3 scripts/devi_mahatmyam/check.py --complete
          node scripts/devi_mahatmyam/build.mjs --check

      # The Śrī Rudram text is proven, not trusted: TS 4.5.1–11 and 4.7.1–11
      # equal to the base witness with exactly the logged corrections, the
      # collation with the second witness exactly as classified, the units
      # matching Sāyaṇa's counts, every padaccheda rejoined by sandhi into the
      # Saṃhitā, every Sanskrit quotation found in Sāyaṇa; the pages, the derived
      # IAST and the audit are generated (docs/SRI-RUDRAM-EDITION.md).
      - name: Validate Sri Rudram edition
        run: |
          python3 scripts/rudram/check.py --complete
          python3 scripts/rudram/derive.py --check
          python3 scripts/rudram/audit.py --check
          node scripts/rudram/build.mjs --check

      # Relevance is a product guarantee, so it is a build gate. These run the
      # SHIPPED ranker against the REAL committed index: a corpus change that
      # degrades search fails the build rather than reaching the site.
      - name: JobSignal search relevance
        run: node jobs/tests/relevance.mjs

      # PaddySpeaks Search: the shipped engine against the committed index.
      - name: Platform search relevance
        run: node lib/tests/search.mjs
