# Dependency update PRs (P0.6). The static site has no package manager; these
# are the two places that do pin third-party code.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/privacy-agent"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
