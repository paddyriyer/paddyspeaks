<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* ── surfaces: warm neutral, low chroma ── */
  --bg:#f1f0ed;--bg2:#f7f6f4;--panel:#ffffff;--panel2:#faf9f7;--panel3:#f0efec;--panel4:#e7e6e1;
  --line:#e4e3de;--line2:#d4d2cb;--line3:#bfbdb5;
  --ink:#1a1a17;--ink2:#54534e;--ink3:#7b7a72;--ink4:#9a988f;
  /* ── the assistant's own voice ── */
  --ai:#4a3aa7;--ai2:#6a5bc4;--ai-bg:rgba(74,58,167,.07);--ai-line:rgba(74,58,167,.22);
  /* ── status (fixed roles, always paired with icon + label) ── */
  --good:#0ca30c;--good-ink:#0a6b23;--good-bg:rgba(12,163,12,.10);
  --warn:#fab219;--warn-ink:#8a5b06;--warn-bg:rgba(250,178,25,.16);
  --serious:#ec835a;--serious-ink:#a3471f;--serious-bg:rgba(236,131,90,.15);
  --crit:#d03b3b;--crit-ink:#a32020;--crit-bg:rgba(208,59,59,.10);
  --info:#2a78d6;--info-ink:#1c5cab;--info-bg:rgba(42,120,214,.09);
  /* ── chart series (validated categorical slots 1–4) ── */
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --rail:212px;
  --shadow:0 1px 2px rgba(26,26,23,.05),0 8px 24px rgba(26,26,23,.06);
  --shadow-lg:0 24px 70px rgba(26,26,23,.18);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:inherit}
button{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--line3)}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}

/* ══════════ HEADER ══════════ */
.hdr{position:sticky;top:0;z-index:140;background:rgba(255,255,255,.93);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 18px;height:56px}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,#26262a,#101014);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0}
.mark svg{position:relative;z-index:1}
.mark::after{content:'';position:absolute;top:0;bottom:0;width:26%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);animation:sweep 5.5s ease-in-out infinite}
.brand-name{font-size:13.5px;font-weight:800;letter-spacing:.06em;line-height:1.15}
.brand-sub{font-size:9.5px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.hdr-sep{width:1px;height:26px;background:var(--line);flex-shrink:0}
.hdr-spacer{flex:1}
.gsearch{position:relative;flex:0 1 300px;min-width:130px}
.gsearch input{width:100%;background:var(--panel3);border:1px solid transparent;border-radius:8px;
  padding:7px 11px 7px 30px;font-size:12px;font-family:inherit;color:var(--ink);outline:none;transition:.16s}
.gsearch input:focus{background:var(--panel);border-color:var(--ai-line);box-shadow:0 0 0 3px var(--ai-bg)}
.gsearch input::placeholder{color:var(--ink4)}
.gsearch svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink4)}
.gres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line2);
  border-radius:10px;box-shadow:var(--shadow-lg);max-height:340px;overflow-y:auto;z-index:200;display:none}
.gres.on{display:block}
.gres-item{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.gres-item:last-child{border-bottom:none}
.gres-item:hover{background:var(--panel3)}
.gres-t{font-size:12px;font-weight:600}
.gres-m{font-size:10.5px;color:var(--ink3);margin-top:2px}
.gres-empty{padding:14px;font-size:11.5px;color:var(--ink3);text-align:center}
.who{display:flex;align-items:center;gap:9px;flex-shrink:0}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#4a3aa7,#2f2570);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.02em;flex-shrink:0}
.who-n{font-size:12px;font-weight:700;line-height:1.2}
.who-r{font-size:10px;color:var(--ink3);margin-top:1px}
.hdr-btn{background:var(--panel3);border:1px solid var(--line);border-radius:7px;padding:6px 10px;
  font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer;transition:.16s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.hdr-btn:hover{background:var(--panel4);color:var(--ink);border-color:var(--line2)}
.hdr-btn.on{background:var(--ai);border-color:var(--ai);color:#fff}
.sync{font-size:10px;color:var(--ink3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot.live{background:var(--good);animation:pulseDot 2.6s infinite}

/* ══════════ ALERT BANNERS ══════════ */
.banner{display:flex;align-items:center;gap:12px;padding:9px 20px;font-size:12px;border-bottom:1px solid;position:sticky;z-index:135}
.banner.incident{background:linear-gradient(90deg,rgba(208,59,59,.13),rgba(208,59,59,.05));border-color:rgba(208,59,59,.3);color:var(--crit-ink);top:56px}
.banner.vacay{background:linear-gradient(90deg,rgba(42,120,214,.12),rgba(42,120,214,.04));border-color:rgba(42,120,214,.28);color:var(--info-ink);top:56px}
.banner b{font-weight:800;letter-spacing:.04em}
.banner .bspacer{flex:1}
.banner button{background:rgba(255,255,255,.72);border:1px solid currentColor;color:inherit;border-radius:6px;
  padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;transition:.15s}
.banner button:hover{background:#fff}

/* ══════════ INSTRUMENT STRIP ══════════ */
.strip{background:var(--panel);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;
  scrollbar-width:none;position:sticky;top:56px;z-index:130}
.strip::-webkit-scrollbar{display:none}
.strip.shifted{top:93px}
.inst{flex:1 0 auto;min-width:126px;padding:9px 14px 10px;border-right:1px solid var(--line);
  cursor:pointer;transition:background .16s;position:relative}
.inst:last-child{border-right:none}
.inst:hover{background:var(--panel2)}
.inst::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;transition:background .16s}
.inst:hover::before{background:var(--line2)}
.inst-l{font-size:8.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.09em;
  display:flex;align-items:center;gap:5px;white-space:nowrap}
.inst-v{font-size:16px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-family:var(--mono);
  font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:baseline;gap:5px}
.inst-v small{font-size:10.5px;font-weight:600;color:var(--ink3);font-family:'Inter',sans-serif}
.inst-v.txt{font-family:'Inter',system-ui,sans-serif;font-size:14.5px;letter-spacing:-.01em}
.inst-s{font-size:9.5px;color:var(--ink4);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-good{color:var(--good-ink)}.v-warn{color:var(--warn-ink)}.v-ser{color:var(--serious-ink)}
.v-crit{color:var(--crit-ink)}.v-info{color:var(--info-ink)}.v-ink{color:var(--ink)}

/* ══════════ SHELL ══════════ */
.shell{display:flex;align-items:flex-start;min-height:calc(100vh - 56px)}
.rail{width:var(--rail);flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  position:sticky;top:139px;height:calc(100vh - 139px);overflow-y:auto;padding:12px 0 28px}
.rail.shifted{top:176px;height:calc(100vh - 176px)}
.rail-grp{font-size:8.5px;font-weight:800;color:var(--ink4);text-transform:uppercase;letter-spacing:.11em;
  padding:13px 18px 5px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 18px;font-size:12.5px;font-weight:500;color:var(--ink2);
  cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:.13s;position:relative;font-family:inherit}
.nav:hover{background:var(--panel3);color:var(--ink)}
.nav.on{background:var(--ai-bg);color:var(--ai);font-weight:700}
.nav.on::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--ai);border-radius:0 2px 2px 0}
.nav svg{flex-shrink:0;opacity:.8}
.nav.on svg{opacity:1}
.nav .count{margin-left:auto;font-size:9.5px;font-weight:700;font-family:var(--mono);padding:1px 6px;border-radius:9px;
  background:var(--panel4);color:var(--ink3)}
.nav .count.alert{background:var(--crit-bg);color:var(--crit-ink)}
.nav .count.warn{background:var(--warn-bg);color:var(--warn-ink)}
.nav .lockicon{margin-left:auto;font-size:10px;opacity:.7}
.main{flex:1;min-width:0;padding:22px 26px 80px;max-width:1500px;animation:fadeUp .3s ease}

/* ══════════ PAGE FURNITURE ══════════ */
.page-hd{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-hd h1{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.page-hd p{font-size:12.5px;color:var(--ink3);margin-top:4px;max-width:720px;line-height:1.55}
.page-hd .ph-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.sec{display:flex;align-items:baseline;gap:11px;margin:26px 0 11px;flex-wrap:wrap}
.sec:first-child{margin-top:0}
.sec h2{font-size:13px;font-weight:800;letter-spacing:.01em}
.sec p{font-size:11.5px;color:var(--ink4)}
.sec .sspacer{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g21{grid-template-columns:2fr 1fr}
.g12{grid-template-columns:1fr 2fr}
.g31{grid-template-columns:3fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px;transition:border-color .18s}
.card.pad0{padding:0;overflow:hidden}
.card:hover{border-color:var(--line2)}
.card-hd{display:flex;align-items:center;gap:10px;margin-bottom:3px}
.card-hd h3{font-size:12.5px;font-weight:700;letter-spacing:-.01em}
.card-hd .chspacer{flex:1}
.card-sub{font-size:11px;color:var(--ink4);margin-bottom:12px;line-height:1.5}
.muted{color:var(--ink3)}
.tiny{font-size:10.5px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ══════════ CHIPS / BADGES / PILLS ══════════ */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;padding:2.5px 8px;
  border-radius:5px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;border:1px solid transparent}
.c-good{background:var(--good-bg);color:var(--good-ink);border-color:rgba(12,163,12,.2)}
.c-warn{background:var(--warn-bg);color:var(--warn-ink);border-color:rgba(250,178,25,.36)}
.c-ser{background:var(--serious-bg);color:var(--serious-ink);border-color:rgba(236,131,90,.34)}
.c-crit{background:var(--crit-bg);color:var(--crit-ink);border-color:rgba(208,59,59,.26)}
.c-info{background:var(--info-bg);color:var(--info-ink);border-color:rgba(42,120,214,.22)}
.c-ai{background:var(--ai-bg);color:var(--ai);border-color:var(--ai-line)}
.c-neutral{background:var(--panel3);color:var(--ink2);border-color:var(--line)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;padding:3px 9px;
  border-radius:999px;background:var(--panel3);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.tag.soft{background:transparent}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}

/* ══════════ PROVENANCE (every AI claim carries one) ══════════ */
.prov{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:10px;color:var(--ink4);
  font-family:var(--mono);padding-top:9px;margin-top:10px;border-top:1px dashed var(--line2)}
.prov.bare{border-top:none;padding-top:0;margin-top:6px}
.prov b{font-weight:600;color:var(--ink3)}
.prov .psrc{color:var(--info-ink);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;
  text-underline-offset:2px}
.prov .psrc:hover{color:var(--ai)}
.conf{display:inline-flex;align-items:center;gap:4px}
.conf-bars{display:inline-flex;gap:1.5px;align-items:flex-end}
.conf-bars i{width:3px;background:var(--line3);border-radius:1px;display:block}
.conf-bars i:nth-child(1){height:4px}.conf-bars i:nth-child(2){height:7px}.conf-bars i:nth-child(3){height:10px}
.conf.high i{background:var(--good)}
.conf.med i:nth-child(1),.conf.med i:nth-child(2){background:var(--warn)}
.conf.low i:nth-child(1){background:var(--serious)}
.ai-note{background:var(--ai-bg);border:1px solid var(--ai-line);border-left:3px solid var(--ai);
  border-radius:0 9px 9px 0;padding:11px 14px;font-size:12px;line-height:1.6;color:var(--ink)}
.ai-note .ai-lbl{font-size:8.5px;font-weight:800;color:var(--ai);letter-spacing:.11em;text-transform:uppercase;
  display:flex;align-items:center;gap:5px;margin-bottom:5px}
.conflict{background:var(--warn-bg);border:1px solid rgba(250,178,25,.4);border-radius:9px;padding:11px 13px;font-size:11.5px;line-height:1.55}
.conflict .ct{font-weight:800;color:var(--warn-ink);font-size:10.5px;letter-spacing:.04em;margin-bottom:5px;
  display:flex;align-items:center;gap:6px}
.conflict .crow{display:flex;gap:8px;margin-top:5px;font-family:var(--mono);font-size:10.5px;color:var(--ink2)}
.conflict .crow span:first-child{color:var(--ink4);min-width:96px}

/* ══════════ BUTTONS ══════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--panel);border:1px solid var(--line2);
  border-radius:8px;padding:7px 13px;font-size:11.5px;font-weight:600;color:var(--ink2);cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--panel3);color:var(--ink);border-color:var(--line3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000;border-color:#000}
.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}
.btn.ai:hover{background:var(--ai2);border-color:var(--ai2)}
.btn.danger{color:var(--crit-ink);border-color:rgba(208,59,59,.32)}
.btn.danger:hover{background:var(--crit-bg)}
.btn.sm{padding:5px 10px;font-size:10.5px;border-radius:7px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel3);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{background:none;border:none;color:var(--ink3);font-size:11px;font-weight:600;padding:5px 11px;
  border-radius:6px;cursor:pointer;transition:.14s;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(26,26,23,.09)}
.fbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.fsel{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:11.5px;
  font-family:inherit;color:var(--ink);cursor:pointer;outline:none;transition:.15s}
.fsel:hover,.fsel:focus{border-color:var(--ai)}

/* ══════════ FLIGHT PLAN ══════════ */
.brief{background:linear-gradient(150deg,#1c1c1a 0%,#2a2a33 58%,#332c52 100%);color:#f4f3f0;border-radius:14px;
  padding:22px 26px;position:relative;overflow:hidden}
.brief::after{content:'';position:absolute;right:-70px;top:-80px;width:330px;height:330px;border-radius:50%;
  background:radial-gradient(circle,rgba(122,104,224,.30),transparent 68%);pointer-events:none}
.brief-k{font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#a9a5c8;
  display:flex;align-items:center;gap:7px}
.brief h2{font-size:25px;font-weight:800;letter-spacing:-.035em;margin:8px 0 3px}
.brief .bsub{font-size:12px;color:#b6b4ae}
.brief-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px;margin:18px 0 16px;
  position:relative;z-index:1}
.bstat{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 12px}
.bstat .bv{font-size:19px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em}
.bstat .bl{font-size:9.5px;color:#a4a29c;margin-top:2px;line-height:1.35}
.brief-line{background:rgba(255,255,255,.055);border-left:2px solid #8a78e8;border-radius:0 9px 9px 0;
  padding:11px 14px;margin-bottom:9px;position:relative;z-index:1}
.brief-line .bll{font-size:8.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#a9a5c8;margin-bottom:3px}
.brief-line .blv{font-size:12.5px;line-height:1.55;color:#eceae6}
.brief-line.risk{border-left-color:#ec835a}
.brief-line.risk .bll{color:#f0b195}
.brief-foot{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px;position:relative;z-index:1}
.brief-foot .btn{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.2);color:#f4f3f0}
.brief-foot .btn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.34);color:#fff}
.brief-foot .btn.primary{background:#f4f3f0;border-color:#f4f3f0;color:#1a1a17}
.brief-foot .btn.primary:hover{background:#fff;color:#000}

.prio{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:11px;overflow:hidden;
  transition:box-shadow .2s,border-color .2s}
.prio:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.prio.done{opacity:.52}
.prio.done .prio-t{text-decoration:line-through}
.prio-hd{display:flex;gap:14px;padding:14px 17px;align-items:flex-start;cursor:pointer}
.prio-rank{width:26px;height:26px;border-radius:7px;background:var(--ink);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:800;font-family:var(--mono);flex-shrink:0;margin-top:1px}
.prio.p-crit .prio-rank{background:var(--crit)}
.prio.p-high .prio-rank{background:var(--serious)}
.prio-body{flex:1;min-width:0}
.prio-t{font-size:14px;font-weight:700;letter-spacing:-.015em;line-height:1.35}
.prio-why{font-size:11.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
.prio-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.prio-right{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0}
.prio-due{font-size:10.5px;font-weight:700;font-family:var(--mono);white-space:nowrap}
.caret{color:var(--ink4);transition:transform .2s;flex-shrink:0}
.prio.open .caret{transform:rotate(180deg)}
.prio-detail{display:none;border-top:1px solid var(--line);background:var(--panel2);padding:15px 17px 16px}
.prio.open .prio-detail{display:block;animation:fadeIn .2s}
.dl{display:grid;grid-template-columns:120px 1fr;gap:7px 14px;font-size:11.5px;align-items:start}
.dl dt{color:var(--ink4);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.07em;padding-top:1px}
.dl dd{color:var(--ink);line-height:1.55}
.nextact{background:var(--ai-bg);border:1px solid var(--ai-line);border-radius:9px;padding:11px 13px;margin-top:13px}
.nextact .nal{font-size:8.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--ai);margin-bottom:4px}
.nextact .nav-t{font-size:12px;line-height:1.55}

/* ══════════ BLOCKERS ══════════ */
.blk{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;margin-bottom:11px;transition:.18s}
.blk:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.blk-band{height:3px}
.blk.sev-critical .blk-band{background:var(--crit)}
.blk.sev-high .blk-band{background:var(--serious)}
.blk.sev-medium .blk-band{background:var(--warn)}
.blk.sev-low .blk-band{background:var(--line3)}
.blk-body{padding:13px 16px 14px}
.blk-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
.blk-t{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.blk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:10px;margin:11px 0 0;
  padding:11px 0 0;border-top:1px solid var(--line)}
.bg-i .bgl{font-size:8.5px;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:.08em}
.bg-i .bgv{font-size:12px;font-weight:600;margin-top:3px;line-height:1.4}
.blk.resolved{opacity:.5}
.blk.snoozed{opacity:.62}
.age-hot{color:var(--crit-ink);font-weight:700}

/* ══════════ OKR TREE ══════════ */
.tree{display:flex;flex-direction:column;gap:0}
.tnode{position:relative;padding-left:0}
.tlvl{display:flex;align-items:stretch;gap:0;margin-bottom:0}
.trail{width:34px;flex-shrink:0;position:relative}
.trail::before{content:'';position:absolute;left:16px;top:0;bottom:0;width:1.5px;background:var(--line2)}
.tnode:last-child>.tlvl>.trail::before{bottom:auto;height:24px}
.trail::after{content:'';position:absolute;left:16px;top:24px;width:16px;height:1.5px;background:var(--line2)}
.tcard{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;
  margin:6px 0 6px 6px;transition:.16s;cursor:pointer;min-width:0}
.tcard:hover{border-color:var(--line3);box-shadow:var(--shadow)}
.tcard.lvl-company{background:linear-gradient(120deg,#1e1e1c,#2e2b40);color:#f2f1ee;border-color:transparent;cursor:default}
.tcard.lvl-company .tk{color:#a8a5c6}
.tcard.lvl-company .tm{color:#bebcb6}
.tcard.lvl-mine{border-color:var(--ai-line);background:var(--ai-bg)}
.tk{font-size:8.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--ink4)}
.tt{font-size:13px;font-weight:700;margin-top:3px;letter-spacing:-.01em;line-height:1.35}
.tm{font-size:11px;color:var(--ink3);margin-top:3px;line-height:1.5}
.tbar{height:5px;border-radius:3px;background:var(--panel4);overflow:hidden;margin-top:8px;position:relative}
.tbar i{display:block;height:100%;border-radius:3px}
.tmeta{display:flex;align-items:center;gap:9px;margin-top:6px;flex-wrap:wrap;font-size:10px;color:var(--ink3);font-family:var(--mono)}
.children{padding-left:34px}
.contrib{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:11.5px}
.contrib:last-child{border-bottom:none}
.contrib .cb{width:5px;height:5px;border-radius:50%;background:var(--ai);margin-top:6px;flex-shrink:0}
.mapctl{display:flex;align-items:center;gap:7px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line2);flex-wrap:wrap}

/* ══════════ TABLES ══════════ */
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{text-align:left;font-size:8.5px;font-weight:800;color:var(--ink4);text-transform:uppercase;letter-spacing:.09em;
  padding:9px 12px;border-bottom:1px solid var(--line2);background:var(--panel2);white-space:nowrap;position:sticky;top:0}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--ink2)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
.tbl tbody tr{transition:background .12s;cursor:pointer}
.tbl tbody tr:hover{background:var(--panel2)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .k{font-family:var(--mono);font-size:10.5px;color:var(--info-ink);white-space:nowrap;font-weight:600}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.tbl-wrap .tbl{min-width:640px}

/* ══════════ TIMELINE ══════════ */
.tline{position:relative;padding-left:22px}
.tline::before{content:'';position:absolute;left:5px;top:5px;bottom:5px;width:1.5px;background:var(--line2)}
.tev{position:relative;padding:0 0 15px}
.tev:last-child{padding-bottom:0}
.tev::before{content:'';position:absolute;left:-21px;top:4px;width:9px;height:9px;border-radius:50%;
  background:var(--panel);border:2px solid var(--line3)}
.tev.hi::before{border-color:var(--ai);background:var(--ai)}
.tev.crit::before{border-color:var(--crit);background:var(--crit)}
.tev.good::before{border-color:var(--good);background:var(--good)}
.tev-t{font-size:10px;color:var(--ink4);font-family:var(--mono);letter-spacing:.02em}
.tev-h{font-size:12.5px;font-weight:600;margin-top:2px;line-height:1.4}
.tev-d{font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.55}

/* ══════════ BARS / METERS ══════════ */
.meter{display:flex;align-items:center;gap:11px;padding:7px 0}
.meter-l{font-size:11.5px;min-width:0;flex:0 0 168px;display:flex;align-items:center;gap:7px}
.meter-l .swatch{width:9px;height:9px;border-radius:2.5px;flex-shrink:0}
.meter-track{flex:1;height:16px;background:var(--panel3);border-radius:4px;overflow:hidden;min-width:60px;position:relative}
.meter-track i{display:block;height:100%;border-radius:0 4px 4px 0;transition:width .5s cubic-bezier(.4,0,.2,1)}
.meter-v{flex:0 0 74px;text-align:right;font-family:var(--mono);font-size:11.5px;font-weight:600}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--panel3);gap:2px}
.stack i{display:block;height:100%;transition:width .5s}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:10.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2.5px;display:block}
.chart-box{position:relative;width:100%;height:250px}
.chart-box.sm{height:190px}
.chart-box>canvas{position:absolute;inset:0}

/* ══════════ PRIVACY ══════════ */
.pstate{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;
  border:1px solid;cursor:pointer;transition:.15s;white-space:nowrap;background:var(--panel)}
.pstate.private{border-color:rgba(208,59,59,.3);color:var(--crit-ink);background:var(--crit-bg)}
.pstate.employee{border-color:var(--line2);color:var(--ink2);background:var(--panel3)}
.pstate.shareable{border-color:rgba(12,163,12,.3);color:var(--good-ink);background:var(--good-bg)}
.pstate:hover{filter:brightness(.96)}
.vault-lock{background:linear-gradient(150deg,#1d1c1a,#2c2a33);border-radius:14px;padding:38px 32px;text-align:center;color:#f2f1ee;
  border:1px solid #33313a}
.vault-lock .vi{font-size:34px;margin-bottom:12px}
.vault-lock h2{font-size:18px;font-weight:800;letter-spacing:-.02em}
.vault-lock p{font-size:12.5px;color:#b3b1ab;margin:9px auto 0;max-width:520px;line-height:1.65}
.vault-band{background:repeating-linear-gradient(45deg,rgba(208,59,59,.08),rgba(208,59,59,.08) 9px,transparent 9px,transparent 18px);
  border:1px solid rgba(208,59,59,.28);border-radius:10px;padding:11px 14px;font-size:11.5px;color:var(--crit-ink);
  display:flex;align-items:center;gap:10px;line-height:1.5}
.vault-band b{font-weight:800;letter-spacing:.05em;white-space:nowrap}
.consent{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.consent:last-child{border-bottom:none}
.toggle{width:34px;height:19px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;
  transition:background .2s;flex-shrink:0;border:none;margin-top:1px}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;
  transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--good)}
.toggle.on::after{transform:translateX(15px)}
.toggle.ai.on{background:var(--ai)}
.guard{display:flex;align-items:flex-start;gap:9px;padding:6px 0;font-size:11.5px;line-height:1.5;color:var(--ink2)}
.guard .gx{color:var(--crit);font-weight:800;flex-shrink:0;font-size:12px;line-height:1.35}

/* ══════════ DRAWER + MODAL ══════════ */
.scrim{position:fixed;inset:0;background:rgba(20,20,18,.42);backdrop-filter:blur(2px);z-index:400;opacity:0;
  pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg2);z-index:410;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg)}
.drawer.on{transform:none}
.drawer-hd{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;
  align-items:flex-start;gap:14px;flex-shrink:0}
.drawer-hd h3{font-size:15px;font-weight:800;letter-spacing:-.02em}
.drawer-hd p{font-size:11.5px;color:var(--ink3);margin-top:3px}
.xbtn{background:var(--panel3);border:1px solid var(--line);width:28px;height:28px;border-radius:7px;cursor:pointer;
  color:var(--ink3);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-left:auto;transition:.15s}
.xbtn:hover{background:var(--panel4);color:var(--ink)}
.drawer-body{flex:1;overflow-y:auto;padding:18px 20px 40px}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-48%) scale(.98);width:min(900px,calc(100% - 40px));
  max-height:min(88vh,900px);background:var(--bg2);border-radius:14px;z-index:410;opacity:0;pointer-events:none;
  transition:.24s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);overflow:hidden}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal-hd{padding:16px 22px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:flex-start;gap:14px;flex-shrink:0}
.modal-hd h3{font-size:16px;font-weight:800;letter-spacing:-.02em}
.modal-hd p{font-size:11.5px;color:var(--ink3);margin-top:3px}
.modal-body{flex:1;overflow-y:auto;padding:20px 22px}
.modal-ft{padding:13px 22px;border-top:1px solid var(--line);background:var(--panel);display:flex;gap:9px;
  flex-wrap:wrap;align-items:center;flex-shrink:0}
.modal-ft .mspacer{flex:1}
.ev-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.ev-item:last-child{border-bottom:none}
.ev-ico{width:28px;height:28px;border-radius:7px;background:var(--panel3);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex-shrink:0;color:var(--ink2);font-family:var(--mono)}
.ev-t{font-size:12px;font-weight:600;line-height:1.4}
.ev-m{font-size:10.5px;color:var(--ink3);margin-top:3px;font-family:var(--mono)}
.editable{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:11px 13px;font-size:12px;
  line-height:1.65;font-family:inherit;width:100%;color:var(--ink);resize:vertical;outline:none;transition:.15s}
.editable:focus{border-color:var(--ai);box-shadow:0 0 0 3px var(--ai-bg)}
.doc h4{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);
  margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.doc h4:first-child{margin-top:0}
.doc ul{list-style:none;margin:0}
.doc li{position:relative;padding:5px 0 5px 16px;font-size:12px;line-height:1.6}
.doc li::before{content:'';position:absolute;left:3px;top:12px;width:4px;height:4px;border-radius:50%;background:var(--line3)}
.doc li em{font-style:normal;color:var(--ink3);font-size:10.5px;font-family:var(--mono)}

/* ══════════ FOCUS / DEEP WORK ══════════ */
.focus{position:fixed;inset:0;background:#141412;z-index:500;display:none;flex-direction:column;color:#eceae6;overflow-y:auto}
.focus.on{display:flex;animation:fadeIn .3s}
.focus-hd{padding:16px 26px;border-bottom:1px solid #2b2a27;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:#191917;position:sticky;top:0;z-index:2}
.focus-hd .fk{font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8a86b8}
.focus-hd h2{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.focus-timer{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.02em;margin-left:auto;
  font-variant-numeric:tabular-nums}
.focus-body{padding:24px 26px 60px;max-width:1260px;margin:0 auto;width:100%}
.fcard{background:#1e1e1b;border:1px solid #2e2d29;border-radius:12px;padding:15px 17px}
.fcard h3{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:#908d86;margin-bottom:11px}
.fcard .fitem{padding:8px 0;border-bottom:1px solid #2a2926;font-size:12px;line-height:1.5}
.fcard .fitem:last-child{border-bottom:none}
.fcard .fitem .fm{font-size:10.5px;color:#88857e;margin-top:2px;font-family:var(--mono)}
.fcard a{color:#9db4e4;text-decoration:none}
.focus .btn{background:#26251f;border-color:#3a3833;color:#dcd9d3}
.focus .btn:hover{background:#312f29;color:#fff;border-color:#4a473f}
.focus .btn.primary{background:#eceae6;border-color:#eceae6;color:#141412}
.mute-note{display:flex;align-items:center;gap:9px;background:#1e1e1b;border:1px solid #2e2d29;border-radius:10px;
  padding:10px 14px;font-size:11.5px;color:#a8a49d}

/* ══════════ ASSISTANT ══════════ */
.chat{display:flex;flex-direction:column;height:calc(100vh - 260px);min-height:440px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chat-log{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:15px}
.msg{max-width:min(84%,740px);animation:fadeUp .25s ease}
.msg.me{align-self:flex-end}
.msg-b{padding:11px 14px;border-radius:12px;font-size:12.5px;line-height:1.65}
.msg.me .msg-b{background:var(--ink);color:#f4f3f0;border-bottom-right-radius:4px}
.msg.ai .msg-b{background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg-who{font-size:8.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--ink4);margin-bottom:5px;
  display:flex;align-items:center;gap:6px}
.msg.ai .msg-who{color:var(--ai)}
.msg-b p{margin-bottom:9px}
.msg-b p:last-child{margin-bottom:0}
.msg-b ul{list-style:none;margin:7px 0}
.msg-b li{position:relative;padding:3px 0 3px 15px}
.msg-b li::before{content:'';position:absolute;left:3px;top:11px;width:4px;height:4px;border-radius:50%;background:var(--ai);opacity:.6}
.msg-b strong{font-weight:700}
.cite{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;font-weight:600;
  background:var(--info-bg);color:var(--info-ink);border:1px solid rgba(42,120,214,.22);border-radius:4px;
  padding:1px 5px;cursor:pointer;margin:0 2px;vertical-align:baseline}
.cite:hover{background:rgba(42,120,214,.16)}
.refuse{background:var(--warn-bg);border:1px solid rgba(250,178,25,.4);border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.6}
.refuse .rl{font-size:8.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--warn-ink);
  margin-bottom:5px;display:flex;align-items:center;gap:6px}
.chat-in{border-top:1px solid var(--line);padding:12px 14px;background:var(--panel2);flex-shrink:0}
.chat-row{display:flex;gap:9px;align-items:flex-end}
.chat-row textarea{flex:1;background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:9px 12px;
  font-size:12.5px;font-family:inherit;color:var(--ink);resize:none;outline:none;max-height:120px;min-height:38px;transition:.15s;line-height:1.5}
.chat-row textarea:focus{border-color:var(--ai);box-shadow:0 0 0 3px var(--ai-bg)}
.sugg{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.sugg button{background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:5px 11px;font-size:11px;
  color:var(--ink2);cursor:pointer;transition:.14s;font-family:inherit;text-align:left}
.sugg button:hover{border-color:var(--ai);color:var(--ai);background:var(--ai-bg)}
.typing{display:inline-flex;gap:3px;align-items:center}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ai);opacity:.35;animation:pulseDot 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}

/* ══════════ MISC ══════════ */
.empty{text-align:center;padding:38px 22px;color:var(--ink3)}
.empty .ei{font-size:26px;opacity:.4;margin-bottom:10px}
.empty h4{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.empty p{font-size:11.5px;max-width:400px;margin:0 auto;line-height:1.6}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#f4f3f0;
  padding:11px 18px;border-radius:9px;font-size:12px;font-weight:500;z-index:600;opacity:0;pointer-events:none;
  transition:.25s;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;max-width:calc(100% - 40px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.subtabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 13px;font-size:12px;font-weight:600;
  color:var(--ink3);cursor:pointer;white-space:nowrap;transition:.14s;font-family:inherit}
.subtab:hover{color:var(--ink)}
.subtab.on{color:var(--ai);border-bottom-color:var(--ai)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:11.5px}
.kv:last-child{border-bottom:none}
.kv .kvk{color:var(--ink3)}
.kv .kvv{font-weight:600;text-align:right;font-family:var(--mono)}
.stat3{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat3 .s3{background:var(--panel);padding:11px 13px}
.stat3 .s3l{font-size:8.5px;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:.08em}

/* ── evidence / source lookup — every citation resolves to something ──── */
function findSource(key){
  const k = String(key).trim();
  const kd = KNOWLEDGE.find(d=>d.k.toLowerCase()===k.toLowerCase());
  if(kd) return {kind:kd.kind, title:kd.t, meta:`Owner ${kd.owner} · updated ${kd.updated}`, body:`<p>${esc(kd.snip)}</p>`};
  const t = TICKETS.find(x=>x.k.toLowerCase()===k.toLowerCase());
  if(t) return {kind:'Jira issue', title:t.t, meta:`${t.s} · ${t.p} · due ${t.due} · updated ${t.upd}`,
    body:`<div class="stat3">${stat('Status',esc(t.s),'',t.tone)}${stat('Priority',t.p,'','neutral')}${stat('Points',t.pts||'—','','neutral')}</div>
          ${t.wait?`<p style="margin-top:12px">Waiting on <strong>${esc(t.wait)}</strong>.</p>`:''}`};
  const m = k.match(/#?(\d{3,5})/);
  const p = m && PRS.find(x=>String(x.n)===m[1]);
  if(p) return {kind:'Pull request', title:p.t, meta:`${p.repo} · ${p.author} · ${p.age} old`,
    body:`<div class="stat3">${stat('State',esc(p.state),'',p.tone)}${stat('Diff',esc(p.size),'','neutral')}${stat('Files',p.files,'','neutral')}</div>`};
  const inc = INCIDENTS.find(x=>x.id.toLowerCase()===k.toLowerCase());
  if(inc) return {kind:'Incident record', title:inc.t, meta:`${inc.sev} · ${inc.state} · started ${inc.started} · ${inc.dur}`,
    body:`<p><strong>Current hypothesis.</strong> ${esc(inc.hypothesis)}</p>
          <h4 style="font-size:11px;margin:14px 0 6px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase">Updates</h4>
          <div class="tline">${inc.updates.map(u=>`<div class="tev"><div class="tev-t">${esc(u.t)}</div><div class="tev-d">${esc(u.d)}</div></div>`).join('')}</div>`};
  const d = DECISIONS.find(x=>x.docs.some(dd=>dd.toLowerCase()===k.toLowerCase()));
  if(d) return {kind:'Decision record', title:d.t, meta:`${d.date} · ${d.status}`,
    body:`<p><strong>Reason.</strong> ${esc(d.reason)}</p><p style="margin-top:10px"><strong>Participants.</strong> ${esc(d.people.join(', '))}</p>`};
  const b = BLOCKERS.find(x=>x.t.toLowerCase().includes(k.toLowerCase()) || (x.prov.src||'').includes(k));
  if(b) return {kind:'Blocker', title:b.t, meta:`${b.type} · waiting ${b.waiting} · owner ${b.owner}`, body:`<p>${esc(b.latest)}</p>`};
  return {kind:'Data source', title:k, meta:'Connected system',
    body:`<p class="muted">This citation points at a connected system rather than a single document. The assistant read only the records it is scoped to — the exact scopes are listed under <strong>Settings → Data sources</strong>.</p>`};
}

    <div class="ai-lbl">${ic('assistant',11)} Where the week went</div>

  </div>

  <div class="sec"><h2>Work inventory</h2><p>Planned vs. actual hours, this week</p>

      <div class="legend"><span><i style="background:${HEX.ai}"></i> Received (9 h)</span><span><i style="background:${HEX.warn}"></i> Displaced (7 h)</span></div>
      <div style="margin-top:14px">${kv('Largest displacement','INC-2291 — 5 h')}${kv('Second','Support queue — 4 h')}
      ${kv('Unplanned items this sprint','9')}${kv('Your four-sprint average','5')}</div>
      <div class="btnrow" style="margin-top:12px"><button class="btn ai sm" data-act="protect">Protect focus time</button></div>

function vBlockers(){
  const tab = S.sub.blockers || 'radar';
  const list = BLOCKERS.filter(b=>!S.resolved[b.id]);
  const body = tab==='radar' ? `
    <div class="fbar">
      <div class="seg">${['All','Critical','High','Medium'].map(f=>`<button data-bfilter="${f}" class="${(S.sub.bf||'All')===f?'on':''}">${f}</button>`).join('')}</div>
      <span class="tiny muted">Ranked by what they hold up and how long they have waited — never by anything about you.</span>
    </div>
    ${list.filter(b=>{const f=S.sub.bf||'All'; return f==='All'||b.sev===f.toLowerCase();}).map(b=>`
      <div class="blk sev-${b.sev} ${S.snoozed[b.id]?'snoozed':''}">
        <div class="blk-band"></div>
        <div class="blk-body">
          <div class="blk-top">${chip(b.sev,b.sev==='critical'?'crit':b.sev==='high'?'ser':'warn')}
            <div class="blk-t">${esc(b.t)}</div><span class="chspacer" style="flex:1"></span>
            ${S.snoozed[b.id]?chip('snoozed','neutral'):''}</div>
          <p class="tiny muted" style="line-height:1.6">${esc(b.impact)}</p>
          <div class="blk-grid">
            <div class="bg-i"><div class="bgl">Blocking</div><div class="bgv">${esc(b.blocking)}</div></div>
            <div class="bg-i"><div class="bgl">Waiting</div><div class="bgv ${b.sev==='critical'?'age-hot':''}">${esc(b.waiting)}</div></div>
            <div class="bg-i"><div class="bgl">Owner</div><div class="bgv">${esc(b.owner)}</div></div>
            <div class="bg-i"><div class="bgl">Type</div><div class="bgv">${esc(b.type)}</div></div>
          </div>
          <div style="margin-top:11px"><div class="bgl" style="font-size:8.5px;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:.08em">Latest activity</div>
            <div class="tiny" style="margin-top:3px">${esc(b.latest)}</div></div>
          <div class="nextact" style="margin-top:11px"><div class="nal">${ic('assistant',10)} Recommended action</div>
            <div class="nav-t">${esc(b.action)}</div></div>
          ${provRow(b.prov)}
          <div class="btnrow" style="margin-top:12px">
            <button class="btn ai sm" data-draft="${b.id}">Draft follow-up</button>
            <button class="btn sm" data-escalate="${b.id}">Escalate</button>
            <button class="btn sm" data-snooze="${b.id}">${S.snoozed[b.id]?'Unsnooze':'Snooze'}</button>
            <button class="btn sm" data-resolve="${b.id}">Mark resolved</button>
          </div>
        </div>
      </div>`).join('') || emptyState('No blockers in this filter','Nothing is waiting on anyone else at this severity right now.','✓')}
  ` : tab==='deps' ? depMap() : stakeholderMap();

  return `<div class="page-hd"><div><h1>Blocker radar</h1>
    <p>What is holding up your work, who owns it, and how long it has waited. Ranked by impact and urgency.</p></div></div>
    <div class="subtabs">
      <button class="subtab ${tab==='radar'?'on':''}" data-sub="blockers:radar">Blocker radar</button>
      <button class="subtab ${tab==='deps'?'on':''}" data-sub="blockers:deps">Dependency map</button>
      <button class="subtab ${tab==='stake'?'on':''}" data-sub="blockers:stake">Stakeholders</button>
    </div>${body}`;
}

function depMap(){
  const R=132, cx=190, cy=170;
  const nodes = DEPS.map(d=>{
    const a = d.angle*Math.PI/180;
    return {...d, x:cx+R*Math.cos(a), y:cy+R*Math.sin(a)};
  });
  return `
  <div class="grid g21">
    <div class="card">
      <div class="card-hd"><h3>Dependency map</h3><span class="chspacer"></span>${chip('Red = threatens a deadline','crit')}</div>
      <p class="card-sub">Teams, people, systems and approvals your Q3 commitments run through.</p>
      <div style="overflow-x:auto"><svg viewBox="0 0 380 340" style="width:100%;min-width:340px;height:auto">
        ${nodes.map(n=>`<line x1="${cx}" y1="${cy}" x2="${n.x}" y2="${n.y}" stroke="${n.risk==='critical'?HEX.crit:n.risk==='high'?HEX.ser:'#d4d2cb'}"
          stroke-width="${n.risk==='critical'?2:n.risk==='high'?1.6:1}" ${n.dir==='Waits on me'?'stroke-dasharray="4 3"':''}/>`).join('')}
        ${nodes.map(n=>`<g class="depnode" data-dep="${n.id}" style="cursor:pointer">
          <circle cx="${n.x}" cy="${n.y}" r="7" fill="${n.risk==='critical'?HEX.crit:n.risk==='high'?HEX.ser:n.risk==='medium'?HEX.warn:'#bfbdb5'}" stroke="#fff" stroke-width="2"/>
          <text x="${n.x}" y="${n.y + (n.y<cy?-13:20)}" text-anchor="middle" font-size="9.5" fill="#54534e" font-family="Inter,sans-serif" font-weight="500">${esc(n.label)}</text>
        </g>`).join('')}
        <circle cx="${cx}" cy="${cy}" r="26" fill="#1a1a17"/>
        <text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="11" fill="#f4f3f0" font-family="Inter,sans-serif" font-weight="700">ME</text>
      </svg></div>
      <div class="legend"><span><i style="background:${HEX.crit}"></i> Critical</span><span><i style="background:${HEX.ser}"></i> High</span>
        <span><i style="background:${HEX.warn}"></i> Medium</span><span><i style="background:#bfbdb5"></i> Low</span>
        <span style="margin-left:6px">— solid: I wait on them · dashed: they wait on me</span></div>
    </div>
    <div class="card">
      <div class="card-hd"><h3>${esc(DEP_Q.q)}</h3></div>
      <p class="card-sub">Asked of the assistant</p>
      ${DEP_Q.a.map(x=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)">
        <div style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:${HEX[x.sev==='critical'?'crit':x.sev==='high'?'ser':'good']}"></span>
        <strong style="font-size:12px">${esc(x.t)}</strong></div>
        <div class="tiny muted" style="margin-top:4px;line-height:1.6">${esc(x.d)}</div></div>`).join('')}
      <div class="conflict" style="margin-top:12px"><div class="ct">⚠ Incomplete data</div>${esc(DEP_Q.caveat)}</div>
      ${provRow(DEP_Q.prov)}
    </div>
  </div>
  <div class="sec"><h2>All dependencies</h2></div>
  <div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Node</th><th>Kind</th><th>Direction</th><th>What</th><th>Due</th><th>Risk</th></tr></thead>
    <tbody>${DEPS.map(d=>`<tr data-dep="${d.id}"><td><strong>${esc(d.label)}</strong></td><td class="muted">${esc(d.kind)}</td>
      <td>${esc(d.dir)}</td><td>${esc(d.what)}</td><td class="r">${esc(d.due)}</td>
      <td>${chip(d.risk, d.risk==='critical'?'crit':d.risk==='high'?'ser':d.risk==='medium'?'warn':'neutral')}</td></tr>`).join('')}</tbody></table></div>`;
}

function stakeholderMap(){
  return `
  <div class="ai-note" style="margin-bottom:16px"><div class="ai-lbl">${ic('assistant',11)} What this is and is not</div>
    This map is built only from explicit work interactions — shared pull requests, meetings, ticket assignments, review requests. It records nothing about friendship, personality, sentiment, influence, politics, or social standing, and it never will.</div>
  <div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Person</th><th>Role</th><th>Relationship to your work</th><th>Basis (explicit interactions only)</th><th>Cadence</th></tr></thead>
    <tbody>${STAKEHOLDERS.map(s=>`<tr><td><strong>${esc(s.n)}</strong></td><td class="muted">${esc(s.r)}</td>

}

      <td>${esc(c.to)}</td><td class="r">${esc(c.due)}</td>

    const drift = p.added>0 && p.planned>0 ? Math.round(p.added/p.planned*100) : 0;
    return `<div class="card" style="margin-bottom:13px">
      <div class="card-hd"><h3>${esc(p.name)}</h3><span class="chspacer"></span>
        ${chip(p.kind,'neutral')}${chip(p.status,p.tone)}</div>
      <p class="card-sub">${esc(p.summary)}</p>
      <div class="stat3" style="margin-bottom:12px">
        ${stat('My role',esc(p.role),'','neutral')}
        ${stat('Next milestone',esc(p.milestone),'','neutral')}
        ${stat('Planned tasks',p.planned||'—','','ink')}
        ${stat('Unplanned added',p.added,drift?`+${drift}% scope`:'', p.added>4?'ser':'ink')}

function vTickets(){

function okrNode(n, depth){
  const lvlClass = depth===0?'lvl-company':n.mine?'lvl-mine':'';

  const fixed = S.mapFixed[n.id];
  return `<div class="tnode">
    <div class="tlvl">${depth?'<div class="trail"></div>':''}
      <div class="tcard ${lvlClass}" data-okr="${n.id}">

        <div class="tt">${esc(n.title)}</div>
        <div class="tm">${esc(n.owner)}</div>
        <div class="tbar"><i style="width:${n.progress}%;background:${HEX[n.tone]||HEX.info}"></i></div>
        <div class="tmeta"><span>${n.progress}%</span>
          ${n.mine?`<span>${conf==='high'?chip('High-confidence alignment','good'):chip('Possible alignment — confirm','warn')}</span>`:''}
          ${fixed?chip('corrected by you','ai'):''}</div>
        ${n.mine?`<div style="margin-top:9px">
          <div class="tk" style="margin-bottom:4px">My contribution</div>
          ${n.contributions.map(c=>`<div class="contrib"><i class="cb"></i><div>${esc(c)}</div></div>`).join('')}

}

function answerFor(q){
  for(const r of REFUSALS) if(r.m.some(rx=>rx.test(q))) return {refuse:r.t, t:r.a};
  for(const a of ANSWERS) if(a.m.some(rx=>rx.test(q))) return {t:a.a};
  return {t:`<p>I could not match that to anything in your connected systems with enough confidence to answer it, and I would rather say so than produce something plausible.</p>
    <p>What I can answer from what I can actually see: your priorities and today's plan, blockers and who owns them, commitments you made, decisions and the reasoning behind them, your review queue, your calendar and where your time went, your budgets and travel, your learning, your accomplishment evidence, and how your role appears to be changing.</p>
    <p class="tiny muted">If you were asking about something in a system I am not connected to, the connectors are listed under <strong>Settings → Data sources</strong>.</p>`};
}
function send(q){
  q = String(q||'').trim(); if(!q) return;
  S.chat.push({who:'me', t:q});
  S.chat.push({who:'ai', typing:true});
  S.view='assistant'; render();
  setTimeout(()=>{
    S.chat.pop();
    S.chat.push(Object.assign({who:'ai'}, answerFor(q)));
    render();
    const l = $('#chatlog'); if(l) l.scrollTop = l.scrollHeight;
  }, 620);
}

function go(view, sub){
  if(!VIEWS[view]) return;
  S.view = view; S.railOpen=false;
  if(sub){
    if(sub.includes(':')){ const [k,val]=sub.split(':'); S.sub[k]=val; }
    else S.sub[view]=sub;
  }
  window.scrollTo({top:0,behavior:'instant'});
  render();
}

/* ═══════════════════════════════════════════════════════════════════════

document.addEventListener('click', e => {
  const t = e.target;
  const hit = sel => t.closest(sel);

  const closeEl = hit('[data-close]');
  if((closeEl && !closeEl.hasAttribute('data-go')) || (t.id==='scrim')){ closeOverlays(); return; }
  if(hit('[data-menu]')){ S.railOpen=!S.railOpen; render(); return; }

  const goEl = hit('[data-go]');
  if(goEl){ const sub = goEl.getAttribute('data-sub');
    closeOverlays(); go(goEl.getAttribute('data-go'), sub); return; }

  const subEl = hit('[data-sub]');
  if(subEl && !subEl.hasAttribute('data-go')){
    const s = subEl.getAttribute('data-sub');
    if(s.includes(':')){ const [k,v]=s.split(':'); S.sub[k] = v || null; }
    render(); return;
  }

  const cite = hit('.cite,[data-k],.psrc');
  if(cite && cite.getAttribute('data-k') || (cite && cite.classList.contains('psrc'))){
    showSource(cite.getAttribute('data-k') || cite.getAttribute('data-src') || cite.textContent); return;
  }

  const inst = hit('[data-inst]');
  if(inst){ const i = INSTRUMENTS.find(x=>x.id===inst.getAttribute('data-inst'));
    openDrawer(esc(i.label), `${esc(i.value)}${i.unit?' '+esc(i.unit):''} · ${esc(i.sub)}`,
      `<div class="card"><p style="font-size:12.5px;line-height:1.7">${esc(i.note)}</p>
       ${provRow({src:'Connected work systems', when:SYNC, conf:'high'})}</div>
       <div class="card" style="margin-top:14px;border-color:rgba(208,59,59,.22)">
         <div class="card-hd"><h3>Not a score</h3></div>
         <p class="card-sub" style="line-height:1.65">Every instrument on this strip is a descriptive signal about the state of your work. None of them is an employee performance score, none is compared against anyone else, and there is deliberately no composite number anywhere in this product.</p></div>
       <div class="btnrow" style="margin-top:14px"><button class="btn ai sm" data-go="${i.go}" data-close>Open ${esc(i.label)}</button></div>`);
    return; }

  const prio = hit('[data-prio]');
  if(prio){ const id = prio.getAttribute('data-prio'); S.sub.prio = S.sub.prio===id?null:id; render(); return; }

  const modalEl = hit('[data-modal]');
  if(modalEl){ openModalKey(modalEl.getAttribute('data-modal')); return; }

  const rdim = hit('[data-rdim]');
  if(rdim){ const p = READINESS.profile.find(x=>x.id===rdim.getAttribute('data-rdim'));
    openDrawer(esc(p.dim), `Assessment: ${esc(p.rating)} · every assessment is explainable`,
      `<div class="card"><div class="card-hd"><h3>What this says</h3><span class="chspacer"></span>${chip(p.rating,p.tone)}</div>
        <p class="card-sub" style="font-size:12.5px;line-height:1.7">${esc(p.summary)}</p></div>
       <div class="card" style="margin-top:13px"><div class="card-hd"><h3>Reasoning factors</h3></div>
         ${p.factors.map(f=>`<div class="contrib"><i class="cb" style="background:${HEX[p.tone]}"></i><div>${esc(f)}</div></div>`).join('')}</div>
       <div class="card" style="margin-top:13px"><div class="card-hd"><h3>Evidence &amp; sources</h3></div>
         <div class="tagrow">${p.ev.map(x=>`<span class="cite" data-k="${esc(x)}">${esc(x)}</span>`).join('')}</div>
         ${provRow({src:p.ev[0], when:p.updated, conf:p.conf})}</div>
       ${p.caveat?`<div class="conflict" style="margin-top:13px"><div class="ct">⚠ Read with this in mind</div>${esc(p.caveat)}</div>`:''}
       <div class="card" style="margin-top:13px"><div class="card-hd"><h3>Disagree with this?</h3></div>
         <p class="card-sub" style="line-height:1.65">Your correction takes precedence over the assistant's reading and is shown wherever this assessment appears.</p>
         <textarea class="editable" rows="3" placeholder="What has this got wrong?"></textarea>
         <div class="btnrow" style="margin-top:10px"><button class="btn ai sm" data-act="correctdemo">Submit correction</button></div></div>`);
    return; }

  const dep = hit('[data-dep]');
  if(dep){ const d = DEPS.find(x=>x.id===dep.getAttribute('data-dep'));
    openDrawer(esc(d.label), `${esc(d.kind)} · ${esc(d.dir)}`,
      `<div class="card">${kv('What',esc(d.what))}${kv('Direction',esc(d.dir))}${kv('Due',esc(d.due))}
        ${kv('Risk to your deadlines',chip(d.risk,d.risk==='critical'?'crit':d.risk==='high'?'ser':d.risk==='medium'?'warn':'neutral'))}</div>
       <div class="card" style="margin-top:13px"><div class="card-hd"><h3>What this map is built from</h3></div>
         <p class="card-sub" style="line-height:1.65">Explicit links only: Jira dependency links, review requests, ticket assignments, and approval records. It infers nothing about people.</p></div>`);
    return; }

  const bf = hit('[data-bfilter]'); if(bf){ S.sub.bf = bf.getAttribute('data-bfilter'); render(); return; }
  const tf = hit('[data-tfilter]'); if(tf){ S.sub.tf = tf.getAttribute('data-tfilter'); render(); return; }
  const ac = hit('[data-acat]');    if(ac){ S.sub.acat = ac.getAttribute('data-acat'); render(); return; }
  const sortEl = hit('[data-sort]');
  if(sortEl){ const k = sortEl.getAttribute('data-sort');
    S.sortT = {k, d: S.sortT.k===k ? -S.sortT.d : 1}; render(); return; }

  const howEl = hit('[data-how]');
  if(howEl){ const i = howEl.getAttribute('data-how'); S.sub['how'+i] = !S.sub['how'+i]; render(); return; }
  const simEl = hit('[data-sim]'); if(simEl){ S.sub.sim = +simEl.getAttribute('data-sim'); render(); return; }

  const draftEl = hit('[data-draft]');
  if(draftEl){ const b = BLOCKERS.find(x=>x.id===draftEl.getAttribute('data-draft'));
    openModal('Draft follow-up', `${esc(b.t)} · to ${esc(b.owner)} · nothing is sent without you`,
      `${aiNote('<div style="font-size:12.5px">Drafted from the ticket history and the published SLA. Rewrite it however you like — it is your message, in your name.</div>')}
       <textarea class="editable" rows="14" style="margin-top:13px">${esc(b.draft)}</textarea>`,
      `<span class="mspacer"></span><button class="btn sm" data-close>Discard</button>
       <button class="btn sm" data-act="copydoc">Copy</button>
       <button class="btn ai sm" data-act="sent">Send</button>`);
    return; }

  const escEl = hit('[data-escalate]');
  if(escEl){ const b = BLOCKERS.find(x=>x.id===escEl.getAttribute('data-escalate'));
    openModal('Escalate', esc(b.t),
      `<div class="card"><div class="card-hd"><h3>Escalation path</h3></div>
        ${kv('Current owner',esc(b.owner))}${kv('Waiting',esc(b.waiting))}${kv('Blocking',esc(b.blocking))}
        ${kv('Next escalation point', b.id==='b1'?'Security Platform lead, then your manager':'The owning team\'s lead')}</div>
       ${aiNote(`<div style="font-size:12.5px;line-height:1.65">Escalating means copying the owning team's lead and your manager on the existing thread. It does not create a ticket about anyone, and nothing about this is recorded against ${esc(b.owner.split('—')[0].trim())}.</div>`)}
       <div class="card" style="margin-top:13px"><div class="card-hd"><h3>Suggested wording</h3></div>
        <textarea class="editable" rows="6">Copying ${esc(ME.manager)} and the ${esc(b.owner.split('—')[0].trim())} lead for visibility. This has been waiting ${esc(b.waiting)} and is blocking ${esc(b.blocking)}. Happy to jump on a call if that is faster than the thread.</textarea></div>`,
      `<span class="mspacer"></span><button class="btn sm" data-close>Cancel</button>
       <button class="btn ai sm" data-act="escalated">Escalate</button>`);
    return; }

  const sn = hit('[data-snooze]');
  if(sn){ const id=sn.getAttribute('data-snooze'); S.snoozed[id]=!S.snoozed[id];
    toast(S.snoozed[id]?'Snoozed. It will resurface tomorrow morning.':'Unsnoozed.'); render(); return; }
  const rs = hit('[data-resolve]');
  if(rs){ const id=rs.getAttribute('data-resolve'); S.resolved[id]=true;
    toast('Marked resolved. The dependency stays in your map until the source system agrees.'); render(); return; }

  const dn = hit('[data-done]');
  if(dn){ const id=dn.getAttribute('data-done'); S.doneP[id]=!S.doneP[id];
    toast(S.doneP[id]?'Marked done. It stays on today\'s plan so the record is honest.':'Reopened.'); render(); return; }

  const cadd = hit('[data-cadd]');
  if(cadd){ const id=cadd.getAttribute('data-cadd'); const d=S.detected.find(x=>x.id===id);
    S.commitments.push({id:'n'+id, t:d.t, due:d.due, state:'confirmed', src:d.src, quote:d.quote, when:d.when, to:d.to,
      risk:'ok', note:'Added by you from a detected commitment.'});
    S.detected = S.detected.filter(x=>x.id!==id);
    toast('Added to your commitments — because you said so, not because it was detected.'); render(); return; }
  const cig = hit('[data-cignore]');
  if(cig){ const id=cig.getAttribute('data-cignore'); S.detected = S.detected.filter(x=>x.id!==id);
    toast('Dismissed and deleted. Dismissed detections are not retained.'); render(); return; }

  const mo = hit('[data-mapok]');
  if(mo){ S.mapFixed[mo.getAttribute('data-mapok')]=true; toast('Mapping confirmed. Confidence raised to high.'); render(); return; }
  const mf = hit('[data-mapfix]');
  if(mf){ const id = mf.getAttribute('data-mapfix');
    openModal('Correct this mapping', 'Your correction replaces the assistant\'s reading',
      `<div class="card"><div class="card-hd"><h3>Where should this work map?</h3></div>
        <p class="card-sub">The assistant will use your answer instead of its own inference, here and everywhere else this project appears.</p>
        <select class="fsel" style="width:100%;margin-bottom:10px">
          <option>Team — Payments Platform: transaction reliability</option>
          <option>Team — Observability: single event ingestion path</option>
          <option>Business Unit — Commerce: reduce checkout abandonment</option>
          <option selected>Unmapped — this work has no OKR link</option></select>
        <textarea class="editable" rows="3" placeholder="Why? (optional — helps the assistant stop making the same mistake)"></textarea></div>`,
      `<span class="mspacer"></span><button class="btn sm" data-close>Cancel</button>
       <button class="btn ai sm" data-act="mapped:${esc(id)}">Save correction</button>`);
    return; }
  const ma = hit('[data-mapadd]'); if(ma){ toast('Opening the mapping editor — your mapping, not the assistant\'s.'); return; }

  const fw = hit('[data-fixwork]');
  if(fw){ const c = fw.getAttribute('data-fixwork');
    openModal('Reclassify this work', esc(c),
      `<div class="card"><div class="card-hd"><h3>What kind of work is this really?</h3></div>
        <p class="card-sub">The assistant classified it from ticket type and calendar metadata. You know better.</p>
        <select class="fsel" style="width:100%">${WORK_INVENTORY.map(w=>`<option ${w.cat===c?'selected':''}>${esc(w.cat)}</option>`).join('')}</select></div>`,
      `<span class="mspacer"></span><button class="btn sm" data-close>Cancel</button>
       <button class="btn ai sm" data-act="fixedwork:${esc(c)}">Save</button>`);
    return; }

  const pl = hit('[data-plan]');
  if(pl){ const k = pl.getAttribute('data-plan'); S.plan[k] = !S.plan[k];
    toast(S.plan[k]?'Added to your development plan. Private to you.':'Removed from your plan.'); render(); return; }

  const tp = hit('[data-topic]'); if(tp){ const i=tp.getAttribute('data-topic'); S.sub['topic'+i]=!S.sub['topic'+i]; render(); return; }
  const at = hit('[data-aitopic]'); if(at){ const i=at.getAttribute('data-aitopic');
    S.sub['ai1on1'+i] = S.sub['ai1on1'+i]===false ? true : false; render(); return; }
  const ck = hit('[data-ck]'); if(ck){ const i=ck.getAttribute('data-ck'); S.sub['ck'+i]=!S.sub['ck'+i]; render(); return; }

  const vc = hit('[data-vconsent]');
  if(vc){ const i=vc.getAttribute('data-vconsent'); S.vaultConsent[i]=!S.vaultConsent[i];
    toast(S.vaultConsent[i]
      ? `Access granted to “${VAULT[i].t}” for this session only. Logged.`
      : `Access to “${VAULT[i].t}” revoked.`);
    render(); return; }

  const st = hit('[data-src-toggle]');
  if(st){ const n = st.getAttribute('data-src-toggle'); S.sources[n]=!S.sources[n];
    toast(S.sources[n] ? `${n} connected. Only the listed scopes are read.`
      : `${n} disconnected. Claims derived from it are marked stale rather than kept.`);
    render(); return; }

  const ps = hit('[data-pstate]'); if(ps){ cyclePState(ps.getAttribute('data-pstate')); return; }

  const askEl = hit('[data-ask]'); if(askEl){ send(askEl.getAttribute('data-ask')); return; }
  if(hit('[data-send]')){ const q=$('#chatq'); if(q){ send(q.value); q.value=''; } return; }

  const fs = hit('[data-focus-start]'); if(fs){ closeOverlays(); startFocus(fs.getAttribute('data-focus-start')); return; }
  if(hit('[data-focus-end]')){ endFocus(); return; }
  if(hit('[data-focus-open]')){
    if(S.focusTask){ $('#focus').classList.add('on'); document.body.style.overflow='hidden'; }
    else startFocus('p1');
    return; }

  const md = hit('[data-mode]');
  if(md){ const m = md.getAttribute('data-mode');
    if(m==='incident'){ S.incidentMode = !S.incidentMode; toast(S.incidentMode?'Incident mode on. The cockpit is showing INC-2291 first.':'Incident mode off.'); }
    if(m==='incident-off') S.incidentMode=false;
    if(m==='vacation-off') S.vacationMode=false;
    closeOverlays(); render(); return; }

  const cor = hit('[data-correct]');
  if(cor){ openModal('Correct this', esc(cor.getAttribute('data-correct')),
    `<div class="card"><p class="card-sub" style="line-height:1.65">Tell the assistant what is wrong. Your correction is stored against the claim, shown wherever the claim appears, and used in preference to the original reading.</p>
      <textarea class="editable" rows="4" placeholder="What is wrong, and what is actually true?"></textarea></div>`,
    `<span class="mspacer"></span><button class="btn sm" data-close>Cancel</button>
     <button class="btn ai sm" data-act="correctdemo">Save correction</button>`); return; }

  const actEl = hit('[data-act]');
  if(actEl){ doAction(actEl.getAttribute('data-act')); return; }

  const row = hit('tr[data-k],[data-cmt]');
  if(row && row.getAttribute('data-k')){ showSource(row.getAttribute('data-k')); return; }
});

function doAction(a){
  const [k,arg] = a.split(':');
  const M = {
    protect:()=>toast('Two 90-minute focus blocks proposed on your calendar as “tentative”. Nothing was accepted or declined for you.'),
    agenda:()=>{ closeOverlays(); openModal('Agenda request', 'Vendor demo · Thursday · 14 invitees',
      `${aiNote('<div style="font-size:12.5px">The assistant drafts; you decide whether to send. It will not decline the meeting on your behalf, now or ever.</div>')}
       <textarea class="editable" rows="7" style="margin-top:13px">Hi — could we get an agenda for Thursday's demo before it runs? With 14 people on the invite it would help everyone judge whether they need to be there live, and I would rather give you a useful hour than a distracted one.

If the purchasing decision is being made elsewhere, I am happy to read the notes instead.

Thanks,
Maya</textarea>`,
      `<span class="mspacer"></span><button class="btn sm" data-close>Discard</button><button class="btn ai sm" data-act="sent">Send</button>`); },
    sent:()=>{ closeOverlays(); toast('Sent from your account, in your name. Logged in your audit trail.'); },
    escalated:()=>{ closeOverlays(); toast('Escalated on the existing thread. Nothing was recorded about the person you are waiting on.'); },
    unlock:()=>{ S.vaultUnlocked=true; toast('Vault unlocked for this session. Every category is still off until you switch it on.'); render(); },
    lock:()=>{ S.vaultUnlocked=false; S.vaultConsent={}; toast('Vault locked and all consent revoked.'); render(); },
    revokeall:()=>{ S.vaultConsent={}; toast('All vault access revoked.'); render(); },
    share1on1:()=>{ closeOverlays(); openModal('Share with your manager', 'You control exactly what goes',
      `<div class="card"><div class="card-hd"><h3>What ${esc(ME.manager)} would receive</h3></div>
        ${['Since our last 1:1','Current priorities','Blockers needing your help','Decisions needed','Risks','Growth','Topics I want to raise']
          .map((x,i)=>`<div class="consent"><button class="toggle on" data-noop aria-label="Include"></button><div>${esc(x)}</div></div>`).join('')}</div>
       <div class="card" style="margin-top:13px;border-color:rgba(208,59,59,.26)">
         <div class="card-hd"><h3>What is excluded, always</h3></div>
         ${['Your private notes','Your AI readiness profile','Your career exploration notes','Anything in the Private Vault','Your workload and time-allocation data']
           .map(g=>`<div class="guard"><span class="gx">✕</span> ${esc(g)}</div>`).join('')}</div>`,
      `<span class="mspacer"></span><button class="btn sm" data-close>Cancel</button><button class="btn ai sm" data-act="shared">Share</button>`); },
    shared:()=>{ closeOverlays(); S.shared['1:1']=true; toast(`Shared with ${ME.manager}. Recorded in your audit log as a share by you.`); },
    share:()=>{ closeOverlays(); toast(`Shared with ${ME.manager}. Only what you included was sent.`); },
    copydoc:()=>{ const el = $('#modal .editable'); if(el){ try{ el.select(); document.execCommand('copy'); }catch(e){} } toast('Copied.'); },
    copyreview:()=>{ const el = $('#revdraft'); if(el){ try{ el.select(); document.execCommand('copy'); }catch(e){} } toast('Draft copied. It is yours to edit and yours to use.'); },
    printdoc:()=>window.print(),
    regen:()=>toast('Regenerated from your 12 evidence entries. Nothing was added that has no source.'),
    correctdemo:()=>{ closeOverlays(); S.correction.demo=true; toast('Correction saved. It now takes precedence over the assistant\'s own reading.'); render(); },
    forget:()=>{ closeOverlays(); openModal('Delete assistant memory', 'This cannot be undone',
      `<div class="card"><p class="card-sub" style="line-height:1.7">This erases everything the assistant has inferred: priorities, mappings, detected commitments, summaries, readiness assessments and corrections. Your source systems are untouched — Jira, GitHub and the rest keep their own data.</p>
        <p class="card-sub" style="line-height:1.7;margin-top:10px">The cockpit will rebuild from scratch on the next sync, and it will be wrong about some things again until you correct them.</p></div>`,
      `<span class="mspacer"></span><button class="btn sm" data-close>Keep it</button><button class="btn danger sm" data-act="forgotten">Delete everything</button>`); },
    forgotten:()=>{ closeOverlays(); toast('In the real product this would erase all inferred data. This is a prototype, so nothing was deleted.'); },
    export:()=>toast('Export prepared: every record, every inference, every source, as JSON and PDF.'),
    explore:()=>toast('Opening the project brief. Looking at an internal project is not visible to your manager.'),
    discuss:()=>{ go('oneonone'); toast('Added to your 1:1 topics. Still a draft, still yours.'); },
    dismisspto:()=>toast('Dismissed. Your leave is your leave.'),
    pickjira:()=>toast('Jira marked authoritative for this field. The calendar value is kept visible as a dissenting source.'),
    pickcal:()=>toast('Calendar marked authoritative for this field. The Jira value is kept visible as a dissenting source.'),
    leaveboth:()=>toast('Both values kept visible. The assistant will not pick one.'),
    'focus-mute':()=>{ S.muteNotifs=!S.muteNotifs; renderFocus(); toast(S.muteNotifs?'Non-critical notifications muted.':'Notifications unmuted.'); },
    mapped:()=>{ closeOverlays(); if(arg) S.mapFixed[arg]=true; toast('Mapping corrected. Yours now takes precedence.'); render(); },
    fixedwork:()=>{ closeOverlays(); if(arg) S.workFixed[arg]=true; toast('Reclassified. The assistant will use your classification.'); render(); }
  };
  (M[k]||(()=>toast('Noted.')))();
}

/* ── keyboard, search, input ──────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if($('#focus').classList.contains('on')) return;
    closeOverlays(); const g=$('#gres'); if(g) g.classList.remove('on');
  }
  if(e.key === 'Enter' && e.target.id === 'chatq' && !e.shiftKey){
    e.preventDefault(); send(e.target.value); e.target.value='';
  }
  if((e.key === '/' ) && !/input|textarea|select/i.test((e.target.tagName||''))){
    const q = $('#gq'); if(q){ e.preventDefault(); q.focus(); }
  }
});
document.addEventListener('keypress', e => {
  if(e.key === 'Enter' && (e.target.classList||{contains:()=>false}).contains('inst')) e.target.click();
});

const SEARCH_INDEX = () => [
  ...KNOWLEDGE.map(k=>({t:`${k.k} — ${k.t}`, m:`${k.kind} · updated ${k.updated}`, k:k.k})),
  ...TICKETS.map(x=>({t:`${x.k} — ${x.t}`, m:`Jira · ${x.s} · due ${x.due}`, k:x.k})),
  ...PRS.map(p=>({t:`PR #${p.n} — ${p.t}`, m:`${p.repo} · ${p.state}`, k:'PR #'+p.n})),
  ...DECISIONS.map(d=>({t:d.t, m:`Decision · ${d.date} · ${d.status}`, k:d.docs[0]})),
  ...INCIDENTS.map(i=>({t:`${i.id} — ${i.t}`, m:`Incident · ${i.sev} · ${i.state}`, k:i.id})),
  ...ACCOMPLISHMENTS.map(a=>({t:a.t, m:`Accomplishment · ${a.when}`, k:a.ev[0]})),
  ...Object.keys(VIEWS).map(v=>({t:`Go to ${v==='oneonone'?'1:1':v.charAt(0).toUpperCase()+v.slice(1)}`, m:'Navigation', go:v}))
];
document.addEventListener('input', e => {
  if(e.target.id === 'gq'){
    const q = e.target.value.trim().toLowerCase(), box = $('#gres');
    if(!q){ box.classList.remove('on'); box.innerHTML=''; return; }
    const hits = SEARCH_INDEX().filter(x=>(x.t+' '+x.m).toLowerCase().includes(q)).slice(0,9);
    box.innerHTML = hits.length
      ? hits.map(h=>`<div class="gres-item" ${h.go?`data-go="${h.go}"`:`data-k="${esc(h.k)}"`}>
          <div class="gres-t">${esc(h.t)}</div><div class="gres-m">${esc(h.m)}</div></div>`).join('')
      : `<div class="gres-empty">Nothing found in the systems you have connected.<br>
          The assistant will not guess at what it cannot see.</div>`;
    box.classList.add('on');
  }
  if(e.target.id === 'kq'){
    const q = e.target.value.trim().toLowerCase();
    $('#kres').innerHTML = KNOWLEDGE.filter(k=>(k.k+' '+k.t+' '+k.snip+' '+k.kind).toLowerCase().includes(q))
      .map(knowRow).join('') || `<div class="empty"><div class="ei">—</div><h4>No matching document</h4>
        <p>Nothing in the spaces you have access to matches that. The assistant will say so rather than compose an answer — inventing company policy is the most damaging thing it could do.</p></div>`;
  }
  if(e.target.id === 'chatq'){
    e.target.style.height='auto'; e.target.style.height = Math.min(120, e.target.scrollHeight)+'px';
  }
});
document.addEventListener('click', e => {
  if(!e.target.closest('.gsearch')){ const g=$('#gres'); if(g) g.classList.remove('on'); }
}, true);
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if(h && VIEWS[h] && h!==S.view){ S.view=h; render(); }
});

/* ── boot ─────────────────────────────────────────────────────────────── */
(function init(){
  const h = location.hash.slice(1);
  if(h && VIEWS[h]) S.view = h;
  render();
  if(!sessionStorage.getItem('icfd-greeted')){
    try{ sessionStorage.setItem('icfd-greeted','1'); }catch(err){}
    setTimeout(()=>toast('Everything here is private to you by default. Press / to search, Esc to close.'), 900);
  }
  window.addEventListener('load', drawCharts);
})();
</script>
</body>
