    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>
<main id="jsMain" class="jsWrap"><div class="jsCol">
  <div class="jsToolbar"><div><h1>Alerts</h1><p>A saved search that tells you what is new since you last looked. No email address needed.</p></div></div>
  <section class="jsPanel" style="margin-top:18px">
    <h2>New alert</h2>
    <form id="jsAlertForm">
      <fieldset class="jsField" style="padding-top:0"><legend>Name</legend>
        <input type="text" id="a-name" placeholder="Verified data engineering, remote" required></fieldset>
      <fieldset class="jsField"><legend>Role or skill</legend><input type="text" id="a-q" placeholder="data engineer"></fieldset>
      <fieldset class="jsField"><legend>Location</legend><input type="text" id="a-location" placeholder="Pittsburgh or Remote"></fieldset>
      <fieldset class="jsField"><legend>Only tell me about</legend>
        <label class="jsCheck" for="a-verified6h"><input type="checkbox" id="a-verified6h"><span>Roles verified in the last 6 hours</span></label>
        <label class="jsCheck" for="a-salaryOnly"><input type="checkbox" id="a-salaryOnly"><span>Roles with a disclosed salary</span></label>
        <label class="jsCheck" for="a-visa"><input type="checkbox" id="a-visa"><span>Roles mentioning visa sponsorship</span></label>
        <label class="jsCheck" for="a-hideReposted"><input type="checkbox" id="a-hideReposted"><span>Roles that have not been reposted</span></label>
        <label class="jsCheck" for="a-directOnly"><input type="checkbox" id="a-directOnly"><span>Direct employer applications only</span></label>
      </fieldset>
      <button type="submit" class="jsBtn jsBtn--primary" style="margin-top:18px">Save alert</button>
    </form>
  </section>
  <div id="jsAlerts" aria-live="polite"></div>
</div><div id="jsFooter"></div></main>
<script defer src="/jobs/js/dom.js"></script>
<script defer src="/jobs/js/ui/icon.js"></script>
<script defer src="/jobs/js/format.js"></script>

<script defer src="/jobs/js/tracker.js"></script>
<script defer src="/jobs/js/query.js"></script>
<script defer src="/jobs/js/search.js"></script>
<script defer src="/jobs/js/ui/card.js"></script>
<script defer src="/jobs/js/ui/popover.js"></script>
<script defer src="/jobs/js/ui/states.js"></script>
<script defer src="/jobs/js/alerts.js"></script>
<script defer src="/jobs/js/pages/alerts.js"></script>
<img src="https://ps.paddyspeaks.com/api/px.gif?p=/jobs/alerts/" alt="" width="1" height="1" style="position:absolute;opacity:0" loading="eager">
</body>
