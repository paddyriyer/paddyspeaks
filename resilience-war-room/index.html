<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#edf0f4;--bg2:#f6f8fa;--panel:#ffffff;--panel2:#f3f6f9;--panel3:#e4e9ef;
  --line:#e1e6ec;--line2:#c9d2dc;--line3:#a9b6c4;
  --text:#101822;--muted:#51606f;--dim:#6a7889;
  --amber:#935c00;--red:#cc1f34;--teal:#0b7a70;--steel:#46617f;--green:#0a7f57;--violet:#6d4bd4;--ice:#0891b2;
  --mono:'Roboto Mono',ui-monospace,monospace;
  --cond:'Barlow Condensed','Barlow',sans-serif;
}
html,body{height:100%;font-family:'Barlow',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13.5px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
/* faint operations-room grid, kept well under the content */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.65;
  background-image:linear-gradient(rgba(70,97,127,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(70,97,127,.09) 1px,transparent 1px);
  background-size:48px 48px}
#app{position:relative;z-index:1;min-height:100vh}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:0}
::-webkit-scrollbar-thumb:hover{background:var(--line3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.cond{font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em}

/* ── command bar ── */
.cmdbar{background:linear-gradient(180deg,#ffffff,#f4f7fa);border-bottom:1px solid var(--line2);padding:11px 22px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;position:sticky;top:0;z-index:130;flex-wrap:wrap}
.sig{display:flex;align-items:center;gap:13px}
.sig-badge{width:38px;height:38px;border:1px solid var(--amber);display:flex;align-items:center;justify-content:center;
  background:rgba(147,92,0,.13);position:relative;clip-path:polygon(14% 0,100% 0,100% 86%,86% 100%,0 100%,0 14%)}
.sig-badge span{font-family:var(--cond);font-weight:700;font-size:16px;color:var(--amber);letter-spacing:.05em}
.sig h1{font-family:var(--cond);font-size:19px;font-weight:700;letter-spacing:.055em}
.sig .sub{font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-top:1px}
.cmd-right{text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.pulse{display:inline-block;width:7px;height:7px;background:var(--green);margin-right:6px;animation:bl 2s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes ring{0%{r:5;opacity:.85}100%{r:22;opacity:0}}
.back{color:var(--ice);text-decoration:none;font-size:10px;opacity:.75}
.back:hover{opacity:1}

/* ── posture strip ── */
.posture{display:flex;align-items:stretch;background:var(--bg2);border-bottom:1px solid var(--line)}
.pst-l{padding:9px 22px;display:flex;align-items:center;gap:11px;border-right:1px solid var(--line)}
.pst-l .lbl{font-family:var(--cond);font-size:11px;color:var(--dim);letter-spacing:.11em}
.pst-l .lvl{font-family:var(--cond);font-size:17px;font-weight:700;letter-spacing:.06em}
.pst-steps{display:flex;flex:1;gap:0}
.pstep{flex:1;padding:9px 10px;border-right:1px solid var(--line);font-family:var(--mono);font-size:9.5px;
  color:var(--dim);text-align:center;position:relative;transition:background .2s}
.pstep.on{color:#fff;font-weight:700}
.pst-r{padding:9px 20px;font-family:var(--mono);font-size:10px;color:var(--muted);display:flex;align-items:center;gap:16px;border-left:1px solid var(--line)}

/* ── tabs ── */
.tabs{display:flex;background:var(--bg);border-bottom:1px solid var(--line2);padding:0 22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--cond);padding:11px 16px;font-size:13px;font-weight:600;letter-spacing:.075em;color:var(--muted);
  background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .18s;text-transform:uppercase}
.tab:hover{color:var(--text);background:rgba(70,97,127,.08)}
.tab.active{color:var(--amber);border-bottom-color:var(--amber);background:linear-gradient(180deg,rgba(147,92,0,.09),transparent)}

/* ── filters ── */
.fbar{display:flex;align-items:center;gap:17px;flex-wrap:wrap;padding:9px 22px;background:var(--bg2);border-bottom:1px solid var(--line)}
.fg{display:flex;align-items:center;gap:7px}
.fl{font-family:var(--cond);font-size:10px;color:var(--dim);letter-spacing:.12em}
select.fs{background:var(--panel);color:var(--text);border:1px solid var(--line2);padding:5px 9px;font-size:11.5px;
  font-family:'Barlow',sans-serif;cursor:pointer;outline:none;border-radius:0}
select.fs:hover,select.fs:focus{border-color:var(--amber)}
.fspace{flex:1}
.fnote{font-family:var(--mono);font-size:10px;color:var(--dim)}

/* ── layout ── */
.stage{padding:18px 22px 54px;max-width:1660px;margin:0 auto;animation:up .3s ease}
.sh{display:flex;align-items:center;gap:13px;margin:22px 0 11px}
.sh:first-child{margin-top:0}
.sh h2{font-family:var(--cond);font-size:16px;font-weight:700;letter-spacing:.07em}
.sh .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.sh .meta{font-family:var(--mono);font-size:10px;color:var(--dim)}
.g{display:grid;gap:12px;margin-bottom:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.g23{grid-template-columns:2fr 1fr}.g32{grid-template-columns:1fr 2fr}

/* ── panels: hard-edged, corner-notched ── */
.pnl{background:var(--panel);border:1px solid var(--line2);padding:14px 16px;position:relative}
.pnl::before,.pnl::after{content:'';position:absolute;width:7px;height:7px;border-color:var(--line3);border-style:solid}
.pnl::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
.pnl::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
.pnl-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:3px}
.pnl-h h3{font-family:var(--cond);font-size:13px;font-weight:600;letter-spacing:.075em}
.pnl-s{font-size:11px;color:var(--dim);margin-bottom:12px;line-height:1.5}
.chip{font-family:var(--mono);font-size:9px;font-weight:500;padding:2px 7px;border:1px solid;letter-spacing:.04em;white-space:nowrap}
.c-red{border-color:rgba(204,31,52,.5);color:var(--red);background:rgba(204,31,52,.09)}
.c-amber{border-color:rgba(147,92,0,.5);color:var(--amber);background:rgba(147,92,0,.09)}
.c-green{border-color:rgba(10,127,87,.45);color:var(--green);background:rgba(10,127,87,.08)}
.c-teal{border-color:rgba(11,122,112,.45);color:var(--teal);background:rgba(11,122,112,.08)}
.c-steel{border-color:var(--line3);color:var(--muted)}
.chart{position:relative;width:100%;height:255px}
.chart>canvas{position:absolute;top:0;left:0}
.chart-s{height:200px}

/* ── KPI tiles ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px;margin-bottom:14px}
@media(min-width:1380px){.kpis.ten{grid-template-columns:repeat(5,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line2);padding:12px 14px;position:relative;cursor:pointer;transition:border-color .18s,background .18s}
.kpi:hover{border-color:var(--line3);background:var(--panel2)}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:2px}
.kpi .l{font-family:var(--cond);font-size:10.5px;color:var(--muted);letter-spacing:.1em}
.kpi .v{font-family:var(--mono);font-size:23px;font-weight:500;margin-top:5px;letter-spacing:-.5px}
.kpi .d{font-size:10px;color:var(--dim);margin-top:4px;line-height:1.4}

/* ── world map ── */
.mapwrap{position:relative;background:linear-gradient(180deg,#f7f9fc,#eef2f7);border:1px solid var(--line2)}
.map{display:block;width:100%;height:auto;max-height:min(62vh,560px)}
.land{fill:#dbe3ec;stroke:#b6c4d3;stroke-width:.8}
.node{cursor:pointer}
.node circle.core{transition:r .18s}
.node:hover circle.core{r:9}
.node text{font-family:var(--mono);font-size:9px;fill:var(--muted);pointer-events:none}
.overlays{display:flex;gap:0;border-top:1px solid var(--line2);background:var(--bg2)}
.ov{flex:1;padding:8px 6px;font-family:var(--cond);font-size:11px;letter-spacing:.09em;color:var(--dim);
  background:none;border:none;border-right:1px solid var(--line);cursor:pointer;transition:all .18s;text-transform:uppercase}
.ov:last-child{border-right:none}
.ov:hover{color:var(--text);background:rgba(70,97,127,.09)}
.ov.on{color:#fff;font-weight:700}

/* ── vendor graph ── */
.graph{display:block;width:100%;height:auto;max-height:min(66vh,620px);background:linear-gradient(180deg,#f7f9fc,#eef2f7);border:1px solid var(--line2)}
.edge{stroke:#b0bdcb;stroke-width:1;transition:stroke .2s,stroke-width .2s}
.edge.hot{stroke:var(--red);stroke-width:2}
.vnode{cursor:pointer}
.vnode rect,.vnode circle{transition:all .18s}
.vnode text{font-family:var(--mono);font-size:8.5px;fill:var(--muted);pointer-events:none}
.vnode.hot text{fill:var(--text)}

/* ── tables ── */
.tw{overflow:auto;max-height:420px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
thead{position:sticky;top:0;z-index:3}
th{background:var(--panel2);color:var(--muted);font-family:var(--cond);font-weight:600;font-size:10.5px;letter-spacing:.09em;
  padding:8px 10px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap;text-transform:uppercase}
th.n{text-align:right}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
tr.hv{cursor:pointer}
tr.hv:hover td{background:rgba(147,92,0,.07)}
td .sub{display:block;font-size:9.5px;color:var(--dim);margin-top:2px;font-family:var(--mono)}

/* ── bars & meters ── */
.br{display:grid;grid-template-columns:158px 1fr 62px;gap:10px;align-items:center;padding:5px 0;font-size:11.5px}
.br-l{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br-t{height:12px;background:var(--panel3);position:relative;overflow:hidden}
.br-f{height:100%;transition:width .5s ease}
.br-v{text-align:right;font-family:var(--mono);font-size:10.5px;font-weight:500}
.meter{display:flex;gap:2px;margin-top:7px}
.mseg{flex:1;height:6px;background:var(--panel3)}

/* ── incidents ── */
.inc{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-left:3px solid var(--amber);
  background:var(--panel);margin-bottom:8px;cursor:pointer;transition:transform .18s,border-color .18s}
.inc:hover{transform:translateX(3px);border-color:var(--line3)}
.inc-id{font-family:var(--mono);font-size:10px;color:var(--dim);min-width:62px}
.inc-t{font-size:12px;font-weight:600}
.inc-d{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.inc-m{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:5px}

/* ── scenarios ── */
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));gap:11px}
.sc{background:var(--panel);border:1px solid var(--line2);padding:14px 15px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.sc:hover{border-color:var(--amber);transform:translateY(-2px)}
.sc.on{border-color:var(--amber);background:linear-gradient(160deg,rgba(147,92,0,.1),var(--panel))}
.sc-ico{font-size:19px;margin-bottom:8px}
.sc-t{font-family:var(--cond);font-size:14px;font-weight:600;letter-spacing:.05em}
.sc-d{font-size:10.5px;color:var(--dim);margin-top:5px;line-height:1.5}
.sc-p{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.simbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:13px 16px;background:var(--panel2);border:1px solid var(--line2);margin-bottom:12px}
.simbar .lbl{font-family:var(--cond);font-size:11px;color:var(--muted);letter-spacing:.1em}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:var(--panel3);outline:none;cursor:pointer;width:190px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;background:var(--amber);cursor:pointer;border-radius:0;box-shadow:0 0 9px rgba(147,92,0,.6)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;background:var(--amber);cursor:pointer;border-radius:0}
.sev{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--amber);min-width:86px}

/* ── playbooks ── */
.pb{border:1px solid var(--line2);background:var(--panel);margin-bottom:10px;transition:border-color .2s}
.pb.active{border-color:var(--green)}
.pb-h{display:flex;align-items:center;gap:13px;padding:13px 15px;cursor:pointer}
.pb-n{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:46px}
.pb-t{font-family:var(--cond);font-size:14px;font-weight:600;letter-spacing:.05em;flex:1}
.pb-b{padding:0 15px 15px 74px;font-size:11.5px;color:var(--muted);line-height:1.6}
.pb-step{display:flex;gap:11px;padding:6px 0;border-bottom:1px solid var(--line)}
.pb-step:last-child{border-bottom:none}
.pb-step .n{font-family:var(--mono);font-size:10px;color:var(--amber);min-width:18px}
.btn{font-family:var(--cond);font-size:11px;font-weight:600;letter-spacing:.11em;padding:6px 14px;background:none;
  border:1px solid var(--line3);color:var(--muted);cursor:pointer;transition:all .18s;text-transform:uppercase}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.go{border-color:var(--green);color:var(--green);background:rgba(10,127,87,.08)}

/* ── stats ── */
.st{border:1px solid var(--line2);background:var(--panel);padding:11px 13px}
.st .l{font-family:var(--cond);font-size:10.5px;color:var(--muted);letter-spacing:.1em}
.st .v{font-family:var(--mono);font-size:19px;font-weight:500;margin-top:4px}
.st .d{font-size:10px;color:var(--dim);margin-top:3px;line-height:1.45}

/* ── hover card ── */
.hc{position:fixed;z-index:900;background:#ffffff;border:1px solid var(--line3);padding:13px 15px;width:324px;
  max-height:84vh;overflow-y:auto;box-shadow:0 20px 54px rgba(16,24,34,.16);pointer-events:none;opacity:0;transition:opacity .15s}
.hc.on{opacity:1}
.hc h4{font-family:var(--cond);font-size:12.5px;font-weight:700;color:var(--amber);letter-spacing:.09em;margin-bottom:9px}
.hr{display:flex;justify-content:space-between;gap:11px;padding:4px 0;font-size:10.5px;border-bottom:1px solid rgba(16,24,34,.06)}
.hr:last-of-type{border-bottom:none}
.hr .k{color:var(--muted)}
.hr .v{font-family:var(--mono);font-weight:500}
.hc-n{margin-top:9px;padding-top:8px;border-top:1px solid var(--line2);font-size:10px;color:var(--muted);line-height:1.55}

/* ── modal ── */
.bd{position:fixed;inset:0;background:rgba(16,24,34,.34);z-index:940;opacity:0;pointer-events:none;transition:opacity .2s}
.bd.on{opacity:1;pointer-events:auto}
.md{position:fixed;top:50%;left:50%;transform:translate(-50%,-48%);width:min(800px,calc(100vw - 34px));max-height:85vh;
  overflow-y:auto;background:var(--panel);border:1px solid var(--line3);z-index:950;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;box-shadow:0 40px 90px rgba(16,24,34,.18)}
.md.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.md-h{padding:18px 22px 13px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:15px;
  align-items:flex-start;position:sticky;top:0;background:var(--panel);z-index:2}
.md-h h2{font-family:var(--cond);font-size:19px;font-weight:700;letter-spacing:.055em}
.md-h p{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:4px}
.mx{background:none;border:1px solid var(--line2);color:var(--muted);width:28px;height:28px;cursor:pointer;font-size:14px;flex-shrink:0}
.mx:hover{color:var(--red);border-color:var(--red)}
.md-b{padding:17px 22px 23px}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin-bottom:16px}
.ms{margin-top:15px}
.ms h4{font-family:var(--cond);font-size:11.5px;font-weight:600;color:var(--ice);letter-spacing:.1em;margin-bottom:8px}
.ms p{font-size:12px;color:var(--muted);line-height:1.68}
.ml{list-style:none}
.ml li{font-size:11.5px;color:var(--muted);padding:7px 0 7px 21px;position:relative;line-height:1.55;border-bottom:1px solid rgba(16,24,34,.06)}
.ml li::before{content:'▸';position:absolute;left:0;color:var(--amber)}
.ml li:last-child{border-bottom:none}

.note{margin-top:28px;padding:12px 15px;border:1px solid var(--line);border-left:3px solid var(--line3);
  font-size:10.5px;color:var(--dim);line-height:1.65}
.note b{color:var(--muted)}

@media(max-width:1240px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.g3,.g23,.g32{grid-template-columns:1fr}}
@media(max-width:840px){.g2,.g4,.g5{grid-template-columns:1fr}.stage{padding:14px 12px 44px}.cmdbar{padding:10px 12px;position:relative}
  .tabs,.fbar{padding-left:12px;padding-right:12px}.hc{display:none}.posture{flex-direction:column}.pst-l,.pst-r{border-right:none;border-left:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ═══════════════════════════════════════════════════════════════
   ENTERPRISE RESILIENCE & SCENARIO WAR ROOM
   Synthetic dataset. Reference org: "Arclight Industrial" — global
   manufacturer, $6.8B revenue, 41 plants, 1,840 suppliers, 62 countries.
   ═══════════════════════════════════════════════════════════════ */

const TABS = [
  { id:'overview', label:'Resilience Overview' },
  { id:'map',      label:'Global Risk Map' },
  { id:'supply',   label:'Supply Chain Health' },
  { id:'vendor',   label:'Vendor Exposure' },
  { id:'cyber',    label:'Cyber & Operational Risk' },
  { id:'scenario', label:'Scenario Planning' },
  { id:'playbook', label:'Response Playbooks' }
];

const POSTURE_LEVELS = [
  { k:'SECURE',   c:'#0a7f57' }, { k:'GUARDED',  c:'#0b7a70' }, { k:'ELEVATED', c:'#935c00' },
  { k:'HIGH',     c:'#c2571a' }, { k:'SEVERE',   c:'#cc1f34' }
];
const CURRENT_POSTURE = 2;   // ELEVATED

const MONTHS = ['Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'];

const n0 = n => Math.round(n).toLocaleString('en-US');

const $M = n => n >= 1000 ? '$' + n1(n/1000,2) + 'B' : '$' + n0(n) + 'M';

}

}

/* equirectangular projection into the map viewBox */
const MAPW = 1000, MAPH = 370, LAT_TOP = 78, LAT_BOT = -55;
const px = lon => ((lon + 180) / 360) * MAPW;
const py = lat => ((LAT_TOP - lat) / (LAT_TOP - LAT_BOT)) * MAPH;

function killCharts(){ Object.values(charts).forEach(c => { try { c.destroy(); } catch(e){} }); charts = {}; }
function mk(id, cfg){
  const cv = document.getElementById(id);
  if (!cv || typeof Chart === 'undefined') return;
  // Chart.js reads these from `options`, not from the config root.
  const base = { options: {
    responsive:true, maintainAspectRatio:false, interaction:{ mode:'index', intersect:false },
    plugins:{
      legend:{ display:false, labels:{ color:'#51606f', font:{ size:10, family:'Barlow' }, boxWidth:9, boxHeight:9, usePointStyle:true } },
      tooltip:{ backgroundColor:'rgba(255,255,255,.98)', borderColor:'#a9b6c4', borderWidth:1, titleColor:'#101822',
        bodyColor:'#51606f', padding:10, cornerRadius:0, titleFont:{ size:11, weight:'700', family:'Roboto Mono' },
        bodyFont:{ size:11, family:'Roboto Mono' }, displayColors:true, boxPadding:3 }
    },
    scales:{
      x:{ grid:{ color:'rgba(70,97,127,.09)', drawTicks:false }, border:{ display:false },
          ticks:{ color:'#6f7d8d', font:{ size:10, family:'Roboto Mono' } } },
      y:{ grid:{ color:'rgba(70,97,127,.09)', drawTicks:false }, border:{ display:false },
          ticks:{ color:'#6f7d8d', font:{ size:10, family:'Roboto Mono' } } }
    }
  } };
  charts[id] = new Chart(cv.getContext('2d'), deep(base, cfg));
}
function deep(a,b){
  const o = Array.isArray(a) ? a.slice() : Object.assign({}, a);
  for (const k in b){
    if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') o[k] = deep(a[k], b[k]);
    else o[k] = b[k];
  }
  return o;
}
function grad(ctx, rgb, top=.3){
  const g = ctx.createLinearGradient(0,0,0,240);
  g.addColorStop(0, `rgba(${rgb},${top})`); g.addColorStop(1, `rgba(${rgb},0)`); return g;
}

/* Labels are placed per node: the European and Gulf clusters sit too close
   for a single default position to stay legible. */
function label(n, x, y, r){
  const txt = esc(n.hub.toUpperCase());
  switch (n.lp){
    case 's': return `<text x="${x}" y="${(y + r + 14).toFixed(1)}" text-anchor="middle">${txt}</text>`;
    case 'w': return `<text x="${(x - r - 7).toFixed(1)}" y="${(y + 3.5).toFixed(1)}" text-anchor="end">${txt}</text>`;
    case 'e': return `<text x="${(x + r + 7).toFixed(1)}" y="${(y + 3.5).toFixed(1)}" text-anchor="start">${txt}</text>`;
    default:  return `<text x="${x}" y="${(y - r - 7).toFixed(1)}" text-anchor="middle">${txt}</text>`;
  }
}

function mapSvg(){
  const paths = LAND.map(poly =>
    `<path class="land" d="M${poly.map(p => px(p[0]).toFixed(1) + ',' + py(p[1]).toFixed(1)).join('L')}Z"/>`).join('');

  const ov = OVERLAYS.find(o => o.k === overlay);
  const val = n => overlay === 'composite' ? composite(n) : n[overlay];

  const marks = nodes().map(n => {
    const x = px(n.lon), y = py(n.lat), v = val(n);
    const r = 4 + (v / 100) * 7;
    const col = overlay === 'composite' ? riskHex(v) : ov.col;
    const alarm = v >= 65;
    return `<g class="node" data-hc="node" data-id="${n.id}" data-md="node">
      ${alarm ? `<circle cx="${x}" cy="${y}" r="5" fill="none" stroke="${col}" stroke-width="1.2" opacity=".55">
        <animate attributeName="r" values="5;22" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".55;0" dur="2.6s" repeatCount="indefinite"/></circle>` : ''}
      <circle cx="${x}" cy="${y}" r="${(r + 5).toFixed(1)}" fill="${col}" opacity=".14"/>
      <circle class="core" cx="${x}" cy="${y}" r="${r.toFixed(1)}" fill="${col}" opacity=".85" stroke="#ffffff" stroke-width="1.4"/>
      ${label(n, x, y, r)}
    </g>`;
  }).join('');

  const grid = Array.from({length:7}, (_,i) => {
    const y = (i / 6) * MAPH;
    return `<line x1="0" y1="${y}" x2="${MAPW}" y2="${y}" stroke="rgba(70,97,127,.10)" stroke-width="1"/>`;
  }).join('') + Array.from({length:13}, (_,i) => {
    const x = (i / 12) * MAPW;
    return `<line x1="${x}" y1="0" x2="${x}" y2="${MAPH}" stroke="rgba(70,97,127,.10)" stroke-width="1"/>`;
  }).join('');

  return `<div class="mapwrap">
    <svg class="map" viewBox="0 0 ${MAPW} ${MAPH}" role="img" aria-label="Global risk map by region">
      ${grid}${paths}${marks}
    </svg>
    <div class="overlays">${OVERLAYS.map(o =>
      `<button class="ov${overlay===o.k?' on':''}" data-ov="${o.k}"${overlay===o.k?` style="background:${o.col}"`:''}>${esc(o.label)}</button>`).join('')}</div>
  </div>`;
}

function graphLayout(){
  const cx = 500, cy = 260, r1 = 160, r2 = 218;
  const t1 = SUPPLIERS.map((s,i) => {
    const a = (i / SUPPLIERS.length) * Math.PI * 2 - Math.PI / 2;
    return Object.assign({}, s, { x:cx + Math.cos(a) * r1, y:cy + Math.sin(a) * r1 * 0.78 });
  });
  const t2 = TIER2.map((v,i) => {
    const a = (i / TIER2.length) * Math.PI * 2 - Math.PI / 2 + 0.3;
    return Object.assign({}, v, { x:cx + Math.cos(a) * (r2 + 74), y:cy + Math.sin(a) * (r2 + 74) * 0.80 });
  });
  return { cx, cy, t1, t2 };
}

function graphSvg(){
  const { cx, cy, t1, t2 } = graphLayout();
  const hot = hotVendor;
  const isHotT1 = id => hot && (hot === id || (t2.find(v => v.id === hot)?.id && SUPPLIERS.find(s => s.id === id)?.tier2.includes(hot)));
  const isHotT2 = id => hot && (hot === id || SUPPLIERS.find(s => s.id === hot)?.tier2.includes(id));

  let edges = t1.map(s =>
    `<line class="edge${isHotT1(s.id) ? ' hot' : ''}" x1="${cx}" y1="${cy}" x2="${s.x.toFixed(1)}" y2="${s.y.toFixed(1)}"/>`).join('');
  t1.forEach(s => (s.tier2 || []).forEach(tid => {
    const v = t2.find(x => x.id === tid); if (!v) return;
    const h = hot && (hot === s.id || hot === tid);
    edges += `<line class="edge${h ? ' hot' : ''}" x1="${s.x.toFixed(1)}" y1="${s.y.toFixed(1)}" x2="${v.x.toFixed(1)}" y2="${v.y.toFixed(1)}"/>`;
  }));

  const centre = `<g>
    <rect x="${cx-62}" y="${cy-20}" width="124" height="40" fill="#ffffff" stroke="#935c00" stroke-width="1.2"/>
    <text x="${cx}" y="${cy+4}" text-anchor="middle" style="font-family:'Barlow Condensed';font-size:15px;fill:#935c00;letter-spacing:.09em">ARCLIGHT</text>
  </g>`;

  const t1n = t1.map(s => {
    const h = isHotT1(s.id), c = riskHex(s.risk);
    return `<g class="vnode${h ? ' hot' : ''}" data-hc="v1" data-id="${s.id}" data-md="supplier">
      <rect x="${(s.x-63).toFixed(1)}" y="${(s.y-13).toFixed(1)}" width="126" height="26"
        fill="${h ? 'rgba(204,31,52,.14)' : '#ffffff'}" stroke="${c}" stroke-width="${h ? 1.8 : 1}"/>
      ${s.single ? `<circle cx="${(s.x+57).toFixed(1)}" cy="${(s.y-9).toFixed(1)}" r="3.4" fill="#cc1f34"/>` : ''}
      <text x="${s.x.toFixed(1)}" y="${(s.y+3).toFixed(1)}" text-anchor="middle">${esc(s.name.slice(0,24))}</text>
    </g>`;
  }).join('');

  const t2n = t2.map(v => {
    const h = isHotT2(v.id), c = riskHex(v.risk);
    return `<g class="vnode${h ? ' hot' : ''}" data-hc="v2" data-id="${v.id}">
      <circle cx="${v.x.toFixed(1)}" cy="${v.y.toFixed(1)}" r="${v.shared > 1 ? 11 : 8}"
        fill="${h ? 'rgba(204,31,52,.18)' : '#ffffff'}" stroke="${c}" stroke-width="${h ? 1.8 : 1}"/>
      ${v.shared > 1 ? `<text x="${v.x.toFixed(1)}" y="${(v.y+3.4).toFixed(1)}" text-anchor="middle" style="fill:${c};font-size:9px">${v.shared}</text>` : ''}
      <text x="${v.x.toFixed(1)}" y="${(v.y + (v.y < cy ? -16 : 22)).toFixed(1)}" text-anchor="middle">${esc(v.name)}</text>
    </g>`;
  }).join('');

  return `<svg class="graph" viewBox="0 0 1000 560" role="img" aria-label="Vendor dependency network, tier 1 and tier 2">
    <g>${edges}</g>${centre}${t1n}${t2n}
    <g style="font-family:'Roboto Mono';font-size:9px;fill:#7a8899">
      <text x="16" y="24">TIER 1 — DIRECT SUPPLIERS (RECTANGLES)</text>
      <text x="16" y="40">TIER 2 — THEIR SUPPLIERS (CIRCLES; NUMBER = TIER-1s SERVED)</text>
      <text x="16" y="56">RED DOT = SOLE SOURCE · HOVER ANY NODE TO TRACE THE CASCADE</text>
    </g>
  </svg>`;
}

function hcShow(t, html){
  if (!hcEl){ hcEl = document.createElement('div'); hcEl.className = 'hc'; document.body.appendChild(hcEl); }
  hcEl.innerHTML = html; hcEl.classList.add('on');
  const r = t.getBoundingClientRect(), b = hcEl.getBoundingClientRect();
  let l = r.right + 12, tp = r.top;
  if (l + b.width > innerWidth - 10) l = Math.max(10, r.left - b.width - 12);
  if (tp + b.height > innerHeight - 10) tp = Math.max(10, innerHeight - b.height - 10);
  hcEl.style.left = l + 'px'; hcEl.style.top = tp + 'px';
}

/* ═══════════════════════════════════════════════════════════════
   TAB — SCENARIO PLANNING
   ═══════════════════════════════════════════════════════════════ */
function simulate(){
  const s = SCENARIOS.find(x => x.id === SIM.scenario) || SCENARIOS[0];
  const f = SEV_FACTOR[SIM.severity - 1];
  return {
    s, f,
    rev: s.rev * f,
    delay: Math.round(s.delay * f),
    cust: Math.round(s.cust * f),
    recover: Math.round(s.recover * f),
    margin: s.rev * f * 0.31,
    sites: Math.min(41, Math.round(s.regions.reduce((t,r) => t + (NODES.find(n => n.id === r)?.sites || 0), 0) * Math.min(1.6, f)))
  };
}

  const r = simulate();
  return `<div class="sh"><h2>Scenario Planning</h2><div class="rule"></div>

    <div class="sc-d">${esc(s.d)}</div>

  <div class="g g5">

    ${st('Gross margin impact', $M(r.margin), 'at a 31% blended margin', 'var(--red)')}
    ${st('Delay', r.delay + ' days', r.delay ? 'added to affected lanes' : 'no lane delay in this scenario', r.delay > 20 ? 'var(--red)' : 'var(--amber)')}
    ${st('Customers affected', r.cust ? n0(r.cust) : '—', r.cust ? 'with a committed date at risk' : 'no immediate customer impact', 'var(--amber)')}
    ${st('Recovery', r.recover + ' days', 'to pre-event run rate', r.recover > 60 ? 'var(--red)' : 'var(--amber)')}
  </div>

  <div class="g g23">
    <div class="pnl">
      <div class="pnl-h"><h3>Impact across severity</h3>${chip(esc(r.s.name),'amber')}</div>
      <div class="pnl-s">How this scenario scales. The slider position is highlighted.</div>
      <div class="chart"><canvas id="c-scen"></canvas></div>
    </div>
    <div class="pnl">
      <div class="pnl-h"><h3>Recommended response</h3>${chip(r.s.playbooks.join(' · '),'teal')}</div>
      <div class="pnl-s">What the war room does first.</div>
      <div style="font-size:12px;color:var(--muted);line-height:1.7;margin-top:6px">${esc(r.s.response)}</div>
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
        <div class="l" style="font-family:var(--cond);font-size:10.5px;color:var(--dim);letter-spacing:.11em;margin-bottom:8px">PLAYBOOKS TO ACTIVATE</div>
        ${r.s.playbooks.map(id => { const p = PLAYBOOKS.find(x => x.id === id); return p
          ? `<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:11.5px">
              <span><span class="mono" style="color:var(--amber);margin-right:8px">${esc(p.id)}</span>${esc(p.t)}</span>
              <span class="mono" style="color:var(--dim);font-size:10px">${esc(p.time)}</span></div>` : ''; }).join('')}
      </div>
      <div style="margin-top:14px;font-size:10.5px;color:var(--dim);line-height:1.6">${esc(r.s.detail)}</div>
    </div>
  </div>

  <div class="pnl">
    <div class="pnl-h"><h3>Regions in the blast radius</h3>${chip(r.s.regions.length + ' nodes','amber')}</div>
    <div class="pnl-s">What this scenario touches, and what each node carries.</div>
    <div class="tw" style="max-height:230px"><table>
      <thead><tr><th>Region</th><th>Hub</th><th class="n">Composite risk</th><th class="n">Revenue</th>
      <th class="n">Sites</th><th class="n">Suppliers</th><th>Exposure in this scenario</th></tr></thead>
      <tbody>${r.s.regions.map(id => { const n = NODES.find(x => x.id === id); if (!n) return '';
        const share = n.rev / r.s.regions.reduce((t,rr) => t + (NODES.find(x => x.id === rr)?.rev || 0), 0);
        return `<tr class="hv" data-hc="node" data-id="${n.id}" data-md="node">
        <td><b>${esc(n.name)}</b></td><td style="color:var(--dim)">${esc(n.hub)}</td>
        <td class="n" style="color:${riskCol(composite(n))};font-weight:700">${composite(n)}</td>
        <td class="n">${$M(n.rev)}</td><td class="n">${n.sites}</td><td class="n">${n0(n.sup)}</td>
        <td class="n">${$M(r.rev * share)}</td></tr>`; }).join('')}</tbody>
    </table></div>
  </div>

  <div class="note"><b>Severity 3 is the planning case, not the expected case.</b> Planning to the average is how organisations
  discover that the average never happens. The value of the slider is the shape of the curve between 3 and 5 — for the supplier
  bankruptcy scenario that curve is close to linear, which is unusual and is precisely why it is the expensive one.</div>`;
}
function initScenario(){
  const s = SCENARIOS.find(x => x.id === SIM.scenario) || SCENARIOS[0];
  mk('c-scen', { type:'bar',
    data:{ labels:SEV_NAME.map((n,i) => (i+1) + ' · ' + n),
      datasets:[
        { label:'Revenue impact ($M)', data:SEV_FACTOR.map(f => +(s.rev * f).toFixed(0)),
          backgroundColor:SEV_FACTOR.map((_,i) => i === SIM.severity - 1 ? 'rgba(204,31,52,.92)' : 'rgba(204,31,52,.3)') },
        { label:'Recovery (days)', type:'line', data:SEV_FACTOR.map(f => Math.round(s.recover * f)),
          borderColor:'#935c00', borderWidth:2, tension:.25, pointRadius:3, pointBackgroundColor:'#935c00', fill:false, yAxisID:'y1' }
      ] },
    options:{ plugins:{ legend:{ display:true, position:'bottom' } },
      scales:{ y:{ ticks:{ callback:v => '$'+v+'M' } },
        y1:{ position:'right', grid:{ display:false }, border:{ display:false },
             ticks:{ color:'#6f7d8d', font:{ size:10, family:'Roboto Mono' }, callback:v => v+'d' } } } } });
}

/* ═══════════════════════════════════════════════════════════════
   TAB — RESPONSE PLAYBOOKS
   ═══════════════════════════════════════════════════════════════ */
function renderPlaybook(){
  const scen = SCENARIOS.find(x => x.id === SIM.scenario) || SCENARIOS[0];
  const activeCount = Object.values(ACTIVE_PB).filter(Boolean).length;
  return `<div class="sh"><h2>Response Playbooks</h2><div class="rule"></div>
    <span class="meta">${PLAYBOOKS.length} PLAYBOOKS · ${activeCount} ACTIVATED · 3 EXERCISED IN 12 MONTHS</span></div>

  <div class="g g4">
    ${st('Playbooks current', '6 of 6', 'reviewed within 90 days', 'var(--green)')}
    ${st('Exercised in 12 months', '3 of 6', 'the other three are documents, not capabilities', 'var(--amber)')}
    ${st('Fastest activation', '2 hours', 'PB-05 recovery team', 'var(--green)')}
    ${st('Currently activated', String(activeCount), activeCount ? 'live in this session' : 'none — click activate to simulate', activeCount ? 'var(--green)' : 'var(--dim)')}
  </div>

  <div class="pnl" style="margin-bottom:12px">
    <div class="pnl-h"><h3>Recommended for the selected scenario</h3>${chip(esc(scen.name),'amber')}</div>
    <div class="pnl-s">Set on the Scenario Planning tab. These three are the ones that matter first.</div>
    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:6px">
      ${scen.playbooks.map(id => { const p = PLAYBOOKS.find(x => x.id === id); return p
        ? `<span class="chip c-amber" style="padding:5px 11px;font-size:10.5px">${esc(p.id)} — ${esc(p.t)}</span>` : ''; }).join('')}
    </div>
  </div>

  ${PLAYBOOKS.map(p => {
    const on = !!ACTIVE_PB[p.id], rec = scen.playbooks.includes(p.id);
    return `<div class="pb${on ? ' active' : ''}">
      <div class="pb-h">
        <span class="pb-n">${esc(p.id)}</span>
        <span class="pb-t">${esc(p.t)}</span>
        ${rec ? chip('RECOMMENDED','amber') : ''}
        ${on ? chip('ACTIVATED','green') : ''}
        <span class="mono" style="font-size:10px;color:var(--dim)">${esc(p.time)}</span>
        <button class="btn${on ? ' go' : ''}" data-pb="${p.id}">${on ? 'Stand down' : 'Activate'}</button>
      </div>
      <div class="pb-b">
        <div style="margin-bottom:10px">${esc(p.d)}</div>
        ${p.steps.map((s,i) => `<div class="pb-step"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${esc(s)}</span></div>`).join('')}
        <div style="display:flex;gap:26px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
          font-family:var(--mono);font-size:10px;color:var(--dim)">
          <span>OWNER: ${esc(p.owner.toUpperCase())}</span>
          <span>PRE-CONDITION: ${esc(p.pre.toUpperCase())}</span>
          <span>COST: ${esc(p.cost.toUpperCase())}</span>
          <span style="color:var(--teal)">EFFECT: ${esc(p.effect.toUpperCase())}</span>
        </div>
      </div>
    </div>`; }).join('')}

  <div class="note"><b>A playbook that has never been exercised is a document, not a capability.</b> Three of these six have been
  run under exercise conditions in the last twelve months, and their recovery estimates are measurements. The other three carry
  estimates that are assumptions — including the supplier-bankruptcy playbook, which is the one currently attached to the
  highest-rated open incident on the overview.</div>`;
}

/* ═══════════════════════════════════════════════════════════════
   SHELL + ENGINE
   ═══════════════════════════════════════════════════════════════ */
function shell(){
  const p = POSTURE_LEVELS[CURRENT_POSTURE];
  return `<div class="cmdbar">
    <div class="sig">
      <div class="sig-badge"><span>AR</span></div>
      <div>
        <h1>Enterprise Resilience &amp; Scenario War Room</h1>
        <div class="sub">ARCLIGHT INDUSTRIAL · 41 PLANTS · 1,840 SUPPLIERS · 62 COUNTRIES</div>
      </div>
    </div>
    <div class="cmd-right">
      <div><span class="pulse"></span>MONITORING <span id="clk">${new Date().toLocaleTimeString()}</span></div>
      <div style="color:var(--dim);margin-top:2px">5 OPEN INCIDENTS · 1 CRITICAL · READINESS 72</div>
      <a href="https://paddyspeaks.com/" class="back">← PaddySpeaks.com</a>
    </div>
  </div>

  <div class="posture">
    <div class="pst-l"><span class="lbl">Posture</span><span class="lvl" style="color:${p.c}">${p.k}</span></div>
    <div class="pst-steps">${POSTURE_LEVELS.map((l,i) =>
      `<div class="pstep${i===CURRENT_POSTURE?' on':''}"${i===CURRENT_POSTURE?` style="background:${l.c}"`:''}>${l.k}</div>`).join('')}</div>
    <div class="pst-r"><span>REV EXPOSED ${$M(842)}</span><span>CONTINUITY 94.2%</span><span>MTTC 52 MIN</span></div>
  </div>

  <div class="tabs">${TABS.map(t =>
    `<button class="tab${tab===t.id?' active':''}" data-tab="${t.id}">${esc(t.label)}</button>`).join('')}</div>

  <div class="fbar">
    <div class="fg"><span class="fl">Region</span>
      <select class="fs" data-f="region" aria-label="Region">
        <option value="all">All regions</option>
        ${NODES.map(n => `<option value="${n.id}"${F.region===n.id?' selected':''}>${esc(n.name)}</option>`).join('')}
      </select></div>
    <div class="fg"><span class="fl">Scenario</span>
      <select class="fs" data-f="scenario" aria-label="Scenario">
        ${SCENARIOS.map(s => `<option value="${s.id}"${SIM.scenario===s.id?' selected':''}>${esc(s.name)}</option>`).join('')}
      </select></div>
    <div class="fspace"></div>
    <div class="fnote">VIEWING ${esc(F.region === 'all' ? 'ALL REGIONS' : regionName(F.region).toUpperCase())} ·
      SCENARIO ${esc((SCENARIOS.find(s => s.id === SIM.scenario) || SCENARIOS[0]).name.toUpperCase())} · SEVERITY ${SIM.severity}</div>
  </div>
  <div class="stage"></div>`;
}

const VIEWS = { overview:[renderOverview, initOverview], map:[renderMap, null], supply:[renderSupply, initSupply],
  vendor:[renderVendor, null], cyber:[renderCyber, initCyber], scenario:[renderScenario, initScenario],
  playbook:[renderPlaybook, null] };

function paint(){
  const host = $('.stage'); if (!host) return;
  const [render, init] = VIEWS[tab] || VIEWS.overview;
  killCharts();
  host.innerHTML = render();
  if (init) requestAnimationFrame(() => { try { init(); } catch(e){ console.warn('chart', e); } });
}
function mount(){ $('#app').innerHTML = shell(); paint(); }

/* ═══ hover content ═══ */
function hcFor(t){
  const kind = t.dataset.hc;
  if (kind === 'kpi'){
    const d = KPI_NOTES[t.dataset.k]; if (!d) return '';
    return `<h4>${esc(d.t)}</h4>${d.rows.map(r => hr(r[0], esc(r[1]))).join('')}<div class="hc-n">${esc(d.n)}</div>`;
  }
  if (kind === 'node'){
    const n = NODES.find(x => x.id === t.dataset.id); if (!n) return '';
    const c = composite(n);
    return `<h4>${esc(n.name.toUpperCase())} · ${esc(n.hub.toUpperCase())}</h4>
      ${hr('Composite risk', `<span style="color:${riskCol(c)}">${c} — ${riskWord(c)}</span>`)}
      ${hr('Geopolitical', String(n.geo))}${hr('Weather & climate', String(n.weather))}${hr('Labour', String(n.labor))}
      ${hr('Logistics', String(n.logistics))}${hr('Cyber', String(n.cyber))}
      ${hr('Revenue in scope', $M(n.rev))}${hr('Suppliers', n0(n.sup))}${hr('Sites', String(n.sites))}
      <div class="hc-n">${esc(n.note)}</div>`;
  }
  if (kind === 'v1'){
    const s = SUPPLIERS.find(x => x.id === t.dataset.id); if (!s) return '';
    return `<h4>${esc(s.name.toUpperCase())}</h4>
      ${hr('Category', esc(s.cat))}${hr('Region', esc(regionName(s.region)))}
      ${hr('Annual spend', '$' + n0(s.spend) + 'M')}
      ${hr('Risk score', `<span style="color:${riskCol(s.risk)}">${s.risk} — ${riskWord(s.risk)}</span>`)}
      ${hr('On-time delivery', n1(s.otd) + '%')}${hr('Lead time', s.lead + ' d ±' + n1(s.vari))}
      ${hr('Financial rating', esc(s.fin))}${hr('Sourcing', s.single ? 'SOLE SOURCE' : esc(s.alt))}
      ${hr('Tier-2 behind it', String((s.tier2 || []).length))}
      <div class="hc-n">${esc(s.note)}</div>`;
  }
  if (kind === 'v2'){
    const v = TIER2.find(x => x.id === t.dataset.id); if (!v) return '';
    const feeds = SUPPLIERS.filter(s => (s.tier2 || []).includes(v.id));
    return `<h4>${esc(v.name.toUpperCase())}</h4>
      ${hr('Category', esc(v.cat))}${hr('Region', esc(regionName(v.region)))}
      ${hr('Risk score', `<span style="color:${riskCol(v.risk)}">${v.risk} — ${riskWord(v.risk)}</span>`)}
      ${hr('Tier-1s served', String(v.shared))}
      ${hr('Spend behind it', '$' + n0(feeds.reduce((s,f) => s + f.spend, 0)) + 'M')}
      <div class="hc-n">${esc(v.shared > 1
        ? 'Shared across ' + feeds.map(f => f.name).join(', ') + '. A failure here defeats the diversification we paid for at tier 1 — three separate suppliers, one actual dependency.'
        : 'Single-path dependency behind ' + (feeds[0] ? feeds[0].name : 'one tier-1 supplier') + '. Contained, provided the tier-1 above it holds inventory.')}</div>`;
  }
  return '';
}

/* ═══ events ═══ */
document.addEventListener('click', e => {
  const t = e.target.closest('.tab[data-tab]');
  if (t){ if (t.dataset.tab !== tab){ tab = t.dataset.tab; hcHide(); hotVendor = null;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    paint(); scrollTo({ top:0, behavior:'smooth' }); } return; }

  const ov = e.target.closest('[data-ov]');
  if (ov){ overlay = ov.dataset.ov; paint(); return; }

  if (e.target.closest('[data-x]') || e.target.id === 'bd'){ closeMd(); return; }

  const sc = e.target.closest('[data-scen]');
  if (sc){ SIM.scenario = sc.dataset.scen;
    const sel = document.querySelector('[data-f="scenario"]'); if (sel) sel.value = SIM.scenario;
    updateFilterNote(); paint(); return; }

  const pb = e.target.closest('[data-pb]');
  if (pb){ const id = pb.dataset.pb; ACTIVE_PB[id] = !ACTIVE_PB[id]; paint(); return; }

  const m = e.target.closest('[data-md]');
  if (m){
    hcHide();
    const kind = m.dataset.md;
    if (kind === 'node'){ const n = NODES.find(x => x.id === m.dataset.id); if (n) openMd(nodeModal(n)); }
    else if (kind === 'supplier'){ const s = SUPPLIERS.find(x => x.id === m.dataset.id); if (s) openMd(supplierModal(s)); }
    else if (kind === 'incident'){ const i = INCIDENTS.find(x => x.id === m.dataset.id); if (i) openMd(incidentModal(i)); }
  }
});

function updateFilterNote(){
  const el = document.querySelector('.fnote');
  if (el) el.textContent = `VIEWING ${F.region === 'all' ? 'ALL REGIONS' : regionName(F.region).toUpperCase()} · ` +
    `SCENARIO ${(SCENARIOS.find(s => s.id === SIM.scenario) || SCENARIOS[0]).name.toUpperCase()} · SEVERITY ${SIM.severity}`;
}

document.addEventListener('change', e => {
  const f = e.target.closest('[data-f]');
  if (f){
    if (f.dataset.f === 'scenario') SIM.scenario = f.value; else F[f.dataset.f] = f.value;
    updateFilterNote(); paint(); return;
  }
  if (e.target.id === 'sev'){ SIM.severity = +e.target.value; updateFilterNote(); paint(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'sev'){
    const v = +e.target.value;
    const lbl = document.querySelector('.sev');
    if (lbl) lbl.textContent = v + ' · ' + SEV_NAME[v-1];
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeMd(); hcHide(); } });

if (matchMedia('(hover:hover) and (pointer:fine)').matches){
  document.addEventListener('mouseover', e => {
    const t = e.target.closest('[data-hc]');
    if (t === hcTarget) return;
    if (!t){
      if (hcTarget){ hcHide(); if (hotVendor && tab === 'vendor'){ hotVendor = null; refreshGraph(); } }
      return;
    }
    hcTarget = t;
    const html = hcFor(t);
    if (html) hcShow(t, html); else hcHide();
    if (tab === 'vendor' && (t.dataset.hc === 'v1' || t.dataset.hc === 'v2')){
      if (hotVendor !== t.dataset.id){ hotVendor = t.dataset.id; refreshGraph(); }
    }
  });
  document.addEventListener('mouseout', e => {
    const t = e.target.closest('[data-hc]');
    if (!t || t !== hcTarget) return;
    if (e.relatedTarget && t.contains(e.relatedTarget)) return;
    hcHide();
  });
}

/* Repaint only the graph so tracing a cascade never rebuilds the whole tab. */
function refreshGraph(){
  const old = document.querySelector('svg.graph');
  if (!old) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = graphSvg();
  old.replaceWith(tmp.firstElementChild);
}

addEventListener('scroll', hcHide, { capture:true, passive:true });
setInterval(() => { const c = document.getElementById('clk'); if (c) c.textContent = new Date().toLocaleTimeString(); }, 5000);

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
</script>
