<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#eff1f5;--bg2:#f7f8fa;--panel:#ffffff;--panel2:#f4f6f9;--panel3:#e6eaf0;
  --line:#e3e7ee;--line2:#ccd3de;--line3:#aeb8c7;
  --text:#141a24;--muted:#546072;--dim:#6d7889;
  --up:#00875a;--down:#d61f45;--warn:#935c00;--info:#3060c0;--teal:#0b7a70;--gold:#96701a;--plum:#6d4bd4;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
html,body{height:100%;font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#app{min-height:100vh}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--line3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}.dimt{color:var(--dim)}

/* ── header: ledger masthead, ruled rather than glowing ── */
.masthead{background:var(--bg2);border-bottom:1px solid var(--line2);padding:0 24px;position:sticky;top:0;z-index:120}
.mast-top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 0;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:13px}
.mark-glyph{width:38px;height:38px;border:1px solid var(--line3);border-radius:4px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#ffffff,#f1f4f8);position:relative}
.mark-glyph::after{content:'';position:absolute;left:8px;right:8px;bottom:9px;height:1px;background:var(--down)}
.mark-glyph span{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--up);letter-spacing:-1px}
.mast-title{font-size:15.5px;font-weight:600;letter-spacing:-.2px}
.mast-sub{font-size:10.5px;color:var(--muted);margin-top:2px;font-family:var(--mono)}
.mast-right{text-align:right;font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--up);margin-right:6px;animation:blip 2.6s infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.back{color:var(--info);text-decoration:none;font-size:10px;opacity:.8}
.back:hover{opacity:1}

/* ── KPI ticker rail: 12 metrics, hairline-separated, no card chrome ── */
.rail{display:flex;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line);background:linear-gradient(180deg,#ffffff,#f6f8fa)}
.rail::-webkit-scrollbar{display:none}
.rcell{flex:1 0 auto;min-width:126px;padding:11px 13px 12px;border-right:1px solid var(--line);cursor:pointer;transition:background .18s;position:relative}
.rcell:last-child{border-right:none}
.rcell:hover{background:rgba(48,96,192,.06)}
.rcell::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;transition:background .18s}
.rcell:hover::before{background:var(--info)}
.rlabel{font-size:9px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.9px;white-space:nowrap}
.rvalue{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:5px;letter-spacing:-.6px}
.rdelta{font-size:9.5px;font-family:var(--mono);margin-top:3px}

/* ── tabs ── */
.tabs{display:flex;background:var(--bg);border-bottom:1px solid var(--line2);padding:0 24px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:100}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 0;margin-right:26px;font-size:12px;font-weight:500;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit;transition:color .18s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--up);font-weight:600;border-bottom-color:var(--up)}
.tab .tnum{font-family:var(--mono);font-size:10px;color:var(--dim);margin-right:7px}
.tab.active .tnum{color:var(--up)}

/* ── filter strip ── */
.filters{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:10px 24px;background:var(--bg2);border-bottom:1px solid var(--line)}
.fg{display:flex;align-items:center;gap:7px}
.fl{font-size:9px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.9px}
select.fs{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:3px;padding:5px 9px;font-size:11.5px;font-family:inherit;cursor:pointer;outline:none}
select.fs:hover,select.fs:focus{border-color:var(--info)}
.cmp{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.cmp button{background:var(--panel);border:1px solid var(--line2);color:var(--muted);font-family:var(--mono);font-size:10.5px;padding:5px 11px;border-radius:3px;cursor:pointer;transition:all .18s}
.cmp button:hover{color:var(--text);border-color:var(--line3)}
.cmp button.on{background:rgba(0,135,90,.12);border-color:var(--up);color:var(--up)}

/* ── layout ── */
.wrap{padding:20px 24px 56px;max-width:1620px;margin:0 auto;animation:fadeUp .3s ease}
.shead{display:flex;align-items:baseline;gap:12px;margin:24px 0 11px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.shead:first-child{margin-top:0}
.shead .sn{font-family:var(--mono);font-size:11px;color:var(--down)}
.shead h2{font-size:13.5px;font-weight:600;letter-spacing:-.1px}
.shead p{font-size:11px;color:var(--dim);margin-left:auto;text-align:right}
.g{display:grid;gap:13px;margin-bottom:13px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g23{grid-template-columns:2fr 1fr}.g32{grid-template-columns:1fr 2fr}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:15px 17px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:3px}
.panel-h h3{font-size:12px;font-weight:600}
.panel-s{font-size:10.5px;color:var(--dim);margin-bottom:13px;line-height:1.5}
.tag{font-family:var(--mono);font-size:9px;font-weight:600;padding:2px 7px;border-radius:3px;letter-spacing:.4px;white-space:nowrap}
.t-up{background:rgba(0,135,90,.12);color:var(--up)}
.t-down{background:rgba(214,31,69,.12);color:var(--down)}
.t-warn{background:rgba(147,92,0,.12);color:var(--warn)}
.t-info{background:rgba(48,96,192,.12);color:var(--info)}
.t-dim{background:rgba(20,26,36,.06);color:var(--muted)}
.chart{position:relative;width:100%;height:265px}
.chart>canvas{position:absolute;top:0;left:0}
.chart-s{height:205px}

/* ── ledger table ── */
.tw{overflow:auto;max-height:440px;border:1px solid var(--line);border-radius:5px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
thead{position:sticky;top:0;z-index:3}
th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:9px;text-transform:uppercase;letter-spacing:.8px;padding:8px 11px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap}
th.n{text-align:right}
td{padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
tbody tr:nth-child(even) td{background:rgba(20,26,36,.022)}
tr.hv{cursor:pointer}
tr.hv:hover td{background:rgba(48,96,192,.07)}
td .sub{display:block;font-size:9.5px;color:var(--dim);margin-top:2px}

/* ── funnel ── */
.funnel{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.fstage{position:relative;cursor:pointer}
.fbar{height:52px;border-radius:3px;display:flex;align-items:center;padding:0 15px;justify-content:space-between;transition:filter .18s;border:1px solid transparent}
.fstage:hover .fbar{filter:brightness(1.22);border-color:var(--line3)}
.fname{font-size:11.5px;font-weight:600}
.fsub{font-size:9.5px;opacity:.72;margin-top:2px}
.fval{font-family:var(--mono);font-size:16px;font-weight:600}
.fdrop{display:flex;align-items:center;gap:9px;padding:6px 15px 6px 0;margin-left:26px;font-size:10.5px;color:var(--down);font-family:var(--mono)}
.fdrop .arrow{color:var(--dim)}
.fdrop .why{color:var(--muted);font-family:'IBM Plex Sans',sans-serif}

/* ── waterfall ── */
.wf{display:flex;align-items:flex-end;gap:5px;height:230px;padding-top:12px}
.wcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;cursor:pointer}
.wbox{width:100%;border-radius:3px 3px 0 0;position:relative;transition:filter .18s}
.wcol:hover .wbox{filter:brightness(1.3)}
.wv{font-family:var(--mono);font-size:10.5px;font-weight:600;margin-bottom:5px;white-space:nowrap}
.wl{font-size:9.5px;color:var(--muted);margin-top:8px;text-align:center;line-height:1.3;height:28px}

/* ── heat grid ── */
.heat{display:grid;gap:3px;margin-top:6px;font-size:10px}
.hcell{padding:9px 6px;border-radius:3px;text-align:center;font-family:var(--mono);font-weight:600;cursor:pointer;transition:transform .15s,outline-color .15s;outline:1px solid transparent}
.hcell:hover{transform:scale(1.06);outline-color:var(--line3)}
.hhead{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;padding:4px 2px;text-align:center}
.hrow{font-size:10px;color:var(--muted);display:flex;align-items:center;padding-right:8px}

/* ── action rows ── */
.act{display:flex;gap:14px;align-items:flex-start;padding:14px 15px;border:1px solid var(--line);border-left:3px solid var(--up);border-radius:5px;background:var(--panel);margin-bottom:9px;cursor:pointer;transition:border-color .18s,transform .18s,background .18s}
.act:hover{transform:translateX(3px);background:var(--panel2);border-color:var(--line3)}
.act-rank{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--dim);min-width:28px}
.act-b{flex:1;min-width:0}
.act-t{font-size:12.5px;font-weight:600;margin-bottom:4px}
.act-d{font-size:10.5px;color:var(--muted);line-height:1.55}
.act-m{display:flex;gap:16px;margin-top:8px;font-size:9.5px;color:var(--dim);font-family:var(--mono);flex-wrap:wrap}
.act-v{text-align:right;flex-shrink:0}
.act-v .amt{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--up)}
.act-v .lbl{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;margin-top:2px}

/* ── mini bars ── */
.mb{display:grid;grid-template-columns:1fr 62px;gap:11px;align-items:center;padding:5px 0;font-size:11px}
.mb-l{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-t{height:16px;background:var(--panel3);border-radius:2px;overflow:hidden;position:relative}
.mb-f{height:100%;border-radius:2px;transition:width .5s ease}
.mb-v{text-align:right;font-family:var(--mono);font-weight:600;font-size:10.5px}
.stat{border:1px solid var(--line);border-radius:5px;padding:12px 14px;background:var(--panel)}
.stat .l{font-size:9px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.85px}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:600;margin-top:5px}
.stat .d{font-size:10px;color:var(--dim);margin-top:4px;line-height:1.45}

/* ── hover card ── */
.hc{position:fixed;z-index:900;background:#ffffff;border:1px solid var(--line3);border-radius:6px;padding:14px 16px;width:330px;max-height:84vh;overflow-y:auto;box-shadow:0 22px 56px rgba(20,26,36,.14);pointer-events:none;opacity:0;transition:opacity .16s}
.hc.on{opacity:1}
.hc h4{font-size:11.5px;font-weight:600;color:var(--up);margin-bottom:9px;font-family:var(--mono);letter-spacing:.2px}
.hr{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:10.5px;border-bottom:1px solid rgba(20,26,36,.07)}
.hr:last-of-type{border-bottom:none}
.hr .k{color:var(--muted)}
.hr .v{font-family:var(--mono);font-weight:600}
.hc-note{margin-top:10px;padding-top:9px;border-top:1px solid var(--line2);font-size:10px;color:var(--muted);line-height:1.55}

/* ── modal ── */
.bd{position:fixed;inset:0;background:rgba(20,26,36,.34);z-index:940;opacity:0;pointer-events:none;transition:opacity .2s}
.bd.on{opacity:1;pointer-events:auto}
.md{position:fixed;top:50%;left:50%;transform:translate(-50%,-48%);width:min(780px,calc(100vw - 36px));max-height:84vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line3);border-radius:8px;z-index:950;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 40px 90px rgba(20,26,36,.18)}
.md.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.md-h{padding:19px 23px 14px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:16px;align-items:flex-start;position:sticky;top:0;background:var(--panel);z-index:2}
.md-h h2{font-size:16px;font-weight:600;letter-spacing:-.2px}
.md-h p{font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.mx{background:none;border:1px solid var(--line2);color:var(--muted);width:28px;height:28px;border-radius:4px;cursor:pointer;font-size:14px;flex-shrink:0}
.mx:hover{color:var(--down);border-color:var(--down)}
.md-b{padding:18px 23px 24px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:10px;margin-bottom:17px}
.msec{margin-top:16px}
.msec h4{font-size:10px;font-weight:600;color:var(--info);text-transform:uppercase;letter-spacing:.95px;margin-bottom:9px}
.msec p{font-size:12px;color:var(--muted);line-height:1.68}
.ml{list-style:none}
.ml li{font-size:11.5px;color:var(--muted);padding:7px 0 7px 20px;position:relative;line-height:1.55;border-bottom:1px solid rgba(20,26,36,.06)}
.ml li::before{content:'—';position:absolute;left:0;color:var(--up)}
.ml li:last-child{border-bottom:none}

.note{margin-top:30px;padding:12px 15px;border:1px solid var(--line);border-left:3px solid var(--line3);border-radius:4px;font-size:10.5px;color:var(--dim);line-height:1.65}
.note b{color:var(--muted)}

@media(max-width:1200px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g23,.g32{grid-template-columns:1fr}}
@media(max-width:820px){.g2,.g4{grid-template-columns:1fr}.wrap{padding:15px 13px 44px}.masthead{padding:0 13px;position:relative}.tabs,.filters{padding-left:13px;padding-right:13px;position:relative}.hc{display:none}.wf{height:190px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ═══════════════════════════════════════════════════════════════
   REVENUE LEAKAGE & MARGIN INTELLIGENCE HUB
   Synthetic dataset. Reference org: "Helix Systems" — B2B software,
   $412.6M gross revenue, 2,140 customers, four routes to market.
   Every figure below reconciles: the funnel, the waterfall, the
   product table and the action list all tie back to the same totals.
   ═══════════════════════════════════════════════════════════════ */

const TABS = [
  { id:'pulse',    label:'Revenue Pulse' },
  { id:'leakage',  label:'Leakage Map' },
  { id:'margin',   label:'Margin Drivers' },
  { id:'pricing',  label:'Pricing Intelligence' },
  { id:'renewals', label:'Renewals & Churn' },
  { id:'mix',      label:'Product Mix' },
  { id:'actions',  label:'Action Center' }
];

const QTRS = ['Q4 24','Q1 25','Q2 25','Q3 25','Q4 25','Q1 26','Q2 26','Q3 26'];

/* ── funnel: booked → invoiced → collected → retained ── */
const FUNNEL = [
  { stage:'Booked',    val:412.6, color:'#3060c0', sub:'Signed contract value, current quarter annualized' },
  { stage:'Invoiced',  val:398.1, color:'#0b7a70', sub:'Reached an invoice with the right amount on it' },
  { stage:'Collected', val:386.4, color:'#00875a', sub:'Cash received, net of credits and refunds' },
  { stage:'Retained',  val:371.9, color:'#96701a', sub:'Still on the books after churn and contraction' }
];
const DROPS = [
  { from:'Booked', to:'Invoiced',  amt:14.5, why:'Billing mismatches, unbilled usage, entitlement overruns', recover:7.7 },
  { from:'Invoiced', to:'Collected', amt:11.7, why:'Credits, goodwill refunds, uncollected true-ups', recover:5.3 },
  { from:'Collected', to:'Retained', amt:14.5, why:'Churn, contraction, lapsed auto-renewals', recover:10.8 }
];

/* ── leakage sources: sum to the $23.8M recoverable total ── */
const LEAKS = [
  { src:'Under-priced enterprise contracts', amt:6.2, cat:'Pricing',  owner:'Deal Desk',    accts:14, trend:+0.8, age:'Chronic',
    note:'Fourteen contracts signed below the approved floor and renewed at the same number three times. Nobody reopened them because nobody owned reopening them.' },
  { src:'Invoice & billing mismatches', amt:4.1, cat:'Billing',  owner:'Revenue Ops',  accts:186, trend:+0.6, age:'Acute',
    note:'A tax-rule change in the EMEA billing engine has been under-invoicing VAT-inclusive contracts since March. The error is systematic, which is the good news — one fix clears all 186.' },
  { src:'Unbilled usage & entitlement overrun', amt:3.6, cat:'Billing',  owner:'Product Ops', accts:62, trend:+0.9, age:'Growing',
    note:'API calls above contracted volume are metered but never invoiced. The meter works. The billing rule that reads it was never switched on for the 2025 plan family.' },
  { src:'Uncollected true-ups & late renewals', amt:2.9, cat:'Collections', owner:'Finance', accts:41, trend:-0.2, age:'Improving',
    note:'Mid-term expansions agreed verbally and never papered. Collections cannot chase what was never invoiced.' },
  { src:'Duplicate credits & goodwill refunds', amt:2.4, cat:'Credits', owner:'Customer Care', accts:238, trend:+0.4, age:'Growing',
    note:'Care and Finance both issue goodwill credits and neither checks the other first. 61 accounts received two credits for one incident.' },
  { src:'Contract auto-renew lapses', amt:2.2, cat:'Renewals', owner:'Renewals', accts:9, trend:+0.3, age:'Acute',
    note:'Nine agreements passed their notice window without the renewal being raised. Each is recoverable, and each gets harder every week it sits.' },
  { src:'Channel rebate misapplication', amt:1.5, cat:'Channel', owner:'Partner Ops', accts:23, trend:0.0, age:'Chronic',
    note:'Tier-2 partners claiming tier-1 rebate rates. The claims are processed automatically and the tier is checked manually, which is the wrong way round.' },
  { src:'Service overdelivery vs contracted scope', amt:0.9, cat:'Delivery', owner:'Prof. Services', accts:17, trend:+0.1, age:'Chronic',
    note:'Statements of work delivered at 118% of contracted hours on average. Generous, unbilled, and invisible until it shows up in the margin line.' }
];

/* ── margin waterfall: list margin down to realized margin ── */
const MARGIN_WF = [
  { label:'List margin',            val:74.0, type:'start' },
  { label:'Discounting',            val:-6.4, type:'neg', detail:'Average realized discount 21.4% against a 15% policy band' },
  { label:'Pricing pressure',       val:-2.1, type:'neg', detail:'Competitive resets on renewal in EMEA and APAC' },
  { label:'Support burden',         val:-1.9, type:'neg', detail:'42 accounts consume 31% of support capacity' },
  { label:'Implementation cost',    val:-1.4, type:'neg', detail:'Onboarding overrun on managed-services deals' },

}

function mk(id, cfg){
  const cv = document.getElementById(id);

  // Chart.js reads these from `options`, not from the config root.
  const base = { options: {
      responsive:true, maintainAspectRatio:false, interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{ display:false, labels:{ color:'#546072', font:{ size:10, family:'IBM Plex Sans' }, boxWidth:9, boxHeight:9, usePointStyle:true } },

        y:{ grid:{ color:'rgba(20,26,36,.09)', drawTicks:false }, border:{ display:false },
            ticks:{ color:'#74808f', font:{ size:10, family:'IBM Plex Mono' } } }
      }
  
  } };
  charts[id] = new Chart(cv.getContext('2d'), deep(base, cfg));
}
function deep(a,b){
  const o = Array.isArray(a) ? a.slice() : Object.assign({}, a);
  for (const k in b){
    if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') o[k] = deep(a[k], b[k]);
    else o[k] = b[k];
  }
  return o;
}
function fill(ctx, rgb, top=.26){
  const g = ctx.createLinearGradient(0,0,0,250);

}

function waterfallHtml(){
  const top = 76, bottom = 56, span = top - bottom;
  let running = MARGIN_WF[0].val;
  const cols = MARGIN_WF.map((w,i) => {
    if (w.type === 'start' || w.type === 'end'){
      const h = ((w.val - bottom) / span) * 100;
      return { label:w.label, val:w.val, disp:P(w.val), bottom:0, height:h,
        color:w.type === 'start' ? 'linear-gradient(180deg,#3060c0,#22489a)' : 'linear-gradient(180deg,#00875a,#006b47)',
        detail:w.type === 'start' ? 'Margin if every deal closed at list price and cost nothing extra to deliver'
                                  : 'What actually reaches the margin line after every deduction above', i };
    }
    const before = running; running += w.val;
    const h = (Math.abs(w.val) / span) * 100;
    const b = ((running - bottom) / span) * 100;
    return { label:w.label, val:w.val, disp:num(w.val,1), bottom:b, height:h,
      color:'linear-gradient(180deg,#d61f45,#ab1736)', detail:w.detail, before, after:running, i };
  });
  return `<div class="wf">${cols.map(c => `<div class="wcol" data-hc="wf" data-i="${c.i}">
      <div class="wv" style="color:${c.val < 0 ? 'var(--down)' : c.val > 65 ? 'var(--info)' : 'var(--up)'}">${c.disp}</div>
      <div style="width:100%;height:${100 - c.bottom - c.height}%"></div>
      <div class="wbox" style="height:${c.height}%;background:${c.color}"></div>
      <div style="width:100%;height:${c.bottom}%"></div>
      <div class="wl">${esc(c.label)}</div>
    </div>`).join('')}</div>`;
}

        <li>Do not reprice an account you are also trying to retain. Two of the eighteen support-heavy accounts are on the churn-risk list; repricing them this quarter turns one problem into two.</li>
        <li>Renegotiate underpriced contracts before their renewal date, not at it. Reopening a contract inside its notice window hands the customer the leverage.</li>
        <li>Accept contraction where the alternative is churn. A downgrade keeps the logo, the data and the option to expand later; a churn keeps none of them.</li>
      </ul>
    </div>
  </div>

  <div class="note"><b>Why the total here is smaller than the leakage number.</b> ${M(S(23.8),1)} of leakage is detected;
  ${M(S(total),1)} of it has an owner, an effort estimate and a route to cash. The difference is not rounding — it is the part
  that is diagnosed but not yet actionable, and reporting it as recoverable is how a recovery plan loses its credibility in
  the second quarter.</div>`;
}

function initActions(){
  const byEffort = ['Low','Medium','High'].map(e => ACTIONS.filter(a => a.effort === e).reduce((s,a) => s + a.amt, 0));
  mk('c-effort', { type:'bar',
    data:{ labels:['Low effort','Medium effort','High effort'],
      datasets:[{ data:byEffort.map(v => +S(v).toFixed(1)),
        backgroundColor:['rgba(0,135,90,.78)','rgba(147,92,0,.72)','rgba(214,31,69,.7)'], borderRadius:3, borderSkipped:false }] },
    options:{ plugins:{ tooltip:{ callbacks:{ label:c => '$' + c.raw + 'M recoverable' } } },
      scales:{ y:{ ticks:{ callback:v => '$'+v+'M' } } } } });
}

/* ═══════════════════════════════════════════════════════════════
   SHELL + ENGINE
   ═══════════════════════════════════════════════════════════════ */
function railHtml(){
  const cells = [
    { k:'gross',  label:'Gross revenue',        value:M(S(412.6),1), delta:6.4,  unit:'%', color:'var(--info)' },
    { k:'nrr',    label:'Net revenue retained', value:'104.2%',      delta:-1.8, unit:' pts' },
    { k:'leak',   label:'Leakage detected',     value:M(S(23.8),1),  delta:2.1,  unit:'M', invert:true, color:'var(--down)' },
    { k:'margin', label:'Realized margin',      value:'61.4%',       delta:-1.2, unit:' pts' },
    { k:'disc',   label:'Discount slippage',    value:'6.4 pts',     delta:0.9,  unit:' pts', invert:true, color:'var(--warn)' },
    { k:'bill',   label:'Billing accuracy',     value:'97.1%',       delta:-0.4, unit:' pts' },
    { k:'renew',  label:'Renewal win rate',     value:'88.4%',       delta:-2.1, unit:' pts' },
    { k:'arr',    label:'At-risk ARR',          value:M(S(31.2),1),  delta:4.6,  unit:'M', invert:true, color:'var(--down)' },
    { k:'refund', label:'Refunds & credits',    value:M(S(6.4),1),   delta:11.2, unit:'%', invert:true },
    { k:'hicost', label:'High-cost customers',  value:'42',          delta:7,    unit:'', invert:true, fmtDelta:d => signed(d,0) },
    { k:'expand', label:'Expansion revenue',    value:M(S(28.9),1),  delta:9.8,  unit:'%', color:'var(--up)' },
    { k:'recover',label:'Recovery identified',  value:M(S(18.6),1),  delta:3.2,  unit:'M', color:'var(--up)' }
  ];
  return `<div class="rail">${cells.map(rcell).join('')}</div>`;
}

function shell(){
  return `<div class="masthead">
    <div class="mast-top">
      <div class="mark">
        <div class="mark-glyph"><span>RL</span></div>
        <div>
          <div class="mast-title">Revenue Leakage &amp; Margin Intelligence Hub</div>
          <div class="mast-sub">HELIX SYSTEMS · FY26 Q3 · 2,140 customers · $412.6M booked</div>
        </div>
      </div>
      <div class="mast-right">
        <div><span class="dot"></span>SYNCED <span id="clk">${new Date().toLocaleTimeString()}</span></div>
        <div style="color:var(--dim);margin-top:2px">ERP · CPQ · CRM · BILLING · reconciled daily</div>
        <a href="https://paddyspeaks.com/" class="back">← PaddySpeaks.com</a>
      </div>
    </div>
    ${railHtml()}
  </div>
  <div class="tabs">${TABS.map((t,i) =>
    `<button class="tab${tab===t.id?' active':''}" data-tab="${t.id}"><span class="tnum">${String(i+1).padStart(2,'0')}</span>${esc(t.label)}</button>`).join('')}</div>
  <div class="filters">
    ${[['region','Region'],['seg','Segment'],['chan','Channel'],['line','Product line']].map(([k,l]) =>
      `<div class="fg"><span class="fl">${l}</span><select class="fs" data-f="${k}" aria-label="${l}">${
        Object.entries(LBL[k]).map(([v,t]) => `<option value="${v}"${F[k]===v?' selected':''}>${esc(t)}</option>`).join('')
      }</select></div>`).join('')}
    <div class="cmp"><span>COMPARE</span>
      <button data-cmp="qoq" class="${F.cmp==='qoq'?'on':''}">QoQ</button>
      <button data-cmp="yoy" class="${F.cmp==='yoy'?'on':''}">YoY</button>
    </div>
  </div>
  <div class="wrap"></div>`;
}

const VIEWS = { pulse:[renderPulse, initPulse], leakage:[renderLeakage, null], margin:[renderMargin, initMargin],
  pricing:[renderPricing, initPricing], renewals:[renderRenewals, initRenewals], mix:[renderMix, initMix],
  actions:[renderActions, initActions] };

function paint(){
  const host = $('.wrap'); if (!host) return;
  const [render, init] = VIEWS[tab] || VIEWS.pulse;
  killCharts();
  host.innerHTML = render();
  if (init) requestAnimationFrame(() => {
    try { init(); } catch(e){ console.warn('chart', e); }
  });
}
function mount(){ $('#app').innerHTML = shell(); paint(); }

/* ═══ hover content ═══ */
function hcFor(t){
  const kind = t.dataset.hc;
  if (kind === 'kpi'){
    const d = KPI_NOTES[t.dataset.k]; if (!d) return '';
    return `<h4>${esc(d.t)}</h4>${d.rows.map(r => hrow(r[0], esc(r[1]))).join('')}
      <div class="hc-note">${esc(d.n)}</div>`;
  }
  if (kind === 'funnel'){
    const i = +t.dataset.i, f = FUNNEL[i], d = DROPS[i], prev = DROPS[i-1];
    return `<h4>${esc(f.stage.toUpperCase())}</h4>
      ${hrow('Value', M(S(f.val)))}
      ${hrow('Share of booked', P((f.val / FUNNEL[0].val) * 100))}
      ${prev ? hrow('Lost reaching here', '−' + M(S(prev.amt))) : ''}
      ${d ? hrow('Lost after here', '−' + M(S(d.amt))) : ''}
      <div class="hc-note">${esc(f.sub)}${d ? ' — ' + d.why + '.' : ''}</div>`;
  }
  if (kind === 'leak'){
    const l = LEAKS[+t.dataset.i];
    return `<h4>${esc(l.src.toUpperCase())}</h4>
      ${hrow('Leakage', M(S(l.amt)))}${hrow('Category', esc(l.cat))}${hrow('Owner', esc(l.owner))}
      ${hrow('Accounts affected', String(l.accts))}${hrow('Per account', M(S(l.amt) / l.accts * 1000, 1).replace('M','K'))}
      ${hrow('Age', esc(l.age))}
      <div class="hc-note">${esc(l.note)}</div>`;
  }
  if (kind === 'heat'){
    const v = +t.dataset.v;
    return `<h4>${esc(t.dataset.r.toUpperCase())} · ${esc(t.dataset.c.toUpperCase())}</h4>
      ${hrow('Recoverable leakage', M(S(v)))}
      ${hrow('Share of total', P((v / 23.8) * 100))}
      <div class="hc-note">${esc(
        v > 4 ? 'The single largest cell on the grid. One defect, one region, one fix — and more value than the four smallest categories combined.'
        : v > 1.5 ? 'Material enough to have an owner and a date. Below this level the cost of a dedicated workstream exceeds the recovery.'
        : 'Small in isolation. Worth fixing only as part of the same change that clears a larger cell in the same row or column.')}</div>`;
  }
  if (kind === 'outlier'){
    const d = DISCOUNT_OUTLIERS.find(x => x.acct === t.dataset.a); if (!d) return '';
    const lost = d.acv * (d.disc - d.bench) / 100;
    return `<h4>${esc(d.acct.toUpperCase())}</h4>
      ${hrow('Contract value', M(d.acv,2))}${hrow('Discount', P(d.disc))}${hrow('Segment band', P(d.bench,0))}
      ${hrow('Over band', '+' + num(d.disc - d.bench,1) + ' pts')}
      ${hrow('Annual margin given up', M(lost,2))}
      ${hrow('Renews', esc(d.renew))}${hrow('Owner', esc(d.rep))}
      <div class="hc-note">Recovering the band on this one contract is worth ${M(lost,2)} a year. Recovering it across all ten outliers is worth ${M(DISCOUNT_OUTLIERS.reduce((s,x) => s + x.acv * (x.disc - x.bench) / 100, 0),1)}.</div>`;
  }
  if (kind === 'acct'){
    const a = AT_RISK.find(x => x.acct === t.dataset.a); if (!a) return '';
    return `<h4>${esc(a.acct.toUpperCase())}</h4>
      ${hrow('ARR', M(a.arr,2))}${hrow('Health', String(a.health) + ' / 100')}${hrow('Usage trend', signed(a.usage,0) + '%')}
      ${hrow('Support tickets', String(a.support))}${hrow('Exec sponsor', esc(a.exec))}${hrow('Renews', esc(a.renew))}
      ${hrow('Stated reason', esc(a.reason))}
      <div class="hc-note">${esc(a.health < 45 && a.exec === 'No'
        ? 'No sponsor, failing health, and a renewal date approaching. This is the profile that shows up in the churn report next quarter.'
        : 'Recoverable with a deliberate intervention. Click for the recommended play.')}</div>`;
  }
  if (kind === 'wf'){
    const w = MARGIN_WF[+t.dataset.i];
    if (w.type === 'start') return `<h4>LIST MARGIN</h4>${hrow('Margin', P(w.val))}
      <div class="hc-note">What the book would earn if every deal closed at list and cost nothing extra to deliver. Nobody has ever run a business at this number — it is the ceiling, not the target.</div>`;
    if (w.type === 'end') return `<h4>REALIZED MARGIN</h4>${hrow('Margin', P(w.val))}${hrow('Erosion from list', '−12.6 pts')}
      <div class="hc-note">What actually reaches the margin line. Six of the twelve lost points are discounting, which means half the erosion is a decision somebody can unmake.</div>`;
    return `<h4>${esc(w.label.toUpperCase())}</h4>${hrow('Impact on margin', num(w.val,1) + ' pts')}
      ${hrow('Share of total erosion', P(Math.abs(w.val) / 12.6 * 100))}
      <div class="hc-note">${esc(w.detail)}</div>`;
  }
  return '';
}

/* ═══ events ═══ */
document.addEventListener('click', e => {
  const t = e.target.closest('.tab[data-tab]');
  if (t){ if (t.dataset.tab !== tab){ tab = t.dataset.tab; hcHide();
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    paint(); scrollTo({ top:0, behavior:'smooth' }); } return; }

  const c = e.target.closest('[data-cmp]');
  if (c){ F.cmp = c.dataset.cmp;
    document.querySelectorAll('[data-cmp]').forEach(b => b.classList.toggle('on', b.dataset.cmp === F.cmp));
    $('.masthead .rail').outerHTML = railHtml(); paint(); return; }

  if (e.target.closest('[data-x]') || e.target.id === 'bd'){ closeMd(); return; }

  const m = e.target.closest('[data-md]');
  if (m){
    hcHide();
    const kind = m.dataset.md;
    if (kind === 'action') openMd(actionModal(ACTIONS[+m.dataset.i], +m.dataset.i + 1));
    else if (kind === 'leak') openMd(leakModal(LEAKS[+m.dataset.i]));
    else if (kind === 'product') openMd(productModal(PRODUCTS[+m.dataset.i]));
    else if (kind === 'acct'){ const a = AT_RISK.find(x => x.acct === m.dataset.a); if (a) openMd(acctModal(a)); }
  }
});

document.addEventListener('change', e => {
  const f = e.target.closest('[data-f]');
  if (f){ F[f.dataset.f] = f.value; mount(); }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeMd(); hcHide(); } });

if (matchMedia('(hover:hover) and (pointer:fine)').matches){
  document.addEventListener('mouseover', e => {
    const t = e.target.closest('[data-hc]');
    if (t === hcTarget) return;
    if (!t){ if (hcTarget) hcHide(); return; }
    hcTarget = t;
    const html = hcFor(t);
    if (html) hcShow(t, html); else hcHide();
  });
  document.addEventListener('mouseout', e => {
    const t = e.target.closest('[data-hc]');
    if (!t || t !== hcTarget) return;
    if (e.relatedTarget && t.contains(e.relatedTarget)) return;
    hcHide();
  });
}
addEventListener('scroll', hcHide, { capture:true, passive:true });
setInterval(() => { const c = document.getElementById('clk'); if (c) c.textContent = new Date().toLocaleTimeString(); }, 5000);

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
</script>
