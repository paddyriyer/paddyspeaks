<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#eef0f7;--bg2:#f6f7fc;--panel:#ffffff;--panel2:#f5f6fc;--panel3:#e8eaf5;
  --line:#e2e5f0;--line2:#ccd1e4;
  --text:#191a2e;--muted:#5a5f7d;--dim:#6b7488;
  --violet:#5b3fd6;--cyan:#087a97;--mint:#0a7f57;--amber:#96620a;--rose:#d63c5e;--sky:#2b6cb0;--plum:#8b46d4;
  --glow:0 0 22px rgba(91,63,214,.20);
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 520px at 12% -8%,rgba(91,63,214,.10),transparent 62%),
             radial-gradient(760px 480px at 92% 2%,rgba(8,122,151,.09),transparent 60%)}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
a{color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── header ── */
.header{background:linear-gradient(135deg,rgba(255,255,255,.94),rgba(244,245,252,.94));border-bottom:1px solid var(--line);padding:13px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px;position:sticky;top:0;z-index:120;backdrop-filter:blur(18px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.orb{width:40px;height:40px;border-radius:13px;background:linear-gradient(140deg,var(--violet),var(--cyan));display:flex;align-items:center;justify-content:center;box-shadow:var(--glow);position:relative}
.orb::after{content:'';position:absolute;inset:3px;border-radius:10px;background:rgba(255,255,255,.9)}
.orb span{position:relative;z-index:1;font-weight:900;font-size:15px;letter-spacing:-.5px;background:linear-gradient(140deg,var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-title{font-size:16px;font-weight:800;letter-spacing:-.35px}
.brand-sub{font-size:10.5px;color:var(--muted);margin-top:2px;letter-spacing:.2px}
.header-right{text-align:right;font-size:11px;color:var(--muted)}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mint);margin-right:6px;animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(10,127,87,.45)}50%{opacity:.55;box-shadow:0 0 0 7px rgba(10,127,87,0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.back-link{font-size:10px;color:var(--cyan);text-decoration:none;opacity:.75}
.back-link:hover{opacity:1}

/* ── tabs ── */
.tabs{display:flex;background:rgba(255,255,255,.88);border-bottom:1px solid var(--line);padding:0 18px;overflow-x:auto;scrollbar-width:none;position:sticky;top:67px;z-index:110;backdrop-filter:blur(14px)}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 17px;font-size:12px;font-weight:500;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .18s,background .18s;font-family:inherit}
.tab:hover{color:var(--text);background:rgba(25,26,46,.04)}
.tab.active{color:var(--violet);font-weight:700;border-bottom-color:var(--violet);background:linear-gradient(180deg,rgba(91,63,214,.14),transparent)}

/* ── filter bar ── */
.filterbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 26px;background:rgba(246,247,252,.86);border-bottom:1px solid var(--line);position:sticky;top:110px;z-index:105;backdrop-filter:blur(14px)}
.fgroup{display:flex;align-items:center;gap:7px}
.flabel{font-size:9.5px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.9px}
select.fsel{background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:11.5px;font-family:inherit;cursor:pointer;outline:none;transition:border-color .18s}
select.fsel:hover,select.fsel:focus{border-color:var(--violet)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:none;border:none;color:var(--muted);font-family:inherit;font-size:11px;font-weight:600;padding:6px 12px;cursor:pointer;transition:all .18s}
.seg button:hover{color:var(--text)}
.seg button.on{background:linear-gradient(135deg,var(--violet),#4f34c4);color:#fff}
.fspacer{flex:1}
.fnote{font-size:10.5px;color:var(--dim)}
.fnote b{color:var(--muted);font-weight:600}

/* ── layout ── */
.content{padding:22px 26px 56px;max-width:1560px;margin:0 auto;width:100%;animation:fadeIn .32s ease}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px}
.sec-head:first-child{margin-top:0}
.sec-head h2{font-size:14px;font-weight:800;letter-spacing:-.2px}
.sec-head p{font-size:11.5px;color:var(--dim)}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}

/* ── kpi ── */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(192px,1fr));gap:12px;margin-bottom:6px}
@media(min-width:1340px){.kpi-row.ten{grid-template-columns:repeat(5,1fr)}}
.kpi{position:relative;background:linear-gradient(160deg,var(--panel) 0%,var(--panel2) 100%);border:1px solid var(--line);border-radius:14px;padding:15px 16px 13px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 14px 34px rgba(25,26,46,.10)}
.kpi-bar{position:absolute;top:0;left:0;right:0;height:2px}
.kpi-label{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.85px}
.kpi-value{font-size:25px;font-weight:800;letter-spacing:-.8px;margin-top:6px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kpi-foot{display:flex;align-items:center;justify-content:space-between;margin-top:7px;gap:8px}
.kpi-sub{font-size:10px;color:var(--dim)}
.kpi-trend{font-size:10.5px;font-weight:700;font-family:var(--mono)}
.up{color:var(--mint)}.down{color:var(--rose)}.flat{color:var(--muted)}

/* ── card ── */
.card{background:linear-gradient(165deg,var(--panel) 0%,rgba(248,249,253,.9) 100%);border:1px solid var(--line);border-radius:14px;padding:16px 18px;transition:border-color .2s}
.card:hover{border-color:var(--line2)}
.card-title{font-size:12px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:9px;justify-content:space-between}
.card-title .t{display:flex;align-items:center;gap:8px}
.card-sub{font-size:10.5px;color:var(--dim);margin-bottom:13px}
.badge{font-size:8.5px;font-weight:700;padding:3px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.7px}
.chart-box{position:relative;width:100%;height:270px}
.chart-box>canvas{position:absolute;top:0;left:0}
.chart-sm{height:210px}

/* ── agent fleet ── */
.fleet{display:grid;grid-template-columns:repeat(auto-fit,minmax(288px,1fr));gap:13px}
.agent{position:relative;background:linear-gradient(165deg,var(--panel) 0%,var(--panel2) 100%);border:1px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;overflow:hidden}
.agent::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .25s;background:radial-gradient(420px 160px at 20% 0%,rgba(91,63,214,.12),transparent 70%)}
.agent:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 16px 40px rgba(25,26,46,.12)}
.agent:hover::before{opacity:1}
.agent-top{display:flex;align-items:flex-start;gap:11px;position:relative}
.agent-ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.agent-name{font-size:13px;font-weight:700;letter-spacing:-.2px}
.agent-meta{font-size:10px;color:var(--dim);margin-top:2px;font-family:var(--mono)}
.agent-stats{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;margin-top:13px;position:relative}
.astat{display:flex;justify-content:space-between;font-size:10.5px;padding-bottom:5px;border-bottom:1px solid rgba(25,26,46,.07)}
.astat .k{color:var(--muted)}
.astat .v{font-weight:700;font-family:var(--mono)}
.conf-track{height:5px;border-radius:3px;background:var(--panel3);overflow:hidden;margin-top:12px;position:relative}
.conf-fill{height:100%;border-radius:3px}

/* ── tables ── */
.table-wrap{overflow:auto;max-height:430px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
thead{position:sticky;top:0;z-index:4}
th{background:var(--panel2);color:var(--muted);font-weight:700;font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;padding:9px 11px;text-align:left;border-bottom:1px solid var(--line)}
td{padding:9px 11px;border-bottom:1px solid rgba(25,26,46,.07)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
th.num{text-align:right}
tr.hoverable{cursor:pointer;transition:background .15s}
tr.hoverable:hover td{background:rgba(91,63,214,.07)}

.pill{display:inline-block;padding:2.5px 9px;border-radius:5px;font-size:9.5px;font-weight:700;letter-spacing:.2px}
.p-mint{background:rgba(10,127,87,.15);color:var(--mint)}
.p-rose{background:rgba(214,60,94,.15);color:var(--rose)}
.p-amber{background:rgba(150,98,10,.15);color:var(--amber)}
.p-violet{background:rgba(91,63,214,.18);color:#5b3fd6}
.p-cyan{background:rgba(8,122,151,.15);color:var(--cyan)}
.p-dim{background:rgba(25,26,46,.06);color:var(--muted)}

/* ── bars ── */
.bar-row{display:grid;grid-template-columns:150px 1fr 66px;gap:11px;align-items:center;padding:6px 0;font-size:11.5px}
.bar-row .lbl{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:9px;border-radius:5px;background:var(--panel3);overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-row .val{text-align:right;font-family:var(--mono);font-weight:700;font-size:11px}

/* ── alerts ── */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);margin-bottom:9px;cursor:pointer;transition:transform .18s,border-color .18s}
.alert:hover{transform:translateX(3px);border-color:var(--line2)}
.alert-ico{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.alert-title{font-size:12px;font-weight:700}
.alert-body{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.alert-meta{font-size:9.5px;color:var(--dim);margin-top:5px;font-family:var(--mono)}

/* ── simulator ── */
.sim-grid{display:grid;grid-template-columns:320px 1fr;gap:14px}
.sim-panel{background:linear-gradient(165deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:18px}
.sim-block{margin-bottom:19px}
.sim-block:last-child{margin-bottom:0}
.sim-label{display:flex;justify-content:space-between;font-size:11px;font-weight:600;margin-bottom:8px}
.sim-label .v{font-family:var(--mono);font-weight:700;color:var(--cyan)}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:var(--panel3);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:linear-gradient(140deg,var(--violet),var(--cyan));cursor:pointer;box-shadow:0 0 12px rgba(91,63,214,.6)}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border:none;border-radius:50%;background:var(--violet);cursor:pointer}
.posture{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.posture button{background:var(--panel2);border:1px solid var(--line2);color:var(--muted);border-radius:9px;padding:9px 6px;font-family:inherit;font-size:10.5px;font-weight:700;cursor:pointer;transition:all .18s}
.posture button:hover{color:var(--text);border-color:var(--violet)}
.posture button.on{background:linear-gradient(140deg,rgba(91,63,214,.3),rgba(8,122,151,.18));border-color:var(--violet);color:var(--violet)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-bottom:7px;cursor:pointer;transition:border-color .18s}
.toggle-row:hover{border-color:var(--line2)}
.toggle-row.on{border-color:var(--rose);background:rgba(214,60,94,.09)}
.toggle-row .tl{font-size:11px;font-weight:600}
.toggle-row .ts{font-size:9.5px;color:var(--dim);margin-top:2px}
.switch{width:34px;height:19px;border-radius:11px;background:var(--panel3);position:relative;flex-shrink:0;transition:background .2s}
.switch::after{content:'';position:absolute;top:2.5px;left:2.5px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:all .2s}
.toggle-row.on .switch{background:rgba(214,60,94,.35)}
.toggle-row.on .switch::after{left:17.5px;background:var(--rose)}
.sim-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:14px}
.sim-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.sim-card .l{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.sim-card .v{font-size:23px;font-weight:800;font-family:var(--mono);margin-top:6px;letter-spacing:-.6px}
.sim-card .d{font-size:10px;color:var(--dim);margin-top:4px}

/* ── hover widget ── */
.hw{position:fixed;z-index:900;background:linear-gradient(150deg,#ffffff,#f5f6fc);border:1px solid var(--line2);border-radius:14px;padding:16px 17px;width:340px;max-height:86vh;overflow-y:auto;box-shadow:0 24px 64px rgba(25,26,46,.16),0 0 36px rgba(91,63,214,.14);pointer-events:none;opacity:0;transform:scale(.96);transition:opacity .18s,transform .18s;backdrop-filter:blur(18px)}
.hw.visible{opacity:1;transform:scale(1)}
.hw h3{font-size:12.5px;font-weight:800;color:#5b3fd6;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.hw-row{display:flex;justify-content:space-between;gap:12px;padding:4.5px 0;font-size:10.5px;border-bottom:1px solid rgba(25,26,46,.07)}
.hw-row:last-child{border-bottom:none}
.hw-k{color:var(--muted)}
.hw-v{font-weight:700;font-family:var(--mono)}
.hw-sec{margin-top:11px;padding-top:9px;border-top:1px solid var(--line)}
.hw-st{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.9px;margin-bottom:6px}
.hw-note{font-size:10px;color:var(--muted);line-height:1.55}

/* ── modal ── */
.backdrop{position:fixed;inset:0;background:rgba(25,26,46,.34);backdrop-filter:blur(6px);z-index:940;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-48%) scale(.97);width:min(760px,calc(100vw - 40px));max-height:84vh;overflow-y:auto;background:linear-gradient(165deg,#ffffff,#f7f8fd);border:1px solid var(--line2);border-radius:18px;z-index:950;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 40px 90px rgba(25,26,46,.18)}
.modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal-head{padding:20px 24px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;position:sticky;top:0;background:linear-gradient(165deg,#ffffff,#fafbfe);z-index:2}
.modal-head h2{font-size:17px;font-weight:800;letter-spacing:-.3px}
.modal-head p{font-size:11px;color:var(--muted);margin-top:4px}
.mclose{background:var(--panel2);border:1px solid var(--line2);color:var(--muted);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1;flex-shrink:0;transition:all .18s}
.mclose:hover{color:var(--rose);border-color:var(--rose)}
.modal-body{padding:18px 24px 24px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:18px}
.mstat{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px 13px}
.mstat .l{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.mstat .v{font-size:19px;font-weight:800;font-family:var(--mono);margin-top:5px}
.msec{margin-top:16px}
.msec h4{font-size:11px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:.9px;margin-bottom:9px}
.msec p{font-size:12px;color:var(--muted);line-height:1.65}
.mlist{list-style:none}
.mlist li{font-size:11.5px;color:var(--muted);padding:7px 0 7px 18px;position:relative;line-height:1.55;border-bottom:1px solid rgba(25,26,46,.06)}
.mlist li::before{content:'▸';position:absolute;left:0;color:var(--violet)}
.mlist li:last-child{border-bottom:none}

.demo-note{margin-top:34px;padding:13px 16px;border:1px dashed var(--line2);border-radius:11px;font-size:10.5px;color:var(--dim);line-height:1.65}
.demo-note b{color:var(--muted)}

@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g23,.g32{grid-template-columns:1fr}.sim-grid{grid-template-columns:1fr}}
@media(max-width:820px){.g2,.g4{grid-template-columns:1fr}.content{padding:16px 14px 44px}.header{padding:11px 14px}.filterbar{padding:10px 14px;top:0;position:relative}.tabs{position:relative;top:0}.hw{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<div class="backdrop" id="backdrop"></div>
<div class="modal" id="modal"></div>
<script>
/* ═══════════════════════════════════════════════════════════════
   AI EXECUTIVE COMMAND CENTER — synthetic enterprise dataset
   All figures are fictional and generated for demonstration.
   Reference org: "Northwind Industries" — 18,400 employees, $4.2B revenue.
   ═══════════════════════════════════════════════════════════════ */

const TABS = [
  { id:'overview',  icon:'◎', label:'Executive Overview' },
  { id:'agents',    icon:'◈', label:'AI Agents' },
  { id:'roi',       icon:'▤', label:'ROI & Productivity' },
  { id:'risk',      icon:'⚠', label:'Risk & Governance' },
  { id:'customer',  icon:'♁', label:'Customer Impact' },
  { id:'dept',      icon:'⬢', label:'Department Performance' },
  { id:'sim',       icon:'⟳', label:'Scenario Simulator' }
];

const WEEKS = ['W27','W28','W29','W30','W31','W32','W33','W34','W35','W36','W37','W38'];

const money = n => { const s = n < 0 ? '\u2212' : '', a = Math.abs(n);
  return a >= 1e9 ? s+'$'+(a/1e9).toFixed(2)+'B' : a >= 1e6 ? s+'$'+(a/1e6).toFixed(1)+'M'

/* 1,680 h = one FTE-year. A quarter-to-date hours figure is not an FTE-year,
   so it is divided by that period's share of 1,680 rather than the whole. */
const fte = h => h / (1680 * PERIOD_MIX[F.period] * 0.25);
/* CSS custom properties cannot be concatenated with an alpha suffix — "var(--mint)99"
   is not a colour. Anything that builds a gradient in JS resolves to hex first. */
const HEX = { violet:'#5b3fd6', cyan:'#087a97', mint:'#0a7f57', amber:'#96620a',
  rose:'#d63c5e', sky:'#2b6cb0', plum:'#8b46d4', muted:'#8b8bab' };
const hex = c => c && c.startsWith('var(--') ? (HEX[c.slice(6,-1)] || '#5b3fd6') : (c || '#5b3fd6');

/* Filters genuinely reshape the numbers: unit selects a slice, region and
   period scale volume-like measures. Rate-like measures (confidence, uptime,
   override %) are NOT scaled — only re-sliced — because a ratio does not grow
   because you looked at a bigger window. */
function unitAgents(){ return F.unit === 'all' ? AGENTS : AGENTS.filter(a => a.unit === F.unit); }
function unitDepts(){ return F.unit === 'all' ? DEPTS : DEPTS.filter(d => d.key === F.unit); }
function volScale(){ return REGION_MIX[F.region] * PERIOD_MIX[F.period]; }
function unitShare(){
  if (F.unit === 'all') return 1;
  const tot = DEPTS.reduce((s,d) => s + d.hours, 0);
  const one = DEPTS.filter(d => d.key === F.unit).reduce((s,d) => s + d.hours, 0);
  return one / tot || 0.1;
}
function vol(base){ return base * volScale() * unitShare(); }
function avg(arr, k){ return arr.length ? arr.reduce((s,x) => s + (k ? x[k] : x), 0) / arr.length : 0; }

function scaleSeries(arr){
  const s = volScale() * unitShare() / PERIOD_MIX.qtd;
  return arr.map(v => +(v * s * PERIOD_MIX.qtd).toFixed(2));
}
function sliceSeries(arr){
  const n = F.period === '7d' ? 3 : F.period === '30d' ? 6 : F.period === 'ytd' ? 12 : 12;
  return { labels: WEEKS.slice(-n), data: arr.slice(-n) };
}

function sparkline(data, color, w=132, h=34){
  const mn = Math.min(...data), mx = Math.max(...data), rg = (mx - mn) || 1;
  const pts = data.map((v,i) => `${(i/(data.length-1))*w},${h-((v-mn)/rg)*(h-6)-3}`).join(' ');
  const id = 'sg'+Math.random().toString(36).slice(2,8);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".34"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="0,${h} ${pts} ${w},${h}" fill="url(#${id})"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function barRow(label, value, maxv, color, display){
  const w = Math.max(2, Math.min(100, (value / maxv) * 100));
  const h = hex(color);
  return `<div class="bar-row"><div class="lbl" title="${esc(label)}">${esc(label)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:linear-gradient(90deg,${h},${h}aa)"></div></div>
    <div class="val">${display}</div></div>`;
}

function destroyCharts(){ Object.values(charts).forEach(c => { try { c.destroy(); } catch(e){} }); charts = {}; }

function mkChart(id, cfg){
  const cv = document.getElementById(id);
  if (!cv || typeof Chart === 'undefined') return;
  // Chart.js reads these from `options`, not from the config root.
  const base = { options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{ display:false, labels:{ color:'#5a5f7d', font:{ size:10, family:'Inter' }, boxWidth:9, boxHeight:9, usePointStyle:true } },
        tooltip:{ backgroundColor:'rgba(255,255,255,.98)', borderColor:'#ccd1e4', borderWidth:1, titleColor:'#191a2e',
          bodyColor:'#5a5f7d', padding:11, cornerRadius:9, titleFont:{ size:11, weight:'700' }, bodyFont:{ size:11 }, displayColors:true, boxPadding:4 }
      },
      scales:{
        x:{ grid:{ color:'rgba(25,26,46,.09)', drawTicks:false }, border:{ display:false }, ticks:{ color:'#767b96', font:{ size:10 } } },
        y:{ grid:{ color:'rgba(25,26,46,.09)', drawTicks:false }, border:{ display:false }, ticks:{ color:'#767b96', font:{ size:10 } } }
      }
  
  } };
  charts[id] = new Chart(cv.getContext('2d'), merge(base, cfg));
}
function merge(a, b){
  const out = Array.isArray(a) ? a.slice() : Object.assign({}, a);
  for (const k in b){
    if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object')
      out[k] = merge(a[k], b[k]);
    else out[k] = b[k];
  }
  return out;
}
function grad(ctx, rgb, top=.38){
  const g = ctx.createLinearGradient(0, 0, 0, 260);
  g.addColorStop(0, `rgba(${rgb},${top})`); g.addColorStop(1, `rgba(${rgb},0)`);
  return g;
}

function showHover(target, html){
  if (!hoverEl){ hoverEl = document.createElement('div'); hoverEl.className = 'hw'; document.body.appendChild(hoverEl); }
  hoverEl.innerHTML = html;
  const r = target.getBoundingClientRect();
  hoverEl.classList.add('visible');
  const hw = hoverEl.getBoundingClientRect();
  let left = r.right + 14, top = r.top;
  if (left + hw.width > window.innerWidth - 12) left = Math.max(12, r.left - hw.width - 14);
  if (top + hw.height > window.innerHeight - 12) top = Math.max(12, window.innerHeight - hw.height - 12);
  hoverEl.style.left = left + 'px'; hoverEl.style.top = top + 'px';
}
function hideHover(){ if (hoverEl) hoverEl.classList.remove('visible'); hoverTarget = null; }

/* ═══════════════════════════════════════════════════════════════
   TAB: SCENARIO SIMULATOR
   ═══════════════════════════════════════════════════════════════ */
const POSTURES = {
  conservative:{ label:'Conservative', mult:0.62, cost:0.74, risk:0.55, time:'18 months',
    note:'Two agents scale, four hold. Governance leads adoption. You will underspend and under-realise, and you will never be on the front page.' },
  balanced:{ label:'Balanced', mult:1, cost:1, risk:1, time:'12 months',
    note:'Scale the four healthy agents, hold the two on watch until their retrains land. This is the plan the numbers on this dashboard already assume.' },
  aggressive:{ label:'Aggressive', mult:1.58, cost:1.72, risk:1.9, time:'7 months',
    note:'All six agents scale at once, including the two correcting badly. The upside is real and so is the correction cost, which grows with volume rather than with value.' }
};

function simulate(){
  const p = POSTURES[SIM.posture];
  const lift = 1 + (SIM.adoption / 100);
  const failedIds = Object.keys(SIM.failed).filter(k => SIM.failed[k]);
  const failedAgents = AGENTS.filter(a => failedIds.includes(a.id));
  const lostHours = failedAgents.reduce((s,a) => s + a.hours, 0);
  const lostTasks = failedAgents.reduce((s,a) => s + a.tasks, 0);
  const totalHours = DEPTS.reduce((s,d) => s + d.hours, 0);   // 97,710 hours per quarter

  // Hours are quarterly; benefit is annualized at the fully-loaded rate that
  // reproduces the $48.3M labour line on the ROI tab when every input is at plan.
  const hours = (totalHours - lostHours) * lift * p.mult;
  const gross = hours * 4 * 123.6;
  const run = 8.9e6 * p.cost * lift;
  const net = gross + 23.1e6 * p.mult - run - 4.6e6;
  const override = 7.6 * (1 + (p.risk - 1) * 0.42) * (1 + (SIM.adoption / 100) * 0.18);
  const incidents = Math.max(0, Math.round(3 * p.risk * (1 + SIM.adoption / 160) + failedAgents.length * 2));
  const adoptionNow = Math.min(99, 76 * (1 + SIM.adoption / 100));
  const backlogDays = failedAgents.length ? +(failedAgents.length * 3.4 * (p.mult)).toFixed(1) : 0;
  const customers = failedAgents.length ? Math.round(lostTasks / 34) : 0;

  return { p, hours, gross, run, net, override, incidents, adoptionNow, failedAgents, backlogDays, customers,
           payback:+(4.1 * p.cost / (p.mult * lift)).toFixed(1) };
}

        <div class="sim-card"><div class="l">Expected incidents / qtr</div>
          <div class="v" style="color:${r.incidents > 5 ? 'var(--rose)' : 'var(--text)'}">${r.incidents}</div>
          <div class="d">severity 2 and above</div></div>
      </div>

      <div class="card">
        <div class="card-title"><span class="t">Projected value against the balanced baseline</span>
          <span class="badge ${r.net >= 57.9e6 ? 'p-mint' : 'p-rose'}">${r.net >= 57.9e6 ? 'above plan' : 'below plan'}</span></div>
        <div class="card-sub">Gross benefit, run cost and net, at the current settings.</div>
        <div class="chart-box"><canvas id="c-sim"></canvas></div>
      </div>

      ${r.failedAgents.length ? `<div class="card" style="margin-top:14px;border-color:rgba(214,60,94,.4)">
        <div class="card-title"><span class="t" style="color:var(--rose)">⚠ Failure impact — ${r.failedAgents.map(a => esc(a.name)).join(', ')}</span></div>
        <div class="card-sub">What happens in the first week if these agents stop serving.</div>
        <div class="mgrid" style="margin-bottom:0">
          ${mstat('Hours lost / qtr', fmt(r.failedAgents.reduce((s,a) => s + a.hours, 0)), 'var(--rose)')}
          ${mstat('Work returning to humans', fmt(r.failedAgents.reduce((s,a) => s + a.tasks, 0))+' tasks', 'var(--amber)')}
          ${mstat('Backlog build', r.backlogDays+' days', 'var(--rose)')}
          ${mstat('Customers affected', fmt(r.customers), 'var(--amber)')}
        </div>
        <div style="margin-top:15px;font-size:11.5px;color:var(--muted);line-height:1.65">
          ${esc(r.failedAgents.some(a => a.id === 'support')
            ? 'Support Copilot carries the largest single block of deflected volume in the fleet. Losing it does not degrade service gradually — the queue rebuilds within hours and the contact centre needs surge staffing inside one shift, which is the scenario the continuity plan is actually for.'
            : 'The fleet absorbs this. Work returns to the teams that used to do it, throughput falls back toward the 2025 baseline in the affected function, and no customer-facing SLA breaches in the first week — provided the outage is measured in days rather than weeks.')}
        </div>
      </div>` : ''}
    </div>
  </div>

  <div class="demo-note"><b>What the simulator will not do.</b> It will not show adoption rising without run cost rising with it,
  and it will not let an aggressive posture produce a lower override rate. Those two couplings are the entire reason a rollout
  decision is a decision rather than a preference.</div>`;
}

function initSim(){
  const r = simulate();
  mkChart('c-sim', { type:'bar',
    data:{ labels:['Gross benefit','Cost avoided','Run cost','Implementation','Net'],
      datasets:[
        { label:'Baseline (balanced)', data:[48.3, 23.1, -8.9, -4.6, 57.9], backgroundColor:'rgba(122,129,158,.34)', borderRadius:5, borderSkipped:false },
        { label:'Scenario', data:[+(r.gross/1e6).toFixed(1), +(23.1*r.p.mult).toFixed(1), -+(r.run/1e6).toFixed(1), -4.6, +(r.net/1e6).toFixed(1)],
          backgroundColor:['rgba(10,127,87,.8)','rgba(8,122,151,.8)','rgba(214,60,94,.75)','rgba(150,98,10,.7)','rgba(91,63,214,.85)'],
          borderRadius:5, borderSkipped:false }
      ] },
    options:{ plugins:{ legend:{ display:true, position:'bottom' },
        tooltip:{ callbacks:{ label:c => `${c.dataset.label}: ${c.raw < 0 ? '−$' : '$'}${Math.abs(c.raw).toFixed(1)}M` } } },
      scales:{ y:{ ticks:{ callback:v => '$'+v+'M' } } } } });
}

/* ═══════════════════════════════════════════════════════════════
   SHELL + ENGINE
   ═══════════════════════════════════════════════════════════════ */
function renderHeader(){
  return `<div class="header">
    <div class="brand">
      <div class="orb"><span>AI</span></div>
      <div>
        <div class="brand-title">AI Executive Command Center</div>
        <div class="brand-sub">Northwind Industries · FY26 Q3 · 6 agents in production · 18,400 employees</div>
      </div>
    </div>
    <div class="header-right">
      <div><span class="live-dot"></span>LIVE — <span id="clock" class="mono">${new Date().toLocaleTimeString()}</span></div>
      <div style="font-size:10px;color:var(--dim);margin-top:2px">Governance: 94 · Incidents: 3 open · Override 7.6%</div>
      <a href="https://paddyspeaks.com/" class="back-link">← PaddySpeaks.com</a>
    </div>
  </div>`;
}

function renderTabs(){
  return `<div class="tabs">${TABS.map(t =>
    `<button class="tab${activeTab===t.id?' active':''}" data-tab="${t.id}">${t.icon}&nbsp; ${esc(t.label)}</button>`).join('')}</div>`;
}

function renderFilters(){
  const unitOpts = Object.entries(UNIT_LABEL).map(([k,v]) =>
    `<option value="${k}"${F.unit===k?' selected':''}>${esc(v)}</option>`).join('');
  const regionOpts = Object.entries(REGION_LABEL).map(([k,v]) =>
    `<option value="${k}"${F.region===k?' selected':''}>${esc(v)}</option>`).join('');
  return `<div class="filterbar">
    <div class="fgroup"><span class="flabel">Business unit</span>
      <select class="fsel" id="f-unit" aria-label="Business unit">${unitOpts}</select></div>
    <div class="fgroup"><span class="flabel">Region</span>
      <select class="fsel" id="f-region" aria-label="Region">${regionOpts}</select></div>
    <div class="fgroup"><span class="flabel">Period</span>
      <div class="seg" id="f-period">${Object.keys(PERIOD_MIX).map(k =>
        `<button data-period="${k}" class="${F.period===k?'on':''}">${k.toUpperCase()}</button>`).join('')}</div></div>
    <div class="fspacer"></div>
    <div class="fnote">Viewing <b>${esc(UNIT_LABEL[F.unit])}</b> · <b>${esc(REGION_LABEL[F.region])}</b> · <b>${esc(PERIOD_LABEL[F.period])}</b></div>
  </div>`;
}

const RENDERERS = { overview:[renderOverview, initOverview], agents:[renderAgents, initAgents],
  roi:[renderROI, initROI], risk:[renderRisk, initRisk], customer:[renderCustomer, initCustomer],
  dept:[renderDept, initDept], sim:[renderSim, initSim] };

function renderContent(){
  const host = $('.content');
  if (!host) return;
  const [render, init] = RENDERERS[activeTab] || RENDERERS.overview;
  destroyCharts();
  host.innerHTML = render();
  requestAnimationFrame(() => {
    try { init(); } catch(e){ console.warn('chart init', e); }
  });
}

function renderAll(){
  $('#app').innerHTML = renderHeader() + renderTabs() + renderFilters() + '<div class="content"></div>';
  renderContent();
}

function switchTab(id){
  if (id === activeTab) return;
  activeTab = id; hideHover();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  renderContent();
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ═══ events ═══ */
document.addEventListener('click', e => {
  const tab = e.target.closest('.tab[data-tab]');
  if (tab){ switchTab(tab.dataset.tab); return; }

  const per = e.target.closest('[data-period]');
  if (per){ F.period = per.dataset.period;
    document.querySelectorAll('#f-period button').forEach(b => b.classList.toggle('on', b.dataset.period === F.period));
    $('.filterbar .fnote').innerHTML = `Viewing <b>${esc(UNIT_LABEL[F.unit])}</b> · <b>${esc(REGION_LABEL[F.region])}</b> · <b>${esc(PERIOD_LABEL[F.period])}</b>`;
    renderContent(); return; }

  if (e.target.closest('[data-close]') || e.target.id === 'backdrop'){ closeModal(); return; }

  const posture = e.target.closest('[data-posture]');
  if (posture){ SIM.posture = posture.dataset.posture; renderContent(); return; }

  const fail = e.target.closest('[data-fail]');
  if (fail){ const id = fail.dataset.fail; SIM.failed[id] = !SIM.failed[id]; renderContent(); return; }

  const mod = e.target.closest('[data-modal]');
  if (mod){
    hideHover();
    const kind = mod.dataset.modal;
    if (kind === 'agent'){ const a = AGENTS.find(x => x.id === mod.dataset.id); if (a) openModal(agentModal(a)); }
    else if (kind === 'incident') openModal(incidentModal(INCIDENTS[+mod.dataset.idx]));
    else if (kind === 'win') openModal(winModal(WINS[+mod.dataset.idx]));
    return;
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'f-unit'){ F.unit = e.target.value; renderAll(); }
  if (e.target.id === 'f-region'){ F.region = e.target.value; renderAll(); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'sim-adopt'){
    SIM.adoption = +e.target.value;
    const v = $('#sim-adopt-v'); if (v) v.textContent = (SIM.adoption > 0 ? '+' : '') + SIM.adoption + '%';
  }
});
document.addEventListener('change', e => { if (e.target.id === 'sim-adopt') renderContent(); });

document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeModal(); hideHover(); } });

/* hover widget delegation — pointer devices only */
if (window.matchMedia('(hover:hover) and (pointer:fine)').matches){
  document.addEventListener('mouseover', e => {
    const t = e.target.closest('[data-hover]');
    if (t === hoverTarget) return;
    if (!t){ if (hoverTarget) hideHover(); return; }
    hoverTarget = t;
    const kind = t.dataset.hover;
    if (kind === 'kpi') showHover(t, hoverForKpi(t.dataset.key));
    else if (kind === 'agent'){ const a = AGENTS.find(x => x.id === t.dataset.id); if (a) showHover(t, hoverForAgent(a)); }
    else if (kind === 'dept'){ const d = DEPTS.find(x => x.key === t.dataset.key); if (d) showHover(t, hoverForDept(d)); }
  });
  document.addEventListener('mouseout', e => {
    const t = e.target.closest('[data-hover]');
    if (!t || t !== hoverTarget) return;
    if (e.relatedTarget && t.contains(e.relatedTarget)) return;
    hideHover();
  });
}
window.addEventListener('scroll', hideHover, { capture:true, passive:true });

setInterval(() => { const c = document.getElementById('clock'); if (c) c.textContent = new Date().toLocaleTimeString(); }, 5000);

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderAll);
else renderAll();
</script>
